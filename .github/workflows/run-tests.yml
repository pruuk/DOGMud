name: Run Tests

on:
  pull_request:
    branches:
      - master
      - '**'

permissions:
  contents: read
  pull-requests: read

# Delegates to the shared validation contract so pull requests, master pushes
# and tag builds all run the identical gates (review finding 10). Add checks in
# validate.yml, not here.
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
