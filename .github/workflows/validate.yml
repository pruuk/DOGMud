name: Validate

# The single validation contract, called by every trigger that ships code.
#
# Before this existed, pull requests ran lint plus a coverage gate while pushes
# to master and tag builds ran neither, so a direct push or a release got
# strictly weaker validation than a PR did (review finding 10). Both callers now
# invoke this one workflow, so the gates cannot drift apart again: adding a
# check here adds it everywhere.
#
# Callers:
#   run-tests.yml        pull_request
#   build-and-release.yml  push to master, and v* tags
on:
  workflow_call:

# Every CALLER must grant at least these, or the run dies before any job starts
# with a startup_failure. A caller that declares a permissions block sets all
# unlisted scopes to `none`, and a reusable workflow cannot exceed its caller.
# Callers: run-tests.yml, build-and-release.yml.
permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Full history so the base revision below exists locally.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # golangci-lint-action keeps its own cache; this job must not save the
      # Go build cache the test job needs (see .github/actions/setup-go).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Only new issues fail the job: the pre-existing findings (97 as of
      # 2026-08-10) are grandfathered so this gates what a change introduces
      # without first clearing the backlog.
      #
      # The base is computed from git, not fetched from the API. The action's
      # own only-new-issues asks the GitHub API for the diff, and that API
      # refuses a diff of more than 300 files; the action then linted the whole
      # repo and failed on the grandfathered backlog (PR #863, 493 files).
      #   pull_request: the PR's base commit (the checkout is the merge commit).
      #   push:         the commit before the push; a tag or new branch has no
      #                 "before" (all zeros), so it uses the parent commit.
      - name: lint base revision
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "lint issues new since $base"
          echo "rev=$base" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --new-from-rev=${{ steps.base.outputs.rev }}

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # v7 to match every other action in this repo and to stay off the
      # deprecated Node 20 action runtime. node-version stays at 20 because
      # that is what `make js-lint` uses (node:20 image), so local and CI
      # parse the same JavaScript.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # A syntax gate, deliberately not a style gate. `make js-lint` runs
      # jshint, which currently reports 1637 findings, so wiring that in as a
      # blocking check would fail on day one for the same reason the Go lint
      # backlog is grandfathered. Syntax is the part that is both enforceable
      # today and the part that actually breaks the web client at runtime.
      # Clearing the jshint backlog belongs with the lint-backlog chunk.
      - name: Check JavaScript syntax
        shell: bash
        run: |
          failed=0
          while IFS= read -r f; do
            case "$f" in *.min.js) continue ;; esac
            if [ -f .jshintignore ] && grep -Fxq "$f" .jshintignore; then
              continue
            fi
            if ! node --check "$f"; then
              echo "::error file=$f::JavaScript syntax error"
              failed=1
            fi
          done < <(git ls-files '*.js')
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All non-vendored JavaScript parses."

      # Plain node, no test runner, each exits non-zero on failure.
      #   safe-dom  - the admin dashboards' HTML escaping (finding 17)
      #   hotinput  - the web client's keyboard focus rule (finding 18)
      - name: Run JavaScript tests
        shell: bash
        run: |
          failed=0
          for t in tools/jstest/*.test.js; do
            echo "--- $t"
            node "$t" || failed=1
          done
          exit "$failed"

      # Static checks on the web client (webclient-pure.html), same contract:
      # plain node, each file exits non-zero on failure.
      - name: Run web client tests
        shell: bash
        run: |
          failed=0
          for t in tools/webclient-tests/*.js; do
            echo "--- $t"
            node "$t" || failed=1
          done
          exit "$failed"

  test:
    runs-on: ubuntu-latest
    steps:
      # Required before any `uses: ./...` step. The local composite actions
      # cannot be RESOLVED until the repo is on disk, and setup-go doing its
      # own checkout internally is too late to help.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/codegen-and-test
      - name: Check coverage gate
        shell: bash
        run: |
          if [ ! -f coverage.out ]; then
            echo "::error::No coverage.out produced; the coverage gate cannot be evaluated."
            exit 1
          fi
          # Only the summary line: a bare `grep total` also matched a function
          # named total (internal/combat/calculations.go, 100%), so the gate
          # printed "100.0" and compared two numbers (found 2026-11-11; the
          # real total was 64.5%).
          TOTAL=$(go tool cover -func=coverage.out | awk '$1 == "total:" {sub(/%/, "", $3); print $3}')
          if ! [[ "$TOTAL" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Could not read one total from go tool cover (got: '${TOTAL}')."
            exit 1
          fi
          echo "Total coverage: ${TOTAL}%"
          # Fail if coverage drops below 28%
          if (( $(echo "$TOTAL < 28.0" | bc -l) )); then
            echo "::error::Coverage ${TOTAL}% is below the 28% minimum threshold"
            exit 1
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14
