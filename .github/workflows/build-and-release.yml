name: Build and release

on:
  # Manually runnable so this path can be exercised without waiting for a merge
  # to master. Two changes in a row (the reusable-workflow split and its
  # permissions) could only be verified AFTER landing, because a push-triggered
  # workflow cannot be dry-run. The `release` job stays gated on a real version
  # tag, so a manual run on master builds and uploads an artifact and publishes
  # nothing.
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

# A reusable workflow may never request MORE permission than its caller grants,
# and declaring this block explicitly sets every scope NOT listed to `none`.
# validate.yml asks for `pull-requests: read` (golangci-lint's only-new-issues
# reads the PR diff from the API), so omitting it here meant `none` and the
# whole run refused to start with a startup_failure — no job, no log, just
# "this run likely failed because of a workflow file issue".
#
# Keep this in step with the permissions block in validate.yml.
permissions:
  contents: write
  pull-requests: read

env:
  RELEASE_FILENAME: go-mud-release
  # On a tag push this is the tag (e.g. v1.2.3). On a branch push it is the
  # branch name, which is why the `release` job below is gated to tags only —
  # otherwise action-gh-release created a tag literally named "master" on every
  # push to master.
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  # The same validation contract pull requests run. This job previously ran
  # only the shared codegen/test action, with no lint and no coverage gate, so
  # a direct push to master or a tagged release was validated more weakly than
  # any PR (review finding 10). Both callers now share validate.yml.
  validate:
    uses: ./.github/workflows/validate.yml

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Create bin directory
        run: mkdir -p bin/

      - name: Copy _datafiles to bin/
        run: cp -r _datafiles bin/

      - name: Build windows amd64
        run: env GOOS=windows GOARCH=amd64 go build -v -ldflags "-X main.version=${{ env.RELEASE_VERSION }}" -o bin/go-mud-windows_x64.exe .

      - name: Build darwin/arm64
        run: env GOOS=darwin GOARCH=arm64 go build -v -ldflags "-X main.version=${{ env.RELEASE_VERSION }}" -o bin/go-mud-darwin_arm64 .

      - name: Build darwin/amd64
        run: env GOOS=darwin GOARCH=amd64 go build -v -ldflags "-X main.version=${{ env.RELEASE_VERSION }}" -o bin/go-mud-darwin_x64 .

      - name: Build linux/amd64
        run: env GOOS=linux GOARCH=amd64 go build -v -ldflags "-X main.version=${{ env.RELEASE_VERSION }}" -o bin/go-mud-linux_x64 .

      - name: Build linux/arm5
        run: env GOOS=linux GOARCH=arm GOARM=5 go build -v -ldflags "-X main.version=${{ env.RELEASE_VERSION }}" -o bin/go-mud-linux_arm5 .

      - name: Upload bin
        uses: actions/upload-artifact@v7
        with:
          name: bin-artifact
          path: bin/

  release:
    runs-on: ubuntu-latest
    needs: build
    # Only publish a GitHub Release for real version tags. Without this gate a
    # push to master ran this job with tag_name: master, creating (and
    # repeatedly re-seeding) a stray refs/tags/master on the remote.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          name: bin-artifact
          path: bin/

      - name: Set short git commit SHA
        id: vars
        run: |
          echo "COMMIT_SHORT_SHA=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV

      - name: Archive release
        run: zip -r bin/${{ env.RELEASE_FILENAME }}-${{ env.RELEASE_VERSION }}.zip bin/

      - name: Release with notes
        uses: softprops/action-gh-release@v3
        with:
          files: bin/${{ env.RELEASE_FILENAME }}-${{ env.RELEASE_VERSION }}.zip
          tag_name: ${{ env.RELEASE_VERSION }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
