name: "Codegen and Test"
description: "Run go generate, the gofmt/vet gates, and go test"
runs:
  using: "composite"
  steps:
    - run: go generate ./...
      shell: bash

    # Generated artifacts must already be committed. `go generate` ran above
    # but nothing checked whether it CHANGED anything, so a stale committed
    # generator output would pass CI and only diverge for whoever regenerated
    # next (review finding 25).
    - name: Check generated files are committed
      shell: bash
      run: |
        if ! git diff --exit-code; then
          echo "::error::go generate produced changes. Run 'go generate ./...' and commit the result."
          exit 1
        fi
        echo "Generated files are up to date."

    # The format and vet gates run before the test suite on purpose: they fail
    # in seconds, while `go test -race ./...` takes minutes. Both were
    # previously Makefile-only (`make validate`) and no workflow invoked them,
    # which is how 234 files drifted out of gofmt compliance unnoticed.
    #
    # gofmt -l (report) rather than go fmt (rewrite): CI must not mutate the
    # tree and then pass.
    - name: Check gofmt
      shell: bash
      run: |
        unformatted=$(git ls-files '*.go' | grep -v '^vendor/' | xargs -r gofmt -l)
        if [ -n "$unformatted" ]; then
          echo "::error::These files are not gofmt-clean. Fix with: gofmt -w <file>"
          echo "$unformatted"
          exit 1
        fi
        echo "All tracked Go files are gofmt-clean."

    - name: Run go vet
      shell: bash
      run: go vet ./...

    # Loads every YAML data file through the real boot path (the same
    # loadAllDataFiles main() calls), so malformed content fails CI instead of
    # only surfacing when someone remembers to boot the server before pushing —
    # the manual step in CLAUDE.md's Pre-Push SOP.
    #
    # Its own step, opt-in via env var, and without -race: it takes ~20s and
    # materially longer under the race detector, which buys nothing here since
    # loading is single-threaded. The main suite below skips it automatically
    # because the env var is unset there.
    - name: Data-file boot smoke test
      shell: bash
      env:
        DOGMUD_BOOT_SMOKE: "1"
      run: go test -run "TestSmoke_ServerBootsCleanWithRealData|TestSmoke_AllDialogueFilesParse|TestSmoke_ShippedDialoguePassesTheEditorValidator|TestSmoke_NoNewSilentlyIgnoredYAMLKeys" -timeout 300s .

    # #536: the two melee statistical sweeps were about 330s of internal/combat's
    # 390 to 405s under -race (local Docker, 2026-10-17), and runner variance took
    # the package to the 900s timeout in CI. They are single-goroutine, so the
    # race detector has nothing to find in them; a -race build skips them
    # (skipStatSweepUnderRace in internal/combat) and they run here instead,
    # about 26s without -race. A sweep that calls that helper must be named in
    # this pattern, or it runs nowhere in CI.
    - name: Statistical sweeps
      shell: bash
      run: go test -run "^(TestMeleeParityDamagePerSwing|TestMeleePredictionMatchesCombat)$" -timeout 300s ./internal/combat/

    # -timeout is PER TEST BINARY, not for the whole run. internal/combat sits
    # at roughly 250 to 360 seconds under -race depending on runner speed, so a
    # 300s cap put it on a coin flip: it timed out at 300.07s, 300.109s and
    # 300.111s on 2026-09-20 alone, once on master with no PR involved, while
    # passing other runs the same day. A timeout exists to catch a HANG, not to
    # enforce a speed budget, and 900s still catches one.
    #
    # The real fix is to make internal/combat cheaper or split it; this only
    # stops a green suite reporting red. If a package ever approaches 900s,
    # split it rather than raising this again. (#536 did that for combat: see
    # the "Statistical sweeps" step above.)
    - run: go test -timeout 900s -race -coverprofile=coverage.out ./...
      shell: bash
