# TestConvert_PatternClasses: one pattern of each class in a tree file.
mobid: 7005
zone: Fixture Zone
defaultMood: neutral
patterns:
  - keywords: [""]
    responses:
      - "Anything else?"
  - keywords: ["hello", "hi"]
    responses:
      - "Hello."
  - keywords: ["Missing", "person"]
    responses:
      - "Covered by the tree."
