# TestConvert_NodeKinds: one node per kind.
mobid: 7001
zone: Fixture Zone
defaultMood: neutral
greetings:
  - text: "The farmer looks up from the furrow."
    moods: ["neutral"]

patterns:
  - keywords: [""]
    responses:
      - "Hm?"

tree:
  root:
    text: "Field's fallow. Has been all year."
  nodes:
    - id: Field-Help
      triggers: ["help"]
      questExcluded: ["7-start", "7-end"]
      grantsQuest: "7-start"
      text: "Find out what is killing the field."
      hints: "Look at the soil."
      moodChange: friendly
    - id: pelts_done
      triggers: ["pelts"]
      questRequired: ["7-start"]
      questExcluded: ["7-pelts"]
      questFlagRequired: {"7-path": "hunter"}
      requiresItem: 24
      givesItem: 25
      setsQuestFlag: {key: "7-path", value: "done"}
      bumpsRep: [{faction: farmers, delta: 3}]
      givesGold: 12
      grantsQuest: "7-pelts"
      text: "Good pelts. That helps."
    - id: field_done
      triggers: ["done"]
      questRequired: ["7-pelts"]
      questExcluded: ["7-end"]
      itemExcluded: 99
      masterworkRequired: 40
      grantsQuest: "7-end"
      text: "The field will grow again."
    - id: weather
      triggers: ["weather"]
      text: "Dry. Too dry."
      hints: "Ask about the well."
memory:
  expiryPeriod: ""
