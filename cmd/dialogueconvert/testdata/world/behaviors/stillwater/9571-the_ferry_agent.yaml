# TestConvert_BehaviorAskBranches: a speech-only branch and a ferry branch,
# on a mob with no dialogue file.
tree:
  type: selector
  children:
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [passage, board, plymouth]
        - type: action
          do: board_ferry
          routes:
            plymouth: stillwater_np_packet
            confluence: stillwater_confluence_barge
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [hello, ferry]
        - type: action
          do: say
          text: I book passage on the water.
        - type: action
          do: send_user_text
          text: '<ansi fg="181">  [Try: ask agent passage plymouth]</ansi>'
    - type: sequence
      event: player_enter
      children:
        - type: action
          do: set_state
          key: ferry_agent_player_enter_suppressed
          value: "true"
