# TestConvert_InstanceZoneBranches: a disc-gated instance portal and the
# no-disc fallback below it.
tree:
  type: selector
  children:
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: player_has_item
          item_id: 40168
        - type: action
          do: open_instance_portal
          min_gold: 200
          exit_expires: "30 real minutes"
          zones:
            crash: "Crash Site Interior"
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [crash, open, enter]
        - type: action
          do: say
          text: Not without the key.
