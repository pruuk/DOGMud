{{- define "header" -}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to {{ .CONFIG.Server.MudName }}</title>
  <style>
    :root {
      /* Warm-dark cartographer background (CSS gradient; no image asset) */
      --background-image: radial-gradient(circle at 50% 22%, #251a12, #110b07);
    }
  </style>
  <!-- Favicons: Malia's Moons of Gaius on the panel brown #201913 (2026-11-02).
       Images carry no ?v= tag: ASSET_VERSION hashes only CSS and JS, so a
       changed image gets a new file name instead (brand standards §7). -->
  <link rel="icon" href="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/images/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/images/favicon.png">
  <link rel="apple-touch-icon" href="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/images/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/theme.js?v={{ .ASSET_VERSION }}"></script>
  <link rel="stylesheet" href="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/css/gomud.css?v={{ .ASSET_VERSION }}">
  <script type="text/javascript">
    window.addEventListener("load", function(){
      const link = document.getElementById('hide-header-footer');
      // Only the Web Client page has the full screen link.
      if (!link) return;

      link.addEventListener('click', function(event) {
        // Stay on the page: following the link would drop the game connection.
        event.preventDefault();
        window.WebclientFrame.setFullScreen(true);
      });
    });
  </script>
</head>
<body>
  <!-- Site header: wordmark + menu in one borderless glass bar. -->
  <header>
    <!-- Malia's D.O.G. mark (2026-11-02). The alt text stands in if the image fails. -->
    <a class="brand-logo" href="/"><img src="/static/images/branding/logo_dog.png" width="677" height="229" alt="{{ .CONFIG.Server.MudName }}, home"></a>
    <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav" onclick="toggleMenu()">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
    <nav aria-label="Site">
      <div class="nav-container nav-text" id="site-nav">
        {{ $reqPath := .REQUEST.URL.Path }}
        {{ range $idx, $navDetails := .NAV }}
          <a href="{{ $navDetails.Target }}" {{ if eq $reqPath $navDetails.Target }}class="selected" aria-current="page"{{end}}>{{ $navDetails.Name }}</a>
        {{ end }}
        {{ if eq .REQUEST.RequestURI "/webclient" }}<a id="hide-header-footer" href="/webclient-pure" title="Full screen game" aria-label="Full screen game">⛶</a>{{ end }}
      </div>
    </nav>
  </header>

  <div id="content-container" class="content-container" data-path="{{ html .PATH }}">
{{end}}
