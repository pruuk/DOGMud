{{template "header" .}}

<script src="{{ .CONFIG.FilePaths.WebCDNLocation }}/static/js/viewportfit.js?v={{ .ASSET_VERSION }}"></script>
<script type="text/javascript">

    function resizeClientIFrame() {
        const contentContainer = document.getElementById('content-container');
        contentContainer.style.padding = "0px";

        wcIframe = document.getElementById('webclient-frame');
        // For some reason safari acts weird if we don't reset this first.
        wcIframe.width = "0px";
        wcIframe.height = "0px";

        // The frame fills the page's width. The width is read again once the
        // height is set: only if the page then scrolls does a scroll bar take
        // its share. (Always taking a scroll bar's width off left a 15px
        // stripe of page colour beside the game, cream in Light mode.)
        wcIframe.width = contentContainer.clientWidth;
        fitFrameHeight();
        wcIframe.width = contentContainer.clientWidth;
    }

    // The on-screen keyboard shrinks only the visual viewport on iOS Safari and
    // current Chrome on Android, so 100dvh does not follow it. Fit the frame
    // above the keyboard, which puts the command box right on top of it.
    function fitFrameHeight() {
        const contentContainer = document.getElementById('content-container');
        const frame = document.getElementById('webclient-frame');
        const visible = ViewportFit.visibleHeight(window.visualViewport);
        frame.height = ViewportFit.frameHeight(
            contentContainer.clientHeight, visible, contentContainer.getBoundingClientRect().top);
        // The game takes its phone tab bar out of the keyboard's way (dashboard.css).
        if (frame.contentDocument) {
            frame.contentDocument.documentElement.classList.toggle('keyboard-open',
                ViewportFit.keyboardOpen(window.innerHeight, visible));
        }
    }

    // Full screen hides the site around the frame and leaves the frame alone,
    // so the game stays connected. The browser's own full screen, which hides
    // its address and status bars (Calabe 2026-11-07), is asked for by the
    // game frame itself, on the player's tap (webclient-pure.html): the frame
    // holds the whole game, and the tap happens there. This page keeps the
    // header, the remembered choice and the button's state. The session bar's
    // button and the header's link both come through here.
    window.WebclientFrame = (function () {
        const KEY = 'dogmud.fullscreen';
        const root = document.documentElement;
        let on = false;
        let listener = null;

        function readPref() {
            try { return window.localStorage.getItem(KEY); } catch (e) { return null; }
        }
        function writePref(value) {
            try { window.localStorage.setItem(KEY, value); } catch (e) {}
        }
        function browserCan() {
            return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) &&
                !!(root.requestFullscreen || root.webkitRequestFullscreen);
        }
        // The frame in full screen counts: this page then reports the frame
        // as its full screen element.
        function browserOn() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }
        function browserExit() {
            try {
                const p = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                if (p && p.catch) p.catch(function () {});
            } catch (e) {}
        }
        function shown() {
            return ViewportFit.fullScreenShown(on, browserCan(), browserOn());
        }
        function apply(next) {
            on = next;
            const display = on ? 'none' : '';
            ['header', 'footer'].forEach(function (tag) {
                const el = document.getElementsByTagName(tag)[0];
                if (el) el.style.display = display;
            });
            resizeClientIFrame();
            if (listener) listener(shown());
        }
        function setFullScreen(next) {
            writePref(next ? '1' : '0');
            if (!next && browserOn()) browserExit();
            apply(next);
        }
        // Leaving with the back gesture or Esc: the button reads "Full screen"
        // again; the header stays as it was.
        ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (name) {
            document.addEventListener(name, function () { if (listener) listener(shown()); });
        });
        return {
            start: function () {
                apply(ViewportFit.wantFullScreen(readPref(),
                    ViewportFit.isPhone(window.screen.width, window.screen.height)));
            },
            setFullScreen: setFullScreen,
            isFullScreen: shown,
            // Asked by the frame on an Enter Game tap: should this tap also
            // go full screen?
            wantsFullScreenOnConnect: function () {
                return ViewportFit.enterFullScreenOnConnect(
                    ViewportFit.isPhone(window.screen.width, window.screen.height),
                    readPref(), browserCan(), browserOn());
            },
            onChange: function (fn) { listener = fn; fn(shown()); }
        };
    })();

    // Size the frame as soon as this page's layout exists; "load" alone waits
    // for everything inside the frame, which showed it at the browser's default
    // 300x150 until then.
    document.addEventListener("DOMContentLoaded", function () { WebclientFrame.start(); });
    window.addEventListener("load", resizeClientIFrame);
    window.addEventListener('resize', resizeClientIFrame);
    // Phones: the visible area changes when the address bar hides or the
    // on-screen keyboard opens. iOS also scrolls the page to show the focused
    // box; the frame already fits, so hold the page at the top. Only the height
    // changes here: resetting the frame to nothing while the command box has
    // focus could close the keyboard. A zoomed-in player is left to pan freely.
    function holdPageAtTop() {
        if (window.visualViewport.scale <= 1.01) window.scrollTo(0, 0);
    }
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
            holdPageAtTop();
            fitFrameHeight();
        });
        window.visualViewport.addEventListener('scroll', holdPageAtTop);
    }
    window.addEventListener('beforeunload', function(event) {
        event.preventDefault();
        event.returnValue = 'Leave/Disconnect from the MUD?';
    });
</script>
<!-- title: the name screen readers announce for the game frame (#730). -->
<iframe id="webclient-frame" title="{{ .CONFIG.Server.MudName }} game" border="0" src="/webclient-pure.html" allow="fullscreen" allowfullscreen></iframe>
{{template "footer" .}}
