# UPSTREAM GoMud HOLDOVER. NOT LOADED BY DOGMud.
#
# The live combat-message store is _datafiles/world/dogmud/combat-messages.
# This tree is upstream content kept for merge tracking only: main.go passes
# it to util.ValidateWorldFiles, which compares top-level DIRECTORY NAMES and
# never opens a file.
#
# It could not load if it were pointed at. These files put a flat list under
# each role, while the schema expects beginner/expert/master tiers, and none
# of them defines the `fumble` intensity that Validate() requires. The wider
# tree is missing 30+ subsystems the engine loads unconditionally, so a boot
# against it would die long before it reached this directory.
#
# Do not edit these to match dogmud. See
# docs/superpowers/specs/completed/2026-09-16-messaging-m3-item8-combat-messages-design.md
# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: claws
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You flex your <ansi fg="item">{itemname}</ansi> menacingly at <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You let out a low growl, preparing to pounce on <ansi fg="{acteetype}">{actee}</ansi>.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> flexes their <ansi fg="item">{itemname}</ansi> menacingly at you.'
      - '<ansi fg="{actortype}">{actor}</ansi> lets out a low growl, preparing to pounce on you.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> flexes their <ansi fg="item">{itemname}</ansi>, readying to strike <ansi fg="{acteetype}">{actee}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> lets out a low growl, preparing to pounce on <ansi fg="{acteetype}">{actee}</ansi>.'
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at <ansi fg="{acteetype}">{actee}</ansi>.'
      - 'You circle around <ansi fg="{acteetype}">{actee}</ansi>, claws at the ready.'
      - 'You watch <ansi fg="{acteetype}">{actee}</ansi> intently, waiting for the perfect moment to strike.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> circles dangerously.'
      - '<ansi fg="{actortype}">{actor}</ansi> circles around you, claws at the ready.'
      - '<ansi fg="{actortype}">{actor}</ansi> watches you intently, ready to pounce.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with cruel intentions.'
      - '<ansi fg="{actortype}">{actor}</ansi> prowls around <ansi fg="{acteetype}">{actee}</ansi>, claws poised to strike.'
      - '<ansi fg="{actortype}">{actor}</ansi> watches <ansi fg="{acteetype}">{actee}</ansi> intently, ready to pounce.'
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You swipe at <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>, but miss!'
      - 'Your claws slash through the air as <ansi fg="{acteetype}">{actee}</ansi> dodges your attack!'
      - 'You lunge at <ansi fg="{acteetype}">{actee}</ansi>, but fail to make contact!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> swipes at you with their <ansi fg="item">{itemname}</ansi> but misses.'
      - '<ansi fg="{actortype}">{actor}</ansi>''s claws slash through the air as you dodge their attack!'
      - '<ansi fg="{actortype}">{actor}</ansi> lunges at you, but fails to make contact!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> swipes at <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>, but misses.'
      - '<ansi fg="{actortype}">{actor}</ansi>''s claws slash through the air as <ansi fg="{acteetype}">{actee}</ansi> dodges the attack!'
      - '<ansi fg="{actortype}">{actor}</ansi> lunges at <ansi fg="{acteetype}">{actee}</ansi>, but fails to make contact!'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You graze <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You scratch <ansi fg="{acteetype}">{actee}</ansi> lightly with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your claws barely nick <ansi fg="{acteetype}">{actee}</ansi>, dealing minor damage of <ansi fg="damage">{damage}</ansi>.'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> grazes you with their <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> scratches you lightly with their <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You feel a slight scratch as <ansi fg="{actortype}">{actor}</ansi>''s claws barely nick you for <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> grazes <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi> scratches <ansi fg="{acteetype}">{actee}</ansi> lightly with their <ansi fg="item">{itemname}</ansi>.'
      - '<ansi fg="{actortype}">{actor}</ansi>''s claws barely nick <ansi fg="{acteetype}">{actee}</ansi>, causing minor damage.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You rend <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You slash <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your claws tear into <ansi fg="{acteetype}">{actee}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> rends you with their <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> slashes you with their <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You feel sharp pain as <ansi fg="{actortype}">{actor}</ansi>''s claws tear into you for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> rends <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> slashes <ansi fg="{acteetype}">{actee}</ansi> with their claws!'
      - '<ansi fg="{actortype}">{actor}</ansi>''s claws tear into <ansi fg="{acteetype}">{actee}</ansi>!'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You sink your <ansi fg="item">{itemname}</ansi> into <ansi fg="{acteetype}">{actee}</ansi> causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a powerful slash to <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your claws sink deeply into <ansi fg="{acteetype}">{actee}</ansi>, dealing significant damage of <ansi fg="damage">{damage}</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> sinks their <ansi fg="item">{itemname}</ansi> into you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit hard as <ansi fg="{actortype}">{actor}</ansi> delivers a powerful slash for <ansi fg="damage">{damage} damage</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi>''s claws sink deeply into you, dealing significant damage of <ansi fg="damage">{damage}</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> sinks their <ansi fg="item">{itemname}</ansi> into <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a powerful slash to <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi>''s claws sink deeply into <ansi fg="{acteetype}">{actee}</ansi>!'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You <ansi fg="cyan-bold">CRITICALLY EVISCERATE</ansi> <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a <ansi fg="cyan-bold">CRITICAL REND</ansi> to <ansi fg="{acteetype}">{actee}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your claws <ansi fg="cyan-bold">DEVASTATE</ansi> <ansi fg="{acteetype}">{actee}</ansi>, dealing a massive <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '<ansi fg="{actortype}">{actor}</ansi> <ansi fg="cyan-bold">CRITICALLY EVISCERATES</ansi> you with their <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
