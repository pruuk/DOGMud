      - '<ansi fg="{actortype}">{actor}</ansi>''s claws <ansi fg="cyan-bold">DEVASTATE</ansi> you, dealing a massive <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '<ansi fg="{actortype}">{actor}</ansi> <ansi fg="cyan-bold">CRITICALLY EVISCERATES</ansi> <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL REND</ansi> to <ansi fg="{acteetype}">{actee}</ansi>!'
      - '<ansi fg="{actortype}">{actor}</ansi>''s claws <ansi fg="cyan-bold">DEVASTATE</ansi> <ansi fg="{acteetype}">{actee}</ansi>!'
