zone: Thornwall City
title: Craftsmen's Quarter, East
description: The eastern end of the Craftsmen's Quarter is dominated by a
  blacksmith's forge, the largest workshop on the street, its double doors built
  wide to vent the heat. The forge is never let go fully cold. Even banked, its
  coals show a deep red through the doorway, and the anvil before it is worn bright
  from years of hammering. This is where the city's tools, hardware, and weapons
  are made and repaired. The smithy also serves as an informal gathering
  place for the quarter's workers, who stop by to warm their hands and exchange news.
