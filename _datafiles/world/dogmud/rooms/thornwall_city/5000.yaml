roomid: 5000
zone: Thornwall City
title: The Rift Chamber
description: >-
  A circular chamber beneath the Temple District, its walls lined
  with dark stone etched in geometric patterns that pulse with faint
  light. A massive stone archway dominates the far wall, its surface
  carved with runes that shift and rearrange when observed too
  closely. The air smells of ozone and something older: the dry,
  electric scent of places that should not be connected touching.
  The riftkeeper Sable tends the archway with practiced care.
biome: dungeon
