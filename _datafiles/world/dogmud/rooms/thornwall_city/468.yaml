nouns:
  altar: A plain stone altar, unadorned except for a brass incense bowl and a pair
    of candlesticks. The altar has been scrubbed so many times that the stone has
    a faintly soapy texture. It is a place of function, not ostentation.
  pillars: Stone pillars carved with figures in flowing robes, such as priests, scholars,
    workers, farmers. The carvings represent the community the temple serves. Many
    of the faces have been rubbed smooth by generations of parishioners touching
    them for luck.
  candles: Iron candle stands line the walls, each holding a thick tallow candle.
    The wax has dripped and pooled at the bases, building up in layered formations.
    The light they give is steady and warm.
  portal: A ring of dark basalt stands on the slate beside the door, as tall
    as a person and smooth as river stone. The air inside it shimmers silver
    and hums faintly. It is made of the same stone as the old arch in the
    Pothole Coulee, and it leads back to that arch, where Warden Esk keeps
    watch. Type <ansi fg="command">enter portal</ansi> to go through.
  ring: A ring of dark basalt stands on the slate beside the door, as tall
    as a person and smooth as river stone. The air inside it shimmers silver
    and hums faintly. It is a portal back to the Pothole Coulee. Type
    <ansi fg="command">enter portal</ansi> to go through.
