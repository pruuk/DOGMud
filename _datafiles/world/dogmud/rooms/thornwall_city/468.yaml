roomid: 468
zone: Thornwall City
title: Temple Interior
description: The interior of the temple is a single vaulted nave, its ceiling lost
  in shadows above. Stone pillars line the walls, carved with figures whose features
  have been softened by centuries of touching hands. The floor is paved with dark
  slate, worn to a mirror sheen in the aisles. Candles burn in iron stands along the
  walls, their light warm but insufficient to reach the upper darkness. At the far
  end, a simple stone altar holds a brass bowl that smokes gently with incense. The
  temple serves no single deity. It is a place for contemplation, community, and
  the management of tithes. Beside the door stands a ring of dark basalt, and
  the air inside it shimmers silver. It is a portal back to the Pothole Coulee.
  To the south, the temple doors open onto the Temple District, and past it
  lies Main Street, the heart of Thornwall.
