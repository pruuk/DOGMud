roomid: 6371
zone: Eastern Highlands
title: The Sentinel's Watch
description: >
  Past the sealed recess the made hollow opens into a chamber: the
  <ansi fg="itemname">vault</ansi>
  itself, deep and square and cold, its smooth grey walls going up past
  the reach of any light into a dark that holds its ceiling out of sight.
  The air is old here in a way that has nothing to do with dust. Nothing
  rots in this place. Nothing has been let in to rot. And the chamber is
  not made to stand empty. The far wall is cut into a vast upright berth,
  the exact shape of the
  <ansi fg="itemname">watcher</ansi>
  this place was built around, and it faces the door of the vault by which
  you came. Something is being kept here, back in the deeper black behind
  it, gathered and hoarded and guarded close. Every part of you understands,
  without a word, that you are standing exactly where that watch is aimed.
biome: cliffs
coord: {x: 15, y: 53, z: 3}
exits:
  west:
    roomid: 6369
nouns:
  vault: >
    Square, deep, and jointless, cut into the heart of the buried thing
    and sealed against the world. The walls give back no sound and no
    warmth. Whatever this chamber was made to hold, it was made to hold it
    forever, and the making has not failed. The cold in it is the even,
    sourceless cold of everything the grey thing owns, and under the cold
    is the plain fact that this place has a purpose and you are not it.
  watcher: >
    The berth is vast and upright, cut to fit a thing that was made to stand
    here and wait. Nothing about it was meant to be left. It has the patience
    of a mountain and none of a mountain's innocence, and the longer you look
    the surer you are that what this place keeps watch with can be made again.
  eye: >
    High in the cut of the berth the wall leaves room for one round eye,
    turned toward the way you came in. The aim of it is exact, and standing
    in its line you feel seen, whether or not anything is looking.
idlemessages:
- The great berth faces the doorway, and nothing in this vault has ever asked
  it to face anywhere else.
- The air does not stir. Nothing here has ever needed it to.
- Somewhere in the black behind the wall, the thing it guards sits cold
  and close and undisturbed, and the guarding has not once lapsed.
- The cold in the vault presses even and old against the skin, and in it
  the certainty settles that you are being permitted, for now, to stand
  here.
