roomid: 6365
zone: Eastern Highlands
title: The Cleared Section
description: >
  Someone cleared this by hand. A whole span of the buried face
  stands uncovered here where the earth was carried off it, load by
  load, until the grey ran bare. It was not done in a day, and
  it was not done by many. It was done by one. The
  <ansi fg="itemname">cleared face</ansi>
  rises smooth and jointless above a floor packed hard by a single
  person's going and coming, and along the sheltered bank stands what
  is left of a
  <ansi fg="itemname">camp</ansi>:
  a lean-to gone grey and slack, a cold ring of stones, a few
  things set down and never taken up again. The
  <ansi fg="itemname">tools</ansi>
  are still where the hands left them, a mattock leaned just so, a
  worn spade, the small orderly habits of a person who meant to come
  back to the work tomorrow and the day after that. Whoever cleared
  this earth, alone, out at the far end of the world with only the
  made thing for company, did not go anywhere. The <ansi fg="itemname">lean-to</ansi>
  has come down over something long and low, and it has not been moved
  in a very long time.
