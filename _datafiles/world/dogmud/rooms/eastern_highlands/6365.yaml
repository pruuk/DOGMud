nouns:
  lean-to: >
    The poles have come down across the bedding, and the rotted cloth has
    settled over what lies under it like a second coat. It would take only
    a careful search to see.
  remains: >
    What is left of him lies under the fallen poles, on his side, facing the
    grey. Nobody has moved him. A careful search would show the rest.
  satchel: >
    A strap shows through the rotted cloth, where a man would keep a satchel
    against his ribs. It would take a careful search to get at it.
  hearthstone: >
    A flat stone carried a very long way to this place, by the look of it,
    and cut with a ring and a line, then cut again, and cut again. The chisel
    lies beside it. The work is nearly done.
  cleared face: >
    Where the earth was carried away the grey stands bare, a broad
    span of it, smooth and jointless and unbothered as all the rest.
    The clearing of it was enormous labor. You can read that at a
    glance, the sheer weight of soil that had to be lifted and moved
    to lay this much of it open, and it was done a handful at a time
    by one back, one pair of hands, for however long one person could
    make themselves keep at it out here alone. The face gives back
    nothing for the work. It never did. Someone did the work anyway.
  camp: >
    A lean-to of poles and rotted cloth sags against the sheltered
    bank, gone grey, half-fallen. A ring of fire-stones sits cold at
    its mouth, the ash long since blown to nothing. A few small
    things are set about with a care that outlived their owner: a
    tin cup, a bundle that was bedding once. On one of the lean-to
    poles, low down, where a hand at rest by the fire could reach it,
    a name has been cut into the wood with a knife, careful and deep
    and often gone over (MAREN) as though the cutting of it were a
    thing to do in the evenings, alone, to keep a person in mind.
  tools: >
    The tools are the worst of it, because they are so orderly. A
    mattock leaned against the bank at the exact angle a working hand
    leaves it. A spade with its edge still bright under the weather
    where it was kept honed. A coil of rope, a wooden maul, all set
    down in the small deliberate arrangement of someone who worked
    every day and expected to work again, and then one day did not,
    and never came to put them away.
idlemessages:
- Wind moves the slack grey cloth of the lean-to a little and lets it
  fall. Nothing else here moves at all.
- The tools stand ready at the angle a working hand left them, waiting
  for a hand that will not take them up again.
- One person cleared all this earth, alone, and lived in this small
  worn round of ground, and never left it, and only the ground remembers.
- The cold ring of the dead fire holds no ash anymore. The wind took
  it a long time ago, the way it takes everything given time.
- The bare grey of the cleared face keeps its silence over the fallen
  camp, patient as it has always been, and gives nothing back.
