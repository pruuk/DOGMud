roomid: 6190
zone: The Confluence
title: The Scriptorium
description: >
  A long bright room off the north end of the walk, its
  windows set high to catch the northern light without direct
  glare. Copying desks run in parallel rows, each fitted
  with an angled surface and an ink-stand. A scribe works
  here amid the soft sounds of quill and turned page,
  producing the copies and fair records the Keepers
  require: liturgical texts, river-accounts, the slow
  business of institutional memory. Under the last desk in the row lies
  a torn leaf, dropped or hidden, that no scribe has come back for. The
  North Walk is
  back to the south.
