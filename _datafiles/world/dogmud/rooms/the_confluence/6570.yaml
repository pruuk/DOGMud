zone: The Confluence
title: Quill Court
description: >
  Quill Court is hardly a court at all: a flagged pocket off the west end of
  Hall Lane, shut in by the blind flank of the Municipal Hall on one side and
  the backs of the scholars' quarter on the other, with a strip of sky
  overhead and a stone gutter down the middle that carries the rain away
  toward the rivers. At its end a tall, narrow house leans on its neighbours,
  four storeys of dark river-brick and small leaded windows, a candle behind
  most of them long into the night. Its
  <ansi fg="itemname">door</ansi> is painted the blue of deep water under
  cloud, with a <ansi fg="itemname">brass plate</ansi> set where a keyhole
  ought to be. A varnished <ansi fg="itemname">notice board</ansi> is fixed
  beside it, and a hooded <ansi fg="itemname">lamp</ansi> hangs over both
  from an iron arm, kept trimmed by the house so that nobody can say they
  could not read its terms.
