roomid: 5815
zone: New Plymouth Merchant
title: The Gilt Threshold, Private Parlor
description: >
  The private parlor is at the end of the east passage,
  behind a heavy
  <ansi fg="itemname">velvet curtain</ansi>
  on a brass rod, the kind of curtain that stops sound
  as much as light, thick enough that someone standing
  in the corridor hears nothing, or catches a phrase,
  depending on how close they stand and how still they
  hold themselves. The room inside is furnished for
  meetings rather than comfort. It holds a round table
  of polished walnut, four chairs, a lamp on a stand,
  and nothing that does not serve a purpose. At this moment
  the chairs have been pushed back from the table and
  the surface wiped around a
  <ansi fg="itemname">ledger board</ansi>
  left at one edge, but the
  <ansi fg="itemname">cup rings</ansi>
  left by two vessels have not quite been removed. The
  cloth was in a hurry, or the person using it did not
  care. On the floor near the west-facing chair, almost
  against the baseboard, a small
  <ansi fg="itemname">paper scrap</ansi>
  has been missed in whatever tidying was done before
  you arrived. The room smells faintly of a particular
  pipe-tobacco that is expensive and not common. The curtain
  behind you still moves.
