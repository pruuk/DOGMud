roomid: 5289
zone: Pothole Coulee
title: Thornbrake
description: >
  A dense thornbrake fills the hollow, stems woven into a wall that
  neither wind nor larger animals push through cleanly. Small game
  has made a world of it: runs pressed low through the base of the
  thorns, pellets, tufts of fur snagged on barbs. The thorns catch
  at sleeves and skin as you press through, drawing thin lines of red.
  The hunters from the hollow below keep a shuttered lantern hung on a
  stake at the mouth of the main run, and it burns through every night.
biome: land
# 2026-10-17 newbie quest audit (B2): quests 42 and 56 attack a pronghorn here,
# and attacking a mob that is not hostile needs full sight. The hunters'
# lantern (see the description) lights the brake to full sight for a normal
# observer at every hour. TestNewbieQuestTargetRoomsGiveFullSightAtEveryHour.
