  lantern: A tin lantern with a shuttered face, hung from a stake driven
    deep into the ground where the main run enters the thorns. Its flame
    burns low and steady, and the hunters keep it filled with oil.
  game: Signs of small animals everywhere, runs, pellets, tufts of
    fur, the pressed-flat shapes of resting bodies.
