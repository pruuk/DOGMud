nouns:
  notice board:
    A broad notice board fills the wall beside the door, shingled deep
    with pinned notes, lesson-lists, and curling hand-bills. Pride of
    place goes to a single weathered card lettered in the schoolmaster's
    careful hand. It says that no question is too small or too strange.
    To learn how a thing is done, type help and the name of it, and the
    world will answer what it knows. To learn about a place or a story,
    find someone who keeps it and type talk and their name. Elder Wenna
    at the farmstead up the north shore, it adds, knows where the old
    stones stand. Below it, smaller and kindlier, a line for tired eyes.
    Should the written word ever sit crooked on the page, spilling past
    its edges or crowding itself too thin to read, type set linewidth
    and a number, and it will lay itself out clean and square again.
  desks:
    The desks are a mismatched flock, no two of a height, some squat
    benches for the small ones, some tall slope-lidded affairs scavenged
    from who knows where, all scarred and inked and mended at the joints.
    Lift a lid and you find the litter of school, stubs of chalk, a
    forgotten apple core, names cut deep into the wood by hands long since
    grown and gone. They sit in crooked rows facing the slates, waiting on
    the next bell.
  slates:
    A bank of slate boards lines the far wall in chalk-pale frames, the
    biggest set on an easel for the master and smaller hand-slates stacked
    beside it for the pupils. They are half-wiped and ghosted, the morning's
    letters and figures still faintly there under the smear of the cloth.
    A box of chalk nubs and a grey felt rag hang on a string within easy
    reach, ready for the next lesson to be written up.
idlemessages:
- A loose hand-bill lifts on a draft from the door and settles again on the notice board.
- Chalk dust drifts in a bar of light, and the empty desks tick faintly as the room warms.
