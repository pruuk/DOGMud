title: Market Row
description: >
  A short run of awnings and stall-fronts crowds the lane here, strung
  between the inn at the west end and the provisions store at the east.
  The awnings are patched canvas and salvaged sailcloth, slung from the
  eaves to keep the weather off the goods laid out beneath them, and they
  snap and belly whenever the coulee breeze comes down the bowl. This is
  the town's barter-artery, and the air holds what trade leaves behind:
  the smell of smoked fish and tallow and trodden dust, and on most
  days the haggle-murmur of folk talking prices and the clink of coin
  changing hands. Even between customers the stalls
  hold their wares out hopeful, waiting for the next pair of boots to
  slow. South the lane runs on toward a humming arch the town keeps at
  its threshold.
