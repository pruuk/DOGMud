roomid: 6881
zone: Pothole Coulee
title: The Hearth Nook
description: >
  The cave pinches and then opens into a smoky, warm chamber that somebody
  has turned into a kitchen with more love than sense. A fire pit ringed
  with flat stones holds a dented kettle and a blackened pot that is
  always, somehow, nearly ready. Strings of dried onions, peppers and
  bundled herbs hang from pegs driven into the rock, a scarred chopping
  block stands by the fire, and nailed above it all, like a trophy nobody
  is proud of, hangs a heavy leather fighter's belt. The Mouth lies east,
  a lamplit alcove opens to the south, the cave goes on west, and a crack
  in the floor by the woodpile leads down into the dark.
