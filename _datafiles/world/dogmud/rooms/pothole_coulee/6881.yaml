nouns:
  kettle: A copper kettle dented on three sides and polished on the fourth,
    hung over the fire on an iron hook. It is never quite empty and never
    quite boiling.
  pot: A wide iron pot, blackened outside and scrubbed bright within, with
    a long wooden spoon laid across its rim. Whatever is in it smells of
    onions, barley and something smoked.
  onions: Strings of dried onions, red peppers and bundled thyme and sage
    hang from pegs hammered into the rock, swaying a little in the heat
    from the fire.
  belt: A pit-fighter's championship belt of thick black leather and brass
    studs, hung on a nail above the fire. The brass plate in the middle has
    been turned to face the wall.
  block: A round chopping block cut from a single stump, its top scarred
    into a shallow bowl by years of knife-work and scrubbed clean.
idlemessages:
- The fire pops and sends a curl of woodsmoke drifting up into the dark.
- The pot gives a slow, contented blup.
