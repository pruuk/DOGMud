title: The Lamplit Alcove
description: >
  A quiet niche off the hearth, scrubbed cleaner than anywhere else in the
  cave. Two straw pallets lie along the wall with folded blankets at their
  feet, ready for anyone who comes in hurt or sick. Bundles of drying herbs
  hang from a cord strung between two pegs, a basin of clean water sits on
  a flat stone with a cloth folded beside it, and on a ledge cut into the
  rock a small chrysalis-shaped lamp burns before a worn ledger. The
  hearth is back north.
