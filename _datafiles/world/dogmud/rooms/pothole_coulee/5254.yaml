roomid: 5254
zone: Pothole Coulee
title: Mine Mouth
description: >
  The basalt-iron mine announces itself before you see it: the cold is
  absolute here, a wall of underground air rolling out of the adit and
  washing down the talus with the smell of wet clay, old blasting, and
  stone that has never warmed. The adit itself is a squared-off wound
  in the bluff face, cut wide enough for two abreast and tall enough
  to clear a laden pack -- a working mouth, not a prospect hole. Old
  shoring frames the entrance in a timber arch, the posts set in rock
  and spiked crosswise, dark with age and with the slow moisture that
  seeps through basalt from above. The wood has checked and greyed but
  it holds. Past the frame, grey daylight follows the tunnel floor a
  little way down and then gives out, and out of the dark beyond it the
  cold keeps coming, steady and unresting, the breath of the ground.
  The only way on is down. East runs
  back to the high shoulder of the talus; west, a rough trail crests
  the coulee rim and drops into open badland country.
