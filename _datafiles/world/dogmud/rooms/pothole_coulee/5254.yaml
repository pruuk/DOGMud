nouns:
  adit: The squared-off entrance to the mine, cut wide enough for two
    abreast and framed in old timber. It is a working mouth -- the
    proportions say extraction, not exploration. The cold air pours
    out of it without pause. Daylight reaches only the first stretch
    of tunnel; what lies past that is real mine work, weight-bearing
    stone and old workings, and no light at all.
  shoring: The timber arch framing the entrance, posts set deep in the
    bluff and crosspieces spiked through them, the whole frame dark
    with age and the seeping moisture from above. The wood has checked
    and greyed but has not given up its hold. Someone drove these
    timbers to last, and so far they have.
  dark: The blackness deeper in the adit, past the point where the
    daylight from the mouth thins out on the tunnel floor. Beyond it
    the eyes find nothing to work with. Only the cold comes out, steady
    enough to say the dark is not empty, only deep.
idlemessages:
- Cold air pushes steadily out of the <ansi fg="itemname">adit</ansi>, smelling of wet clay and old stone, and raises the fine hairs on your arms.
- Somewhere in the <ansi fg="itemname">dark</ansi> below, loose grit trickles down the tunnel, and the <ansi fg="itemname">shoring</ansi> timbers tick with some slow internal settling.
