roomid: 6885
zone: Pothole Coulee
title: The Squeeze
description: >
  Below the hearth, through a crack only a thin person would choose, lies a
  cramped hollow kept warm by the fire overhead. It is a nest more than a
  room: a heap of blankets of many different colours and owners, a row of
  small bright trinkets laid out on a shelf of rock as if for sale, and a
  stub of candle in a saucer. In the far wall a second, narrower crack
  leads off into the dark, and a loose stone low down sits not quite flush
  with the rest. The way out is back up.
biome: cave
lamp: 50
