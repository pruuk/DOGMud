    roomid: 6881
nouns:
  blankets: A great many blankets, no two alike, heaped into a nest. One
    still has a laundry tag from a New Plymouth boarding house sewn into
    the hem.
  trinkets: A row of small bright things laid out on a shelf of rock, a
    brass button, a cheap ring, a bone die, a tin soldier missing its gun,
    each set exactly a finger's width from the next.
  stone: A stone low in the wall that does not quite sit flush. Behind it
    is a dry hollow the size of a fist, and nothing in it at all, which
    its owner seems to find funny.
  crack: A narrow crack leading off into the dark. Whoever lives here swears
    it comes out somewhere useful. It is not wide enough for anyone else to
    find out.
  candle: A stub of tallow candle in a chipped saucer, burned down almost to
    nothing and very carefully not wasted.
idlemessages:
- Warmth seeps down through the rock from the fire above.
- Something small and metal ticks as it cools on the shelf.
