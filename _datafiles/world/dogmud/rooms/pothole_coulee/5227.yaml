roomid: 5227
zone: Pothole Coulee
title: The Drill Yard
description: >
  The wash opens out into a beaten yard of packed earth, swept flat by
  countless circling feet. A scarred practice post stands rooted at the
  center, its top splintered pale where fist and stick have struck it raw
  -- the steady knocking heard all the way down at the mouth. Beside it a
  straw-and-leather dummy hangs on a weighted pivot, slumped and patient,
  ready to swing back at whoever sets to it. The drillmaster's mark is on
  everything here -- the swept ground, the worn lines, the quiet that
  waits to be filled with work. The way climbs east and bends north.
biome: shore
