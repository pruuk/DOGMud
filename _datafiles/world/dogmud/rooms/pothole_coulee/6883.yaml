nouns:
  crack: A long crack in the cave roof, wide enough to show a strip of sky.
    Rain must come in through it; the rock beneath is worn smooth where it
    falls. Whoever sleeps on this ledge chose it for the sky.
  feathers: A clay jar of grey goose feathers, sorted by length and laid
    the same way, with a little knife and a spool of waxed thread beside it.
  stave: A straight length of ash, half-shaped, drying on two pegs driven
    into the rock. It is going to be a bow one day, when its owner can
    afford the time and the string.
  chart: A chart of the Windward Marches drawn by hand on soft leather, the
    roads marked in ink and the safe camps in charcoal. A stretch of the
    Stillwater road has been circled hard, more than once, and a knife
    pins it to the rock through that very spot.
  bedroll: A bedroll rolled tight and strapped, ready to be shouldered at a
    moment's notice.
idlemessages:
- A breath of cold air sighs down through the crack in the roof.
- The small fire ticks and settles in its ring of pebbles.
