title: The Fletcher's Ledge
description: >
  The cave narrows into a long rock shelf beneath a crack in the roof, and
  through it a ragged strip of sky shows, pale by day and pricked with
  stars by night. Someone has made the ledge tidy in the way of a person
  who lives out of a pack: a bedroll rolled tight, a jar of grey goose
  feathers sorted by length, a straight ash stave drying on two pegs, and
  a hand-drawn chart pinned to the rock with a knife. A fire no bigger than
  a pair of hands burns in a ring of pebbles. The hearth is back east, and
  a passage drops away south toward a smell of chalk and ink.
