roomid: 6880
zone: Pothole Coulee
title: The Waystone Mouth
description: >
  A broad cleft opens into the bluff here and widens into a dry, lamplit
  cave. Just inside stands a waystone taller than a man, its face scratched
  over with the initials, tallies and road-marks of everyone who ever
  waited here for company. A weathered board is nailed to its face. A
  battered round shield leans against it beside a whetstone and a
  three-legged stool set where whoever sits on it can see both the way in
  and the way deeper. The cave runs on west toward
  the smell of woodsmoke; daylight lies back east.
