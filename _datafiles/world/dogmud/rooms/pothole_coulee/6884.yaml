roomid: 6884
zone: Pothole Coulee
title: The Scribbled Gallery
description: >
  A low, dry gallery whose walls have been covered, floor to roof, in chalk.
  Star charts, sums, sketched creatures with arrows pointing to their
  joints, lists of questions with some crossed out and more written in
  their place. An upturned crate serves as a desk under a mountain of
  borrowed books, a ring of inkpots and a pair of cracked spectacles.
  A lamp hangs from a nail on a length of string so it can be moved to
  whichever wall is being argued with. The ledge lies back north.
