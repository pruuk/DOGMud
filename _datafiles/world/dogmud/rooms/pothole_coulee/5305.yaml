roomid: 5305
zone: Pothole Coulee
title: Star Chamber
description: >
  A round chamber, its walls curved smooth as the inside of a bowl, and
  in the center of the floor a practice mark has been scribed directly
  into the stone: a circle within a circle, runes pressed into the inner
  ring at the cardinal points. The mark was made to stand in, and the
  stone inside it has been worn to a different shade by those who did.
  The runes give off a soft, steady glow that never fades, so the whole
  chamber is lit at any hour of the day or night. Around the outer ring,
  the floor tells the history of the place in small damage: scorch
  shadows where something very hot passed close, a rind of frost still
  clinging in the northern quarter, a branching crack where
  lightning or something like it once skipped across the floor. A thousand
  practiced spells have left their signatures here.
biome: fort
