nouns:
  mark: The scribed circle is broad enough that you could stand in it
    with your arms spread wide. The stone inside the inner ring is lighter
    than the surrounding floor, worn by the pressure of feet, season
    after season, student after student standing here and reaching for
    something that isn't quite in the world.
  runes: The runes are pressed deep into the inner ring, one at each
    cardinal point. Each holds a soft, cold light of its own, steady as
    a lamp, and the light does not flicker or fade.
  chamber: The curved walls catch and return sound in a way that flat
    walls don't. Your own breath comes back to you half a beat after
    you take it. The chamber was built to hold focus, to let nothing
    scatter outward.
idlemessages:
- The air inside the <ansi fg="cyan">mark</ansi> is a degree cooler than the rest of the chamber.
- A faint crackle runs along the frost in the northern quarter and goes still again.
- The <ansi fg="cyan">chamber</ansi> holds a hush that feels less like absence and more like attention.
- Scorch and frost and the old branching of a lightning-crack. The floor is a record of work done here.
