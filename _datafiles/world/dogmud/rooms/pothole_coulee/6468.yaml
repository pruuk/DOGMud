roomid: 6468
zone: Pothole Coulee
title: Ancestral Cave
description: >
  A narrow opening breaks the cliff wall here, low enough and plain
  enough to walk straight past. Cool air moves steadily out of it,
  clean and washed. Carried on that air is something that has no
  business being in a cave at all -- the warm smell of a kitchen at the
  end of the day, and not any kitchen, but the one you grew up in. It
  comes from further in, where the passage narrows and turns out of the
  light.
biome: cave
exits:
