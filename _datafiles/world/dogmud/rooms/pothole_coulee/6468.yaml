nouns:
  opening: The gap in the rock is barely wider than your shoulders. Its
    edges are worn round and smooth rather than cut, the way stone goes
    when a great many people have squeezed past it over a great many
    years.
  smell: Fresh cave air, and underneath it, impossibly, cooking. Bread,
    or something close to bread. The longer you stand in it, the more
    certain you become that you have smelled it before.
idlemessages:
- The <ansi fg="itemname">smell</ansi> from deeper in strengthens for a moment, then thins.
- Cool air slides out of the <ansi fg="itemname">opening</ansi> and moves past you.
