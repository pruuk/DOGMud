roomid: 6260
zone: Newcomer Antechamber
title: What You Carry
description: >
  A shallow alcove worn into the grey, the kind of niche a traveler leaves
  something in for whoever comes next. A single smooth token rests in it, cool
  and pale, catching what little light there is. Dewey leans against nothing in
  particular nearby, watching with a small, easy grin.
biome: ether
exits:
  north:
    roomid: 6261
spawninfo:
  - mobid: 9491
items:
  - itemid: 2
nouns:
  token: >-
    A smooth grey disc, cool and featureless, no bigger than a coin. It has no
    obvious use, but it is light and easy to carry, and someone left it here
    for you to take.
  alcove: >-
    A shallow niche worn into the grey, the sort of place a traveler leaves
    something for whoever comes next. Others have stood exactly here, learning
    exactly this.
  dewey: >-
    'Everyone drops something and forgets it eventually,' Dewey says with a
    small grin. 'Better you learn where things go now, while it's only a token.'
idlemessages:
  - Motes of pale light drift through the alcove and wink out.
y: -2
plane: 6
