roomid: 6467
zone: Newcomer Antechamber
title: The Landing
description: >
  The grey thins to almost nothing here. Ahead, a pool of pale blue-green light
  hangs where the between-place wears through into the real world. It is close
  now, but this last step is not a walk. Dewey stands easy at the threshold,
  hands in pockets, ready to see you through.
biome: ether
exits: {}
spawninfo:
  - mobid: 9491
nouns:
  light: >-
    A pool of steady blue-green light hangs where the grey gives out. It is the
    same glow you glimpsed under the still water, but whole and near now. It is
    the Awakening Pool, and the world around it, waiting for you to arrive.
  threshold: >-
    Not so much a door as a thinning, a place where this grey between-world
    wears through into the real one. Dewey will carry you through it when you
    talk to him.
  dewey: >-
    Dewey stands easy at the threshold, hands in pockets. 'I stay here. There's
    always another one waking up. But you, you go on. You'll do fine.'
idlemessages:
  - The pool of light ahead pulses once, slow and warm, like a welcome.
y: -5
plane: 6
