roomid: 6045
zone: South Road
title: The Shepherd's Reach
description: >
  Bells reach you first — the flat, irregular clonk of sheep-bells drifting
  up from somewhere below the road, a dozen different notes never quite
  falling into time. The verge gives way on the western side to open
  pasture that rolls down and away, close-cropped and dotted with grazing
  flocks, and the air carries lanolin and warm dung and dry grass. The
  vantage here is the best of the descent so far: you can see the road
  thread on down toward the valley floor, and the gold haze of farmland
  spreading at the bottom. A <ansi fg="itemname">drystone fold</ansi> sits
  just off the road where the slope steepens, its gate a single hurdle of
  bound hazel, and a lone <ansi fg="itemname">whitethorn</ansi> leans over
  the verge, its trunk rubbed smooth by generations of itching sheep. Across
  the road to the east a sheep-<ansi fg="itemname">track</ansi> slips over
  the verge into a green combe, and out of the hollow rises the crown of an
  enormous <ansi fg="itemname">oak</ansi>, far broader than any tree has a
  right to be this high on the road.
