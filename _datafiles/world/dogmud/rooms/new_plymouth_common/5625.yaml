nouns:
  door: A heavy door of old oak, painted green and repainted, its
    hinges oiled so well they have never been heard. It has no keyhole
    and no handle on this side. Where a keyhole should be is a palm-sized
    brass plate, worn bright in the middle. Lodgers lay a hand on it and
    go in. Everyone else waits.
  brass plate: A plate of brass the size of an open hand, set flush in
    the door. The center is polished pale by years of palms. There is
    no seam, no pin, no mechanism you can see, and yet the lodgers of
    this house open it with a touch, and it has never once opened for
    anyone who does not live here.
  slate board: A slate in a wooden frame, hung on a nail beside the door.
    Rooms are chalked on it by number in a square, careful hand, and most
    of the numbers are crossed through. At the bottom, rewritten after
    every rain, a line reads ROOMS TO LET. ASK PENNOCK.
  washing: Shirts, sheets and a child's smock, pegged on lines strung
    window to window across the alley, dripping gently onto the swept
    stones.
idlemessages:
- A window opens somewhere above, a basin is emptied carefully into the
  gutter rather than the alley, and the window closes again.
- Someone inside the lodging house is singing, not well, behind a closed
  shutter.
- The washing overhead lifts in a draft that never reaches the flagstones.
- A lodger comes out of the green door, nods to nobody in particular, and
  heads off east toward the Back Court.
