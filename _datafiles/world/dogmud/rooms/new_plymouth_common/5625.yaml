roomid: 5625
zone: New Plymouth Common
title: Pennock's Alley
description: >
  A slot of an alley runs west off the Back Court between two tenement
  blocks, so narrow that the washing strung overhead nearly brushes both
  walls. The flagstones are swept, which is more than can be said for most
  of the quarter, and the air smells of lye and bread. The alley ends
  blind against a single stout
  <ansi fg="itemname">door</ansi>, painted a green touched up so many
  times it has taken on depth, with a
  <ansi fg="itemname">brass plate</ansi> set where a keyhole ought to be.
  Beside it hangs a painted <ansi fg="itemname">slate board</ansi>, and
  over it all a <ansi fg="itemname">lantern</ansi> burns on an iron bracket,
  kept lit by the letting company so that nobody can say they could not read
  the prices. Above, the building climbs in a stack of windows, lamplight in
  some and shutters in others, the rooms of people who have somewhere to
  come home to.
biome: city_backstreet
# The company's lantern over the door, named in the description. The
# backstreet biome's own lamp (35) is too dark after nightfall to make out
# faces, so Hobb's list could not be read; 52 is the lamplit-street level of
# city_thoroughfare, where night shopping works.
