zone: New Plymouth Common
title: Pennock's Alley
description: >
  A slot of an alley runs west off the Back Court between two tenement
  blocks, so narrow that the washing strung overhead nearly brushes both
  walls. The flagstones are swept, which is more than can be said for most
  of the quarter, and the air smells of lye and bread. The alley ends
  blind against a single stout
  <ansi fg="itemname">door</ansi>, painted a green touched up so many
  times it has taken on depth, with a
  <ansi fg="itemname">brass plate</ansi> set where a keyhole ought to be.
  Beside it hangs a <ansi fg="itemname">slate board</ansi> chalked in a
  square, careful hand. Above, the building climbs in a stack of windows,
  lamplight in some and shutters in others, the rooms of people who have
  somewhere to come home to.
