# Merchant chests (internal/merchantchests).
#
# Every merchant keeps a locked chest in the room it trades from. The server
# restocks each one on a timer (settings.restock_interval, game time): the
# old contents are cleared, gold is set to the merchant's average stock value
# x gold_value_ratio, +/- gold_spread, and 1-3 random goods are drawn from
# the merchant's own shop list. Goods drawn into a chest are marked as that
# merchant's property, so anything lifted out of one is stolen goods on the
# stolen-bauble rules: hot for Balance.BaubleStolenHeatHours in the area it
# was taken in (no honest merchant, storage or auction there), recognisable
# on the thief by the merchant and that area's guards, and bought by a fence
# anywhere at any time.
#
# The lock difficulty (pins) is derived from the average stock value unless a
# chest sets `difficulty:`, and so is the Perception each merchant template
# carries (docs/economy/merchant_chests.md has the roster and formula).
#
# `generic` is the generic chest: any field a chest leaves empty falls back
# to it. Each entry under `chests` is the chest geared to one merchant in one
# room; a merchant who trades from two rooms has one per room.
settings:
  # How often each chest is emptied and restocked (gametime period; one game
  # day is Timing.RoundsPerDay rounds).
  restock_interval: 1 day
  # How long a picked chest stays open before it locks itself again.
  relock_interval: 2 hours
  # Gold stocked = average stock value x gold_value_ratio x (1 +/- gold_spread).
  gold_value_ratio: 0.5
  gold_spread: 0.5
  # Goods stocked per restock, drawn from the merchant's shop list.
  items_min: 1
  items_max: 3
  # Lock pins = lock_base + lock_per_doubling x log2(1 + average stock value),
  # clamped to [lock_min, lock_max].
  lock_base: 4
  lock_per_doubling: 2
  lock_min: 6
  lock_max: 20
  # Merchant Perception base = perception_base + perception_per_doubling x
  # log2(1 + average stock value). Checked at boot against every template.
  perception_base: 100
  perception_per_doubling: 4
  # A sleeping merchant's Perception counts for this fraction in every theft
  # and detection contest.
  sleeping_perception_mult: 0.5
  # Town law-keepers outside the `guard` group who, like a guard, may
  # recognise hot chest goods on the thief in their own heat area. A mob in
  # the `guard` group needs no entry here.
  lookout_mobs:
    - 9316  # Dock Constable (New Plymouth Docks)
    - 9352  # A Square Guard (New Plymouth Merchant)
    - 9374  # Guard-Captain Doryn (New Plymouth Noble)
    - 9378  # A Gatehouse Sentry (New Plymouth Noble)
    - 9485  # A Gate Guard (The Confluence)
    - 9419  # Holt the Gate-Warden (The Confluence)
    - 9450  # A Processional Warden (The Confluence)
    - 9459  # The Threshold Warden (The Confluence)
    - 9501  # Oswin the Bridge-Warden (Greenford)
    - 9530  # Garn the Road-Warden (Greenford)
    - 9107  # Warden Esk (Pothole Coulee)
    - 9192  # Warden Holt (Greywater Flats)

generic:
  name: chest
  description: |
    A stout, iron-banded chest, scuffed from years of use, where its owner
    keeps the day's coin and a few of the better goods under lock.

