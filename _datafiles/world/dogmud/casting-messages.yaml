already_casting:
  - "The folds of {spell} already dance in your mind's eye. Type cancel to release them."
  - "Your thoughts remain bent upon {spell}, each fragment slowly coalescing. Type cancel to release them."
  - "You are still holding the fractured image of {spell} in your consciousness. Type cancel to release them."

cast_started:
  - "The mental image of {spell} begins to fracture into its component folds..."
  - "You feel the threads of reality bend as you reach for {spell}..."
  - "Your consciousness splinters as the folds of {spell} begin to take shape..."
  - "You gather your focus and begin to lay the first fold of {spell}..."
  - "The shape of {spell} stirs at the edge of your thoughts, and you reach for it..."
  - "You draw a slow breath and let the threads of {spell} come together..."
  - "Your mind opens, and the pattern of {spell} starts to unfold within it..."
  - "You narrow your focus until only the folds of {spell} remain..."
  - "A faint pull gathers behind your eyes as you begin to shape {spell}..."
  - "You turn your attention inward and start to weave the threads of {spell}..."

# Sent once per round while the folds are still being laid down. Keep these
# reading as WORK IN PROGRESS, never as the cast starting: the round loop used
# to reuse cast_started, so a four-fold spell announced its own beginning four
# times over.
cast_continuing:
  - "You hold the shape of {spell} steady while the next fold settles..."
  - "The folds of {spell} turn slowly behind your eyes, not yet complete..."
  - "{spell} hangs half-made in your thoughts, waiting on the fold to come..."
  - "You keep your grip on {spell} as another fold folds into place..."

concentration_slipped:
  - "You reach for the folds of {spell} but the image shatters before you can grasp it."
  - "The mental pattern of {spell} dissolves — your focus fractures at the critical moment."
  - "Your grip on {spell} slips; the folds scatter before the pattern takes hold."
