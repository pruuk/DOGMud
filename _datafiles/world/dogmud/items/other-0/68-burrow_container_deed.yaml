itemid: 68
name: Burrow Container Deed
namesimple: container deed
not_salable: true
description: >
  A scrap of sacking stamped with a crate and the word STORAGE. It gets a
  container carried into your Burrows lodging, and anyone you let in can use
  it. To use it, stand in the hide-out where it should go and type use
  container deed. You will be asked for one word to call it, like chest,
  crate, barrel or sack. You can also write the word straight after, as in use
  container deed crate. Then look in crate, put things in crate and get them
  from crate. What you keep in it stays there. A hide-out takes up to six.
type: object
subtype: usable
