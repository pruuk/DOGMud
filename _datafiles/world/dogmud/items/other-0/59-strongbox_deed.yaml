name: Strongbox Deed
namesimple: strongbox deed
not_salable: true
description: >
  A card printed CREWE LETTINGS, ONE ARTICLE OF FURNITURE (SECURE), stamped
  in red. It places one container in your lodging that opens for you and
  nobody else, not your guests and not their pets. To use it, stand in the
  room of your own lodging where it should go and type use strongbox deed.
  You will be asked for one word to call it, like chest, safe or coffer. You
  can also write the word straight after, as in use strongbox deed coffer.
  Then look in coffer, put things in coffer and get them from coffer. What
  you keep in it stays there.
