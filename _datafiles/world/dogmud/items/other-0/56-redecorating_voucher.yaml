itemid: 56
name: Redecorating Voucher
namesimple: voucher
not_salable: true
description: >
  A slip of card printed CREWE LETTINGS, ONE REDECORATION, stamped twice and
  initialled H.P. It is good for one room, once. To use it, stand in the
  lodging room you want changed and type use voucher. You will be asked to
  write how the room should look, as one paragraph. You can also write it
  straight after the word voucher. A new description replaces any you wrote
  for that room before.
type: object
subtype: usable
