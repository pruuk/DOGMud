description: >
  A card headed THE QUILLHOUSE, ONE ARTICLE OF FURNITURE (BED). It puts one bed in a room of your Quillhouse lodging. Anyone who sleeps in it, you or
  anyone you let in, rests twice as fast as on a floor. To use it, stand in the
  room where the bed should go and type use bed deed, then sleep there. A room
  takes one bed.
