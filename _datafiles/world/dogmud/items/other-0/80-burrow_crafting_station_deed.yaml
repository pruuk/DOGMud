itemid: 80
name: Burrow Crafting Station Deed
namesimple: station deed
not_salable: true
description: >
  A grubby scrap of paper with ONE BENCH, WHATEVER KIND scrawled across it and
  a lamp-black thumbprint for a seal. It installs one crafting station in a room of your hide-out in the Burrows. To use it, stand
  in the room where it should go and type use station deed, and choose which
  station from a list: a forge, a loom, an alchemy bench, a jeweler bench, a cooking fire or an enchanting circle. You can also name it straight away, as in
  use station deed forge. Anyone you let in can craft at it. A room takes one
  station.
