itemid: 55
name: Room Extension Deed
namesimple: deed
not_salable: true
description: >
  A stiff folded deed on Crewe Lettings paper, made out in a bored clerk's
  hand to the lodger who bought it and to nobody else. It entitles the bearer
  to one more room, knocked through from their own lodging. To use it, stand
  in one of your lodging rooms and type use deed to choose a wall from a list.
  You can also name the wall straight away, north, south, east, west, up or
  down. For example, use deed north.
