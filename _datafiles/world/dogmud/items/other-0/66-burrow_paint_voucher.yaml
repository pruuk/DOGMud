name: Burrow Paint Voucher
namesimple: voucher
not_salable: true
description: >
  A playing card with a corner torn off and PAINT pencilled on the back. It
  is good for one hide-out of your Burrows lodging, once. To use it, stand in
  the hide-out you want changed and type use voucher. You will be asked to
  write how it should look, as one paragraph. You can also write it straight
  after the word voucher. A new description replaces any you wrote for that
  hide-out before.
