namesimple: buckler
description: >-
  A steel buckler faced with black lenses laid edge to edge like scales on a
  shield-backed fish, every one turned a little differently. A blow caught
  on it does not ring; it slides, and the lenses flare, and some of its
  force comes back along the arm that struck. It is half the weight of the
  steel it covers.
