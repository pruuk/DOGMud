itemid: 20099
name: Glass-Scale Hauberk
vendor_categories:
- blacksmithing
namesimple: hauberk
description: >-
  A shirt of fine chain, every link of it hidden under row on row of small
  black lenses set like the scales of a fish. Each lens is ground thin at
  the edge and overlaps the next, so the whole coat moves like water and
  weighs a fraction of plate. The glass is harder than any steel in the
  Marches. A blade that lands on it skates across the scales, and the light
  caught in them throws a little of the blow back the way it came.
