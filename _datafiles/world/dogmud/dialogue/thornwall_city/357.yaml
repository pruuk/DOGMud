mobid: 357
zone: Thornwall City
defaultMood: ""
opener:
  text: Aye. Wagons are checked over. Long road today.
  hints: Choose a line below to learn about the caravan, its road, or his
    guards.
topics:
- key: road
  kind: info
  label: Where does the caravan go?
  text: South to Stillwater, then back. Same as always. The bandits on the spur road
    test us every time, and every time they lose. Keeps the road honest.
- key: bandit
  kind: info
  label: Do bandits trouble the caravan?
  text: Fools who think a wagon means easy coin. They learn otherwise. Marta and Lars
    earn their wages on every run.
- key: wagon
  kind: info
  label: What do the wagons carry?
  text: Bulk goods. Things that move better in volume than a shopkeeper can stock
    alone. Stillwater needs Thornwall iron, Thornwall needs Stillwater pearl. We bridge
    the difference.
- key: marta
  kind: info
  label: Who guards the wagons?
  text: Marta hits like a falling tree. Lars can pin a sparrow at fifty paces. I trust
    them with my life and have, more than once.
