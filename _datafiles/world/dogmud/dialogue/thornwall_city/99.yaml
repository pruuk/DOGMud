mobid: 99
zone: Thornwall City
defaultMood: neutral
opener:
  text: You are in the Records Office. I am Pell. State your business or take a number.
    There are no numbers. That was a joke. State your business.
  hints: Choose a line below if you want to hear about the records he keeps.
  variants:
  - questRequired:
    - 6-report
    questExcluded:
    - 6-end
    text: Ah, you again. The bridge report has been filed. Reference number 4-7-12-B.
      Tell Harn the magistrate will review it in due course.
    hints: Return to Toll Collector Harn at Watchers Crossing and type talk harn.
topics:
# Quest 6's step (Harn's report), a mid-quest grant: stays marked. The quest 6
# give trigger's npc_say lines are folded into the text.
- key: bridge_report
  kind: info
  label: Harn sent me with a maintenance report.
  text: A maintenance report from the bridge keeper at Watchers Crossing? Yes, I know
    about the toll situation. Let me see that. Damage assessments, repair projections...
    this is thorough. Let me file this properly. Done. It goes to the magistrate's
    pending reviews, and the Council will review it in due course. It will be seen.
    Eventually. That is how things work here. Tell Harn the report is on record.
  hints: Return to Toll Collector Harn at Watchers Crossing and type talk harn.
  marked: true
  questRequired:
  - 6-start
  questExcluded:
  - 6-report
  - 6-end
  requiresItem: 31
  grantsQuest: 6-report
  moodChange: friendly
- key: already_filed
  kind: info
  label: Has my report been filed?
  text: Already filed. Reference number 4-7-12-B. The magistrate will review it in
    due course. Now if you will excuse me, I have a backlog that predates you.
  questRequired:
  - 6-report
# The ledger itself lies in this room (rooms/thornwall_city/476.yaml spawns
# item 29); picking it up grants 9-deliver. Shown to anyone on quest 9 who
# is not carrying the ledger, so a player who lost it is told where it is.
- key: tithe_ledger
  kind: info
  label: I'm looking for the temple's tithe ledger.
  text: The tithe ledger? That is a temple document, not a municipal one. But yes,
    I have a copy. The temple files duplicates here as a matter of public record.
    Section twelve, subsection three, shelf nine. Help yourself. And whatever you
    find in there, remember that I only file the documents. I do not judge the contents.
  hints: Type get ledger.
  marked: true
  questRequired:
  - 9-start
  questExcluded:
  - 9-end
  itemExcluded: 29
  moodChange: friendly
- key: about_records
  kind: info
  label: How do you keep track of it all?
  text: I keep the municipal records for the eastern districts. Permits, charters,
    complaints, tax rolls. If it was written down, I have it. Every document that
    passes through this office receives a reference number,
    a date stamp, and a classification code. Cross-referenced by subject, origin,
    and urgency. The system is perfect. The people who use it are not.
- key: magistrate
  kind: info
  label: Who decides on the reports you file?
  text: The magistrate reviews pending items on her own schedule. I file. She decides.
    That is how the system works.
