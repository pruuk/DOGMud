mobid: 115
zone: Thornwall City
defaultMood: friendly
opener:
  text: Ha! Fresh blood! Come to hear old Gobb tell it like it is, have you? Smart.
    Very smart.
  hints: You could ask Gobb what he hears, or who he is.
topics:
- key: gossip_prompt
  kind: info
  label: Heard any good stories lately?
  text: Oh, I hear things. I hear EVERYTHING. My cousin's wife's brother works the
    docks, and her sister married a caravan guard, and their uncle... well, point
    is, nothing happens in the region without it reaching old Gobb eventually. You
    just sit here and listen. The good stuff comes around sooner or later.
  hints: Gobb shares what he hears, embellished or otherwise.
- key: gobb
  kind: info
  label: Who are you, then?
  text: Gobb! The one and only. Been drinking here since before Marek owned the place.
    Everyone knows Gobb. Ask anyone in Thornwall.
