mobid: 97
zone: Thornwall City
defaultMood: neutral
opener:
  # The opener is spoken, so the old narration (Kerra looks up from the
  # anvil) moved into the hint.
  text: Customer or spectator? If you want to buy, look over what I have. If you
    want to watch, stay clear of the sparks.
  hints: Kerra looks up from the anvil and wipes her hands on her apron. To see what
    she has for sale, type list.
topics:
# Her shop stocks smithing materials and what she forges from her recipes
# (mobs/thornwall_city/97-blacksmith_kerra.yaml), not a fixed dagger.
- key: weapons
  kind: info
  label: What weapons do you sell?
  text: I make blades to order, and I keep what I have made on the rack for travellers
    who cannot wait. Daggers, swords, bucklers, mail. Proper temper, good edge, balanced
    for actual use rather than display.
  hints: To see what Kerra has for sale, type list.
- key: about_craft
  kind: info
  label: How did you learn your trade?
  text: I have been at the anvil since I was twelve. My master was Gael, and before
    her, Tova. The technique goes back generations. The particular heat, the quench,
    the temper. That is what makes Thornwall steel. A blue tint, an edge that holds,
    a blade that flexes without breaking. It is the ore and the method both. You
    cannot learn it from a book. It lives in the hands. Every burn taught me something.
