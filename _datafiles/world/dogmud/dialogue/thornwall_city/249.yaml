mobid: 249
zone: Thornwall City
defaultMood: hostile
opener:
  text: You have come a long way to die in a hole. I do not know how you found this
    place, but you will not be leaving to tell anyone about it. The key to that strongbox
    stays with me, and so do the names inside it.
  hints: He will not hand over the key. To fight him for it, type attack torvan.
topics:
- key: refuse
  kind: info
  label: I'm not leaving without that key.
  text: Then we have nothing more to discuss.
  hints: To fight him for the key, type attack torvan.
  moodChange: hostile
- key: stand_down
  kind: info
  label: I'll go. I want no trouble.
  text: Smart. Walk north and do not look back. If I see you again down here, there
    will be no conversation.
  hints: He seems willing to let you leave. You could go north.
- key: smuggling
  kind: info
  label: What is this operation of yours?
  text: Call it what you like. I call it commerce without the city's boot on its neck.
    The tariffs strangle honest trade. I mapped these tunnels as a city surveyor and
    I saw what they could be. A way to move goods without paying tribute to corrupt
    officials who skim half of every shipment anyway.
- key: bribe
  kind: info
  label: Whose names are in that strongbox?
  text: Everyone takes a cut. Gate captains, customs clerks, warehouse inspectors.
    I just wrote it down. Insurance, you understand. If I go down, so do they. That
    ledger is worth more than everything else in this room combined.
