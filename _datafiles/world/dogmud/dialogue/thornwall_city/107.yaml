topics:
# Quest 8's step (finding Elara), a mid-quest grant: stays marked.
- key: reassure
  kind: info
  label: I mean you no harm. I only want to talk.
  text: You do not look like one of his people. All right. I am Elara. I am sure you
    have heard the name. My father has been telling everyone I am missing. I am not
    missing. I left. There is a difference, but the guard does not care about the
    distinction.
  hints: Choose a line below to hear why she left, about her father, or what
    happens now.
  marked: true
  questRequired:
  - 8-start
  questExcluded:
  - 8-found
  - 8-end
  grantsQuest: 8-found
  moodChange: trusting
- key: why_she_left
  kind: info
  label: Why did you leave home?
  text: My father arranged a marriage. A business alliance with a man from the eastern
    trade houses, a man who collects wives the way other men collect horses. I told
    my father no. He told me it was not my decision. So I made it my decision. I took
    what I could carry and left in the night. I have been here since, living on savings
    and the kindness of people who do not ask questions.
  questRequired:
  - 8-found
- key: about_father
  kind: info
  label: What is your father like?
  text: My father is Aldric Sevarn. Textile merchant. Respected. Successful. Completely
    certain that he knows what is best for everyone, especially his daughter. He is
    not a cruel man in the way most people mean. He simply cannot imagine that I might
    want something different from what he has planned. The marriage would make him
    rich. My feelings are... inconvenient. He wants me returned and married to a
    man I have never met. That is not a home. That is a cage with better furniture.
    I will not go back. I would rather live in these alleys than in that house.
  questRequired:
  - 8-found
- key: the_choice
  kind: info
  label: What happens now?
  text: You have a choice. You can go to the guard captain and report where I am.
    He will return me to my father. That is what the law says. I am a missing person,
    and missing persons get returned. The law does not ask if the person wants to
    be found. My father will come with guards, and I will be taken home and married off within
    the week. Or you can tell the captain you searched and did not find me. I will
    move again. I know how to disappear now. Or you could tell him the truth, that
    I am alive and hiding by choice, and let him decide what to do with that information.
    There is no good answer. I know that.
  hints: Return to Guard Captain Velk at the barracks and type talk velk.
  questRequired:
  - 8-found
  questExcluded:
  - 8-end
- key: who
  kind: info
  label: Who are you?
  text: My name is not important. I am nobody. Please do not ask questions. I know
    people are looking. My father sent them, did he not? He sends everyone. If you
    want to help, walk away. Tell them you did not find me. I do not need rescuing.
    I need to be left alone. There is a difference.
  questExcluded:
  - 8-found
