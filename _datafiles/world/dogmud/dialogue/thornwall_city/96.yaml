mobid: 96
zone: Thornwall City
defaultMood: neutral
opener:
  text: Sit. Drink. If you are looking for trouble, the back alleys have plenty. If
    you are looking for a quiet drink and maybe a favour... well, I could use a favour.
  hints: You could ask Marek about the favour he needs, or about the tavern.
  variants:
  - questRequired:
    - 10-start
    questExcluded:
    - 10-report
    text: Have you shown that notice to the guard captain yet? Every day I wait is
      another day those thugs think I am still paying. Please. The barracks is at
      the west end of Main Street.
    hints: From the Drowning Post Tavern, go north twice, then west twice, then north
      into the Guard Barracks. There, type talk velk.
  - questRequired:
    - 10-report
    questExcluded:
    - 10-end
    text: Did the captain say anything? Is the guard going to act? I need to know
      if it is safe to stop paying.
    hints: Choose The Drowning Post's Debt below to report what Velk said.
  - questRequired:
    - 10-end
    questExcluded:
    - 14-start
    text: The patrols have already started. First quiet night in months. Sit, this
      one is on me. Though... the cellar noises have gotten worse. Scraping, voices.
      Something is down there.
    hints: Choose The Undertow below to hear about the cellar.
  - questRequired:
    - 14-start
    questExcluded:
    - 14-evidence
    text: Any luck in the tunnels? Be careful down there. I hear things moving at
      night, and more than rats.
    hints: The kitchen is west of the bar. Its trapdoor leads down to the cellar,
      and the tunnels are below that.
  - questRequired:
    - 14-evidence
    questExcluded:
    - 14-report
    - 14-end
    text: You found what? A bribe ledger? Names of corrupt officials? Take that to
      Guard Captain Velk. He will know what to do with it.
    hints: Take the bribe ledger to Velk at the barracks and type talk velk.
  - questRequired:
    - 14-end
    text: The cellar has been quiet since you cleared those tunnels. I sleep through
      the night now. You have done more for this tavern than you know.
topics:
- key: the_squeeze
  kind: offer
  quest: 10
  label: The Drowning Post's Debt
  playerLine: You said you could use a favour. What is it?
  text: The tavern owes taxes to the city. That is my problem and I am working on
    it. But there is another problem. Someone in the back alleys has been sending
    protection notices to every business in the quarter. Pay up or get hurt. I have
    been paying both, and the money is running out. I have the latest notice right
    here. If the guard captain saw it, he would have to act. But I am afraid to walk
    into that barracks myself. People who report the racket tend to have accidents.
  hints: Accept, and Marek hands you the protection notice. Then take it to Guard
    Captain Velk at the barracks.
  questExcluded:
  - 10-start
  - 10-end
  grantsQuest: 10-start
  givesItem: 30
  moodChange: friendly
- key: quest_complete
  kind: handin
  quest: 10
  label: The Drowning Post's Debt
  playerLine: The guard captain will deal with the racket.
  text: You told the captain? And he is going to act? That is... that is something.
    The taxes are still a problem, but at least I will not have to feed two mouths
    that want to eat me alive. Here, the good stuff. You have earned it.
  questRequired:
  - 10-report
  questExcluded:
  - 10-end
  grantsQuest: 10-end
  moodChange: grateful
# The cellar quest opens after quest 10, so a player who has not finished it
# hears that something else is waiting.
- key: cellar_investigation
  kind: offer
  quest: 14
  label: The Undertow
  playerLine: Do you want me to look into the noises below?
  text: The noises from the cellar have gotten worse. Scraping, voices, the sound
    of things being dragged. The old drainage tunnels run under the whole district
    and connect to the cellar through a grate. I pulled it open once and... I did
    not like what I saw. Fresh boot prints in the mud. Someone is using those tunnels.
    I have a lantern you can take. The kitchen has a trapdoor down to the cellar.
    Be careful.
  hints: Accept, and Marek hands you a lantern. The kitchen is west of the bar, and
    its trapdoor leads down to the cellar.
  breadcrumb: And once my first trouble is sorted, there is something else I could
    use help with. Something in my cellar.
  questRequired:
  - 10-end
  questExcluded:
  - 14-start
  - 14-end
  grantsQuest: 14-start
  givesItem: 40038
# Was gated by memory of the offer (requires the_squeeze); now on 10-start.
- key: about_thugs
  kind: info
  label: Who is behind the protection racket?
  text: I do not know who runs it. The notices are unsigned, delivered at night. The
    thugs in the back alleys collect, but they are just muscle. Someone higher up
    is pulling strings. The guard might be able to find out, if they care enough to
    look.
  questRequired:
  - 10-start
  questExcluded:
  - 10-end
- key: lost_notice
  kind: info
  label: I've lost the protection notice.
  text: Lost it? Here, I have more. They keep sliding them under the door. Take this
    one and get it to the guard captain before I lose my nerve.
  hints: Take the protection notice to Guard Captain Velk at the barracks.
  questRequired:
  - 10-start
  questExcluded:
  - 10-report
  itemExcluded: 30
  givesItem: 30
# Was gated by memory of the offer (requires the_squeeze); now on 10-start.
# Hidden once the cellar quest is taken: its offer says the same thing.
- key: cellar_hint
  kind: info
  label: Is anything else troubling you?
  text: There is something else. At night, I hear noises from the cellar. Scraping,
    splashing, sometimes what sounds like voices. The old drainage tunnels run under
    this whole district. The cellar connects to them through a grate that has not
    been opened in years. One crisis at a time. But something is down there.
  questRequired:
  - 10-start
  questExcluded:
  - 14-start
# Restored from the old "debt" and "protection" patterns gated on 10-end
# (the racket resolved; the taxes remain).
- key: racket_over
  kind: info
  label: Are the thugs still bothering you?
  text: No. That is over now, thanks to you and the guard captain's patrols. No
    more notices, no more collectors. The city taxes are still a weight, but at
    least I only have one boot on my neck now.
  questRequired:
  - 10-end
- key: found_ledger
  kind: info
  label: I found a ledger full of officials' names.
  text: A bribe ledger? With names of city officials? That is bigger than protection
    money and back-alley thugs. Take that to Guard Captain Velk immediately. He is
    the one person in this city I trust to do the right thing with it.
  hints: Take the bribe ledger to Velk at the barracks and type talk velk.
  questRequired:
  - 14-evidence
  questExcluded:
  - 14-report
  - 14-end
- key: lost_lantern
  kind: info
  label: I've lost the lantern you gave me.
  text: Lost the lantern? Here, take another. I keep a few behind the bar. Do not
    lose this one. They are not free, you know.
  questRequired:
  - 14-start
  questExcluded:
  - 14-end
  itemExcluded: 40038
  givesItem: 40038
- key: drink
  kind: info
  label: What do you serve here?
  text: Ale is cheap, wine is not. Stew is whatever I had time to make this morning.
    It is honest food and honest drink. Nothing fancy.
