mobid: 116
zone: Thornwall City
defaultMood: neutral
opener:
  text: '...'
  hints: You could ask Wrex what he has seen, or who he is.
topics:
- key: gossip_prompt
  kind: info
  label: What have you seen in this city?
  text: I have watched this city for longer than most of its buildings have stood.
    The names change, the patterns do not. When something happens that breaks the
    pattern, that is when I take notice. Sit here long enough, and you will hear me
    say something worth remembering.
  hints: Wrex shares observations when the world does something unexpected.
- key: wrex
  kind: info
  label: Who are you?
  text: Wrex. A man who has been here a long time. That is enough.
