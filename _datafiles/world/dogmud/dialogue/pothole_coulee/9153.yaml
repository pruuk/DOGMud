mobid: 9153
zone: Pothole Coulee
defaultMood: neutral
opener:
  text: Sit, sit, the bench will hold you. I'm Wenna, elder of this farmstead,
    for my sins and my years.
  hints: Choose a line below to hear about the folk and their ways, or your
    task.
  variants:
  - questExcluded:
    - 30-end
    text: You have not been through the Awakening yet, have you. No matter to me,
      but the pool comes first. It is how a body becomes a part of this place. Cleric
      Hadwen keeps it, south at the reflecting pool. Be Opened, then come back and
      I will teach you the folk.
    hints: Find Cleric Hadwen at the reflecting pool and complete the Awakening, then
      return to Elder Wenna.
  # Crier Toke starts every trade (#375 phase 7): Wenna takes First Words'
  # hand-in but no longer offers it.
  - questRequired:
    - 30-end
    questExcluded:
    - 47-start
    - 47-end
    text: The rite is on you. Good. There is something here worth your while, the
      way of the folk, but Crier Toke sends me the ones who want it. Ask him in Hub
      Square who can teach you the ways of the folk, then come and sit with me.
    hints: Crier Toke starts every trade in the coulee. In Hub Square, type talk
      toke.
  - questRequired:
    - 47-start
    questExcluded:
    - 47-help
    - 47-end
    text: Still learning. Ask me about the folk, the ways, the stones, whatever you
      like. That is half the lesson. The other half is the in-game reckoning, the
      one that outlasts your memory. Open it.
    hints: Type help.
  - questRequired:
    - 47-help
    questExcluded:
    - 47-end
    text: You found the reckoning. Good. Tell me so properly.
    hints: Choose First Words below to report.
  - questRequired:
    - 47-end
    text: A friend of the folk, now, and wearing the sign of it. Good. The stones
      are west and north. Go and talk to Hale about them when you are ready. He keeps
      the deep part of us, the part even I only half recall.
    hints: Head to the standing stones (west and north) and type talk hale to find
      Loresinger Hale.
topics:
- key: words_turnin
  kind: handin
  quest: 47
  label: First Words
  playerLine: I opened the help, just as you said.
  text: You asked, and you listened, and you found the help that outlasts the asking.
    That is the whole way of the folk, and the rest is only more of it. Take this charm.
    Wear it where it shows, and ours will know you for a friend. Now the stones,
    west and north. Hale keeps the deep story. Go and let him tell it.
  hints: Quest complete. Head to the standing stones and type talk hale to find Loresinger
    Hale.
  questRequired:
  - 47-help
  questExcluded:
  - 47-end
  grantsQuest: 47-end
- key: words_progress
  kind: info
  label: What is the other half of the lesson?
  text: Not yet. You have done the asking part. Now open the in-game reckoning, the
    one that holds what memory drops. Then come back and tell me.
  hints: Type help.
  questRequired:
  - 47-start
  questExcluded:
  - 47-help
  - 47-end
- key: help_node
  kind: info
  label: Where can I look things up?
  text: When you cannot hold a thing in your head (a command, a custom, a name),
    type help and the in-game reckoning will hold it for you. It is the surest reference
    there is, and it never tires of being asked. We keep our own lore in carved stone
    for the same reason. Go on and try it.
  hints: Type help to open the in-game reference.
  marked: true
- key: folk
  kind: info
  label: Who are the folk here?
  text: The way of the folk is mostly the way of asking. You want to know a thing,
    you go to the one who keeps it, and you listen to the whole answer. We are an
    old people in a small place, and what we have, we have because we remember it
    and pass it on.
- key: eyes
  kind: info
  label: Why do your eyes shine like that?
  text: My eyes? The Awakening came to me late, and it came to my eyes, and they shine
    like an animal's at dusk now. Caught the whole household off guard the first evening.
    You get used to a thing if you live with it long enough.
- key: stones
  kind: info
  label: What are the old stones west of here?
  text: West and north of here the old stones stand in their ring. Hale keeps them,
    and the whole story of us carved into them. When you have your feet under you,
    go and talk to him about the old tale. He has been waiting on a good listener a
    long while.
