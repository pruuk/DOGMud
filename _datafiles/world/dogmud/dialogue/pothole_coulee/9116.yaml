mobid: 9116
zone: Pothole Coulee
defaultMood: neutral
opener:
  text: Rusk. I work the iron here, and I teach it to anyone who watches more
    than they talk.
  hints: Choose a line below to hear about smithing or your task.
  variants:
  - questExcluded:
    - 30-end
    text: You are still green. Not forge-ready green, raw-stock green. The Awakening
      comes first. Cleric Hadwen runs it at the Awakening Pool, north of the hub.
      Complete the rite and come back.
    hints: Find Cleric Hadwen at the Awakening Pool, north of Hub Square, and type
      talk hadwen. Complete the Awakening before returning to Smith Rusk.
  # Crier Toke starts every trade (#375 phase 7): Rusk takes First Heat's
  # hand-in but no longer offers it.
  - questRequired:
    - 30-end
    questExcluded:
    - 35-start
    - 35-end
    text: You have been through the rite. Good. I teach the forge, but Crier Toke
      sends me my students. Ask him in Hub Square who can teach you to work iron,
      then come back to my stall.
    hints: Crier Toke starts every trade in the coulee. In Hub Square, type talk
      toke.
  - questRequired:
    - 35-start
    questExcluded:
    - 35-met
    - 35-end
    text: Toke sent you. Good. I teach anyone who watches more than they talk. Ask
      me why you came, and I will tell you how the forge works.
    hints: Choose Crier Toke sent me to learn the forge below.
  - questRequired:
    - 35-met
    questExcluded:
    - 35-list
    - 35-end
    text: First see what I stock. Type list here beside me and my goods come up with
      their prices. The ingot and the strip are both on it.
    hints: Type list.
  - questRequired:
    - 35-list
    questExcluded:
    - 35-ingot
    - 35-end
    text: The ingot first. That is the blade. Type buy iron ingot.
    hints: Type buy iron ingot.
  - questRequired:
    - 35-ingot
    questExcluded:
    - 35-strip
    - 35-end
    text: Now the leather strip, for the grip. Type buy leather strip.
    hints: Type buy leather strip.
  - questRequired:
    - 35-strip
    questExcluded:
    - 35-craft
    - 35-end
    text: You have both. The forge is right here. Type craft iron dagger and give
      the iron a few moments to take the heat. A craft can fail. If it does, buy an
      ingot and a strip again and retry.
    hints: At the forge, type craft iron dagger. A craft can fail. If it does, buy
      an iron ingot and a leather strip again and retry.
  - questRequired:
    - 35-craft
    questExcluded:
    - 35-end
    text: You made something at the forge. Show it to me. If you would rather have
      the coin, sell it to me first, then tell me how the work went. Lost it? Then
      tell me anyway.
    hints: Choose First Heat below to report to Rusk. If you still carry the dagger,
      she looks it over. If you sold or lost it, she takes your word.
  - questRequired:
    - 35-end
    questExcluded:
    - 36-start
    - 36-end
    text: You understand the loop now. There is a man on the talus slope, Ovell, who
      pulled himself out of a cave-in and has been sitting there since. He could use
      a hand that knows iron. Say the word and I will send you.
    hints: Choose Pick the Vein below to hear what Ovell needs.
  - questRequired:
    - 36-start
    questExcluded:
    - 36-met
    - 36-end
    text: Ovell is waiting. North through the Quench Shed, west twice to the Lower
      Talus, then south into the Collapsed Cut.
    hints: From the Coulee Smithy, go north, west twice, then south into the Collapsed
      Cut. Type talk ovell.
  - questRequired:
    - 35-end
    text: You are through here. The slope is Ovell's business now. If things go wrong
      out there and you die, you wake at the Mending Hut.
    hints: When you want more forge work, Survivor Ovell in the Collapsed Cut may
      have some.
topics:
# Two exclusive hand-ins for First Heat. The old ask route needed no dagger
# and the old give route did; both survive. craft_turnin (carriesItem 10009)
# is what `give dagger rusk` resolves to: the dagger is shown, never taken
# (settled ruling). craft_turnin_told (itemExcluded 10009) is for a player
# who sold, salvaged or lost the blade: Rusk takes their word, so nobody has
# to buy and craft a second dagger just to report. The two gates resolve
# through the same carried-or-worn check, so exactly one is ever eligible.
- key: craft_turnin
  kind: handin
  quest: 35
  label: First Heat
  playerLine: I made a dagger at your forge. Here, see for yourself.
  text: Let me see it. Straight seam. Weight is forward where it belongs. You did
    not rush the quench. This is a working blade. Not fancy. Does not need to be.
    Keep it. You made it. You understand the loop now. Raw stock in, finished piece
    out. Apply that to anything the forge can make. And when you want more than the
    forge, I know a man on the talus slope who needs a hand.
  hints: Quest complete. Choose Pick the Vein below to hear what Ovell needs.
  questRequired:
  - 35-craft
  questExcluded:
  - 35-end
  carriesItem: 10009
  grantsQuest: 35-end
- key: craft_turnin_told
  kind: handin
  quest: 35
  label: First Heat
  playerLine: I made a dagger at your forge, but I don't have it now.
  text: Gone already? Then I take your word. The forge does not lie, and neither do
    you, I think. You understand the loop now. Raw stock in, finished piece out. Apply
    that to anything the forge can make. And when you want more than the forge, I
    know a man on the talus slope who needs a hand.
  hints: Quest complete. Choose Pick the Vein below to hear what Ovell needs.
  questRequired:
  - 35-craft
  questExcluded:
  - 35-end
  itemExcluded: 10009
  grantsQuest: 35-end
- key: heat_arrive
  kind: info
  label: Crier Toke sent me to learn the forge.
  text: Right. The forge teaches faster than I do, but here is the shape of it. Buy
    an iron ingot and a leather strip off my stall. List shows you what I stock and
    what it costs. Take them to the forge here in the smithy and type craft iron dagger.
    The iron and the leather disappear and a blade appears. That is the whole trick
    the first time. Once you have a feel for it, type craft list to see everything
    you know how to make. Show me what you made when you are done. Start with the
    list.
  hints: Here beside Rusk, type list.
  questRequired:
  - 35-start
  questExcluded:
  - 35-met
  - 35-end
- key: vein_offer
  kind: offer
  quest: 36
  label: Pick the Vein
  playerLine: Do you want me to help Ovell on the slope?
  text: Go and see him. Ovell was a prospector until the slope came down on him. He
    dug himself out of a cave-in and has been sitting in the Collapsed Cut since,
    watching scavengers walk over a good seam of basalt-iron. North through the Quench
    Shed, west twice to the Lower Talus, then south into the cut. If you die out there,
    you wake at the Mending Hut.
  hints: From the Coulee Smithy, go north, west twice, then south into the Collapsed
    Cut. Type talk ovell.
  questRequired:
  - 35-end
  questExcluded:
  - 36-start
  - 36-end
  grantsQuest: 36-start
- key: heat_list_help
  kind: info
  label: What do I need to make a dagger?
  text: One thing at a time. First see what I sell. Type list here beside me. The
    ingot and the strip are both on it, with what they cost.
  hints: Type list.
  questRequired:
  - 35-met
  questExcluded:
  - 35-list
  - 35-end
- key: heat_ingot_help
  kind: info
  label: What should I buy first?
  text: The iron ingot first. That is the blade itself. Type buy iron ingot. The strip
    comes after.
  hints: Type buy iron ingot.
  questRequired:
  - 35-list
  questExcluded:
  - 35-ingot
  - 35-end
- key: heat_strip_help
  kind: info
  label: I have the ingot. What next?
  text: You have the ingot. Now the leather strip. It wraps the grip so the blade
    does not turn in your hand. Type buy leather strip.
  hints: Type buy leather strip.
  questRequired:
  - 35-ingot
  questExcluded:
  - 35-strip
  - 35-end
- key: heat_craft_help
  kind: info
  label: I have the ingot and the strip. Now what?
  text: You have the ingot and the strip. That is all of it. The forge is right here.
    Type craft iron dagger, then let the iron take the heat for a few moments. A craft
    can fail. If it does, buy an ingot and a strip again and retry.
  hints: At the forge, type craft iron dagger. A craft can fail. If it does, buy an
    iron ingot and a leather strip again and retry.
  questRequired:
  - 35-strip
  questExcluded:
  - 35-craft
  - 35-end
- key: craft_help
  kind: info
  label: What else should I know about crafting?
  text: 'Three things worth knowing. First: the forge here is a station. Some recipes
    need to be made at a specific station, and the craft command will tell you if
    you are standing in the wrong place. Second: a component bag is where crafting
    materials live. Wear one, and any ingot you pick up goes into it on its own. If
    you have loose materials in your pack already, type sort and they go into the
    bag. Third: salvage breaks a worn or unwanted piece of gear back into materials.
    You do not always get everything back, but it is better than dropping it in the
    dirt. Type salvage followed by the item name.'
  hints: Craft makes a thing from its materials, and tells you if you need a station
    such as a forge. Type craft list to see what you can make. For more, type help
    craft.
  marked: true
- key: arm
  kind: info
  label: Why is your forearm like iron?
  text: The Awakening left its mark. This one is useful. Iron does not blister it,
    and it does not tire. I stopped minding it some years back.
