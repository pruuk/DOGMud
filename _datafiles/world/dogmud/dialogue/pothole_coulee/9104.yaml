mobid: 9104
zone: Pothole Coulee
defaultMood: neutral
greetings:
- text: Made you jump, did I? Shelves are stocked, prices are honest, and I
    remember faces. Look as long as you like.
  moods:
  - friendly
  - neutral
opener:
  text: 'Onna''s the name, and Coulee Provisions is my shop. If the coulee needs
    it, I stock it: food for the road, cloth for your back, a blade or a sling
    if your road needs one of those too. Fair dealing both directions: I tell
    you what a thing is worth and why.'
  hints: Choose a line below to learn about her wares, about selling what you
    carry, or about the sling on the back shelf.
  variants:
  - questExcluded:
    - 30-end
    text: New, and not yet through the pool. I will sell to you either way, because
      coin is coin, but the rite first is the local custom, and customers who follow
      it tend to live longer. Hadwen, at the water.
    hints: Cleric Hadwen keeps the Awakening Pool, north of Hub Square. Type
      talk hadwen there. Choose a line below if you want to hear about her wares
      now.
topics:
- key: wares
  kind: info
  label: How do I buy from you?
  text: 'Type <ansi fg="command">list</ansi> and the whole shop reads itself out to
    you, prices and all. See something you want, type <ansi fg="command">buy</ansi>
    and its name. Need five of a thing, say so. Type <ansi fg="command">buy 5 trail rations</ansi>
    and I count them out in one go. Prices move with my stock, mind: plenty on the
    shelf and you get a kind price, last one in the coulee and the price says so.'
  hints: To see what Onna sells and what it costs, type list. For more, type help
    buy.
  marked: true
- key: selling
  kind: info
  label: Will you buy what I carry?
  text: I buy as well as sell. Type <ansi fg="command">sell</ansi> and the thing's
    name, and I will name my price. It will be less than I charge for the same thing.
    That gap is called a roof over my head. Bring me what the coulee coughs up and
    we will both do fine.
  hints: Choose a line below if you would like to hear about her wares, or about
    the sling.
- key: sling
  kind: info
  label: What is the sling on the back shelf?
  text: The sling? Shepherd's weapon. String, pocket, and a stone's honest opinion
    delivered at distance. Cheap to feed, light to carry, harder to master than it
    looks. Folk who take to it usually end up out past the far-hill mouth, where they
    teach the long shot properly. Pouch of shot goes with it. Do not buy one without
    the other.
  hints: Choose a line below to hear about her wares or about selling.
- key: remembers
  kind: info
  label: Do you really remember every face?
  text: 'You are new, so your slate is clean. But yes, I remember what everyone
    buys. Not to pry. A shopkeeper who remembers saves you the second conversation:
    I will know your size, your salt, and your bad habits by the third visit. Cheaper
    than writing it down and politer than asking twice.'
  hints: Choose a line below to learn about her wares or the sling.
