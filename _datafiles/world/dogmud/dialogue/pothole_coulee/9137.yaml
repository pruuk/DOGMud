mobid: 9137
zone: Pothole Coulee
defaultMood: neutral

patterns:
  - keywords: ["hello", "hi", "greet", "hey", "hail"]
    responses:
      - "Delk. I hunt. Tarn sent you, or you would not have made it this
          far quiet. What do you want?"
      - "Keep downwind and keep still. The fringe is listening."

  - keywords: ["hunt", "kill", "prey", "learn", "teach", "quest", "task"]
    responses:
      - "Hunting is patience and one clean kill. Ask me and I will set
          you to it."
      - "Bring down meat, rest rough, eat what you took. That is living
          out here. Ask."

  - keywords: ["hands", "skin", "weatherproof", "mutation", "opened"]
    responses:
      - "The Awakening toughened my hands -- skin like waxed bark now,
          turns cold and thorn and wet. Out here it is a gift. I do not
          dwell on it."

  - keywords: ["sleep", "rest", "cook", "fire", "meat"]
    responses:
      - "Rest mends you faster than walking does. Type sleep when you
          are safe. The next thing you do wakes you. Cook your kill at my
          fire: type craft and the meal's name. A hot meal carries you
          further than cold meat ever will."

  - keywords: ["pack", "alpha", "wolves", "den"]
    responses:
      - "The pack runs the country south of here, and the alpha runs the
          pack. They come at you in numbers. That is a fight you take
          when you are ready, not before."

  - keywords: [""]
    responses:
      - "Say it plain."
      - "I am watching the tree-line. Talk."
      - "Out with it."

tree:
  root:
    text: "Delk. Hunter."
    hints: "You could ask Delk about hunting or your task."
    variants:
      # ── Not ready (Tarn's lesson unfinished) ─────────────
      - questExcluded: ["41-end"]
        text: "You are not ready for the fringe. Go back to Tarn on the
          steppe and learn to read ground first -- out here, not seeing
          the sign is how you become the kill. Come find me when she
          says you can track."
        hints: "Return north to Scout Tarn and finish her tracking lesson
          before coming to Hunter Delk."

      # ── Ready for quest 42 ───────────────────────────────
      - questRequired: ["41-end"]
        questExcluded: ["42-start", "42-end"]
        text: "Tarn's eyes, then. Good enough. The fringe will teach you
          the rest -- how to take meat, rest rough, and cook a kill. Ask
          me for the hunt when you are ready to work."
        hints: "Type ask delk hunt to take on the hunter's loop."

      # ── Mid quest 42, one variant per step (one command each) ─
      - questRequired: ["42-start"]
        questExcluded: ["42-track", "42-end"]
        text: "Still at it. First the line. Pronghorn graze the Thornbrake,
          just north of my camp. Read the ground for one before you go
          at it."
        hints: "In the Thornbrake, north of Delk's camp, type track
          pronghorn."
      - questRequired: ["42-track"]
        questExcluded: ["42-hunt", "42-end"]
        text: "You have its line. Now bring it down. A pronghorn will not
          start the fight, so you pick the moment."
        hints: "Type attack pronghorn."
      - questRequired: ["42-hunt"]
        questExcluded: ["42-meat", "42-end"]
        text: "You made the kill. The meat stays on the carcass until you
          take it. Take it, or you killed for nothing."
        hints: "Type loot corpse."
      - questRequired: ["42-meat"]
        questExcluded: ["42-rest", "42-end"]
        text: "You have meat. Before you cook, rest. Bed down where nothing
          hostile is near and let the field mend you."
        hints: "Type sleep."
      - questRequired: ["42-rest"]
        questExcluded: ["42-cook", "42-end"]
        text: "Rested. Now the fire, here in my camp. The meat and the salt
          become a meal. Burn it and the meat is gone, so bring down another
          pronghorn and try again. Lost the salt? Ask me for salt."
        hints: "At Delk's camp fire in Hunter's Hollow, type craft grilled
          meat."
      - questRequired: ["42-cook"]
        questExcluded: ["42-end"]
        text: "You have the look of someone who ate what they killed. Tell
          me how it went."
        hints: "Type ask delk report."

      # ── Ready for quest 43 ───────────────────────────────
      - questRequired: ["42-end"]
        questExcluded: ["43-start", "43-end"]
        text: "You hunt well enough to feed yourself. Now the hard work --
          the pack, south, and the alpha at the head of it. Ask me about
          the pack when your nerve is up."
        hints: "Type ask delk pack when you are ready for the final task."

      # ── Mid quest 43 (one step: the alpha) ──────────────
      - questRequired: ["43-start"]
        questExcluded: ["43-end"]
        text: "It is still out there. Carry food, fight through the
          hounds, and take the alpha in its den. Do not let them get
          behind you. From the Game Trail, go south through the Killing
          Ground and the Bone Field."
        hints: "In the Den, south of the Bone Field, type attack alpha."

      # ── Mid quest 56 (repeatable run), one variant per step ─
      - questRequired: ["56-start"]
        questExcluded: ["56-hunt", "56-end"]
        text: "The run is on. Bring a pronghorn down first. The Thornbrake,
          just north of my camp, usually has one."
        hints: "In the Thornbrake, north of Delk's camp, type attack
          pronghorn."
      - questRequired: ["56-hunt"]
        questExcluded: ["56-end"]
        text: "One down. Now work the Open Steppe for what it gives. The
          forage finishes the run. You need not come back to me."
        hints: "On the Open Steppe, type forage."

      # ── Quest 43 complete ────────────────────────────────
      - questRequired: ["43-end"]
        text: "You broke the pack. I have hunted this fringe for years
          and never managed that. The country south is quieter now, and
          you walk it wearing the hide of the thing that ruled it. Go on.
          You have the steppe in you."
        hints: "You have cleared the Wilderness spoke. Well done."

  nodes:
    # ── QUEST 42 OFFER (hands the salt) ───────────────────────
    - id: hunt_offer
      triggers: ["hunt", "learn", "teach", "work", "quest", "task"]
      questRequired: ["41-end"]
      questExcluded: ["42-start", "42-end"]
      grantsQuest: "42-start"
      givesItem: 40017
      text: "Right. Here -- a salt-pouch. You will want it for the fire.
        The loop is this. First, take meat: track a pronghorn in the
        Thornbrake, just north of here, bring it down, and take the meat
        off the carcass. Second, rest rough: sleep where it is safe and
        the field mends you faster than walking does. Third, cook it: at
        my fire here, the meat and the salt become grilled meat. Do all
        three and come back."
      hints: "You received a salt-pouch. In the Thornbrake, north of
        Delk's camp, type track pronghorn."

    # ── SALT RECOVERY (S8: one handout, never a second) ───────
    # itemExcluded hides the handout while the player carries a salt-pouch
    # anywhere (pack or component pouch); the node after it answers instead.
    - id: salt_recovery
      triggers: ["salt", "lost", "another", "pouch"]
      questRequired: ["42-start"]
      questExcluded: ["42-cook"]
      itemExcluded: 40017
      givesItem: 40017
      text: "Lost your salt? Here. Last pinch I am sparing. You need it
        and raw meat to cook grilled meat at the fire -- do not lose this
        one."
      hints: "You received a salt-pouch. With raw meat, type craft grilled
        meat at the camp fire."
    - id: salt_have
      triggers: ["salt", "lost", "another", "pouch"]
      questRequired: ["42-start"]
      questExcluded: ["42-cook"]
      text: "You already have salt. Check your pack and your pouch. One
        pinch is all a cut of meat needs."
      hints: "Type inventory to see what you carry."

    # ── QUEST 42 TURN-IN ──────────────────────────────────────
    - id: hunt_turnin
      triggers: ["report", "done", "ready", "finished", "quest", "task"]
      questRequired: ["42-cook"]
      questExcluded: ["42-end"]
      grantsQuest: "42-end"
      text: "Killed clean, rested rough, ate what you took. That is the
        whole of being a hunter, and you did it without me holding your
        hand. Take these boots -- broken in, good for long ground -- and
        the stew recipe. A hot meal does more than fill you. Now the bad
        work, when you are ready. The pack. Ask me about it."
      hints: "Quest complete. Type ask delk pack when you are ready for
        the final task."

    # ── QUEST 43 OFFER ────────────────────────────────────────
    - id: pack_offer
      triggers: ["pack", "alpha", "den", "wolves", "quest", "task"]
      questRequired: ["42-end"]
      questExcluded: ["43-start", "43-end"]
      grantsQuest: "43-start"
      text: "The pack, then. South of the fringe is their country, and
        they do not share it. They will come at you two and three at a
        time -- that is how a pack kills, and it is how this one will try
        to kill you. Cook a meal and carry it. Fight through the hounds,
        keep your back clear, and do not stop until you reach the den.
        From the Game Trail, east of my camp, it is south all the way,
        through the Killing Ground and the Bone Field. The alpha is in
        the den. Put it down and the pack comes apart. Go."
      hints: "In the Den, south of the Bone Field, type attack alpha."

    # ── MID QUEST 42 (S10): the hunt's own words ──────────────
    # Placed after the offers and the turn-in, so "quest" at the last step
    # still reaches hunt_turnin. Each answer names the player's step.
    - id: hunt_progress_start
      triggers: ["quest", "task", "help", "how", "next", "hunt", "done",
        "report", "ready"]
      questRequired: ["42-start"]
      questExcluded: ["42-track", "42-end"]
      text: "Not yet. First the line: read the ground for a pronghorn.
        The Thornbrake, just north of my camp, is where they graze."
      hints: "In the Thornbrake, north of Delk's camp, type track
        pronghorn."
    - id: hunt_progress_track
      triggers: ["quest", "task", "help", "how", "next", "hunt", "done",
        "report", "ready"]
      questRequired: ["42-track"]
      questExcluded: ["42-hunt", "42-end"]
      text: "Not yet. You have its line. Now bring it down."
      hints: "Type attack pronghorn."
    - id: hunt_progress_hunt
      triggers: ["quest", "task", "help", "how", "next", "hunt", "done",
        "report", "ready"]
      questRequired: ["42-hunt"]
      questExcluded: ["42-meat", "42-end"]
      text: "Not yet. The meat is still on the carcass. Take it. If you
        took it from an earlier kill, bring down another and take that
        one."
      hints: "Type loot corpse."
    - id: hunt_progress_meat
      triggers: ["quest", "task", "help", "how", "next", "hunt", "done",
        "report", "ready"]
      questRequired: ["42-meat"]
      questExcluded: ["42-rest", "42-end"]
      text: "Not yet. You have meat. Rest before you cook it."
      hints: "Type sleep."
    - id: hunt_progress_rest
      triggers: ["quest", "task", "help", "how", "next", "hunt", "done",
        "report", "ready"]
      questRequired: ["42-rest"]
      questExcluded: ["42-cook", "42-end"]
      text: "Not yet. You rested. Now cook the kill at my fire. If it
        burns, the meat is lost: bring down another pronghorn and cook
        that one."
      hints: "At Delk's camp fire in Hunter's Hollow, type craft grilled
        meat."

    - id: hunt_prey
      triggers: ["pronghorn", "track", "prey", "attack"]
      questRequired: ["42-start"]
      questExcluded: ["42-end"]
      text: "Pronghorn graze the Thornbrake, just north of my camp, and the
        Carrion Flat, south of the Game Trail. Track one to read its line:
        type track and the beast's name. Then bring it down. It will not
        start the fight, so you choose the moment."
      hints: "In the Thornbrake, north of Delk's camp, type track
        pronghorn. Then type attack pronghorn."

    - id: hunt_meat
      triggers: ["meat", "corpse", "carcass", "loot"]
      questRequired: ["42-start"]
      questExcluded: ["42-end"]
      text: "A pronghorn always leaves meat on the carcass, and it stays
        there until you take it. Loot the corpse where it fell. Raw meat
        and salt, at my fire, make grilled meat."
      hints: "Where the pronghorn fell, type loot corpse."

    # ── SLEEP / COOK HELP ─────────────────────────────────────
    - id: hunt_help
      triggers: ["sleep", "rest", "cook", "fire", "help"]
      text: "Two field skills. Rest: type sleep where nothing hostile is
        near and your body mends fast. The next thing you do wakes you,
        and any harm wakes you the hard way. Cooking: stand at my fire
        and type craft followed by the meal: craft grilled meat with
        raw meat and salt. A rested, fed hunter outlasts a stronger one
        who is neither."
      hints: "Type sleep to rest. At a cooking fire type craft grilled
        meat (needs raw meat + salt)."

    # ── MID QUEST 43 (S10) ────────────────────────────────────
    - id: pack_progress
      triggers: ["quest", "task", "help", "how", "next", "alpha", "den",
        "pack", "way", "done", "report", "ready"]
      questRequired: ["43-start"]
      questExcluded: ["43-end"]
      text: "The alpha is in the den. From the Game Trail, east of my camp,
        go south through the Killing Ground and the Bone Field. Carry a
        cooked meal, and if a fight turns against you, flee and come back
        stronger."
      hints: "In the Den, south of the Bone Field, type attack alpha."

    # ── REPEATABLE HUNT LOOP OFFER ────────────────────────────
    - id: game_loop_offer
      triggers: ["work", "again", "more", "hunt", "job", "quest", "task"]
      questRequired: ["43-end"]
      grantsQuest: "56-start"
      questExcluded: ["56-start", "56-hunt", "56-end"]
      text: "The fringe is always running game. Go out and bring one
        down, then forage the Open Steppe. Keep your hand in. The
        forage finishes the run."
      hints: "In the Thornbrake, north of Delk's camp, type attack
        pronghorn."

    # ── MID QUEST 56 (S10): one answer per step ───────────────
    - id: game_progress_start
      triggers: ["quest", "task", "help", "how", "next", "work", "hunt",
        "pronghorn", "done", "report", "ready"]
      questRequired: ["56-start"]
      questExcluded: ["56-hunt", "56-end"]
      text: "The run is on. Bring a pronghorn down first. The Thornbrake,
        just north of my camp, usually has one."
      hints: "In the Thornbrake, north of Delk's camp, type attack
        pronghorn."
    - id: game_progress_hunt
      triggers: ["quest", "task", "help", "how", "next", "work", "hunt",
        "forage", "done", "report", "ready"]
      questRequired: ["56-hunt"]
      questExcluded: ["56-end"]
      text: "One down. Now work the Open Steppe for what it gives. The
        forage finishes the run. You need not come back to me."
      hints: "On the Open Steppe, type forage."

memory:
  expiryPeriod: ""
