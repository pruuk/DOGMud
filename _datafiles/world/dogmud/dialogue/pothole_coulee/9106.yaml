# Crier Toke — town crier, Hub Square (5203). Grants and closes
# quest 31 (Find Your Footing). The mid-quest beats are quest-engine
# triggers (room_enter 5213, list then buy at 5207, equip, room_enter
# 5205; one command per step, in order). See
# quests/31-find_your_footing.yaml.

mobid: 9106
zone: Pothole Coulee
defaultMood: friendly

greetings:
  # Greetings fire once per mob per player per boot with no quest or visit
  # gate, so a returning character hears this too: it must not call them
  # new (#620).
  - text: "Hoy there! I never forget a face. Faces are half my stock in trade."
    moods: ["friendly", "neutral"]

patterns:
  - keywords: ["hello", "hi", "greet", "hey", "hoy"]
    responses:
      - "Hoy yourself! Stand close, the throat does the loud part."
      - "Good day for news. Every day is, if you stand in the right square."

  - keywords: [""]
    responses:
      - "Speak up or stand back, friend -- the next call is due."
      - "Hm? The notice-post has anything I forgot to shout."

tree:
  root:
    text: >-
      Toke, town crier, both mouths at your service -- the top one for
      talk, the low one for distance. Whatever happened in the coulee
      today, I knew it yesterday.
    hints: >-
      You could ask about the news, the seven mouths of the coulee, or
      a task to find your footing.
    variants:
      - questExcluded: ["30-end"]
        text: >-
          Hoy, unopened! No offense meant -- I can hear it in how you
          walk, like the ground might disagree with you. See Cleric
          Hadwen at the pool first. The town makes more sense from the
          far side of the water.
        hints: >-
          You could ask Hadwen about the rite at the Awakening Pool,
          north of the square.
      # Quest 31 mid-quest: one variant per step, in order, each naming
      # that step's one command (owner ruling 2026-10-17).
      - questRequired: ["31-start"]
        questExcluded: ["31-school", "31-end"]
        text: >-
          Still walking the town? Good. The slates first: the Chrysalis
          School Hall, up past the pool and the basalt stair. I will
          still be shouting when you get back.
        hints: >-
          Go north past the Awakening Pool and keep north up the basalt
          stair to the school hall. Walking in is enough.
      - questRequired: ["31-school"]
        questExcluded: ["31-list", "31-end"]
        text: >-
          Seen the slates? Good. Now the shelves: Trader Onna's, in
          Coulee Provisions. See what she has before you spend.
        hints: >-
          Go south to Market Row, then east into Coulee Provisions, and
          type list.
      - questRequired: ["31-list"]
        questExcluded: ["31-shop", "31-end"]
        text: >-
          Looked over Onna's shelves, have you? The cotton shirt is the
          one. You have coin enough for it.
        hints: >-
          At Coulee Provisions, type buy cotton shirt.
      - questRequired: ["31-shop"]
        questExcluded: ["31-equip", "31-end"]
        text: >-
          A new shirt, still folded in your pack? It keeps nobody warm
          there. Put it on.
        hints: >-
          Type equip cotton shirt.
      - questRequired: ["31-equip"]
        questExcluded: ["31-lantern", "31-end"]
        text: >-
          Dressed for the coulee! Now the taps: The Drowned Lantern,
          the inn off Market Row. Put your head in the door.
        hints: >-
          Go south to Market Row, then west into The Drowned Lantern.
          Walking in is enough.
      - questRequired: ["31-lantern"]
        questExcluded: ["31-end"]
        text: >-
          There you are! School, shop, and the Lantern's taps -- I had
          word of you from all three before your boots cleared their
          doorways. Say the word footing and we will call it done.
        hints: >-
          Type ask toke footing to finish the task.
      - questRequired: ["31-end"]
        text: >-
          The town knows your face now -- I made sure of it. When you
          want more than the hub, ask me about the mouths. The coulee
          has seven of them, and every one leads somewhere that will
          teach you something.
        hints: >-
          You could ask about the seven mouths, or the day's news.

  nodes:
    # ── THE WAY TO THE DRILL YARD AND THE LONG TERRACE ──────────
    # Quests 32 and 50 send a newcomer to these two yards, and nothing
    # gave the way from the square (2026-10-17 newbie-duo playtest). First
    # in the list so "where is the drill yard" is answered here, not by a
    # footing step node that also listens for "where". Routes walked in
    # the room data: 5203 north 5200, east 5202, east 5209, east 5220,
    # east 5227; and 5209 north 5226, up 5347, north 5348, north 5349, up
    # 5350, east 5351.
    - id: way_drill_yard
      triggers: ["drill", "yard", "vorn", "dummy"]
      text: >-
        The Drill Yard? Easy walking. From this square go north to the
        pool, then east four times: the shore path, the Mending Hut, the
        dry coulee mouth, and the yard itself. Drillmaster Vorn will be
        the one shouting.
      hints: >-
        From Hub Square: north, then east four times.

    - id: way_long_terrace
      triggers: ["terrace", "iden", "range", "butt", "sling"]
      text: >-
        The terraces are up on the bluff. From this square go north to
        the pool, east twice to the Mending Hut, then north to the Bluff
        Steps. Climb up, go north twice, and up once more to the Firing
        Range, where Marksman Iden keeps watch. The Long Terrace is just
        east of her.
      hints: >-
        From Hub Square: north, east, east, north, up, north, north, up,
        then east to the Long Terrace.

    # ── THE WAY TO SCOUT TARN AND THE STEPPE ────────────────────
    # Quest 41 sends a newcomer to the Open Steppe "south of Scout Tarn",
    # and nothing gave the way to Tarn (2026-10-17 newbie-duo verify2).
    # Route walked in the room data: 5203 west 5216, west 5223, south
    # 5282, south 5283 (Steppe Edge, Tarn 9136), south 5284.
    - id: way_scout_tarn
      triggers: ["tarn", "scout", "steppe"]
      text: >-
        Scout Tarn? She keeps to the Steppe Edge, out past the scrub.
        From this square go west twice, along the stilt-house walk and
        into the scrub draw, then south twice through the scrub mouth.
        The Open Steppe is one more step south of her.
      hints: >-
        From Hub Square: west, west, south, south to the Steppe Edge.

    - id: newcomer_players
      triggers: ["people", "players", "player", "others", "talk", "say", "who",
        "tell", "whisper", "chat", "speak", "everyone", "quest", "task"]
      questRequired: ["21-start"]
      questExcluded: ["21-end"]
      grantsQuest: "21-end"
      text: >-
        You will not walk Gaius alone -- real folk fill these roads,
        same as you. A few words to carry: type say followed by your
        words to speak to everyone in the room, who to see who is
        about, tell someone's-name then your words to speak just to
        them, and try an emote like wave or grin. That is the whole of
        getting on with people. The rest you will pick up by doing. Off
        you go.
      hints: >-
        Type say <words> to speak to the room, who to see who's online,
        tell <name> <words> to speak privately, and emotes like wave.
        You've found your footing in Gaius.
      moodChange: friendly

    - id: footing_offer
      triggers: ["footing", "task", "quest", "town", "around", "work"]
      questRequired: ["30-end"]
      questExcluded: ["31-start", "31-end"]
      grantsQuest: "31-start"
      text: >-
        Newly Opened and nowhere to be? Perfect. Learn the town before
        the town has to learn you. Three stops. First the Chrysalis
        School Hall up past the pool. Then kit yourself out at Trader
        Onna's shelves in Coulee Provisions -- buy a shirt and put it
        on. And last The Drowned Lantern, the inn with the best taps in
        the coulee. Do it in that order and come tell me what you saw. I
        will hear about it anyway, but I like it firsthand. And if you
        lose your place, the <ansi fg="command">hint</ansi> command
        tells you the next stop, and <ansi fg="command">quests</ansi>
        lists everything you have taken on.
      hints: >-
        Go north past the Awakening Pool and keep north up the basalt
        stair to the Chrysalis School Hall. Walking in is enough.
      moodChange: friendly

    - id: footing_unopened
      triggers: ["footing", "task", "quest", "work"]
      questExcluded: ["30-end", "31-start", "31-end"]
      text: >-
        Eager! I respect it. But the pool comes first -- that is not
        my rule, it is just the order the coulee works in. Cleric
        Hadwen, north side of the square. Come back Opened and I will
        put your feet to work.
      hints: >-
        Ask Hadwen about the rite at the Awakening Pool.

    - id: footing_turnin
      triggers: ["footing", "done", "finished", "quest", "task"]
      questRequired: ["31-lantern"]
      questExcluded: ["31-end"]
      grantsQuest: "31-end"
      text: >-
        And done! Slates, shelves, taps -- the whole hub in one walk. Now
        listen, because this is the part I save for people who finish things.
        The coulee has seven mouths -- seven breaks in the rim, and past every
        one somebody or something that will teach you what the town cannot.
        Fighting, forge-smoke, the green reek of potions, wild country, the
        quiet folding art, old stones that talk if you read them, and a far
        hill where they put things down at distance. I am marking all seven on
        your slate right now. And here -- take these to start you off: a cudgel
        for the drill yard, and a sling with a pouch of shot for the range. Go
        find the seven teachers. Walk the mouths in any order your boots hold.
      hints: >-
        Quest complete -- and seven new trails are on your quest log. Type
        quests to see them all, or hint for a nudge on the nearest. The mouths
        open off the shore and the square, and the map command shows what you
        have found.
      moodChange: friendly

    # ── Quest 31 mid-quest questions (2026-10-17 audit S10) ──
    # A player partway through Find Your Footing who asks about any word the
    # quest invites gets the current step, not the catch-all. One node per
    # step, in order, gated like the root variants above; same triggers on
    # each so only the step gate picks the answer.
    - id: footing_step_school
      triggers: ["footing", "task", "quest", "done", "finished", "next", "help",
        "how", "where", "lost", "map", "school", "slate", "shop", "shelves",
        "provisions", "onna", "list", "buy", "shirt", "cotton", "equip", "wear",
        "lantern", "inn", "taps"]
      questRequired: ["31-start"]
      questExcluded: ["31-school", "31-end"]
      text: >-
        Not done yet, friend, and the order matters. Slates first: the
        Chrysalis School Hall, up past the pool and the basalt stair.
        Shelves and taps after that. If you get turned around, the map
        command shows where your feet have been.
      hints: >-
        Go north past the Awakening Pool and keep north up the basalt
        stair to the school hall. Walking in is enough.

    - id: footing_step_list
      triggers: ["footing", "task", "quest", "done", "finished", "next", "help",
        "how", "where", "lost", "map", "school", "slate", "shop", "shelves",
        "provisions", "onna", "list", "buy", "shirt", "cotton", "equip", "wear",
        "lantern", "inn", "taps"]
      questRequired: ["31-school"]
      questExcluded: ["31-list", "31-end"]
      text: >-
        Slates done, so the shelves are next. Trader Onna keeps Coulee
        Provisions, off Market Row. Look over her stock before you spend:
        a buyer who looks first pays less for regret.
      hints: >-
        Go south to Market Row, then east into Coulee Provisions, and
        type list.

    - id: footing_step_buy
      triggers: ["footing", "task", "quest", "done", "finished", "next", "help",
        "how", "where", "lost", "map", "school", "slate", "shop", "shelves",
        "provisions", "onna", "list", "buy", "shirt", "cotton", "equip", "wear",
        "lantern", "inn", "taps"]
      questRequired: ["31-list"]
      questExcluded: ["31-shop", "31-end"]
      text: >-
        You have seen Onna's stock. The cotton shirt is the one: cheap,
        warm, and better than bare skin. You have coin enough.
      hints: >-
        At Coulee Provisions, type buy cotton shirt.

    - id: footing_step_equip
      triggers: ["footing", "task", "quest", "done", "finished", "next", "help",
        "how", "where", "lost", "map", "school", "slate", "shop", "shelves",
        "provisions", "onna", "list", "buy", "shirt", "cotton", "equip", "wear",
        "lantern", "inn", "taps"]
      questRequired: ["31-shop"]
      questExcluded: ["31-equip", "31-end"]
      text: >-
        A shirt in your pack is a shirt keeping nobody warm. Put it on.
        Gear only works when you wear it.
      hints: >-
        Type equip cotton shirt.

    - id: footing_step_lantern
      triggers: ["footing", "task", "quest", "done", "finished", "next", "help",
        "how", "where", "lost", "map", "school", "slate", "shop", "shelves",
        "provisions", "onna", "list", "buy", "shirt", "cotton", "equip", "wear",
        "lantern", "inn", "taps"]
      questRequired: ["31-equip"]
      questExcluded: ["31-lantern", "31-end"]
      text: >-
        Dressed and ready! Last stop is the taps: The Drowned Lantern,
        the inn off Market Row. Put your head in the door and come back
        to me.
      hints: >-
        Go south to Market Row, then west into The Drowned Lantern.
        Walking in is enough.

    # All four stops done: footing, done, finished, quest and task reach
    # footing_turnin above; every other quest word lands here.
    - id: footing_step_report
      triggers: ["next", "help", "how", "where", "lost", "map", "school", "slate",
        "shop", "shelves", "provisions", "onna", "list", "buy", "shirt", "cotton",
        "equip", "wear", "lantern", "inn", "taps"]
      questRequired: ["31-lantern"]
      questExcluded: ["31-end"]
      text: >-
        School, shelves, and taps, all three! You have walked the whole
        hub. Say the word footing and we will call it done.
      hints: >-
        Type ask toke footing to finish the task.

    - id: mouths
      triggers: ["mouths", "mouth", "seven", "coulee", "rim", "spokes", "trails", "trials", "paths", "path"]
      text: >-
        Seven breaks in the coulee rim, and a path through every one.
        I call them mouths because the town eats what they bring back.
        Fighting in one, smithing in another, brewing, the wilds,
        folding -- the quiet art, mind you -- old lore, and the far
        hill where they teach the long shot. The paths are marked off
        the shore and the square. Walk any of them. Walk all of them
        if your boots hold.
      hints: >-
        The mouths open off the edges of town. The map command shows
        what you have found so far. You could ask the way to the drill
        yard, the terrace or the steppe.

    - id: news
      triggers: ["news", "word", "day", "notice", "happened"]
      text: >-
        Today's word: the pool is still patient, Onna's prices are
        still fair, and Granny Wicker is still older than both. If you
        want your own word carried, just speak --
        <ansi fg="command">say</ansi> talks to the room you stand in,
        <ansi fg="command">tell</ansi> reaches one ear further off,
        and <ansi fg="command">emote</ansi> is for when words are too
        small. I use all three before breakfast.
      hints: >-
        You could ask about the seven mouths or a task.

    - id: voices
      triggers: ["voices", "mouth", "throat", "loud", "shout"]
      text: >-
        Born with both, and glad of it. The low one carries across the
        square. The top one does the thinking. They get along better
        than most married couples. Folk stop noticing inside a week --
        you will too.
      hints: >-
        You could ask about the news or the seven mouths.
