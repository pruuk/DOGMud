mobid: 9106
zone: Pothole Coulee
defaultMood: friendly
greetings:
- text: Hoy there! I never forget a face. Faces are half my stock in trade.
  moods:
  - friendly
  - neutral
opener:
  # The greeting pattern (hello) is folded in here. The root is for an Opened
  # player who has not taken Toke's Road: no task of his is on the menu yet.
  text: Hoy yourself! Stand close, the throat does the loud part. Toke, town crier,
    both mouths at your service. The top one is for talk, the low one for distance.
    Whatever happened in the coulee today, I knew it yesterday.
  hints: Choose a line below if you would like to hear about the news or the seven
    mouths of the coulee. For work, type talk hadwen at the pool and choose Toke's
    Road. Cleric Hadwen sends new folk here.
  variants:
  - questExcluded:
    - 30-end
    text: Hoy, unopened! No offense meant. I can hear it in how you walk, like the
      ground might disagree with you. See Cleric Hadwen at the pool first. The town
      makes more sense from the far side of the water.
    hints: Go north to the Awakening Pool and type talk hadwen.
  - questRequired:
    - 31-start
    questExcluded:
    - 31-school
    - 31-end
    text: 'Still walking the town? Good. The slates first: the Chrysalis School Hall,
      up past the pool and the basalt stair. I will still be shouting when you get
      back.'
    hints: Go north past the Awakening Pool and keep north up the basalt stair to
      the school hall. Walking in is enough.
  - questRequired:
    - 31-school
    questExcluded:
    - 31-list
    - 31-end
    text: 'Seen the slates? Good. Now the shelves: Trader Onna''s, in Coulee Provisions.
      See what she has before you spend.'
    hints: Go south to Market Row, then east into Coulee Provisions, and type list.
  - questRequired:
    - 31-list
    questExcluded:
    - 31-shop
    - 31-end
    text: Looked over Onna's shelves, have you? The cotton shirt is the one. You have
      coin enough for it.
    hints: At Coulee Provisions, type buy cotton shirt.
  - questRequired:
    - 31-shop
    questExcluded:
    - 31-equip
    - 31-end
    text: A new shirt, still folded in your pack? It keeps nobody warm there. Put
      it on.
    hints: Type equip cotton shirt.
  - questRequired:
    - 31-equip
    questExcluded:
    - 31-lantern
    - 31-end
    text: 'Dressed for the coulee! Now the taps: The Drowned Lantern, the inn off
      Market Row. Put your head in the door.'
    hints: Go south to Market Row, then west into The Drowned Lantern. Walking in
      is enough.
  - questRequired:
    - 31-lantern
    questExcluded:
    - 31-end
    text: There you are! School, shop, and the Lantern's taps. I had word of you
      from all three before your boots cleared their doorways. Tell me what you saw
      and we will call it done.
    hints: Choose Find Your Footing below to finish the task.
  # A held Report to Toke bridge comes before the hub: the [?] line is the next
  # thing to do, and the hub's hint names only the [!] lines. One variant per
  # bridge, gated on that bridge's own start token. Bridges 90 to 97 are here,
  # and each bridge's hand-in is a report_*_in above send_drill.
  - questRequired:
    - 90-start
    questExcluded:
    - 90-end
    text: Hoy! I hear the wash went quiet, and I hear Garve sent you up here. I know
      it already, of course, but I want it from your own mouth. Tell me about the
      tower.
    hints: Choose Report to Toke (Fighting), the line marked [?] below, to tell Toke
      the news.
  - questRequired:
    - 91-start
    questExcluded:
    - 91-end
    text: Hoy! You have mine dust on you, and Ovell does not send folk up here for
      small news. Tell me what happened down the deep vein.
    hints: Choose Report to Toke (Smithing), the line marked [?] below, to tell Toke
      the news.
  - questRequired:
    - 92-start
    questExcluded:
    - 92-end
    text: Hoy! You smell of the marsh, and Falv does not send folk to me for nothing.
      Tell me what became of the thing in the mire.
    hints: Choose Report to Toke (Brewing), the line marked [?] below, to tell Toke
      the news.
  - questRequired:
    - 93-start
    questExcluded:
    - 93-end
    text: Hoy! Delk does not send folk up from the fringe for small news. Tell me how
      it went with the pack.
    hints: Choose Report to Toke (Tracking), the line marked [?] below, to tell Toke
      the news.
  - questRequired:
    - 94-start
    questExcluded:
    - 94-end
    text: Hoy! You have grove-light on you, and Orrin does not send folk down to
      me for small news. Tell me how the casting went.
    hints: Choose Report to Toke (Casting), the line marked [?] below, to tell Toke
      the news.
  - questRequired:
    - 95-start
    questExcluded:
    - 95-end
    text: Hoy! You have the quiet of the old shrine on you, and Sere does not send
      folk down to me lightly. Tell me what lies under her floor.
    hints: Choose Report to Toke (Lore), the line marked [?] below, to tell Toke
      the news.
  - questRequired:
    - 96-start
    questExcluded:
    - 96-end
    text: Hoy! You have canyon dust on you, and Bryn does not send folk down to me
      for small news. Tell me who holds the overlook now.
    hints: Choose Report to Toke (Archery), the line marked [?] below, to tell Toke
      the news.
  - questRequired:
    - 97-start
    questExcluded:
    - 97-end
    text: Hoy! You walk quieter than you did, and Dace does not send folk down to
      me for small news. Tell me how it went in the dark.
    hints: Choose Report to Toke (Shadows), the line marked [?] below, to tell Toke
      the news.
  # All eight bridges in: the last [!] on the menu is Esk's Road.
  - questRequired:
    - 90-end
    - 91-end
    - 92-end
    - 93-end
    - 94-end
    - 95-end
    - 96-end
    - 97-end
    questExcluded:
    - 89-start
    text: Every teacher in the coulee has sent you back to me, all eight of them.
      I have one road left for you.
    hints: Choose Esk's Road, the line marked [!] below, to hear where it goes.
  # All eight in and the road taken, not yet handed in: Esk is the next thing to
  # do. The bridges stay in the gate because an older save may hold 89-start
  # from Cleric Hadwen with trades still to start, and the hub reads true for it.
  - questRequired:
    - 90-end
    - 91-end
    - 92-end
    - 93-end
    - 94-end
    - 95-end
    - 96-end
    - 97-end
    - 89-start
    questExcluded:
    - 89-end
    text: Still in my square? Warden Esk has the arch, and he knows you are coming.
      Go and tell him you are ready.
    hints: From Hub Square go south twice, through Market Row, to the Threshold
      House. Type talk esk.
  # All eight in and the road finished: no teacher is left to send news back,
  # so the no-trades hint below would promise a [?] that never comes.
  - questRequired:
    - 90-end
    - 91-end
    - 92-end
    - 93-end
    - 94-end
    - 95-end
    - 96-end
    - 97-end
    - 89-end
    text: Every teacher in the coulee has sent you back to me, and Warden Esk has
      had his word with you. I have no road left to give. Stop by when you have
      news of the far side.
    hints: Choose a line below to hear about the news or the seven mouths of the
      coulee. To cross the arch, type talk esk in the Threshold House, south twice
      from Hub Square.
  # All eight trades taken: no [!] line is left, so the hub's hint would describe
  # lines that are not there. The gate is the eight send_* offers' start tokens,
  # which stay held after each quest ends (TestToke_NoTradesLeftOpener).
  - questRequired:
    - 31-end
    - 32-start
    - 35-start
    - 38-start
    - 41-start
    - 44-start
    - 47-start
    - 50-start
    - 98-start
    text: You have taken up every trade I can start you on, all eight. The rest is
      your own walking. Come back when you have news, and I will carry it across
      the square.
    hints: Toke has no more trades to start. When a teacher sends you back with
      news, a line marked [?] shows below. Other lines tell you about the news and
      the seven mouths of the coulee.
  # The hub (#375 phase 7): Toke is the only starter of the eight trades, and
  # a player new to MUDs is told so in plain words. Each trade's first quest
  # is one [!] line on his menu; take one, several or all eight.
  - questRequired:
    - 31-end
    text: 'The town knows your face now. I made sure of it. Here is the rest of
      it. I can start you on any trade the coulee teaches: fighting, the forge,
      brewing, the wilds, casting, the lore of the folk, the long shot and the
      dark. Each one has its own teacher, and I send you to the first. Take one,
      take several, or take all eight.'
    hints: Each line marked [!] below starts one trade. Type the number of one to
      hear who teaches it and where. You can take as many as you like.
  # Every state with 31-start matched above, so these two read only Toke's Road.
  # Hadwen has sent the player, and the hand-in is the next thing to do.
  - questRequired:
    - 88-start
    questExcluded:
    - 88-end
    text: Hoy yourself! Stand close, the throat does the loud part. Toke, town crier,
      both mouths at your service. Someone has been talking about you at the pool,
      and I knew it before your boots left the water.
    hints: Choose Toke's Road, the line marked [?], to tell Toke that Cleric Hadwen
      sent you.
  # The road is handed in, and the walk around the town is on the menu.
  - questRequired:
    - 88-end
    text: Hoy yourself! Stand close, the throat does the loud part. Toke, town crier,
      both mouths at your service. The top one is for talk, the low one for distance.
      Whatever happened in the coulee today, I knew it yesterday.
    hints: Choose Find Your Footing, the line marked [!], for a walk around the town.
      Other lines tell you about the news and the seven mouths of the coulee.
topics:
# R17: the end of Toke's Road (quest 88), offered by Cleric Hadwen after the
# rite. This hand-in is the quest's only end (#375 phase 7), and it unlocks
# Find Your Footing below, which is pitched right after it.
- key: road_toke_end
  kind: handin
  quest: 88
  label: Toke's Road
  playerLine: Cleric Hadwen sent me to learn the town from you.
  text: Hadwen sent you? Then you came to the right mouth! Hoy, newly Opened. I can
    walk you round the whole hub in one go, the school, the shop and the inn, and
    by the end of it the town will know your face.
  hints: Quest complete. Next, Toke offers Find Your Footing, a walk around the
    town.
  questRequired:
  - 88-start
  questExcluded:
  - 88-end
  grantsQuest: 88-end
  moodChange: friendly
# Quest 21 "Newcomer's Path" is secret (not in the quest log), so this is a
# marked info topic carrying the end grant, not a hand-in: a hand-in would
# put [?] on Toke for a quest the player cannot see, and [?] outranks the
# [!] of Find Your Footing on his name (requirements rule 9).
- key: newcomer_players
  kind: info
  label: I'm new here. How do I talk to other people?
  text: 'You will not walk Gaius alone. Real folk fill these roads, same as you.
    A few words to carry: type say followed by your words to speak to everyone in
    the room, who to see who is about, whisper and someone''s name then your words
    to speak just to them, wherever they are, and try an emote like wave or grin.
    That is the whole of getting on with people. The rest you will pick up by doing.
    Off you go.'
  hints: To speak to everyone in the room, type say and your words. For more, type
    help say.
  marked: true
  questRequired:
  - 21-start
  questExcluded:
  - 21-end
  grantsQuest: 21-end
  moodChange: friendly
- key: footing_offer
  kind: offer
  quest: 31
  label: Find Your Footing
  playerLine: Will you show me around the town?
  text: Newly Opened and nowhere to be? Perfect. Learn the town before the town has
    to learn you. Three stops. First the Chrysalis School Hall up past the pool. Then
    kit yourself out at Trader Onna's shelves in Coulee Provisions. Buy a shirt
    and put it on. And last The Drowned Lantern, the inn with the best taps in the
    coulee. Do it in that order and come tell me what you saw. I will hear about it
    anyway, but I like it firsthand. And if you lose your place, the <ansi fg="command">hint</ansi>
    command tells you the next stop, and <ansi fg="command">quests</ansi> lists everything
    you have taken on.
  hints: Go north past the Awakening Pool and keep north up the basalt stair to the
    Chrysalis School Hall. Walking in is enough.
  # Gated on Toke's Road's end, which Toke's own hand-in grants (the chain
  # rule, #375 phase 7). The breadcrumb reads true before and after Hadwen has
  # sent the player, and tells a sent player what the [?] line is for.
  breadcrumb: Cleric Hadwen at the pool sends new folk to me. When he has sent you,
    tell me so, and I will walk you round the whole town.
  questRequired:
  - 88-end
  questExcluded:
  - 31-start
  - 31-end
  grantsQuest: 31-start
  moodChange: friendly
- key: footing_unopened
  kind: info
  label: Do you have any work for me?
  text: Eager! I respect it. But the pool comes first. The rule is not mine. It
    is just the order the coulee works in. Cleric Hadwen, north side of the square. Come
    back Opened and I will put your feet to work.
  hints: Go north to the Awakening Pool and type talk hadwen.
  questExcluded:
  - 30-end
  - 31-start
  - 31-end
- key: footing_turnin
  kind: handin
  quest: 31
  label: Find Your Footing
  playerLine: I've seen the school, the shop, and the inn.
  text: 'And done! Slates, shelves, taps: the whole hub in one walk. Now listen,
    because this is the part I save for people who finish things. The coulee has seven
    mouths, seven breaks in the rim, and past every one somebody or something that
    will teach you what the town cannot. Fighting, forge-smoke, the green reek of
    potions, wild country, the quiet folding art, old stones that talk if you read
    them, and a far hill where they put things down at distance. And under the
    talus the old mine, which is no mouth, but it teaches the dark. Pick any of them
    and I will point you at its teacher, one at a time, in any order your boots hold.'
  hints: Quest complete. Toke can now send you down any of the eight trails. Choose
    one below. The map command shows what you have found.
  questRequired:
  - 31-lantern
  questExcluded:
  - 31-end
  grantsQuest: 31-end
  moodChange: friendly
# #375 phase 7: each line's last giver sends the player back to Toke with a
# Report to Toke bridge (quests 90 to 97). Toke takes every bridge hand-in.
# They sit above the eight offers, as footing_turnin does, because the menu
# follows file order and the [?] line is the next thing to do. Menu numbers
# shift with what is open, which the owner has ruled is fine.
- key: report_fighting_in
  kind: handin
  quest: 90
  label: Report to Toke (Fighting)
  playerLine: Garve sends word. The bandit tower has fallen.
  text: Fallen? Hoy! The low mouth will have that across the square before you finish
    your sentence. Garve's tower, taken by someone who could not hold a cudgel a few
    days ago. That is the kind of news I like best. The fighting trail is yours, and
    any mouth you have not walked yet is still open to you.
  hints: Quest complete. Toke can still send you down any trail you have not walked.
  questRequired:
  - 90-start
  questExcluded:
  - 90-end
  grantsQuest: 90-end
  moodChange: friendly
- key: report_smithing_in
  kind: handin
  quest: 91
  label: Report to Toke (Smithing)
  playerLine: Ovell sends word. The beast in the mine is dead.
  text: The stone-blooded beast? Dead? Then the deep vein is open, and every smith in
    Gaius will want to know who opened it. Leave that to me. The forge trail is yours,
    and any mouth you have not walked yet is still open to you.
  hints: Quest complete. Toke can still send you down any trail you have not walked.
  questRequired:
  - 91-start
  questExcluded:
  - 91-end
  grantsQuest: 91-end
  moodChange: friendly
- key: report_brewing_in
  kind: handin
  quest: 92
  label: Report to Toke (Brewing)
  playerLine: Falv sends word. The spirit of the swamp is gone.
  text: Gone? The thing at the heart of the mire? Hoy! Birna will brew a toast and
    Falv will pretend he did not want one. The brewing trail is yours, and any mouth
    you have not walked yet is still open to you.
  hints: Quest complete. Toke can still send you down any trail you have not walked.
  questRequired:
  - 92-start
  questExcluded:
  - 92-end
  grantsQuest: 92-end
  moodChange: friendly
- key: report_tracking_in
  kind: handin
  quest: 93
  label: Report to Toke (Tracking)
  playerLine: Delk sends word. The pack is broken.
  text: Broken? The alpha too? Hoy! The steppe folk will sleep with their doors open
    tonight, and I will tell them whose doing it was. The wilderness trail is yours,
    and any mouth you have not walked yet is still open to you.
  hints: Quest complete. Toke can still send you down any trail you have not walked.
  questRequired:
  - 93-start
  questExcluded:
  - 93-end
  grantsQuest: 93-end
  moodChange: friendly
- key: report_casting_in
  kind: handin
  quest: 94
  label: Report to Toke (Casting)
  playerLine: Keeper Orrin has nothing left to teach me in the grove.
  text: Nothing left? Then the grove made a caster out of you, and the whole hub will
    know it by supper. I will see to that myself. Any mouth you have not walked yet
    is still open to you.
  hints: Quest complete. Toke can still send you down any trail you have not walked.
  questRequired:
  - 94-start
  questExcluded:
  - 94-end
  grantsQuest: 94-end
  moodChange: friendly
- key: report_lore_in
  kind: handin
  quest: 95
  label: Report to Toke (Lore)
  playerLine: I looked on the thing beneath the old shrine.
  text: Beneath the shrine? Sere let you see it? Then you know more than half the
    coulee and all of the council. I will tell it carefully, mind. Some stories get
    bigger every time they cross the square, and that one starts big. Any mouth
    you have not walked yet is still open to you.
  hints: Quest complete. Toke can still send you down any trail you have not walked.
  questRequired:
  - 95-start
  questExcluded:
  - 95-end
  grantsQuest: 95-end
  moodChange: friendly
- key: report_archery_in
  kind: handin
  quest: 96
  label: Report to Toke (Archery)
  playerLine: Skell is off the overlook, and the canyon is ours.
  text: Off the overlook! The low mouth has been aching to shout that for years. Stand
    back a pace, friend. This one carries. The archery trail is yours, and any mouth
    you have not walked yet is still open to you.
  hints: Quest complete. Toke can still send you down any trail you have not walked.
  questRequired:
  - 96-start
  questExcluded:
  - 96-end
  grantsQuest: 96-end
  moodChange: friendly
- key: report_shadows_in
  kind: handin
  quest: 97
  label: Report to Toke (Shadows)
  playerLine: Dace says the Shadows line is done.
  text: Done, is it? Gethin's lantern and Dace's quiet hands. I hear you went down
    into the mine and came back out of it, which is the part most folk skip. Any
    mouth you have not walked yet is still open to you.
  hints: Quest complete. Toke can still send you down any trail you have not walked.
  questRequired:
  - 97-start
  questExcluded:
  - 97-end
  grantsQuest: 97-end
  moodChange: friendly
# R21: the eight trails, each its own offer after Find Your Footing. Each
# starter item rides on the offer of the quest it belongs to. Toke is the
# only starter of the eight (#375 phase 7); each first teacher takes the
# hand-in and points a newcomer back here. Quest 50's pouch of shot comes
# from its own quest_granted 50-start trigger (missing_item 30064).
- key: send_drill
  kind: offer
  quest: 32
  label: First Blood
  playerLine: Who can teach me to fight?
  text: Drillmaster Vorn, at the Drill Yard. He turns raw into ready, and you will
    hear him before you see him. Take this cudgel to him. He will tell you when to
    pick it up. From this square go north to the pool, then east four times, past
    the shore path, the Mending Hut and the dry coulee mouth, to the yard itself.
  hints: Accept, and Toke hands you a cudgel. From Hub Square, go north, then east
    four times to the Drill Yard. Type talk vorn.
  breadcrumb: Walk the town with me first. After that, I can send you down any of
    the eight trails.
  questRequired:
  - 31-end
  questExcluded:
  - 32-start
  - 32-end
  grantsQuest: 32-start
  givesItem: 10043
- key: send_forge
  kind: offer
  quest: 35
  label: First Heat
  playerLine: Who can teach me to work iron?
  text: Smith Rusk, at the Coulee Smithy. Few words and good iron. She will show you
    how raw stock becomes a blade. From this square go north to the pool, then follow
    the path west five times to the smithy. Talk to her before you touch her stall.
  hints: From Hub Square, go north, then west five times to the Coulee Smithy. Type
    talk rusk.
  questRequired:
  - 31-end
  questExcluded:
  - 35-start
  - 35-end
  grantsQuest: 35-start
- key: send_brew
  kind: offer
  quest: 38
  label: First Brew
  playerLine: Who can teach me to brew?
  text: Herbalist Birna, at the Sheltered Pool. She makes salves out of roots and
    patience, and she will teach you both. From this square go south to Market Row,
    east twice through Coulee Provisions to the Reedwash Mouth, then south twice down
    to her pool.
  hints: From Hub Square, go south, east, east, south, south to the Sheltered Pool.
    Type talk birna.
  questRequired:
  - 31-end
  questExcluded:
  - 38-start
  - 38-end
  grantsQuest: 38-start
- key: send_steppe
  kind: offer
  quest: 41
  label: First Sign
  playerLine: Who can teach me to read the wild?
  text: Scout Tarn, out at the Steppe Edge. She reads ground the way Croup reads
    a ledger. From this square go west twice, along the stilt-house walk and into
    the scrub draw, then south twice through the scrub mouth. She will show you your
    first sign.
  hints: From Hub Square, go west twice, then south twice to the Steppe Edge. Type
    talk tarn.
  questRequired:
  - 31-end
  questExcluded:
  - 41-start
  - 41-end
  grantsQuest: 41-start
- key: send_folding
  kind: offer
  quest: 44
  label: First Casting
  playerLine: Who can teach me to cast spells?
  text: Adept Grieve, in the old observatory past the reed jetty. Quiet, and stranger
    than he lets on, but he knows the folding art. From this square go west, then
    north three times up the shore to the Stargazer Cut, and climb up twice to the
    Observatory Hall. Talk to him there.
  hints: From Hub Square go west, north, north, north, up, up to the Observatory Hall.
    Type talk grieve.
  questRequired:
  - 31-end
  questExcluded:
  - 44-start
  - 44-end
  grantsQuest: 44-start
- key: send_folk
  kind: offer
  quest: 47
  label: First Words
  playerLine: Who can teach me the ways of the folk?
  text: Elder Wenna, at the farmstead up the north shore. She teaches the ways of the
    folk, and her first lesson is a short one. From this square go east, then north
    six times, up the east shore and the cartway to the Commons Yard. Talk to her
    there.
  hints: From Hub Square go east, then north six times to the Commons Yard. Type talk
    wenna.
  questRequired:
  - 31-end
  questExcluded:
  - 47-start
  - 47-end
  grantsQuest: 47-start
- key: send_range
  kind: offer
  quest: 50
  label: First Shot
  playerLine: Who can teach me to shoot?
  text: Marksman Iden, on the terraces up the bluff. She teaches the long shot. I
    have a sling for you to take along. From this square go north to the pool, east
    twice to the Mending Hut, then north to the Bluff Steps. Climb up, go north twice,
    and up once more to the Firing Range. Talk to her there.
  hints: Accept, and Toke hands you a sling. From Hub Square go north, east, east,
    north, up, north, north, up to the Firing Range. Type talk iden.
  questRequired:
  - 31-end
  questExcluded:
  - 50-start
  - 50-end
  grantsQuest: 50-start
  givesItem: 10038
# #375 phase 7: the Shadows line starts here like every line. The road to the
# Mine Head crosses three rooms of hostile creatures, so the offer says so.
- key: send_light
  kind: offer
  quest: 98
  label: First Light
  playerLine: Who can teach me about the dark?
  text: Lamplighter Gethin, at the Mine Head. He keeps the lamps for the old mine,
    and he knows more about light and dark than anyone in the coulee. Fair warning,
    it is a long walk and not a safe one. Past the Coulee Smithy the path climbs the
    talus, and the scavengers and lurkers on that slope attack on sight. One at a
    time you can beat them, but not all of them in a row, so rest between fights. If
    one turns against you, flee, and keep trying, because the quick ones often block
    you. If you have never been in a fight, see Drillmaster Vorn first.
  hints: From Hub Square go north, west five times to the Coulee Smithy, north,
    west five times to the Mine Mouth, then down. Type talk gethin.
  questRequired:
  - 31-end
  questExcluded:
  - 98-start
  - 98-end
  grantsQuest: 98-start
# #375 phase 7: once all eight bridges are in, Toke offers Esk's Road (89),
# which Cleric Hadwen offered before this pass.
- key: road_esk
  kind: offer
  quest: 89
  label: Esk's Road
  playerLine: Is there anything left for me to learn here?
  text: Not from me, and not from anyone I know. Every teacher in the coulee
    has sent you back to me, all eight of them. The rest of Gaius is waiting.
    Warden Esk keeps the arch in the Threshold House. Go and tell him you are
    ready.
  hints: From Hub Square go south twice, through Market Row, to the Threshold
    House. Type talk esk.
  questRequired:
  - 90-end
  - 91-end
  - 92-end
  - 93-end
  - 94-end
  - 95-end
  - 96-end
  - 97-end
  questExcluded:
  - 89-start
  - 89-end
  grantsQuest: 89-start
- key: esk_road_when
  kind: info
  label: When will you send me out into the world?
  text: When every teacher in the coulee has sent you back to me, all eight of
    them, I have one last road for you. But nobody is kept here. Warden Esk will
    open the arch for you whenever you ask.
  hints: Warden Esk keeps the arch in the Threshold House. From Hub Square go
    south twice.
  questRequired:
  - 31-end
  questExcluded:
  - 89-start
- key: footing_step_school
  kind: info
  label: Where do I go first?
  text: 'Not done yet, friend, and the order matters. Slates first: the Chrysalis
    School Hall, up past the pool and the basalt stair. Shelves and taps after that.
    If you get turned around, the map command shows where your feet have been.'
  hints: Go north past the Awakening Pool and keep north up the basalt stair to the
    school hall. Walking in is enough.
  questRequired:
  - 31-start
  questExcluded:
  - 31-school
  - 31-end
- key: footing_step_list
  kind: info
  label: Where is the shop?
  text: 'Slates done, so the shelves are next. Trader Onna keeps Coulee Provisions,
    off Market Row. Look over her stock before you spend: a buyer who looks first
    pays less for regret.'
  hints: Go south to Market Row, then east into Coulee Provisions, and type list.
  questRequired:
  - 31-school
  questExcluded:
  - 31-list
  - 31-end
- key: footing_step_buy
  kind: info
  label: What should I buy?
  text: 'You have seen Onna''s stock. The cotton shirt is the one: cheap, warm, and
    better than bare skin. You have coin enough.'
  hints: At Coulee Provisions, type buy cotton shirt.
  questRequired:
  - 31-list
  questExcluded:
  - 31-shop
  - 31-end
- key: footing_step_equip
  kind: info
  label: I bought the shirt. What now?
  text: A shirt in your pack is a shirt keeping nobody warm. Put it on. Gear only
    works when you wear it.
  hints: Type equip cotton shirt.
  questRequired:
  - 31-shop
  questExcluded:
  - 31-equip
  - 31-end
- key: footing_step_lantern
  kind: info
  label: Where is the inn?
  text: 'Dressed and ready! Last stop is the taps: The Drowned Lantern, the inn off
    Market Row. Put your head in the door and come back to me.'
  hints: Go south to Market Row, then west into The Drowned Lantern. Walking in is
    enough.
  questRequired:
  - 31-equip
  questExcluded:
  - 31-lantern
  - 31-end
- key: mouths
  kind: info
  label: What are the seven mouths of the coulee?
  text: Seven breaks in the coulee rim, and a path through every one. I call them
    mouths because the town eats what they bring back. Fighting in one, smithing in
    another, brewing, the wilds, folding (the quiet art, mind you), old lore, and
    the far hill where they teach the long shot. The paths are marked off the shore
    and the square. Walk any of them. Walk all of them if your boots hold. The old
    mine under the talus is no mouth, but it makes an eighth trail, if you want to
    learn the dark.
  hints: The mouths open off the edges of town. The map command shows what you
    have found so far. Choose a line below to learn the way to the drill yard,
    the terrace or the steppe.
  marked: true
- key: way_drill_yard
  kind: info
  label: How do I get to the Drill Yard?
  text: 'The Drill Yard? Easy walking. From this square go north to the pool, then
    east four times: the shore path, the Mending Hut, the dry coulee mouth, and the
    yard itself. Drillmaster Vorn will be the one shouting.'
  hints: 'From Hub Square: north, then east four times.'
- key: way_long_terrace
  kind: info
  label: How do I get to the Long Terrace?
  text: The terraces are up on the bluff. From this square go north to the pool, east
    twice to the Mending Hut, then north to the Bluff Steps. Climb up, go north twice,
    and up once more to the Firing Range, where Marksman Iden keeps watch. The Long
    Terrace is just east of her.
  hints: 'From Hub Square: north, east, east, north, up, north, north, up, then east
    to the Long Terrace.'
- key: way_scout_tarn
  kind: info
  label: Where can I find Scout Tarn?
  text: Scout Tarn? She keeps to the Steppe Edge, out past the scrub. From this square
    go west twice, along the stilt-house walk and into the scrub draw, then south
    twice through the scrub mouth. The Open Steppe is one more step south of her.
  hints: 'From Hub Square: west, west, south, south to the Steppe Edge.'
- key: way_mine_head
  kind: info
  label: How do I get to the Mine Head?
  text: The long way round, I am afraid. North to the pool, then west along the
    shore and the forge path to the Coulee Smithy. North into the quench shed,
    then west up the talus to the Mine Mouth, and down. Mind the scavengers and
    lurkers on the slope. They attack on sight. Lamplighter Gethin keeps the lamps
    down there.
  hints: 'From Hub Square: north, west five times, north, west five times, down.'
- key: news
  kind: info
  label: What is the news today?
  text: 'Good day for news. Every day is, if you stand in the right square. Today''s
    word: the pool is still patient, Onna''s prices are still fair, and Granny Wicker
    is still older than both. If you want your own word carried, just speak. <ansi
    fg="command">say</ansi> talks to the room you stand in, <ansi fg="command">whisper</ansi>
    reaches one ear anywhere in Gaius, and <ansi fg="command">emote</ansi> is for when
    words are too small. I use all three before breakfast.'
  hints: Choose a line below if you want to hear about the seven mouths.
- key: voices
  kind: info
  label: How do you speak with two mouths?
  text: Born with both, and glad of it. The low one carries across the square. The
    top one does the thinking. They get along better than most married couples. Folk
    stop noticing inside a week, and you will too.
  hints: Choose a line below if you would like to hear about the news or the
    seven mouths.
