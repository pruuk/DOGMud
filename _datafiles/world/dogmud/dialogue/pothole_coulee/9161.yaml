mobid: 9161
zone: Pothole Coulee
defaultMood: neutral

patterns:
  - keywords: ["hello", "hi", "greet", "hey", "hail"]
    responses:
      - "Eyes up. You walk like the canyon floor -- heavy. Up here we
          learn to be still. What do you need?"
      - "Mind the chalk-marks. Those are distances. Speak."

  - keywords: ["shoot", "sling", "bow", "range", "learn", "teach", "quest", "task"]
    responses:
      - "Shooting is the eye, not the arm. Ask me and I will put a sling
          in your hand and set you to the butt."
      - "Reach out and touch a thing from across the open. That is the
          whole craft. Ask."

  - keywords: ["eye", "eyes", "opened", "mutation", "awakening"]
    responses:
      - "The Awakening did something to my eyes -- when I look far off,
          the distance seems to fold shorter than it should. Out here
          they call it a good eye and leave it at that. So do I."

  - keywords: ["reload", "ammo", "shot", "equip", "load"]
    responses:
      - "Type equip and the weapon's name to ready it, then fire to
          loose. Your hands find the next round on their own. You only
          stop when the pouch is empty. Out of shot? Ask me."

  - keywords: ["perception", "stat", "eyesight"]
    responses:
      - "Ranged work runs on Perception -- the keen eye, the read of
          wind and distance. Shoot enough and it sharpens on its own."

  - keywords: [""]
    responses:
      - "Say it plain."
      - "I am watching the range. Talk."
      - "Out with it."

tree:
  root:
    text: "Marksman Iden. I keep the terraces."
    hints: "You could ask Iden about shooting or your task."
    variants:
      # ── Not Opened (the rite is unfinished) ──────────────
      - questExcluded: ["30-end"]
        text: "You have not been Opened yet -- I can see it in how you
          hold still, which is to say you do not. Go down to the cleric
          in the hub and walk the rite first. The eye I teach needs a
          mind that has been woken. Come back when it has."
        hints: "Return to the hub and complete the Awakening rite with
          Cleric Hadwen before training with Marksman Iden."

      # ── Ready for quest 50 ───────────────────────────────
      - questRequired: ["30-end"]
        questExcluded: ["50-start", "50-end"]
        text: "Opened, and steady enough. Good. The terraces are where
          the coulee learns to reach past arm's length. Ask me for the
          sling when you are ready to put a stone in the straw."
        hints: "Type ask iden shoot to take up the sling and the lesson."

      # ── Mid quest 50, one variant per step (one command each) ─
      - questRequired: ["50-start"]
        questExcluded: ["50-equip", "50-shoot", "50-end"]
        text: "Still at it. A sling does nothing in your pack. Ready it
          first."
        hints: "Type equip sling."
      - questRequired: ["50-equip"]
        questExcluded: ["50-shoot", "50-end"]
        text: "The sling is in your hand. The butts are down-range, east
          on the Long Terrace. Put a stone in the straw."
        hints: "Go east to the Long Terrace and type fire butt."
      - questRequired: ["50-shoot"]
        questExcluded: ["50-ambush", "50-end"]
        text: "One in the open. Now get out of sight before the next one,
          so you feel the difference."
        hints: "On the Long Terrace, type sneak."
      - questRequired: ["50-ambush"]
        questExcluded: ["50-cover_shot", "50-end"]
        text: "You know how to get out of sight. Now take the shot from
          there, before anything knows where you are."
        hints: "Go east to the Long Terrace and type fire butt."
      - questRequired: ["50-cover_shot"]
        questExcluded: ["50-end"]
        text: "I heard that one land. Tell me how it felt."
        hints: "Type ask iden done."

      # ── Quest 50 complete ────────────────────────────────
      - questRequired: ["50-end"]
        text: "You have the eye. I knew it when your first stone found
          the straw and you did not flinch at the noise. North, to the
          canyon -- Bryn holds the slot, and he will teach you the part
          I cannot from a safe terrace: shooting a thing that shoots
          back."
        hints: "Head north into the canyon and find Scout Bryn."

  nodes:
    # ── QUEST 50 OFFER (hands the sling) ──────────────────────
    - id: shoot_offer
      triggers: ["shoot", "sling", "learn", "teach", "range", "quest", "task"]
      questRequired: ["30-end"]
      questExcluded: ["50-start", "50-end"]
      grantsQuest: "50-start"
      givesItem: 10038
      text: "Here. A sling, plaited cord and a leather cradle, cheap and
        honest, and a pouch of shot to feed it. Both are yours. Ready the
        sling first. The cradle fills itself while your eye is still on
        the mark, so there is no second motion to learn. I will walk you
        through the rest one thing at a time."
      hints: "Type equip sling."

    # ── SHOT SUPPLY / RECOVERY ────────────────────────────────
    - id: shot_supply
      triggers: ["shot", "ammo", "pouch", "supply", "more", "ammunition"]
      questRequired: ["50-start"]
      questExcluded: ["50-end"]
      givesItem: 30064
      text: "Shot for the sling -- a pouch of smooth river stones. Take
        it. Each shot draws one from the pouch on its own. When the pouch
        runs dry the sling will tell you, and so will I if you ask. No
        one learns the eye on an empty sling."
      hints: "You received a pouch of shot. If you run dry, type ask iden
        shot."

    # ── SLING RECOVERY (lost the weapon) ──────────────────────
    - id: sling_recovery
      triggers: ["lost", "another", "replace", "broke", "broken"]
      questRequired: ["50-start"]
      questExcluded: ["50-end"]
      givesItem: 10038
      text: "Lost your sling already? It happens to the heavy-handed.
        Here is another -- mind it this time. Equip it, feed it shot,
        and get to the butt."
      hints: "You received a sling. Type equip sling."

    # ── FIRE / EQUIP HELP ─────────────────────────────────────
    # `reload` stays in the triggers on purpose: it is the word a player
    # who learned the old way will reach for, and this is where they
    # should land when they do.
    - id: shoot_help
      triggers: ["fire", "reload", "equip", "load", "help", "how"]
      text: "Two motions, not three. Equip: type equip and the weapon's
        name to ready it in hand. Fire: type fire and the target to
        loose. Your hands find the next round while your eye is still on
        the mark, so there is no third motion to learn -- you shoot until
        the pouch is empty, and the weapon will tell you when it is.
        Sneak first and the shot lands far harder, but only the once."
      hints: "Type equip sling. Go east to the Long Terrace and type fire
        butt. Try sneak first to shoot from cover."

    # ── QUEST 50 TURN-IN ──────────────────────────────────────
    - id: shoot_turnin
      triggers: ["done", "report", "ready", "finished", "quest", "task"]
      questRequired: ["50-cover_shot"]
      questExcluded: ["50-end"]
      grantsQuest: "50-end"
      text: "Out in the open and again from cover, and the straw has your
        mark in it both times. You felt the difference. That second one is
        the shot you save for when it matters, because you only get it
        once. The sling and the shot are yours. The eye is yours too,
        though it will want feeding. North to the canyon when you are
        ready. Bryn will teach you the rest."
      hints: "Quest complete. Head north into the canyon and find Scout
        Bryn."

memory:
  expiryPeriod: ""
