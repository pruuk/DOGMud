mobid: 9606
zone: Pothole Coulee
defaultMood: neutral
opener:
  text: Speak, or do not. I am working either way. The wards hold better down here
    than up in the sun. State your business.
topics:
- key: ward
  kind: info
  label: What do you keep down here?
  text: Chrysalis shard, binding paste, mutation catalyst. I keep what the work
    needs down here where the earth holds the wards steady. Type list and you will
    see what I have and what it costs, without wasting either of our time. Ward-work
    does not forgive carelessness. I do mine slow and underground, where the light
    behaves and the sigils hold their shape.
  hints: To see what Skell sells and what it costs, type list. For more, type help
    buy.
