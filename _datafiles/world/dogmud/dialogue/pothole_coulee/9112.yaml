# Caravan Guard Garve — Squatter's Hollow (5234). Wary, weary caravan
# guard; convoy was ambushed, left arm out of commission. Grants and
# closes quest 33 (Hold the Wash), grants 34 (Take the Tower) and the
# repeatable 53 (Cull the Wash). No combat; non_combatant is true.
# Animal-lambent eyes (Opened). Mid-ring foe context: Bandit Scout
# (9110, rooms 5232/5233/5236), Bandit Squatter (9111, rooms 5235/5236,
# drops a body vest). Reward armor: Toughened Leggings (item 20087).
#
# Directions from the hollow (verified against the room exits):
#   north -> Lower Wash (5232, scout); east -> Cracked Cistern (5235,
#   squatter); cistern northeast -> Upper Wash (5236), east twice ->
#   Broken Gate (5238), north -> Tower Base (5240), up twice -> Watch
#   Room (5242, captain). Lower Wash west three times -> Sparring Circle
#   (5229), south -> Drill Yard (5227). Mending Hut (5209) is two rooms
#   west of the Drill Yard.
#
# Variant order (first match wins):
#   1. Not Opened (no 30-end)            → redirect to Hadwen
#   2. Opened, not trained (no 32-end)   → redirect to Drillmaster Vorn
#   3. Trained, pre-offer (no 33-start)  → prompt ask garve wash
#   4-6. Mid quest 33, one per step      → that step's one command
#   7. 33 done, tower not taken          → tower offer
#   8. Mid quest 34                      → attack captain
#   9-10. Mid quest 53, one per step     → that step's one command
#   11. Completed (34-end)               → thanks + road onward
#
# Tree nodes:
#   wash_offer   — grants 33-start; triggers include quest/task (SOP)
#   wash_turnin  — grants 33-end; triggers include quest/task (SOP)

mobid: 9112
zone: Pothole Coulee
defaultMood: neutral

greetings:
  - text: >-
      You are not one of theirs. Good. Sit if you need to. I am not
      going anywhere on this arm.
    moods: ["friendly", "neutral"]

patterns:
  - keywords: ["hello", "hi", "greet", "hey"]
    responses:
      - "Garve. Caravan guard, temporarily short one good arm."
      - "Still here. The wash has not gotten worse -- that is something."

  - keywords: [""]
    responses:
      - "I am listening. Not much else I can do from this alcove."
      - "Say what you came to say. Time moves the same for wounded men."

tree:
  root:
    text: >-
      Garve. Road guard -- was road guard, until the ambush. My convoy
      made Squatter's Hollow two nights back and the bandits were
      waiting in the wash. Most of the caravan pushed through. I did
      not. This arm says I hold the hollow. It does not say I clear
      the wash alone.
    hints: >-
      You could ask about the wash, the ambush, or what he needs. His
      eyes catch the light strangely -- you could ask about them.
    variants:
      - questExcluded: ["30-end"]
        text: >-
          You have the look of someone who has not been through the
          pool yet. I will talk to anyone who sits still, but the
          folk in this coulee will take you more seriously once you
          are Opened. Cleric Hadwen, at the water -- you cannot miss
          it. Come back after.
        hints: >-
          Ask Hadwen about the Awakening Rite at the pool before
          pushing out into the wash.
      - questRequired: ["30-end"]
        questExcluded: ["32-end"]
        text: >-
          Opened, good. But you are still carrying yourself like
          someone who has not put that to work yet. The wash is not
          a forgiving place to find out for the first time. There is
          a drillmaster, Vorn, in the Drill Yard, back west along the
          wash. He turns raw into ready. Come back when you have
          worked with him.
        hints: >-
          Find Drillmaster Vorn in the Drill Yard: go north to the
          Lower Wash, west three times to the Sparring Circle, then
          south. Train with him before you fight in the wash.
      - questRequired: ["32-end"]
        questExcluded: ["33-start", "33-end"]
        text: >-
          Trained and still standing. Then maybe we can do each other
          some good. North of here, the Lower Wash has a scout on
          watch, and a squatter has dug into the old cistern east of
          this hollow. I cannot move on this arm. You might be able
          to move on their heads.
        hints: >-
          Type ask garve wash to hear what he needs.

      # ── Mid quest 33, one variant per step (one command each) ─
      - questRequired: ["33-start"]
        questExcluded: ["33-scout", "33-end"]
        text: >-
          Still in the field. Good. Scout first. There is one in the
          Lower Wash, just north of here. If a fight turns on you,
          flee. I mean it, not as advice but as the correct move.
          Fall and you wake at the Mending Hut. That is how the
          coulee works, not the end of anything.
        hints: >-
          Go north from Squatter's Hollow to the Lower Wash and type
          attack scout.
      - questRequired: ["33-scout"]
        questExcluded: ["33-squatter", "33-end"]
        text: >-
          The scout is down. Good. Now the squatter. He has dug into
          the old cistern, east of this hollow. Same rule as before:
          if it turns on you, flee.
        hints: >-
          From Squatter's Hollow, go east to the Cracked Cistern and
          type attack squatter.
      - questRequired: ["33-squatter"]
        questExcluded: ["33-end"]
        text: >-
          You have the look of someone who has been busy. Tell me how
          it went out there.
        hints: >-
          Type ask garve report.

      - questRequired: ["33-end"]
        questExcluded: ["34-start", "34-end"]
        text: >-
          You held the wash. I will not forget that. Now I will ask
          for the hard one. The bandits have a tower at the head of
          the wash, past the cistern -- old stone, not their work --
          and a captain holding the watch room at the top. She is the
          reason the rest of them have spine. Break her and you break
          the whole nest. Before you go, tell me how you fight, and I
          will drill you toward it while you climb: toward might, or
          toward finesse.
        hints: >-
          Garve is offering the tower. Choose your edge first: type
          ask garve might to be honed toward Strength, or ask garve
          finesse to be honed toward quickness. Ask garve tower for
          the full picture.

      # ── Mid quest 34 (one step: the captain) ──────────────
      - questRequired: ["34-start"]
        questExcluded: ["34-end"]
        text: >-
          Still down here? The captain is still up there. Go east to
          the cistern, northeast to the Upper Wash, and east twice to
          the Broken Gate. The tower is north of the gate. Climb the
          stairs to the watch room and put her down. A bruiser holds
          the gate, and a lieutenant sits in the barracks east of it.
          Flee and come back if you have to. The Mending Hut still
          has your name.
        hints: >-
          In the Watch Room at the top of the tower, type attack
          captain.

      # ── Mid quest 53 (repeatable), one variant per step ───
      - questRequired: ["53-start"]
        questExcluded: ["53-firstkill", "53-end"]
        text: >-
          Scout first, same as before. There is usually one in the
          Lower Wash, just north of here.
        hints: >-
          Go north from Squatter's Hollow to the Lower Wash and type
          attack scout.
      - questRequired: ["53-firstkill"]
        questExcluded: ["53-end"]
        text: >-
          One scout down. Now the squatter in the old cistern, east
          of here. The job is done when he falls.
        hints: >-
          From Squatter's Hollow, go east to the Cracked Cistern and
          type attack squatter.

      - questRequired: ["34-end"]
        text: >-
          You took the tower. I heard it go quiet up there and I knew.
          Whatever the captain was guarding is the coulee's problem
          now, not just mine -- and that is a better class of problem.
          You came in raw this morning. You are not raw anymore. The
          road out runs east when you want it. Until then, the coulee
          is glad to have you.
        hints: >-
          You have cleared Spoke A. The way deeper into the world runs
          east when you are ready.

  nodes:
    - id: wash_offer
      triggers: ["wash", "help", "clear", "bandits", "quest", "task",
                 "ambush", "convoy", "work"]
      questRequired: ["32-end"]
      questExcluded: ["33-start", "33-end"]
      grantsQuest: "33-start"
      text: >-
        Here is what I am asking. There is a scout in the Lower
        Wash, just north of here, and more of them up the bend.
        East of this hollow, a squatter has claimed the old
        cistern. Between them they own the lower wash and I
        cannot push them without this arm. You can. Scout first,
        then the squatter, then come back to me.
        One piece of advice that is not optional: if a fight
        turns against you, use flee. The wash will kill a
        careless fighter, and dead is not what either of us
        needs right now. And if you do go down, if the worst
        happens, you wake at the Mending Hut, back in the
        coulee, two rooms west of the Drill Yard. Not in a
        ditch. Not gone. You walk back and try again. That is
        how the coulee works.
        One more thing. Strip what they carry while you are at
        it. Gear does a dead bandit no good, and it will do
        you plenty.
      hints: >-
        Go north from Squatter's Hollow to the Lower Wash and type
        attack scout.
      moodChange: neutral

    - id: wash_turnin
      triggers: ["report", "done", "cleared", "clear", "finished",
                 "quest", "task", "both", "down"]
      questRequired: ["33-squatter"]
      questExcluded: ["33-end"]
      grantsQuest: "33-end"
      text: >-
        Both of them. You actually did it. I watched the bend
        all morning and nothing moved on it -- I just did not
        let myself believe yet. The hollow is holdable now.
        Take this -- it came off the last guard the convoy lost
        and it fits better on legs that are still moving. The
        coin is mine. I can spare it.
        The tower further up the wash still stands. I will have
        a clearer read on it once I can think past this arm.
        Come back when you want to look in that direction.
      hints: >-
        Quest complete. You receive leggings and a sharper
        edge in a fight. The bandit tower further up the wash
        may have more work waiting -- come back to Garve when
        you are ready.
      moodChange: friendly

    # ── MID QUEST 33 (S10): one answer per step ───────────
    # After wash_turnin, so "report" on the last step still turns in.
    - id: wash_progress_start
      triggers: ["scout", "squatter", "wash", "help", "how", "where",
                 "report", "done", "clear", "finished", "quest", "task",
                 "flee", "cistern", "bend", "bandit", "next", "what"]
      questRequired: ["33-start"]
      questExcluded: ["33-scout", "33-end"]
      text: >-
        Scout first. There is one in the Lower Wash, just north of
        here. If the fight turns on you, flee. If you fall, you wake
        at the Mending Hut and walk back. Then the squatter in the
        cistern, east of here.
      hints: >-
        Go north from Squatter's Hollow to the Lower Wash and type
        attack scout.
    - id: wash_progress_scout
      triggers: ["scout", "squatter", "wash", "help", "how", "where",
                 "report", "done", "clear", "finished", "quest", "task",
                 "flee", "cistern", "bend", "bandit", "next", "what"]
      questRequired: ["33-scout"]
      questExcluded: ["33-squatter", "33-end"]
      text: >-
        The scout is down. Now the squatter. He holds the old
        cistern, east of this hollow. If the fight turns on you,
        flee.
      hints: >-
        From Squatter's Hollow, go east to the Cracked Cistern and
        type attack squatter.
    - id: wash_progress_squatter
      triggers: ["scout", "squatter", "wash", "help", "how", "where",
                 "flee", "cistern", "bend", "bandit", "next", "what"]
      questRequired: ["33-squatter"]
      questExcluded: ["33-end"]
      text: >-
        Sounds like the wash is quieter. Tell me properly.
      hints: >-
        Type ask garve report.

    - id: tower_offer
      triggers: ["tower", "captain", "take", "assault", "watchtower",
                 "quest", "task"]
      questRequired: ["33-end"]
      questExcluded: ["34-start", "34-end"]
      text: >-
        The tower is the last of it. Stone walls at the head of the
        wash, a crew dug in -- a bruiser, a lieutenant -- and above
        them a captain who has held the watch room long enough to
        call it hers. Take her down and the rest scatter. But go in
        honed. Tell me your edge: might, if you mean to overpower her,
        or finesse, if you mean to outpace her. Choose, and I will
        drill it into you on your way up.
      hints: >-
        Choose your boon before you climb: type ask garve might to be
        honed toward Strength, or ask garve finesse to be honed toward
        quickness. The choice is permanent for this climb.
      moodChange: neutral

    - id: tower_might
      triggers: ["might", "strength", "strong", "power", "force",
                 "quest", "task"]
      questRequired: ["33-end"]
      questExcluded: ["34-start", "34-end"]
      setsQuestFlag: {key: "34-boon", value: "might"}
      grantsQuest: "34-start"
      text: >-
        Might it is. Then we build the swing: shoulder and back and
        the will to close the distance and end it. Go east to the
        cistern, northeast to the Upper Wash, and east twice to the
        Broken Gate. The tower is north of the gate. Take the stairs
        up and break her in the watch room. Come back stronger or do
        not come back small.
      hints: >-
        You have chosen the path of might (Strength). In the Watch
        Room at the top of the tower, type attack captain.
      moodChange: neutral

    - id: tower_finesse
      triggers: ["finesse", "quickness", "dexterity", "fast", "speed",
                 "agile", "quest", "task"]
      questRequired: ["33-end"]
      questExcluded: ["34-start", "34-end"]
      setsQuestFlag: {key: "34-boon", value: "finesse"}
      grantsQuest: "34-start"
      text: >-
        Finesse, then. Good for fighting someone bigger than you, and
        she will be. We sharpen the feet and the timing: be where
        the blow is not, and put yours where she is. Go east to the
        cistern, northeast to the Upper Wash, and east twice to the
        Broken Gate. The tower is north of the gate. Climb to the
        watch room and outpace her. Then come tell me how it went.
      hints: >-
        You have chosen the path of finesse (Dexterity). In the Watch
        Room at the top of the tower, type attack captain.
      moodChange: neutral

    # ── MID QUEST 34 (S10) ────────────────────────────────
    - id: tower_progress
      triggers: ["captain", "tower", "help", "how", "where", "report",
                 "done", "quest", "task", "watch", "gate", "stairs",
                 "next", "what"]
      questRequired: ["34-start"]
      questExcluded: ["34-end"]
      text: >-
        The captain holds the watch room at the top of the tower. Go
        east to the cistern, northeast to the Upper Wash, and east
        twice to the Broken Gate. The tower is north of the gate, and
        the stairs go up from there. Flee if you have to and come
        back.
      hints: >-
        In the Watch Room at the top of the tower, type attack
        captain.

    - id: arm_wound
      triggers: ["arm", "wound", "wrapped", "hurt", "injury",
                 "bandage", "cut"]
      text: >-
        Clean cut, deep enough to count. One of theirs got the
        angle on me when the wagon block went wrong. It will
        hold -- Sala at the Mending Hut wrapped it right -- but
        sword work is out until the sinew knits. A guard without
        a sword arm is a lookout, and I am a very good lookout
        from this alcove.
      hints: >-
        You could ask about the ambush, the wash, or his eyes.

    - id: ambush_lore
      triggers: ["ambush", "convoy", "caravan", "night", "wagon",
                 "attack", "attacked"]
      text: >-
        Two nights back. We were moving through after dark --
        foolish, but the schedule was tight -- and the bandits
        had the bend already. Four wagons. Three pushed through.
        One did not. I was riding the tailgate of the third
        when the block happened. I covered the gap. The wagons
        made it. I did not make it far.
      hints: >-
        You could ask about the wash, the arm, or his eyes.

    - id: eyes_lambent
      triggers: ["eyes", "lambent", "glow", "light", "animal",
                 "cat", "reflection"]
      text: >-
        The road. Years of it -- out past the settlements, past
        the lamplight, where the dark is serious about itself.
        Things shift in people who spend enough time in the real
        dark. My eyes started catching the light differently
        about four years in. I stopped mentioning it when I
        stopped being surprised by it.
      hints: >-
        You could ask about the convoy or the wash.

    - id: tower_hint
      triggers: ["tower", "further", "beyond", "deeper", "up",
                 "what", "next"]
      questExcluded: ["34-start", "34-end"]
      text: >-
        There is a structure up the wash, past the cistern.
        Stone walls -- old work, not something the bandits
        built. They are using it, which means they did not just
        camp here by chance. What they are waiting for, or who
        they answer to, I cannot tell you yet. Once this arm
        lets me think about something other than this arm, I
        will have a better answer.
      hints: >-
        Clear the wash first. Garve may have more to offer
        about the tower when you come back.

    # ── MID QUEST 53 (S10): one answer per step ───────────
    # The quest finishes on the squatter's death; there is no turn-in.
    - id: cull_progress_start
      triggers: ["scout", "squatter", "wash", "help", "how", "where",
                 "report", "done", "quest", "task", "work", "job",
                 "more", "again", "next"]
      questRequired: ["53-start"]
      questExcluded: ["53-firstkill", "53-end"]
      text: >-
        Scout first, same as before. There is usually one in the
        Lower Wash, just north of here. Then the squatter in the
        cistern. The job is done when he falls. You do not need to
        come back to me for the pay.
      hints: >-
        Go north from Squatter's Hollow to the Lower Wash and type
        attack scout.
    - id: cull_progress_firstkill
      triggers: ["scout", "squatter", "wash", "help", "how", "where",
                 "report", "done", "quest", "task", "work", "job",
                 "more", "again", "next"]
      questRequired: ["53-firstkill"]
      questExcluded: ["53-end"]
      text: >-
        One scout down. Now the squatter in the old cistern, east of
        here. The job is done when he falls.
      hints: >-
        From Squatter's Hollow, go east to the Cracked Cistern and
        type attack squatter.

    - id: cull_offer
      triggers: ["work", "again", "more", "job", "quest", "task"]
      questRequired: ["34-end"]
      grantsQuest: "53-start"
      questExcluded: ["53-start", "53-firstkill", "53-end"]
      text: >-
        There is always more work in the wash. Thin them out again:
        a scout first, then the squatter, same as before. The job is
        done when the squatter falls, and the coin finds you then.
      hints: >-
        Go north from Squatter's Hollow to the Lower Wash and type
        attack scout.
