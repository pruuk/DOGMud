mobid: 9144
zone: Pothole Coulee
defaultMood: neutral
opener:
  text: I am Grieve. I was an adept here once, when this ruin was a
    Folding-house. Now I am its caretaker, and the last of us who stayed.
  hints: Choose a line below to hear about casting or your task.
  variants:
  - questExcluded:
    - 30-end
    text: You have not been through the Awakening. The mind has to be opened before
      it can be aimed. There is nothing here for you to hold onto yet. Cleric Hadwen
      runs the rite at the reflecting pool below. Be Opened, then come back, and I
      will teach you to cast.
    hints: Find Cleric Hadwen at the reflecting pool and complete the Awakening, then
      return to Adept Grieve.
  # Crier Toke starts every trade (#375 phase 7): Grieve takes First
  # Casting's hand-in but no longer offers it.
  - questRequired:
    - 30-end
    questExcluded:
    - 44-start
    - 44-end
    text: The rite is on you. Good. Then there is something to teach, but Crier
      Toke sends me my students. Ask him in Hub Square who can teach you to cast
      spells, and come back up the stair.
    hints: Crier Toke starts every trade in the coulee. In Hub Square, type talk
      toke.
  - questRequired:
    - 44-start
    questExcluded:
    - 44-cast
    - 44-end
    text: You have not loosed it yet. North, into the Star Chamber, where the practice
      mote hangs at the mark. Type cast spike mote and let the spell go at it. Then
      come back and tell me.
    hints: Go north into the Star Chamber and type cast spike mote.
  - questRequired:
    - 44-cast
    questExcluded:
    - 44-end
    text: I felt that one fold. Tell me how it went.
    hints: Choose First Casting below to report.
  - questRequired:
    - 44-end
    text: You can cast now. It is the first and smallest sort, but the door is open and
      it does not close again. North, through the ruin, the grove begins. Keeper Orrin
      tends it. He will teach you to hold a casting while something is trying to kill
      you, which is the part that matters.
    hints: Head north through the observatory into the grove and type talk orrin to
      find Keeper Orrin.
topics:
- key: cast_turnin
  kind: handin
  quest: 44
  label: First Casting
  playerLine: I cast at the mote, and I let the spell go.
  text: You let it go instead of throwing it. I felt the fold from here. That is the
    whole foundation, and everything else is only larger folds and steadier nerves.
    Take this staff. Oak, a focus, it will steady your castings without ever casting
    for you. North now, to the grove. Orrin will teach you to hold a working together
    while the world tries to break it.
  hints: Quest complete. Head north into the grove and type talk orrin to find Keeper
    Orrin.
  questRequired:
  - 44-cast
  questExcluded:
  - 44-end
  grantsQuest: 44-end
- key: cast_help
  kind: info
  label: How does casting work?
  text: 'Casting is one command: type cast, then the spell, then what you aim it at.
    Cast spike mote, at the practice mark in the Star Chamber north of here. As for
    the working itself: three channels carry it, the body''s force, the mind''s will
    and the heart''s conviction. The spike you woke with runs in conviction, the
    heart''s channel. Willpower shapes the spike, and most of what you will cast
    after it. The more willpower you carry, the cleaner the fold holds.'
  hints: In the Star Chamber, type cast spike mote. Willpower is the stat that shapes
    the spike. For more, type help cast.
  marked: true
- key: eyes
  kind: info
  label: Why do your eyes look two ways at once?
  text: My eyes. Yes. The Folding got into them. Each one settles on a slightly
    different world, and I have stopped insisting they agree. It is not a burden.
    It is only a way of seeing twice.
- key: folding
  kind: info
  label: What is the Folding?
  text: The Folding is the place behind the world, where the ordinary rules go soft.
    Adepts read it once, from this very ruin. Where it presses close (a thin place),
    a steady mind can reach in and shape something. Most of magic is learning to
    do that without losing yourself in the reaching. You already carry the spark
    of it. The Awakening leaves everyone a little open to the Folding, which is why
    you woke with a spell. I only teach the aiming.
