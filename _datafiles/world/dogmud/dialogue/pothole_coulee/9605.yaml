mobid: 9605
zone: Pothole Coulee
defaultMood: friendly
opener:
  text: Sit a moment if the tent has room. What tore this time? I'm Bex. If it is
    cloth or leather and it has a hole in it, I can likely fix that or make you a
    new one.
topics:
- key: loom
  kind: info
  label: How do you work the loom?
  text: The loom runs from first light past dark most days. Thread spool and bone
    needle are on the shelf if you want to try your own hand at it, but honestly,
    bring it to me and save yourself the crooked seams. Coulee weave holds up better
    than most cloth against the wind and grit out here. I stitch it tight and I do
    not skimp on thread, because thread is cheaper than doing the job twice.
- key: backpack
  kind: info
  label: What do you make here?
  text: Backpacks, satchels, a good wool cloak for the cold nights. I keep the loom
    busy with all of it. Type list and you will see what I have ready and what it
    costs.
  hints: To see what Bex sells and what it costs, type list. For more, type help
    buy.
- key: station_help
  kind: info
  label: What can I make at your loom?
  text: The loom is where cloth and hide become something you can wear, and anyone
    may use it. Everyone knows the linen tunic and the cloth pants. Each takes two
    cloth strips and a thread spool. I sell the thread. Cloth strip I do not stock,
    it comes up the road from the city drapers. Hunter Delk teaches the scab-hide jerkin
    to whoever breaks the pack south of his camp, and it is made right here at this
    loom, from two pack-hide pelts off the hounds, a thread spool and a bone needle.
    The spool and the needle you can buy from me.
  hints: The loom is a crafting station. Type craft list beside it to see what you
    can make. For more, type help tailoring.
  marked: true
