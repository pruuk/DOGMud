mobid: 9136
zone: Pothole Coulee
defaultMood: neutral
opener:
  text: Tarn. I scout this ground. Not much moves on it that I miss.
  hints: Choose a line below if you want to hear about tracking or your task.
  variants:
  - questExcluded:
    - 30-end
    text: You have not been through the rite. The steppe is no place to learn that
      lesson. Cleric Hadwen runs the Awakening at the reflecting pool north of here.
      Go be Opened, then come back and I will teach you the ground.
    hints: Find Cleric Hadwen at the reflecting pool and complete the Awakening before
      returning to Scout Tarn.
  # Crier Toke starts every trade (#375 phase 7): Tarn takes First Sign's
  # hand-in but no longer offers it.
  - questRequired:
    - 30-end
    questExcluded:
    - 41-start
    - 41-end
    text: You have the rite on you. Good. I teach the ground, but Crier Toke sends
      me the ones who want it. Ask him in Hub Square who can teach you to read the
      wild. Then come find me.
    hints: Crier Toke starts every trade in the coulee. In Hub Square, type talk
      toke.
  - questRequired:
    - 41-start
    questExcluded:
    - 41-met
    - 41-end
    text: Toke sent you out to me? Good. Ask me why you came, and I will tell you
      what the ground is saying.
    hints: Choose Crier Toke sent me to learn the ground below.
  - questRequired:
    - 41-met
    questExcluded:
    - 41-track
    - 41-end
    text: Still learning. First the tracks. A hare has crossed the Open Steppe, just
      south of here. Read the ground for it.
    hints: On the Open Steppe, type track hare.
  - questRequired:
    - 41-track
    questExcluded:
    - 41-forage
    - 41-end
    text: You read the ground. Now the scrub. It looks dead and is not. See what your
      hands turn up.
    hints: Type forage.
  - questRequired:
    - 41-forage
    questExcluded:
    - 41-end
    text: You are back, and you have the look of someone who worked the ground. Tell
      me how it went.
    hints: Choose First Sign below to report.
  - questRequired:
    - 41-end
    questExcluded:
    - 42-start
    - 42-end
    text: You can read ground now. That will keep you alive longer than a sharp knife
      will. South, in the fringe, Hunter Delk keeps a camp. He will teach you the rest
      if I send you. Say the word.
    hints: Choose The Hunt below to hear what Delk teaches.
  - questRequired:
    - 42-start
    questExcluded:
    - 42-met
    - 42-end
    text: Delk is waiting in Hunter's Hollow. South four times to the Game Trail, then
      west.
    hints: From the Steppe Edge, go south four times to the Game Trail, then west into
      Hunter's Hollow. Type talk delk.
  - questRequired:
    - 41-end
    text: You can read ground now. The fringe is Delk's country. Keep your eyes on
      the line.
    hints: When you want more of the wild, Hunter Delk in Hunter's Hollow may have
      work.
topics:
- key: sign_turnin
  kind: handin
  quest: 41
  label: First Sign
  playerLine: I tracked the hare and worked the scrub.
  text: You read the ground and you worked the scrub. That is the whole foundation,
    and everything else out here builds on reading ground. Take this cloak. The wind
    has teeth after dark. When you want to learn the hunt, ask me, and I will send
    you to Delk in the fringe.
  hints: Quest complete. Choose The Hunt below to hear what Delk teaches.
  questRequired:
  - 41-forage
  questExcluded:
  - 41-end
  grantsQuest: 41-end
- key: sign_arrive
  kind: info
  label: Crier Toke sent me to learn the ground.
  text: Right. Here is the first of it. Out on the Open Steppe, just south of here,
    a hare has left a trail. Read the ground for it. That is tracking. You read what
    passed and where it went. When you have, I will show you what the scrub can feed
    you.
  hints: Go south to the Open Steppe and type track hare.
  questRequired:
  - 41-start
  questExcluded:
  - 41-met
  - 41-end
- key: hunt_offer
  kind: offer
  quest: 42
  label: The Hunt
  playerLine: Do you want me to learn the hunt from Delk?
  text: Then go south to him. Delk hunts the fringe out of a rough camp in Hunter's
    Hollow. Take this salt with you. He will want you cooking what you kill. From
    here go south four times to the Game Trail, then west into the hollow. Tell him
    Tarn says you can read ground.
  hints: Accept, and Tarn hands you a salt pouch. From the Steppe Edge, go south four
    times to the Game Trail, then west. Type talk delk.
  questRequired:
  - 41-end
  questExcluded:
  - 42-start
  - 42-end
  grantsQuest: 42-start
  givesItem: 40017
- key: sign_progress_start
  kind: info
  label: Where is the hare's trail?
  text: Not yet. First the tracks. A hare has crossed the Open Steppe, just south
    of here. Read the ground for it.
  hints: On the Open Steppe, type track hare.
  questRequired:
  - 41-met
  questExcluded:
  - 41-track
  - 41-end
- key: sign_progress_track
  kind: info
  label: I read the ground. What next?
  text: Not yet. You read the ground. Now the scrub. See what your hands turn up.
  hints: Type forage.
  questRequired:
  - 41-track
  questExcluded:
  - 41-forage
  - 41-end
- key: sign_help
  kind: info
  label: How do tracking and foraging work?
  text: 'Tracking is just paying attention on purpose. Every animal leaves a line.
    Learn to see it and the steppe stops being empty. Two things, then. Tracking:
    type track and a creature''s name to pick up its trail. Try track hare out on
    the open ground. Foraging: the scrub looks dead and is not. Healer''s root,
    thistle, other herbs if you know them. Type forage where things grow, and your
    hands and your luck decide what you turn up. Both get better the more
    you do them. It is all the same skill, the same paying-attention.'
  hints: Track follows a creature's trail. On the Open Steppe, type track hare. For
    more, type help track.
  marked: true
- key: eyes
  kind: info
  label: What did the Awakening do to your eyes?
  text: The Awakening went to my eyes. I catch movement a long way off now, and the
    world holds a little more gold than it used to. I do not complain about it.
