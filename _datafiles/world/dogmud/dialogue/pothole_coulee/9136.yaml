mobid: 9136
zone: Pothole Coulee
defaultMood: neutral
opener:
  text: Tarn. I scout this ground. Not much moves on it that I miss.
  hints: Choose a line below if you want to hear about tracking or your task.
  variants:
  - questExcluded:
    - 30-end
    text: You have not been through the rite. The steppe is no place to learn that
      lesson. Cleric Hadwen runs the Awakening at the reflecting pool north of here.
      Go be Opened, then come back and I will teach you the ground.
    hints: Find Cleric Hadwen at the reflecting pool and complete the Awakening before
      returning to Scout Tarn.
  # Crier Toke starts every trade (#375 phase 7): Tarn takes First Sign's
  # hand-in but no longer offers it.
  - questRequired:
    - 30-end
    questExcluded:
    - 41-start
    - 41-end
    text: You have the rite on you. Good. I teach the ground, but Crier Toke sends
      me the ones who want it. Ask him in Hub Square who can teach you to read the
      wild. Then come find me.
    hints: Crier Toke starts every trade in the coulee. In Hub Square, type talk
      toke.
  - questRequired:
    - 41-start
    questExcluded:
    - 41-track
    - 41-end
    text: Still learning. First the tracks. A hare has crossed the Open Steppe, just
      south of here. Read the ground for it.
    hints: On the Open Steppe, type track hare.
  - questRequired:
    - 41-track
    questExcluded:
    - 41-forage
    - 41-end
    text: You read the ground. Now the scrub. It looks dead and is not. See what your
      hands turn up.
    hints: Type forage.
  - questRequired:
    - 41-forage
    questExcluded:
    - 41-end
    text: You are back, and you have the look of someone who worked the ground. Tell
      me how it went.
    hints: Choose First Sign below to report.
  - questRequired:
    - 41-end
    text: You can read ground now. That will keep you alive longer than a sharp knife
      will. South, then, to the fringe, where the predators range. Hunter Delk keeps
      a camp out there. Tell him Tarn sent you.
    hints: Head south into the predator fringe and type talk delk to find Hunter Delk.
topics:
- key: sign_turnin
  kind: handin
  quest: 41
  label: First Sign
  playerLine: I tracked the hare and worked the scrub.
  text: You followed the line and you worked the scrub. That is the whole foundation,
    and everything else out here builds on reading ground. Take this cloak. The wind
    has teeth after dark. South now, to the fringe. Delk hunts it, and he can use
    a pair of eyes that know what they are looking at.
  hints: Quest complete. Head south into the fringe and type talk delk to find Hunter
    Delk.
  questRequired:
  - 41-forage
  questExcluded:
  - 41-end
  grantsQuest: 41-end
- key: sign_progress_start
  kind: info
  label: Where is the hare's trail?
  text: Not yet. First the tracks. A hare has crossed the Open Steppe, just south
    of here. Read the ground for it.
  hints: On the Open Steppe, type track hare.
  questRequired:
  - 41-start
  questExcluded:
  - 41-track
  - 41-end
- key: sign_progress_track
  kind: info
  label: I found the trail. What next?
  text: Not yet. You read the ground. Now the scrub. See what your hands turn up.
  hints: Type forage.
  questRequired:
  - 41-track
  questExcluded:
  - 41-forage
  - 41-end
- key: sign_help
  kind: info
  label: How do tracking and foraging work?
  text: 'Tracking is just paying attention on purpose. Every animal leaves a line.
    Learn to see it and the steppe stops being empty. Two things, then. Tracking:
    type track and a creature''s name to pick up its trail. Try track hare out on
    the open ground. Foraging: the scrub looks dead and is not. Healer''s root,
    thistle, other herbs if you know them. Type forage where things grow, and your
    hands and your luck decide what you turn up. Both get better the more
    you do them. It is all the same skill, the same paying-attention.'
  hints: Track follows a creature's trail. On the Open Steppe, type track hare. For
    more, type help track.
  marked: true
- key: eyes
  kind: info
  label: What did the Awakening do to your eyes?
  text: The Awakening went to my eyes. I catch movement a long way off now, and the
    world holds a little more gold than it used to. I do not complain about it.
