mobid: 9136
zone: Pothole Coulee
defaultMood: neutral

patterns:
  - keywords: ["hello", "hi", "greet", "hey", "hail"]
    responses:
      - "Tarn. I watch the steppe. You want to learn to read it, or you
          just passing through?"
      - "Keep your voice down and your eyes moving. The steppe talks if
          you let it."

  - keywords: ["track", "sign", "trail", "scout", "learn", "teach",
      "read", "quest", "task"]
    responses:
      - "Tracking is just paying attention on purpose. Ask me and I will
          set you a trail to follow."
      - "Every animal leaves a line. Learn to see it and the steppe
          stops being empty."

  - keywords: ["eyes", "amber", "mutation", "opened", "sight"]
    responses:
      - "The Awakening went to my eyes. I catch movement a long way off
          now, and the world holds a little more gold than it used to. I
          do not complain about it."

  - keywords: ["forage", "plants", "steppe", "scrub"]
    responses:
      - "The scrub looks dead and is not. Sage, roots, the right herbs if
          you know them -- type forage and see what your hands turn up."

  - keywords: [""]
    responses:
      - "Say what you need."
      - "The horizon is not going to watch itself."
      - "Speak, or let me work."

tree:
  root:
    text: "Tarn. Scout."
    hints: "You could ask Tarn about tracking or your task."
    variants:
      # ── Not yet Opened ───────────────────────────────────
      - questExcluded: ["30-end"]
        text: "You have not been through the rite. The steppe is no place
          to learn that lesson. Cleric Hadwen runs the Awakening at the
          reflecting pool north of here. Go be Opened, then come back and
          I will teach you the ground."
        hints: "Find Cleric Hadwen at the reflecting pool and complete the
          Awakening before returning to Scout Tarn."

      # ── Opened, not started ──────────────────────────────
      - questRequired: ["30-end"]
        questExcluded: ["41-start", "41-end"]
        text: "You have the rite on you. Good. I teach the ground -- how
          to cut a trail and follow it, what the scrub will feed you. Ask
          me about tracking if you mean to learn."
        hints: "Type ask tarn track to learn to read the ground."

      # ── Mid quest 41, one variant per step (one command each) ─
      - questRequired: ["41-start"]
        questExcluded: ["41-track", "41-end"]
        text: "Still learning. First the tracks. A hare has crossed the
          Open Steppe, just south of here. Read the ground for it."
        hints: "On the Open Steppe, type track hare."
      - questRequired: ["41-track"]
        questExcluded: ["41-forage", "41-end"]
        text: "You read the ground. Now the scrub. It looks dead and is
          not. See what your hands turn up."
        hints: "Type forage."
      - questRequired: ["41-forage"]
        questExcluded: ["41-end"]
        text: "You are back, and you have the look of someone who worked
          the ground. Tell me how it went."
        hints: "Type ask tarn done."

      # ── Quest 41 complete ────────────────────────────────
      - questRequired: ["41-end"]
        text: "You can read ground now. That will keep you alive longer
          than a sharp knife will. South, then -- the fringe, where the
          predators range. Hunter Delk keeps a camp out there. Tell him
          Tarn sent you."
        hints: "Head south into the predator fringe and type ask delk to
          find Hunter Delk."

  nodes:
    # ── QUEST 41 OFFER ────────────────────────────────────────
    - id: sign_offer
      triggers: ["track", "sign", "learn", "teach", "scout", "read",
        "quest", "task"]
      questRequired: ["30-end"]
      questExcluded: ["41-start", "41-end"]
      grantsQuest: "41-start"
      text: "Right. Here is the first of it. Out on the Open Steppe, just
        south of here, a hare has left a trail. Read the ground for it.
        That is tracking: you read what passed and where it went. When
        you have, I will show you what the scrub can feed you."
      hints: "On the Open Steppe, type track hare."

    # ── QUEST 41 TURN-IN ──────────────────────────────────────
    - id: sign_turnin
      triggers: ["report", "done", "ready", "finished", "quest", "task"]
      questRequired: ["41-forage"]
      questExcluded: ["41-end"]
      grantsQuest: "41-end"
      text: "You followed the line and you worked the scrub. That is the
        whole foundation -- everything else out here builds on reading
        ground. Take this cloak. The wind has teeth after dark. South now,
        to the fringe. Delk hunts it, and he can use a pair of eyes that
        know what they are looking at."
      hints: "Quest complete. Head south into the fringe and type ask delk
        to find Hunter Delk."

    # ── MID QUEST 41 (S10): one answer per step ───────────────
    # After the offer and the turn-in, so a fresh player still reaches the
    # offer and a player on the forage step still reaches the turn-in.
    - id: sign_progress_start
      triggers: ["quest", "task", "help", "how", "next", "done",
        "report", "ready", "finished"]
      questRequired: ["41-start"]
      questExcluded: ["41-track", "41-end"]
      text: "Not yet. First the tracks. A hare has crossed the Open
        Steppe, just south of here. Read the ground for it."
      hints: "On the Open Steppe, type track hare."
    - id: sign_progress_track
      triggers: ["quest", "task", "help", "how", "next", "done",
        "report", "ready", "finished"]
      questRequired: ["41-track"]
      questExcluded: ["41-forage", "41-end"]
      text: "Not yet. You read the ground. Now the scrub. See what your
        hands turn up."
      hints: "Type forage."

    # ── TRACK / FORAGE HELP ───────────────────────────────────
    # "track" and "trail" are here so a player who already took the lesson
    # gets help, not the "ask me and I will set you a trail" pattern; the
    # offer above still answers them first for a player who has not.
    - id: sign_help
      triggers: ["hare", "forage", "plants", "help", "follow", "track",
        "trail"]
      text: "Two things. Tracking: type track and a creature's name to
        pick up its trail -- track hare out on the open ground. Foraging:
        type forage where things grow, and your hands and your luck decide
        what you turn up. Both get better the more you do them -- it is
        all the same skill, the same paying-attention."
      hints: "Type track hare on the Open Steppe. Type forage on the
        steppe to gather. Both train the same skill."

memory:
  expiryPeriod: ""
