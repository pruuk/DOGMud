mobid: 9107
zone: Pothole Coulee
defaultMood: neutral
greetings:
- text: Mind the arch. Or don't. It has never once minded back.
  moods:
  - friendly
  - neutral
# The root text is for the Opened (30-end); the one variant covers everyone
# else, so no opener line is unreachable.
opener:
  text: Opened, and standing at my door. Then you know what to ask. The far side
    is Thornwall, all city stone and city noise, and every road in the Marches
    eventually.
    Say the word and the arch will say the rest.
  hints: When you want to cross, choose "I'm ready. Open the arch for me." To come
    back, enter the portal in the Thornwall temple.
  variants:
  - questExcluded:
    - 30-end
    text: You have the look of someone who has not met the pool yet. The arch will
      still be here after. It has outwaited everything else. Hadwen first. Then
      we will talk about the far side.
    hints: Cleric Hadwen keeps the Awakening Pool, north of Hub Square. Type talk
      hadwen there. You could also ask Esk what he watches for.
topics:
# R17: the end of Esk's Road (quest 89), offered by Cleric Hadwen after the
# rite. Crossing the arch (room 468) also closes it, through the quest's own
# room_enter trigger, so a player who crosses first is never left holding it.
- key: road_esk_end
  kind: handin
  quest: 89
  label: Esk's Road
  playerLine: Cleric Hadwen sent me. I'm ready to see the far side.
  text: Hadwen sends me the ones who are ready. The far side is Thornwall, temple
    stone and city noise, and every road in the Marches starts there. When you want
    to cross, tell me you are ready, and the arch will do the rest.
  hints: When you want to cross, choose "I'm ready. Open the arch for me."
  questRequired:
  - 89-start
  questExcluded:
  - 89-end
  grantsQuest: 89-end
# The two passage topics never show together: passage needs 30-end and
# passage_2 (the refusal) is hidden by it. The tree speaks the crossing.
- key: passage
  kind: info
  label: I'm ready. Open the arch for me.
  text: So. The coulee has taught you what it can, for now.
  hints: The arch takes a few moments to open. Stay close to Esk.
  behavior: true
  questRequired:
  - 30-end
- key: passage_2
  kind: info
  label: Can I go through the arch?
  text: The arch answers the Opened, and you are not yet. The pool comes first.
    Cleric Hadwen keeps it, at the heart of town. There is no shame in arriving unready.
    Only in staying that way.
  hints: Cleric Hadwen keeps the Awakening Pool, north of Hub Square.
  questExcluded:
  - 30-end
- key: watching
  kind: info
  label: What do you watch for?
  text: 'Folk ask what there is to guard, since the arch has stood untroubled longer
    than the town. The honest answer: I do not guard the arch from people. I sit here
    so that nobody crosses alone, frightened, or hurt, or too young to know what
    the far side asks of them. A door this old deserves a doorman. That is the whole
    of it.'
  hints: You could ask about the door itself, or his eyes.
- key: door_lore
  kind: info
  label: Who built the arch?
  text: Nobody built it. That is the first thing to know. The basalt came up folded
    this way, or was folded this way before anyone was keeping account. The Church
    says the world believes the arch into working. Granny Wicker says the arch believed
    first. I say it works, it has always worked, and it has never asked anything of
    anyone. That is better behavior than most doors.
  hints: You could ask what he watches for, or about crossing through the arch.
- key: eyes
  kind: info
  label: Why do your eyes glow like embers?
  text: They brighten when I am paying attention, which makes me a poor card player
    and an honest warden. People learn to read them faster than they learn my words.
    Saves everyone time.
  hints: You could ask about the door, or what he watches for.
