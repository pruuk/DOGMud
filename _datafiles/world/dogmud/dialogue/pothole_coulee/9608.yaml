mobid: 9608
zone: Pothole Coulee
defaultMood: friendly
opener:
  text: Sit close to the fire, and mind the smoke, it goes where it wants.
    Hungry? I'm Hesk. Pull up a stone and I will see what the kettle has going.
topics:
- key: stew
  kind: info
  label: What is cooking in the kettle?
  text: Hearty stew, herbal tea, a chowder if the traders bring clams up from the
    lake, antidote broth if the coulee has bitten you somewhere it should not have.
    Type list and you will see what is on the coals. I cook over scavenged tin
    and coulee coal, and I do not apologize for either. The coin-guards eat what I
    put in front of them and come back asking for more.
  hints: To see what Hesk sells and what it costs, type list. For more, type help
    buy.
- key: station_help
  kind: info
  label: Can I cook at your fire?
  text: Pull up a stone. This is a cooking fire, and anyone can use it. The easiest
    thing is trail rations. One raw meat and a salt pouch, and I sell you both. Dry
    the meat over the coals and it keeps for the road. Grilled meat takes the same
    two and wants eating hot. When it is done, eat it, or carry it.
  hints: The fire is a cooking station. Type craft trail rations beside it. For more,
    type help cooking.
  marked: true
