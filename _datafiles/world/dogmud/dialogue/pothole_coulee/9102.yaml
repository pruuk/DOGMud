mobid: 9102
zone: Pothole Coulee
defaultMood: friendly
greetings:
- text: Come in. Sit if you need to. Most people need to.
  moods:
  - friendly
  - neutral
opener:
  text: I am Sala, and I mend what the coulee dents. Cuts, breaks, bad nights,
    worse mornings. The beds are clean, and I keep the questions small.
  hints: You could ask about making this place your home, about healing, or about
    her third eye.
  variants:
  - questExcluded:
    - 30-end
    text: New, and not yet Opened by the pool. I can tell. The unopened hold their
      shoulders like they are still carrying the old world. See Hadwen at the pool
      when you are ready. Then come back and we will talk about keeping you in one
      piece.
    hints: Cleric Hadwen keeps the Awakening Pool, north of Hub Square. Type talk
      hadwen there.
topics:
- key: home
  kind: info
  label: Can I make this place my home?
  text: 'Listen, because this is the most useful thing anyone in this town will tell
    you. This hut is already your home. If you die while you are learning, and
    while you are learning you will, you wake up here, on a clean bed, with me
    nearby. Not in a ditch. Here. If you ever make your home somewhere else and
    want this one back, type <ansi fg="command">sethome coulee</ansi>.'
  hints: This hut is where you wake if you die. To see every place that can be
    your home, type sethome. For more, type help sethome.
  marked: true
- key: healing
  kind: info
  label: How do I heal my wounds?
  text: 'Rest mends most things: food, sleep, patience. Sleep especially. The body
    does its best work when you stop supervising it. For the rest, there are salves
    and potions, and Onna stocks the simple ones. If something is wrong that none
    of that touches, come to me and point at where it hurts.'
  hints: You could ask Innkeep Tally about sleeping at the Lantern, or ask about making
    this hut your home.
- key: eye
  kind: info
  label: What does your third eye see?
  text: It opened the year I started mending, which I have always taken as the work
    approving of me. It sees slow things, like the mend under a scab, or the fever
    before the heat. It blinks when it is thinking. Pay it no mind. It has seen worse than
    you.
  hints: You could ask about healing or about making this place home.
- key: hut
  kind: info
  label: Why is the hut up on stilts?
  text: Stilts under us because the pool floods gentle in the wet season, blankets
    because mending is half warmth, and the door is never barred. People wake here
    confused sometimes, after a bad fall somewhere far off. I keep the kettle on for
    exactly that confusion.
  hints: You could ask about making this place your home.
