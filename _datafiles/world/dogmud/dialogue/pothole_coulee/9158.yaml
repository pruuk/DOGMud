mobid: 9158
zone: Pothole Coulee
defaultMood: hostile
opener:
  # The old root line was narration, not speech; it moves to the hints, and
  # the greeting pattern's line becomes what Garrow says.
  text: What. Come to gawp like the rest? Move along.
  hints: Garrow plants himself square on the green and glares. He is in no mood to
    talk. Soft words have failed here, and it may take a harder one. You could taunt
    him.
topics:
- key: ferd
  kind: info
  label: What is this quarrel about?
  text: That old crook moved the boundary stone a full pace onto my ground and calls
    ME the liar for saying so. It is the principle. You understand? A man gives one
    pace, he gives the whole field. I am not giving the pace, and I will stand on
    this green till the moons fall before I let it lie.
- key: back
  kind: info
  label: Won't you back down?
  text: Back down? Not while there is breath in me and a wrong on the ground. Save
    your soft words. I have had a bellyful of soft words.
