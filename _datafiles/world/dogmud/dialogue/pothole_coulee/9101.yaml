mobid: 9101
zone: Pothole Coulee
defaultMood: friendly
greetings:
- text: Find a bench, friend. They all lean, but they all hold.
  moods:
  - friendly
  - neutral
opener:
  text: There you are. I'm Tally, and the Drowned Lantern is mine, with its
    taps, its stew, and the loft upstairs. Whatever the coulee took out of you
    today, one of those three puts most of it back.
  hints: You could ask about sleeping in the loft, the food and drink, or how the
    inn got its name.
  variants:
  - questExcluded:
    - 30-end
    text: New off the road and not yet through the pool? You are welcome at a bench
      all the same, but do Hadwen the courtesy before long. Folk rest easier once
      the pool has Opened them, in my experience.
    hints: Cleric Hadwen keeps the Awakening Pool, north of Hub Square. Type talk
      hadwen there. You could also ask Tally about sleeping here.
topics:
- key: sleep_lesson
  kind: info
  label: Can I sleep in the loft?
  text: 'The loft is up the stairs, with pallets and blankets, and no charge while
    you are learning the town. Go up to the loft and type <ansi fg="command">sleep</ansi>.
    The body mends itself faster asleep than any salve can manage, and <ansi fg="command">stand</ansi>
    wakes you when you have had enough. One honest warning, love: a sleeper is soft.
    Anything that catches you sleeping catches you undefended, so sleep where it
    is safe: up there, or anywhere the town wraps around you. Out in the wilds, sleep
    is a wager.'
  hints: To rest, go up to the loft and type sleep. Light or noise can wake you
    early. For more, type help sleep.
  marked: true
- key: food_drink
  kind: info
  label: What do you serve here?
  text: Stew is whatever the coulee gave us this week, and the taps pour fair. Eating
    keeps your strength honest. A hungry body mends slow and swings slower. Onna
    sells trail rations for the road. My stew is for the table, and the table is better
    company.
  hints: You could ask about sleeping in the loft, or the inn's name.
- key: name_lore
  kind: info
  label: How did the inn get its name?
  text: The first keeper hung a lantern out in the wet season and the pool rose right
    over it. The light kept burning, so they say, a foot under water and not a
    flicker of complaint. The pool gave it back in the dry. We have hung it inside ever since,
    and named the house for its patience.
  hints: You could ask about the food, or about sleeping in the loft.
- key: gills
  kind: info
  label: What are the frills at your collar?
  text: Came up from my grandmother's side, the frills. Half this town has a little
    of the pool in the blood. Useful in the wet season, when the cellar floods and
    somebody has to fetch the good barrels up. That somebody is always me, and I have
    stopped pretending to mind.
  hints: You could ask how the inn got its name.
