mobid: 9496
zone: East Road to Greenford
defaultMood: friendly
greetings:
- text: "Resting the wheel at the milepost. It is as good a place to stop as any and
    better than most."
  moods:
  - friendly
opener:
  text: "I run cargo between the Confluence basin and Greenford. Grain west, dry
    goods east. I have done it long enough to know every pothole and every good
    resting spot on the route. This milepost is a good resting spot."
  hints: "You could ask the carter how far Greenford is, what he hauls, or why he
    stops at this milepost."
topics:
# how_far (pattern) folded into distance.
- key: distance
  kind: info
  label: How far is Greenford from here?
  text: "From here? The better part of two days with a loaded cart, if the road stays
    dry and the axle agrees. This one has been disagreeing. On foot you can do it in
    a day if you keep a good pace. The last leg before Greenford gets rougher. The
    road dips toward the river crossing, and the surface breaks up where water works
    under it in the wet season. In this dry spell it is fine, just dusty. The
    crossing itself is a good stone bridge. Someone built it properly."
- key: cargo
  kind: info
  label: What do you haul?
  text: "Grain going west to the Confluence basin. Dry goods coming back east to
    Greenford: cloth, tools, made things. The university there buys a good deal of
    that kind of thing. Parchment, lamp oil, special cord for the instrument makers.
    Small loads, decent price. I have found it is better to haul the smaller valuable
    things than the large cheap ones. Less weight on the axle. My axle is a strong
    argument for that position right now."
- key: milepost
  kind: info
  label: Why stop at this milepost?
  text: "The mileposts on this road were cut before I was born. Good local stone, set
    deep. Some have shifted over the years, but this one is still plumb. I stop here
    because it is exactly the right distance for an axle to need inspection: halfway
    through the longest day's haul, and close enough to the hamlet to walk back if
    something breaks. My grandfather used this same post for the same reason. He told
    me where to stop and I believed him, which is maybe the most useful thing I
    learned from him."
