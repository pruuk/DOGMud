defaultMood: friendly
greetings:
- text: "The well is open. Wait your turn if there is a turn to wait. Rope is on the
    left."
  moods:
  - friendly
opener:
  text: "I keep the well, which means I keep the hamlet, more or less. No water, no
    hamlet. The rope, the crank, the drainage channel, all of it needs watching, and
    mostly it does not get watched until something goes wrong. Which is why I watch
    it."
  hints: "Choose a line below to hear how she tends the well, about the hamlet
    and its folk, or about the water in this dry season."
topics:
# drink (pattern) folded into well.
- key: well
  kind: info
  label: How do you look after the well?
  text: "Lower it slow. Bring it up smooth. That is all there is to drawing from a
    well. Keeping one is more. The rope I replace every second season. You can tell
    it is going before it goes, if you know what to feel for. The crank was rebuilt
    five years back, good ironwork from Kilnreach. The stone lip has been here since
    the hamlet was sunk, which is before my time. The water is clean. We have never
    had a fouling in the twelve years I have kept it, and I do not intend to start. I
    am particular about the drainage. People think drainage is boring, and then they
    get a fouled well and change their minds quickly."
- key: hamlet
  kind: info
  label: Who lives in the hamlet?
  text: "Small lot. The farmer families on the plateau, the victualler, a few carters
    who stop regular, a few craft families who settled here when the road was cut.
    We get a fair bit of through-traffic on the east road. Scholars heading for
    Greenford mostly, the odd drover, travelers who stop for bread, water, and a rest
    before the long stretch east. We are not a destination, we are a waypoint. That
    suits us fine. Waypoints do not get pillaged."
- key: dry
  kind: info
  label: How is the water holding in this dry spell?
  text: "The level is down, but not alarming yet. This plateau has old deep water
    under it, the kind that does not react fast to one dry season. What worries me
    is two dry seasons in a row. That I would feel in the bucket sound. Right now it
    sounds fine. I check it every morning and I will keep checking it. If it starts
    to sound different, I will tell the hamlet council before anyone else does,
    because I will know first."
