mobid: 9493
zone: East Road to Greenford
defaultMood: friendly
greetings:
- text: "Road is hard on the hooves in this heat. I am resting them whether the
    schedule likes it or not."
  moods:
  - friendly
opener:
  text: "Moving a small herd east to the Greenford market. I have done this route six
    times and it does not get shorter. The road is dry this season, hard on feet
    and not great for the stock."
  hints: "Choose a line below if you would like to hear about the road east,
    about the dry season and the herd, or about the Greenford market where he is
    headed."
topics:
# far (pattern) folded into route.
- key: route
  kind: info
  label: What is the road east like?
  text: "Further than it looks. Always further than it looks going east. Two more
    days to Greenford with a herd, in good weather. This weather is not good, it is
    just dry. Dust hangs on the road in the heat of the day, so I move early and
    late and rest them through the midday. You add a half-day to any drive every
    time you have to rest them twice. Still, better a slow herd that arrives than a
    fast one that does not."
- key: dry
  kind: info
  label: How is the dry season on the herd?
  text: "Worst dry stretch in three seasons. The verge grass is burnt off east of
    here, and the stock have to graze less and drink more, which means I stop at
    every trough I can find. The farmers along the road look worried. When the wheat
    farmers look worried, I look worried. They know this land better than I do."
- key: market
  kind: info
  label: What is the Greenford market like?
  text: "Greenford is a real market town. Not as big as New Plymouth, but it has the
    university, which means people with coin and a habit of wanting things. Good
    place to sell stock. They also pay more for anything the road brought through
    from the west, which I suppose includes me."
