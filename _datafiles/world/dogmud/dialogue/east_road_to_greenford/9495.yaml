defaultMood: friendly
greetings:
- text: "Oh. Hello. I am fine. Just resting the bag. It is heavier than it was in New
    Plymouth, somehow."
  moods:
  - friendly
opener:
  text: "I am travelling to Greenford to start at the university. I have an
    acceptance letter and a great many scrolls I should probably have shipped ahead
    and did not. I am learning things already, and I have not arrived yet."
  hints: "You could ask the scholar about the university at Greenford, why people go
    there to study, or what she hopes to learn."
topics:
# far (pattern) folded into university.
- key: university
  kind: info
  label: What is the university at Greenford like?
  text: "The records say the University at Greenford has been there two hundred
    years, perhaps more. It is on a hill above the river crossing, which is
    apparently where someone decided to put things that needed to last. They study
    natural history, cartography, river engineering, some philosophy. They have the
    largest collection of regional maps I have heard of outside New Plymouth, and
    many more of them are current. It is another day and a half from here, they tell
    me. Which probably means two."
- key: why
  kind: info
  label: Why do people go to Greenford to study?
  text: "Greenford is a good distance from the capital, which is either a flaw or a
    feature depending on what you are trying to do. The people who go there tend to
    want to work without interruption. Less politics than New Plymouth, and a better
    library than anywhere I know of between here and the coast. And the town itself
    is apparently very pleasant. River views, good bread, a market that does not
    close in the rain. I am told that last part matters more than you would think in
    the long winter months."
- key: learning
  kind: info
  label: What do you hope to learn there?
  text: "Cartography, specifically the eastern river country. The maps of the basin
    between here and the coast are about forty years out of date, and the river
    courses shift faster than people think. Someone needs to walk the region again
    and draw what is actually there. The university has the archive to compare
    against and the instruments I do not own yet. Also, I am twenty-two and this is
    the first time I have been more than a week from home, so I may be
    overestimating my ambitions somewhat. We will see."
