mobid: 9494
zone: East Road to Greenford
defaultMood: friendly
greetings:
- text: "Mind the wheat rows. I do not care about the road edge, but the rows took
    six months."
  moods:
  - friendly
opener:
  text: "Three generations of my family have worked this field, and my mother
    planted the first windbreak along the south edge. I have been reading it all
    season, and I do not like what it tells me. The stalks have held, but the
    ears are thin. It may come right, or it may be a poor harvest. The rain will
    decide that, not me."
  hints: "You could ask the farmer about the harvest, about the old waystone at the
    field's east edge, or about how long her family has worked this land."
topics:
# wheat (pattern) folded into harvest.
- key: harvest
  kind: info
  label: How is the harvest looking?
  text: "Short year. You can see it in the stems if you know what to look for. The
    ears are lighter than they should be for this point in the season. The stalks
    are good, because the root goes deep on plateau wheat and you cannot take that
    away from it, but the heads are not filling the way I want. Three dry months is
    three months too many for late-season grain. We need one long soaking rain. One.
    Then it might come back. Wheat is stubborn when it has to be. So am I."
- key: waystone
  kind: info
  label: What is the old waystone by your field?
  text: "The waystone? It has been there longer than the field walls. Longer than any
    farm on this plateau, as far as I know. We work around it. It is too big to move
    and too old to take a chisel to without feeling like you are doing something
    wrong. Nobody minds it being there. It is just there. Some things are just old
    and present, and that is the end of it."
  hints: "The Old Waystone stands beside the road, two rooms east of the farmer's
    field."
- key: family
  kind: info
  label: How long has your family farmed here?
  text: "My mother's mother broke this field from plateau scrub. That was fifty years
    back, before the road was cut east. In those days you could not drive stock
    through here. No road, no hamlet. Just the fields and the wind. The hamlet came
    after the road. The road came after someone decided Greenford needed a western
    route that did not go through Thornwall. That is apparently how everything in
    this part of the world gets built. Someone decides it ought to exist, and then
    slowly it does."
