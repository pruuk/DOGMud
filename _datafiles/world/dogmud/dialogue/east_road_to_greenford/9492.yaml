mobid: 9492
zone: East Road to Greenford
defaultMood: friendly
greetings:
- text: "Loaf, cheese, or plums. All of it made or dried right here. Have a look and
    tell me what the road is asking for today."
  moods:
  - friendly
opener:
  text: "I have been provisioning this hamlet for eleven years, longer than the road
    has been properly graded east. Half my customers are heading for Greenford, the
    other half are coming back from it. Both lots buy cheese, which tells you
    something."
  hints: "To see what Mistress Odell sells, type list. Choose a line below to
    learn about the travellers heading east, or about the dry weather."
topics:
# sell (pattern) folded into wares.
- key: wares
  kind: info
  label: What do you sell for the road?
  text: "The wheat loaf I bake myself, from plateau wheat grown in the fields just
    west of here. Dense and dark, and it keeps better than the soft southern stuff.
    The hard cheese comes from Kael farm across the south ridge, rind-sealed and
    sharp the way it should be. The plums I dry on the roof through the long days.
    The loaf keeps three days in this heat, the cheese a week, and the plums until
    you eat them. Between those three you can walk from here to Greenford and not
    go hungry, which is the whole point of what I sell."
  hints: "To see what she sells, type list."
- key: greenford
  kind: info
  label: Who comes through on the way east?
  text: "A good mix. Scholars mostly, young ones with too many bags and no idea how
    far east it actually is. Some traders. A few pilgrims who missed their turn at
    the Confluence and kept walking. They all want the same thing: food that
    travels, something they can eat without stopping. The scholars come back through
    looking thinner and more certain of themselves. I do not know if that is the
    university doing it or just the walking."
- key: weather
  kind: info
  label: How has the dry weather been?
  text: "Three dry months, and the wheat is showing it. Shorter stalks, thin ears.
    The farmers have not said panic yet, but I can read faces. The plums came in
    light this year, which is why I am rationing them. If it rains before the end of
    the month we will be fine. If it does not, well, that is what next year's
    planting is for. I have been here long enough to know it always rains
    eventually. Just not always conveniently."
