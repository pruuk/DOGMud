mobid: 9348
zone: New Plymouth Merchant
defaultMood: neutral
greetings:
- text: What do you need?
  moods:
  - neutral
- text: Chain, leather, or a finished piece?
  moods:
  - friendly
opener:
  text: Armor. Chain links and leather strips for smiths who work their own, and
    finished pieces for those who want them ready. Whatever you buy, I fit
    before it leaves. You're looking at my skin. Most people do. Ask about it,
    or about my stock and where the materials come from.
  hints: You could ask Brun about the armor he stocks, about where his materials come
    from, or about his skin and what the Chrysalis did to it. To see what he sells,
    type list.
topics:
- key: armor
  kind: info
  label: What armor do you carry?
  text: Chain links and leather strips for smiths, and finished pieces for those who
    want something off the rack. A chain shirt, a coif, leggings. I fit everything
    before it leaves the shop. Armor that does not fit right does not protect right,
    and I would rather spend the time fitting than have someone come back with a
    complaint after a bad outcome.
  hints: To see what he sells, type list.
  moodChange: friendly
- key: supply
  kind: info
  label: Where do your materials come from?
  text: The chain links and leather come from Dunmar's warehouse on the docks. Bulk
    material, steady grade. I inspect everything that comes in, because bulk supply
    varies and I do not pass on weak links. Heavier fittings come from the Crafting
    Quarter when I need them. The arrangement is simple and it holds.
- key: skin
  kind: info
  label: What happened to your skin?
  text: The Bloom did this. Over about four years it went from rough to what you see
    now. I did not choose it and I did not ask for it. What I found was that it makes
    fitting chain against the body reliable in a way ordinary skin does not allow. I
    can feel the pressure points the way you feel a pebble underfoot. So I use it. I
    wear the work against my own skin until I am satisfied, and then I sell it.
  hints: A plain account of something unusual.
  moodChange: neutral
