mobid: 9609
zone: New Plymouth Merchant
defaultMood: neutral
opener:
  text: Welcome to the Exchange. Master Coyne, at your service. Deposit, withdrawal,
    or simply looking? State your business and I will see to it.
  hints: Master Coyne keeps the bank. To see how much gold you have stored here,
    type bank.
topics:
- key: deposit
  kind: info
  label: How do I store gold here?
  text: A deposit is a simple matter. I record the sum against your name, and you
    will find it exactly as you left it whenever you return. The vault has never
    lost a coin under my watch, and it is not about to start.
  hints: To store gold, type bank deposit and the amount.
- key: withdraw
  kind: info
  label: How do I take my gold out again?
  text: Give me your name and I will check the ledger. If the figure is there, the
    gold will be too. Withdrawals are made in person, at a counter like this one. I
    do not send gold by messenger, no matter who asks.
  hints: To take gold out, type bank withdraw and the amount.
