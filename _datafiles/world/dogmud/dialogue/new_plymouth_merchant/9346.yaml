mobid: 9346
zone: New Plymouth Merchant
defaultMood: neutral
greetings:
- text: State your business.
  moods:
  - neutral
  - cautious
- text: I remember you. What do you need?
  moods:
  - friendly
opener:
  text: I lend coin and I collect it. That is the whole of it. I do not lend to
    strangers passing through. If you want to know about the debts I hold, or about
    what my touch tells me about coin, I will answer what I find worth answering.
  hints: You could ask Goss about his terms for a loan, about the debts he holds
    across the city's districts, or about the change that lets him weigh coin by
    touch.
topics:
- key: loans
  kind: info
  label: What are your terms for a loan?
  text: Fifteen in every hundred for half a year, against collateral I agree to hold.
    Each month past that costs five more. I do not bargain over the rate. If the
    borrower had another choice, they would be there instead of here. And I lend to
    people with a door I can knock on and a face I will see again. A traveller is
    neither.
  hints: He named his terms without apology, and made it plain he does not lend to
    you.
- key: debtors
  kind: info
  label: Whose debts do you hold?
  text: I hold paper on a fair number of households in the Common Quarter. They had
    a hard winter two years running and came to me for loans to see them through.
    Some have kept up. Some have not. I do not feel especially one way or the other
    about it. A debt is a number, and a number either clears or it does not. The
    ones that do not clear become a different kind of arrangement in the end. That is
    how this works. Everyone knew that going in.
  hints: He said it without a trace of satisfaction or regret.
- key: touch
  kind: info
  label: What does your touch tell you about coin?
  text: The Bloom did something useful with my hands, which is more than most people
    can say. I press a coin to my palm and I know its weight, its metal and its cut
    at once, the way you know whether a surface is rough or smooth. I do not
    understand how and I do not try to. It means I cannot be cheated on coin, which
    in my line of work is worth more than most changes a man could draw. No one
    passes short weight at this desk. They know that going in.
  hints: A rare moment of something like satisfaction.
  moodChange: neutral
