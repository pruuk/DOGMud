mobid: 9345
zone: New Plymouth Merchant
defaultMood: neutral
greetings:
- text: Something catch your eye, or are you here about the records?
  moods:
  - neutral
- text: I remember you. There is fresh stock on the tray.
  moods:
  - friendly
opener:
  text: Every face that crosses this floor, I remember, and every price called
    on it. The Exchange's auction floor is mine, with the lots, curios and good
    pieces that move through this district. I also keep the Square's property
    registrations and estate transfers. The wares and the Square I will discuss
    freely. About the records, I choose what I say.
  hints: You could ask Falk about his wares, about the Square and how trade runs
    here, or about the property records he keeps. To see what he sells, type list.
topics:
- key: bloom_lintel
  kind: info
  label: Who holds the house on Lintel Street?
  text: You are further into this than I would have gone. My register has 215
    Lintel Street as a private residence in the Old Quarter, down by the canals. The
    owner on paper is a name I do not expect to find breathing if anyone looked. The
    gold behind it came through the same quiet source as three other properties I
    could name, and will not. But the goods do not come and go by the front door. My
    porters say carts from that house call before dawn at an estate in the Noble
    Quarter. A servant there, a girl called Wenna, sees them come and go. She
    frightens easily. Be gentle with her. That is as far as I go.
  hints: Falk named the servant Wenna, in the Noble Quarter, who has seen the carts.
    Type talk wenna.
  marked: true
  questRequired:
  - 67-front
  questExcluded:
  - 67-lintel
  - 67-end
  grantsQuest: 67-lintel
  moodChange: cautious
- key: wares
  kind: info
  label: What do you have for sale?
  text: Good pieces. Jewelry, mostly, the kind that holds its value and moves quickly
    when the right buyer comes in. The auction floor runs on sealed bids from the
    houses I know. The tray behind me is for anyone with coin. If you have
    something worth selling, I will appraise it for a small fee and tell you
    honestly what it will fetch.
  hints: To have him value something you carry, type appraise and the item's
    name.
  moodChange: friendly
- key: square
  kind: info
  label: How does trade run in the Square?
  text: The Square is the trading heart of the capital. Most of what moves through
    New Plymouth touches this district sooner or later. The Exchange sits at the
    center of that. Goods, valuables, property transfers, we see all of it. The
    district has been stable for a long time. Stability is good for business.
- key: property
  kind: info
  label: What property records do you keep?
  text: The Exchange keeps the district's transfer ledgers. Every sale, every
    conveyance, every estate that changed hands in the last thirty years is in the
    register. That is a matter of public record. What is not entirely public is the
    pattern. Who has been buying, what they paid, and what sits between the
    registered owner and the real interest. I know the pattern. I am careful about
    what I say about it, and to whom.
  hints: He let something slip, the shape of something he is not saying.
  moodChange: neutral
- key: pattern
  kind: info
  label: What pattern do you see in the sales?
  text: Since you press, and since you do not look like one of theirs, here is the
    shape of it. Several properties have passed to owners who exist only on paper,
    and the gold behind every one of them runs back to the same quiet quarter. One in
    particular sits down in the old canal district, on Lintel Street. Registered as a
    private residence, paid up, never any trouble on the books. But goods move in
    and out of it at hours no residence keeps, and the carters who serve it serve
    nothing else in the city. I do not ask whose interest it is. A man who keeps the
    district's records learns which questions shorten his life.
  heardRequired:
  - property
  moodChange: neutral
