mobid: 9347
zone: New Plymouth Merchant
defaultMood: neutral
greetings:
- text: What are you after? Blades, ingots, or just a look?
  moods:
  - neutral
- text: Fresh stock from Halvard came in yesterday. Have a look.
  moods:
  - friendly
opener:
  text: Steel is my trade, finished blades and the raw metal for smiths who
    would rather work their own. You may ask about the blades, or how my supply
    reaches me. You will also ask about the third arm, so you may as well get it
    over with.
  hints: Choose a line below on her blades, her steel or the third arm. She
    seems worried about a tribute and an audit. To see what she sells, type list.
  # Quest 71 states (first match wins; HasQuest is also true at every later step).
  variants:
  - questRequired:
    - 71-end
    text: My deposit came back this morning and my permit cleared. Nobody said why.
      Nobody needed to.
    hints: Choose a line below if you want to hear about her blades, about where
      her steel comes from, or about the third arm. To see what she sells, type
      list.
  # The hand-in reads the step and requiresItem, so the openers do too.
  - questRequired:
    - 71-ledger
    questExcluded:
    - 71-end
    requiresItem: 40119
    text: Is that what I think it is? Put it on the counter.
    hints: Choose The Tribute below to give Dame Ostry the ledger page.
  # A lost page: the parlor gives another.
  - questRequired:
    - 71-ledger
    questExcluded:
    - 71-end
    itemExcluded: 40119
    text: You found a page? Then where is it? I cannot appeal on your word.
    hints: If you lost the ledger page, another is still in the private parlor of
      the Gilt Threshold. Type search there.
  - questRequired:
    - 71-horst
    questExcluded:
    - 71-ledger
    - 71-end
    text: Horst talked to you? Then he told you where to look, whether he meant to or
      not.
    hints: The papers are in the private parlor of the Gilt Threshold, through the
      curtain to the east of its taproom. Type search there.
  - questRequired:
    - 71-vell
    questExcluded:
    - 71-horst
    - 71-end
    text: Vell sent you upward? Then go up. I want to know who is at the top.
    hints: Horst keeps the Watched House Gate, north of the Watched Lane. Type talk
      horst.
  - questRequired:
    - 71-start
    questExcluded:
    - 71-vell
    - 71-end
    text: Have you been to Vell yet? He is right up the alley. He will not like being
      asked.
    hints: Clerk Vell keeps the Permit Office, north of Coin Alley. Type talk vell.
topics:
- key: q71_start
  kind: offer
  quest: 71
  label: The Tribute
  playerLine: Do you want help with the tribute and the audit?
  text: Help? Take talk first, it is cheaper. I pay the tribute like everyone. A cut
    of what I take in, every quarter, to the bloodline through Vell's office. Fine.
    But now there is an audit on my books and my deposit is held, and between the
    two I am bleeding for no reason anyone will put in writing. I am too practical
    to rage at it. What I want is to understand it. If you will do it, go and ask
    Clerk Vell what the tribute actually pays for, and whether there is any floor
    under it at all. Start there. See how far it goes.
  hints: Accept, then find Clerk Vell in the Permit Office, north of Coin Alley.
    Type talk vell.
  questExcluded:
  - 71-start
  - 71-end
  grantsQuest: 71-start
  moodChange: neutral
- key: ledgerhandoff
  kind: handin
  quest: 71
  label: The Tribute
  playerLine: I found a page of the tribute ledger. Here it is.
  text: Let me see it. There it is in the original hand. The sums, the dates, and
    Horst's mark beside every one of them. This is what an appeal actually needs.
    I will not forget this.
  questRequired:
  - 71-ledger
  questExcluded:
  - 71-end
  requiresItem: 40119
  grantsQuest: 71-end
- key: blades
  kind: info
  label: What blades do you carry?
  text: Ingots for smiths, and finished blades for people who want something ready
    to use. Iron and steel both, a dagger and two longswords. The steel is Halvard's
    work from the Crafting Quarter. The iron comes through the docks warehouse. I
    grade everything that comes in. Nothing on that rack is there by accident.
  hints: To see what she sells, type list.
  moodChange: friendly
- key: supply
  kind: info
  label: Where does your steel come from?
  text: The raw iron comes from Dunmar's warehouse on the docks. Bulk import,
    standard grade. That goes to Halvard's forge in the Crafting Quarter. He turns it
    into something worth selling. His better blades come up to me on a regular
    schedule, and I move them at a proper price rather than the craft-district rate.
    He gets a fair split and I get good stock. The arrangement has held for three
    years.
- key: third_arm
  kind: info
  label: How did you come by the third arm?
  text: It grew in the second year after the Bloom started. Slowly at first, then at
    a pace that was frankly alarming until it finished. Full feeling, full strength,
    full range of motion. I spent about a week being bothered by it and then I went
    back to work, because there was work to do, and an extra hand turns out to be
    genuinely useful in this trade. I can grade an edge, test the balance, and hold
    the piece steady at the same time. I do not miss not having it.
  hints: She said it completely matter-of-factly.
  moodChange: friendly
