mobid: 9350
zone: New Plymouth Merchant
defaultMood: friendly
greetings:
- text: Welcome in. What can I get you?
  moods:
  - friendly
  - neutral
- text: Good to see you again. The usual?
  moods:
  - friendly
opener:
  text: Come in and get warm. This is the Gilt Threshold, and it is a quiet
    house, with good wine, a warm bowl and a fire that stays lit. Ask me about
    the rooms, or what we serve at the bar. And there is the private parlor at
    the back. Some rather notable guests come through that door.
  hints: You could ask Madam Sephe about the rooms upstairs, about the food and drink
    she serves, or about the private parlor and the guests who use it. To see what
    she sells, type list.
topics:
- key: lodging
  kind: info
  label: Do you have a room free upstairs?
  text: Four rooms upstairs, and every one of them is let by the season to guests who
    keep long accounts with me. Nothing is free just now, and I do not turn out a
    regular for a stranger, however kindly the stranger asks. The rooms are clean and
    the locks work. I have a reputation for a quiet house, and I intend to keep it.
  moodChange: friendly
- key: food
  kind: info
  label: What do you serve at the bar?
  text: Spiced wine by the cup, hearty stew when the pot is on, and trail rations
    for travellers who want something that keeps. The wine is the house's pride. I
    blend the spices myself and I will not tell you the ratio. The stew is fresh most
    evenings. I am told it is good. I try not to be the one who says that about my
    own cooking.
  hints: To see what she sells, type list.
  moodChange: friendly
- key: parlor
  kind: info
  label: Who uses the private parlor?
  text: The parlor is for guests who prefer their conversations away from the bar. I
    rent it by the evening to people who value privacy and can pay for it. I do not
    discuss the names of the people who use it. That is rather the point of a private
    parlor. What I will say is that the business done there tends to be the kind that
    shapes how things work in this district. Beyond that, I am afraid I have wine to
    pour.
  hints: She confirmed the parlor is where serious business happens, and that she
    will not tell you more than that.
  moodChange: neutral
