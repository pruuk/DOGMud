mobid: 9360
zone: New Plymouth Temple
defaultMood: neutral
greetings:
- text: You are not a novice and you are not one of the senior keepers. Good. Look
    at this wall. The weathering on that mortar is not from the founding period. I
    have been saying this for two weeks.
  moods:
  - neutral
- text: You again. Have you had a look at the inscription yet? Has it changed your
    mind, or do you still need convincing?
  moods:
  - friendly
opener:
  text: The eastern inscription is not from the founding period. I have the
    weathering data, the depth of the cuts, and a comparison with stonework in the
    civic quarter that is known to be older than the city. The founding plaque is
    wrong, by at least a century. Do you want the argument, or were you here for
    something else?
  hints: Scholar Dross is very worked up about something. Choose a line below to
    learn about the inscription and his evidence, about a cipher he found in the
    old temple carvings, or about why no one in authority will listen to him.
  # Quest 69 states first (first match wins; HasQuest is also true at every
  # later step, so each variant excludes the step after it).
  variants:
  - questRequired:
    - 69-gallery
    questExcluded:
    - 69-end
    carriesItem: 40116
    text: Is that her reading? Give it here. Carefully.
    hints: Choose The Gallery Cipher below to give Dross Keeper Lysha's reading.
  - questRequired:
    - 69-reading
    questExcluded:
    - 69-end
    text: You reached her? Then where is her reading? I need it in her hand, not
      in your memory.
    hints: If you lost Keeper Lysha's reading, she can write it out again. She keeps
      the Art Gallery in the Noble Quarter and sleeps upstairs at night. Type talk
      lysha.
  - questRequired:
    - 69-gallery
    questExcluded:
    - 69-reading
    - 69-end
    text: Have you found the keeper yet? Lysha, in the Noble Quarter gallery. The
      third panel from the left.
    hints: From the Temple Courtyard, go south twice into the Sanctuary, then west
      six times to the Gilded Walk. Go north into the Gilt Threshold, west twice to
      the Processional, North End, then north four times to the Palace Processional.
      Go west into the Administrative Office, then north into the Art Gallery. Lysha
      keeps the hall in the morning and evening, works upstairs in the afternoon,
      and sleeps upstairs at night. Type talk lysha.
  - questRequired:
    - 69-rubbing
    questExcluded:
    - 69-gallery
    - 69-end
    carriesItem: 40115
    text: Is that the rubbing? Show me. Show me now.
    hints: Choose I have the rubbing from the reliefs below.
  - questRequired:
    - 69-rubbing
    questExcluded:
    - 69-gallery
    - 69-end
    text: You took the rubbing? Then where is it? Paper does not walk off on its own.
    hints: If you lost the rubbing, take another. The processional reliefs are in the
      Grand Temple Sanctuary, south twice from the Temple Courtyard. Type look
      reliefs.
  - questRequired:
    - 69-start
    questExcluded:
    - 69-rubbing
    - 69-end
    text: Have you been to the reliefs yet? The north wall of the sanctuary, at waist
      height. You cannot miss them if you look.
    hints: From the Temple Courtyard, go south twice into the Grand Temple
      Sanctuary. The processional reliefs run along its north wall. Type look
      reliefs.
  # The staring opener shows exactly when `knower` does: 77-end and no quest
  # 69 token (HasQuest("69-start") stays true through 69-end).
  - questRequired:
    - 77-end
    questExcluded:
    - 69-start
    text: Wait. Stop there. No, do not speak yet. Let me look at you. The eastern
      inscription is a century older than its plaque says, and even that can wait.
    hints: Scholar Dross is staring at you as if he can see where you have been.
  - questRequired:
    - 77-end
    - 69-end
    text: It holds. Every line of it holds. Wait. Stop there. No, do not speak yet.
      Let me look at you.
    hints: Scholar Dross is staring at you as if he can see where you have been.
  - questRequired:
    - 69-end
    text: It holds. Every line of it holds. Now all I need is someone with power who
      is obliged to be honest. I am still looking.
    hints: Choose a line below if you want to hear about the inscription, the
      cipher in the old carvings, or why no one in authority will listen.
topics:
- key: q69_start
  kind: offer
  quest: 69
  label: The Gallery Cipher
  playerLine: Do you want help proving the inscription is older?
  text: Help? Most people will not even listen. The eastern inscription is older than
    the founding it is supposed to record. I have the weathering data and the stone
    comparison. And the processional reliefs in the nave hide the real date in the
    hand positions of the figures. I cannot read the full sequence without the key,
    and the key is a set of panels in the Noble Quarter gallery, where my formal
    inquiry has gone unanswered for a year. But you are not a formal inquiry. Make me
    a rubbing of those reliefs in the sanctuary and bring it here. That is where it
    starts.
  hints: Accept, then go to the Grand Temple Sanctuary, south twice from the Temple
    Courtyard. The processional reliefs run along its north wall. Type look reliefs.
  questExcluded:
  - 69-start
  - 69-end
  grantsQuest: 69-start
- key: give_40116
  kind: handin
  quest: 69
  label: The Gallery Cipher
  playerLine: Keeper Lysha read the third panel against the rubbing.
  text: You reached her. You actually reached her. The third panel, painted from
    life, of a structure that stands inland of the docks, exactly where the cipher's
    geometry points. The rubbing and the panel agree. The same hand, or the same
    workshop, and they agree. Then it is settled, as far as evidence settles
    anything. The inscription is older than the founding. The founding date is
    wrong. And everything the bloodline holds in law comes from a date that is wrong.
    You should know what you have helped prove. And be careful who you prove it to.
  questRequired:
  - 69-gallery
  questExcluded:
  - 69-end
  requiresItem: 40116
  grantsQuest: 69-end
  bumpsRep:
  - faction: cooperage_circle
    delta: 5
# The rubbing step (was q69_gallery plus give_40115, the item_give route): the
# rubbing is shown, never taken (carriesItem), so `give rubbing dross` resolves
# here and the player keeps it for Lysha.
- key: q69_gallery
  kind: info
  label: I have the rubbing from the reliefs.
  text: Let me see it. Yes, yes, this is the sequence. But it runs past what I can
    anchor without the gallery's panels to fix the zero point. Keep the rubbing. You
    will need it where I am sending you. Go to the Noble Quarter gallery. There is a
    guide, Ferrol, who will walk you past the portraits and call the older panels
    decorative. They are not. Get past him to the keeper. Her name is Lysha. Tell her
    you have come about the third panel from the left. She will know what you mean.
  hints: Dross read part of the cipher but needs the gallery's key. Keeper Lysha
    keeps the Art Gallery in the Noble Quarter and sleeps upstairs at night. Type
    talk lysha.
  marked: true
  questRequired:
  - 69-rubbing
  questExcluded:
  - 69-gallery
  - 69-end
  carriesItem: 40115
  moodChange: friendly
- key: knower
  kind: info
  label: Why are you looking at me like that?
  text: Stop. Stand still and let me look at you. I have spent my whole life being
    the only man in the room who could see the crack in the wall, and being told I
    was mad for it, and I know that look, because I have worn it. You have been
    somewhere. You have seen the thing under the thing. Do not tell me what. No, I
    am not being modest, I am being careful, which is new for me and does not suit
    me. My little forgery is a founding date off by a century. Yours is bigger. I can
    smell it. Whatever you found out east, it makes my inscription look like a
    spelling error, and if you say it in this hall they will not merely change the
    subject the way the Canon changes it with me. Guard it. I have wanted an ally who
    could see for twenty years. Now that one is standing in front of me, I find I am
    afraid of what you see.
  hints: Scholar Dross has recognized something in you and will not let you say it
    aloud here.
  questRequired:
  - 77-end
  questExcluded:
  - 69-start
  moodChange: cautious
