- key: inscriptions
  kind: info
  label: What is wrong with the eastern inscription?
  text: The weathering rate of limestone mortar in this climate is well documented.
    I have three reference surveys. The mortar on the eastern inscription has
    weathered as far as work done about a century and a half before the date on the
    plaque. The depth of the cut letters fits that same period. I compared it with
    the old foundation stones in the civic quarter, the ones known to be older than
    the city, and the profile matches. The inscription was made before the founding.
    The plaque saying when it was made is wrong. That is the argument. It is not a
    subtle argument.
  moodChange: friendly
- key: cipher
  kind: info
  label: What cipher did you find in the old carvings?
  text: Along the north wall of the nave there are processional relief figures. Old,
    very old, made before the plaque they are supposed to illustrate. The hand
    positions of those figures hide a sequence of numbers. I counted them four
    separate times. The sequence is not decoration. It is a date, the real founding
    date or something close to it, set into the art by whoever paid for it,
    presumably because they knew the official record was going to be wrong. The key
    to reading the whole cipher is in the Noble Quarter gallery. There are panels
    there from the same workshop, the same hand, the same code. I have sent a formal
    request to examine them. I have not heard back.
  moodChange: neutral
- key: ignored
  kind: info
  label: Why will no one in authority listen to you?
  text: The founding date is not only a fact of history. It is a fact of law. The
    ruling family's charter, their property, their authority in the city courts,
    all of it comes from the founding and its date. If the real founding was a
    century earlier, the original charter was with a different family entirely. The
    current family's claim to the city rests on a date I am now certain is wrong.
    That is why the Canon changes the subject when I raise it. That is why my formal
    inquiry to the Noble Quarter gallery has not been answered. They know. I think
    they all know. Saying so in writing would mean taking a side.
  moodChange: cautious
