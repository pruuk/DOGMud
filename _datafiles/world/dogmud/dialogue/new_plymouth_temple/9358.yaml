mobid: 9358
zone: New Plymouth Temple
defaultMood: neutral
greetings:
- text: Welcome. Take a moment if you need one. What brings you to the Canon's cell?
  moods:
  - neutral
- text: You came back. I am glad. What is it this time?
  moods:
  - friendly
opener:
  text: Peace to you. I am Canon Merid. This temple exists to serve. We give
    blessings, we keep the records, and we care for the keepers who pass through
    the house. If you are looking for something here, I will try to help you
    find it, or tell you honestly why I cannot.
  hints: Choose a line below to hear about blessings and the faith's work, about
    the Archive and who may read in it, or about how the temple stands with the
    city.
topics:
- key: blessings
  kind: info
  label: What does a blessing do?
  text: A blessing is a formal act of the faith, a seal on an intention, a mark of
    the community's witness. I grant them for new postings, for departures, for
    grief, for recovery. They are not magic in the mechanical sense. They are a way
    of saying that something matters, and that those who practice here acknowledge
    it. Beyond blessings, the temple's work is pastoral. Keepers who counsel, a
    healer who tends the chapel, records that keep the community's history legible.
    The work is quieter than most people expect and more necessary than most people
    know.
  moodChange: friendly
- key: archive
  kind: info
  label: What is kept in the Archive?
  text: The Archive holds the temple's historical and administrative records.
    Ceremonial documents, community histories, some civic letters going back to the
    founding. The public collection is open to readers with credentials from my
    office, in the morning hours. There is also a Restricted Collection, kept
    separately. It is under particular oversight and is not open to general readers.
    The archivist at its door manages who may enter.
- key: restricted
  kind: info
  label: What is in the Restricted Collection?
  text: The Restricted Collection holds materials that need a certain context to read
    usefully. That is the most accurate thing I can say about it. Entry is not
    granted through this office alone. The archivist at the door manages it, and it
    needs approval from two sources. I am one. I do not discuss what the second is,
    or what the collection holds. If you have a scholar's purpose, the archivist can
    begin the inquiry. Most inquiries do not go very far.
  heardRequired:
  - archive
- key: order
  kind: info
  label: How does the temple stand with the city?
  text: The temple has always existed within the life of the city. Faith and the
    ordering of civic life are not separate things. They light each other, when the
    relationship is well tended. The present arrangement in New Plymouth reflects a
    long history of that tending. I find it well ordered. The faith serves its
    purpose and the city's administration serves its own, and they complete each
    other. I do not think it useful to be more specific than that. The order of
    things is larger than any one account of it.
  moodChange: cautious
