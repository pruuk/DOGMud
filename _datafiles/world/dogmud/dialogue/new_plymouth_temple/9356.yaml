mobid: 9356
zone: New Plymouth Temple
defaultMood: neutral
greetings:
- text: If you are looking for the intake desk, it is in the Keeper's House, west
    of the hall. Father Thane handles registration.
  moods:
  - neutral
- text: Back again. What do you need?
  moods:
  - friendly
opener:
  text: I run the hall. I receive who comes, keep the house in order, and make sure
    the keepers have what they need for their work. Nineteen years of that, and I
    find it entirely satisfactory. I am not the one to ask about most things, but I
    can usually point you to who is.
  hints: You could ask Yelin about the Keeper's House, about his long years of
    service here, or about the faith as he sees it from the hall.
topics:
- key: house
  kind: info
  label: What is the Keeper's House?
  text: The Keeper's House is the temple's living side. Keepers who come to serve
    take their meals here, sleep upstairs, and receive their daily work. This hall
    is the first room they see when they arrive. I make sure it is orderly. I know
    every keeper who has passed through this door for nineteen years. A number of
    them I knew before they were keepers.
  moodChange: friendly
- key: service
  kind: info
  label: What has kept you here so long?
  text: It stopped being a choice a long time ago, if it ever was one. I came here
    at twenty-four to sweep the hall, and the hall needed sweeping again the next
    day, and one day nineteen years had gone by. I do not miss the life I might
    have had elsewhere. The house is quiet, the work is useful, and the keepers who
    pass through are generally worth looking after. That is more than most people
    can say about their circumstances.
- key: faith
  kind: info
  label: Do you share the keepers' faith?
  text: I am not a keeper. I have never taken orders or a congregation. I make the
    beds and sweep the floor and carry what needs carrying. But I have watched a
    great many keepers come through this hall, some frightened, some serene, some
    who were one and then became the other, and I think whatever they find here is
    real. I cannot say more than that. I have not needed to.
