mobid: 9391
zone: New Plymouth Temple
defaultMood: neutral
greetings:
- text: If you are here for the altar, I have what you need. Candles, incense,
    charms.
  moods:
  - neutral
- text: The gate is open. Let me know what you are looking for.
  moods:
  - friendly
opener:
  text: Few go to the altar empty-handed if they can help it. I am the almoner
    at the gate, and I keep what they might bring inside. Candles, incense,
    charms, whatever the occasion asks. Ask what each one is for, or about the
    temple, and I will tell you.
  hints: You could ask Almoner Sten about the offerings he sells, about the temple
    through the gate, or about why people bring offerings at all. To see what he
    sells, type list.
topics:
- key: offerings
  kind: info
  label: What is each offering for?
  text: The incense is for the air around the altar. It carries an intention upward,
    or so it is said, and whether or not that is literally true, it changes the
    quality of attention in the room. A votive candle is a kept flame. You light it
    at the altar and let it burn through. What it marks is between you and whatever
    you are marking it for. A folk charm is older than the temple's own rites, but I
    carry them because the wish behind them is the same as any other offering.
    Tallow candles are plain working light. Some people want something useful
    rather than ceremonial, and I do not argue with that. Whatever you bring, the
    altar takes it as given.
- key: temple
  kind: info
  label: What lies through the gate?
  text: The Grand Temple. East through the gate is the sanctuary, and the high altar
    is east of that. This plaza is where people stop before they decide whether to
    go in. Some of them do. Some sit by the gate for a while and then leave. I do not
    press anyone. I keep the table here from first light until late in the evening.
- key: devotion
  kind: info
  label: Why do people bring offerings at all?
  text: That is a question I hear more often than you might expect, and not usually
    from the irreverent. People who have suffered something come here and want to
    know if there is a reason to leave a candle rather than nothing at all. My honest
    answer is that I cannot tell you what the altar receives. What I can say is that
    the act of bringing something, of choosing it, buying it, carrying it in, changes
    something in the person who does it. The offering is often more for the giver
    than for anyone else. That does not make it small. It makes it sensible.
  moodChange: friendly
