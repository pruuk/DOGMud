mobid: 9359
zone: New Plymouth Temple
defaultMood: cautious
greetings:
- text: Oh, I didn't hear you come in. I was looking at the wall again. There's a
    pattern in the plasterwork, a particular shape. It doesn't matter. Sorry. Can I
    help you with something?
  moods:
  - cautious
  - neutral
- text: You again. I'm... yes. Did you go to Orin? Did he have the maps?
  moods:
  - friendly
opener:
  text: I was looking at the wall again. There is a shape in the mortar lines, an
    eight-pointed arrangement in an old style, and I cannot find it in any of the
    approved texts. I've stopped mentioning it to the senior keepers. They tell me
    it isn't real. Was there something you wanted?
  hints: Novice Ept seems distracted and unsettled. Choose a line below if you
    would like to hear about his doubts and the founding story he has been
    taught, or about the eight-pointed shape he keeps seeing.
topics:
- key: doubt
  kind: info
  label: What troubles you about the founding story?
  text: The founding story is that the temple was established at the city's
    founding. Same generation, same charter. That is what we are taught. But the
    inscription in the eastern nave does not match that date. The stone is older. A
    visiting scholar named Dross has been saying the same thing for weeks, louder
    than I would say it, but he is not wrong about the evidence. If the inscription
    is older than the founding, then the founding story is not the whole story. That
    is what I cannot stop thinking about.
  moodChange: neutral
- key: symbol
  kind: info
  label: What is the shape you keep seeing?
  text: I started noticing it two weeks into my first posting here. Eight points
    arranged around a central ring, like a diagram of orbits, in a style older than
    anything in the approved texts. It is in the stonework. In the wood grain of the
    dormitory ceiling. In the shadow lines across the plaster when the light hits the
    wall at the right angle. I mentioned it to Canon Merid and he told me to pray on
    it. I tried that. It didn't help. A lay reader in the scriptorium told me there
    is a bookseller in the Crafting Quarter, a man named Orin, who carries old maps
    from before the official survey. He might know what the symbol means. I have not
    been able to go myself.
  moodChange: neutral
- key: orin
  kind: info
  label: What do you hope Orin can tell you?
  text: I don't know him myself. The lay reader told me he keeps a bookstall in the
    Crafting Quarter, not far from the old shuttered cooperage. He carries maps older
    than the official city survey, which means older than the founding story as the
    temple tells it. If the symbol I keep seeing is in those maps, if it has a name,
    or a place in the record, he would know it. That is all I have. I keep meaning to
    find a free afternoon to go myself, but the Canon keeps posting me to afternoon
    scripture study.
  hints: Orin's Bookstall is just east of the Inkwalk, in the Crafting Quarter.
  heardRequired:
  - symbol
  moodChange: friendly
