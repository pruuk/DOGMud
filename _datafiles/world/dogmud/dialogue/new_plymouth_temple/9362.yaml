zone: New Plymouth Temple
defaultMood: cautious
greetings:
- text: The Restricted Collection is not open. If you have a reader's credential from
    the Canon's office, present it and I will verify it. If you do not, this door is
    not for you.
  moods:
  - cautious
- text: You again. The answer is still no. Is there something else I can help you
    with?
  moods:
  - neutral
opener:
  text: The Restricted Collection is not open. If you have a reader's credential from
    the Canon's office, I can verify it here. If you do not, then my door is not for
    you. Is there something specific you would like to ask, or were you simply
    curious about the door?
  hints: You could ask Archivist Holt about the Archive he manages, about what it
    would take to get through this door, or about the offices he answers to.
topics:
- key: archive
  kind: info
  label: What does the Archive hold?
  text: The Archive holds the temple's historical and administrative records.
    Ceremonial documents, community histories, civic letters going back to the
    founding. The public collection is open to credentialed readers in the morning
    hours. The Restricted Collection is a separate section, catalogued separately,
    open only under separate approval. I manage entry to both. That is what I do. It
    is most of what I do.
- key: entry
  kind: info
  label: What would it take to get through this door?
  text: A reader's credential needs a formal application to the Canon's office, a
    stated purpose for the research, and the Canon's written approval. That opens
    the public collection only, morning hours. The Restricted Collection needs a
    separate approval, from the Canon and from a second office of oversight. I will
    not tell you what office that is. That information is not public. In practice, no
    one without standing approval has been given new entry to the Restricted
    Collection in my time here. I do not know how long that was true before me.
- key: authority
  kind: info
  label: Which offices do you answer to?
  text: I serve the Canon's office and I serve a second office of oversight. Those
    are the two. The second is not part of the temple. It comes from elsewhere in the
    city's administration. I will not name it, because that is not public and it is
    not mine to share. What I can tell you is that both approvals are required for
    the Restricted Collection, and that neither office has asked me to explain the
    arrangement to visitors. I am telling you this because you asked, not because it
    is useful to you. It is not useful to you.
  moodChange: neutral
