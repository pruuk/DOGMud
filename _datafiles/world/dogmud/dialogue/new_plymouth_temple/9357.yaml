zone: New Plymouth Temple
defaultMood: neutral
greetings:
- text: This is the intake desk. If you are here to register, I will walk you through
    it. What brings you in?
  moods:
  - neutral
- text: I remember you. Has something come up, or is this a different matter?
  moods:
  - friendly
opener:
  text: This is the intake desk. I register keepers arriving for residence and
    visitors with appointments. If you have another purpose here, questions about
    how the house is run or something harder to name, I can probably help with that
    too. What is it?
  hints: You could ask Father Thane about how registration works, about how the
    house is run from day to day, or about what the temple offers people who are
    grieving.
topics:
- key: intake
  kind: info
  label: How does registration work?
  text: The registration is straightforward. I take a keeper's name and prior
    affiliation, record the posting, and give them a copy of the house rules. The
    Canon confirms postings on two set days each week. A keeper who arrives between
    those days has a short wait in a guest room, and I see that it is comfortable.
    The whole process takes very little time and produces no surprises.
  moodChange: friendly
- key: operations
  kind: info
  label: How is the house run from day to day?
  text: The house has its rhythms. Morning prayers, meals at set hours, turns at the
    cleaning and the repairs. I keep the register current, the Canon approves
    postings and gives the morning blessing, and the warden keeps the hall and the
    common rooms in order. The healers and the scholars work more on their own, but
    within the same structure. It is not complicated. Complications arise when the
    structure is not respected, and they resolve themselves when it is.
- key: grief
  kind: info
  label: What does the temple offer people who grieve?
  text: The temple's first pastoral work is grief. That is what most people who come
    here without an appointment are carrying. We do not require a particular form
    of it. It does not have to look a certain way or happen on a certain timeline. If
    someone needs to sit in the chapel and be quiet for an hour, that is available.
    If someone needs to speak with a keeper, I can arrange that. We do not turn that
    work away.
  moodChange: friendly
