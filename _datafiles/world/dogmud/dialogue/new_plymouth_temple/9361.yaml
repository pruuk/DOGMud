mobid: 9361
zone: New Plymouth Temple
defaultMood: friendly
greetings:
- text: Come in. The chapel is open to anyone who needs it.
  moods:
  - friendly
  - neutral
- text: You're back. I hope whatever brought you here first has mended.
  moods:
  - neutral
opener:
  text: The chapel is open and I am in it. The sick and the hurt of this city come
    here, whoever they are, and I do what I can for them. If you are curious about
    the work, or about the healer in the Common Quarter, I can answer that too.
    What is it?
  hints: Choose a line below if you want to hear about her healing work, about
    the healer named Ysolde in the Common Quarter, or about who she will and
    will not help.
topics:
- key: healing
  kind: info
  label: How does the chapel's healing work?
  text: The rule here is simple. I look at what is wrong and I try to put it right.
    I do not ask where someone got it, who gave it to them, or whether there are
    circumstances they would prefer not to discuss. People who need tending get
    tended. The chapel has what I need for most things. Poultices, clean cloth,
    water that stays reasonably hot, and these hands, which run warmer than they
    should. For serious injuries there are limits to what I can do here, and I say
    so honestly when someone has reached them. There is no fee. That is not how this
    works.
- key: ysolde
  kind: info
  label: What do you think of the healer Ysolde?
  text: I know her by reputation. This work is a small enough community that word
    travels. She is competent. She is careful with her patients, which matters more
    than a credential. She tends people who cannot come here for one reason or
    another, which means she handles things I would handle if those people could
    walk through this door. The difference between us, as far as I can tell, is that
    I am in a building with a sign on it and she is in an alley without one. I do not
    think that difference reflects especially well on the sign. She does what she
    does because people need it and she can do it. That is reason enough.
- key: turn_away
  kind: info
  label: Is there anyone you will not help?
  text: No one. That is the only answer I have to that question and it has not
    changed. I have tended people who were going to use the health I gave them for
    things I disagreed with. I have tended people who had done things I could not
    approve of. Need is need. It is not a moral judgement. If someone comes through
    that door with something that needs tending, I tend it. That is all there is to
    it.
  moodChange: neutral
