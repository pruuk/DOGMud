mobid: 9536
zone: Cascade Pass Road
defaultMood: gruff
greetings:
- text: "You are a fair way up for a traveler. Mind the sawpits. They are cut deeper
    than they look."
  moods:
  - gruff
- text: "If you are after work, I have a full crew. If you are just passing, keep
    clear of the falling side."
  moods:
  - gruff
opener:
  text: "Camp-foreman, aye. I run the western cut. Fell it, square it, stack it
    to season, haul it down to Greenford before the passes ice. Honest work and
    it pays. We are a good camp, so long as a man does not ask me the one thing
    every traveler seems to want to ask, which is why we do not take the closer
    timber. I take from the west. I have my reasons and they are mine. Ask me
    anything else and I will answer it."
  hints: "Choose a line below to learn about the camp and the work, about the
    eastern timber the crews leave standing, or about the man who keeps to the
    top of the pass."
topics:
- key: eastern
  kind: info
  label: Why do the crews leave the eastern timber?
  text: "The eastern stand. Aye. Better grade than what we cut, closer haul, any fool
    with an eye can see it standing there. We take from the west. The ground is bad
    over east. Soft in the wrong places, roots that do not hold a man's weight. The
    crews will not go, and I do not press them to. A faller got hurt up that way,
    years back, and it put a mood on the whole business that never once lifted. That
    is reason enough for me. You want the long timber, you cut the west slope twice
    as far and you carry it twice as far, and you do not ask me again about the
    east. I have given you all the reasons I have."
  hints: "Bertt glances east through the tree line, then away."
# lumber (pattern) folded into camp.
- key: camp
  kind: info
  label: How is the work going here?
  text: "Straightforward enough. Good wood, honest work, steady crew. I run the
    western cut: fell, square, stack, and season the timber until it is fit to haul
    down. Six good hands in the crew, and they know the saw without me telling them
    twice. We are up here through the season and down before the passes close. It
    pays a man fair. I have run bigger camps and I have run worse ones. This one I
    have no complaint about. And no, I am not hiring."
- key: hermit
  kind: info
  label: Who keeps to the top of the pass?
  text: "Him. There is a fellow lives up at the top of the pass, past where our cut
    ends. Came back out of the east some years ago short a hand and short most of his
    talking, and he has kept to that overhang ever since. I leave him be. He has
    never done a soul any harm. Keeps a fire, watches that road like it owes him
    money. If you are set on going east, and you have the look of it, same as he must
    have had once, you could do a good deal worse than sit at his fire first and
    hear him out. I will not tell you to go up there. I will not tell you not to.
    That is his business and yours, not mine."
  hints: "The man Bertt means keeps a fire at the Survivor's Shelter, high on the
    pass. From the camp, go north to the track, east five times, up three times,
    east twice to the Wind-Gap, then north."
  marked: true
