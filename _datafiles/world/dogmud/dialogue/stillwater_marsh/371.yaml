mobid: 371
zone: Stillwater Marsh
defaultMood: neutral
opener:
  text: Aye. Mind the soft ground here. Was there something?
  hints: You could ask Tova about her work, the dangers of the marsh, or where she
    stays.
topics:
- key: forage
  kind: info
  label: What do you gather out here?
  text: I gather what the marsh gives. Mint, willow-bark, the odd lake-iron nodule
    when the bottom-mud throws one up. The town apothecary takes most of it. The smith
    takes the rest. It is honest work and the marsh does not begrudge it, which is
    more than you can say for some places I could name.
- key: danger
  kind: info
  label: What should I watch out for in the marsh?
  text: Marsh-rats are no trouble, dragonflies less. The river-otters and the snapping
    turtles I leave alone. They know the deep channels better than I do, and they
    hold a grudge. The bog-adder I avoid on principle. If I cannot manage, I have
    a way home.
- key: stillwater
  kind: info
  label: Where do you stay?
  text: I winter at the temple in town. The priests do not mind a forager warming
    a corner pew on cold nights, and the font-water keeps my tools from rusting. I
    bring the satchel into town when it is full, and the merchants who want my work
    know where to find me.
- key: caravan
  kind: info
  label: Do you ever go up the north road?
  text: I do not go up to the north road. The caravan handles the Thornwall trade.
    The bandits up that way are not my problem and I would like to keep it that way.
