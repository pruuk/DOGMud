mobid: 342
zone: Stillwater
defaultMood: neutral
opener:
  text: These are the Stillwater docks, and I am Arn. I keep the ledgers and
    settle the moorings. Take a bench if you want to watch the boats go out.
    Fewer go out than should, lately. If you have business, I am listening.
  hints: You could ask Arn about himself, the docks, or the bounty on the lake caves.
  variants:
  - questRequired:
    - 19-end
    questFlagRequired:
      19-completion: full
    text: The one who killed the sump dweller. Sit any time. The docks rest easier
      with that thing dead. I will not forget it.
    hints: You could ask Arn about the docks or the caravan.
  - questRequired:
    - 19-end
    questFlagRequired:
      19-completion: partial
    text: The shallows are quieter than they were. That is something. The deep is
      still the deep, but at least the nets come back whole now.
    hints: You could ask Arn about the docks or the caravan.
  - questRequired:
    - 19-signed
    questExcluded:
    - 19-end
    carriesItem: 40054
    text: Is that the proof in your pack? Hand it over and the dock fund pays out.
    hints: Two entries below share the title The Lake-Caves Bounty. Choose the one
      that hands over the tooth for the full reward.
  - questRequired:
    - 19-signed
    questExcluded:
    - 19-end
    text: You signed the upgraded bounty? Drunn told me. If you finish the job in
      the deep sump, bring me the proof and I will pay out from the dock fund.
    hints: For the full reward, kill the sump dweller in the Hollow Sump, the deepest
      cave, and bring Arn its tooth. To close the bounty now for the smaller purse,
      choose The Lake-Caves Bounty below.
  - questRequired:
    - 19-start
    questExcluded:
    - 19-signed
    - 19-end
    text: Still on the constable's bounty? The cave mouth is north along the docks,
      past the boat pier. You will see the notice nailed up. Mind the dark, and report
      to Drunn when the job is done.
    hints: From the Fishing Docks, go north to the Net Yard, then east, north and
      east to the Cave Mouth. Go down into the caves.
topics:
- key: arnhandoff
  kind: handin
  quest: 19
  label: The Lake-Caves Bounty
  playerLine: Here is a tooth from the sump dweller.
  text: I will be damned. There really WAS one. I have not got Drunn's purse, but
    the dockmen keep a fund for things like this. Take it. And thank you. For the
    men I sent down there before I knew what was waiting.
  questRequired:
  - 19-signed
  questExcluded:
  - 19-end
  requiresItem: 40054
  grantsQuest: 19-end
  setsQuestFlag:
    key: 19-completion
    value: full
  givesGold: 350
  moodChange: grateful
- key: redirect_to_drunn
  kind: info
  label: Who pays the bounty on the caves?
  text: The cave creatures have been raiding the nets, and the constable has had a
    bounty posted for nearly a fortnight now. I am not the one who pays it, though.
    Constable Drunn handles the official bounty. You will find him at the constabulary,
    on the east side of North Square. Tell him I sent you if you like.
  hints: From the Fishing Docks, go south, then west twice to Lakefront Square. Go
    north twice to North Square, then east into the Constabulary. Type talk drunn.
  marked: true
  questExcluded:
  - 19-start
  - 19-end
  moodChange: friendly
- key: take_partial
  kind: handin
  quest: 19
  label: The Lake-Caves Bounty
  playerLine: Close the bounty now. I will take the smaller purse.
  text: Closing out the bounty here? That is fine. The shallows are safer and the
    lake-folk owe you for that. The dock fund will cover it. Take it and have a drink
    at the Pike & Lantern on us.
  questRequired:
  - 19-signed
  questExcluded:
  - 19-end
  grantsQuest: 19-end
  setsQuestFlag:
    key: 19-completion
    value: partial
  moodChange: grateful
- key: caves_info
  kind: info
  label: Where is the cave mouth?
  text: North along the docks. Past the net yard and the boat pier, the path turns
    east along the lakeshore. The cave mouth is at the end. You cannot miss the bounty
    notice the constable nailed up. Mind the dark when you go in.
  hints: From the Fishing Docks, go north to the Net Yard, then east, north and east
    to the Cave Mouth. Go down into the caves.
  questRequired:
  - 19-start
  questExcluded:
  - 19-end
- key: tooth_info
  kind: info
  label: What do you know about the sump dweller?
  text: The sump dweller is the thing in the deep that I should have warned my men
    about before I let them go down there. If you kill it and bring back a tooth,
    bring it to me or to Drunn. Either of us will pay out the full bounty. I will
    believe it when I see the tooth.
  hints: The sump dweller lives in the Hollow Sump, north of the Pool Chamber at the
    back of the caves.
  questRequired:
  - 19-signed
  questExcluded:
  - 19-end
- key: who
  kind: info
  label: Who are you, dock master?
  text: Arn. I keep the dock ledgers, settle the mooring disputes, and try to know
    which tides run where. Twenty-two years on these planks. The lake teaches you
    more than you ever wanted to know.
- key: docks
  kind: info
  label: How is the fishing out on the lake?
  text: Stillwater fishes the shallows mostly. The lake is bigger than people from
    inland think, but the deep water is treacherous and we leave it alone. Or we used
    to. Lately the trouble has come to us instead.
- key: caravan
  kind: info
  label: Do you trade with the caravan?
  text: Ketil and I trade weather and lake-condition reports each layover. The docks
    load some Thornwall-bound freight onto his wagons, smoked fish, tanned hides,
    the small things that travel well. Marta keeps a courteous distance from my paperwork.
    We get along.
