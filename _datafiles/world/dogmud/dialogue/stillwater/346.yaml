mobid: 346
zone: Stillwater
defaultMood: friendly
opener:
  text: Hey there! I am Luc. I am only fishing the shallows today, nothing
    exciting. You look like you are heading somewhere a lot more interesting
    than this. Go on, ask me anything.
  hints: Choose a line below if you would like to hear about the fishing, the
    strange currents, or what old Hodder taught him.
topics:
- key: lake
  kind: info
  label: How is the fishing in the shallows?
  text: I keep to the nearshore since the currents shifted. Hodder says watch the
    tides and I am watching the tides. The catch is short but it is not zero. I can
    live with short if it stays safe.
- key: hodder
  kind: info
  label: What has Hodder taught you?
  text: Hodder knows the lake better than anyone. I watch how he reads the water,
    the colour, the current direction, which way the birds are sitting. He does not
    teach, exactly. He just does things in front of you and waits for you to copy
    them. It takes a while but it works.
- key: cave
  kind: info
  label: What is strange about the currents?
  text: The cave currents have been off since two seasons back. I can feel it in the
    shallows when the wind drops. The water moves the wrong way. Hodder said stay
    east of the second marker-stake, so I stay east of the second marker-stake.
