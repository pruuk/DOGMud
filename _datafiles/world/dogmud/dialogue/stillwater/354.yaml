mobid: 354
zone: Stillwater
defaultMood: neutral
opener:
  text: Oswin. I used to fish. A coin if you have one to spare.
  hints: Choose a line below if you would like to hear about his fishing days or
    what he saw on the lake.
topics:
- key: boat
  kind: info
  label: What happened to your boat?
  text: I fished for twelve years. My boat went down two seasons back. She took on
    water at the seam and was not worth repairing. Since then I have been doing what
    odd work comes by. Not enough of it.
- key: boat_2
  kind: info
  label: Have you seen boats lost out there?
  text: There was a boat went down in the deep channel some years back. Not mine.
    I remember it, though. The dock master logged it as a storm casualty, but the
    weather that night was clear. I was on the shallows and I saw the light go out.
    Nobody talked about it much. I have thought about it since.
- key: lake
  kind: info
  label: What do you make of the lake lately?
  text: The lake has moods. I have been watching it for twenty years between fishing
    and sitting here. When it goes quiet like this, with the boats staying close,
    the lake is trying to tell you something. I do not know what, exactly. Something.
