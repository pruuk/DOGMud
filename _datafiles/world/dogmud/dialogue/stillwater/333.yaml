mobid: 333
zone: Stillwater
defaultMood: friendly
opener:
  text: Sit anywhere. Common room is quiet this hour. The seat by the hearth is the
    warmest.
  hints: You could ask Sigrid about the inn, the caravan, or the people of the town.
  variants:
  - questRequired:
    - 20-end
    text: Ulla came in for a drink last week. First time in years. That is your doing.
      The seat by the window is hers when she comes. I have kept it that way.
    hints: You could ask Sigrid about the inn, the town, or the caravan.
  - questRequired:
    - 19-end
    questFlagRequired:
      19-completion: full
    text: Drunn told me you put the deep-water thing down in the caves. Drinks are
      on the house tonight. Sit where you like.
    hints: You could ask Sigrid about the inn, the town, or the caravan.
topics:
- key: lake_decline
  kind: info
  label: How has the fishing been?
  text: Catch was short last year. Tov down at the stall says something in the caves
    has been chewing the nets. Slow years. Lake-folk are patient.
- key: caravan_news
  kind: info
  label: What does the caravan bring?
  text: Ketil's lot brought letters and goods from Thornwall. The usual run. Bottles
    for the apothecary, lake-iron stock for Brindle, thread-spool for Edda. Lars runs
    around the square with a slate-list trying to read his father's handwriting. Sometimes
    a letter from Maren in Thornwall for Ulla. Ketil doesn't open them, which is why
    I trust him. Marta says about three words a day, and one of them is usually
    'no'.
- key: voss_delicate
  kind: info
  label: You kept a seat for Ulla?
  text: I kept Ulla's chair by the window. She came in last week with Vella. Neither
    of them said much. They did not need to. It was enough that they both came in.
    Some things take twelve years and some person who is not from the town to break
    them loose.
  questRequired:
  - 20-end
- key: town_history
  kind: info
  label: How long has the inn been here?
  text: My mother had this place before me. She would barely recognise the common
    room now. I rebuilt the bar after the fire, and the loft above five years after
    that. Same building, mostly different wood. Same family, mostly the same hands.
- key: gossip_drunn
  kind: info
  label: What do you make of Constable Drunn?
  text: Drunn is a fixture. Slightly understaffed for the work he has, slightly too
    many years in to want to leave the post empty, but he handles what comes. Comes
    in for a meal twice a week. Pays for his ale, which is more than I can say for
    some constables I have met.
- key: lodging_rates
  kind: info
  label: What is up in the loft?
  text: Three pallets in the loft, a window over the lake, a chamber-pot in the corner
    that is your responsibility. Quieter than the common room downstairs, mostly,
    except when Lars is on layover. The kid talks in his sleep about wagon-wheels.
- key: who
  kind: info
  label: Who runs this inn?
  text: Sigrid. I have run the Pike & Lantern since my mother left me the keys, which
    is longer than most marriages last in this town. I sleep upstairs, I work downstairs,
    and I hear most of what is said in either.
- key: ale
  kind: info
  label: What do you serve here?
  text: Ale on tap from a brewer in Ashwick. Wine when the caravan brings it, which
    is now, as it happens. The chowder is from the morning's clams.
- key: bandits
  kind: info
  label: Is the road safe these days?
  text: Quieter than it was. Soren's lot was the worst of it. The bounty cleared most
    of them. Drunn does the town credit on that score. Ketil's crew still keeps a
    sword on the wagon, and Marta is not for show.
