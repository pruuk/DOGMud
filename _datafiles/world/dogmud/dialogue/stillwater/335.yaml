mobid: 335
zone: Stillwater
defaultMood: neutral
opener:
  text: Constable Drunn. I know most faces in Stillwater, and most of the
    trouble that walks in with them. If you have business with the law, say it
    plainly. If not, take your time. I stopped hurrying years ago.
  hints: You could ask Drunn about himself, the town, or the caravan. His bounty on
    the lake caves is the task below.
  variants:
  - questRequired:
    - 19-end
    questFlagRequired:
      19-completion: full
    text: The hero of the lake-caves. Stillwater has been calmer since you put the
      sump dweller down. Sit any time. The constabulary owes you more than the purse
      covers.
    hints: You could ask Drunn about the town or the caravan.
  - questRequired:
    - 19-end
    questFlagRequired:
      19-completion: partial
    text: The shallows are quieter than they were. That is worth what we paid. The
      big thing in the sump is still down there, but that is a matter for another
      day and another sword.
    hints: You could ask Drunn about the town or the caravan.
  - questRequired:
    - 19-shrimp
    - 19-hunter
    questExcluded:
    - 19-signed
    - 19-end
    text: Back so soon, and looking the worse for it. I will take that to mean you
      cleared the shallows.
    hints: Choose the line about the cleared shallows below.
  - questRequired:
    - 19-signed
    questExcluded:
    - 19-end
    carriesItem: 40054
    text: That is a tooth in your pack, or I am no judge of a bulge. Let me see it.
    hints: Two entries below share the title The Lake-Caves Bounty. Choose the one
      that hands over the tooth for the full reward.
  - questRequired:
    - 19-signed
    questExcluded:
    - 19-end
    text: Bounty is signed and posted. The choice now is yours. Finish the job in
      the deep sump for the full reward, or close out the bounty and take what you
      have already earned.
    hints: For the full reward, kill the sump dweller in the Hollow Sump, the deepest
      cave, and bring Drunn its tooth. To close the bounty now for the smaller purse,
      choose The Lake-Caves Bounty below.
  - questRequired:
    - 19-start
    - 19-shrimp
    questExcluded:
    - 19-hunter
    - 19-end
    text: Shallow swarm broken? Good. There is at least one drowned hunter still down
      there in the dark passages. Finish the work and come back.
    hints: Drowned hunters lurk deeper in the caves, past the first chamber. There,
      type attack hunter.
  - questRequired:
    - 19-start
    questExcluded:
    - 19-shrimp
    - 19-hunter
    - 19-end
    text: Still on the bounty? The cave mouth is past the boat pier, north of the
      fishing docks. Bring a light. Try not to bleed on my floor when you come back.
    hints: Choose the question about the way to the caves below.
topics:
- key: drunnhandoff
  kind: handin
  quest: 19
  label: The Lake-Caves Bounty
  playerLine: Here is a tooth from the sump dweller.
  text: By the lake. So there really WAS something down there. I had half-decided
    that thing was a story the dock-drunks made up. Stillwater owes you for this.
    Drinks at the Pike & Lantern are on the constabulary tonight. Tell Sigrid I sent
    you.
  questRequired:
  - 19-signed
  questExcluded:
  - 19-end
  requiresItem: 40054
  grantsQuest: 19-end
  setsQuestFlag:
    key: 19-completion
    value: full
  givesGold: 350
  moodChange: grateful
- key: accept_bounty
  kind: offer
  quest: 19
  label: The Lake-Caves Bounty
  playerLine: I'm looking for work, if you have any.
  text: I have a bounty posted. Something in the lake caves is spilling into the shallows.
    Skitter-shrimp swarms are shredding the fishing nets, and at least one big drowned
    hunter has killed two fishermen this season. The dock master swears something
    worse lives in the deep sump, but that one I will believe when I see proof. Clear
    the shallows of shrimp, kill at least one of the drowned hunters, then come back
    to me. I will sign an upgraded bounty for the bigger threat after that. The caves
    are dark. Bring a light, your chrysalis-glow if you have the spell, a lantern
    if you do not. The cave mouth is past the boat pier, north of the fishing docks.
  hints: If you take the bounty, the caves are dark, so bring a light.
  questExcluded:
  - 19-start
  - 19-end
  grantsQuest: 19-start
  moodChange: friendly
- key: sign_bounty
  kind: info
  label: The shallows are cleared. What now?
  text: Both done? Good. The shallows will breathe easier for a while. Now, the dock
    master's deep-water rumour. I am signing the upgraded bounty. If there is a sump
    dweller down there, I want proof, a leviathan tooth, large enough that no one
    can argue. Bring me the tooth and the constabulary pays the full reward. Or close
    out the bounty here and take the smaller payment for what you have already done.
    No shame in either choice. Some of those caves are deeper than they look.
  hints: For the full reward, kill the sump dweller in the Hollow Sump, the deepest
    cave, and bring its tooth to Drunn or to Dock Master Arn. To close the bounty
    now, choose The Lake-Caves Bounty below.
  marked: true
  questRequired:
  - 19-shrimp
  - 19-hunter
  questExcluded:
  - 19-signed
  - 19-end
  grantsQuest: 19-signed
  moodChange: friendly
- key: take_partial
  kind: handin
  quest: 19
  label: The Lake-Caves Bounty
  playerLine: Close the bounty now. I will take the smaller purse.
  text: Closing out the bounty, then. The shallows are quieter, which is what we paid
    for. The bigger thing in the sump can wait for someone with more steel. Take the
    purse. It is earned.
  questRequired:
  - 19-signed
  questExcluded:
  - 19-end
  grantsQuest: 19-end
  setsQuestFlag:
    key: 19-completion
    value: partial
  moodChange: grateful
- key: caves_info
  kind: info
  label: How do I get to the lake caves?
  text: Go down to the lake-view promenade and north along the fishing docks to the
    net yard. Past the boat pier the path bends east to the cave mouth. You will see
    the bounty notice nailed up at the entrance. Bring a light.
  hints: From the Constabulary, go west to North Square, south twice to Lakefront
    Square, east twice to the Lake-View Promenade, north twice to the Net Yard, then
    east, north and east to the Cave Mouth. Go down into the caves.
  marked: true
  questRequired:
  - 19-start
  questExcluded:
  - 19-end
- key: light_warning
  kind: info
  label: Do I need a light down there?
  text: The caves are properly dark. If you know the chrysalis-glow spell, cast it
    before you go down. If not, Wulf at Tinder & Tackle sells lanterns and torches.
  hints: To light your way with the spell, type cast glow.
  questRequired:
  - 19-start
  questExcluded:
  - 19-end
- key: tooth_info
  kind: info
  label: Tell me about the sump dweller.
  text: The sump dweller is the deepest thing in those caves. The dock-drunks call
    it a leviathan. A tooth from one of those is the kind of proof I can take to the
    magistrate without being laughed at. If you bring one back, the full bounty is
    yours. If you do not, no shame. Close out the bounty for the smaller purse.
  hints: The sump dweller lives in the Hollow Sump, north of the Pool Chamber at the
    back of the caves.
  questRequired:
  - 19-signed
  questExcluded:
  - 19-end
- key: who
  kind: info
  label: Who are you, Constable?
  text: Drunn. I have been the only constable in Stillwater for eleven years
    now. Some weeks the town keeps me busier than others. Either way, I know
    whose door to knock on.
- key: stillwater
  kind: info
  label: What is Stillwater like?
  text: Honest town. Mostly fishing folk, a few craftsmen, the inn at the square.
    We get travelers off the North Road, and we get the trouble that travels with
    them. The lake gives us most of what we need, when the lake is in a giving mood.
- key: lake
  kind: info
  label: How is the fishing?
  text: The lake is the town. Always has been. Lately the catches have been short
    and the nets have been coming back chewed. Something is wrong out there in the
    deep, and the dock master will not stop bending my ear about it.
  questExcluded:
  - 19-end
- key: caravan
  kind: info
  label: Do you watch over the caravan?
  text: Ketil's lot is in town a couple days every fortnight or so. The road has been
    quieter since the bounty cleared the worst of Soren's lot. I check in on the crew
    when they're through, just so they know who runs the patrols. The kid Lars is
    a fixture by the well most layovers.
