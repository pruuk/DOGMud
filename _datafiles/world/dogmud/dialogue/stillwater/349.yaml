mobid: 349
zone: Stillwater
defaultMood: friendly
opener:
  text: Well, hello. Sit on the stool if you are staying. Who are you and where have
    you come from?
  hints: Choose a line below if you would like to hear about the town's history,
    the neighbours, or the healer who visits the lane.
  variants:
  - questRequired:
    - 20-end
    text: Ulla came down the lane this week. I have not seen her out like that in
      years. She stopped to say good morning. I did not make a fuss about it. She
      does not like fuss. I just said good morning back. That was enough.
    hints: Choose a line below to hear about the town's history or the
      neighbours.
topics:
- key: town_history
  kind: info
  label: What was Stillwater like in the old days?
  text: My grandmother came to Stillwater as a young woman and raised four children
    on the lake-catch. The dock-yard ran two shifts in her day and the bakehouse stayed
    open until dark. The town has been quieter since. Slow shrinkage, not a single
    event. A family here, a family there, following the work north. What is left is
    what the lake keeps. I do not say that as a complaint.
- key: gossip_neighbours
  kind: info
  label: What news is there on the lane?
  text: The Halvord family at number seven lost a fishing boat two seasons back and
    the son went to Thornwall to find work. The Brekke widow at the corner has a dog
    that barks at the caravan wagon every layover without fail. Sigrid at the inn
    has more grey in her hair than last year but she is still the most capable person
    in the square, which I have been saying for a decade. Before her mother had the
    inn, a man named Esvald let the roof go and served bad ale. Sigrid is an
    improvement on both counts. Nothing on this lane escapes me.
- key: porch
  kind: info
  label: Do you sit out here every day?
  text: I have been on this porch thirty-some years. My daughter wants me to come
    inside. I tell her I see more from this chair than she sees in a week of walking.
    She knows I am right. She does not say so. Everything worth knowing in this town
    walks down this lane at least once. You just have to be patient and have
    something to do with your hands.
- key: ulla
  kind: info
  label: Does anyone in town live alone?
  text: Ulla Voss has been in that cottage alone since her husband went into the
    lake. Twelve years. I send herbs over with my daughter sometimes, not because
    Ulla asks, but because nobody should be that alone. Vella visits, I think. I am
    glad of it.
  hints: Ulla's Parlor is just west of North Square.
  questExcluded:
  - 20-end
- key: vella_deliveries
  kind: info
  label: Who looks after the old folk here?
  text: Vella comes down the lane a few times a week. She checks in on the older
    folk, brings remedies when the season turns. She knocked on my door last winter
    when the cold was bad and sat with me for an hour. She did not charge for it.
    That is the kind of healer she is. I send her what I dry from my own garden in
    trade. Neither of us calls it payment.
