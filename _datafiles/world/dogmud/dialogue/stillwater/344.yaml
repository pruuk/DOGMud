mobid: 344
zone: Stillwater
defaultMood: neutral
opener:
  text: Be welcome. This is the Temple of Stillwater, and I am Seren, its
    priest. You need no reason to come in. Some come to pray, some to think, and
    some only to get out of the wind. Sit a while if you like, and tell me if I
    can help.
  hints: Choose a line below if you want to hear about herself, the temple, the
    carved pillars outside, its garden, or the lake.
  variants:
  - questRequired:
    - 20-workshop_carving
    questExcluded:
    - 20-temple_pillars
    - 20-end
    text: You have come asking about the spiral. I can tell from the look you brought
      in with you. Sit. There is no short answer to that question.
    hints: Choose the question about the spiral carving below.
  - questRequired:
    - 20-temple_pillars
    questExcluded:
    - 20-garden_marker
    text: Have you found the marker in the garden yet? It lies beneath the crab-apple
      tree.
    hints: The Temple Garden is south of this room. Type look marker.
  - questRequired:
    - 20-end
    text: The matter of Elgar Voss. So that is laid open at last. Vella was his sister.
      I should have known they shared the burden differently. Walk in peace.
topics:
- key: acknowledge_spiral
  kind: info
  label: What does the spiral carving mean?
  text: The spiral. The same one Elgar came asking about, the winter before he went
    into the lake. The two pillars on the approach outside carry the design. The marker
    buried in the temple garden carries it too. So do the wardstone circle on the
    rise northwest of town, and the old chapel ruin beside it. The chapel and the
    circle lie on a line that runs east, and the pillars and the marker lie south
    of it, like signposts. I have not walked the line, but Elgar walked it. He
    believed the line meant something. The Chrysalis order does not officially endorse what I have just
    told you. But the stones are what they are.
  hints: The Temple Garden is south of this room. A marker is buried at the foot of
    the crab-apple tree there. Type look marker.
  marked: true
  questRequired:
  - 20-workshop_carving
  questExcluded:
  - 20-temple_pillars
  - 20-end
  grantsQuest: 20-temple_pillars
  moodChange: friendly
- key: older_lore
  kind: info
  label: Who carved the spirals?
  text: The Chrysalis order is not the first order to have held Stillwater as a place.
    The chapel on the rise fell long before the temple was built. The wardstone circle
    is older than that, older than the records I keep. The spiral on the four sites
    is older than all of them. We do not know who carved them or why. We respect them
    because the stones are what they are.
  questRequired:
  - 20-temple_pillars
- key: alignment
  kind: info
  label: Where does the line of sites lead?
  text: If the chapel and the circle point along a line, and the line ends in the
    deep, that is a thing for someone braver than me to follow. I will say the words at the marker if you
    do not come back.
  questRequired:
  - 20-wardstone_altar
- key: who
  kind: info
  label: Who are you, priest?
  text: Priest Seren. I keep the temple, write the burial records, and hold what little
    spiritual authority Stillwater has need of. The Chrysalis order is small in this
    town. I am the whole of it on most days.
- key: temple
  kind: info
  label: What kind of temple is this?
  text: The Temple of Stillwater is one of the smaller chapels of the Chrysalis order.
    We are not Sanctum Basin. We are the country cousin, doing the necessary work
    the larger temples do not have time for.
- key: pillars
  kind: info
  label: What is carved on the pillars outside?
  text: The pillars carry a spiral design that predates the temple by some centuries.
    We do not know who carved them. We re-used the stones when the temple was built
    two hundred years ago, and the design was already old then. The Chrysalis order
    does not officially acknowledge what came before, but the stones are what they
    are.
- key: elgar
  kind: info
  label: Did Elgar Voss ever come to you?
  text: Elgar Voss. Empty grave at the cemetery. He came to me a few times in the
    year before he disappeared, asking about the older lore, the things the Chrysalis
    order has officially forgotten. I told him what I knew, which was less than he
    wanted. I have wondered since whether I should have told him less.
  marked: true
  questRequired:
  - 20-start
- key: garden
  kind: info
  label: What grows in the temple garden?
  text: Herbs, mostly, for the kitchen and for the sick. There is a buried marker
    beneath the crab-apple tree, carved with the same spiral as the pillars outside.
    I do not weed too close to it. Vella the healer harvests her marsh-sage there,
    and she does not weed close to it either. We respect what we do not understand.
- key: lake
  kind: info
  label: What does the temple say of the lake?
  text: The lake is older than the town and deeper than most folk credit. The Chrysalis
    order does not rule on what is in the lake. We bury the drowned and we say the
    right words. What lives in the deep is not our business, nor anyone else's, on
    most days.
- key: caravan
  kind: info
  label: Does the caravan give to the temple?
  text: Ketil keeps a small donation envelope for the temple each run. I do not pry
    about what is in it. The amount is consistent enough that I suspect his wife in
    Thornwall set the rate, not him.
