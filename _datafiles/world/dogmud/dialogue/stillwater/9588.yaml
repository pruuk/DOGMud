mobid: 9588
zone: Stillwater
defaultMood: friendly
opener:
  text: Welcome to the Chrysalis Workshop. I am Rane. Come in, but keep your boots
    off the circle if you would. The inlay is dry, but I would rather you not test
    it.
  hints: You could ask Rane about the circle in the floor or the wares on the bench.
    To see what Rane sells, type list.
topics:
- key: enchant
  kind: info
  label: What is the circle in the floor?
  text: The circle in the floor is an enchanting station, the only one on this side
    of Stillwater. Bring your own chrysalis materials and you may work at it. Binding
    work is slow and it does not forgive impatience. Every shard I sell you is one
    I have already tested against the circle myself.
  hints: To learn how enchanting works, type help enchanting.
- key: wares
  kind: info
  label: What do you sell?
  text: Chrysalis core, shard, binding paste, mutation catalyst, setting, hive fragment.
    I keep a full bench of it. Oak bark comes up from Fernway and the black pearl
    comes in with Kess's runs, so those two I only stock when the caravan is kind
    to me. Most of what I sell, I ground or bound myself.
  hints: To see what Rane sells and what it costs, type list.
