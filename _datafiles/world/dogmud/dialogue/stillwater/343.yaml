mobid: 343
zone: Stillwater
defaultMood: neutral
opener:
  text: Hodder. Sit if you like. The net is not going anywhere, and neither am I.
  hints: You could ask Hodder about the nets, the old fishermen he knew, or the deep
    water.
  variants:
  - questRequired:
    - 19-end
    questFlagRequired:
      19-completion: full
    text: The deep thing is dead, then. Good. Sundval and Korr and three others I
      could name went down in bad seasons. Some of those were the lake. Maybe not
      all of them. The nets are mending. That is what matters now.
    hints: You could ask Hodder about the deep water or the old fishermen he knew.
  - questRequired:
    - 19-end
    text: The shallows are quieter. I can tell by the way the mesh is coming back
      clean. The lake is still the lake, but at least what is pushing out of the caves
      has been pushed back.
    hints: You could ask Hodder about the deep water or the nets.
topics:
- key: old_fishermen
  kind: info
  label: Who were the old fishermen you knew?
  text: Erik Sundval. Piet Korr. Old Brenna with her pipe. A dozen others I could
    name if you gave me time and a clear evening. The lake is not kind to everyone
    and the years are not kind to anyone. I keep the names because someone should.
    The dock does not remember them. The water does not remember them. I do.
- key: deep_water
  kind: info
  label: What has changed in the deep water?
  text: The deep water runs differently than it used to. The cave outlets changed
    the current patterns two, three years back, maybe more. I felt it in the boat
    before my knee went bad. Something shifted down there. The fish felt it first.
    Then the nets. Then the boats. That is how the lake tells you things, in order
    of size, smallest first.
- key: mending_knowledge
  kind: info
  label: What makes a net hold?
  text: The knot that holds under strain is the half-hitch doubled. Everything else
    slides. I have been telling Tov's generation that since before Tov was born and
    they all nod and then half of them use the running-loop anyway and their nets
    come back torn. You do not learn it until you have fixed enough torn ones. Same
    lesson, every generation. We switched to a tighter weave after the shrimp
    trouble. More knots, more time. But a net with a reputation for holding is worth
    the work.
- key: elgar
  kind: info
  label: Did you know Elgar Voss?
  text: I knew Elgar Voss from the docks, before he went. He asked good questions
    about the deep water, where the currents run, which way the bottom shelves. Not
    the questions of a man planning a fishing trip. I did not ask what he was
    planning. I should have, maybe.
  marked: true
  questRequired:
  - 20-start
- key: forty
  kind: info
  label: How long have you worked these docks?
  text: Forty years on this dock. I knew men who fished before the boat-yard was here.
    In my grandfather's day the boats were dragged up the bank. This dock is an improvement.
    Most things are.
- key: tov
  kind: info
  label: Do you know Tov at the fish stall?
  text: Tov started at the stall when he was about this high. His father ran it before
    him, and his father's father before that. I taught his father the same net-repairs
    I am teaching him now, which is not teaching so much as standing here until the
    lesson takes.
- key: ketil
  kind: info
  label: Is the caravan in town?
  text: Ketil's crew is in town. I can tell by the footprint of the wagon near the
    square and the fact that Lars has been running past the net yard twice a morning
    with a slate. Good that the road is quiet enough for regular runs. Was not always
    that way.
