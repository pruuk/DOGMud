mobid: 348
zone: Stillwater
defaultMood: friendly
opener:
  text: Hello, hello! Mind the dust, it gets everywhere. Welcome to the mill. If
    you want flour, I have it by the sack. If you want to know how the wheel
    works, I could talk all day, and I will if you let me. What can I do for
    you?
  hints: Choose a line below if you want to hear about the mill, the seasonal
    flood, or the creek bridge. To see what he sells, type list.
topics:
- key: mill_workings
  kind: info
  label: How does the mill work?
  text: The wheel is a twenty-spoke overshot. The creek drops from a sluice above
    and the weight of the water drives it around. The millstones are lake-granite,
    dressed every winter. I like the work because the physics of it never changes.
    Water, weight, rotation, grain. Same every day, until something breaks, and then
    it is a puzzle worth solving.
- key: seasonal_flood
  kind: info
  label: Does the creek ever flood?
  text: The creek floods six weeks after the last frost, near enough. I run the wheel
    hard the week before, full load, long hours, everyone gets their grain milled.
    Then I lift the sluice gate and let the flood go through without touching the
    stones. Comes down in a week, usually. Then I lower the gate, clean the race,
    and start again. It is the rhythm of the year here.
- key: bridge_drunn
  kind: info
  label: Who keeps up the footbridge?
  text: Drunn pays for the timber and I do the building. That is not quite how the
    ledger reads it. The ledger says I maintain the bridge under a town-works agreement.
    But that is how it works in practice. The bridge serves the mill, the path, and
    the cattail bank. Drunn is practical about it. I appreciate that in a constable.
- key: edda
  kind: info
  label: Who else uses the creek?
  text: Edda comes down to harvest cattail from the northwest bank every late summer.
    I know to run the wheel slow for her morning and leave the gate open. She brings
    a cloak at Yule in exchange, which I did not ask for. I have three now and they
    all last. Good work.
- key: bakehouse
  kind: info
  label: Who buys your flour?
  text: The bakehouse takes the largest order. After that the households, who bring
    their own grain and I mill it for a fee. A few buy sacks direct from me when their
    own grain runs short. I keep a reserve for that. The lean months come sooner
    than people remember from one year to the next.
  hints: To see what Bram sells, type list.
