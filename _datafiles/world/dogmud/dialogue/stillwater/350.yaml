mobid: 350
zone: Stillwater
defaultMood: friendly
opener:
  text: Hi! Are you going in the water? I am not supposed to but I watch it every
    day.
  hints: Choose a line below to learn about his da, the shallows, or the caves.
topics:
- key: fisherman
  kind: info
  label: What does your da do?
  text: My da is a fisherman. He goes out every morning before I wake up. His boat
    is the red one at the third mooring. He lets me help with the net sometimes if
    I am careful. I am going to be a fisherman too when I am big enough. Da says I
    have to learn swimming first. I am learning.
- key: shallows
  kind: info
  label: What do you watch for in the water?
  text: There is something that swims in the shallows in the mornings that makes a
    bigger ripple than a fish. I keep counting the rings. A fish makes three rings.
    This makes five or six. I think it is something big.
- key: caves
  kind: info
  label: Have you been in the caves?
  text: I am not allowed in the caves. Da was very specific about the caves. But you
    are allowed because you are grown up. Da says there are things in there that
    bite.
