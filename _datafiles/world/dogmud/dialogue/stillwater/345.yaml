mobid: 345
zone: Stillwater
defaultMood: friendly
opener:
  text: Welcome. I am Finn, the acolyte. Can I help, or shall I fetch Priest Seren?
  hints: Choose a line below to hear about Priest Seren or about his training.
topics:
- key: seren
  kind: info
  label: Where can I find Priest Seren?
  text: Priest Seren is inside the temple, just east of here. She is generous with
    her time for anyone who comes with a genuine question. I am still learning the
    liturgy, eight months in, so for anything spiritual or complicated, she is the
    one to talk to. She says the outer work, sweeping, watering, the lamps, is part
    of the practice, not a distraction from it. I am trying to believe that when the
    steps are wet.
- key: acolyte
  kind: info
  label: How long have you been an acolyte?
  text: Eight months. I know the morning prayers and the burial words and most of
    the evening liturgy. There is a great deal more. Seren does not hurry me, which
    I am grateful for.
