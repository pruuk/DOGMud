mobid: 353
zone: Stillwater
defaultMood: friendly
opener:
  text: Good day to you. My name is Fenwick. I am only resting my feet before I
    go on up the north road. Forgive me for saying so, but you have the look of
    someone who has walked the same road, only from the other direction.
  hints: You could ask Fenwick about news from the road, Thornwall, or the places
    he has seen.
  variants:
  - questRequired:
    - 20-end
    text: I heard something from Ketil's driver this morning about the matter at the
      lake. You look like the person it concerns. The road carries stories faster
      than it carries feet. Safe travels.
    hints: You could ask Fenwick about news from the road or Thornwall.
topics:
- key: road_news
  kind: info
  label: Any news from the road?
  text: Three things I carry from the road. The harvest was thin north of the pass.
    The waystation at the east fork burned last month and is being rebuilt. And the
    bandit activity that was troubling the North Road has thinned considerably. That
    last one I heard from Ketil as well, who has more stake in it than I do. I note
    things and pass them on. That is part of what pilgrims are for.
- key: thornwall_maren
  kind: info
  label: What did you see in Thornwall?
  text: I passed through Thornwall two days before Stillwater. There is a weaver in
    the cloth-market who does work I would have called remarkable if I were not traveling
    light. Maren, I think. She mentioned Stillwater when I said where I was heading.
    She said she was from the lake originally, that her uncle had lived here. She
    had a careful way of saying it. I did not pry.
- key: ketil_road_conditions
  kind: info
  label: Is the road north in good shape?
  text: Ketil has the road memorized. The ditch at the second crossing goes deep after
    heavy rain. He mentioned it and I found it true. The path north of the lake widens
    about half a day out, which is good. The surface is reasonable now. Ketil can
    give you the details. I only walked it once.
- key: journey
  kind: info
  label: Where are you headed?
  text: I came south from the high road and will go north again in a day or two. The
    walking is the point of it, mostly. I am not in a hurry to arrive anywhere in
    particular, which is either wisdom or very good footwear. I have not decided
    which.
- key: sanctum
  kind: info
  label: Have you been to Sanctum Basin?
  text: I have been to Sanctum Basin. Fine city. The temples there are properly grand
    in a way that the small chapels on the road are not. I respect the small chapels
    more, personally. The Chrysalis order in a town like this does more daily work
    than the towers in the city do in a season.
- key: stillwater
  kind: info
  label: What do you make of Stillwater?
  text: What strikes me about Stillwater is that the town faces the lake rather than
    the road. Most towns turn toward traffic. This one turns toward water. That tells
    you what the town thinks is important.
