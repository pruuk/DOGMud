mobid: 341
zone: Stillwater
defaultMood: friendly
opener:
  text: Welcome to Tinder and Tackle. What can I find you?
  hints: You could ask Wulf about his stock, the caravan, or what to take into the
    lake caves. To see what he sells, type list.
  variants:
  - questRequired:
    - 19-end
    text: The cave trouble settled? Good. My lantern sales will go back to the normal
      trickle now. I kept extra stock on hand all season. Now Ketil can bring me
      something more useful.
    hints: You could ask Wulf about his stock or the caravan. To see what he sells,
      type list.
topics:
- key: stock_general
  kind: info
  label: What do you keep in stock?
  text: Lanterns, torches, trail rations, water flasks, salt, planks, lake-iron. If
    it is useful and it travels well, I probably have it. The caravan just came through,
    so most shelves are full.
  hints: To see what Wulf sells and what it costs, type list.
- key: caravan_stock
  kind: info
  label: Did the caravan bring you anything?
  text: Ketil's crew came in this week. Lars brought my crate over with the usual
    slate, everything accounted for, name mis-spelled, same as always. I know his
    handwriting now, so I check against the crate rather than the paper. Between the
    two of them it comes out right. I have taken on extra lanterns and torches this run.
    The caves have been busy.
- key: knows_everyone
  kind: info
  label: You seem to know what everyone needs.
  text: I have twelve years of standing orders in my head. Brindle's lake-iron, Ilsa's
    vials, Edda's thread-spool, Arn's mooring rope. I know when someone is out of
    what before they do, and I usually have it on the shelf by the time they realise.
    It is not a complicated skill but it is a useful one.
- key: cat
  kind: info
  label: Do you have trouble with mice?
  text: The cat that sleeps behind the counter keeps the mice out of the salt sacks. That is the
    theory. The practice is that she sleeps fourteen hours a day and I set traps anyway.
    We both pretend the arrangement is working.
- key: caves
  kind: info
  label: What should I take into the lake caves?
  text: If you are going into the lake caves, take a lantern. The chrysalis-glow
    spell is fine if you have it, but the caves are properly dark and a spell does
    not last forever. Do not say I did not tell you.
  hints: To see the lanterns and torches Wulf sells, type list.
