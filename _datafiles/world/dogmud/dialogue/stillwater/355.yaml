mobid: 355
zone: Stillwater
defaultMood: neutral
opener:
  text: Come in, and close the door behind you. I am Mistress Thorne. If you
    have brought me trouble, tell me plainly, and I will help if it can be
    helped.
  hints: Choose a line below to learn about her herbs, the temple, the lake, or
    her brother Elgar.
  variants:
  - questRequired:
    - 20-end
    text: Sit. The kettle is on. The town is quieter for what you did, and so am I.
      I have not slept that well in twelve years. The kingfisher sits on Ulla's mantel
      now. I went to see it last week.
    hints: Choose a line below if you want to hear about her herbs, the temple,
      or the lake.
  - questRequired:
    - 20-brindle_confession
    questExcluded:
    - 20-vella_journal
    - 20-end
    carriesItem: 40060
    text: You have something in your hand that I left in the ground. Twelve years
      ago. Show me.
    hints: Choose the line about the carved kingfisher below.
  - questRequired:
    - 20-vella_journal
    questExcluded:
    - 20-end
    text: Take the page to Ulla. It has waited long enough.
    hints: Ulla's Parlor is just east of the Healer's Cottage. Type talk ulla.
  - questRequired:
    - 20-kingfisher_found
    questExcluded:
    - 20-vella_journal
    text: You found the box at his grave? Then where is the carving?
    hints: If you lost the kingfisher, there is another in the box. At the foot of
      Elgar's grave in the cemetery, type look disturbance.
  - questRequired:
    - 20-brindle_confession
    questExcluded:
    - 20-kingfisher_found
    text: You have spoken to Brindle. I can see that on you. What you came here for
      is not in this cottage. It is in the cemetery, just west of here. Go to my
      brother's grave and look at the foot of it.
    hints: The cemetery is west of the Healer's Cottage. At the foot of Elgar's grave,
      type look disturbance.
  - questRequired:
    - 20-start
    questExcluded:
    - 20-brindle_confession
    text: You are looking for something about my brother. I can see it on you. I have
      nothing to say to a stranger about Elgar. Not yet.
    hints: To see your next step, type hint.
topics:
- key: vellahandoff
  kind: info
  label: I found this carved kingfisher at his grave.
  text: He carried this in his pocket for years. I knew where it ended up. I left
    the note. I left it because I hoped that some day someone would come looking for
    him who was not me, and I could not bring myself to be the first to say it. Take
    this. It is the page he wrote the morning he went down. He left it with me to
    give to Ulla. I have not had the strength.
  hints: Take Elgar's journal page to Ulla. Ulla's Parlor is just east of the Healer's
    Cottage. Type talk ulla.
  marked: true
  questRequired:
  - 20-brindle_confession
  questExcluded:
  - 20-vella_journal
  - 20-end
  requiresItem: 40060
  givesItem: 40061
  moodChange: friendly
- key: redirect_no_quest
  kind: info
  label: Tell me about your brother, Elgar.
  text: Elgar was my brother. He went down into the deep twelve years ago. I do not
    speak of it to most folk. If you have come about Elgar, you have come about
    something twelve years cold. I do not have words for strangers about him. If Ulla has asked you to look into
    his things, come back when you have something to bring me. Otherwise, leave him
    be.
  hints: Ulla, his widow, lives in Ulla's Parlor, just east of the Healer's Cottage.
  questExcluded:
  - 20-start
  - 20-end
- key: brother
  kind: info
  label: Was Elgar your brother?
  text: Elgar was my brother. He went down into the deep twelve years ago. I do not
    speak of it to most folk.
  questRequired:
  - 20-start
  questExcluded:
  - 20-vella_journal
- key: brother_peace
  kind: info
  label: How do you think of Elgar now?
  text: He is at peace, more than he was. Thank you for that.
  questRequired:
  - 20-vella_journal
- key: lost_journal
  kind: info
  label: I lost the journal page you gave me.
  text: Lost the page? Here. I kept a copy in case the first did not reach her. Take
    this one straight to Ulla. Do not lose this one.
  questRequired:
  - 20-vella_journal
  questExcluded:
  - 20-end
  itemExcluded: 40061
  givesItem: 40061
- key: spiral_info
  kind: info
  label: What do you know of the spiral?
  text: The spiral is older than the temple, older than the cottage. My grandmother
    knew it from her grandmother. The chapel and the wardstones lie on a line that
    runs east to the deep, and the marks at the temple and in the garden point the
    way to it. Elgar said the line was a road. I told him roads
    are walked both ways.
  questRequired:
  - 20-kingfisher_found
- key: blame_info
  kind: info
  label: Did you know Elgar was going down?
  text: I knew he was going to go. I could have told Brindle. I could have told Ulla.
    I told neither. I have lived with that twelve years now, and there is no morning
    yet that the kettle does not remind me. Tell Ulla what you like. The choice is
    yours.
  marked: true
  questRequired:
  - 20-vella_journal
- key: marker_info
  kind: info
  label: Who paid for Elgar's marker?
  text: Brindle paid for the marker and gave the wrong date to the carver. Fifteen
    years instead of twelve. He said it was kinder to round up. I did not argue with
    him. I should have. The dates matter. They matter to anyone who knows.
  questRequired:
  - 20-brindle_confession
- key: who
  kind: info
  label: What do you do here?
  text: I am Mistress Vella Thorne, and I have kept this cottage for thirty
    years. I do folk medicine and tinctures, and the small things the temple
    priest does not handle. Sooner or later, most of this town comes through
    that door.
- key: herbs
  kind: info
  label: What herbs do you work with?
  text: Marsh-willow for fevers. Lake-mint for the stomach. Elderberry for the cough.
    The town knows where to find me when it needs them.
- key: temple
  kind: info
  label: Do you work with the temple?
  text: Seren keeps the temple. She handles what I do not, the spiritual side, the
    ceremonies, the burials. We work together when we have to. We disagree when we
    have to as well.
- key: lake
  kind: info
  label: What do you think of the lake?
  text: The deep does not give back what it takes. Most years I tell people that to
    comfort them. This year I tell it to remind myself.
