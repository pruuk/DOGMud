topics:
- key: lean_year
  kind: info
  label: Why has the catch been so short?
  text: Two short seasons, back to back. First the nets started coming back chewed.
    Something in the caves was pushing into the shallows. Then the boats themselves
    stopped going out as far. You cannot fish water you do not trust. I have kept
    the stall open on clams and what the nearshore boats bring in. The lake gives
    enough for that. For now.
- key: nets_mending
  kind: info
  label: Who mends the nets?
  text: Hodder mends them in the net yard off the docks. He has been at it every
    morning for forty years and his patch-work holds better than the original knots.
    Whatever is chewing them comes out of the caves, but Hodder keeps the fleet
    seaworthy. He taught half the fishermen on this dock, me included. His knees
    are bad now, so he stays out of the boats.
- key: about_diving
  kind: info
  label: Does anyone dive for pearls here?
  text: There used to be men who dived for pearls in the deep shallows. Before my
    time mostly, but Hodder would know them. Kess at the carver's garret still buys
    from anyone who brings a good one up. Not many people go that deep anymore. The
    water has been strange.
- key: drunn
  kind: info
  label: Is anyone doing something about the caves?
  text: Drunn got a bounty posted on the caves. About time. The dock master was bending
    his ear for months. Whoever takes it on, I hope they bring a light and a strong
    arm. I want my nets back in one piece.
  questExcluded:
  - 19-end
