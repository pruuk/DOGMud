mobid: 338
zone: Stillwater
defaultMood: neutral
opener:
  text: I am Ilsa, the apothecary. If you are hurt, tell me now, not after it
    festers. Most people wait too long. If it is a question, ask it while I
    work.
  hints: Choose a line below if you want to hear about her remedies, her
    patients, or Vella Thorne. To see what she sells, type list.
topics:
- key: remedy_trade
  kind: info
  label: What remedies do you make?
  text: Healing salves, stamina tonics, and a lake-tonic that steadies the hand. I
    mix to order and keep a shelf of finished stock when the materials allow it. Lake-mint
    has been short since the cave trouble. I make do with what I have. Marsh-willow
    for fevers, lake-mint for the stomach, elderberry for the chest. I trained in
    Thornwall for seven years and have worked Stillwater plants for nine more. The
    formulas are my own.
  hints: To see what Ilsa sells, type list.
- key: fishermen_patients
  kind: info
  label: Who comes to you for help?
  text: This town fishes for a living, and fishing folk get hurt. I keep iodine and
    clean cloth on the front shelf for the quick visits. Hodder's knee is a permanent
    patient. Cold water and forty years of boat-work. Tov took a hook to the palm
    two seasons back. Luc came in last autumn with
    cave-stone cuts that needed proper cleaning. I told him to stay out of the deep
    outlets. He nodded like he was listening.
- key: vella_reference
  kind: info
  label: Who is Vella Thorne?
  text: Vella keeps the healer's cottage on the west side of town, past Ulla's. She
    was here before me, and she trained herself rather than being trained, which I
    respect more than I probably should. She handles the matters I do not. The grief-work, the long-term infirm, the things
    that need more than herbs. I send the overflow to her and she sends hers to me.
    Stillwater is too small for two healers to be rivals. We manage.
- key: willow
  kind: info
  label: Where do your herbs come from?
  text: Marsh-willow bark is the backbone of most of what I make. I harvest it from
    the shallows myself. The lake-mint grows closer to the cave outlets, and I have
    been short of it since the trouble in the caves started.
- key: cave
  kind: info
  label: Has the cave trouble hurt your work?
  text: The plants I need most grow closest to the cave outlets, and I have not been
    able to harvest there properly. I am managing with dried stock, but dried is not
    fresh, and anyone who knows potions will tell you the difference shows.
