mobid: 340
zone: Stillwater
defaultMood: neutral
opener:
  text: I am Kess. I carve the lake's pearls, and I will keep working while you
    talk, so do not mind it if I do not look up. What brings you in?
  hints: Choose a line below to hear about the pearls she works, her silver
    settings, or the divers who used to bring the best stones. To see what she
    sells, type list.
topics:
- key: pearl_quality
  kind: info
  label: What pearls does the lake give?
  text: Stillwater black pearls. I came here fourteen years ago for them and stayed.
    The lake gives two grades in practice. The shallow pearls, from the near-shore
    beds, are small and clean, good for drop-settings. The deep-shallow pearls are
    larger, darker, with a blue cast in the nacre that the sea never matched in anything
    I have handled. The divers who knew the deep beds have been staying close to shore.
    The cave trouble changed the water down there.
- key: silver_work
  kind: info
  label: Do you make the settings yourself?
  text: I draw the wire here, set the stones here, engrave the bezels here. Everything
    in this garret is my own work. I came from a coast town where the jewellers bought
    their wire and bought their blanks and called themselves craftsmen. I do not work
    that way. It takes longer. The results are different.
- key: divers_gone
  kind: info
  label: Where did the pearl divers go?
  text: Before the cave trouble, I had four or five regular divers who would bring
    me stones from the deep beds. One of them could tell a good pearl by weight before
    he surfaced, just by the feel in his palm. He was a fisherman's friend of Tov's.
    The others went to safer water when the currents changed. I work with what I receive.
    I am still here if they want to come back.
- key: vella
  kind: info
  label: Who buys your flawed stones?
  text: Vella comes up sometimes for the smaller, imperfect stones, the ones I cannot
    use for settings. She grinds them for something medicinal. I do not ask exactly
    what. She pays a fair price and does not haggle, which I appreciate.
- key: tov
  kind: info
  label: Who would know which divers still go deep?
  text: Tov Brann at the fish stall would know which fishermen still go deep enough
    to find the best pearls. He hears what the boats bring in before anyone else does.
    Tell him I am still buying if anyone is diving again.
