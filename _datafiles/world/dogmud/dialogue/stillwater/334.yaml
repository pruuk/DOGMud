mobid: 334
zone: Stillwater
defaultMood: neutral
opener:
  text: Sit where you like. The window table has the best view of the lake.
  hints: Choose a line below to hear what is on today, why she works here, or
    for the news.
topics:
- key: ale
  kind: info
  label: What is on today?
  text: Ale on tap. Wine when the caravan brings it, and Ketil's lot is in town, so
    there is wine today. The chowder is from this morning's clams. The regulars
    have the pot empty by noon.
- key: boat
  kind: info
  label: Why do you work here?
  text: My father's boat needed repairs two seasons back. I came here for the coin.
    I am still here. The lake is still there. I keep the window table clear so I can
    see it while I work.
- key: news
  kind: info
  label: Any news around the inn?
  text: I hear everything in this room and I remember most of it. Talk to Sigrid if
    you want it organized. I just carry cups.
