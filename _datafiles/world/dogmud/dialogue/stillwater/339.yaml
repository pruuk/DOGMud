mobid: 339
zone: Stillwater
defaultMood: friendly
opener:
  text: Welcome. Mind the threads on the floor. What can I do for you?
  hints: Choose a line below to hear about her cloth, the cattail she uses, or
    the weaver Maren in Thornwall. To see what she sells, type list.
  variants:
  - questRequired:
    - 20-end
    text: I heard Ulla came out to the Pike & Lantern last week. First time in years.
      I sent a note round afterward, just a short one. She has not written back yet,
      but I think she will. Some things open slowly.
    hints: Choose a line below to learn about her cloth or the ruin up the rise.
topics:
- key: weaving_trade
  kind: info
  label: What do you weave?
  text: My cloaks come in two weights. The cattail-down for spring and autumn, the
    wool for the cold months. The dye is lake-natural, grey, green, the dark brown
    of reed-bark. Not fashionable by Thornwall standards. Practical by Stillwater
    ones. The cloaks I make to order. Over the counter I sell what menders need,
    thread, bone needles and beeswax, all priced fairly.
  hints: To see what Edda sells, type list.
- key: maren_comparison
  kind: info
  label: How does your work compare to Maren's?
  text: Maren trained under the guild and her work is guild-grade. I learned here,
    worked here, sell here. She makes cloth for people who wear it to be seen. I make
    cloth for people who wear it to stay warm. Neither of us is wrong. I would rather
    be known for work that holds than for work that dazzles, but I will not pretend
    I do not look at her finished pieces when Ketil brings one through. She writes
    to her aunt Ulla sometimes, and Ketil carries the letters. She has never come
    back to visit, as far as I know.
- key: cattail_harvest
  kind: info
  label: Where do you gather your cattail?
  text: I take the cattail from the northwest bank of the creek, after Bram runs the
    mill-wheel slow in late summer. The flooding dries out by then and the plants
    are at their best before the cold sets in. Bram knows to expect me and he leaves
    the bank gate open. We have the same arrangement every year.
- key: chapel
  kind: info
  label: What is up the rise behind your cottage?
  text: The old chapel ruin is up the rise behind my cottage, past the wardstones.
    I knew about it before I bought the lot, which is why the price was what it was.
    The wind off it is colder than it should be for the direction, and I close the
    back shutters early. I have got used to it. Mostly.
- key: ulla
  kind: info
  label: Do you know Ulla, who weaves by the square?
  text: Ulla weaves too, or she did, before things went quiet in her cottage. I have
    left her be. Some people come to the loom for company. Some come to the loom to
    be alone with themselves. I do not knock on a door that is not open.
  questExcluded:
  - 20-end
- key: caravan
  kind: info
  label: Does the caravan bring your thread?
  text: Ketil brings thread-spool by the dozen each run. He knows my standing order
    without me writing it down, which is either impressive or a little unsettling.
    I have not decided which. Lars writes it on the slate anyway. Belt and braces,
    that family.
