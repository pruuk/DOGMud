mobid: 337
zone: Stillwater
defaultMood: neutral
opener:
  text: Stand clear of the slack tub. I am Brindle. Tell me what you need, and I
    will tell you if I can make it.
  hints: Choose a line below to learn about his trade or the lake-iron he works.
    To see what he sells, type list.
  variants:
  - questRequired:
    - 20-end
    text: Ulla gave it to you? Good. I finished it at last and carried it to her
      door myself. It was hers to give, not mine. The spear should not have sat that
      long. Wear it well.
    hints: Choose a line below if you want to hear about his trade or the
      lake-iron.
  - questRequired:
    - 20-brindle_confession
    questExcluded:
    - 20-end
    text: The spear is on the anvil again. Twelve years I let it sit. This time I
      will finish it, and take it to Ulla myself.
    hints: To see your next step, type hint.
  - questRequired:
    - 20-bone_shoals_cache
    questExcluded:
    - 20-brindle_confession
    text: You have been in the deep. I can see it on you. And you have something to
      tell me, by the way you are standing.
    hints: Choose the line about Elgar's cache below.
  - questRequired:
    - 20-workshop_carving
    questExcluded:
    - 20-bone_shoals_cache
    text: Asking about the spiral, are you? The temple priest knows old lore better
      than I do.
    hints: To see your next step, type hint.
topics:
- key: confession
  kind: info
  label: I found Elgar's cache in the lake caves.
  text: You found his cache. I did not know he had hidden anything down there, but
    I am not surprised. He was my friend. He came to me with the sites and the spiral
    and the alignment. I told him I would help. I had a piece of work I needed to
    finish first, a fool piece of work, a commission for someone who is long dead
    now, and I told him to wait a day. He did not wait. He went down alone. I have
    spent twelve years finishing the spear he ordered from me, and I have spent twelve
    years not finishing it. You should speak to Vella. Elgar's sister. She keeps the
    healer's cottage west of Ulla's. There is something she buried at his grave for
    whoever came looking.
  hints: The cemetery is just west of the Healer's Cottage. At the foot of Elgar's
    grave, type look disturbance.
  marked: true
  questRequired:
  - 20-bone_shoals_cache
  questExcluded:
  - 20-brindle_confession
  - 20-end
  moodChange: friendly
- key: redirect_no_quest
  kind: info
  label: Whose grave is that by the cemetery wall?
  text: Elgar Voss. Old name in this town. He has a marker in the cemetery now, over
    an empty grave. No body was ever recovered. I do not have much to say about him
    to a stranger. If Ulla has sent you, come back when you have something to bring
    me.
  hints: Ulla, his widow, lives in Ulla's Parlor, just west of North Square.
  questExcluded:
  - 20-start
  - 20-end
- key: caravan_orders
  kind: info
  label: Does the caravan bring your stock?
  text: Ketil's crew brings my lake-iron stock from the smelters in Thornwall. Lars
    is a good kid even if he writes the orders down wrong half the time. I let him
    think I am annoyed about it because his father expects me to. I am not.
  questRequired:
  - 19-end
- key: spear
  kind: info
  label: What is that half-finished spear?
  text: There is a spear on the bench at the back, a hook-spear that has been there
    a long time. I keep meaning to finish it. I have kept meaning to finish it for
    years.
  questExcluded:
  - 20-brindle_confession
  - 20-end
- key: who
  kind: info
  label: Who are you, smith?
  text: Brindle. Smith here since my father died. I forge what folk need and a little
    more besides. Plain work, mostly.
- key: forge
  kind: info
  label: What do you work at the forge?
  text: I work iron and the lake-iron nodules out of the marsh. Lake-iron holds an
    edge longer than common stock. The smith who can work it has a job for life around
    here.
- key: lake_iron
  kind: info
  label: What is lake-iron?
  text: Lake-iron nodules, harvested from the shallows. Smelt them down and the iron
    that comes out is finer-grained than ordinary stock. I sell the raw nodules and
    I forge the finished work. Either way you pay a premium.
