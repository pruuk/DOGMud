mobid: 9420
zone: The Confluence
defaultMood: friendly
greetings:
- text: She won't be ready until the afternoon tide. Mind the lines on your way
    past.
  moods:
  - friendly
opener:
  text: I run freight downriver to New Plymouth, and back up when there's cause.
    Next departure is the afternoon tide, and she won't be loaded before that.
    I've carried all sorts in my time, but I don't book passage for strangers.
    The passage agent by the sailings board books the regular boats. If you need
    a conversation, the tavern is back along the quay, past the chandlery.
  hints: You could ask Osse about the river run to New Plymouth, about his barge,
    about the travelers he has carried, or about getting passage on a boat.
topics:
- key: run
  kind: info
  label: How long is the run to New Plymouth?
  text: Two days downstream in good water. Three if the sandbar at the northern
    bend is running high. Coming back up is two and a half against the current
    with a full load. A barge doesn't love fighting the river's spring pull when
    the snowmelt is pushing hard. I know every snag between here and the estuary.
    You learn them the first time they nearly put you on the bank, and you don't
    forget them after that.
- key: barge
  kind: info
  label: What does your barge carry?
  text: She's a wide-bellied river hauler, built for freight. Grain, timber,
    finished goods mostly. The manifests change by season. I keep two passenger
    berths clear as a courtesy, for people I know. Cargo pays more reliably than
    passengers. Passengers ask too many questions. Though I'll admit the river is
    worth looking at, even after this many years of it.
- key: passengers
  kind: info
  label: Who have you carried on the river?
  text: All sorts. Merchants, pilgrims on the Chrysalis circuit, laborers headed
    for the capital. Had a quiet young man come aboard a while back. Came down
    out of the Amber Valley with a set of carving tools and not much else. Good
    hand on deck. Helped with the mooring lines without being asked. Said he was
    headed for New Plymouth to find work as a craftsman. Kept to himself the
    whole run, which suited me. I hope he found what he was looking for. Some of
    them do.
  marked: true
- key: fare
  kind: info
  label: How do I get passage on a boat?
  text: Not on mine. My berths go to people I know, and what I'd charge depends
    on what she's carrying. The passage agent by the sailings board books the
    regular boats, up to Stillwater and down to New Plymouth. You pay him at the
    plank and you're aboard.
  hints: The passage agent stands here on the Barge Dock. Type talk agent.
  marked: true
