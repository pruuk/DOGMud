mobid: 9473
zone: The Confluence
defaultMood: friendly
greetings:
- text: A good cask keeps what you put in it, and a bad one costs you twice.
    Which are you after, wood or a clay pot?
  moods:
  - friendly
opener:
  text: Wood, mostly. Barrels, casks and buckets, built to order and built
    right, which is rarer than you'd think. For anyone who needs a
    sealed pot quick, there are clay pots on the shelf. So, what are you
    storing?
  hints: You could ask the cooper about his barrels and storage vessels. To see what
    he sells, type list.
topics:
- key: vessels
  kind: info
  label: What do you make here?
  text: Barrels and casks are the main trade, and I make them to order for the river
    houses. It takes a few days for a proper one. The clay pots on the shelf are
    ready to go, good for dry goods and sealed storage. A good cask keeps anything
    you put in it. A bad one costs you more than you saved on the price.
  hints: To see what he sells, type list.
