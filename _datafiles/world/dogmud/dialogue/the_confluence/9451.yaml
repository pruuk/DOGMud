mobid: 9451
zone: The Confluence
defaultMood: friendly
greetings:
- text: Something for the altar? Candle, wreath or incense, every one of them as
    proper as what the Keepers use themselves.
  moods:
  - friendly
opener:
  text: Welcome, pilgrim. You'll want something to carry to the altar, and I
    keep all three of the traditional offerings. There are votive candles,
    river-reed wreaths and temple incense, and most pilgrims take one or more
    of them in. I can help you choose, if you like.
  hints: Choose a line below to learn about the candles, the reed wreaths or the
    incense, or how offerings are used at the altar. To see what she sells, type
    list.
topics:
- key: offerings_use
  kind: info
  label: How are the offerings used?
  text: The candle is lit at the altar and left to burn. The Keepers say the flame
    carries what you bring to it. The wreath is laid at the foot of the altar stone,
    still green when you arrive. The incense is burned along the nave. All three
    are proper. You need not bring all three. Most pilgrims choose one, and it is a
    matter of custom and what the altar calls for. What calls to you is the right
    answer.
  hints: To see what she sells, type list.
- key: candle
  kind: info
  label: What are your candles made of?
  text: Beeswax, made locally. The same candles the Keepers put on the altar stands
    during the evening service. I am not selling you something lesser because you
    bought it outside. The Keepers say the flame carries the intention. I say it is
    a proper candle, well made, it burns clean, and it does what candles do.
- key: wreath
  kind: info
  label: Where do the reed wreaths come from?
  text: I weave them fresh each morning from the reeds at the river's edge. I go
    down to the bank at first light, so they are still green when you buy them. The
    pilgrims from the western roads favor them. The tradition is that a living
    offering carries more than a made one. I do not argue theology. I weave a sound
    wreath and sell it before it dries.
- key: incense
  kind: info
  label: Is your incense the same as the temple's?
  text: The same. I buy from the Keepers' own supplier, the same blend they burn in
    the evening ceremony. There is no difference between the incense inside the
    temple and what I sell out here, and I want you to know that. The Keepers know I
    say this and have never contradicted me, which I take as confirmation.
