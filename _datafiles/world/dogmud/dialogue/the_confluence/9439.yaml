mobid: 9439
zone: The Confluence
defaultMood: friendly
greetings:
- text: Hall notices for the day. Anything posted at the Municipal Hall, I can
    repeat.
  moods:
  - friendly
opener:
  text: Whatever the hall posts by the first hour, I carry through the square.
    Licenses, council notices, lost property, public announcements. It's a public
    record. Ask if you want something repeated.
  hints: You could ask the town crier what today's notices say.
topics:
- key: notices
  kind: info
  label: What do today's notices say?
  text: Three new trade licenses registered at the hall. The Three Waters ferry
    resumes the morning crossing after the weather delays, and the timetable is
    back to normal from tomorrow. The council sits the second Threeday of this
    month, in open session. Lost property, one grey mare with a white marking on
    the foreleg, last seen near the South Gate. That's today.
