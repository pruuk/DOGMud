mobid: 9453
zone: The Confluence
defaultMood: friendly
greetings:
- text: Oh, hello. I did not hear you come up. Is there something I can help you
    find?
  moods:
  - friendly
opener:
  text: I tend the garden and sweep the forecourt. I am not very far into my training
    yet, but I can answer small questions. The Historian knows more, or the Warden
    here in the forecourt. What is it?
  hints: Choose a line below if you would like to hear about the meditation
    garden, about how to cross to the temple, or about her training.
topics:
- key: garden
  kind: info
  label: What is the meditation garden?
  text: It is through the side gate, just there. A small garden. Stone paths, a few
    herbs, and a still pool further in that the Keepers keep. Pilgrims sit there
    before they cross to the temple. It is very peaceful before the afternoon
    pilgrims come through. I sweep it and tend the herbs in the morning. I find it a
    good way to begin the day. Quieter than the forecourt.
  hints: The meditation garden is west of the forecourt.
- key: training
  kind: info
  label: What is your training like?
  text: I have been here eight months. The first year is mostly practical. Tending
    the garden, sweeping the forecourt, helping the Hospitaller with the hall. The
    senior Keepers say the work grounds you before the doctrine. I think they are
    right. I think. I am not certain about most things yet, which the Historian says
    is the correct state for a first-year.
- key: temple
  kind: info
  label: How do I cross to the temple?
  text: The causeway is straight ahead, east from the forecourt. The public nave is
    open, and the altar is beyond it. If you want the founding account first, the
    Historian in the Hall of the Founding, just up the avenue, can explain the
    carving there. The cloisters past the nave are for the senior Keepers, not
    visitors. The Warden can tell you what is open.
  hints: The causeway starts east of the forecourt. The Hall of the Founding is
    north of the forecourt, then east.
