greetings:
- text: Pots and cloth, mostly. If it's in stock, I'll know before you finish
    asking.
  moods:
  - friendly
opener:
  text: I keep a general stock. Clay pots and cloth bolts for the craft market. If you
    need something in depth, the specialists up the Row have more. If you need it
    quickly, I probably have it. What are you working on?
  hints: Choose a line below to hear about what he stocks. To see what he sells,
    type list.
topics:
- key: goods
  kind: info
  label: What do you stock?
  text: Clay pots, fired and ready to use, good for alchemy or storage. Bolts of
    homespun cloth, plain weight, right for most work. Both in stock. If you need the
    finer river cloth, or a potter's own work, the weaver and the potter are further
    up the Row. I'm the quick stop.
  hints: To see what he sells, type list.
