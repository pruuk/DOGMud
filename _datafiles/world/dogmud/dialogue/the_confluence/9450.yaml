mobid: 9450
zone: The Confluence
defaultMood: friendly
greetings:
- text: Move along if you're passing through. Stop if you have a question about the
    forecourt.
  moods:
  - friendly
opener:
  text: The forecourt is open, and the causeway straight ahead takes you to the
    temple. If trouble is what you came for, I ask that you reconsider. I will
    not ask twice.
  hints: Choose a line below if you want to hear about the scholar copying the
    stonework at the temple doors, about what lies across the causeway, or about
    his work in the forecourt.
topics:
- key: scholar
  kind: info
  label: Who is the scholar copying the stonework?
  text: One of the Margin's people. She sits at the foot of a column on the temple
    portico, across the causeway, copying the old mark above the doors. She has been
    there three days. The Prioress says she is harmless, so we leave her be. I do
    not think she is a problem. I watch anyway. It is a habit.
- key: causeway
  kind: info
  label: What is across the causeway?
  text: The temple. Go straight over the causeway and up the steps. The public
    temple is open. Services, the great hall over the waters, the altar. A pilgrim
    can go as far as the altar without asking anyone. The cloisters past that are
    kept by the senior Keepers, for themselves and those they invite in. If you
    want to go further in, ask them.
  hints: The causeway starts on the east side of the forecourt. At the far end, the
    temple portico is south of the temple steps.
- key: forecourt
  kind: info
  label: What is your work here?
  text: I keep the forecourt clear. No carts over the causeway, no trouble during
    services, nobody bothering the pilgrims at their business. Keep the road clear,
    that is the whole of it. It is not complicated work. Most days it is just
    standing and watching the road.
