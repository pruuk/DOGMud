mobid: 9458
zone: The Confluence
defaultMood: friendly
greetings:
- text: The reliquary is open to visitors. Ask, if any of the pieces interest you.
  moods:
  - friendly
opener:
  text: Welcome. I tend the reliquary, the objects the Keepers have held since the
    Founding, and one piece older than that. What did you want to know about them?
  hints: Choose a line below to learn about the relic collection, or about the
    oldest piece on the dark granite shelf.
topics:
- key: margin_aside
  kind: info
  label: Is the granite shelf older than the Founding?
  text: You are not the first to look at that shelf and frame the question carefully.
    The disc is a Founders' piece. That is the account, and I give it as given. But
    the granite the disc rests on is older than the account that placed it there.
    The Founders found it and consecrated what they found. The distinction matters,
    if you are keeping records. I do not press it in the reliquary. The senior
    Keepers, in the cloisters beyond the threshold, are the ones to press it with.
  questRequired:
  - 73-end
- key: relics
  kind: info
  label: What relics does the reliquary hold?
  text: Founding-period tools, a fragment of the first altar stone, the first
    Keeper's ledger, a sealed phial from the dedication ceremony. Each piece is
    catalogued and dated where we can date it. The oldest sits on the dark granite
    shelf at the bottom. That piece we do not assign a date to. The Keepers' account
    places it at the Founding. The granite shelf predates the account.
# oldest_piece folds the "old older oldest relic granite" pattern (kept as
# topic old): the shelf is older than the temple, and the disc has always
# rested on it.
- key: oldest_piece
  kind: info
  label: What is the oldest piece on the shelf?
  text: The carved disc. The ringed mark, cut in a different hand and with
    different wear than the keystone above the temple doors. The Keepers call it a
    Founders' piece, placed here at the Founding for safekeeping. The dark granite
    shelf it rests on predates it, older than the temple's first stone, older than
    any founding record we hold. We have always kept the disc on it. The Keepers
    say the Founders consecrated what was already there. I tend the disc and the
    shelf and do not argue the account here.
  marked: true
