mobid: 9480
zone: The Confluence
defaultMood: friendly
greetings:
- text: Morning. Mind you don't get the splash.
  moods:
  - friendly
opener:
  text: I take in washing for the Row, mostly, and I see more of the Row's
    business on its linen than it would like. Good soap is the whole secret,
    that and not being afraid of cold water. Was there something?
  hints: You could ask the washerwoman about her work.
topics:
- key: work
  kind: info
  label: Whose washing do you take in?
  text: Everybody's, more or less. Half the Row's traders and some of the houses
    beyond. I know whose linen I'm handling and I keep it to myself. Mostly. Good
    soap and cold water is the whole trick. People try to save on the soap and then
    wonder why it takes all day.
