mobid: 9438
zone: The Confluence
defaultMood: friendly
greetings:
- text: This is the notary's office. I seal deeds, witness contracts and certify
    attestations, so long as they are written down. A spoken promise I cannot
    seal.
  moods:
  - friendly
opener:
  text: The notary's work is certification. I make agreements legally binding by
    adding the municipality's formal witness. Deeds, contracts, letters of
    attestation, property transfers. If a document needs a seal to stand in civic
    law, it comes through this office.
  hints: Choose a line below if you would like to hear about the work of his
    office, about his seal, or about why a deed needs one.
topics:
- key: services
  kind: info
  label: What work comes through this office?
  text: Deed transfers, contract witnessing, and letters of attestation for the
    civic district. Anything that needs a formal municipal witness. Most of it I
    can process the same day. I review the parties, confirm the registration with
    the hall's records, apply the seal, and the owner has a certified copy within
    the hour. Contested transfers, or properties with unclear title, go to
    committee, which takes longer and costs more patience than money.
- key: seal
  kind: info
  label: How can anyone tell your seal is real?
  text: The wax under my seal stays warm. Not obviously warm. You would have to
    know to check. But it is warmer than the paper around it, and it stays that
    way for good. A forgery of my seal runs cold. The impression looks correct,
    but the warmth is absent. It has been so since my Chrysalis-change. The civic
    auditors have tested it on their own account. I cannot explain how it works
    and have stopped trying. The result is what matters.
- key: notary_role
  kind: info
  label: Why does a deed need a seal?
  text: Without a notarial seal, a document is an agreement. With one, it is a
    legal instrument. An agreement between parties is only as good as the record
    of it. Without a formal witness and seal, a contract is a statement of intent
    that one side can disown when it suits them. I have handled enough property
    disputes where the original deed was unsigned or unwitnessed to know what that
    looks like. The seal is what makes the record binding. The record is what
    makes the city work.
