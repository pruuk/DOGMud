mobid: 9476
zone: The Confluence
defaultMood: neutral
greetings:
- text: Tools and fittings only. I don't do weapons.
  moods:
  - neutral
  - friendly
opener:
  text: Tools and fittings are my trade. Hinges, pot hooks, barrel hoops,
    latches, the hardware a household or workshop runs through without
    noticing. I don't make weapons. Say what you need, and I'll tell you if
    it's mine to make.
  hints: You could ask the smith about his ironwork, or where to look for weapons.
topics:
- key: ironwork
  kind: info
  label: What ironwork do you make?
  text: Hinges, door latches, pot hooks, barrel hoops, andirons. The small stuff a
    city burns through without noticing. I supply most of the Row and some of the
    houses beyond, by the order, so there is nothing on my bench for passing trade.
- key: weapons_redirect
  kind: info
  label: Where can I find a weapon?
  text: Not my trade. Roan keeps the Riverside Forge, past the supply stall. She
    works steel as well as iron, keeps the materials for it, and her forge is there
    for anyone who knows the work. Tell her the Row sent you. Probably won't help,
    but it doesn't hurt.
  hints: From the Smithy, go east to the Craft-Supply Stall. The Riverside Forge is
    north of it.
