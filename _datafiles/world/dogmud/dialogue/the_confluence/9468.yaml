mobid: 9468
zone: The Confluence
defaultMood: friendly
greetings:
- text: The refectory is between meals at the moment. Is there something you need?
  moods:
  - friendly
opener:
  text: I am the Cellarer. The refectory and the stores are mine to keep, and I
    keep them the same way every day, which is how all the important work goes.
    If it is the Archive or the Prioress you want, they are further in. If it is
    the kitchen, you have found it.
  hints: Choose a line below if you want to hear about the stores, or about when
    the order eats.
topics:
- key: the_stores
  kind: info
  label: What do you keep in the stores?
  text: Three months of grain, two months of oil. A good supply of preserved fish
    from the Quay traders. The temple has been here three hundred years. It has a
    relationship with continuity. I keep the stores the same way. Enough to last,
    never so much that we stop paying attention to what we have. The old cellarer
    who trained me called it the middle path between hoarding and faith. I have found
    it a sound principle.
- key: food
  kind: info
  label: When does the order eat?
  text: Twice a day, at the sixth hour and the eighteenth. No one eats who does not
    attend, and no one attends who cannot be fed. The bread is good. I am particular
    about the bread.
