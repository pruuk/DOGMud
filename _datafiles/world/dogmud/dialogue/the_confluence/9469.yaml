mobid: 9469
zone: The Confluence
defaultMood: friendly
greetings:
- text: This is the Infirmary. Not the place for curiosity, usually. Are you unwell,
    or just wandering?
  moods:
  - friendly
opener:
  text: The sick come to me here, and I would rather you were not one of them.
    If it is the records you want, Brother Cael keeps the Archive, off the North
    Walk. If it is something else, tell me plainly.
  hints: Choose a line below to learn about the Chrysalis-changes she sees in
    her work, or what to do if you are hurt.
topics:
- key: the_infirmary
  kind: info
  label: How do Chrysalis-changes affect your work?
  text: The changes make the work interesting. Every person who comes through here is
    changed in some way that affects what works and what does not. The infirmarian's
    art is in reading the person, not the category. My own change tells me exactly
    how feverish someone is by touch. It has made me very good at diagnosis. It has
    also made me very bad at shaking hands at social occasions, which is a fair
    trade.
- key: ill
  kind: info
  label: What should I do if I am hurt?
  text: Rest is the first medicine. Everything else is the second. In thirty years I
    have not found a case that reversed the order. Sit down somewhere quiet and let
    it work. The order tends its own, and travelers in real need, and I do not draw a
    fine line between them. But most of what heals you, you do yourself, by
    stopping.
  hints: Sitting still helps you recover faster. To sit and rest, type sit.
