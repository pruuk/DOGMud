mobid: 9444
zone: The Confluence
defaultMood: friendly
greetings:
- text: Have a look round. I keep history volumes, reference folios and now and
    then a chart copy. Something tells me you will find what you came for.
  moods:
  - friendly
opener:
  text: I carry history volumes and reference folios, mostly for the scholarly trade,
    the Margin's people and the students they bring in. The Confluence History is
    the most complete general account, if that is what you need. What are you
    looking for?
  hints: Choose a line below to learn about the books he sells, about the old
    chart by the counter, or about the Scholars' Quarter. To see what he sells,
    type list.
topics:
- key: books
  kind: info
  label: What books do you sell?
  text: The Confluence History is the best general account. It covers the three
    rivers, the founding of the temple city, and the two centuries since, in a form
    you can read. Scholars buy it for students who need a foundation text.
    Travelers buy it because it is the only book on the subject they can actually
    carry. I price it plainly. I have folios on river navigation and natural history
    when I can get them, but those sell quickly. If I do not have what you want, the
    Great Archive past the Margin Hall keeps a reading room. Not for sale, but open
    to consult.
  hints: To see what he sells, type list.
- key: old_chart
  kind: info
  label: Where did the old chart come from?
  text: I do not know its full history. It was in the shop when I took it on. The
    previous owner kept it in that crate and either could not or would not say
    where it came from. The water damage was already there. The Margin's
    cartographers come in now and then to look at it. Riss, in the Cartographers'
    Room, has opinions about its date and its survey tradition that I cannot judge.
    It is not for sale. It is decoration, by default, and the scholars seem to think
    it is worth keeping. So I leave it where it is.
  hints: To study the chart, type look damaged chart.
- key: quarter
  kind: info
  label: What else is in the Scholars' Quarter?
  text: The Margin Hall is the center of it, west through the Inkwell Court. The
    Great Archive is just past the hall, the cartographers work off the court, and
    the copyists off the hall. The scholars' lodgings are off the court as well, for
    the members who live in the quarter. The gate-porter just outside my door can
    direct you more exactly. I am at the gate end, so I see everyone who comes
    through. Researchers, students, and the occasional traveler who has come to see
    what the fuss about the rivers is.
