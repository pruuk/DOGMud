mobid: 9447
zone: The Confluence
defaultMood: friendly
greetings:
- text: Scholars' Quarter. Looking for the archive, the hall, or the bookseller?
  moods:
  - friendly
opener:
  text: Hello. First time here? I keep the gate. The Margin Hall and the archive are
    further in, the bookseller's is the door just south of here, and the Inkwell
    Court is straight through for the students and the lodgings. Tell me what you
    are looking for and I can point you right.
  hints: You could ask the gate-porter where the Margin Hall and the archive are,
    about the bookseller's shop, or about what the Scholars' Quarter is for.
topics:
- key: archive_hall
  kind: info
  label: Where are the Margin Hall and the archive?
  text: Go straight west through the Inkwell Court, and the Margin Hall is the next
    room on. The Great Archive is west again, past the hall, with the reading room
    off its north side. The cartographers work off the Inkwell Court to the north,
    and the copyists off the hall to the south. If you want the archivist, Fenn is
    in the archive itself. He does not leave it much.
  hints: From the gate, the Margin Hall is two rooms west, and the Great Archive is
    one room further west.
- key: bookseller
  kind: info
  label: What is in the bookseller's shop?
  text: Drunn's shop is the door just south of the gate. He carries history volumes
    and reference folios. The Confluence History is the main general account, if you
    want one. The old chart in his shop is not for sale, before you ask. He gets that
    a lot.
- key: quarter
  kind: info
  label: What is the Scholars' Quarter for?
  text: The Scholars' Quarter is the Margin's home district. The society has been
    here about eighty years. You have the hall and the archive at the center, the
    cartographers and the copyists beside them, and the scholars' lodgings off the
    Inkwell Court. Students gather in the court, which is straight through. There is
    a study hall north of the gate for anyone who wants to read in quiet. It is a
    quiet district. That is deliberate.
