mobid: 9419
zone: The Confluence
defaultMood: friendly
greetings:
- text: Come on through. Gate's open, river's open. Good morning for it.
  moods:
  - friendly
opener:
  text: The gate was shut most of the cold season. Ice gets into the lock, and we
    can't move it safely until the thaw. This morning was the first good morning,
    and it's open now. Head on in. The main quay is straight ahead to the south,
    the fish market is down along the waterfront, and the overlook is out at the
    south end of the wharf, if you want to see where the three rivers come
    together.
  hints: You could ask Holt about the gate, about what is in the Landings, or
    about where the three rivers meet.
topics:
- key: gate
  kind: info
  label: Why was the gate shut?
  text: She's more lock than door. Iron fittings, counterweights, and a channel
    pin that the ice binds solid in a hard winter. She was sealed after the ice
    came, and now the ice has gone. Simple as that. You can't force her without
    breaking something, so we leave her until the thaw, then check every fitting
    before we swing her open. Takes about half a morning. I've done it maybe
    fifteen times. Gets routine.
- key: landings
  kind: info
  label: What is there to see in the Landings?
  text: This is the Landings, the river side of the city and the first place you
    reach coming down the Aldren. The quay is straight ahead, two streets south.
    That's where the barges load and the dockmaster holds court. The fish market
    is past the barge dock, along the waterfront. The chandler is west of the
    quay, past Warehouse Row, for rope and line. The tavern is south of the
    chandler, past the cooper's yard, if you need to sit down. And the overlook
    is out at the south end of the wharf. You can see all three rivers come
    together from there. Worth the walk.
  marked: true
- key: confluence
  kind: info
  label: Where do the three rivers meet?
  text: Just south of the quay. The Aldren comes from the north, the Brenn from
    the east, the Solt from the southwest. Where they meet is what the whole city
    is built on. The Landings is the river-trade quarter. There's more city
    beyond it. The Confluence proper spreads south from the water, past the South
    Quay Gate. Good place to arrive.
  marked: true
- key: road
  kind: info
  label: I came down the river road.
  text: Road's good all the way back up the Aldren, from what I hear. You made it
    fine.
