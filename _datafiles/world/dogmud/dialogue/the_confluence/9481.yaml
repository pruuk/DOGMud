mobid: 9481
zone: The Confluence
defaultMood: friendly
greetings:
- text: You're new to the lane. I notice things.
  moods:
  - friendly
opener:
  text: Afternoon. I've sat at this well for thirty-odd years, which is enough to know
    everything worth knowing about this lane. The paving was laid in the old
    Registrar's time and not touched since. The lane used to have a fountain at the
    far end. Guild money, back when the guild had money. What do you want to know?
  hints: You could ask the old man how the lane has changed, or simply let him talk.
topics:
- key: lane_history
  kind: info
  label: How has the lane changed?
  text: I've been at this well since the second Registrar's time. Not much about this
    lane I don't remember, and a great deal I've watched get worse. The lane is half
    what it was, and half better. The paving stones have gone in front of the
    potter's shop. Someone needs to say something, but nobody does. The guild had
    real money when I was young. They put in a fountain at the far end. Fountain's
    gone. The cooper up the Row is the second son of the man who had the shop before
    him. That is the sort of thing I keep track of. Nobody asks, but I keep it.
