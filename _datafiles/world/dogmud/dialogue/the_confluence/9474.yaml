mobid: 9474
zone: The Confluence
defaultMood: friendly
greetings:
- text: Looking for a pot? Tell me how big.
  moods:
  - friendly
opener:
  text: Everything here is plain fired clay, glazed properly, and I check every
    piece before it leaves the shelf. It suits alchemy work, dry storage, or
    anything else that needs a vessel to take heat. Tell me what you're making
    and I'll tell you which pot.
  hints: Choose a line below if you want to hear about her clay pots. To see
    what she sells, type list.
topics:
- key: pots
  kind: info
  label: What are your pots good for?
  text: Fired at the right heat and glazed to seal. Good for mixing reagents, storing
    dry materials, and anything that sees heat or damp. They won't crack if you
    treat them right. I check every one before it goes out. Better than glass for
    most purposes, and cheaper to replace if you break it.
  hints: To see what she sells, type list.
