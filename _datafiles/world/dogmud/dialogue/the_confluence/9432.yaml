mobid: 9432
zone: The Confluence
defaultMood: friendly
greetings:
- text: Welcome to the Rivermen's Guild. People come to me about charters, crew
    certification and tolls, though you have the look of someone not yet sure
    which. Take your time.
  moods:
  - friendly
opener:
  text: The Rivermen's Guild controls commercial access to the Confluence
    waterway. Which boats can tie up here, which crews are certified to work the
    quay, what the tolls are for each kind of cargo. We're not the city's tax arm.
    The Weighhouse handles the tariff. We're the trade body. If you're moving goods
    commercially through this quay, you're working within our charter whether you
    know it or not.
  hints: You could ask Oslen about the guild charter, about what the tolls pay
    for, or about how the guild settles disputes.
topics:
- key: charter
  kind: info
  label: What does a guild charter cover?
  text: Commercial work on the Confluence needs a guild charter in good standing.
    A charter covers the right to run freight on the Confluence and use the
    certified wharves. Crew certification is separate. A riverworker can be
    certified without a boat charter, but a chartered boat needs at least one
    certified crew member to work commercially. The application is documented, and
    I keep the forms here. Most applicants take about two weeks from first inquiry
    to certification, longer if a crew record has to be confirmed from an outside
    port. I've seen it take six weeks. I've seen it take three days. It depends on
    the paperwork.
- key: tolls
  kind: info
  label: What do the guild tolls pay for?
  text: Guild tolls are separate from the city tariff the Weighhouse assesses.
    They cover right of way on the Long Quay wharves and the use of guild-certified
    works, the Weighhouse and the dock crane. The rate goes by cargo category and
    load size. It's not cheap if you're running a single boat, but what you get in
    return is certified access to the best-kept wharves on the Confluence, and the
    guild's arbitration if something goes wrong. Something always goes wrong
    eventually. The boats that aren't chartered tie up at the outer slips and sort
    their disputes out themselves. I see how that goes. Mostly not well.
- key: disputes
  kind: info
  label: How does the guild settle disputes?
  text: Arbitration is part of the charter. If two chartered parties have a
    freight dispute, missing cargo, damaged goods, a missed delivery, short
    payment, either party can ask for guild arbitration. I hold a hearing, both
    sides give their accounts, I ask questions, and I issue a finding. The finding
    is binding if both parties are chartered, which is usually the case. I've done
    forty-odd arbitrations. The findings hold. People don't always like them, but
    they hold. The guild is only worth something if the arbitration means
    something, and it does.
