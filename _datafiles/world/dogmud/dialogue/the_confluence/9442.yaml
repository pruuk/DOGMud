mobid: 9442
zone: The Confluence
defaultMood: friendly
greetings:
- text: The archive is open during daylight hours. Are you here for the collection
    or to speak with me?
  moods:
  - friendly
opener:
  text: Gloves first, if you mean to touch anything. I am Fenn, and I keep the
    Great Archive for the Margin. The source surveys, the pilot records, the
    natural-history folios, every primary material the society has gathered
    since its founding, and I know where each one sits. Tell me what you are
    after and I will tell you whether we have it.
  hints: Choose a line below if you want to hear about what the archive holds,
    about the old surveys of the river junction, or about the Margin and how the
    society works.
topics:
- key: archive
  kind: info
  label: What does the archive hold?
  text: The Great Archive holds the Margin's primary materials. Surveys, pilot
    records, natural-history folios, letters from the river stations upriver. We
    have original surveys going back about two hundred years, though the oldest are
    fragile and are not handled without me present. Everything is ordered by date
    and by waterway. The working materials, the charts of the last fifty years, the
    pilot logs, the Margin's own research records, can be read in the reading room
    through the door to the north. Not everything is open for general handling. If
    you are looking for something specific, tell me what it is and I will tell you
    whether we have it.
- key: source_surveys
  kind: info
  label: What do the old junction surveys show?
  text: The Margin holds eleven source surveys that touch on the junction. Eight of
    them mark a fourth channel. Three do not. Of the three that do not, two were
    made after the great correction period and seem to work from the corrected
    survey, not the original. The disagreement does not resolve cleanly. You cannot
    simply count and conclude. The cartographers are working through it with care.
    I keep the surveys whole and open to them. That is my part in the question.
  marked: true
- key: margin
  kind: info
  label: What is the Margin?
  text: The Margin is the Confluence's scholarly society. Cartography, natural
    history, river records, the historical account. It has been in the Scholars'
    Quarter for about eighty years. Membership is open to anyone with a scholar's
    purpose and something to add. I joined as the archive keeper, not as a
    researcher, which is unusual but not unheard of. The Margin is not a guild. It
    charges no dues and has no trade to protect. It publishes what it finds and
    keeps its primary materials open. That is the whole of its purpose.
