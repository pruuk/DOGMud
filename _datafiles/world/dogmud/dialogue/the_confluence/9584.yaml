mobid: 9584
zone: The Confluence
defaultMood: neutral

# Veyra Coil-Tongue, the convergence-crafter. Transactional, exacting, few
# words.
#
# Sales (#375 phase 7 tier 3b):
#   - She sells nine secret recipes, each as a kind: sale topic. A sale is not
#     a quest. It carries chargesGold, teachesRecipes, notReadyText and
#     paidText, and nothing gates it but knowledge: the line leaves the menu
#     once the player knows every recipe in it.
#   - Choosing a secret without the skill for every recipe in it plays
#     notReadyText, which names the trades and no numbers. No card opens and
#     no price is shown. With the skill, her pitch plays and a card shows the
#     price. Accept charges it and teaches every recipe, then paidText plays.
#   - Quests 78 to 87 are retired. The price list is the menu itself.
#   - She cannot be harmed (mob 9584: non_combatant, charm_immune, not
#     hostile), pinned by internal/guards/veyra_cannot_be_harmed_test.go.

opener:
  text: I don't look up from the bench for strangers. You'll have to earn that.
  hints: Choose a line below if you would like to hear about her work, or about
    the scarred hand she works with. She sizes up visitors by the fine work they
    have made themselves.
  variants:
  - questRequired:
    - 77-end
    text: You've seen what's under the Crash Site, and you're still standing here.
      Good. I know nine secrets worth the name. None of them comes cheap.
    hints: Choose one of her secrets below. If you have the skill for it, Veyra
      names her price.
  - masterworkRequired: 50
    text: That's your hand on that work. I can tell. I don't usually make time for
      strangers, but I'll make an exception.
    hints: Choose a line below to hear what she teaches.
topics:
- key: teach_bandolier
  kind: sale
  label: Secret of the Vitalis Bandolier
  playerLine: Will you teach me the Vitalis Bandolier?
  text: The Vitalis Bandolier. A belt that holds its potions at their very best and
    feeds them to you without your hand ever leaving the fight. It takes only what
    strengthens you, and a potion you pull back out of it sours on the spot, so
    choose what you slot. Alchemy work, mostly, with
    a housing under it that has to hold. 17,500 gold, all of it up front. Pay, and I
    teach you. Listen closely. I say it once.
  hints: Accept to pay Veyra's price and learn the recipes. Then gather the
    materials and make each part with your own hands. To see the recipes you know,
    type craft list.
  notReadyText: Come back when you've practiced at the loom, the enchanting circle
    and the alchemy bench.
  paidText: Paid. The recipes are yours. Bind the straps true. This one has to
    breathe on its own before I will call it finished.
  chargesGold: 17500
  teachesRecipes:
  - reinforced-harness
  - preservation-runes
  - assemble-vitalis-bandolier
- key: teach_blackrazor
  kind: sale
  label: Secret of the Blackrazor
  playerLine: Will you teach me the Blackrazor?
  text: The Blackrazor. Not a blade I'd show just anyone. It doesn't stay quiet,
    and it doesn't stay fed. Blacksmithing, with a hunger built into the steel that
    only a kill will settle. 25,000 gold, all of it up front. Pay, and I teach you.
    Listen closely. I say it once.
  hints: Accept to pay Veyra's price and learn the recipes. Then gather the
    materials and make each part with your own hands. To see the recipes you know,
    type craft list.
  notReadyText: Come back when you've practiced at the jeweler's bench, the alchemy
    bench and the forge.
  paidText: Paid. The recipes are in your hands. Forge it at my stations when you
    are ready.
  chargesGold: 25000
  teachesRecipes:
  - hungering-guard
  - obsidian-edge-resin
  - assemble-the-blackrazor
- key: teach_wayfarer
  kind: sale
  label: Secret of the Wayfarer's Bottomless Pack
  playerLine: Will you teach me the Wayfarer's Bottomless Pack?
  text: The Wayfarer's Bottomless Pack. Tailoring, mostly seams and spatial
    stitching. The trick is making the inside hold more than the outside admits to.
    It's the least dangerous thing I know how to make. That doesn't mean it's
    simple. 12,500 gold, all of it up front. Pay, and I teach you. Listen closely. I
    say it once.
  hints: Accept to pay Veyra's price and learn the recipes. Then gather the
    materials and make each part with your own hands. To see the recipes you know,
    type craft list.
  notReadyText: Come back when you've practiced at the forge, the enchanting circle
    and the loom.
  paidText: Paid. The recipes are yours. Cut the frame square. A pack that fails
    you three roads from home is worse than none at all.
  chargesGold: 12500
  teachesRecipes:
  - reinforced-frame
  - spatial-stitching
  - assemble-wayfarers-pack
- key: teach_aegis
  kind: sale
  label: Secret of the Aegis of Mockery
  playerLine: Will you teach me the Aegis of Mockery?
  text: The Aegis of Mockery. A shield that answers a blocked blow by putting
    everyone nearby who deserved it flat on their heels. Blacksmithing, and a
    housing for the voice inside it. 20,000 gold, all of it up front. Pay, and I
    teach you. Listen closely. I say it once.
  hints: Accept to pay Veyra's price and learn the recipes. Then gather the
    materials and make each part with your own hands. To see the recipes you know,
    type craft list.
  notReadyText: Come back when you've practiced at the jeweler's bench, the alchemy
    bench and the forge.
  paidText: Paid. The recipes are yours. Set the housing clean. A voice that cannot
    carry an insult is just noise, and I will not put my name on noise.
  chargesGold: 20000
  teachesRecipes:
  - voice-amber-housing
  - resonance-lacquer
  - assemble-aegis-of-mockery
- key: teach_thornwall
  kind: sale
  label: Secret of the Thornwall Harness
  playerLine: Will you teach me the Thornwall Harness?
  text: The Thornwall Harness. Tailoring built around barbed plate. Anything that
    grabs you regrets it. 15,000 gold, all of it up front. Pay, and I teach you.
    Listen closely. I say it once.
  hints: Accept to pay Veyra's price and learn the recipes. Then gather the
    materials and make each part with your own hands. To see the recipes you know,
    type craft list.
  notReadyText: Come back when you've practiced at the forge, the alchemy bench and
    the loom.
  paidText: Paid. The recipes are yours. Set the spikes even and quench them slow.
    A wall that cannot hold its edge is just a fence.
  chargesGold: 15000
  teachesRecipes:
  - barbed-spike-plates
  - anti-corrosion-quench
  - assemble-thornwall-harness
- key: teach_prism
  kind: sale
  label: Secret of the Seething Prism
  playerLine: Will you teach me the Seething Prism?
  text: The Seething Prism. Jewelcrafting around a containment lattice that doesn't
    quite contain what's inside it. That's the point. It'll change you, given time.
    I won't pretend the price is only in coin, but the coin is 20,000 gold, all of it
    up front. Pay, and I teach you. Listen closely. I say it once.
  hints: Accept to pay Veyra's price and learn the recipes. Then gather the
    materials and make each part with your own hands. To see the recipes you know,
    type craft list.
  notReadyText: Come back when you've practiced at the enchanting circle, the
    alchemy bench and the jeweler's bench.
  paidText: Paid. The recipes are yours. Contain it properly, or it will grow past
    whatever you built to hold it.
  chargesGold: 20000
  teachesRecipes:
  - containment-lattice
  - nutrient-suspension
  - assemble-seething-prism
- key: teach_zephyr
  kind: sale
  label: Secret of the Zephyr Treads
  playerLine: Will you teach me the Zephyr Treads?
  text: The Zephyr Treads. Tailoring and windlace bindings, soled with quicksilver.
    You'll forget what it cost to run before you wore them. 12,500 gold, all of it up
    front. Pay, and I teach you. Listen closely. I say it once.
  hints: Accept to pay Veyra's price and learn the recipes. Then gather the
    materials and make each part with your own hands. To see the recipes you know,
    type craft list.
  notReadyText: Come back when you've practiced at the alchemy bench, the enchanting
    circle and the loom.
  paidText: Paid. The recipes are yours. Work quickly. The soles won't wait around
    for slow hands.
  chargesGold: 12500
  teachesRecipes:
  - quicksilver-soles
  - windlace-bindings
  - assemble-zephyr-treads
- key: teach_choir
  kind: sale
  label: Secret of the Staff of the Hollow Choir
  playerLine: Will you teach me the Staff of the Hollow Choir?
  text: The Staff of the Hollow Choir. Enchanting around a conductor core. It sings
    when you cast, and it takes a little of what it hears from whatever you're
    casting at. 22,500 gold, all of it up front. Pay, and I teach you. Listen
    closely. I say it once.
  hints: Accept to pay Veyra's price and learn the recipes. Then gather the
    materials and make each part with your own hands. To see the recipes you know,
    type craft list.
  notReadyText: Come back when you've practiced at the forge, the jeweler's bench
    and the enchanting circle.
  paidText: Paid. The recipes are yours. Tune each gem true, or the whole choir
    sings out of key.
  chargesGold: 22500
  teachesRecipes:
  - conductor-core
  - choir-focus-gems
  - assemble-hollow-choir-staff
- key: teach_phial
  kind: sale
  label: Secret of the Phial of Second Birth
  playerLine: Will you teach me the Phial of Second Birth?
  text: 'The Phial of Second Birth. Alchemy, at the bottom of it: a reduction that
    unmakes what you''ve become and gives you exactly one chance to become something
    else. I don''t share this one lightly. 15,000 gold, all of it up front. Pay, and
    I teach you. Listen closely. I say it once.'
  hints: Accept to pay Veyra's price and learn the recipes. Then gather the
    materials and make each part with your own hands. To see the recipes you know,
    type craft list.
  notReadyText: Come back when you've practiced at the cooking fire and the alchemy
    bench.
  paidText: Paid. The recipes are yours. Reduce it slow. Rush the base and there is
    no second birth in it, only ash.
  chargesGold: 15000
  teachesRecipes:
  - reduction-base
  - assemble-phial-of-second-birth
- key: convergence_intro
  kind: info
  label: What is the convergence?
  text: Six trades, made to agree with each other in one piece. That's the
    convergence. I don't teach it to just anyone. I keep the recipes secret, and I
    share them only with people who've already proven they can hold a tool steady.
    Practice every trade a secret needs, and then we can talk about what it costs.
  hints: Veyra teaches nine secret recipes. Choose one of them above to hear what
    it takes.
- key: confluence
  kind: info
  label: What is it you make here?
  text: Six trades, made to agree with each other. That's the whole of what I do
    here. I don't explain it to people who haven't held a tool.
- key: scar
  kind: info
  label: What happened to your hand?
  text: One working didn't agree with me the way the others had. I kept the hand. I
    kept the lesson.
- key: gold
  kind: info
  label: Do you sell what you make?
  text: Nothing I know comes cheap, and I don't haggle. I teach hands that have
    earned it.
