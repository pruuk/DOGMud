mobid: 9584
zone: The Confluence
defaultMood: neutral

# Veyra Coil-Tongue, the convergence-crafter. She asks exactly as many
# questions as the work requires and not one more. Transactional,
# exacting, few words. Treats craft as contract, not conversation.
#
# Gating notes:
#   - The intro (grantsQuest 78-start) requires masterworkRequired: 50:
#     the player must be carrying an item they personally crafted at
#     craft skill >= 50. Quest 78's own trigger (see
#     quests/78-the_convergence.yaml) fires the instant 78-start is
#     granted and grants 78-end in the same beat.
#   - Once known (78-end), Veyra sells nine secret recipes, quests 79-87.
#     A player may buy any number of them, each once. Per secret, in this
#     order (first match wins, and triggers match anywhere in the topic):
#       owned_  requires {id}-start (held at {id}-end too). Any mention of
#               the secret, priced or teach, gets "you already carry it".
#               It keys on the quest token, never on recipe knowledge, so
#               a player who discovered a sub-recipe can still buy.
#       teach_  triggers only on "teach <name>" phrases. goldRequired and
#               chargesGold at the price: the gold is checked and taken in
#               the same step, before {id}-start is granted. The quest's
#               quest_granted trigger then teaches the recipes.
#       refuse_ same teach triggers and gates, no price: a player short of
#               gold is told the price and granted nothing.
#       price_  the bare name. States the price and how to buy. Grants
#               nothing, so asking about a secret never buys it.
#   - Name triggers are distinctive words only, so ordinary speech does not
#     reach a secret: no "staff", "shield", "boots", "belt", "pack" or
#     "harness" (also part of the sub-recipe name reinforced-harness).
#   - Discovery: the known root greeting, the secrets_list node and the
#     known-player fallback pattern name all nine secrets, without prices.

patterns:
  - keywords: ["hello", "hi", "greet", "hey", "hail"]
    responses:
      - "Veyra. I don't repeat a greeting twice in one conversation."
      - "If you're browsing, the bench speaks for itself. If you're
          here about work, say so."

  - keywords: ["confluence", "convergence", "commission", "measure",
      "masterwork", "quest", "task", "work", "trade", "discipline",
      "recipe", "secret"]
    questExcluded: ["78-end"]
    responses:
      - "I don't take on hands I haven't seen work. Show me something
          you made yourself, and we'll talk about what comes after."
      - "Six trades, made to agree with each other. That's the whole
          of what I do here. I don't explain it to people who haven't
          held a tool."

  - keywords: ["scar", "hand", "latticework", "accident"]
    responses:
      - "One working didn't agree with me the way the others had. I
          kept the hand. I kept the lesson."

  - keywords: ["gold", "price", "cost", "pay", "fee"]
    responses:
      - "Nothing I know comes cheap, and I don't haggle. Ask about a
          specific secret if you want a number."

  # Known players: anything she has no answer for gets the list of
  # secrets. Placed before the generic fallback; the first fallback whose
  # gates pass wins.
  - keywords: [""]
    questRequired: ["78-end"]
    responses:
      - "I know nine secrets worth the name. The Vitalis Bandolier. The
          Blackrazor. The Wayfarer's Bottomless Pack. The Aegis of
          Mockery. The Thornwall Harness. The Seething Prism. The Zephyr
          Treads. The Staff of the Hollow Choir. The Phial of Second
          Birth. None of them comes cheap. Ask me about one to hear its
          price. Ask me to teach it to you if you mean to buy."

  - keywords: [""]
    responses:
      - "Say what you need, or don't say anything at all."
      - "I'm not paid to make conversation."
      - "The bench doesn't wait on idle talk, and neither do I."

tree:
  root:
    text: "Veyra doesn't look up from the bench. You'll have to earn
      that."
    hints: "You could ask Veyra about her work, or the convergence."
    variants:
      # ── Known, and has seen the Crash Site truth ─────────────────
      - questRequired: ["78-end", "77-end"]
        text: "You've seen what's under the Crash Site, and you're
          still standing here. Good. I know nine secrets worth the
          name. The Vitalis Bandolier. The Blackrazor. The Wayfarer's
          Bottomless Pack. The Aegis of Mockery. The Thornwall Harness.
          The Seething Prism. The Zephyr Treads. The Staff of the
          Hollow Choir. The Phial of Second Birth. None of them comes
          cheap."
        hints: "Ask Veyra about a secret to hear its price, for example
          ask veyra blackrazor. To buy it, ask veyra teach blackrazor."

      # ── Known, ordinary case ──────────────────────────────────────
      - questRequired: ["78-end"]
        text: "You're known to me now. I know nine secrets worth the
          name. The Vitalis Bandolier. The Blackrazor. The Wayfarer's
          Bottomless Pack. The Aegis of Mockery. The Thornwall Harness.
          The Seething Prism. The Zephyr Treads. The Staff of the
          Hollow Choir. The Phial of Second Birth. None of them comes
          cheap."
        hints: "Ask Veyra about a secret to hear its price, for example
          ask veyra blackrazor. To buy it, ask veyra teach blackrazor."

      # ── Not yet known, but carrying proof of skill ───────────────
      - masterworkRequired: 50
        questExcluded: ["78-start", "78-end"]
        text: "That's your hand on that work. I can tell. I don't
          usually make time for strangers, but I'll make an exception.
          Ask me about the convergence if you want to know what that
          means."
        hints: "You could ask Veyra about the convergence, or her
          work."

  nodes:
    # ── INTRO: masterwork-gated, grants 78-start ─────────────────
    - id: convergence_intro
      triggers: ["convergence", "commission", "quest", "task", "work",
        "masterwork", "measure"]
      masterworkRequired: 50
      questExcluded: ["78-start", "78-end"]
      grantsQuest: "78-start"
      text: "Turn that over again. Yes, your hand, not a shop's. That's
        the only credential I recognize. Six trades, made to agree with
        each other in one piece. That's the convergence. I don't teach
        it to just anyone. I keep the recipes secret, and I share them
        only with people who've already proven they can hold a tool
        steady. You qualify now. Come back when you want one, and I'll
        tell you what it costs."
      hints: "You are known to Veyra now. Ask her about her secrets to
        hear which recipes she can share."

    # ══ VITALIS BANDOLIER (79, alchemy), 17,500 ══════════════════
