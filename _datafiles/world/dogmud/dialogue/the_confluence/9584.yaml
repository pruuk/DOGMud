    # ── SECRETS LIST: names all 9, grants nothing ────────────────
    # Placed BELOW the secrets so a topic naming one ("the blackrazor
    # recipe") reaches that secret's own nodes, while the generic words
    # ("quest", "task", "secret", "recipe", a bare "teach") land here.
    # These nine names are the only in-game source for the learn_only
    # pinnacle items, so this node is their discoverability point.
    - id: secrets_list
