      triggers: ["bandolier", "vitalis"]
      questRequired: ["78-end", "79-start"]
      text: "The Vitalis Bandolier. You already carry that one. I don't
        sell a secret twice."
      hints: "You already have Veyra's secret recipe for the Vitalis
        Bandolier."
    - id: teach_bandolier
      triggers: ["teach bandolier", "teach me bandolier",
        "teach the bandolier", "teach me the bandolier", "teach vitalis",
        "teach me vitalis", "teach the vitalis", "teach me the vitalis"]
      questRequired: ["78-end"]
      questExcluded: ["79-start", "79-end"]
      goldRequired: 17500
      chargesGold: 17500
      grantsQuest: "79-start"
      text: "The Vitalis Bandolier, then. Listen closely. I say it once."
      hints: "Veyra has shared her secret recipe for the Vitalis
        Bandolier. Gather the materials and craft it by your own hand."
    - id: refuse_bandolier
      triggers: ["teach bandolier", "teach me bandolier",
        "teach the bandolier", "teach me the bandolier", "teach vitalis",
        "teach me vitalis", "teach the vitalis", "teach me the vitalis"]
      questRequired: ["78-end"]
      questExcluded: ["79-start", "79-end"]
      text: "The Vitalis Bandolier is 17,500 gold, all of it up front,
        and you aren't carrying it. Come back when you are."
      hints: "Veyra's secret recipe for the Vitalis Bandolier costs
        17,500 gold. Come back when you carry that much."
    - id: price_bandolier
      triggers: ["bandolier", "vitalis"]
      questRequired: ["78-end"]
      questExcluded: ["79-start", "79-end"]
      text: "The Vitalis Bandolier. A belt that keeps its own contents
        fresh and feeds them to you without your hand ever leaving the
        fight. Alchemy work, mostly, with a housing under it that has
        to hold. 17,500 gold, all of it up front. If you mean it, ask
        me to teach you the Vitalis Bandolier."
      hints: "To buy this secret, type: ask veyra teach bandolier"

