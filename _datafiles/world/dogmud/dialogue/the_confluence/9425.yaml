  label: What work do you do here?
  text: Freight comes off the barge, goes in the warehouse. When it needs to go
    back out, it comes from the warehouse. That's the job. Bales, barrels, crates.
    Stack it, move it, stack it again when the order changes. Shoulders hold up or
    they don't. Mine do. If you want complicated work, find an office.
