mobid: 9435
zone: The Confluence
defaultMood: friendly
greetings:
- text: One moment. I'm in the middle of a count.
  moods:
  - friendly
opener:
  text: I'm here studying the Municipal Hall's map on behalf of the Margin, and in
    particular the notes at the junction where the rivers meet. It is a
    long-standing question of mapmaking, and I am trying to establish how many
    different hands have worked on this one chart. What did you want to know?
  hints: You could ask Savel about what she is studying, about the fourth water,
    or about the Margin and where its scholars work.
topics:
- key: studying
  kind: info
  label: What are you studying on this map?
  text: The Margin has had an open question on this chart for about thirty years.
    It has been annotated many times over its history. You can see corrections,
    additions, and at least two full re-surveys laid over the original notation.
    I'm trying to set out a chronology. How many layers of annotation, in what
    order, and by whom, if the hands can be identified. My Chrysalis-change lets
    me see the age of an ink, which makes the ordering faster than it would
    otherwise be. The work is methodical. I'm not finished.
- key: fourth_water
  kind: info
  label: What is the fourth water?
  text: The oldest surveys at the junction mark a fourth channel, every one of
    them. Narrower than the Aldren, Brenn or Solt, and drawn as a waterway of its
    own rather than a confusion of currents. Later hands have struck it through
    in three separate surveys, then marked it again in two, then struck it again.
    The disagreement recurs across surveys that never copied each other, over
    sixty-odd years. Whether it records a real channel, an overflow that came and
    went, a surveyor's error passed down through copies, or something else, that
    is the open question. This hall's map carries it too, in a note in the margin.
    The serious work on it is done in the Scholars' Quarter, where the Margin
    keeps its source surveys.
  hints: The note is on the map in this hall. Type look marginal note.
  marked: true
- key: scholars_quarter
  kind: info
  label: Where do the Margin's scholars work?
  text: The Margin is the Confluence's society of scholars. Mapmaking, natural
    history, the usual remit. We keep the Scholars' Quarter, which is just west of
    this hall. Go through the Hall of Records and you come out at the Scholars'
    Gate. The Margin Hall is two streets further west, past Inkwell Court. That is
    where Quist the Elder sits, the nearest thing the Margin has to a head, and
    where the original surveys, pilot records and collections are kept, going
    back several generations. If the fourth water interests you, the primary
    materials are there.
  marked: true
