mobid: 9472
zone: The Confluence
defaultMood: friendly
greetings:
- text: Bread's fresh till it isn't, so buy it while it is. There are pastries
    too, if you want something sweeter.
  moods:
  - friendly
opener:
  text: The morning bake is done. The black bread is on the counter and the
    fruit pastries are on the side shelf. I bake at the same hour every day, so
    if you like a good crust, come early.
  hints: Choose a line below if you want to hear about the bread or the
    pastries. To see what she sells, type list.
topics:
- key: bread
  kind: info
  label: What bread do you bake?
  text: Black bread is the staple. Dark grain, mixed flour, a slow bake, and it keeps
    well. Out of the oven this morning, like every morning, same time. Nothing fancy.
    Just bread.
  hints: To see what she sells, type list.
- key: pastry
  kind: info
  label: What pastries do you have?
  text: Fruit pastries, whatever is in season at the market. Stone fruit today. I
    make them when the bake allows, which is most mornings, and they are usually
    gone by midday. You've caught a good hour.
