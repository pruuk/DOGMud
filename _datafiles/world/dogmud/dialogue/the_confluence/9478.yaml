mobid: 9478
zone: The Confluence
defaultMood: friendly
greetings:
- text: Davel's been out four days on the river. Three was what he said, which is
    what he always says. You haven't come from the docks?
  moods:
  - friendly
opener:
  text: You've got the look of someone who's been walking. Come in if you want to
    rest your feet. My husband Davel is out on the river, the Aldren run this week,
    which goes up through the bends and takes three days when the current is fair
    and four or five when it isn't. He said three. It's been four. I'm knitting,
    which is what I do when I'm counting days. Was there something?
  hints: You could ask her about her husband and the river, about life on the Row
    and what things cost, about what she thinks of the city, or about the weather
    she can feel coming.
topics:
- key: husband_river
  kind: info
  label: When is your husband due back?
  text: He's been doing the Aldren run for twelve years. Knows every snag and
    sandbar. He's fine. I know he's fine. It's just that he said three days and it's
    been four, and I have this habit of counting. The river is the river. It gives
    when it gives, and holds when it holds. He'll be back, and he'll bring me a river
    spice and say the current was contrary, and I'll tell him I know, and that'll be
    that.
- key: quarter_life
  kind: info
  label: How is life on the Row?
  text: The Row is fine. Good neighbors, the baker does a proper loaf, the smith's
    hammer doesn't start till a decent hour. My one complaint is the bread price,
    which has gone up twice since last autumn, and nobody at the hall seems to think
    that is their concern. The scholars up in their quarter probably don't buy their
    own bread. It shows.
- key: city_scholars
  kind: info
  label: What do you make of the city?
  text: I'll tell you what I think of the city. It's a fine place to live and a
    complicated place to understand, and the scholars in their quarter are welcome
    to try. The temple can count its rivers however it likes. I count the days till
    Davel's back. That's the number that matters to me.
- key: weather_change
  kind: info
  label: Can you really feel the weather turning?
  text: The Blooming came on slowly, maybe three years ago. I started knowing when
    the weather was turning before any sign of it showed. Not seeing it, not hearing
    it. Just knowing, the way you know a pan is hot without touching it. It'll hold
    another day, then turn, I think. Bit of rain, then clear. Useful for a riverman's
    wife, for once. I'll grant it that.
