mobid: 9424
zone: The Confluence
defaultMood: friendly
greetings:
- text: Come in, sit down. River's up and the traffic's good. Interesting week for
    gossip, if that's worth anything to you.
  moods:
  - friendly
opener:
  text: I've been running the Quayside since my sister took her share and went to
    raise chickens inland, which tells you something about both of us. Barge
    crews, merchants, pilgrims, the odd curious traveler down from upriver. They
    all end up here eventually. I know most of their names, and more of their
    business than they'd comfortably guess.
  hints: You could ask Sybba about this week's gossip, about the people she sees
    come through, or about what kind of city the Confluence is. To see what she
    serves, type list.
topics:
- key: gossip
  kind: info
  label: What is the gossip this week?
  text: There's always something moving through the Landings. The river's running
    high, which means faster current and more traffic. Barge masters hate it,
    freight owners love it. There's a grain surplus somewhere up the Aldren, and
    three merchants came through in the past fortnight asking the same questions
    about prices in the same order, which means one of them knows something the
    others don't yet. I don't know which one. And there's a pilgrim group camped
    on the south overlook that has stayed four days longer than the usual circuit.
    Nobody's asked them why yet. Including me. Yet.
- key: people
  kind: info
  label: Who comes through here?
  text: I see everyone who comes through the Landings eventually. Barge crews are
    the regulars. Half of them I know by name, all of them I know by their usual
    drink. Merchants come and go by season. Pilgrims are steady spring traffic on
    the Chrysalis circuit. I never forget a face. That's not a saying in my case,
    it's just how I am. Every person I've served, I can describe in detail years
    later. Makes the Quayside efficient, if nothing else.
- key: confluence
  kind: info
  label: What kind of city is the Confluence?
  text: It's a river-trade city, which means it has the virtues and the vices of a
    place where everything is in transit. People passing through, money passing
    through, news passing through. The permanent residents are the dockfolk, us,
    and we keep the whole thing running while the rest of the world moves over
    us. It's not a bad life. The Aldren keeps changing and we stay put, and that's
    its own kind of stability.
- key: drink
  kind: info
  label: What do you serve?
  text: What the dock people drink, which is honest and nothing fancy. Ale, a bowl
    of river broth, black bread to go with it. All of it at reasonable prices.
