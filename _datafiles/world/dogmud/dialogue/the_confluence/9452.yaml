mobid: 9452
zone: The Confluence
defaultMood: friendly
greetings:
- text: Road-worn? Sit. There is broth on the fire and bread on the board.
  moods:
  - friendly
opener:
  text: Come in. I can see from the road you have had a long one. The pilgrim hall
    is open to any who need it. I have river broth and black bread if you are
    hungry, and bunks upstairs if your feet need a rest before you go on to the
    temple. What do you need?
  hints: You could ask the Hospitaller about the food, about resting here, about her
    work as a Keeper, or about the way to the temple. To see what she sells, type
    list.
topics:
- key: food
  kind: info
  label: What food do you have?
  text: River broth and black bread. I make both each morning, in quantity. It is
    plain fare, but it is hot and filling, which is what a road-worn pilgrim needs.
    I ask a small coin for it, enough to cover the supplies and no more. The hall's
    supplies have to come from somewhere.
  hints: To see what she sells, type list.
- key: rest
  kind: info
  label: Can I rest here?
  text: The dormitory is up the stair. Bunks, clean blankets, dry. Good enough for a
    night's rest. There is no charge for sleeping. That is the founding covenant of
    the hall, and I keep it. The broth and bread, that is what costs. Pilgrims who
    arrive sick or hurt stay until they can walk, no questions asked.
  hints: The dormitory is up the stair from the hall. To lie down and rest there,
    type sleep.
- key: role
  kind: info
  label: Are you one of the Keepers?
  text: I am a Keeper. My charge is practical. Tend the hall, feed the pilgrims, see
    to anyone who has arrived in poor shape, keep the beds made. The Keepers cover
    all the work the temple needs. The Historian explains the founding, the Wardens
    keep order, I keep people fed and rested. The contemplation, the ceremony, the
    doctrine, that is for the senior Keepers in the cloisters. I find my end of the
    work suits me better, and I find the arrangement suits everyone.
- key: temple
  kind: info
  label: How do I get to the temple?
  text: Back out to the forecourt, then over the causeway to the island. The public
    temple is open. The great hall over the waters, the altar, the sacred flame. It
    is worth a visit even if the faith is not yours. The stonework is very old. If
    you want the founding account, the Historian keeps it in the Hall of the
    Founding, just up the avenue. The Warden in the forecourt can tell you more about
    what lies past the public nave.
  hints: The forecourt is north of the hall, and the causeway starts east of the
    forecourt.
