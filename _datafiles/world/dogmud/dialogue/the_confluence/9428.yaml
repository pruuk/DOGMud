mobid: 9428
zone: The Confluence
defaultMood: friendly
greetings:
- text: Solt goods on the counter, river fish smoked fresh this week. What are you
    looking to eat out here?
  moods:
  - friendly
opener:
  text: Most of what comes up the Solt is ore and raw material, and that's not my
    trade. My trade is the smaller cargo. The spice packs from the hill-country
    posts, the salt-cured roe from the estuary traders, the preserved goods the
    Kilnreach crews put up for the long season. Lower volume, better margin, and
    more interesting to work with than a barge full of iron ingots.
  hints: You could ask Varro about the Solt and what it carries, about food that
    keeps on the road, or about why he works the small cargo. To see what he
    sells, type list.
topics:
- key: solt
  kind: info
  label: What comes down the Solt?
  text: Goods you won't find on the Aldren or Brenn runs. The Solt drops fast out
    of the southwestern hills, too fast for heavy barges on the upper stretch, so
    it takes pack-mule trains to get goods down to the part you can sail. That
    extra handling is why hill-country goods cost more. The estuary traders at
    the Solt's mouth do their own salt-curing, roe mostly, sometimes whole fish. I
    buy direct when I can get a reasonable price, which is not always. The
    Kilnreach crews put up spice blends and preserved food for their own use, and
    the surplus comes downriver. River-spice isn't a proper region name. It's just
    what the crews call it, and it stuck.
- key: stock
  kind: info
  label: What food keeps best on the road?
  text: Everything on the counter came in this week or I smoked it myself.
    River-spice is the main draw, a dry blend from the hill-country posts, good
    with meat and river fish both. The salt-cured roe packs well and keeps for
    weeks without cooling. Smoked river-fish I buy from the same boats as the main
    market, but I pick the cuts that cure better and run a longer smoke.
    Watercress I buy fresh off the Solt bank vendors most mornings. I don't stock
    a lot of it, it moves fast. If you're cooking on the road, the roe and the
    spice will carry you further than anything else I sell.
- key: trade
  kind: info
  label: Why work the small cargo?
  text: The advantage of my end of the trade is that nobody else wants to bother
    with it. The big houses move grain and ore because the volume is predictable.
    One pack-mule load of hill spice is harder to arrange than a barge of barley,
    so most factors leave it alone. I don't mind the trouble. The goods are better
    and the buyers are more interesting. Half the specialty cooks in this city
    order from me and nobody else. The other half will, eventually.
