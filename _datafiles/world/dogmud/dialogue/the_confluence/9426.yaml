topics:
- key: barrels
  kind: info
  label: How do you make a barrel?
  text: Now that I can talk about. Oak staves, iron hoops, a mallet and a hooping
    iron. That's most of it. The trick is getting the taper right, so the hoops
    seat without gaps. You leak a barrel once and you learn the taper fast. It
    takes a year to learn the work and a decade to stop making the avoidable
    mistakes. This dock runs on barrels. People forget that.
