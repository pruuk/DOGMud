mobid: 9467
zone: The Confluence
defaultMood: friendly
greetings:
- text: Mm. A moment. I am at a difficult line.
  moods:
  - friendly
opener:
  text: I am mid-copy. The Scriptorium is not usually open to visitors, but I am not
    the one to enforce that. It is painstaking work, and I have no objection to a
    short interruption, provided it is short.
  hints: You could ask the scribe about the copying work.
topics:
- key: the_work
  kind: info
  label: What are you copying?
  text: The consecration ledger, from the third century. The original vellum is going
    at the edges, and Brother Cael decided a fair copy was worth making before we
    lose the text. I am making it line for line, margin note for margin note. There
    are a great many margin notes. The people who first kept these records had a lot
    to say that they did not want to put in the main body. My copy will be the
    working text from now on, which is a strange thing to be responsible for.
- key: the_margin_notes
  kind: info
  label: What do the margin notes say?
  text: Most of them are corrections and glosses. But there are a few, in a different
    hand, added after the main text, that mention older building work that was
    already in place when the temple was built. Dates that do not match the founding
    account. I copy them faithfully. I have decided that is my job, and the meaning
    is someone else's. If you want the records themselves, ask Brother Cael. He
    keeps the Archive.
  hints: Brother Cael keeps the Archive. From the Scriptorium, go south to the North
    Walk, then east.
  marked: true
  heardRequired:
  - the_work
