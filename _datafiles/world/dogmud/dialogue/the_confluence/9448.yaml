topics:
- key: research
  kind: info
  label: What are you researching?
  text: A survey of the secondary sources for the Margin's fourth-water research. The
    short answer is that the accounts disagree with each other, which Riss says is
    normal and expected, and is apparently the whole point. The written histories
    say three rivers. Some of the older pilot logs have notes in the margins that do
    not quite fit the three-river account, but do not clearly support four either. I
    am writing all of it down and trying not to draw conclusions until I have read
    everything. Fenn says that is the correct approach. It is also slow.
- key: quarter_life
  kind: info
  label: What is it like to study here?
  text: Quieter than I expected, honestly. Everyone is working on something specific
    and nobody interrupts unless it matters. The Inkwell Court is good for reading.
    There is enough light, and the courtyard blocks the wind. Fenn makes you wear
    gloves to touch the old documents, which is correct but takes some getting used
    to. The copyist off the Margin Hall can turn a folio copy around in three days,
    which is faster than I thought possible.
