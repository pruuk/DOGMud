mobid: 9436
zone: The Confluence
defaultMood: friendly
greetings:
- text: Welcome to the Three Waters. Come in and take the road off your feet.
  moods:
  - friendly
opener:
  text: The Three Waters has been running since my father's time. The rooms
    upstairs are let to regulars by the season, and the common room is where half
    the city's business gets settled over wine. We get administrators, travelers,
    the odd scholar from the quarter. All sorts. What brings you in?
  hints: You could ask Bremm about the house, about the city's news, or about the
    river tales he hears at the bar.
topics:
- key: rooms_food
  kind: info
  label: What is the house like?
  text: The rooms up the stair are taken by the season, so I have none for a
    night's stay. The river side is quieter after the sixth hour. The square side
    gets the town crier's bell at sunrise, which some of my regulars find useful
    and others find grounds for complaint. The kitchen runs from morning to late
    evening for the house. Bread and broth always, river fish when the boats have
    had a good morning. The house wine comes up from the Amber Valley and is
    reliable. The strong ale divides the regulars.
- key: fourth_water
  kind: info
  label: What river tales do you hear at the bar?
  text: You hear all sorts across this bar. There was an old Aldren bargeman,
    Rosse, who came in every spring for thirty-odd years. Good tipper. He swore
    the oldest maps at the junction showed a fourth water. Narrower than the main
    three, he said, a little channel that must have dried up or shifted course
    long before his time. Whether the maps were right, whether the river changed,
    or whether old Rosse was reading them wrong over his third cup, I couldn't
    tell you. The scholars up in their quarter argue about it still, I'm told.
    Rosse figured it was an old run of the Solt from some earlier course. Could
    be. You hear all sorts.
  marked: true
- key: city_news
  kind: info
  label: What is the news in the city?
  text: You hear everything across this bar eventually. The council is at it again
    over the ferry levies. The Long Quay traders say they're too high, the council
    says the upkeep costs are real, and no one agrees on the numbers. The craft
    guilds' petition about registration rules went to committee last Twoday, which
    means it will come back in some changed form that neither side wanted. And
    there's been talk of a new trade charter for the roads south, though that one
    has been talk for three seasons running. The usual.
