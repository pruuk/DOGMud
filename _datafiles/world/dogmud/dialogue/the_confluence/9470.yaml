mobid: 9470
zone: The Confluence
defaultMood: friendly
greetings:
- text: Oh. I did not hear you come in. Mind the pile by the south wall. I haven't
    moved it yet.
  moods:
  - friendly
opener:
  text: Sorry. I'm junior enough that visitors to the cloisters still surprise me. I
    keep the Garth and the walks clean. It sounds small, but the Garth is the heart
    of the cloisters, the part everything else looks onto. I take it seriously.
  hints: Choose a line below if you would like to hear about the Garth, or about
    where to find the senior Keepers.
topics:
- key: the_garth
  kind: info
  label: What is the Garth?
  text: The Garth is the old word for it. A garden court, though there is not much
    garden, only the grass and the well and the stone walks around the edge. It is
    the center of the cloisters. The senior Keepers' rooms are off those walks, and
    I see them going in and out. I do not ask what they are discussing. I keep the
    flagstones clean and I try not to be noticed, which is a skill I am still
    learning. It is a good job. You can see the sky.
- key: keepers_where
  kind: info
  label: Where do the senior Keepers work?
  text: Aldric the Keeper is in the Chapter House through the day, west off the North
    Walk, the big door. Brother Cael is in the Archive, east off the North Walk, and
    it is always open. The Scriptorium is at the north end of the North Walk, and
    the scribe works there. Prioress Crane keeps her Oratory, east off the East
    Walk. I can tell you where everyone is. I have been sweeping these walks for two
    years.
  hints: The North Walk is north of the Garth, and the East Walk is east of it.
  marked: true
