mobid: 9459
zone: The Confluence
defaultMood: friendly
greetings:
- text: This door leads to the cloisters, where the Keepers work. The nave is the
    public temple. The great hall, the crossing, the reliquary. What did you need?
  moods:
  - friendly
opener:
  text: The nave is open to you. The door behind me is not. It leads to the
    cloisters, the archive, and what lies below, and none of that is open to
    visitors. What did you want to know?
  hints: You could ask the Warden why the cloisters are closed, or how to reach the
    senior Keepers if your questions warrant it.
  variants:
  - questRequired:
    - 74-start
    text: The Keepers have admitted you. Go through, and keep your voice down in
      the cloisters.
    hints: Brother Cael keeps the Archive. Go east twice to the Cloister Garth,
      north to the North Walk, then east into the Archive. He sleeps in the
      archive chair late at night. Type talk cael.
  - questRequired:
    - 73-end
    text: Word came from the Officiant about you. The Keepers will see you. Go
      through, and keep your voice down in the cloisters.
    hints: Brother Cael keeps the Archive. Go east twice to the Cloister Garth,
      north to the North Walk, then east into the Archive. He sleeps in the
      archive chair late at night. Type talk cael.
topics:
- key: margin_aside
  kind: info
  label: Will you let me through, after what I have seen?
  text: You have been to the Scholars' Quarter. I can see it in how you look at
    the door. The Officiant has sent word, and the door is open to you. Keep your
    voice down beyond it. The work there needs quiet.
  hints: Brother Cael keeps the Archive. Go east twice to the Cloister Garth,
    north to the North Walk, then east into the Archive. He sleeps in the
    archive chair late at night. Type talk cael.
  questRequired:
  - 73-end
  questExcluded:
  - 74-start
# closed folds the "why reason secret closed" pattern (kept as topic
# hidden), whose text was the first two sentences of this reply.
- key: closed
  kind: info
  label: Why are the cloisters closed to visitors?
  text: Not secrecy. Necessity. The cloisters are the Keepers' working space, their
    archive and copying rooms. Visitors in the archive interrupt the work. And the
    deeper the space runs, the quieter it must be kept. What lies beneath the
    cloisters requires a quiet we cannot hold with visitors moving through. The nave
    does not require that. The nave is open to everyone.
- key: senior_keepers
  kind: info
  label: How would I reach the senior Keepers?
  text: The senior Keepers do not take visitors at the door. If your questions run
    beyond the nave, speak first to the Officiant at the crossing. He keeps the
    public rite and is the face of the order here. If your questions are the kind
    that warrant it, he will send word to the cloisters on your behalf. It is not a
    short process. But it is the process.
  hints: The Officiant keeps the rite at the Crossing, west twice from here.
  marked: true
  questExcluded:
  - 73-end
