mobid: 9421
zone: The Confluence
defaultMood: friendly
greetings:
- text: Morning catch is on the slab. River eel, confluence trout, smoked fish
    that'll keep you for days. Take a look.
  moods:
  - friendly
opener:
  text: Three rivers means three kinds of fish that haven't worked out the
    territory between them. Pike from the Aldren, silver trout from the Brenn,
    eel where the Solt runs cold along the eastern bank. I buy off the boats every
    morning, and nothing on this slab sits long. Best variety in the region, if I
    say so myself.
  hints: Choose a line below if you would like to hear about her fish and how to
    cook them, about the three rivers, or about her years on the quay. To see
    what she sells, type list.
topics:
- key: fish
  kind: info
  label: How should I cook these fish?
  text: Everything on the slab is today's catch or yesterday's smoked. Nothing
    here came out of the water more than two days ago, and I'd know. The eel is
    best smoked. You want the oil in the flesh, and smoking keeps it where it
    belongs instead of running out in the pan. The trout is good raw-salted if
    you're eating it today, better over a fire. Watercress I pick fresh from the
    Solt bank most mornings. It pairs with anything and keeps the scurvy off if
    you've been living out of a pack. The mussels come from the confluence pool,
    where the water goes a little brackish. Different flavor from a river mussel.
    Worth trying if you haven't.
- key: rivers
  kind: info
  label: What does each river give you?
  text: The Aldren runs cold and dark out of the north. Deep channel, good for
    pike and the big catfish in summer. The Brenn comes in from the east, warmer
    and shallower, gravel bottom. That's your trout water. The Solt is the fast
    one. It drops clear out of the southwestern hills, and that's where the eel
    like the current. Different water in each one. I can taste the source in a
    fish without being told. I don't advertise that. People get strange about
    it.
- key: confluence
  kind: info
  label: How long have you sold fish here?
  text: I've had my slab in the Landings since I was young, and I'm not young
    anymore, so take that as your measure of the place. Good market. Everything
    moving downriver passes through, and every upriver boat stops here first.
    Steady trade. I'm not going anywhere, and neither is the fish.
