mobid: 9457
zone: The Confluence
defaultMood: friendly
greetings:
- text: Welcome to the great hall. Stand a moment at the grate. The waters are best
    heard, not described.
  moods:
  - friendly
opener:
  text: Welcome. The rite is open to all who come. I keep it here at the crossing,
    where the three waters become one beneath the floor. The temple was raised over
    this meeting, and the meeting is the heart of everything we hold. What did you
    wish to understand?
  hints: Choose a line below to learn about the rite and the waters below, about
    the ringed mark the temple keeps, or about the temple beyond the sanctuary.
  variants:
  - questRequired:
    - 73-end
    questExcluded:
    - 74-start
    text: Welcome. You have come from the Scholars' Quarter, I think. People who
      have been there look at the grate differently. What did you wish to
      understand?
    hints: Choose a line below to hear you, about the rite, or about the temple
      beyond the sanctuary.
topics:
- key: q74_admit
  kind: info
  label: Will you send word to the senior Keepers?
  text: You have followed this further than most, and the senior Keepers know it.
    I have sent word already. They will not turn you back at the door now. Go
    through to the cloisters, beyond the warded door past the Chapel of the Brenn,
    and ask for Brother Cael in the Archive. He keeps the building records. If
    anyone will show you what the temple was raised on, it is him.
  hints: From the Crossing, go east three times through the warded door to the
    Cloister Gate, east to the Cloister Garth, north to the North Walk, then east
    into the Archive. He sleeps in the archive chair late at night. Type talk
    cael.
  marked: true
  questRequired:
  - 73-end
  questExcluded:
  - 74-start
  - 74-end
- key: margin_aside
  kind: info
  label: Is the stone under the grate older than the rite?
  text: 'You have the look of someone who has stood in the Scholars'' Quarter and
    listened. I will say it once, here, where the water can hear and no one else: I
    give the rite as it was given to me. Whether the stone beneath the grate was
    laid for our meaning or for one we have forgotten, I am not the one to settle
    that, and the great hall is not the place to ask it. If you must press it, it is
    the senior Keepers, in the cloisters, who hold what there is to hold. Not the
    rite. Not me.'
  questRequired:
  - 73-end
# rite folds the "water grate river" pattern (kept as topic river): its
# "three rivers, one water" line opens the reply.
- key: rite
  kind: info
  label: What is the rite you keep here?
  text: 'Three rivers, one water, beneath this floor. The rite is simple: we name
    the three rivers in their old order, Aldren of the north, Brenn of the east,
    Solt of the southwest, and we mark their meeting beneath the floor. The water
    has done it without us for longer than the temple has stood. We only attend,
    and say so.'
- key: symbol
  kind: info
  label: What is the ringed mark the temple keeps?
  text: The ringed mark above the doors. The sealed soul in its cocoon, the ring of
    becoming. The earliest rendering of the Chrysalis truth, cut by the first
    Founders. We treat it as the oldest and truest thing we keep. The Sacristan can
    show you older still, in the reliquary, if relics interest you.
  hints: The Reliquary is south twice from the Crossing, through the Sanctuary.
- key: beyond
  kind: info
  label: What lies beyond the sanctuary?
  text: The public temple ends at the sanctuary. Past it lie the cloisters and the
    archive, kept by the senior Keepers, and the old stone runs deeper than the
    cloisters, beneath the floor, beneath the grate, older than the temple raised
    on it. That depth is not shown to visitors. If your questions run that far, it
    is the senior Keepers you must satisfy. If they are the kind the Keepers should
    hear, tell me. I keep the rite and the order's public face, and I decide whether
    to send word to the cloisters on your behalf. It is not a quick process, but it
    is the way.
  hints: The Officiant sends word to the cloisters only for someone whose questions
    the senior Keepers should hear.
  marked: true
