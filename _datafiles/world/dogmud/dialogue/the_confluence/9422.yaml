mobid: 9422
zone: The Confluence
defaultMood: neutral
greetings:
- text: Name and cargo. If you're not carrying cargo, name and purpose. We keep a
    manifest here.
  moods:
  - neutral
- text: Morning. The quay's full until the afternoon barge loads out. Find space
    on the upper dock if you need to stand somewhere.
  moods:
  - friendly
opener:
  text: Everything coming south off the Aldren, everything in from the Brenn or
    the Solt, crosses this quay. The Landings is the way in for all three-river
    trade, and my work is keeping it moving. Freight tallies, passenger
    manifests, tide scheduling, tolls, and the odd dispute all land on me first.
    If it crosses my quay, it goes in my ledger. So, what are you carrying?
  hints: Choose a line below to hear about how the Landings works, about the
    river trade that moves through, or about the people who work the quay.
topics:
- key: landings
  kind: info
  label: How does the Landings work?
  text: It's the river side of the city. First land you hit coming off the
    Aldren, first water you reach going out. We handle freight intake, customs
    inspection, passenger manifests, barge scheduling, and overnight holds when a
    cargo can't move before the tide. Everything goes through the manifest. That's
    the rule, and it's been the rule since before I took this post. The toll is
    the standard river toll, one in twenty of declared value. You declare, I log,
    we both move on. Everything past the South Quay Gate is the Confluence proper.
    Markets, the civic hall, the temple quarter. We just move what comes in and
    send out what leaves. Not glamorous. Essential.
- key: trade
  kind: info
  label: What comes down the rivers?
  text: The Aldren brings grain, timber and quarry stone from the north. The Brenn
    brings wool and finished cloth from the hill country to the east. The Solt
    carries copper ore and tallow out of the southwestern mining settlements. What
    goes back up is mostly finished tools, medicine, glassware, the things the
    upriver towns can't make themselves. I see all of it on the manifest. It gives
    you a clearer picture of what the region needs than any merchant or
    politician could.
- key: quayfolk
  kind: info
  label: Who are the people who work this quay?
  text: Quayfolk is what they call the river-trade people. Barge crews,
    dockhands, traders, chandlers, the tavern. Not a guild, not a union, just
    people who've built their lives around the water. No ceremony to it. The work
    is the thing. You do the work, you're one of us. You don't, you're not. Simple
    enough, and it's served us well.
