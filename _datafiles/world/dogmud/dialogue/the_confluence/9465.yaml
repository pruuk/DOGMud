defaultMood: friendly
greetings:
- text: Come in, and mind the ledger on the stand. I am in the middle of a reading
    I have been putting off for ten years, and it is worse than I expected.
  moods:
  - friendly
opener:
  text: I am Brother Cael, and I keep the Archive, within limits. The temple's
    building records are here, its founding accounts, the surveyor's work.
    Most days nobody asks to see any of it, so you have my full attention.
  hints: You could ask Brother Cael about the archive, about what the building
    ledger on the stand says, or about Aldric, who leads the order.
  # Quest 74 states first (first match wins; HasQuest is also true at every
