topics:
- key: q74_grant
  kind: offer
  quest: 74
  label: The Undercroft
  playerLine: Can I help you read what the temple's records say?
  text: 'So the Margin''s question has reached the archive, and you with it. Good.
    I am tired of being the only one who reads these. Here is the work, and it is
    reading, not digging: three of the temple''s own records disagree with its
    founding story. The building ledger here, open on the stand. The consecration
    record in the Chapter House. And a mason''s survey in the Older East Corridor,
    by the stair. See all three yourself. Aldric has allowed that much. Then come
    back to me.'
  hints: Accept, then read the building ledger open on the stand beside Brother
    Cael. Type look ledger.
  questRequired:
  - 73-end
  questExcluded:
  - 74-start
  - 74-end
  grantsQuest: 74-start
- key: q74_turnin
  kind: info
  label: I have read all three records.
  text: 'You have seen all three, then: the ledger''s silence, the record''s careful
    wording, the mason''s plain note. Three hands, and they agree on the one thing
    the founding story will not: the temple was raised on something older, and the
    Keepers have kept it so. I have told Aldric you should see for yourself. He has
    allowed a supervised descent. The stair is past the Older East Corridor. Go down
    when you are ready. And go carefully.'
  hints: From the Archive, go west to the North Walk, south to the Cloister Garth,
    east twice to the Prioress's Oratory, south into the Older East Corridor, then
    east to the Descent Stairhead. Go down, then west three times to the Seeping
    Passage. Go down again, then west twice to the Water Gallery. Go down once more,
    then west three times to the Chamber of the Old Sky. Type look orbital face.
  marked: true
  questRequired:
  - 74-survey
  questExcluded:
  - 74-descent
  - 74-end
  grantsQuest: 74-descent
- key: q74_recovery
  kind: info
  label: I have lost the rubbing of the old sky.
  text: 'You took a rubbing and you have mislaid it? It happens to better archivists
    than you. Sit a moment. I can lay out a clean copy from what you describe. The
    lines are simple enough: four rings where there should be three. There. Do not
    lose this one. And think on who should have it: Aldric in the cloisters, who
    would keep it quiet, or the Margin scholar at the portico, who would not.'
  hints: Talk to Aldric and to the Margin scholar before you choose who gets the
    rubbing, because neither choice can be undone. From the Archive, go west to the
    North Walk, then west into the Chapter House. Type talk aldric.
  marked: true
  questRequired:
  - 74-reveal
  questExcluded:
  - 74-end
  itemExcluded: 40142
  givesItem: 40142
# archive folds the "archive records building ledger" pattern into the
# root's account of the room.
- key: archive
  kind: info
  label: What does the Archive keep?
  text: The Archive holds what the temple kept. Building records, consecration
    accounts, maintenance logs from the first century onward. Most of it is
    routine. Some of it is not.
- key: what_the_ledger_says
  kind: info
  label: What does the open ledger on the stand say?
  text: The ledger records the stones laid and the hands that laid them. It does not
    editorialize. But the dates in the lowest courses are a generation earlier than
    the founding account gives them, and the stonework notes reference preexisting
    load-bearing work already in place. The ledger does not say what that work was.
    It simply assumes you already know. I find that interesting. I have found it
    interesting for some years.
  hints: Brother Cael has read the ledger more closely than he admits.
  marked: true
- key: the_margin
  kind: info
  label: Has the Margin asked you about this before?
  text: The Margin sent someone here, eventually. I wondered when they would. Quist
    has had the question for forty years. I have had it from the archive side for
    nearly twenty. The problem is not finding the evidence. The problem is that the
    evidence is in the temple's own records, and no one has been willing to look at
    it directly. Until now, perhaps.
  questRequired:
  - 73-end
- key: aldric_note
  kind: info
  label: What kind of man is Aldric?
  text: Aldric is the head of the order, and he is not a fool. He has read these
    records. He made his peace with what they say a long time ago, and his position
    since has been that the temple's work is the temple's work, and the ground
    beneath it is not our business to disturb. I disagree with him quietly, which
    is the only way I have managed to stay in this room for twenty years. Prioress
    Crane believes, sincerely and completely, which is its own kind of peace. I have
    a great deal of respect for her.
