mobid: 9598
zone: The Confluence
defaultMood: friendly
opener:
  text: Welcome up. Mind the stairs. Good light in here this time of day. What can I
    cut or set for you?
  hints: Choose a line below if you would like to hear about the jeweler's
    bench, or about her materials. To see what she sells, type list.
topics:
- key: gem
  kind: info
  label: Can I work at your bench?
  text: I cut and set stone. Rings, pendants, bracelets, whatever the metal will hold.
    Every setting I sell up here has been checked twice under the lens, and I do not
    let flawed work leave this bench. You may use it if you mind my tools. Bring a
    raw gem and know what you have in mind. Small work wants a steady hand and a
    little patience.
  hints: To see what you know how to make, type craft list.
- key: stock
  kind: info
  label: What materials do you sell?
  text: Copper, silver, and gold wire, polished stone, raw gem, and gem dust on the
    tray, along with chain link, black pearl, and a chrysalis setting or two. Ask
    after what you need and I will name the price.
