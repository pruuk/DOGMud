mobid: 9441
zone: The Confluence
defaultMood: friendly
greetings:
- text: Come in, come in. Mind the charts on the floor. They are in an order, even
    if it does not look it. You have the air of someone who asks questions. Good.
    I have one I cannot stop asking.
  moods:
  - friendly
opener:
  text: 'Hm. A visitor who is not one of my own students. Sit, if you can find a
    chair not buried in paper. I am Quist. The others call me the elder, which only
    means I have been wrong the longest. I have spent the back half of my life on
    one question, and I am too old now to pretend it is a small one: how many rivers
    meet at the Confluence? You will say three. Everyone says three. But the oldest
    surveys do not agree with everyone, and I have never been able to make the city
    look at why.'
  hints: Choose a line below if you would like to hear about the Margin and what
    they study, or about his silver eyes. He would welcome help with his
    question.
  # Quest 73 states first (first match wins; HasQuest is also true at every
  # later step, so each variant excludes the step after it).
  variants:
  - questRequired:
    - 74-end
    questFlagRequired:
      74-allegiance: margin
    text: It is on my table, beside the three records, and it is being copied as
      we speak. There was a fourth, and now it is written where no one can
      unwrite it.
    hints: Choose a line below to hear about the Margin, or about his silver
      eyes.
  - questRequired:
    - 74-end
    text: Aldric has it, I hear. Then the temple keeps its count a while longer.
      The records here will wait. They are good at waiting.
    hints: Choose a line below to learn about the Margin, or about his silver
      eyes.
  - questRequired:
    - 74-start
    text: The temple let you into its own records? Then read them the way you read
      mine. Slowly, and twice.
    hints: Choose a line below if you want to hear about the Margin, or about
      his silver eyes.
  - questRequired:
    - 73-end
    text: There was a fourth. You have seen it with your own eyes now, and no one
      can tell you that you imagined it. The rest of the answer is not in any archive
      of ours. It is under the temple.
    hints: The temple stands on its island south of Tri-Cross Square, and the
      Officiant keeps its public rite at the Crossing in the great hall. From the
      Margin Hall, go east five times to Tri-Cross Square, south twice to the
      Processional Gate, south four times to the Temple Forecourt, east four times
      across the Causeway to the Temple Steps, then south four times through the
      Portico, the Narthex and the Public Nave to the Crossing. The Officiant
      sleeps at the Crossing late at night. Type talk officiant.
  - questRequired:
    - 73-map
    questExcluded:
    - 73-end
    text: You have the look of someone who has seen all three. Well? Tell me.
    hints: Choose The Margin Notation below to tell Quist what you found.
  - questRequired:
    - 73-scrivener
    questExcluded:
    - 73-map
    - 73-end
    text: Two records, then. The third hangs in public, and no one looks at it. The
      great map in the Municipal Hall, and the note in its margin.
    hints: From the Margin Hall, go east three times to the Hall of Records, then
      east into the Municipal Hall. Type look marginal note.
  - questRequired:
    - 73-chart
    questExcluded:
    - 73-scrivener
    - 73-end
    text: You saw the bookseller's chart? Good. Now Tallis the scrivener's old
      charts, at his stall by the Weighhouse Yard.
    hints: From the Margin Hall, go east four times to the Municipal Hall, north to
      the Hall Steps, east to the North Cross, north four times to the Weighhouse
      Yard, then west into the Scriveners' Stall. Type look old charts.
  - questRequired:
    - 73-start
    questExcluded:
    - 73-chart
    - 73-end
    text: Three records, remember. Start with the damaged chart in the bookseller's
      shop here in the quarter. Then Tallis's old charts, then the great map in the
      Municipal Hall. See all three, then come back to me.
    hints: From the Margin Hall, go east twice to the Scholars' Gate, then south
      into the Bookseller's. Type look damaged chart.
topics:
- key: commission
  kind: offer
  quest: 73
  label: The Margin Notation
  playerLine: Can I help you make the city look at the old surveys?
  text: You would? Then here is the work, and it is reading, not adventuring. Three
    records survive that disagree on the count of the waters at the junction. Three,
    made by different hands, generations apart, and each one shows a fourth channel
    that the official maps do not. I want you to see all three with your own eyes,
    so no one can tell you later that you imagined it. The damaged chart in the
    bookseller's shop here in the quarter. Tallis the scrivener's old charts, at his
    stall by the Weighhouse Yard. And the marginal note on the great map in the
    Municipal Hall. Three records. Then come back to me.
  hints: Accept, then start at the Bookseller's. From the Margin Hall, go east twice
    to the Scholars' Gate, then south. Type look damaged chart.
  questExcluded:
  - 73-start
  - 73-end
  grantsQuest: 73-start
- key: report
  kind: handin
  quest: 73
  label: The Margin Notation
  playerLine: I have seen all three records, and they agree.
  text: You have seen all three, then? The bookseller's damaged chart, Tallis's old
    copies, the hall's own map in its margin? Then you have seen what I have seen,
    and what a dozen scholars before me saw and could not make the world look at.
  hints: Quist's answer points under the temple on its island, where the Officiant
    keeps the public rite at the Crossing. From the Margin Hall, go east five times
    to Tri-Cross Square, south twice to the Processional Gate, south four times to
    the Temple Forecourt, east four times across the Causeway to the Temple Steps,
    then south four times through the Portico, the Narthex and the Public Nave to
    the Crossing. The Officiant sleeps at the Crossing late at night. Type talk
    officiant.
  questRequired:
  - 73-map
  questExcluded:
  - 73-end
  grantsQuest: 73-end
# margin_2 (the Margin's name, from the "margin scholars who" pattern) is
# folded into margin: one topic about who they are.
- key: margin
  kind: info
  label: Who are the Margin, and what do you study?
  text: We are the Margin. Scholars who read the notes in the margins, the things
    the main text was sure it had settled. We keep the source records and we ask
    the questions the temple considers answered. The official account says three
    rivers, a founding, a tidy beginning. We have a great many old documents that
    do not quite fit that account. We do not shout about it. Scholars who shout tend
    to find their archives reorganized. We simply keep the records, and wait for
    someone to ask the right question. Mostly we are harmless.
  hints: The Margin are quiet scholars who keep the records the temple's story
    leaves out.
  marked: true
- key: life
  kind: info
  label: What happened to your eyes?
  text: 'Fifty years squinting at faded ink will take your eyes. Mine have gone
    silver. A Blooming, the valley would call it, and a useful one: I can still read
    an erased line where a young scholar sees blank vellum. I have read a great many
    things that were meant to stay erased. That is rather the whole trouble with me.'
