mobid: 9486
zone: The Confluence
defaultMood: friendly
greetings:
- text: Come in out of the road. Something hot to eat?
  moods:
  - friendly
opener:
  text: In you come. This is the Travelers' Inn, and it's stood as long as the
    east gate has. Most who come in are road travelers, merchants bound to or
    from Greenford, pilgrims arriving at the Confluence, the odd road warden off
    a cold patrol. Sit yourself down. What can I get you?
  hints: You could ask the innkeeper about the food she serves, about a bed for the
    night, or about who passes through the inn. To see what she sells, type list.
topics:
- key: food
  kind: info
  label: What is cooking today?
  text: Travelers' stew is the house dish, and the best thing I make. Whatever came in
    from the farms and the fish landing, cooked long since early morning with salt
    and a little pepper. It sets you up for the road or settles you after it, which
    is all a road inn really needs to do. River broth if you want something lighter.
    Black bread baked this morning. I keep the kitchen simple. Good food, reliable,
    enough of it. You'll leave satisfied or I've done something wrong.
  hints: To see what she sells, type list.
- key: rooms
  kind: info
  label: Is there somewhere I can sleep?
  text: My rooms are spoken for most nights, by Greenford merchants who keep them by
    the season. Road travelers don't linger, which is the nature of the trade, but
    those ones come back like the tide. The east rooms get the morning light over the
    Brenn, and the west ones are darker but warmer, and they argue over both. If
    you only need to rest, the fire in the common room is lit all night, and
    nobody will move you on. The shutters keep the road noise out after dark.
  hints: The common room is south of the inn. To lie down and rest there, type sleep.
- key: travelers
  kind: info
  label: Who stops at your inn?
  text: All sorts. Greenford merchants heading to the markets here, pilgrims who've
    come the long way around and arrived at the east gate instead of the river
    landing, road wardens stopping in on cold mornings, the odd family with a cart
    full of everything they own, moving one way or the other. You get a feel for
    people, watching them walk through that door. The ones who've had a good journey
    and the ones who haven't. Both need the same thing, more or less.
