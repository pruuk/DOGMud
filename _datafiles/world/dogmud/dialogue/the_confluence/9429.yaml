mobid: 9429
zone: The Confluence
defaultMood: friendly
greetings:
- text: River-cloth, rope, waterskins, tinderboxes. Ask me anything about them.
    I've heard every question at least once, and I still don't mind.
  moods:
  - friendly
opener:
  text: Most folk who reach my stall want the same few things, whatever it takes
    to move freight, make a camp or outfit a barge for a run. The River Market
    runs on that everyday trade, and so do I. I'm no specialty shop. I keep
    cloth, rope, tinder and skins, so you don't have to go to four different
    vendors, and my prices are for the everyday market, not the guild-house
    crowd.
  hints: You could ask Lenne about river-cloth, about the rope she stocks, or
    about what else is in the market. To see what she sells, type list.
topics:
- key: cloth
  kind: info
  label: What is river-cloth made for?
  text: River-cloth is a particular weave. Lighter than wool, faster drying, and it
    holds its shape in the damp without the rot you get with cheap linen. It's made
    upriver on the Aldren for the barge trade and comes down on the freight runs.
    Most of what I stock is undyed. People bleach or dye it for their own use. If
    you want finished cloth, the weavers up on Craft Row sell it by the roll. I
    sell by the bolt, which is what most people need.
- key: rope
  kind: info
  label: Which rope weight do I need?
  text: There are three weights. Light is for lashing and bundling, net repair,
    securing packs. Medium is your everyday mooring line and handles most knot
    work. Haul weight is heavy-duty, more than most travelers need, but the barge
    crews buy it in lengths between resupply stops. The chandler down in the
    Landings carries a fourth, rigging-grade gauge, if you need specialist line,
    but that's a different trade.
- key: market
  kind: info
  label: What else is in the market?
  text: The River Market runs most of the year. It shuts in the deep freeze and
    opens again when the ice breaks. The Rivermen's Guildhall is just west of my
    stall. The market cross is east of here. From the cross, the quay road runs
    south to the Weighhouse Yard, where you certify cargo, and the scrivener's
    stall is on the west side of that yard. The Spice Quay vendor is east of the
    cross and down along the Long Quay, for preserved food and hill-country spice.
    For tarred line, the chandler in the Landings is the one to find. I cover the
    middle of the market, which is where most people end up anyway.
  marked: true
