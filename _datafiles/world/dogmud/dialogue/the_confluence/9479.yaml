mobid: 9479
zone: The Confluence
defaultMood: friendly
greetings:
- text: I was the Third Clerk of Tolls for twelve years. You wouldn't know it to look
    at me. What is it?
  moods:
  - friendly
opener:
  text: Sit down if you like. The chair is probably fine. I was the Third Clerk of
    Tolls for the Brenn arm for twelve years. Not the head clerk. That was Veran,
    whom I will not describe. After that I was Senior Assessment Clerk for four
    years, and for a brief period Acting Head of the Quarterly Review, before the
    position was abolished. They gave me a handshake. From the Deputy Registrar. I
    have retired to this lane, I drink cold tea, and I have many opinions. What would
    you like to know?
  hints: You could ask him about his old work, about how he came to live in this
    lane, or about the memory the Blooming gave him.
topics:
- key: old_work
  kind: info
  label: What was your work for the city?
  text: Tolls and assessments. Exacting work, and nobody remembers exacting work. The
    Brenn arm bridge toll schedule has not been revised since the Wren Commission,
    which met the year I began as Third Clerk. I am the only person who knows this. I
    raised it twice in committee. The committee wrote it down and lost the paper.
    The guild registration fees are also out of date. The cooperage and potters'
    fees have not been adjusted in a decade. And there is an error in the
    residential lane assessments that would take an afternoon to correct and has
    been outstanding for seven years. Nobody has asked me. I am here. I am findable.
- key: quarter
  kind: info
  label: How did you come to live in this lane?
  text: When the position was abolished I had two choices. The Aldren arm, where a
    former colleague had an offer, or this lane, where the rent was reasonable and
    the baker does a proper loaf. I chose the loaf. It has been, on balance, the
    correct choice. The lane is quiet. The neighbors are decent. I sit at my door
    most mornings and I am largely left alone, which is either a comfort or an
    indignity, depending on my mood.
- key: numbers
  kind: info
  label: What did the Blooming do to your memory?
  text: The Blooming arrived, as these things seem to, at an inconvenient time. I can
    now recall any figure I have ever written in an official document. Every toll
    tallied, every quarterly sum, every assessment carried forward, to the penny.
    Perfect, immediate, without effort. I could not do this during twelve years of
    active service, when it would have been of real value. I can do it now, sitting
    at my door, talking to strangers. The Blooming has a sense of humor. That is the
    conclusion I have reached.
