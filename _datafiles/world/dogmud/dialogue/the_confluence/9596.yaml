mobid: 9596
zone: The Confluence
defaultMood: friendly
opener:
  text: Mind the sparks. Come in, but stay clear of the anvil until I set the hammer
    down. What do you need forged?
  hints: Choose a line below if you want to hear about her forge, or about her
    smithing materials. To see what she sells, type list.
topics:
- key: forge
  kind: info
  label: Can I use your forge?
  text: I work steel and iron both. Blades, fittings, whatever the river trade needs.
    The forge stays lit from morning to evening, and you may work at it if you stay
    out of my way. Bring the materials and a clear idea of what you want to make.
  hints: To see what you know how to make, type craft list.
- key: stock
  kind: info
  label: What materials do you sell?
  text: Steel ingot, lake-iron nodule, and pine pitch, along with the plain smithing
    stock. Iron ingot, wooden plank, chain link, coal dust. Speak your business and I
    will tell you the price.
