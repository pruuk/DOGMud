mobid: 9449
zone: The Confluence
defaultMood: friendly
greetings:
- text: Welcome to the Hall of the Founding. Ask, and I will tell you how the Confluence
    began.
  moods:
  - friendly
opener:
  text: I keep the founding account here. How the three rivers were drawn together,
    the temple raised on the island, the first Keepers set to tend it. The account
    is on the wall, and I am here to explain it. What did you wish to know?
  hints: You could ask the Historian about the founding, about the old mark above the
    temple doors, about the Keepers, or about what lies past the public temple.
topics:
- key: margin_aside
  kind: info
  label: The Margin says there was a fourth water.
  text: You have the look of someone who has been talking to the scholars across the
    city. I will say this once, quietly. I give the account as I was given it.
    Whether the first mark is doctrine, or something the doctrine was laid over, is
    not a question the Hall is for. If you mean to press it, it is the senior
    Keepers you want, in the cloisters beyond the public temple. Not me.
  hints: The cloisters lie past the Chapel of the Brenn, inside the temple. The
    Officiant at the Crossing decides who goes further.
  marked: true
  questRequired:
  - 73-end
- key: founding
  kind: info
  label: How did the Confluence begin?
  text: Three rivers, the Aldren from the north, the Brenn from the east and the Solt
    from the southwest, join below the island. On that island the first Founders
    raised the temple, on ground they held sacred before a stone was cut. The
    Keepers have tended it ever since. It is a tidy beginning, and we are fond of
    it.
  hints: To study the carving on the wall, type look founding relief.
- key: symbol
  kind: info
  label: What is the old mark above the temple doors?
  text: The first mark, yes. The ringed cocoon cut above the temple doors, in the
    Founders' own hand. It is the earliest rendering of the Chrysalis truth we have.
    The sealed soul at the center, the cocoon of change around it, the ring of
    becoming. The Founders cut it before the altar stone was laid. It is older than
    anything else in the temple, and we treat it accordingly.
  hints: The mark is above the great doors at the Temple Portico, across the
    causeway. To study it there, type look weathered symbol.
- key: keepers
  kind: info
  label: Who are the Keepers?
  text: We are the Keepers, the temple's order. We tend the sacred fire, keep the
    founding record, and explain the account to those who come and ask. We are not a
    contemplative order. We are a practical one. The record must be kept. The account
    must be explained. It is not a difficult charge. The story is a clear one.
- key: inner_temple
  kind: info
  label: What lies past the public temple?
  text: The public temple is open to all across the causeway. Beyond it lie the
    cloisters and the archive, kept by the senior Keepers. And beneath the island is
    older work the Founders consecrated, the undercroft, which is not shown to
    visitors. If your questions run that deep, it is the senior Keepers you must
    satisfy, not the Hall.
