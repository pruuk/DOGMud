mobid: 9597
zone: The Confluence
defaultMood: friendly
opener:
  text: Yes. Come in, and close the shutter behind you. The circle is drawn. What
    binding do you need?
  hints: You could ask Merrow about the enchanting circle, or about their chrysalis
    materials. To see what they sell, type list.
topics:
- key: enchant
  kind: info
  label: Can I use your enchanting circle?
  text: I work chrysalis materials into lasting bindings. Shard, paste, catalyst,
    setting. Every sigil traced in this room has a purpose. I do not draw them for
    curiosity. You may work in the circle if you bring the piece and the materials
    and treat it with care.
  hints: To see what you know how to make, type craft list.
- key: stock
  kind: info
  label: What materials do you sell?
  text: Chrysalis core, shard, binding paste, mutation catalyst, and setting. Hive
    fragment as well, oak bark for ward inscriptions, and black pearl for the finer
    work. State what you need and I will name the price.
