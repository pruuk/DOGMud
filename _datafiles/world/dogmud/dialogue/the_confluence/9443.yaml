zone: The Confluence
defaultMood: friendly
greetings:
- text: I'm doing a comparison. If you have a question about the rivers or the junction
    work, go ahead.
  moods:
  - friendly
opener:
  text: You have caught me between two surveys, which is where I usually am. I
    am Riss, one of the Margin's cartographers. I lay old surveys side by side
    to see where they agree and where they part ways, and then I try to work out
    whether the river changed or the surveyor did. Just now it is the junction
    series. Ask, by all means.
  hints: Choose a line below if you would like to hear about the fourth-water
    question and what the old surveys show, about the three rivers and their
    names, or about how she compares the surveys.
topics:
- key: fourth_water
  kind: info
  label: What is the fourth-water question?
  text: The junction surveys are the Margin's central open question. The oldest
    surveys of the junction all mark a fourth channel, smaller than the Aldren, the
    Brenn or the Solt, drawn as a waterway of its own and not as an overflow. Later
    surveys strike it through. Later ones again mark it back in. Then strike it
    again. This happens across separate surveys over about sixty years. What I cannot
    tell is whether the first surveys recorded something real, a channel that ran
    only in some seasons and has since silted up, or whether one early error was
    copied and copied until it grew a whole tradition of argument around a mistake.
    Both are possible. I lean toward a real channel, but I cannot prove that from
    the maps alone. A survey on the ground would settle it.
  marked: true
- key: rivers
  kind: info
  label: Which three rivers meet here?
  text: Three rivers join here. The Aldren comes from the north. It is the largest
    of the three and the main trade route upriver. The Brenn comes from the east,
    shorter and faster, with the color that gives it its name. The Solt comes from
    the southwest, the slowest of the three and the one that silts up most at the
    junction. They meet at the city, and the city is here because of that. The
    fourth-water question is about a possible fourth channel at or near the
    junction, marked in the old surveys but not on the ground today.
- key: comparison
  kind: info
  label: How do you compare the old surveys?
  text: I work from the original surveys when I can get at them. The archive has
    eleven that touch the junction directly. I lay them over each other at the same
    scale, on tissue, and mark where they agree exactly, where they agree roughly,
    and where they contradict. The contradictions are the useful part. A
    contradiction might mean an error, or it might mean something changed between
    surveys. The river moved, a channel shifted, a sandbar rose or washed away.
    Untangling that needs each survey dated well and, ideally, the name of the
    surveyor. Some of ours have no name. Those are the hard ones.
