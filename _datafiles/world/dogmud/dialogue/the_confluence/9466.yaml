mobid: 9466
zone: The Confluence
defaultMood: friendly
greetings:
- text: Welcome to the oratory. The rite here is quiet, and I prefer it that way.
    Come in, or ask what you need. Both are acceptable.
  moods:
  - friendly
opener:
  text: 'I am Crane. Prioress Crane, though I have stopped correcting people who
    drop the title. I keep the order''s inner life: the oratory, the prayer hours,
    the pastoral work with the novices. I have been a Keeper for forty years. I
    believe what I believe with my full self, and I will not apologize for it, and I
    will not pretend it makes every question easy.'
  hints: Choose a line below if you would like to hear about the faith and the
    rite, or about the Keepers who hold the order with her.
  variants:
  - questRequired:
    - 73-end
    text: 'I am Crane. Prioress Crane. You have the look of someone carrying a
      question about this temple. I believe what I believe with my full self, and I
      will not pretend it makes every question easy.'
    hints: Choose a line below to hear about the faith and the rite, about the
      Keepers, or about what she makes of the questions the Margin raises.
topics:
- key: crane_believer_aside
  kind: info
  label: What if the temple stands on something older?
  text: I have prayed on the questions your sort bring. I have faith, which is not
    the same as an answer, and I have made my peace with the difference. The rite
    we keep is real. The meeting of the waters is real. If the ground beneath us
    holds something older, if the first Founders built on a foundation they did not
    lay, that does not unmake what the waters do, or what we do when we attend to
    them. I have found this argument very persuasive. I notice I have had to keep
    finding it for twenty years. I think that is what faith is.
  questRequired:
  - 73-end
- key: the_rite
  kind: info
  label: How do you keep the rite each day?
  text: The rite is simple enough in its words and demanding in its discipline.
    Every morning, every evening, the same naming of the three rivers and the same
    marking of their meeting. I have done it ten thousand times. I find it new each
    time in the way a good sentence stays new, not because the words change but
    because you have. That is the whole argument for repetition.
# the_faith folds the "faith rite prayer believe" pattern (kept as topic
# believe) as its closing lines.
- key: the_faith
  kind: info
  label: What do the Keepers believe?
  text: 'We hold that the Chrysalis is the soul''s nature: that everything living
    is in the process of becoming something more fully itself, and that the
    river-meeting is the oldest sign of it we have. Waters arriving different,
    leaving as one, changed. The Chrysalis-changes people carry are the visible part
    of a truth that runs through everything. That is what the rite marks. That is
    what I believe. And faith is not certainty. It is choosing to act as though the
    thing you cannot prove still matters. I have done that every morning for forty
    years. It has not become easier. It has become more honest.'
  marked: true
- key: the_order
  kind: info
  label: Who holds the order with you?
  text: We are small. Perhaps thirty in the cloisters now, with another twenty in
    the outer temple. Aldric leads with his head, which is what is needed. Brother
    Cael tends the archive with more care than is strictly required by duty, which
    tells you something about him. I tend the oratory. We have disagreed on very
    little in thirty years, which I think is not because we agree on everything, but
    because the things we disagree on are things we have each decided to carry
    separately.
