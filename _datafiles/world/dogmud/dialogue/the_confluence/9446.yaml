mobid: 9446
zone: The Confluence
defaultMood: friendly
greetings:
- text: Copy work takes time, and I do not rush it. Mind the drying sheets.
  moods:
  - friendly
opener:
  text: I make copies of charts and documents for the Margin, and for paying work from
    the lower city. What did you want to know?
  hints: Choose a line below to hear about her copy work, about Tallis and the
    chart trade on the Long Quay, or about what copying the junction surveys has
    shown her.
topics:
- key: copy_work
  kind: info
  label: What do you copy here?
  text: Most of what I do is folio copies. Scholars need working copies they can mark
    up without harming the originals. A folio copy takes three days at the least.
    Survey copies are harder, and how long they take depends on the scale and the
    detail. The scale must be exact, the notes must be readable, and anything I miss
    or misread in the original becomes part of every copy made from mine. So I check
    against the original before I sign a survey copy, and I do not rush survey work.
    The whole point is accuracy.
- key: chart_trade
  kind: info
  label: Who is Tallis on the Long Quay?
  text: Tallis keeps a copy-stall on the Long Quay in the lower city. Navigation
    charts and cargo manifests, mostly. There is a steady call for chart copies. The
    river trade needs current navigation charts, the merchants need their manifests,
    the guild quarter needs certified records. Tallis covers the navigation side. He
    is quick and his work is clean. I cover the research copies here, which are a
    different product. Larger scale, older sources, more time per sheet. We know each
    other. When I get a rush order for a navigation chart, I send it to him. When he
    gets asked for an old survey, he sends it to me. Good work, different trade.
- key: junction_surveys
  kind: info
  label: What have the junction surveys shown you?
  text: I have copied eight of the eleven junction surveys the archive holds. I do
    not have opinions about the fourth-water question the way Riss does. That is not
    my place. But I can tell you that the marks at the junction change between
    surveys in ways that are clearly not just copying errors. Someone chose, on
    purpose, to put that channel in or to leave it out. You can see it in the hand.
    The researchers will draw their own conclusions. I copy what is there.
