mobid: 9437
zone: The Confluence
defaultMood: friendly
greetings:
- text: This morning's broadsheet is in, if you want to know what the city is
    arguing about. The sundries are on the counter, and every count is right.
  moods:
  - friendly
opener:
  text: Welcome to the Civic Stores. I keep what a district runs short of when
    it least expects to, which is candles, rope, waterskins and tinderboxes, and
    the tri-cities broadsheet every morning. Nothing fancy, but I always know
    exactly how much is on the shelf. If you need something heavier, the
    chandler down in the Landings or the River Market on the Long Quay is your
    next stop.
  hints: You could ask Corliss about the goods she carries, or about the
    tri-cities broadsheet. To see what she sells, type list.
topics:
- key: goods
  kind: info
  label: What goods do you carry?
  text: Tallow candles, rope, waterskins, and tinderboxes with flint and striker
    included, all in standard weights and sizes. Practical goods for the district,
    the sort of thing you don't want to find you're short of when you need it.
    All on the counter or the shelf behind.
- key: broadsheet
  kind: info
  label: What is the tri-cities broadsheet?
  text: The tri-cities broadsheet comes in every morning. It covers all three arms
    of the city in one edition, the Aldren side, the Brenn side and the Solt side.
    Trade news, council notices, civic appointments, the odd letter from a
    correspondent upriver. If you want to know what the whole Confluence is
    arguing about this week, that is where to start.
