zone: The Confluence
defaultMood: friendly
greetings:
- text: Buying? It's river cloth or homespun here, and I've an order on the
    loom, so say which.
  moods:
  - friendly
opener:
  text: River cloth or homespun, those are the two. River cloth is what the city is
    known for. A tighter weave, with linen blended in, and it holds color well.
    Homespun is cheaper and softer, if that is what the work calls for. Which?
  hints: Choose a line below to hear about the river cloth or the homespun. To
    see what she sells, type list.
topics:
- key: river_cloth
  kind: info
  label: What makes river cloth special?
  text: River cloth is named for the Confluence weave tradition. A mixed warp, with
    linen thread blended in for the sheen. It is finer than homespun, holds a dye
    better than plain wool, and wears longer than you would expect for the weight.
    It goes mostly into better garments and work meant to be seen.
  hints: To see what she sells, type list.
- key: homespun
  kind: info
  label: What is homespun good for?
  text: Homespun is plain wool, from near here, woven here. Softer than you might
    expect and cheaper than the river cloth. Good for everyday clothes, work wear,
    anything you want comfortable rather than fine.
