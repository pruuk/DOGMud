mobid: 9427
zone: The Confluence
defaultMood: friendly
greetings:
- text: If you're moving cargo through the Long Quay, you'll want to know who to
    talk to. That's me, or the guild steward in the hall, depending on the size of
    the shipment.
  moods:
  - friendly
opener:
  text: The Long Quay handles the bulk of the Confluence's commercial freight.
    Grain and timber off the Aldren, wool bales off the Brenn, ore and spice off
    the Solt. Three rivers means three supply cycles that don't line up with each
    other. My work is making sure the houses I represent don't miss their windows.
    I've been at this long enough that I don't miss them.
  hints: You could ask Edric about what each river brings, about what a trade
    factor does, or about the guild.
topics:
- key: rivers
  kind: info
  label: What does each river bring?
  text: The Aldren comes from the north. Grain out of the vale farms, timber from
    the hill-cutting camps. Heavy cargo, slow boats, reliable schedule. The Brenn
    runs in from the east with wool mostly, some finished cloth, the odd specialty
    dye. The Solt is the interesting one. It drops down from the southwestern hills
    and brings raw ore from the Kilnreach workings, cured spice from the
    hill-country posts, and hides. Lower volume than the grain runs, but better
    margin on the spice. I keep a closer eye on the Solt manifests for that reason.
    Three rivers is three supply chains. Once you understand which goods run which
    water, the rest of this quay makes sense.
- key: trade
  kind: info
  label: What does a trade factor do?
  text: A factor's job is matching cargo to buyers before the boat ties up. I
    represent three of the upriver houses on retainer and assess cargo for two more
    on commission. The rest I refer to the guild. The houses send their manifests
    ahead. I receive them, check the declared values against the guild's tariff
    schedule, and arrange the off-load order by which buyers have cleared funds. If
    the declared value and the actual cargo disagree, I find that out at the scales
    before the weighmaster does, which everyone prefers. Fewer arguments at the
    Weighhouse door.
- key: guild
  kind: info
  label: Who runs the guild here?
  text: The Rivermen's Guild sets who can work the Confluence commercially. Which
    boats can tie up, which crews are certified, what the tolls are. I work within
    the guild system, but I'm not a guild officer. The steward is Oslen. He's in
    the guildhall, west along the quay past the market cross and the River Market,
    if you need a charter question answered or a crew certified. Thorough man.
    Nobody has filed a false charter while he's been there, which is probably the
    point.
  marked: true
