mobid: 9483
zone: The Confluence
defaultMood: friendly
greetings:
- text: Hi! Are you a traveler? You look like a traveler. Do you know any good games?
  moods:
  - friendly
opener:
  text: I'm supposed to be taking something to the baker, but I'm doing the
    paving-stone game first. I've almost got to the end. Do you want to watch?
  hints: You could ask the child about the game, or about the errand she is almost
    doing.
topics:
- key: game_errand
  kind: info
  label: How does the paving-stone game work?
  text: You have to hop from one stone to the next without touching the lines. If you
    step on a line, the whole thing doesn't count and you have to start over. I've
    been to the third section twice today. I'm very good at it.
- key: where
  kind: info
  label: Shouldn't you be going to the baker?
  text: I'm going. I just have to finish the third section first, or it doesn't
    count. The baker's not going anywhere. She's always there. The game has to be
    finished properly or it doesn't work.
