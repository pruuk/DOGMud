mobid: 9423
zone: The Confluence
defaultMood: friendly
greetings:
- text: Line, rope, skins and tinder, and my family has kept these racks full
    for three generations. What's your boat short of?
  moods:
  - friendly
opener:
  text: Chandler is the proper word for it. Ship's chandler, though most of my
    trade is barge-folk and not tall-ship folk. Tarred line and rope, waterskins,
    tinderboxes, lamp oil. Tallow dips when the oil boat comes down, and small
    ironware from up the Brenn when the smith there sends any. If it keeps a
    vessel moving and a crew alive, I've sold it at one time or another.
  hints: You could ask Ferrick about rope and line, about lamp oil and tinder, or
    about the history of his shop. To see what he sells, type list.
topics:
- key: rope
  kind: info
  label: Which rope should I buy?
  text: The tarred line is the workhorse. It's coated for the wet and holds a knot
    better than raw hemp once the moisture gets into it. In the trade there are
    four gauges. Mooring line is two fingers thick. Haul line is lighter and
    stronger for the block-and-tackle work. Rigging line is the finest, and it
    moves fast. Fine-line is for net repair. If you're not on a boat, plain rope
    is what you want for general use, lashing cargo, pulling, tying off. I can read
    the grade of a coil by touch, from across the counter, so you won't get a bad
    one from me.
- key: lamps
  kind: info
  label: Do you sell lamp oil and tinder?
  text: River work goes on after dark, so lamp oil moves faster than anything else
    in the trade. I keep lamp oil in clay bottles on the rack, always. When the oil
    boat is in, I carry rendered tallow too, which is cleaner in a closed cabin.
    It hasn't come down since the thaw, so no tallow this week. Tinderboxes I
    always have. I keep them in the dry cabinet, sealed until
    they're bought. Dock air eats a flint and steel fast if you leave it sitting
    out, and a wet striker is no good to anyone.
- key: trade
  kind: info
  label: How long has this shop been here?
  text: My uncle started this shop, my father took it over, and I came in after
    him. Three generations of outfitting barges, from before they built the second
    dock. The Confluence has grown around the shop, which is an odd thing to
    watch. The city got bigger, the dock got busier, and the price of tar line
    went up twice. I adjusted. You adjust or you close. We haven't closed.
    Everything on the rack is priced fair. The river-trade markup keeps the
    lights on, nothing more than that.
