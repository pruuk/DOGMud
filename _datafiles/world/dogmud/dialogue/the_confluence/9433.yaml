mobid: 9433
zone: The Confluence
defaultMood: friendly
greetings:
- text: Bit busy. If you need something, make it quick.
  moods:
  - friendly
opener:
  text: Mind yourself, friend, there's always something swinging on a rope round
    here. Everything moves through the Long Quay sooner or later. The trick is
    not being in its way when it does.
  hints: You could ask the porter where to find things on the quay.
topics:
- key: quay
  kind: info
  label: Where can I find things on the quay?
  text: You're standing on the market cross. It's the middle of the quay, and the
    general stalls are round it. The Weighhouse is the big stone building down the
    quay road. Go south twice to the Weighhouse Yard, and it's on the east
    side, for cargo certification. The scrivener's stall is on the west side of
    the same yard. The guildhall is west, through the River Market, for charters
    and tolls. The trade factor with the document case works the Long Quay, just
    east of here, and the spice stall is south off the Long Quay. Now if you'll
    excuse me, this freight won't move itself.
  marked: true
