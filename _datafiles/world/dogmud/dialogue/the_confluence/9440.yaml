mobid: 9440
zone: The Confluence
defaultMood: friendly
greetings:
- text: Oh, good morning. Lovely day for the square.
  moods:
  - friendly
opener:
  text: Nice enough morning. I cut through the square most days on my way to the
    market. The ferry was late again, so I've time to spare. The pigeons are
    always here at this hour, and I had bread left over.
  hints: You could ask the citizen about the square, about the pigeons, or about
    the ferry.
topics:
- key: square
  kind: info
  label: What goes on in this square?
  text: The square's busy most mornings. Hall business on one side, the Three
    Waters on the other, and the town crier going round in between, ringing that
    bell. I pass through most days. The pigeons have learned my schedule, which I
    think says something either about pigeons or about me.
- key: pigeon
  kind: info
  label: Why do you feed the pigeons?
  text: They're here every morning at this hour. I figure someone might as well
    bother with them.
- key: ferry
  kind: info
  label: Is the ferry often late?
  text: Late again. Third time this fortnight. I keep meaning to say something at
    the hall, but I never quite get there.
