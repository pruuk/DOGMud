mobid: 9484
zone: The Confluence
defaultMood: friendly
greetings:
- text: Passing through or arriving? Either way, you've found the Brennside Gate.
    Anything I can help you with?
  moods:
  - friendly
opener:
  text: This is the Brennside Gate, the east crossing, and I've kept it long
    enough to call it mine. The road to Greenford runs out behind me, two days'
    travel on a decent road, and I know every milepost of it. Ask before you
    head out.
  hints: You could ask the Gate Captain about the road east to Greenford, about his
    work at the gate, or about this side of the river.
topics:
- key: road
  kind: info
  label: What is the road to Greenford like?
  text: Two days to Greenford at a good pace. It is hard-packed trade road the
    whole way. There is a hamlet with a well along the way, and the road crosses
    into Greenford by a bridge. We keep the stretch between here and Greenford, so
    bandits aren't a recent worry. The road is straightforward. Greenford is trade
    and farming, mostly. A different feel from the Confluence, but a decent
    town.
  hints: The Greenford road starts east of the gate.
- key: gate_duty
  kind: info
  label: What is your work at the gate?
  text: I run the east gate. Who comes through, when, and whether they're carrying
    anything that needs to be declared. Most days it's merchants and travelers, and
    I wave them through without a second look. Now and then someone tries to move
    something that belongs to someone else, and then it gets more interesting. The
    Road Wardens hold the stretch east from here. My job is the threshold itself.
    I've been doing it long enough that the gate feels like mine, which I suppose it
    is by now.
- key: quarter
  kind: info
  label: What is on this side of the river?
  text: Brennside is the east-bank quarter, the travelers' district, if you want to
    call it that. The Travelers' Inn is just south of the gate. Solid place, good
    kitchen. The stable is next to it, for a horse or a mule that needs rest. The
    wharf is north of the gate, with the landing past it. Smaller than the Long Quay,
    but the catch is just as good. If you're staying, the inn's the right first stop.
    If you're heading out, you've already found the gate.
  hints: The Travelers' Inn is south of the gate, and the Brennside Wharf is north of
    it.
