mobid: 9434
zone: The Confluence
defaultMood: friendly
greetings:
- text: Civic business? State your matter and I'll direct you. Registrations and
    certifications are processed at this desk.
  moods:
  - friendly
opener:
  text: Good day. Anything that needs the municipality's seal starts at this
    desk, whether that is a registration, a deed transfer, a civic petition or a
    letter of civic authority. Most requests I can process myself, and the rest
    I route to the proper office. Now, how may the hall help you?
  hints: You could ask Orvin about the hall's records, about the old map on the
    wall, or about who runs the city.
topics:
- key: records
  kind: info
  label: What records does the hall keep?
  text: Registrations and deed transfers are processed at this desk. Standard
    registrations, land, trade licenses, residency, go through the same day if the
    paperwork is in order. Deed transfers need the notary's seal as well as the
    hall's. For those you want Pellan at the Notary's Office, on Civic Lane east
    of the South Cross. Older records are kept in the Hall of Records, through the
    west door. Petitions to the council are logged and queued. How long those take
    depends on the council's calendar, which is not something I control.
- key: notation_map
  kind: info
  label: What is that old map on the wall?
  text: A survey chart from a few administrations back. It has been there longer
    than I have. It hangs there because it was already hanging there when I
    arrived, and no one has given me a reason to move it. Scholars come in from
    time to time, something about the count of waters at the junction, or the
    notation style, or both. The Margin Scholar at the reading table has been at
    it for two seasons now. If you want to know what the map says, she is a much
    better source than I am. I have forms to process.
  hints: The scholar at the reading table is Savel. Type talk savel.
  marked: true
- key: hall_admin
  kind: info
  label: Who runs the city?
  text: On paper, the council. The Municipal Hall is the Confluence's seat of
    government. Land registry, civic licensing, council letters, official seals.
    The council meets in its own chamber, and not often. Most of the governing
    runs through the permanent staff, which is to say, through this desk.
