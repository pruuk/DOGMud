zone: The Confluence
defaultMood: friendly
greetings:
- text: Mind the copy-board. The ink on that chart is still wet.
  moods:
  - friendly
opener:
  text: Most of my trade is harbor charts. River merchants who need a current copy
    of the approach, boat crews that came in without their navigation record, the
    occasional traveler who wants the Confluence laid out on paper. I also draw up
    manifests and trade documents for crews that don't carry a scrivener. The
    charts are the interesting work. The manifests pay better.
  hints: You could ask Tallis about the charts he copies, about the oldest charts
    in his stall, or about his copy work.
topics:
- key: charts
  kind: info
  label: What charts do you copy?
  text: The harbor chart covers the Confluence approach and the quay layout. It's
    current as of last season's pilot survey, which is more current than most of
    what's in circulation. A harbor chart is a two-day copy. The navigation chart
    for the Aldren upstream takes longer. I copy from the pilot association's
    master and check it against the seasonal sounding notes before I sign off. The
    Brenn and Solt upper reaches I carry in rougher form, because the surveying is
    less regular up there. The copies on the board are orders for the boats, and
    the buyers know what they're getting.
- key: old_charts
  kind: info
  label: What do your oldest charts show?
  text: The oldest charts I copy from are interesting to look at. They're older
    than the current quay by sixty, maybe seventy years. You can see where the
    first wharves sat before the expansion. A handful of them disagree on the count
    of waters at the junction. A few show what looks like a fourth channel where
    the rivers meet, narrower than the three main ones, drawn as a waterway of its
    own rather than a confusion of currents. Whether it was ever there, or whether
    the first survey had a bad day, I couldn't tell you. The scholars up in their
    quarter have argued about it for years. I copy the maps as I find them and
    leave the argument to them.
  hints: The oldest charts are here in the stall. Type look old charts.
  marked: true
- key: copy_work
  kind: info
  label: What does copy work take?
  text: Precision and patience. You set the original, you reproduce it accurately,
    you don't introduce errors, and you sign off on what you've done. The river
    trade makes a great many documents that need to be legible, accurate, and
    certified by someone whose hand is on record with the guild. Manifests,
    letters of credit, cargo declarations. I draw up whatever the crews need. The
    copying itself I find easier than most people do. I don't have to think about
    the letter shapes. They come out the same way every time.
