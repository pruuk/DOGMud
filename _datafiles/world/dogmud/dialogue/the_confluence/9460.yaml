mobid: 9460
zone: The Confluence
defaultMood: friendly
greetings:
- text: Welcome. The almonry keeps candles for prayer and bread for those on the
    island who are short of it.
  moods:
  - friendly
opener:
  text: Hello. The almonry is for practical needs. A candle for a prayer, bread for
    those short of it, and a word for anyone who needs one. That last one I can
    give you now.
  hints: You could ask the Almoner about the candles, about the alms the Keepers
    give, or about the temple's daily charitable work.
topics:
- key: candles
  kind: info
  label: Who are the candles for?
  text: Candles for prayer, yes. Not for sale, but kept for the purpose. Pilgrims
    light them for a prayer and leave them among the others on the nave's stands,
    and the Keepers replace them each morning.
# alms folds the "alms poor need help bread" pattern (kept as topic coin):
# the same bread on market days, and the names left at the window.
- key: alms
  kind: info
  label: What do the Keepers give to the poor?
  text: Bread twice a week, on the market days, from the temple's share of the
    tithe. The hungry come to the window in the morning and leave their names.
    Remedies when the infirmary has them to spare. I keep the list, and they fill
    it when they can. A dry place in the portico if the night turns bad. None of it
    is sufficient. But it is here without conditions. That is the policy. That is
    the job.
- key: keepers_work
  kind: info
  label: What other work does the temple do?
  text: We keep the rite, the record, and the almonry. The rite is for meaning. The
    record is for memory. The almonry is so no one leaves the island worse than
    they arrived. The third job is the least spoken of. I think the Founders would
    have recognised it first.
