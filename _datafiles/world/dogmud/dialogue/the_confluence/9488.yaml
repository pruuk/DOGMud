mobid: 9488
zone: The Confluence
defaultMood: friendly
greetings:
- text: Mm? Sorry. Just arrived. Two days from Greenford. Still road-dazed.
  moods:
  - friendly
opener:
  text: Hello. Pardon the state of me. I'm just off the east road. Two days on the
    Greenford road and the first thing you want is to sit down and not move. I've
    made it, though. The Confluence. It's real, which is more than I can say for most
    of the things people talk about.
  hints: Choose a line below to hear about the road from Greenford, about what
    she makes of the Confluence, or about what lies further east.
topics:
- key: greenford
  kind: info
  label: How was the road from Greenford?
  text: A good road, two days out. I've walked worse. There is a well at the
    hamlet along the way, and the river at Greenford has a good stone bridge, so
    no wading. Greenford is a decent town. Trade and farming, quieter than here.
    I've passed through twice before. Both times it felt like stepping into a
    slightly older world. Not a criticism. Just a thing you notice.
- key: confluence
  kind: info
  label: What do you make of the Confluence?
  text: I wanted to see it for myself. I first saw it from the bluff above the Brenn.
    Three rivers coming together in one place, and a city built right at the
    junction, as if someone looked at the map and said, here, obviously. There's
    something about a confluence that makes it feel necessary. I've only been here an
    hour. I'll have more to say in a few days. But the first look was yes. It's what
    people say. Worth the walk.
- key: beyond
  kind: info
  label: What lies beyond Greenford?
  text: Greenford isn't the edge of things. There's road beyond it too, east and
    north, into country I haven't walked yet. I've talked to people who have. The
    world gets bigger the further you go, which is both the obvious thing and the
    thing you don't really understand until you've done some walking. The gate here
    is as good a starting point as any. I'd say go, if you're thinking about it. The
    road to Greenford alone is worth the boot leather.
