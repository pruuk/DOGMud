- text: Hello. I am working on the fourth-water research, if you have questions. Or
    just the Margin in general.
  moods:
  - friendly
opener:
  text: I am staying in the quarter while I do secondary-source research for the
    Margin, checking the written accounts against the survey record. Most of the
    survey work is done across the court by the cartographers. I am working the
    written history side. What did you want to know?
  hints: You could ask the scholar about what the written accounts say of the fourth
    water, about how the temple's account fits with the Margin's work, or about life
    in the Scholars' Quarter.
topics:
- key: fourth_water
  kind: info
  label: What do the written histories say?
  text: The fourth-water question is the Margin's main open inquiry right now, and I
    have the secondary accounts. They are interesting precisely because most of them
    say very little. The written histories name the three rivers, the Aldren, the
    Brenn and the Solt, and never mention a fourth. The temple records agree with
    them. The pilot logs care about the current and the hazards, not the history of
    the river. Those silences prove nothing. Written histories leave out things the
    surveys record all the time. But the silences matter for how much weight you
    give the maps. So I am mapping the silences as carefully as the mentions.
- key: temple
  kind: info
  label: Does the temple's account agree with yours?
  text: The temple's account names three rivers, the Aldren, the Brenn and the Solt,
    and the junction is part of the sacred story of the founding. I am not arguing
    with that. The Margin's question is about maps and history. If a fourth channel
    existed at some point, what happened to it, and when, and why? None of that has
    to quarrel with the sacred account. A channel that silted up two hundred years
    ago is not a problem for anyone's faith. The Margin is not looking for one.
- key: quarter_life
  kind: info
  label: What is it like to work in this quarter?
  text: The quarter is quieter than the lower city, which is the point. The archive
    is close, the cartographers are across the court, and the copyists can make me
    a fair copy of a survey folio in a few days when I need one to compare. Drunn's
    bookshop at the gate end keeps useful reference stock. It is a good place to do
    slow work without interruption, and this kind of research is slow work.
