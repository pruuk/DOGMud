mobid: 85
zone: Watchers Crossing
defaultMood: neutral
opener:
  text: "You've found the only trading post between Dustwalk and Thornwall,
    which makes it the best one too. Every item's tagged, every price is on the
    tag, and yes, I priced in the haggling. My advice on the road ahead is
    free."
  hints: "Brecca glances up from her abacus, fingers pausing mid-calculation,
    and gestures at the organized shelves. To see what she sells, type list.
    Choose a line below to hear about the toll or the roads."
topics:
# toll (pattern) folded into toll_opinion; dustwalk (pattern) into
# road_advice; the two buy variants into buy.
- key: toll_opinion
  kind: info
  label: What do you think of the toll?
  text: "That toll is costing me a quarter of my business. Suppliers add five gold
    to every delivery, travellers reroute to avoid it, and some suppliers have
    stopped coming entirely. I am surviving on stockpile and stubbornness. Harn means
    well. He is terrified the bridge will collapse. But meaning well does not make
    it legal or smart."
  hints: "Brecca sets down her abacus with a click."
- key: about_settlement
  kind: info
  label: How long has this place been here?
  text: "Watchers Crossing has been here for generations. The bridge, the towers, the
    inn, all older than anyone remembers. It was a proper garrison once, watching the
    eastern approaches. Now it is just a waystation. A good one, if people would stop
    trying to tax it to death."
- key: road_advice
  kind: info
  label: What is the road like from here?
  text: "The west road is Dustwalk. Scrubland, bandits, not much else until you reach
    the Sanctum Basin plateau. East across the bridge is Thornwall territory, farmland
    first, then the city walls. If you are heading east, watch for the outskirts
    patrols. They are jumpy about strangers. This used to be a busy waypoint. The
    toll has made it quiet."
- key: buy
  kind: info
  label: What do you stock?
  text: "What travellers need. Trail rations, a few potions, a practice blade or two,
    a shirt and boots for anyone whose own have worn through. Nothing fancy, but all
    reliable. Prices are on the slate tags. I deal fair. Ask anyone on the road."
  hints: "To see what Brecca sells, type list."
- key: tolva
  kind: info
  label: Who else here is fighting the toll?
  text: "Tolva, who keeps the inn next door. She has been here since before I set up
    shop. Good woman. She is right about the toll, but I leave the politics to her."
  hints: "The Crossing Inn is just west of the trading post."
  heardRequired:
  - toll_opinion
