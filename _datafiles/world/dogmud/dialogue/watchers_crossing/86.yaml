mobid: 86
zone: Watchers Crossing
defaultMood: neutral
opener:
  text: "The toll is five gold to cross the bridge, or a road token if you carry
    one. And before you say it, yes, I know what Tolva thinks. I have heard it
    all."
  hints: "Choose a line below if you want to hear about the bridge, about where
    the toll money goes, or whether he has a charter for it."
  variants:
  - questRequired:
    - 6-end
    text: "The bridge stands a little more securely thanks to you. Cross anytime, no
      charge, ever."
  - questRequired:
    - 6-report
    questExcluded:
    - 6-end
    text: "You are back. Did you get it to Pell? Tell me the report has been filed. I
      have been pacing this booth since you left."
    hints: "Choose The Collector's Burden below to tell Harn the report is filed."
  - questRequired:
    - 6-start
    questExcluded:
    - 6-report
    - 6-end
    text: "Have you delivered the report yet? Clerk Pell in the Records Office in
      Thornwall is the one who can file it with the magistrate. Every day without that
      charter is another day the bridge gets worse."
    hints: "From the Tollhouse, go east ten times, over the Old Bridge, into
      Thornwall and along Main Street to its east end. The Records Office is north
      of there. Type talk pell."
topics:
- key: help_quest
  kind: offer
  quest: 6
  label: The Collector's Burden
  playerLine: Is there something I can help with here?
  text: "There is, actually. I have documented everything about this bridge. Damage
    assessments, repair costs, projected failure timelines. If Thornwall sees it,
    they will understand why the toll exists. I need someone to carry the report to
    the Records Office in Thornwall and put it in the hands of Clerk Pell. He handles
    filings for the magistrate, and he can file it before the innkeeper's complaints
    shut the toll down."
  hints: "If you accept, Harn gives you the report. From the Tollhouse, go east ten
    times, over the Old Bridge, into Thornwall and along Main Street to its east
    end. The Records Office is north of there."
  questExcluded:
  - 6-start
  - 6-end
  grantsQuest: 6-start
  givesItem: 31
  moodChange: friendly
- key: lost_report
  kind: info
  label: I have lost your report.
  text: "You lost the report? I have a second copy. I always keep duplicates. Here.
    Clerk Pell, Records Office, Thornwall. Please do not lose this one."
  hints: "Take the report to Clerk Pell in the Records Office in Thornwall."
  questRequired:
  - 6-start
  questExcluded:
  - 6-report
  - 6-end
  itemExcluded: 31
  givesItem: 31
- key: report_delivered
  kind: handin
  quest: 6
  label: The Collector's Burden
  playerLine: Clerk Pell has filed your report with the magistrate.
  text: "You have my thanks. If the magistrate sees those numbers, really looks at
    them, the toll will be formalized or Thornwall will fund the repairs directly.
    Either way, the bridge survives. Here, a receipt for your crossings. As many as
    you need. You have earned that and more."
  questRequired:
  - 6-report
  questExcluded:
  - 6-end
  grantsQuest: 6-end
  moodChange: grateful
# stone (pattern) folded into bridge_damage; pay and money (patterns) into
# show_ledger; inn (pattern) into about_tolva; authority (pattern) into
# no_charter; work (pattern) is covered by the help_quest pitch.
- key: bridge_damage
  kind: info
  label: What is wrong with the bridge?
  text: "Go and look at the eastern rail sometime. There is a stress crack along it,
    two paces long, deep enough to fit your finger in, and growing. The mortar
    between the foundation blocks is turning to powder. I have replaced capstones
    three times this year alone. This bridge is centuries old, it is the only
    crossing for leagues, and it has not been properly maintained in decades. If it
    fails, people die. The toll pays for masons and materials."
  hints: "The Old Bridge is just east of the Tollhouse. To see the crack for
    yourself, go there and type look crack."
  marked: true
- key: about_tolva
  kind: info
  label: What do you make of Tolva?
  text: "Tolva is not wrong that the toll hurts business. I know that. I see the
    empty carts and the merchants who turn back. But she has not crawled under the
    bridge and pressed her hand against stone that shifts when the water is high.
    She sees a number, five gold. I see the alternative, which is a bridge at the
    bottom of the river and people with it."
- key: show_ledger
  kind: info
  label: Where does the toll money go?
  text: "Every coin is accounted for. Dates, amounts, payees. Stonemason Revik, six
    gold for capstone replacement. Mortar shipment from Thornwall, eight gold. Labour
    for crack sealing, four gold. There is no personal enrichment here. I live in the
    back room of this booth. I am not a thief. I am the only person who cares enough
    about this bridge to do something about it."
  hints: "Harn taps the heavy ledger on the counter."
- key: no_charter
  kind: info
  label: Do you have a charter for this toll?
  text: "No, I do not have a charter from Thornwall. I applied for one. Twice. They
    lost the paperwork both times. Meanwhile the bridge cracks, and I watch merchants
    drive loaded carts over stone that is barely holding together. I made a choice.
    Maybe it was not the proper one, but the bridge is still standing because of
    it."
