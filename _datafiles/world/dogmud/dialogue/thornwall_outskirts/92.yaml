mobid: 92
zone: Thornwall Outskirts
defaultMood: neutral
opener:
  # The opener is spoken, so the old narration ("The guard gives you a brief,
  # appraising look") moved into the hint.
  text: Traveller. The gate is open and you are welcome in Thornwall, provided you
    keep the peace. If this is your first visit, the market district is straight
    ahead through the gate.
  hints: The guard looks you over for weapons, trouble, or both. Choose a line
    below to hear about the city or about trouble on the roads.
topics:
- key: city_info
  kind: info
  label: What should I know about Thornwall?
  text: Thornwall is the largest settlement east of the mountains. Market district,
    civic quarter, residential wards, and the old citadel at the center. The magistrate's
    office handles official business. The market handles everything else. Stay on
    the main roads until you know the layout. Some of the back streets are not as
    well patrolled.
  hints: To see a map of the area around you, type map.
  marked: true
- key: recent_trouble
  kind: info
  label: Has there been trouble on the roads?
  text: The roads have been rougher than usual. Highwaymen on the outskirts, bandits
    further west on Dustwalk Road. We patrol as far as the plaza. Beyond that, it
    is the road wardens' problem. If you know of a crime, the guard post is just
    inside the gate on the left.
- key: toll
  kind: info
  label: Who hears complaints about road tolls?
  text: The toll at Watchers Crossing is a matter for the magistrate. We are aware
    of it. If you have a complaint, file it at the civic office inside the walls.
- key: gareth
  kind: info
  label: Who deals with land taxes?
  text: Tax matters are handled by the Assessor-General's office inside the city.
    I am gate security, not a bureaucrat.
