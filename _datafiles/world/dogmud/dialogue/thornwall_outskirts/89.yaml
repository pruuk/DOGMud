mobid: 89
zone: Thornwall Outskirts
defaultMood: neutral
opener:
  text: Off the road, are you? If it is the gate you want, it is east along the
    main road. If it is trouble you want, the fallow field next door has plenty.
    Vermin breed in there like it is paradise. And it is, now that Gareth is
    gone and nobody stops them.
  hints: Choose a line below if you want to hear about the pests, his neighbour
    Gareth, or the city.
  variants:
  # The hand-in gates on 7-start plus the sample, not on 7-deliver: a sample
  # picked up before accepting grants no deliver step (batch 2 review B1).
  # So the "you have it" line keys on carrying the sample, and 7-deliver
  # marks a player who had a sample and no longer carries it.
  - questRequired:
    - 7-start
    questExcluded:
    - 7-end
    carriesItem: 24
    text: You have one of them? Let me see it.
    hints: Choose The Fallow Field below to hand over the pest sample.
  - questRequired:
    - 7-deliver
    questExcluded:
    - 7-end
    text: You had a sample? Then where is it? I cannot study what I cannot see.
      Bring me another one.
    hints: Go east to the fallow field, then south to the Pest Fields. There, type
      attack pest.
  - questRequired:
    - 7-start
    questExcluded:
    - 7-deliver
    - 7-end
    text: Back already? The pest fields are south of the fallow field. Kill what you
      can and bring me a sample. I want to see what is making them grow so large.
      And read the notice on the post in Gareth's field while you are there.
    hints: Go east to the fallow field, then south to the Pest Fields. There, type
      attack pest.
  - questRequired:
    - 7-end
    text: The fields are quieter since you thinned those vermin. It will not last
      forever, but it buys us time. You are welcome here anytime.
topics:
- key: help_quest
  kind: offer
  quest: 7
  label: The Fallow Field
  playerLine: Do you want help with the pests?
  text: If you are willing, clear the worst of the pests from the south fields. Kill
    enough to thin the numbers, and bring me one of the bodies. I want to see what
    is making them grow so large. Something in that fallow soil, maybe. And read
    the notice on the post in Gareth's field while you are there. Someone should
    know what happened. Someone who might actually do something about it.
  hints: The pests live in the Pest Fields. From this farm, go east to the fallow
    field, then south.
  questExcluded:
  - 7-start
  - 7-end
  grantsQuest: 7-start
  moodChange: friendly
# Hand-in: the sample_return node and the quest 7 give trigger (its npc_say
# lines) are folded in here. Gated on 7-start plus the sample (B1), so a
# player who picked up a sample before accepting can hand it in.
- key: dornhandoff
  kind: handin
  quest: 7
  label: The Fallow Field
  playerLine: I brought you a sample from the pest fields.
  text: Look at the size of this. Too big. That is not natural growth. Something
    in the fallow soil is feeding them, and as long as that field sits empty, this
    will keep happening. You have done what you can. The rest is politics, and politics
    means getting inside those walls.
  questRequired:
  - 7-start
  questExcluded:
  - 7-end
  requiresItem: 24
  grantsQuest: 7-end
  moodChange: grateful
- key: pest_problem
  kind: info
  label: What is wrong with your fields?
  text: The fallow field has become a nest. Crop pests, big ones, bigger than I have
    ever seen. They have tunneled under the south fields and are eating the roots
    out from under the crops. I have tried poison, smoke, traps. Nothing works when
    the source is right next door, breeding unchecked. The worst of it is in the
    pest fields to the south. Mounds everywhere.
  marked: true
- key: about_gareth
  kind: info
  label: Who was Gareth?
  text: Gareth Millward. Good man. Good farmer. The city raised the land tax. Raised
    it again. And again. Gareth could not keep up. The Tax Authority seized his plot
    and drove him out with nothing but the clothes on his back. Thirty years of work,
    gone. And now the land sits empty, breeding vermin, costing all of us. The city
    does not care. It is an asset on a ledger somewhere.
- key: about_thornwall
  kind: info
  label: What do you think of Thornwall?
  text: Thornwall. Growing every year. Eating farmland, raising taxes, building walls.
    The people inside eat what we grow, and the thanks we get is assessors with ledgers
    and guards who look at us like dirt. I have not been inside those walls in years.
    Nothing there for me but grief.
- key: farm
  kind: info
  label: How long have you farmed here?
  text: I have farmed this plot my whole life. My father before me. The soil is good
    here, if you treat it right. I will not be driven off by taxes or vermin.
