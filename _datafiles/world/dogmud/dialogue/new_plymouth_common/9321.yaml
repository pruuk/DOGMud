mobid: 9321
zone: New Plymouth Common
defaultMood: neutral
greetings:
- text: Stew or meat, what'll you have?
  moods:
  - neutral
- text: You're just in time. The morning batch is still hot.
  moods:
  - neutral
- text: Back again? The stew's better today than yesterday. Sit.
  moods:
  - friendly
opener:
  text: I've got stew, grilled meat, bread, and tea. The stew's the best value and
    the bread's fresh. What is it? You're eating, you're asking about the quarter,
    or you want to hear me complain about my brother's taste in seasoning?
  hints: Choose a line below to hear about her cooking, her brother Halvard the
    smith, or life in the Common Quarter. To see what she sells, type list.
topics:
- key: food
  kind: info
  label: What are you cooking today?
  text: The stew's been going since before dawn. Bone broth, whatever root
    vegetables were cheapest at the market this morning, a proper amount of
    pepper. Grilled meat is exactly what it sounds like and costs a bit more. The
    bread I make myself in the clay oven at the back. There's a reason the smell
    carries two streets north. Tea is for people who need warming up without
    eating. All of it's a fair price for the Common and not a copper more.
- key: brother
  kind: info
  label: Who is your brother?
  text: Halvard. He's at the forge in the Crafting Quarter. Good work, honest steel,
    and he eats like a man who spends his days swinging a hammer, which is to say
    he eats badly unless he comes down here at midday and I stand over him while
    he finishes a bowl. He thinks boiled grain is a meal. I have told him this is not a
    meal. He disagrees. We've been having this argument since we were small. The
    forge does well, at least. He makes good blades.
  hints: Marda seems fond of her brother despite the long argument over seasoning.
  moodChange: friendly
- key: quarter
  kind: info
  label: What is life like in the Common Quarter?
  text: It's a working quarter, not a pretty one. The rooftops need repointing, the
    lane behind the market gets muddy every winter, and the bloodline's clerk does
    his collecting rounds in a way that makes everyone go quiet. But the people
    are decent and they come back. Cookshop Row wouldn't work otherwise. You get
    used to the rise, the well noise in the mornings, the Brimming Bowl when
    you've had a long day. It's what a neighborhood is.
