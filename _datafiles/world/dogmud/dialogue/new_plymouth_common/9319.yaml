mobid: 9319
zone: New Plymouth Common
defaultMood: neutral
greetings:
- text: I can usually see what someone wants before they say it. Whether I can
    help depends on what sort of quiet you need.
  moods:
  - neutral
- text: Morning. Nothing has gone badly yet. Give it time.
  moods:
  - neutral
- text: Back again. The kettle is just off the heat. Come in if you want.
  moods:
  - friendly
opener:
  text: I run a quiet house, and I tell no one what they are not owed to know
    about who comes and goes. My rooms are all spoken for just now. What brings
    you to my door?
  hints: Choose a line below to learn about her house, about the old seminary
    beside the Row, or about the lodgers who left the city some months back.
topics:
- key: rooms
  kind: info
  label: How do you run your house?
  text: Two rooms at the front, one at the back. The back room carries the river
    smell at all hours, and the carter who has it is out on the roads more than
    he's in it. Front-left is taken. Front-right has been empty a long while, and
    I am holding it for someone. So there is nothing to let just now. I don't ask what brings a tenant here. I do ask that whatever
    it is stays off my stairs and is settled before it arrives at my door. Payment
    by the week, in advance. Don't borrow the lamp oil. That is the whole of the
    arrangement.
  hints: Tova runs her house with care and has clear terms.
  moodChange: friendly
- key: seminary
  kind: info
  label: What is the old seminary beside the Row?
  text: It hasn't been in use, not by anything the church will put its name to,
    for thirty years that I can account for. The building stands because no one
    can agree what to do with it. There's a wall along the east side of the Row
    that is its ground, and in summer something grows up through the stones that
    I have never been able to name properly. Dark-leafed, stubborn, comes back the
    same way every year. A root system under the lane, working through the old
    foundation at night. The lodger who last stayed in the back room used to say
    the wall was the reason he chose that room. He said he liked having something
    outside his window that was old enough and deep enough to have stopped caring
    about people.
  hints: The old seminary carries more weight in the Row than it looks.
  moodChange: curious
- key: left
  kind: info
  label: What happened to your last lodgers?
  text: There were several of them, over the same year, at different times. I
    don't say their names to people who haven't earned the asking. What I will
    tell you is they were careful people who needed a careful house, and I gave
    them that, and when they left they went without a goodbye, which is how the
    careful ones always go. No forward address, no word back. I didn't expect one.
    The front-right room still has a small mark on the windowsill that the last
    one left. I don't know what it means, and I have not removed it. I've been
    waiting, I think, to see if someone comes who would know it. So far no one
    has.
  hints: Tova remembers her lodgers more than she lets show. The mark on the
    windowsill might mean something to someone who knew them.
  moodChange: cautious
