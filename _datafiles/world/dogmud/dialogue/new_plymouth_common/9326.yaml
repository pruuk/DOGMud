mobid: 9326
zone: New Plymouth Common
defaultMood: friendly
greetings:
- text: Fresh cut this morning. They will outlast anything you find cheaper. What
    can I tie for you?
  moods:
  - friendly
  - neutral
- text: Buy early. I sell out before midday, every day, and I do not hold any back.
  moods:
  - friendly
  - neutral
opener:
  text: I sell cut flowers. A posy for a table, a stem for a windowsill, a bunch
    for someone you have wronged or want to. The blooms are open and the price is
    fair. Look while they last.
  hints: You could ask the flower seller about her flowers, or about Carter's Rise
    where she keeps her stall. To see what she sells, type list.
topics:
- key: flowers
  kind: info
  label: What makes your flowers last?
  text: Cut fresh off the carts at first light and tied while the dew is still on
    them. Mine hold their color a day longer than anyone else's on the rise. I do
    not say why, and you do not need to know why to enjoy it. A stem is a small
    thing to carry home. People forget how much a small thing can do.
  hints: She nods at the trestle of blooms.
- key: rise
  kind: info
  label: How long have you kept this stall?
  text: Carter's Rise. The well at the top, the talk all around it, and me on the
    outer corner where the light is good and the cart noise is someone else's
    problem. I have had this spot longer than most have had their trades. The
    other sellers gave it to me without anyone deciding to.
