mobid: 9320
zone: New Plymouth Common
defaultMood: neutral
greetings:
- text: I heard you coming from two corners away. You've got a particular kind of
    step.
  moods:
  - neutral
- text: You're earlier than usual.
  moods:
  - friendly
- text: Stop a moment. I was about to sweep past something interesting.
  moods:
  - friendly
opener:
  text: Three years I've swept Carter's Rise, and two on the tannery streets
    before that. Stone carries more than folk think, if you've the ears for it,
    and I have. So ask me about the people, the quarter's troubles, or the
    strange gray bits I keep finding in the gutters. I've something on all
    three.
  hints: Choose a line below to learn about the gossip at the well, the gray
    bits in the gutters, or the troubles of the Common Quarter. His task below
    is about where the gray bits come from.
  variants:
  - questRequired:
    - 65-end
    text: My tin of gray bits sits heavier on my mind now. Older than the city,
      under the city. Keep it between us.
    hints: Choose a line below if you want to hear about the gossip at the well,
      the gray bits in the gutters, or the troubles of the Common Quarter.
  - questRequired:
    - 65-start
    questExcluded:
    - 65-end
    carriesItem: 40101
    text: You went down. I can see it on you, and you've got a piece of it in your
      hand. Don't tell me about it. Let me feel the weight of the thing for myself.
    hints: Choose The Street Sweeper's Secret below to give Coll the lump.
  - questRequired:
    - 65-discover
    questExcluded:
    - 65-end
    text: You went down? Then where's the piece of it? I need to feel the weight of
      it.
    hints: If you lost the lump, more of the gray material is in the seam below.
      From Carter's Rise, where Coll sweeps by day, go west twice to Dockgate
      Street, then north three times to Tenement Row. Go east, then north to Tannery Street. Go east twice to the
      Flophouse Steps, north to the Fighting-Pit Gate, east to the Undercroft
      Stair, then down into the Old Foundation. Type look seam.
  - questRequired:
    - 65-start
    questExcluded:
    - 65-discover
    text: Been down yet? The stair's past the fighting-pit gate. Look at what runs
      through those walls.
    hints: From Carter's Rise, where Coll sweeps by day, go west twice to Dockgate
      Street, then north three times to Tenement Row. Go east, then north to Tannery Street. Go east twice
      to the Flophouse Steps, north to the Fighting-Pit Gate, east to the
      Undercroft Stair, then down into the Old Foundation. Type look seam.
topics:
- key: sweeperhandoff
  kind: handin
  quest: 65
  label: The Street Sweeper's Secret
  playerLine: I found where your gray bits come from. Feel this.
  text: Let me see that. Cold as a well bottom and heavier than it has any right
    to be. This is it, the same stuff, but whole.
  questRequired:
  - 65-start
  questExcluded:
  - 65-end
  requiresItem: 40101
  grantsQuest: 65-end
  moodChange: curious
- key: tracefragments
  kind: offer
  quest: 65
  label: The Street Sweeper's Secret
  playerLine: Do you want help finding where your gray bits come from?
  text: You want to do an old sweeper a turn? Find out where they come from. The
    gutters run downhill, and downhill in this quarter ends in stone older than
    anything above it. There's a stair past the fighting-pit gate that goes down
    into the old foundations, further down than the cellars, into stonework
    nobody living laid. If my gray bits come from anywhere, they come from down
    there. Go and look at what runs through those walls. Then come back and tell
    me I'm not mad.
  hints: Accept, then find the Undercroft Stair, east of the Fighting-Pit Gate, and
    go down into the Old Foundation. There, type look seam.
  questExcluded:
  - 65-start
  - 65-end
  grantsQuest: 65-start
  moodChange: curious
- key: gossip
  kind: info
  label: What do you hear at the well?
  text: Half the Common's business happens at this well before the first bell. I
    don't ask questions. I just sweep near enough to hear the answers. The
    Brimming Bowl gets the evening version. Between the two of them and what comes
    through the gutters, I've got a fair picture of who owes who what, and why
    three families on Midden Row aren't speaking. You want specifics, you'll need
    to know what you're looking for.
- key: fragments
  kind: info
  label: What are the gray bits in the gutters?
  text: I've been finding them for two years now. Small pieces, gray as old bone
    but harder, and they don't match anything quarried around here. They come up
    in the gutters mostly, when the rain's been heavy. I've got eleven of them in
    a tin. I showed one to the old bookseller on the Inkwalk and he got a look on
    him like he'd heard a rumor confirmed. Wouldn't say what rumor. I've been
    keeping my ear to that particular wall ever since. Walls are good for that.
  hints: Coll's fragments have caught someone's attention. The bookseller on the
    Inkwalk is Orin, in the Crafting Quarter.
  moodChange: curious
- key: troubles
  kind: info
  label: What troubles the Common Quarter?
  text: The rent went up twice in eighteen months. The bloodline's domestic office
    runs the collecting through a clerk in the Merchant Quarter who has a very
    clean seal and no sympathy for families that come up short. Mother Brisk on
    the condemned block is keeping four extra people in a space licensed for two
    and not telling anyone about it, and I'm not going to be the one who tells
    either. Beyond that, the well's a city asset that hasn't been repointed in six
    years. I know because I can hear the water moving through the cracks from
    street level.
  moodChange: cautious
