mobid: 9325
zone: New Plymouth Common
defaultMood: neutral
greetings:
- text: I'll need a name and a reason before we have a conversation worth having.
    What is it?
  moods:
  - neutral
- text: Come in off the step.
  moods:
  - neutral
- text: You again. Come through. I was about to do the accounts.
  moods:
  - friendly
opener:
  text: I run this block, I keep my tenants housed, and I am not interested in
    anyone's opinion about how I do either. What do you want?
  hints: Choose a line below if you would like to hear about her tenants, about
    the condemned upper floors, or about the bloodline's tax collector.
topics:
- key: tenants
  kind: info
  label: How many tenants do you keep?
  text: Fourteen tenants, currently. Twelve in licensed rooms, two others I'm not
    naming to a stranger and will not be asked about. Every one of them is current
    on rent within a three-day grace that I set and enforce myself. I haven't had
    an eviction in four years, which tells you something either about my tenants
    or about the understanding we reach before anyone signs on. I don't allow
    sub-letting, I don't allow visitors past the first landing after last bell,
    and I have never had a fire, a constable call, or a hole in a wall that went
    unrepaired. That record costs me effort. I think it is worth it.
  hints: Mother Brisk keeps her building to a standard she won't apologize for.
  moodChange: friendly
- key: floors
  kind: info
  label: What is wrong with the upper floors?
  text: The upper floors are condemned under a writ that has been outstanding for
    eleven years. The writ says the floor joists are unsound. I have had three
    different assessors look at those joists over those eleven years and all three
    told me they were fine. That is a different kind of problem from unsound
    joists and I will leave it there. What I hear up there at night is the
    building settling, which is what old buildings do, and I'm not going to
    discuss it further.
  hints: Mother Brisk closes the subject of the upper floors firmly.
  moodChange: cautious
- key: collector
  kind: info
  label: What do you think of the tax collector?
  text: The collector is a man with a seal on a disc who comes twice a year. His
    name is Cevran. I have not forgotten it and do not intend to. The levy went up
    in spring, the second increase in eighteen months, and the timing was chosen
    to hurt families that had just paid for winter heating. That is not a
    calculation I admire. I pay what is owed and I write it down to the last coin,
    because the day he comes to me with a wrong figure I will have the right one
    ready before he finishes the sentence. He has not made that mistake with me
    yet. He has made it with others on this street and it did not go well for
    them.
  hints: Mother Brisk keeps records as exactly as she keeps everything else.
  moodChange: cautious
