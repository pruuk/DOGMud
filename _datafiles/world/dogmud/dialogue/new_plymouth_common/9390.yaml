mobid: 9390
zone: New Plymouth Common
defaultMood: neutral
greetings:
- text: What do you need? If it keeps a day running, I have likely got it.
  moods:
  - neutral
- text: Good to see you back. The waterskins are fresh-stoppered today.
  moods:
  - friendly
opener:
  text: Nothing on this stall is glamorous, and every bit of it gets used. Rope,
    waterskins, soap, tinderboxes, tallow candles, flour. The Common can't get
    through a week without them.
  hints: You could ask Mardle about her goods, about everyday life in the Common
    Quarter, or about where her supplies come from. To see what she sells, type
    list.
topics:
- key: wares
  kind: info
  label: What do you keep on the stall?
  text: Rope, waterskins, soap, tinderboxes, tallow candles, flour. The things you
    reach for when the day stops going smoothly and you need it to start again. I
    do not carry anything you would call a luxury. The Common Market has not much
    call for luxuries. It has a great deal of call for rope and candles and a full
    waterskin, and I have kept this stall stocked long enough that people come
    here first before they check anywhere else. That is worth more to me than a
    fancier set of goods.
- key: quarter
  kind: info
  label: What is the Common Quarter like?
  text: The Common Quarter is what the city is actually made of, under everything
    else. The Merchant Quarter has the money, the Noble Quarter has the name, but
    the Common is where people get up in the morning and make the day happen. The
    well on Carter's Rise is where half the news in New Plymouth gets traded by
    midday. I know more about what is moving through this city just from standing
    at this stall than most people know from asking.
- key: supply
  kind: info
  label: Where do your supplies come from?
  text: Everything comes up from the docks warehouses. Rope, wax, soap, grain, all
    of it lands at the waterfront first and works its way here. Dobb runs the
    circuit that moves stock from the warehouse out through the quarters, and I
    get my restocks when he comes by. The system is not elegant but it works, and
    I have learned that working is the only standard worth holding a supply chain
    to. When the ships are late, I ration the flour and move the soap to the back.
    When they are on time, this table is full.
  moodChange: friendly
