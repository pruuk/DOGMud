mobid: 9324
zone: New Plymouth Common
defaultMood: neutral
greetings:
- text: New face. You've either got a reason to be on these steps or you walked
    past the rooming house by mistake. Which is it?
  moods:
  - neutral
- text: You again. Sit if you want. No one's using that step.
  moods:
  - friendly
- text: Still here. Still sitting. As you see.
  moods:
  - friendly
opener:
  text: I've got nowhere to be and a decent view of the lane from here. Ask what
    you came to ask.
  hints: Choose a line below to hear about the fighting pit, about his
    soldiering days and that arm, or about the hard cases he watches on the
    flophouse steps.
topics:
- key: pit
  kind: info
  label: What is the fighting pit?
  text: The gate's just north of these steps. They don't put up a sign. The man on
    the gate knows my name and knows I'll only send someone worth watching. Right
    now the gate is shut to new faces, mine or anyone's. When it opens again,
    whether you want to watch or step in yourself is your decision and not one
    I'll advise on. I've seen both go badly.
  moodChange: friendly
- key: arm
  kind: info
  label: What happened to your arm?
  text: Lost the hand at the Lethwick ford, eighteen years back. A campaign in the
    southern reach. Nothing remarkable in that country about losing a hand, except
    I kept the rest and came home. The arm started going hard at the wrist the
    first winter after, worked its way up over three years and stopped at the
    elbow. Cold doesn't bother it. Heat doesn't bother it. I set it in a fire once
    to see. The stump is smooth and won't take an edge, which has been useful at
    least twice. I served under a man named Doryn. He's a captain in the Noble
    Quarter now, running a bloodline gate post. We don't speak much. That quarter
    is a long walk from these steps.
  hints: Garrick's arm has a history as practical as it is strange. His old
    commander is a guard captain in the Noble Quarter, a different world from the
    flophouse steps.
  moodChange: curious
- key: quarter
  kind: info
  label: Who comes and goes on these steps?
  text: The flophouse draws a range. Men who worked a trade and lost it. A fire, a
    bad creditor, a levy they couldn't meet. Younger ones who came in from the
    road thinking the city would be easier than it turned out to be. The dice game
    on that step has been running six years and I've watched it take everything
    off three different people who thought they were good at dice. I don't step
    in. Not my game. But I know who on this street can be counted on when
    something needs counting on, and who can't.
