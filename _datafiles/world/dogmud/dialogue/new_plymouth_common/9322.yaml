mobid: 9322
zone: New Plymouth Common
defaultMood: neutral
greetings:
- text: Seat yourself anywhere there's room. And there's always room if you look
    for it.
  moods:
  - neutral
- text: I heard you before you opened the door. Come in.
  moods:
  - neutral
- text: Your usual corner's open. I'd have moved anyone sitting in it.
  moods:
  - friendly
opener:
  text: Pull up a stool. The Bowl has stood forty years, and for twenty of them
    it's run the way I say it runs. You'll get a drink here, or a meal, or the
    quarter's gossip, and the gossip comes free with the drink. Which is it?
  hints: Choose a line below if you want to hear about the Brimming Bowl, the
    ale she sends down to the docks, or what she's heard around the quarter. To
    see what she pours, type list.
topics:
- key: bowl
  kind: info
  label: What's on at the Bowl?
  text: The Bowl is open from late morning to last orders, which I call whenever
    the noise gets above a pitch I've decided is the ceiling. You'll know last
    orders when you hear it. I've been told I could call it from outside the
    building and everyone inside would hear it fine. I've never needed to test
    it. Down here I pour spiced wine and what I kindly call rough spirits, if you
    need something to start a fire inside you. Food runs to meat, stew, and bread,
    same as it ever did.
- key: docks
  kind: info
  label: Where does your ale go?
  text: Every batch I brew goes down in barrels to Bressa Toll's place on the
    waterfront, the Salt Cellar. That's been the arrangement for a long time, long
    enough that her dockfolk have gotten particular about it and complain when I'm
    a barrel short. Which I never am. Bressa and I have an understanding about
    quality that saves us both the talk of what happens if it slips. She's good
    people. The docks are hard work and she runs the one warm room down there.
  moodChange: friendly
- key: gossip
  kind: info
  label: What have you heard around the quarter?
  text: I run the room where people come to stop being quiet for an hour. I don't
    repeat what I hear at the bar to people who weren't at the bar. That's the
    rule, and it's the reason people say things at the bar they wouldn't say
    elsewhere. What I will tell you is that the Common's not in a good temper at
    the moment. The levy went up and the collector's timing was insulting. And
    there's been a man at the corner of the market three evenings running who
    isn't buying anything. I notice people who aren't buying anything.
  hints: Renn notices more than she says.
  moodChange: cautious
