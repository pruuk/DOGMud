mobid: 9512
zone: Greenford
defaultMood: friendly
greetings:
- text: Valley greens, this morning. Fresh. Have a look.
  moods:
  - friendly
opener:
  text: |
    Best greens on the Market Cross. Cut on the valley farms
    this morning, on my stall by first light. Press one if you
    doubt me. You won't. Buying, or looking?
  hints: You could ask the produce-seller about her greens, about the season, or
    about the square. To see what she sells, type list.
topics:
- key: produce
  kind: info
  label: How fresh are your greens?
  text: |
    Broad-leaf greens and roots from three valley farms. I've
    dealt with the same farms for eight years and I know the
    difference between a good cut and one that's been sitting.
    These are a good cut. I take them this morning, I sell them
    today, and what's left at close goes back for the animals.
    Nothing sits overnight. If I say it's fresh, it's fresh. That's
    worth something at a market stall, and my regulars know it.
    Sold by the basket. Fresh this morning and not here tomorrow,
    so don't wait on it.
- key: season
  kind: info
  label: Has it been a good season?
  text: |
    Good season so far. The valley farms have had the rain they
    need without the flooding they don't. The greens are coming in
    well, and the roots are fat. The cheese stall's had a good run
    too, though that's her business. I've been at this stall long
    enough to know when a season's kind and when it isn't. This
    one's kind. Ask me again in a month.
- key: town
  kind: info
  label: Is this a good square for a stall?
  text: |
    Good square for a stall. The cross brings people past whether
    they mean to stop or not, and the notice board keeps them
    standing long enough to look at what's on offer. The crier's
    useful for the same reason. I don't mind the bell. It means
    people are paying attention.
