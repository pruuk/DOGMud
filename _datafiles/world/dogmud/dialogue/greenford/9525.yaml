mobid: 9525
zone: Greenford
defaultMood: friendly
greetings:
- text: The pot's on, and there's bread if you want it. Sit wherever suits you.
  moods:
  - friendly
opener:
  text: |
    Hello, and welcome in. I'm Ness, and this is my tea house,
    at the end of College Row. There's always a pot on, and most
    mornings a fresh loaf. The counter's at the back. The hearth
    has been going since before anyone else on the row was up,
    so sit close if you're cold. What can I get you?
  hints: You could ask Ness about her tea, about her neighbors on the row, about her
    hours, or about the residential streets. To see what she sells, type list.
topics:
- key: tea
  kind: info
  label: What do you serve here?
  text: |
    A pot of tea's the staple. I keep the pot going from first
    light. The bread's fresh most mornings, river loaf from the
    mill. Nothing elaborate. Come to the counter for a pot or a
    loaf, either or both, and I'll sort you. The tables at the
    window are for anyone who wants to sit a while. The corner
    table is the one the scholars end up at when they want to think
    without being interrupted. I don't interrupt anyone. It's a tea
    house, not a lecture hall.
- key: neighbors
  kind: info
  label: Who lives on the row?
  text: |
    The row? I know everyone on it. The blue door at the corner is
    the scholar from the university, Brennan, surveys, always with
    something on his mind. He's rarely home. The university keeps
    him. Doesn't say much, which suits me.
    The third house down the west lane, the one with the yew
    hanging over the path, that's the old surveyor, Reth. He was in
    most mornings, years ago. He came back from a long survey and
    he's been quiet since. Keeps to himself. I don't press.
  hints: From the Tea House, go west to College Row, west to the Blue Door, then
    south twice to Reth's Cottage.
  marked: true
- key: hours
  kind: info
  label: When do you open?
  text: |
    Before the row is moving. First light, usually. The scholars
    need somewhere to be before the library opens, and I find early
    is when I do my best work anyway. I keep the counter until late
    in the evening, and the hearth stays in until last thing.
- key: town
  kind: info
  label: Is this a quiet part of town?
  text: |
    It's the quieter end of town. Not the market bustle, just the
    row and the college back gate. People who live here like their
    mornings unhurried. I like that too. It's a good town for a tea
    house, and the university keeps a steady trade all year.
