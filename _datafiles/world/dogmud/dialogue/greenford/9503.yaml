mobid: 9503
zone: Greenford
defaultMood: friendly
greetings:
- text: Three lines in. The river's been moving well this morning. Sit if you like.
    It won't disturb the fish.
  moods:
  - friendly
opener:
  text: I fish these steps every morning this time of year. The river gives what it
    gives. Some days it's generous. Some days you go home with wet boots and a story
    about the one that didn't bite. Today looks like a generous day. What do you want
    to know?
  hints: Choose a line below if you would like to hear about his catch, about
    how he reads the river, or about the bridge above.
topics:
- key: catch
  kind: info
  label: What are you catching today?
  text: Trout and perch mainly on the lines. This reach runs deep and cold, good water
    for both. The crab pots I check at midday. They've been decent this week, nothing
    special, though they had something heavy in them this morning and I haven't
    looked yet. Bait's salted perch offcuts, which works well enough that I've stopped
    trying anything else. The thing about fishing is that you find what works and
    you keep doing it. The river doesn't reward cleverness half as much as it
    rewards showing up at the same time every day and being patient.
- key: river
  kind: info
  label: How do you read the river?
  text: The Greenford river runs deep here below the bridge, green and steady most of
    the year. Fast in the spring. You wouldn't put a line in during flood season, the
    current takes everything sideways. In summer it drops and goes green and clear.
    That's when the trout are easiest to read. You can see them holding in the
    current below the steps. Autumn brings the perch up from the south channel in
    numbers. I've fished this stretch twenty years. You learn its moods. It has them.
- key: bridge
  kind: info
  label: Is the bridge as old as it looks?
  text: Three arches, old work. The warden, Oswin, a good man, keeps it properly.
    I've watched the morning light come under those arches since I was young enough
    to carry my own bucket and not complain about it. The stone piers go deep into
    the riverbed, which is why the bridge has outlasted floods that should have
    worried it. It fishes well from below, too, on the downstream side of the center
    pier where the current pools. I keep that spot for myself on quiet mornings. No
    offense.
