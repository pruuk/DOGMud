mobid: 9509
zone: Greenford
defaultMood: friendly
greetings:
- text: Stock's organized. If you know what you want, say so. If you're browsing,
    browse.
  moods:
  - friendly
opener:
  text: |
    I've kept this bookshop on the square for eighteen years,
    and the system is still mine alone. I stock what the
    university wants, and a good deal of what it doesn't know
    it wants yet. Natural philosophy is on the north wall.
    Cartography and survey run along the east. History is up
    top, where the step-ladder earns its keep. The crate by the
    door is old stock, marked down twice. If you're looking for
    something, ask. It won't be obvious.
  hints: You could ask Aldith about her stock, about the eastern survey work, or
    about the university uphill. To see what she sells, type list.
topics:
- key: books
  kind: info
  label: What is on your shelves?
  text: |
    Natural philosophy and mathematics on the north wall. The
    university buys heavily from that run each term. Survey and
    cartography along the east. I keep that section deep because
    the older editions move slow but steady. History fills the
    top tier, mostly in rebindings. The originals have gone to the
    library, and what I carry are working copies, well used and
    honest. The crate by the door is whatever has been here long
    enough to be marked down twice. Most of the shelves are spoken
    for by the university's term orders. What I can sell a passing
    reader today is on the list.
- key: surveyors
  kind: info
  label: Who asks you about the eastern country?
  text: |
    I get a lot of questions about the eastern survey work. The
    university runs expeditions every few years, and the accounts
    come back to me sooner or later, bound or in pamphlet. There was
    a surveyor who retired early, Reth. He took a quiet life in the
    residential streets and never quite explained why. He came in
    more than once asking about the eastern country. Specific
    questions, the kind that want a map with something particular
    marked on it. Brennan up at the university asks the same sorts
    of things now. If you want someone who knows the subject, he's
    your man. I have maps on the shelves, but the university's
    orders take most of them. And I don't always have the answers
    to what people are really asking.
  hints: Brennan works in his office at the university. From the Bookshop, go east
    to the Market Square, south four times to the University Stair, and up to the
    University Gate. Then go south into the Quadrangle, west into the Lecture Hall,
    and south into Brennan's Office. He sleeps at his desk late at night. Type talk
    brennan.
  marked: true
- key: university
  kind: info
  label: Are the scholars good customers?
  text: |
    Good customers. They buy in runs, they know exactly what they
    want, and they pay without haggling, which is more than I can
    say for the general public. The university is three hundred
    years old and still growing. They're on the east wing now,
    with timber going up the hill by barge every other week. This
    town would be half its size without the university. Students come in at the start of
    term with lists. I work through the lists. The rest of the
    year they come in with questions, which is harder work and
    more interesting.
