mobid: 9518
zone: Greenford
defaultMood: friendly
greetings:
- text: Softly, if you would. Lending is below and reference above, and the
    reading room is south if you need a table.
  moods:
  - friendly
opener:
  text: |
    Forgive me, I did not mean to startle you. These are the
    public stacks, for lending and for reference. If you need a
    table and a lamp, the reading room is south. The card
    catalogue sits beside this desk. Use it once and you will
    find it simple. Quietly, now: how may I help?
  hints: Choose a line below if you would like to hear about the library's
    sections, about borrowing books, about the quiet of the stacks, or about the
    university.
topics:
- key: library
  kind: info
  label: What is kept in the library?
  text: |
    The lower shelves are lending. Periodicals in bound runs,
    geography and natural philosophy, a good run of the
    university's own published papers. The upper tiers are
    reference only, not to leave the room. The card catalogue
    covers everything in the public stacks. It does not cover the
    archive, which is a separate set of holdings south of the
    reading room. If you know what you want, the catalogue will
    tell you where to find it. If you do not, tell me the subject.
- key: borrowing
  kind: info
  label: Can I borrow a book?
  text: |
    Lending is for members of the university, on a standard card.
    The card stays here and the book goes with them. Visitors read
    in the room, and reference items do not leave it at all. The
    lending section is the lower shelves. Returns go on the cart by
    the entrance, and I reshelve every day. The reading room south
    keeps the same hours and has its own lamp stands. If something
    is not on the shelf, it is out on loan, in the reading room, or
    on the returns cart.
- key: quiet
  kind: info
  label: Why is it so quiet in here?
  text: |
    The rule is old and does not need a sign. People who use the
    stacks regularly already know it. People who do not learn it
    from the people who do. The reading room south is the same. I
    find most visitors respect it without being told, which is the
    best kind of rule, the kind that works because people already
    want it to.
- key: university
  kind: info
  label: How long have you kept the library?
  text: |
    Nine years. Three hundred years of additions to the building,
    and the library has grown every time, which suggests the
    institution knows what it is for. The work suits me. The
    scholars are careful with the collection and the students learn
    to be. The catalogue is mine, and I intend to keep it exact for
    as long as I am in this room. That is enough of a purpose.
