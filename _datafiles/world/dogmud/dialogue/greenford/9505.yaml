mobid: 9505
zone: Greenford
defaultMood: friendly
greetings:
- text: Morning, friend! The river was good to us last night. Trout, smoked
    river-fish, and a catch so fresh it's still cold. Have a look, looking's
    free.
  moods:
  - friendly
opener:
  text: Step up, step up! Fenn's fish, the best counter on the river row at the
    Greenford landing. Trout this morning, fat as you like. Smoked river-fish
    from yesterday's run. And under the cloth, the fresh river catch, still
    cold. Every price is on the board, chalked fair and up to date. What'll it
    be?
  hints: You could ask Fenn what is fresh today, about the river row, or about this
    season's river. To see what he sells, type list.
topics:
- key: fish
  kind: info
  label: What is fresh today?
  text: Trout from the fishers on the steps this morning, fat ones. A good current this
    week puts the fish in the right humor. Smoked river-fish from yesterday, still in
    prime condition. I'll have it off the counter by this afternoon whether it's sold
    or not. The river catch under the cloth is mixed, bream, roach, whatever else the
    nets brought up last night. All of it off the river, all of it same-day or smoked
    by my own hand. I don't sell anything that isn't fresh and never have. Eleven
    years, no complaints. I know what's fresh because I know what fresh smells like,
    and that's not a skill you can fake for long before people stop coming back.
- key: market
  kind: info
  label: Who trades on this row?
  text: The row's been here as long as the landing. Fish stall, chandler's, bakehouse.
    We each do our own trade and we don't step on each other's. My customers are the
    riverfolk, the barge crews, and the scholars who can be convinced that fresh fish
    is worth the walk downhill. The scholars are good customers when they remember to
    eat, which isn't always. I've had one buy three trout on a Monday and come back on
    a Thursday looking surprised that the counter had changed. They're elsewhere in
    their heads, most of them. I like them fine.
- key: river
  kind: info
  label: How is the season on the river?
  text: Good season so far. The water's at a good level, the trout are moving well,
    and the fishers upstream have been bringing in solid catches. The river runs fat
    and green here in the summer, which suits the fish and suits me. Flood season in
    spring is when things get interesting. The steps go under water, the fishers move
    up the bank, and I end up buying from the nets instead of the rods. Different
    fish, different prices, same river. You learn to work with what it sends.
