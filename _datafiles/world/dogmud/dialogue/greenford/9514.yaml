mobid: 9514
zone: Greenford
defaultMood: friendly
greetings:
- text: Sorry, I'm heading up. Be quick if you need something.
  moods:
  - friendly
opener:
  text: Oh! Hello. I'm late, but I've made my peace with that. I'm in my third
    year at the university, up at the top of the hill. Survey methods and
    applied cartography. It sounds dry until you're actually out in the field.
    I'm on my way up now, so ask quickly, while I'm still here.
  hints: Choose a line below to hear about her studies, about the university, or
    about Greenford.
topics:
- key: study
  kind: info
  label: What are you studying?
  text: |
    Survey methods is the core of it this year. Measurement,
    triangulation, how to read and make a useful map rather than a
    decorative one. Last year was natural philosophy and
    mathematics. The year before was history and legal texts,
    which I liked less. The university covers a lot of ground
    across three years before you specialize. Most people find
    something they want to keep going with. I found the field work.
    It starts at the end of term, and it can't come soon enough.
    The indoor study is fine. The outdoor study is why I came.
- key: university
  kind: info
  label: What is the university like inside?
  text: |
    Three hundred years of additions, which makes the building a
    puzzle. Old stone at the base, newer work on the upper courses,
    a library wing that went up two generations ago and is still
    the best bit. The tower you can see from the square is the
    first building. There are students who've been here three years
    without going up it. I went up in my first week. Worth it. The
    lecture hall is in the low range beside the tower. You can hear
    the lecturers from the lane when the windows are open, which
    they mostly are.
- key: greenford
  kind: info
  label: Why do people come to Greenford?
  text: |
    For the university, mostly. It's the reason the town is the
    size it is. Three years' study draws students from a long way
    out, and some of them stay after, which is why there are so
    many copyists and booksellers for a town this size. The market's
    decent, the inn on the square is comfortable, and the lower
    town by the river has its own life entirely. It's a good place
    if you like books and don't mind a hill.
