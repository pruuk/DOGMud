mobid: 9530
zone: Greenford
defaultMood: friendly
greetings:
- text: Road-warden. Heading west or just passing through? Either way, you're in the
    right place.
  moods:
  - friendly
opener:
  text: |
    I saw you coming a while back. I'm Garn, road-warden at
    Greenford's west gate these sixteen years. If you're heading
    out, the distance board on the south post will tell you what
    you need. The stable and the shrine sit just past the gate,
    one on each side of the road. New Plymouth is three days west
    on a clear road. If you're arriving instead, the town is east.
    Which way are you bound?
  hints: Choose a line below if you would like to hear about his work at the
    gate, about the road west to New Plymouth, or about Greenford.
topics:
- key: gate
  kind: info
  label: What does a road-warden do?
  text: |
    My job is the road. Who's using it, whether the surface wants
    repair, whether the drainage channels are clear after rain. I
    keep the distance board current and I log the through-traffic.
    The gateposts have been here longer than me. The pintles are
    empty, and the gate's been gone for generations, but the posts
    still mark the edge of the town and that's what matters. The town
    pays me to notice things, which suits me, because I notice
    things anyway. That's the whole of the work, and it turns out to
    be enough.
- key: road
  kind: info
  label: How far is it to New Plymouth?
  text: |
    New Plymouth is three days west on a clear road, two by horse
    if you push it and the surface holds. The milepost a mile out
    gives you the measure of it. It names Greenford behind you and
    Plymouth ahead. The road's kept up to the county mark, four
    miles out. After that it's the next county's business, and
    they're good about it. The road is good, when you have the days
    for it.
- key: town
  kind: info
  label: What will I find in town?
  text: |
    Good town to come back to. The market square is ten minutes
    east. The inn's on the square if you want a meal, and the
    general store if you're resupplying. I've been at this gate so
    long I think of myself as part of the edge of the town. Not
    quite inside it, not quite on the road, just the place where one
    becomes the other. Most people walk past me without stopping.
    The ones who stop tend to be worth the conversation.
