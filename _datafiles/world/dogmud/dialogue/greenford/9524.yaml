topics:
- key: testimony
  kind: info
  label: Brennan sent me with his word.
  text: |
    Brennan's word, then. Sit down. I surveyed the eastern country
    for twenty years. There is a place out past the Cascade Pass,
    in the highlands at the far edge of everything, and the maps
    have it wrong because I filed the wrong elevations when I came
    back. Deliberately. I had reasons. Go north from Hartcharn to
    Kingsbarrow, and take the old trail east through the hedge-gap
    and over the pass. Near the top you will find my markers.
    Follow them east. Where the way turns south you come to a cairn
    split by lightning. You will know it. The stone has been struck
    and the break is deep. From the cairn the way bears east, past
    an old survey camp, over ground that turns from pale stone to
    dark.
    When the green stops, and it will stop, hard, mid-step, as
    though someone drew a clean line across the ground, you are
    there. What is there is a surface. Not stone. No seam I could
    find, no join, no tool mark I recognise. Metal, of a kind, too
    clean and too large for anything I can name. Nothing grows near
    it. The ground around it is bare in a way ground does not go
    bare on its own. I did not stay. I do not know what it is. I
    have thought about that more than I find comfortable. It is not
    natural. I came home and filed three lines and stopped talking
    about it. I still believe that was the right thing to do. The
    field notes are on the table, and the route is marked. Take
    them. I am not going back, and I would rather they were
    somewhere useful than sat here.
  hints: Reth's notes lie on the table. Type look field notes.
  marked: true
  questRequired:
  - 75-intro
  questExcluded:
  - 75-end
- key: closed
  kind: info
  label: Will you tell me about your old surveys?
  text: I'm retired. I don't discuss the old surveys. Good day.
  questExcluded:
  - 75-intro
- key: retirement
  kind: info
  label: How long were you a surveyor?
  text: |
    Twenty years of survey work. I retired four years ago. I live
    quietly here and it suits me. I keep the notes in order more
    out of habit than anything else. I don't miss the field. That
    is all.
- key: yew
  kind: info
  label: Why do you leave the yew so wild?
  text: |
    The yew was here when I moved in. I left it to itself, the only
    sensible way with a yew. It has had the front garden for twelve
    years now. I have adapted. The cottage is spare and orderly.
    The yew keeps most people from stopping.
- key: town
  kind: info
  label: Do you like living in Greenford?
  text: |
    Greenford is quiet enough. The university keeps the town
    running without making it busy. I do not need much from it,
    which is convenient, as it does not offer a great deal to
    people who want to be left alone.
