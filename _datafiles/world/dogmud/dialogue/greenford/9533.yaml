mobid: 9533
zone: Greenford
defaultMood: friendly
greetings:
- text: Morning. The shrine's open to anyone. You don't need to explain yourself to
    stop here.
  moods:
  - friendly
opener:
  text: |
    Hello. You're welcome to stop a while. This is the
    Wayfarer's Shrine, here on the west road, and I'm Mette. I've
    kept it nine years, though the post is a great deal older
    than me. Travelers leave coin in the offering box, or a
    keepsake, or nothing at all. The blessing doesn't need paying
    for. Are you heading west, or only stopping?
  hints: Choose a line below to hear about the shrine post and its carving,
    about what travelers leave, about the road-blessing, or about how she came
    to keep the shrine.
topics:
- key: shrine
  kind: info
  label: Who carved the shrine post?
  text: |
    No one knows. The post has been here as long as anyone in
    Greenford can remember, longer than the gate, longer than the
    distance board. The carving at the top is a cloaked figure with
    a staff, facing west, the hand raised in a road-blessing. It's
    worn smooth by weather. You can read the shape of it but not the
    details anymore. No one knows who carved it or why they set it
    here. The oil lamp at the base is for the wet months, a light by
    the road when it goes dark. In summer it stays empty. The post
    manages without it.
- key: offerings
  kind: info
  label: What do travelers leave in the box?
  text: |
    People leave what they have, or what they want to be rid of
    before the road. Coins are the common thing. I collect them
    monthly, and they go toward the post's upkeep and a small share
    to the town's road fund. But the other things interest me more.
    A ribbon wound around a stone, which is someone's private
    symbol. Dried stems from a roadside plant. A folded paper with a
    name on the outside. I don't open the papers. Whatever they mean
    to the person who left them is theirs to keep. Travelers always
    bring more.
- key: blessing
  kind: info
  label: What is the road-blessing?
  text: |
    The rite is simple. I say it for travelers before they head
    west. Safe roads, dry weather, and arrival. That's the whole of
    it. I don't think of it as sacred in any elaborate sense. It's a
    wish, said aloud, by someone who has watched travelers leave by
    this road for nine years and means it. The carving is old and the
    rite probably is too, but the meaning is plain. You don't need to
    believe anything in particular for it to be a good thing to say.
    So. Safe roads, dry weather, and arrival. There. Now it's said
    for you too.
- key: keeper
  kind: info
  label: How did you come to keep the shrine?
  text: |
    By accident. The keeper before me was a man who lived by the
    west gate and tended this post for thirty years. When he died,
    he left a note with the town registry saying I was the next
    keeper. I'd spoken to him twice. I don't know what he saw. But
    I've been here nine years and I haven't wanted to leave.
    Travelers are interesting company, even briefly, maybe most of
    all briefly. I like the moment just before someone leaves.
    Something honest happens in it.
