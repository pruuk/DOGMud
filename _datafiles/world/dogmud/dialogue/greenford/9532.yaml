mobid: 9532
zone: Greenford
defaultMood: friendly
greetings:
- text: Morning. West road, if you're wondering. First time out this way.
  moods:
  - friendly
opener:
  text: |
    Headed west, to New Plymouth, for the first time. I've had the
    route described to me by half of Greenford, so I feel fairly
    well prepared. The pack's right, the provisions are bought. All
    I'm waiting for now is the hour. What do you need?
  hints: Choose a line below to hear what takes her to New Plymouth, about the
    road ahead, or why she is leaving.
topics:
- key: destination
  kind: info
  label: What takes you to New Plymouth?
  text: |
    Family. They've been after me for three years to come, and I've
    finally run out of good reasons not to. The city is supposed to
    be everything Greenford isn't. The harbour, the river district,
    the real trade. I don't doubt it. I expect I'll spend a week
    getting turned around before I find my feet, and then I expect
    I'll find them. The world is bigger than this town, and I've
    wanted to see it long enough to have earned the trip.
- key: road
  kind: info
  label: Are you ready for the road?
  text: |
    Three days, if the road holds, and all of it good. That's what
    the warden at the gate told me, and the ostler at the stable
    agreed. The milepost a mile out names the distance, and I mean
    to read it on the move rather than stop and stare at it. I've
    packed for four days to have a margin. Everyone says the
    highland crossing takes longer than you expect, so I've
    expected it to take longer and allowed for it. That seems the
    sensible way. I mean to find out for myself.
- key: leaving
  kind: info
  label: Why leave Greenford now?
  text: |
    I've lived here twenty years and I like it well enough. But New
    Plymouth's been there the whole time, three days west, and I've
    never gone. Family there, people I know, the wider world.
    There's no drama to it. I'm going because the road is there and
    I'm ready and I stopped finding reasons not to. That's usually
    how the good decisions happen. Not a crisis. Just running out of
    excuses.
