mobid: 9594
zone: Greenford
defaultMood: friendly
opener:
  text: A visitor. Good, my eyes could use the rest. Take a seat, if you like.
    I'm Tibb, and this is the Jeweler's Bench. Have you come to buy, or to make
    something at the bench yourself?
  hints: You could ask Tibb about his jeweler's bench, or about the materials he
    sells. To see what he sells, type list.
topics:
- key: craft
  kind: info
  label: Can I use your jeweler's bench?
  text: A ring, a pendant, or a chrysalis setting can be made at this bench, if you
    bring the stone and the wire. You may work there if you do not hurry it. The bench
    does not hurry, but the work holds up.
  hints: To see what you know how to make, type craft list.
- key: jewel
  kind: info
  label: What materials do you sell?
  text: Copper, silver, and gold wire, polished stone, a few raw gems worth setting,
    gem dust, chain link, and the odd black pearl. I keep a small tray, but everything
    in it is honest work. Some weeks are better than others for good stone.
