mobid: 9517
zone: Greenford
defaultMood: friendly
greetings:
- text: Wipe your boots. Paper remembers water and so do I. The reading stand is
    free. Browse quietly, and put things back where your hands found them.
  moods:
  - friendly
opener:
  text: |
    The Archive. I know where everything is. Say what you want and
    I will tell you if we have it. The eastern surveys are on the
    upper tier, if that is what you are looking for. The restricted
    collection is east. That opens by written application, and the
    provost signs the leave.
  hints: Choose a line below to hear about the eastern surveys, about the marks
    in the survey margins, about how the archive is kept, or about the
    restricted collection.
  variants:
  - questRequired:
    - 75-survey
    questExcluded:
    - 75-intro
    text: You have read it. Then it is Brennan you want, not me. Interpretation is
      not my function here.
    hints: From the Archive, go north to the Reading Room, west to the Cloister Walk,
      then west into Brennan's Office. He sleeps at his desk late at night. Type talk
      brennan.
  - questRequired:
    - 75-start
    questExcluded:
    - 75-survey
    text: Brennan sent you for Reth's survey. I have left it out on the reading stand.
      Read it there, and leave it where it lies.
    hints: Type look filed survey.
topics:
- key: eastern_surveys
  kind: info
  label: Where are the eastern surveys kept?
  text: |
    On the upper tier, far right, in order by year of expedition.
    Reth's filed report is the thin one, three expeditions back. I
    have left it out on the reading stand. Someone has been asking
    after it for some time now. That is all it is, a filed survey.
    Read it yourself if you like.
  hints: Reth's filed survey lies on the reading stand here. Type look filed survey.
- key: symbol
  kind: info
  label: Have you seen marks in the survey margins?
  text: |
    I have catalogued the instances I can find. A recurring mark in
    the margins of the oldest surveys, in different hands, from
    different years of fieldwork. Several scholars have asked me
    about it over the years. No one has agreed on what it marks. I
    note it and file it. Interpretation is not my function here.
- key: archive
  kind: info
  label: How is the archive kept?
  text: |
    Box-files by region and date, portfolios in the same order. The
    card index on the reading stand covers everything in the open
    holdings. The oldest work is on the top tier. Recent work is
    below. If you know the region and the rough date, I can find
    what you need in a moment. Some of us keep the source records
    and ask the questions that the official accounts consider
    settled. The Margin, some call us. The Margin does not shout
    about what it finds. We file carefully and we wait. That is most
    of what keeping an archive amounts to, in the end.
- key: restricted
  kind: info
  label: What is in the restricted collection?
  text: |
    It lies east of here, and it opens by written application
    only, and the provost signs the leave. It holds what the
    university considers sensitive. Donor records, contested
    attributions, a few survey portfolios under review. The review
    has been going on for some time. I do not ask about the pace of
    it. You would need to apply in writing to the Keeper of the
    Archive, as the notice on the door says. Most people decide it
    is not worth the wait.
