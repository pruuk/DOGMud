mobid: 9502
zone: Greenford
defaultMood: friendly
greetings:
- text: Stone-ground this morning. What do you need, flour, bread, or both?
  moods:
  - friendly
opener:
  text: This is Maret's Mill, here at the landing, and I am Maret. The wheel
    does the hard part. I do the grinding and the selling, and I do both
    properly. The flour is stone-ground this morning, the loaves came out before
    the stones started, and the trout are fresh from the steps. Nothing here is
    older than today. What brings you in?
  hints: You could ask Maret about her flour, about the river and the floods, or
    about the barges and the grain they bring. To see what she sells, type list.
topics:
- key: flour
  kind: info
  label: What do you grind here?
  text: I grind for three farms and the university kitchens. The stone is set for
    fine flour. I can run it coarser for meal, but it takes time to reset. The loaves
    I bake in the mornings before the grinding starts, so they're ready by the time
    the flour is. River trout I buy from the fishers at the steps, dress them myself,
    and sell them the same day. I don't keep stock overnight. If it's not fresh, I
    don't sell it. That's the policy, it has been the policy, and it will continue to
    be the policy. Prices are what they are. The stone doesn't bargain and neither
    do I.
- key: river
  kind: info
  label: Does the river ever flood the mill?
  text: The river runs the wheel, so I pay attention to it more than most. Spring is
    the anxious season. If the channel jumps its bank, the sluice gate goes under
    water and I lose a week at least. I've had the floor flood twice. The wheel's been
    running this stretch for sixty years and the sluicework is sound, but sound
    doesn't mean safe. I watch the water level. There's a gauge post in the landing
    wall. If it goes past the third mark, I pull the gate and stop the wheel until it
    drops.
- key: trade
  kind: info
  label: Where does your grain come from?
  text: Barges from the Confluence bring raw grain, three farms' worth, sometimes
    four when the harvest is good. I grind it and it goes back out as flour to the
    university kitchens, the town bakeries, and the river-row stalls. It's a short
    loop. Greenford runs on the mill. The mill runs on the river. The river runs on
    whatever the uplands send down each year. When the harvest is poor upriver, you
    know about it here inside a season. I've learned not to read much into it unless
    it happens two years running.
