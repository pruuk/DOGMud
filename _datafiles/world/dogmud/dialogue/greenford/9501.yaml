mobid: 9501
zone: Greenford
defaultMood: friendly
greetings:
- text: You're through. Welcome to Greenford. The town's up the hill if that's where
    you're headed. The gate's open.
  moods:
  - friendly
opener:
  text: Eleven years at this gate and I still check the ledger every morning.
    You're through, welcome. The river landing's south of here, and the town
    climbs the hill from there. It's a quiet place, scholars mostly, with the
    university up at the crown. You'll eat well, and there's an inn on the
    square. Anything you need to know before you go on?
  hints: You could ask Oswin about the bridge, about the river trade at the landing,
    about the toll, or about Greenford and the university uphill.
topics:
- key: bridge
  kind: info
  label: How old is this bridge?
  text: Three arches of dressed stone, here longer than anyone can say for certain.
    The toll covers the upkeep. A bridge like this doesn't stay sound without someone
    watching the mortar and walking the spans after every flood season. That's my
    other job, besides the ledger. I've closed this crossing twice in eleven years,
    once for ice damage on the east pier, once when the central span went soft. Both
    times we had it right again inside a season. The toll's modest. The bridge is
    worth it.
- key: river
  kind: info
  label: What trade comes up the river?
  text: Good river trade through here. Barges up from the Confluence mostly, running
    grain and timber to Greenford and going back with flour and finished goods.
    The landing's just south of the gate, a stone quay, well kept. The mill's at the
    landing too, which is why the barges bother making the run upriver. The river's
    fast here in the spring flood season, slow and green in summer.
- key: town
  kind: info
  label: What is Greenford like?
  text: Greenford's a quiet place. The university's at the crown of the hill and has
    been there three hundred years, give or take. Scholars, mostly, and the
    tradespeople who live off them. Booksellers, copyists, an inn on the square that
    knows how to keep scholars happy, which means quiet and well fed. The riverfolk
    down here are their own sort, practical people, less interested in books than in
    what the river does next. Both kinds get along well enough. The town's worth the
    walk uphill if you have the time.
- key: pay
  kind: info
  label: Do I owe a toll to cross?
  text: Not you. The toll is for carts and cargo, and it's settled at the ledger.
    A traveler on foot goes through. Move along when you're ready.
