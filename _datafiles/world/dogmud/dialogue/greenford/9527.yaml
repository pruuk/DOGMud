mobid: 9527
zone: Greenford
defaultMood: friendly
greetings:
- text: Morning. Mind the beds. I've just turned the edges.
  moods:
  - friendly
opener:
  text: |
    You've caught me at the right hour for this work, before
    the light is full. This is the walled garden behind
    the tea house. The herbs are in the south beds, and the
    chard and greens are on the east. I'll keep my hands in the
    soil while we talk, if you don't mind. It won't wait.
  hints: Choose a line below to hear what grows in her beds, about the season,
    or about the tea house.
topics:
- key: garden
  kind: info
  label: What grows in these beds?
  text: |
    The south beds are herbs. Thyme, sage, and a grey-leaved thing
    I've had here for six years that I still don't have a good name
    for. Good for the tea house either way. Ness knows what to do
    with it. The east beds are chard and late greens. They'll go
    another four weeks if the weather holds. The wall keeps the
    wind off and holds enough warmth that I get a longer season
    than I would otherwise. Good old walls.
- key: season
  kind: info
  label: What comes next in the garden?
  text: |
    We're at the end of the growing season here. The chard will go
    when the first hard frost comes, which I expect in the next few
    weeks. After that I'll turn the beds and put them down for
    winter, with manure from the coaching stable, nothing fancy.
    Spring planting starts earlier than most people think. I'll be
    in here in the last frosts with seeds. The wall helps with that
    too.
- key: teahouse
  kind: info
  label: Does the tea house use your herbs?
  text: |
    The garden backs onto the tea house. I tend it, and Ness gets
    first use of whatever's here. The arrangement suits us both.
    She doesn't have to order dried herbs from the market, and I
    have a walled garden with good soil and a south wall that I
    wouldn't have otherwise. Eleven years that's held. I don't see
    any reason it should change.
