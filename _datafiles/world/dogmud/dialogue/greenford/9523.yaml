mobid: 9523
zone: Greenford
defaultMood: friendly
greetings:
- text: Hm? Oh, yes. I am here. I am not gone. I am just between one thought and the
    next. Ask me.
  moods:
  - friendly
opener:
  text: |
    If you are wondering about the folio, it is comparative
    history. Two schools, two founding accounts, and one
    inconsistency between them that will not resolve. I have
    been circling it for six months. I am not stuck, you
    understand. I am being patient, between one way of seeing
    it and the next. The cloister walk is good for that. Ask me
    something.
  hints: Choose a line below to learn about the cloister walk, about his
    research, or about what keeps him at the university.
topics:
- key: cloister
  kind: info
  label: Why think out here in the cloister?
  text: |
    Good light through the arches in the morning, and it is quiet.
    The quad carries noise. The cloister does not. The cold from the
    stone becomes a problem after about an hour, which is usually
    long enough. The quince tree has been there since before anyone
    now at the university was born, which I find comforting for
    reasons I cannot quite put into words. Something about problems
    that outlast the people who plant the question.
- key: work
  kind: info
  label: What are you researching?
  text: |
    Two schools, both with founding accounts written by the third
    generation after the founders. Both accounts say their school
    was the first of its kind in the region. Both use similar
    language in the founding documents. The interesting question is
    whether that likeness means one copied the other, both copied a
    common original, or it is chance. I lean toward copying. The
    problem is that I cannot find the source. Six months. It is
    still interesting. I am simply doing the patient kind of
    looking.
- key: university
  kind: info
  label: What keeps you at Greenford?
  text: |
    I came for the archive. Greenford has materials the capital's
    schools do not, and Tess the Archivist is the best keeper of
    old institutional records I have met. I expected to stay a
    year. That was four years ago. The cloister walk is good for
    thinking, the library is well kept, and the archive has not run
    out of surprises yet. There are worse reasons to stay somewhere.
