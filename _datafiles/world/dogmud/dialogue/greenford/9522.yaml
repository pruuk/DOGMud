mobid: 9522
zone: Greenford
defaultMood: friendly
greetings:
- text: University gate. Visitors are welcome. I'll point you where you need to go.
  moods:
  - friendly
opener:
  text: |
    Morning, and welcome to the university gate. I'm Kern, the
    porter. I answer the same few questions all day, and I've
    come to enjoy answering them well. Visitors give their name
    at the lodge window, and I keep the ledger. The library is
    east across the quad, and the archive is south of its
    reading room. Brennan's office is in the lecture-hall range,
    west of the quad. Visiting hours are on the board. Now,
    where are you headed?
  hints: Choose a line below to learn the way to the library, the archive or
    Brennan's office, about the university, or about the gate and its ledger.
topics:
- key: directions
  kind: info
  label: How do I find the library, archive and Brennan?
  text: |
    South of this gate is the quad. The library is east across it,
    with the public stacks, reference, and lending. The reading room
    is south of the library, and the archive is south again, past
    the reading room. If it is the eastern surveys you want, Tess
    the Archivist has them. Brennan's office is west of the quad,
    through the lecture hall and out its south door. The board here
    has visiting hours for all three.
  hints: To reach Brennan, go south into the Quadrangle, west into the Lecture Hall,
    then south into Brennan's Office. He sleeps at his desk late at night. Type talk
    brennan.
  marked: true
- key: university
  kind: info
  label: Is the university still building?
  text: |
    Three hundred years and still building. The east wing is being
    extended right now, with timber going up past the tower every
    other week. Seven years I have been at this gate, and the
    grounds have not stopped changing. The colleges each have their
    own hours and their own ways. The board covers the main
    buildings. The university is the town's main industry and its
    main personality, in about equal measure.
- key: gate
  kind: info
  label: What do you write in your ledger?
  text: |
    I keep the log and the board. Visitors in and out, the hours of
    the main buildings, any closures or changes to the day. The
    ledger is mine and I keep it exact. If someone has been here,
    their name is in it. If they left, that is in it too. Seven
    years of that record is in the lodge behind me. Some of it is
    interesting looking back. Most of it is just names and hours,
    which is what it is supposed to be.
