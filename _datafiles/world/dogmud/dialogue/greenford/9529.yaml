mobid: 9529
zone: Greenford
defaultMood: friendly
greetings:
- text: Morning. Market's just opening if you're heading that way.
  moods:
  - friendly
opener:
  text: |
    Up before the row most mornings. It's just how I'm made. The
    basket's for the market square. The row's quiet now, but it'll
    wake up in an hour. What do you need to know?
  hints: You could ask the resident about her early mornings, about the way to the
    market square, or about College Row.
topics:
- key: morning
  kind: info
  label: Why are you up so early?
  text: |
    I've always been up at first light, long before I moved here,
    long before the basket and the market run. I used to fight it.
    Now I use it. The row at dawn is a different place than it is at
    midmorning. Quieter, the air different, the light coming across
    the rooflines at an angle. I don't mind being the only one
    awake. I actually prefer it.
- key: market
  kind: info
  label: How do I get to the market square?
  text: |
    It's a walk, but an easy one. North up the lane to the college,
    through the cloister and the quad, out the university gate, and
    down the hill to the square. Produce stalls open at first light
    on the good days, which is why I go early. The general store
    opens a bit later. The fishmonger's further down, by the river.
    I usually have what I need and I'm back before the row is
    properly awake. It's a decent market for a town this size.
  hints: From College Row, go north three times to the Cloister Walk, north into the
    Quadrangle, north to the University Gate, down to the University Stair, then north
    four times to the Market Square.
- key: row
  kind: info
  label: Do you like living on College Row?
  text: |
    I've been here three years, which is enough to know the row's
    habits but not long enough to have opinions about them. The tea
    house at the east corner opens early. Ness keeps her own hours,
    which are good hours. The scholars come through in the mornings
    on their way up to the university. It's a settled row, quiet
    without being dull. I like living here.
