mobid: 9590
zone: Greenford
defaultMood: friendly
opener:
  text: Mind the sparks. This is the Guild Forge, and I'm Aldo. I'd sooner be
    hammering than talking, so tell me straight. Are you here to buy metal, or
    to work at the forge?
  hints: You could ask Aldo about his forge, or about the materials he sells. To see
    what he sells, type list.
topics:
- key: craft
  kind: info
  label: Can I use your forge?
  text: I keep the forge lit most every day. Blades, buckles, chain, a fair bit of
    plate, whatever the metal allows. You may work at it if you stay out of my way.
    Bring the right materials. The forge does not care whose work it is, only
    whether the metal is honest.
  hints: To see what you know how to make, type craft list.
- key: smith
  kind: info
  label: What materials do you sell?
  text: Steel and iron ingots, lake-iron nodules, pine pitch, wooden planks for hafts
    and hilts, chain link, and coal dust for the fire. The prices are on the list.
