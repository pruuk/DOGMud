mobid: 9506
zone: Greenford
defaultMood: friendly
greetings:
- text: Don't mind me. I'm here most mornings. The river water's cold enough to do
    the job properly, which is the most you can ask of it.
  moods:
  - friendly
opener:
  text: I've done the washing for half the river district for more than twenty years.
    The green's the right place for it. It's close to the water, the elm gives shade
    by midmorning, and the old stone there doesn't bother anyone while I work. I'm not
    going anywhere until the linen's done, and the linen takes a while.
  hints: You could ask the washerwoman whose washing she does, about the cold river
    water, about the river district, or about the old stone on the green.
topics:
- key: laundry
  kind: info
  label: Whose washing do you do?
  text: University linen mostly. The scholars make a remarkable amount of it, given
    how little attention they seem to pay to anything that isn't a book. Ink stains,
    candle wax, river mud on the cuffs where they've been walking the bank thinking
    something through. I've got good at ink. River water and a proper scrub gets most
    of it. The rest I tell them is a permanent feature and they should write it off.
    Some of them are relieved. I also do linen for the river-row families and the
    barge crews when they're in long enough. Coin's coin and linen's linen.
- key: river
  kind: info
  label: Isn't the river too cold to work in?
  text: Cold. Even in summer this river runs cold. It comes down from the uplands and
    doesn't warm up enough by the time it reaches here to make any difference to the
    washing. My hands have been in this water more hours than I can count, and my
    Chrysalis change keeps them whole. The skin never prunes and never cracks.
    That's about the only good thing I can say about the river's temperature. The
    washing likes it, though. Cold water sets linen better than warm and holds the
    color longer. So I'm not complaining. Just observing.
- key: town
  kind: info
  label: What is life like down by the river?
  text: |
    The river district's its own sort. Fishers, mill workers, barge
    crews, the chandler, and Fenn with his fish. We're not the
    university people. They're uphill and we're down here, and
    that's fine. They come down for fish and flour and we go up
    for the market days, and the two halves of the town get along
    without much trouble. The riverfolk know the river and the
    scholars know their books, and there's enough traffic between
    them to keep everybody fed and reasonably informed. It's a
    decent life. I've lived worse elsewhere, and I stay here
    because it suits me.
- key: stone
  kind: info
  label: What is that old stone on the green?
  text: Old thing. It's been here longer than the buildings. The riverfolk leave mint
    at the base. Nobody organized it. It just happens.
