mobid: 9521
zone: Greenford
defaultMood: friendly
greetings:
- text: Oh, hi. Sorry. I was working through something in my head. What did you
    need?
  moods:
  - friendly
opener:
  text: |
    Sorry, give me a moment. I'm carrying more books than I
    need, as usual. Second year, natural philosophy and
    mathematics. Examinations come at the end of term, so I
    really should be reading, and instead I'm sitting in the
    quad. I'll regret this break when I check the time. Ask me
    something. It'll make the break worth it.
  hints: Choose a line below to hear about his studies, about the university
    grounds, or about Greenford.
topics:
- key: studies
  kind: info
  label: What does the second year study?
  text: |
    Natural philosophy and mathematics are the core this year.
    Last year was history and legal texts, which I liked
    unevenly. Survey methods and the field work come next year,
    and they are the reason I came. I have the examinations
    between here and there, which is the main obstacle at the
    moment. They come at the end of term, in six weeks. I have
    accepted that this is not enough time and am going on anyway.
- key: university
  kind: info
  label: What is worth seeing on the grounds?
  text: |
    The grounds have been built onto for three hundred years, so
    nothing quite lines up. New work is still going up the hill
    while we are here. The tower above the quad is the original.
    I have still not been up it, which I am told is a disgrace.
    The rest is built around it and has
    been for three centuries. The library, east across the quad, is
    the best part of the whole place. Worth going in even if you
    are not looking for anything.
- key: greenford
  kind: info
  label: Is Greenford a good place to live?
  text: |
    People come for the university, mostly. The town is the size it
    is because three years of study draws students from a long way
    out, and some stay on, which is why there are copyists,
    booksellers, and a decent inn for a town this size. The lower
    town by the river has its own life. The market square is good
    on market days. It's a reasonable place if you like books and
    can manage a hill.
