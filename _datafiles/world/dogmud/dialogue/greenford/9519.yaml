mobid: 9519
zone: Greenford
defaultMood: friendly
greetings:
- text: Mm. Yes. Come in. The chair by the fire is not anyone's in particular.
  moods:
  - friendly
opener:
  text: |
    Historiography. The Founding's account of itself. Three
    hundred years of scholars accepting it, which does not make it
    wrong, but does make the question more interesting than it has
    been treated. I have been looking at it for twenty years, and
    the dates do not add up. I am here because the common room is
    warmer than my office. Ask me something.
  hints: You could ask the scholar about his doubts on the Founding, about how he
    reads old documents, about why the official account troubles him, or about his
    place at the university.
topics:
- key: founding
  kind: info
  label: What is wrong with the Founding account?
  text: |
    The Founding account is coherent. Suspiciously so. Three
    centuries of records, all pointing to one tidy origin story, no
    serious loose ends that were not resolved and filed away. The
    problem is that the account was compiled and made official. It
    did not simply survive. Documents that support it are easy to
    find. Documents that come before it and complicate it have a way
    of ending up in collections that are hard to reach. I am not
    saying someone falsified three hundred years of records. I am
    saying the surviving record is a selection, and selections have
    selectors. I do not know yet who was selecting, or why. That is
    the question.
  marked: true
- key: sources
  kind: info
  label: How do you read an old document?
  text: |
    The method is simple. Find out when the document was written.
    Not when the event happened, but when the record of it was
    made. Most of the Founding's first sources were compiled one to
    three generations after the fact. That is not dishonest in
    itself. But it means the compiler decided what belonged and what
    did not. I look for the things they decided did not belong. They
    are usually still there, if you know where the gaps are. Gaps in
    an official record have a particular texture.
- key: official
  kind: info
  label: Why does a neat account trouble you?
  text: |
    Living history has loose ends. That is how you tell it is real.
    The parts that did not resolve neatly, the things that happened
    and did not fit the story people were trying to tell. The
    Founding account has none of that. Every piece fits. Every
    contradiction is addressed. Every awkward document has a
    footnote explaining it away. I do not have another account to
    offer you. I have a list of questions the official account does
    not answer, and a strong feeling that someone spent a great deal
    of effort making it feel as if it does.
- key: university
  kind: info
  label: Does the university mind your questions?
  text: |
    The university tolerates me because I publish in the right
    journals, train able graduate students, and am, by the
    standards of my field, respectable. My colleagues find me
    tiresome at dinner, which is fair. The institution has three
    hundred years of investment in a particular story of itself,
    and I spend my working hours asking why the dates in that story
    do not hold together. We have reached an understanding. They
    leave me my common room chair, and I do not lecture in the main
    hall.
