mobid: 9515
zone: Greenford
defaultMood: friendly
greetings:
- text: You looking for the scribe or the chandler? I can tell you which one's open.
  moods:
  - friendly
opener:
  text: |
    I'm on the lane most mornings. The scribe's on the west side,
    the chandler's on the east, and the pigeonhole board's at the
    scribe's door. The lane's quiet most days, which is why I like
    it. I've got the morning off, more or less. What do you want to
    know?
  hints: Choose a line below to hear about the shops on the lane, about his
    work, or about Greenford.
topics:
- key: lane
  kind: info
  label: What shops are on this lane?
  text: |
    The scribe's on the west side. Copying, fair hand, legal
    drafts, the usual. He's good and he doesn't overcharge, which
    you can't say for all of them. The chandler on the east side
    does candles and sealing wax for the lane's letters. The
    pigeonhole board at the scribe's door is the lane's informal
    post. Half the letters in the upper town come through those
    slots before they go anywhere else. It has worked this way for
    longer than anyone can say. Past the chandler the craft shops
    run on east, and the counting house is just south of here.
- key: work
  kind: info
  label: What work do you do?
  text: |
    I'm a factor for two of the counting-houses in the upper town.
    Courier work mostly, letters and contracts between the guild
    offices and the university. It's not glamorous, but it's steady,
    and I know every office and every shortcut in the upper town by
    now. The lane's a good base for it. The scribe's here when I
    need a clean copy, and the chandler's here when I need a seal.
    Between them I barely need to go anywhere else.
- key: town
  kind: info
  label: Has Greenford changed much?
  text: |
    I've been in Greenford eight years, which is long enough to know
    it doesn't change much. The market square's the centre of the
    upper town. The river district's its own thing below. The
    university keeps the place running. The scholars need copyists,
    factors, chandlers, a good inn, and the town obliges. It's not an
    exciting arrangement, but it's a reliable one. I've lived in
    more exciting places. I prefer this.
