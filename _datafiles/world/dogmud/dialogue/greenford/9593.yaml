mobid: 9593
zone: Greenford
defaultMood: friendly
opener:
  text: Come in, if you must. The circle is drawn fresh. I'm Cade. State your
    business plainly, the light in here is poor.
  hints: You could ask Cade about his enchanting circle, or about the materials he
    sells. To see what he sells, type list.
topics:
- key: craft
  kind: info
  label: Can I use your enchanting circle?
  text: A chrysalis setting can be bound at this circle, or a chrysalis core worked,
    if you bring the materials to it. You may use it if you keep it clean. The
    working wants precision. Bring that with you.
  hints: To see what you know how to make, type craft list.
- key: enchant
  kind: info
  label: What materials do you sell?
  text: Chrysalis shards and cores, binding paste, mutation catalyst, a few settings
    not yet claimed. Oak bark, hive fragments and black pearl when the caravans have
    them. I keep what the working demands, nothing more. I do not stock idle
    curiosities.
