mobid: 9510
zone: Greenford
defaultMood: friendly
greetings:
- text: Come in, sit down. The fire's up and there's broth on if you want it. What
    do you need?
  moods:
  - friendly
opener:
  text: |
    I heard you on the step. This is the Cartographer's Rest,
    the inn on Greenford's square. There's broth most days
    and bread every morning, and I keep the fire up from first
    light. You're standing in the common room, so you've found
    the best of it already. The rooms upstairs go to scholars by
    the term. What brings you through?
  hints: Choose a line below to learn about the inn, about the travelers who
    stop here, or about Greenford and the market. To see what he sells, type
    list.
topics:
- key: inn
  kind: info
  label: Do you have a room for the night?
  text: |
    Not to let, I'm sorry to say. The rooms upstairs go to
    scholars by the term, and they complain about noise more than
    anyone else, so I put them on the quiet side. But the settle by
    the hearth is for regulars and anyone tired enough to claim it,
    and nobody minds a traveler resting there. The slate behind the
    counter has what's on. The broth is in the pot from morning. The
    bread I put out at first light. Nothing on the slate isn't in
    the kitchen. No elaborate menu. Good food, a good fire, sound
    sleep. That's the Rest.
  hints: To rest by the fire, type sleep.
- key: travelers
  kind: info
  label: Who stops at the Rest?
  text: |
    We get a fair bit of through-traffic. The road up from the
    river crossing comes through here, so anyone coming up from
    the Confluence or heading out on the Plymouth road tends to
    pass the door. Scholars are the backbone of the trade. They
    arrive at the start of term with too much luggage and sit here
    a night before finding their quarters at the university. The
    rest are merchants, surveyors, the occasional party of
    travelers who just want somewhere warm. I don't distinguish.
    The Rest is the Rest for everyone.
- key: town
  kind: info
  label: What is around the market square?
  text: |
    The market square's just outside the door, with produce most
    mornings at the cross, the general store, and Aldith's bookshop
    on the west side. It's a good town for an inn. The university
    keeps the trade steady all year, even when the road traffic's
    thin. The university's at the crown of the hill, which you
    can see from the square. The town's quiet by most measures,
    which suits me and suits the scholars. If you want busy, you
    want the Confluence.
