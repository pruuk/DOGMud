mobid: 9526
zone: Greenford
defaultMood: friendly
greetings:
- text: You look like you're finding your way. Can I point you somewhere?
  moods:
  - friendly
opener:
  text: |
    Sixteen years I've lived on this row, and you catch a lot
    from a front gate in sixteen years. I know the lane, the
    college back gate, and who lives behind which door. I won't
    tell you everyone's business, mind. But if you're looking
    for somebody, I can likely point you right. So, what can I
    tell you?
  hints: Choose a line below to hear who lives where on the lane, about the row
    itself, or about daily life here.
topics:
- key: directions
  kind: info
  label: Who lives down the west lane?
  text: |
    The west lane runs off College Row by the blue door, and the
    blue door at the corner is Brennan the scholar. Third house down
    is Reth. You'll know it by the yew over the path, a big old
    tree with branches right out into the lane. A quiet man since he
    came back from wherever he was. Before that I'd see him on the
    row most mornings. The cottage is easy to find once you know to
    look for the yew.
  hints: From College Row, go west to the Blue Door, then south twice to Reth's
    Cottage.
  marked: true
- key: row
  kind: info
  label: What is College Row like?
  text: |
    College Row is the main residential street, the wider cobbled
    one with the front gardens behind iron railings. The tea house
    is east at the corner. The west lane branches off by the blue
    door toward the quieter houses. The college back gate is north
    at the top. The row is tidy. People here take some care of it,
    which I consider the right attitude to a shared street.
- key: daily
  kind: info
  label: What is a day on the row like?
  text: |
    Quiet mornings, mostly. The scholars go up the hill early. The
    rest of us take the row at our own pace. The tea house opens
    before anyone else is moving. Ness knows you're coming before
    you're halfway down the lane. It's a settled sort of
    neighbourhood. People know each other's habits. I like that.
