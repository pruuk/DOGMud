mobid: 9591
zone: Greenford
defaultMood: friendly
opener:
  text: Oh, come in, come in! Welcome to the Weaver's Loft. I'm Wenna. Have you
    come for thread, or would you like a turn at the loom?
  hints: Choose a line below if you want to hear about her loom, or about the
    materials she sells. To see what she sells, type list.
topics:
- key: craft
  kind: info
  label: Can I use your loom?
  text: The loom is always running, but there is room at it for a careful hand. A
    plain tunic or a reinforced travel pack, most anything can be cut and stitched,
    so long as you bring the cloth and thread. Bring good material and do not waste
    it.
  hints: To see what you know how to make, type craft list.
- key: weave
  kind: info
  label: What materials do you sell?
  text: Thread spools, bone needles, a bit of beeswax for waxing seams, and a
    component pouch or two. I keep a modest shelf, but everything on it is made to
    last through a season's work.
