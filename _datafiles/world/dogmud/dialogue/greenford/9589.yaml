mobid: 9589
zone: Greenford
defaultMood: friendly
opener:
  text: Good day to you. What business brings you to the Counting House? Come in
    out of the lane. I can hold your coin, keep your goods, or set a line down in
    the ledger for you.
  hints: Prewitt keeps the bank and a storeroom for goods. To see how much gold you
    have stored here, type bank.
topics:
- key: bank
  kind: info
  label: How do I store gold here?
  text: This counting house will hold your coin as safe as anything in Greenford.
    The strongbox is bolted through the floor, and I keep the only key. Every
    deposit gets its own line in my ledger, and you will find the sum exactly as you
    left it.
  hints: To store gold, type bank deposit and the amount.
- key: withdraw
  kind: info
  label: How do I take my gold out again?
  text: I keep an honest ledger. Every withdrawal gets its own line, the same as every
    deposit. There has not been a shortfall on my watch, and there will not be one
    while I am counting. Take your time. The ledger is not going anywhere.
  hints: To take gold out, type bank withdraw and the amount.
- key: storage
  kind: info
  label: Can you keep my goods as well?
  text: Goods as well as coin. Whatever you leave with me goes behind the counter,
    under its own line in the ledger, and it will be there when you come back for
    it. Nothing leaves this room without my seeing it.
  hints: To see what you have stored here, and how to add or take out an item, type
    storage.
- key: ledger
  kind: info
  label: What does your ledger record?
  text: This ledger holds rents, grain tithes, quarter rates, and the odd loan against
    next season's harvest. I know who owes what, and who has always paid on time. It
    is not complicated work, but it wants a steady hand.
