mobid: 9534
zone: Greenford
defaultMood: friendly
greetings:
- text: Morning. Rain before noon, I think. You can feel it coming in off the road.
  moods:
  - friendly
opener:
  text: |
    The west lane, last stretch before the gate. I come past here
    every morning. I live on the far end of the lane, closest to the
    road. You get used to the traffic. Some of it you stop noticing
    and some of it you never do. What do you want to know?
  hints: Choose a line below to hear about living at the edge of town, about how
    she knows the rain is coming, or about the travelers who pass.
topics:
- key: edge
  kind: info
  label: What is it like at the edge of town?
  text: |
    It's the last stretch before the open country. The houses at
    this end are older than most of the town, and the front gardens
    run wider than anywhere else in Greenford. It's quiet, by which
    I mean there's road noise but no market noise. Carts, horses,
    the odd coach. The gateposts are a landmark. I walked past them
    a thousand times before I started paying attention to them. Now
    I notice when the road-warden's at his bench and when he isn't.
- key: daily
  kind: info
  label: How do you know the rain is coming?
  text: |
    I feel weather in the air, truly, because of my Chrysalis
    change. Faint raised bumps along my jaw and cheek pick
    up air movement the way a hand held out of a window picks up
    wind. I can tell the wind's direction before a leaf moves. I feel
    the change in the air before the sky shows it. It means I'm
    right about the rain more often than not, which is a strange
    thing to be known for in a lane this quiet. But there are worse
    things to be known for.
- key: travelers
  kind: info
  label: Who passes through on the road?
  text: |
    Mostly people heading west. The Plymouth road draws most of the
    through-traffic. Merchants, scholars from the university, the
    odd large party. The coaches are the loudest. The ones on foot
    tend to stop at the shrine before the milepost. I've watched a
    lot of people leave and I've watched some of them come back.
    Most of them don't. But that's the road. Once you've gone west
    that far, New Plymouth tends to keep you. That's what people
    say, anyway. I've never been.
