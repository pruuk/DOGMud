mobid: 9504
zone: Greenford
defaultMood: friendly
greetings:
- text: Landing's busy this morning. A barge came in from the Confluence last night.
    Mind the grain sacks on the south stack, they're not settled yet.
  moods:
  - friendly
opener:
  text: Can't stop long, friend, I'm paid by the load. Whatever comes up from
    the Confluence, I take off the barge, and whatever goes back down, I put on.
    Timber, grain, finished goods, it's all the same to my arms. This time of
    year a boat ties up at the Greenford landing every few days, and the river's
    running well. Ask while I work.
  hints: Choose a line below if you would like to hear about the cargo, about
    the Confluence, or about the current this season.
topics:
- key: cargo
  kind: info
  label: What does the barge carry?
  text: This load's mostly grain and sawn timber, the common run. The grain goes to
    the mill, Maret grinds it, and the flour goes back downriver on the same barge or
    the next one. The timber's for the university building works up the hill. They've
    been extending the east wing for two years now and the end is not yet in sight.
    The barge also runs iron fittings, rope and lamp oil, the things a town needs that
    the river country doesn't make on its own. Flat-bottomed river craft, good for
    grain and timber. Not built for the coast. Doesn't need to be.
- key: confluence
  kind: info
  label: What is the Confluence?
  text: The Confluence is downriver. Three rivers meet there. It's a big market town,
    with the temple. That's where most of the cargo starts its journey here. The barge
    masters base themselves there and run circuits up the smaller rivers, this one
    among them. It's maybe a day's run from here to the Confluence in a good current,
    two days coming back up against it. The market there is bigger than anything
    Greenford runs. This town trades in books and ideas more than goods. But the river
    keeps the two joined, and that's what matters.
- key: current
  kind: info
  label: How is the river running this season?
  text: Good current right now. Fast enough to make the downriver run quick, slow
    enough that coming back up doesn't need a second crew. The spring flood season is
    when we earn our pay. The river doubles in speed and the barges have to be
    rope-walked up the worst of the fast water, which is hard work and nobody's idea
    of a good time. But flood season brings high water, and high water means we can
    run a deeper barge and carry more in one trip. There's always a trade. The river
    teaches you that.
