opener:
  text: |
    Thirty years of eastern surveys on that wall, and one
    question I cannot answer from them. I am Brennan. If Aldith
    sent you up the hill, or if you found the office yourself,
    sit. I have something I need done that I cannot do myself.
  hints: Choose a line below if you want to hear about his survey work, about
    the mark on his old maps, or about his place at the university.
  # Quest states, latest first (first match wins, and HasQuest is also
  # true at every later step, so each variant excludes the step after it).
