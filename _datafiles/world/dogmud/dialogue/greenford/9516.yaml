topics:
- key: grant
  kind: offer
  quest: 75
  label: The Surveyor's Report
  playerLine: Is there something I can help you with?
  text: |
    There is. A surveyor named Reth retired early, and his field
    report on one site in the eastern country reads like a careful
    man saying as little as possible. Three lines, for a site that
    should have run to a page. I have not been able to get him to
    explain it. You might do better. But before you go anywhere
    near Reth, I want you to read the filed survey yourself. Tess
    the Archivist keeps it in the Archive. Read it, then come back
    and tell me what you see in it. I want to know before you go
    any further. Will you do that?
  hints: Accept, then read the survey in the Archive. From Brennan's Office, go east
    to the Cloister Walk, east to the Reading Room, then south into the Archive. Type
    look filed survey.
  questExcluded:
  - 75-start
  - 75-end
  grantsQuest: 75-start
- key: disc_quest
  kind: offer
  quest: 76
  label: The Disc
  playerLine: Do you know what this disc is?
  text: |
    Let me look. A ring struck through with a line, raised in the
    metal itself. I have chased that mark across a hundred and
    fifty years of margins, and here it is, made solid. This is a
    key. I am sure of it. But it is dead in the hand, and it will
    stay dead until someone wakes it, and I do not know how. A man
    did. He kept a cottage in Ashwick and gave his whole life to
    that thing in the east. He studied how to wake the key, then
    went east himself and never came back. His work should still
    be in the house he left. Will you go to Ashwick, find the
    abandoned cottage, and read what he left behind? Take the disc
    with you. You will need the thing itself.
  hints: Accept, then take the disc to the abandoned cottage in Ashwick.
  questRequired:
  - 75-end
  questExcluded:
  - 76-start
  - 76-end
  carriesItem: 40167
  grantsQuest: 76-start
- key: disc_tale
  kind: offer
  quest: 76
  label: The Disc
  playerLine: Is there more I can help you with?
  text: |
    The mark on my wall, the nested rings. One margin, older than
    the rest, draws it with a line struck through the ring, and a
    note beside it: the same mark, cut in grey metal, set into the
    floor of the old Reliquary at Pothole Coulee. If the note is
    right, that disc is a key, and a dead one. It will stay dead
    until someone wakes it, and I do not know how. A man did. He
    kept a cottage in Ashwick and gave his whole life to that thing
    in the east. He studied how to wake the key, then went east
    himself and never came back. His work should still be in the
    house he left. Will you find the disc, then go to Ashwick, find
    the abandoned cottage, and read what he left behind? Bring the
    disc. You will need the thing itself.
  hints: Accept, then take the disc from the cracked floor of the old Reliquary at
    Pothole Coulee, behind the old shrine north of the stone circle, and bring it
    to the abandoned cottage in Ashwick. At the Reliquary, type look disc.
  questRequired:
  - 75-end
  questExcluded:
  - 76-start
  - 76-end
  itemExcluded: 40167
  grantsQuest: 76-start
- key: knower
  kind: info
  label: What do you see in me?
  text: |
    I sent you east chasing a mark in a margin, a puzzle for a
    quiet department, and you came back carrying something the rest
    of us get to not know. I have spent thirty years wanting the
    answer to that mark. I am no longer certain I want it. Look at
    me. I am not going to ask. Whatever the site gave you, keep it
    close, and be careful who you tell. Some of what people believe
    up here, they need. And some of what they would do to a person
    who unbelieves it out loud, they would do gladly. You have a
    look about you now. Mind who sees it.
  marked: true
  questRequired:
  - 77-end
- key: turnin
  kind: info
  label: Reth's survey says almost nothing.
  text: |
    You read it. And you saw what is not there. Three lines where
    there ought to be a page, the site called a mineral deposit
    with no elevation notes, no samples, no seasonal access. From a
    surveyor who did his job that well everywhere else. That
    silence is what I have been looking at. Reth will not speak to
    me. We have history, and it is not friendly. But I will give
    you my word to take to him. He lives at the quiet end of the
    residential streets, past the back gate of the college, in the
    third house down the west lane, the one with the overgrown yew.
    Tell him I sent you, and that I am not asking him to explain
    anything. I am asking him to let you read the original notes.
  hints: From Brennan's Office, go east to the Cloister Walk, south three times to
    College Row, west to the Blue Door, then south twice to Reth's Cottage. Reth
    is asleep late at night. Type talk reth.
  marked: true
  questRequired:
  - 75-survey
  questExcluded:
  - 75-intro
  - 75-end
- key: symbol
  kind: info
  label: What is the mark on your old maps?
  text: |
    It appears in the margins of the oldest surveys. A mark of
    nested rings, small and precise, drawn by different hands over
    decades of fieldwork, by people who did not know each other. No
    notation explains it. No legend. It has been turning up in the
    surveys for about a hundred and fifty years, coming and going,
    without anyone agreeing on what it marks or why different
    surveyors drew the same thing. I have three examples on that
    wall, in different hands, forty years apart. I find them the
    most interesting problem I have, and I have no answer to offer
    you. I have asked the Archive. I have written to colleagues at
    two other institutions. The honest summary is that it recurs,
    and no one knows why.
  marked: true
- key: work
  kind: info
  label: What do you look for in the surveys?
  text: |
    Thirty years of field survey in the eastern country. The
    terrain, the routes, the resource classifications. Most of it
    is exactly what it looks like, careful records of a country
    that has been recorded before. The interesting work is in the
    differences. Where the current surveys differ from the old ones,
    and where the old ones differ from each other. That is usually
    where the real question lives. Most of my colleagues find the
    fieldwork repetitive. I find it the part that does not lie.
- key: reth_after
  kind: info
  label: What happened between you and Reth?
  text: |
    Reth was good at the work. Better than good. Twenty years in
    the field, thorough, reliable, the kind of surveyor whose
    reports you could build on without checking. He retired early
    and did not explain it, and I made the mistake of pressing him,
    which is why we no longer speak easily. He lives quietly at the
    end of the west lane, in the house with the yew, and I respect
    his quiet even when it costs me something. If you have his
    confidence, keep it carefully. He has earned the right to his
    silence.
  questRequired:
  - 75-intro
- key: university
  kind: info
  label: How long have you held the survey chair?
  text: |
    Twenty-two years. The university has three departments it could
    place the work in and has never quite decided which one, which
    means I have some freedom and a smaller budget than I would
    like. Some of us here keep the source records and ask the
    questions that official accounts consider settled. The Margin,
    some call us. Mostly harmless, as far as the university is
    concerned. The department suits me. The library is good, the
    archive is well kept, and there are students who find the
    eastern fieldwork truly interesting. I could have gone to the
    capital. I have not regretted staying.
