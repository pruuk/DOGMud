mobid: 9528
zone: Greenford
defaultMood: friendly
greetings:
- text: Good morning. You're not lost. This lane just goes quiet at the end. Can I
    help?
  moods:
  - friendly
opener:
  text: |
    Ah, a visitor at the quiet end. I've stood at this gate
    every morning for twelve years, ever since I retired from
    the registry, and I've lived here long enough to know
    everything that goes on in this lane, and most of what
    doesn't. It goes quiet at the south end. That's rather the
    point of it. What can I do for you?
  hints: Choose a line below to hear about the last house on the lane, about
    this end of the lane, or about his years at the university.
topics:
- key: reth
  kind: info
  label: Who lives in the last house?
  text: |
    Reth's the last house. You can't miss it, the yew overhangs the
    path. I knew him before he went quiet. Surveyor, twenty years
    in the eastern country. He'd come past the gate on his way into
    town most mornings. Sociable enough. Not the chatty sort, but
    not closed either. Then he came back from the last survey and
    closed the gate, and that was that. I don't press. A man has
    the right to his quiet. Knock if you need to. He'll answer if
    he feels like it. I just hope he's all right in there. He looks
    well enough when I do see him.
  hints: Reth's Cottage is just south of here.
- key: lane
  kind: info
  label: Why keep your gate open?
  text: |
    The west lane at its quietest end. Longer front gardens, older
    houses, nobody hurrying. My gate's the one that hangs open. I've
    had it open for twelve years and I see no reason to change. The
    lane's private enough at this end that nobody minds. It's a good
    place for someone who wants to be left mostly alone and still
    have neighbours a short walk away.
- key: career
  kind: info
  label: What did you do at the university?
  text: |
    Forty years in the university registry. Land records,
    agreements, the old archive of property and appointments. Not
    exciting work, but exact work, and I was good at it. I left at
    sixty and I have not looked back. I have enough opinions about
    my former colleagues to fill a volume I will never write, which
    is the right end for that kind of material. The lane suits me
    better than the registry ever did.
