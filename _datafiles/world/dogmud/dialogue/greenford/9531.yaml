mobid: 9531
zone: Greenford
defaultMood: friendly
greetings:
- text: Morning. Heading west? I can have you provisioned and out before the hour.
  moods:
  - friendly
opener:
  text: |
    You've found the coaching stable at the west gate. I'm Wren.
    I keep four horses, two coaches and this yard together, and
    I keep all of it moving. If you're heading west, I can
    sell you rations for the road and have you out before the
    hour. What'll it be?
  hints: You could ask Wren about the stable and its horses, about food for the road,
    or about the travelers who pass through. To see what she sells, type list.
topics:
- key: stable
  kind: info
  label: Whose horses are these?
  text: |
    Mine. Four horses, two light coach horses and two for the post.
    I've had this yard nine years, and I can tell you the name and
    temper of every horse that's come through. The coaches are mine
    too, a light post-chaise for the Plymouth run and a heavier
    wagon for goods. They run on the post's timetable, not for hire.
    The harness is on the wall rack, checked weekly. I don't wait
    for something to fail before I look at it. The trunk in the
    yard is waiting to be collected.
- key: provisions
  kind: info
  label: What food do you sell for the road?
  text: |
    The counter's along the east wall. I keep trail rations in
    waxed cloth, a day's worth to each bundle, and they fit a
    saddlebag without your thinking about it. River loaf most
    mornings while the mill's running. Nothing elaborate. This is a
    stable, not a bakehouse. But a traveler needs to eat, and I'd
    rather you have what you need here than turn back to town for
    it. Prices are the market rate. I don't mark up for the
    convenience.
- key: trade
  kind: info
  label: Who travels the Plymouth road?
  text: |
    The Plymouth road's in use all year, whatever the weather, so the west gate sees through-traffic when other roads
    go quiet. I get merchants, scholars heading to the capital, the
    odd party with goods and real urgency. The pleasant ones ask how
    the road is. I tell them the surface is good to the county mark
    and the rest is someone else's business. The ones who don't ask
    find out for themselves. The road is fine. It's a good road
    west.
