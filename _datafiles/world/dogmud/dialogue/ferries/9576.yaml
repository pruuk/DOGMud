opener:
  text: This old girl is the Broadbeam, between the Confluence and New Plymouth. Passage
    gets settled with the agent at the dock. The crossing is short, as these things
    go. Sit tight and let her ride.
  hints: The gangplank leads to whichever pier the boat is tied up at. Wait while
    she crosses. When she ties up at the pier you paid to reach, type gangplank to
    walk ashore.
