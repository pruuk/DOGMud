opener:
  text: You want the agent ashore for passage, not me. I only work the lines.
    She is the Lakewind Packet, and she runs between Stillwater and New
    Plymouth. The crossing does not take long. Mind the rail.
  hints: The gangplank leads to whichever pier the boat is tied up at. Wait while
    she crosses. When she ties up at the pier you paid to reach, type gangplank to
    walk ashore.
