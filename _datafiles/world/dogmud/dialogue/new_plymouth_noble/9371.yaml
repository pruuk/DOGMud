  label: I've lost the reading you gave me.
  text: Then I write it out again. I have not stopped looking at that panel since.
    Here. Keep this one close.
  hints: Keeper Lysha writes her reading out again and hands it to you. Take it to
    Scholar Dross at the Grand Temple. Type talk dross.
  questRequired:
  - 69-reading
  questExcluded:
  - 69-end
  itemExcluded: 40116
  givesItem: 40116
- key: q69_lysha_circle_aside
  kind: info
  label: I stand with the cooperage circle.
  text: Orin vouches for you, quietly, the way we do anything. Then I will say
    plainly what I would not say to a stranger. I am of the circle, here, inside the
    bloodline's own gallery, reading the thing they hung the lights to hide. Be
    careful with what you now carry.
  hints: Lysha, knowing you stood with the circle, trusts you with her own part in
    it. The work is the same. Take her reading to Dross.
  questRequired:
  - 69-reading
  questExcluded:
  - 69-end
  questFlagRequired:
    68-allegiance: circle
- key: paintings
  kind: info
  label: What are the older paintings here?
  text: The bloodline portraits are recent and well made. I have no criticism of
    them as commissions. The older panels between them are different work. They are
    earlier, by fifty years at the least, possibly more, judging by the cracks in the
    varnish and the palette, which I can date to within a decade if I know the
    source. Whoever painted them painted from life. The landscapes are accurate. The
    settlement scenes are accurate. The details in the third panel from the left are
    accurate. That last part is where things become interesting.
- key: cipher
  kind: info
  label: What is the symbol in the third panel?
  text: The eight-pointed figure in the background of the third panel, worked into
    the detail of a structure at what looks like an early settlement. I have seen
    that same symbol in three places since. In documents the cooperage circle's
    archive holds, in survey material a bookseller called Orin has gathered, and in
    a report, secondhand, from a scholar called Dross who works at the Temple. The
    same eight-pointed figure in different places, pointing at the same location. It
    is not decoration. It marks something that was there before the city's official
    beginning. Whether the bloodline knows what it marks, I do not know. Whether they
    know I can read it, I am careful not to make obvious.
  hints: She named the cooperage circle's archive, a bookseller called Orin, and a
    scholar called Dross, three separate threads arriving at the same symbol.
  moodChange: cautious
- key: truth
  kind: info
  label: What do the paintings say about the founding?
  text: The settlement in the third panel is not where New Plymouth stands. The
    coastline in the same panel is accurate. I can check the landform against the
    harbor surveys. The structure with the eight-pointed symbol stands somewhere that
    would be inland from the present docks, roughly where the canal district meets
    the edge of the Old Quarter. The official history has a set place and time for
    this city's beginning. These paintings show an earlier one. I do not know what
    that earlier place was, or what happened to it, or why the history was written
    over it. I know that the difference is real, and that the gallery's lighting was
    not designed to make the third panel easy to examine. Someone decided what this
    room was for.
  hints: The earlier settlement stood where the canal district meets the Old
    Quarter. She is very quiet after saying this.
  moodChange: cautious
