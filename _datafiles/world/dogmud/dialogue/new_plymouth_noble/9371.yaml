topics:
- key: q69_lysha
  kind: info
  label: Dross sent me about the third panel from the left.
  text: The third panel from the left. So someone finally came up the stairs to
    ask. Show me the rubbing. Yes. This is the same hand as the panel, or the same
    workshop. The eight-pointed device, the ringed geometry, identical. The painter
    worked from life. The landscape is accurate, and so is the structure. It stands
    inland of the present docks, where the canal district meets the edge of the Old
    Quarter. The gallery's lighting was not built to make this panel easy to
    examine. Someone decided what this room was for. Here. My reading, written out.
    Take it to Dross. He will know what it completes.
  hints: Keeper Lysha matched your rubbing to the third panel and gave you her
    written reading. Take it back to Scholar Dross at the Grand Temple. Type talk
    dross.
  marked: true
  questRequired:
  - 69-gallery
  questExcluded:
  - 69-reading
  - 69-end
  carriesItem: 40115
  grantsQuest: 69-reading
  givesItem: 40116
  moodChange: cautious
# Quest 69 recovery: the reading is the only way to finish, so a player who
