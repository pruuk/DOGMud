mobid: 9373
zone: New Plymouth Noble
defaultMood: neutral
greetings:
- text: Come in. Don't touch the work in progress on the table.
  moods:
  - neutral
  - cautious
- text: The stock is where it was. Thread and cloth are on the left.
  moods:
  - friendly
opener:
  text: I make things for particular people who have arranged to have them made. For
    everything else, I have materials and finished pieces on the shelf. What is it
    you wanted to know? The craft, where the cloth comes from, or something else
    entirely?
  hints: Choose a line below to hear about her craft and the work she does for
    the bloodline, about where her fine cloth comes from, or about what a
    clothier sees in the people she dresses. To see what she sells, type list.
topics:
- key: buy
  kind: info
  label: What do you have on the shelves?
  text: Materials and finished pieces. Thread, cloth, a cloak, a tunic. Work made to
    measure goes through the steward's office, and it does not go to strangers.
  hints: To see what she sells, type list.
- key: craft
  kind: info
  label: What do you make here?
  text: I make the bloodline's formal wear. Commissions for the senior household, the
    ceremonial uniforms, the pieces that appear at Council sessions and civic
    occasions. I take very little outside work, and none for strangers. The
    atelier is not a shop. It is a workroom. The shop part is incidental. The work
    is what this space is for.
  moodChange: friendly
- key: supply
  kind: info
  label: Where does your fine cloth come from?
  text: The fine cloth comes from Nessa's workshop in the Crafting Quarter. She
    is the only source I trust at the weights the bloodline's commissions need.
    Nessa gets first pick of the fine bolts that come up from the docks, and no
    one in this city stitches better. I have worked with her cloth for four
    years. The rest of what I stock, thread, plain cloth, lighter weights, comes
    through the usual suppliers. The difference matters. The bloodline can tell
    the difference. I make sure they never have to.
  hints: She named Nessa's workshop in the Crafting Quarter as her main source.
- key: power
  kind: info
  label: What do you see in the people you dress?
  text: A clothier sees what people want to be seen as. The bloodline wants to be
    seen as inevitable. The cloth I make for them says this has always been here,
    this is the only possible form of this thing. Other clients want to be seen as
    prosperous, or serious, or dangerous, or safe. They come in knowing what they
    want to show, and I turn that into something they wear. Sometimes I close my eyes
    and read the cloth they are already wearing before they say a word. It tells me
    more than they usually intend to say. I don't mention what I learn.
  hints: She reads people through fabric the same way she reads quality through
    touch. She does not mention what she learns. She simply knows it.
  moodChange: friendly
