mobid: 9370
zone: New Plymouth Noble
defaultMood: friendly
greetings:
- text: Welcome to the Noble Quarter. Are you here for the tour, or just looking
    around on your own?
  moods:
  - friendly
  - neutral
- text: Good to see you again. The Quarter is looking well today.
  moods:
  - cautious
opener:
  text: The Noble Quarter is one of New Plymouth's finest districts, a working part
    of the city as well as a historical one. I give tours here most days. What can I
    tell you about? The founding, perhaps, or the gallery, or how the Quarter works
    today?
  hints: You could ask Guide Ferrol how New Plymouth was founded, about the gallery
    and its collection, or about what he leaves out of the tour when visitors push at
    the edges of it.
topics:
- key: founding
  kind: info
  label: How was New Plymouth founded?
  text: New Plymouth was established by seven founding families who arrived by sea
    in what the charter records as the third year of the coast-clearing expedition.
    They chose this site for the harbor, the ridge to the north that could be
    defended, and the fresh water that still feeds the city today. The charter stone
    was laid in the first winter, which was harsh, and the first Council met in the
    second spring. That Council's line is the bloodline that governs today.
    Continuous, documented, unbroken. It is a city with a very clear account of
    itself, which I find is not always true of cities.
  hints: He told the founding story well, fluently, with the confidence of someone
    who has delivered it many times.
  moodChange: friendly
- key: gallery
  kind: info
  label: What is in the gallery?
  text: The gallery holds the Quarter's formal collection. The bloodline portraits
    are the centerpiece, excellent commissions, very fine work. There are some older
    pieces between them. Decorative, of uncertain origin, not really part of the
    curated collection. They fill the wall space well. The keeper looks after them,
    but they are not on the standard tour. I usually steer visitors toward the
    portraits and the civic panels. That is where the real story is.
  hints: He dismissed the older paintings between the portraits as decorative with
    particular smoothness.
- key: script
  kind: info
  label: What do you leave out of the tour?
  text: I... the founding history is well documented. There is no shortage of
    evidence for it. I have given this tour enough times that I know exactly where
    the text holds and where it does not repay close examination. The older panels
    in the gallery are not my department. If you want someone who will talk to you
    about what the gallery really contains, there is a keeper. Her name is Lysha.
    The gallery is north of the Administrative Office. I would not necessarily
    recommend asking her about the third panel from the left.
  hints: Something shifted in him for a moment before the smile came back. He
    mentioned Keeper Lysha in the gallery, and told you not to ask about the third
    panel. Which is the one you should ask about.
  moodChange: neutral
