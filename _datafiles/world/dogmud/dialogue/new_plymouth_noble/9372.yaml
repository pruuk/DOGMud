mobid: 9372
zone: New Plymouth Noble
defaultMood: neutral
greetings:
- text: The lane is for residents.
  moods:
  - neutral
  - cautious
- text: The lane is for residents. Nothing has changed since the last time.
  moods:
  - hostile
opener:
  text: The lane is for the residents of this block. The gate doesn't open to
    visitors.
  hints: Choose a line below if you want to hear about the lane behind the gate,
    about who lives there, or about what it takes to hold a post like his.
topics:
- key: lane
  kind: info
  label: What is behind the lane gate?
  text: A private lane for the families who hold the estates back there. There is no
    circumstance that opens it to visitors. You are not a resident. The gate is
    closed.
  hints: Final.
- key: residents
  kind: info
  label: Who lives on the lane?
  text: The households behind this gate conduct their arrangements privately, which
    is the whole point of having a gate. Their names are not part of my work here. My
    work is to confirm who belongs here. You don't.
  hints: He explained precisely why that answer is not available to you in any form.
- key: job
  kind: info
  label: What does it take to hold a post like this?
  text: It suits me. Most work has something moving in it. Deliveries, trade, some
    form of arrival and departure. This post is about one thing. Someone arrives, I
    establish whether they belong here, and the gate either opens or it doesn't. It
    has opened exactly as often as it should. I find that satisfying.
  hints: He said it with the calm of someone who has found exactly the right work.
    There is nothing more he will offer.
  moodChange: friendly
