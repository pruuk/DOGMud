mobid: 9368
zone: New Plymouth Noble
defaultMood: cautious
greetings:
- text: What is your business here?
  moods:
  - cautious
  - neutral
- text: The office is open. State your purpose.
  moods:
  - friendly
opener:
  text: I manage the Quarter's administrative correspondence and the bloodline's
    business with the city. Was there something specific you needed, or are you
    simply learning your way around?
  hints: You could ask Steward Caldwin about the work of his office, about whose
    orders he carries out, or about how far his patience for questions goes.
topics:
- key: office
  kind: info
  label: What work does this office handle?
  text: I handle the bloodline's dealings with the city. Correspondence, civic
    arrangements, licensing, the many agreements that keep a city running at this
    size. It is detailed work. Most of it is of no interest to anyone not directly
    involved. The worktable handles it efficiently.
- key: order
  kind: info
  label: Whose orders do you carry out?
  text: The city has governing interests. Those interests need carrying out.
    Decisions that have been made must become actions, actions must become records,
    and records must be kept. I carry out that chain. The people at the top of it
    are not part of this conversation. The city running is the relevant fact.
  hints: He described a system without naming anyone in it.
- key: patience
  kind: info
  label: How far does your patience for questions go?
  text: I have considerable patience for necessary questions. I have rather less for
    curiosity that presents itself as necessity. People who make a habit of asking
    for more than the work requires tend to find that the arrangements they depend
    on become less reliable. I say this without heat. It is simply how the
    administration works.
  hints: He delivered a warning with absolute composure. There is nothing further he
    will offer.
  moodChange: cautious
