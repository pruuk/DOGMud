mobid: 9369
zone: New Plymouth Noble
defaultMood: cautious
greetings:
- text: Oh! Sorry. I wasn't expecting anyone.
  moods:
  - cautious
  - neutral
- text: Hello. Did you need something?
  moods:
  - friendly
opener:
  text: I... yes? Sorry. I was listening for the stair. I wasn't expecting anyone.
  hints: You could ask Wenna about her work here, about why she is so careful around
    the steward, or about what she has seen on the estate lane at night.
topics:
- key: bloom_delivery
  kind: info
  label: Where do the unmarked crates come from?
  text: I... I've said too much to too many people already and I know it. But since
    you're asking. The estate at the end of the lane, the unmarked crates, the early
    hours. The carters who bring them don't come from the docks. They come from
    below. The canal side. There is a way in from the old towpath, in the buried
    quarter, and that is where the goods really move from. The address they end at
    is 215 Lintel Street, in the Old Quarter. The man who keeps that house is called
    Deren. I heard the name given once. I should not have been in that passage.
    Please. Please do not say you heard this from me.
  hints: Wenna named the house at 215 Lintel Street in the Old Quarter, and the man
    who keeps it, Deren. She asked not to be named. Type talk deren.
  marked: true
  questRequired:
  - 67-lintel
  questExcluded:
  - 67-delivery
  - 67-end
  grantsQuest: 67-delivery
  moodChange: cautious
- key: work
  kind: info
  label: What is your work here?
  text: I serve the household. The one that uses the upper rooms, not the
    administration. Laundry, meals for the staff, cleaning the passages and the
    service court. I start before the Quarter wakes and finish when it has gone to
    bed. The garret is mine to sleep in. That is the arrangement.
  hints: She said it without complaint, but without warmth either.
- key: caldwin
  kind: info
  label: Why are you so careful around the steward?
  text: He doesn't... I mean, he's proper enough. He doesn't do anything. It's just
    how he looks at you when you are somewhere you might have heard something. Like
    he's deciding something. I don't go near the administrative office any more than
    my work requires. That's all. Some things you learn not to invite.
  hints: A cold, faint light flickered at her skin for a moment and was gone before
    you could be certain.
  moodChange: cautious
- key: delivery_house
  kind: info
  label: What have you seen on the estate lane at night?
  text: You'd have to be up early to see it, or late. The estate at the far end of
    the lane gets deliveries that aren't on the household schedule. Unmarked crates.
    Before the Quarter is awake, or after it has stopped paying attention. The
    steward signs for them sometimes. I've seen him out there in the cold when it's
    still dark, with a lamp. I don't know what they are. I've learned it's better not
    to. The carters who bring them don't come from the docks warehouse. Wrong
    direction. They come from the canal side.
  hints: She is very still, watching the stair. She has told you what she knows and
    decided not to know more than that.
  moodChange: cautious
