mobid: 9374
zone: New Plymouth Noble
defaultMood: neutral
greetings:
- text: The gate is closed. If there's something I can help you with, I'm happy to.
  moods:
  - neutral
  - friendly
- text: Still closed. Still happy to talk, though.
  moods:
  - cautious
opener:
  text: The gate is closed. The Palace isn't receiving visitors. If there's
    something I can help you with before you head back down the Sentry Walk, I'm not
    going anywhere.
  hints: You could ask Guard-Captain Doryn about the Palace beyond the gate, about
    his duty here, or about Garrick One-Hand, an old comrade of his who runs the
    fighting pit in the Common Quarter.
topics:
- key: gate
  kind: info
  label: What lies beyond the Palace gate?
  text: The Palace is the bloodline's private half of the Quarter. It is not open to
    visitors. Not to most people, and not today. The gate has been closed since the
    last Council session. I don't have a date for when that changes. If you had
    business inside, you would not be asking me.
  hints: Final, and said without any edge to it.
- key: duty
  kind: info
  label: What does your duty here involve?
  text: Ceremonial, yes. The dress is formal and the post is mostly for show while
    the Palace is closed. But the gate needs someone who will hold it without
    exception, and the bloodline needs that person to look as though an exception is
    unthinkable. I am good at that. The uniform helps. I have held this post for six
    years and I have never had a bad day in it.
  hints: He said he has never had a bad day here, and meant it completely.
  moodChange: friendly
- key: garrick
  kind: info
  label: How do you know Garrick One-Hand?
  text: Garrick. You know the pit in the Common Quarter? He runs it now. Keeps the
    order, trains the fighters, makes sure nobody gets killed who didn't choose to be
    there. We served together before either of us was anything like what we are now.
    He kept me on my feet when a job did not go the way it was supposed to. I still
    owe him a drink I have not managed to deliver. The distance between the quarters
    is bigger than it used to be. If you see him down there, tell him I asked after
    him.
  hints: His whole manner changed, warmer and more direct, the formal distance gone
    for a moment.
  moodChange: friendly
