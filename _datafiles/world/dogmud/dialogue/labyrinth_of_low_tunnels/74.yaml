mobid: 74
zone: Labyrinth of Low Tunnels
defaultMood: neutral
# hello (pattern) is folded into the opener.
opener:
  text: "Surface-walker. You breathe our air. Still alive, so the scouts let you
    pass. Or you killed them. You had better have a reason."
  hints: "The shaman holds up an open palm toward you, a gesture that needs no
    translation. Choose a line below to hear about its people, about the one who
    leads them, or how to prove you mean no harm."
  variants:
  - questRequired:
    - 2-end
    text: "Surface-walker. You are remembered here. The compact holds."
    hints: "The chieftain keeps the Chieftain's Hollow, deep in the warren. From the
      Low Junction, go west, south, down, east, then south four times."
  - questRequired:
    - 2-start
    questExcluded:
    - 2-end
    carriesItem: 30036
    text: "You carry something that smells of the surface herbs. Show me."
    hints: "Choose The Warren Compact below to give the shaman the healing salve."
  - questRequired:
    - 2-start
    questExcluded:
    - 2-end
    text: "You came back empty-handed. I asked for a healing salve, the kind your
      alchemists make. Bring one and the Eldest may listen."
    hints: "Apothecary Ilsa in Stillwater sells healing salves, and alchemists can
      make them. Bring one here to the Low Junction."
topics:
# help (pattern) folded into prove_intent.
- key: prove_intent
  kind: offer
  quest: 2
  label: The Warren Compact
  playerLine: How can I prove that I mean no harm?
  text: "Words mean nothing down here. Bring something that helps. A healing salve,
    the kind your alchemists make. We know the recipe but lack the surface herbs.
    Bring one here, to me, and I will carry it to the Eldest as proof that a
    surface-walker chose to help rather than to take."
  hints: "If you accept: Apothecary Ilsa in Stillwater sells healing salves, and
    alchemists can make them."
  questExcluded:
  - 2-start
  - 2-end
  grantsQuest: 2-start
  moodChange: friendly
- key: salve_delivery
  kind: handin
  quest: 2
  label: The Warren Compact
  playerLine: I brought a healing salve for your sick.
  text: "These are good. Strong. Our sick will benefit. You have done what I asked.
    The Eldest will hear of this. Go deeper into the tunnels. The warriors will not
    stop you now."
  hints: "The chieftain keeps the Chieftain's Hollow, deep in the warren. From the
    Low Junction, go west, south, down, east, then south four times."
  questRequired:
  - 2-start
  questExcluded:
  - 2-end
  requiresItem: 30036
  grantsQuest: 2-end
  bumpsRep:
  - faction: warren
    delta: 50
  moodChange: friendly
# tunnel (pattern) folded into people; chrysalis (pattern) into
# chrysalis_talk; chieftain (pattern) into chieftain_talk; scholar (pattern)
# into scholar_topic.
- key: people
  kind: info
  label: Who are your people?
  text: "We are the Discarded. What the surface threw away. Once we were your kind,
    three generations past. The Chrysalis took us without guidance and made us what
    you see. We did not choose this. But we endure."
  hints: "Choose a line below to learn about the Chrysalis, or what drove its
    people underground."
- key: chrysalis_talk
  kind: info
  label: What did the Chrysalis do to you?
  text: "Your priests call it the Awakening. A gift. A blessing. For us it was a fever
    with no healer and no end. No one taught us. No one guided us. It twisted our
    bones, took our eyes from the light, gave us claws instead of fingers. The
    Chrysalis does not care if you understand it. It changes what it changes. And
    still we survived. That is our gift."
  heardRequired:
  - people
  moodChange: friendly
- key: history
  kind: info
  label: Why were your people driven underground?
  text: "The surface people feared what they could not guide. When the mutations came
    wrong, too fast, too visible, they drove us out. Into the dark. Three generations
    of children born without sunlight. The Eldest remembers. I do not."
  heardRequired:
  - people
- key: chieftain_talk
  kind: info
  label: Who leads your people?
  text: "The Eldest. It sits beyond the barricade, deep in the warren, and it
    remembers more than any of us. Remembers when we walked in the light. It does not
    receive surface-walkers. The last ones came with knives and specimen jars, and
    left with pieces of our dead. If you would speak with it, you must prove your
    intent is different."
  hints: "Choose a line below to hear how to prove your intent."
- key: scholar_topic
  kind: info
  label: Have other surface-walkers come here?
  text: "Your scholars. They look at us and see a problem to solve, or beetles to pin
    and label. We are not a problem. We are people. There is a woman who watches the
    cave mouth, with jars and tools. She thinks she has not been seen. She wants
    pieces of us to study. The Eldest will not tolerate it. Neither will I."
  heardRequired:
  - chieftain_talk
  moodChange: hostile
- key: totem
  kind: info
  label: Is there anything here I must not touch?
  text: "The totems on the shelves, deeper in. They remember our dead. Each one is a
    name. Take one and you take a piece of someone who lived and died in this dark.
    Touch nothing on the shelves. Those are not yours."
  moodChange: hostile
- key: trade
  kind: info
  label: Will your people trade with me?
  text: "We do not trade with the surface. Not yet. Perhaps not ever."
- key: fight
  kind: info
  label: What if I chose to fight?
  text: "You would not be the first. But you would regret it."
  moodChange: hostile
