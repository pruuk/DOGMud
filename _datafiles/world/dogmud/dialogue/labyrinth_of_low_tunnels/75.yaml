mobid: 75
zone: Labyrinth of Low Tunnels
defaultMood: neutral
# hello (pattern) is folded into the opener and its 2-end variant.
opener:
  text: "A surface-walker in the Hollow. My warriors wanted to kill you. I am still
    deciding. Leave before I decide wrong."
  hints: "The chieftain turns a polished obsidian knife in its hands and watches you.
    It has not decided whether you may stay. You could ask about its people."
  variants:
  - questRequired:
    - 2-end
    text: "The compact-bringer. The shaman says you brought medicine. That is why you
      still breathe. Sit, if you wish."
    hints: "You could ask the chieftain about the compact, its people, or what lies
      below the warren."
topics:
- key: audience
  kind: info
  label: What is the compact?
  text: "You brought medicine when you could have brought blades. That is not what we
    expected. Very well. We will not attack surface-walkers who come in peace. We
    will not raid the cave entrance. In return, the surface leaves our dead alone and
    sends no more specimen collectors. That is the compact. Break it and there will
    be no second chance."
  marked: true
  questRequired:
  - 2-end
  moodChange: friendly
# warren (pattern) folded into people; surface_2 (pattern) into surface;
# give (pattern) into needs; collapse (pattern) into collapse_talk; scholar
# (pattern) into scholar_topic.
- key: people
  kind: info
  label: Who are your people?
  text: "Sixty-three. That is what the surface left us. Sixty-three lives scratching
    at stone in the dark. Thirty who can fight. Eleven children. The rest are old or
    sick. We were hundreds once. Disease took many. The change took more. And your
    kind took the rest. That is what remains of the Discarded."
  hints: "You could ask what happened to them, or about the surface."
- key: exile_story
  kind: info
  label: What happened to your people?
  text: "Three generations past, the mutations came on too fast. Our ancestors
    changed in ways the priests could not explain or control. The surface people
    were afraid. So they drove us into the earth. Not with armies. With silence.
    Closed doors. Poisoned wells. Until the dark was the only place left."
  hints: "You could ask what the warren needs, or what lies below it."
  heardRequired:
  - people
  moodChange: friendly
- key: surface
  kind: info
  label: Do you remember the surface?
  text: "My grandmother saw sunlight. She said it made everything golden. She told my
    mother what it felt like, and my mother told me. I do not know what golden
    means. I remember light only from when I was very young and climbed too high. It
    burned. Everything about the surface burns. I know grey stone and firelight and
    the glow of fungus. That is enough. It has to be enough. Your people built a
    sanctuary up there. A place of learning and peace. We were not invited."
  heardRequired:
  - people
- key: needs
  kind: info
  label: What do your people need?
  text: "Medicine. Surface herbs that do not grow in the dark. Metal tools, because
    ours break too easily. And to be left alone by those who see us as specimens
    rather than people. That is all. We have little to trade for it. But we know
    these tunnels better than anyone alive. That knowledge has value."
  heardRequired:
  - exile_story
  moodChange: friendly
- key: collapse_talk
  kind: info
  label: What lies below the warren?
  text: "At the eastern end of the den, something pushed up from below and the
    ceiling gave way to seal it. The air from down there is cold and clean, older,
    and smells of metal. My people have been moving stones for years, one at a time.
    We will break through eventually. What we find there may change everything. Or
    nothing."
  marked: true
  heardRequired:
  - exile_story
  moodChange: friendly
- key: scholar_topic
  kind: info
  label: Have other surface-walkers come here?
  text: "Your scholars studied us before. They called it research. We called it
    theft. The last time a scholar came this close, they took bones from our burial
    shelf and called it science. Now there is a watcher near the cave mouth with her
    jars and her notes. She thinks we do not see her. We see everything in the dark.
    If she enters my tunnels, I will treat her as any other trespasser."
  heardRequired:
  - people
  moodChange: hostile
- key: trust
  kind: info
  label: Can there be peace between us?
  text: "Peace. A surface word. Down here we only have a word for not killing each
    other. It will have to do. Trust is earned in darkness, one breath at a time.
    You have taken the first breath. Do not waste it."
  moodChange: friendly
- key: knife
  kind: info
  label: Where did your obsidian knife come from?
  text: "This blade was made by my grandmother. She remembered how to work stone from
    the surface. The skill is almost lost now. The obsidian came from the deep
    places, below even us. It is the sharpest thing in the warren. And it is mine."
- key: fight
  kind: info
  label: What if I chose to fight?
  text: "These tunnels are our fortress. Your size is a weakness here, not a
    strength. Remember that."
  moodChange: hostile
