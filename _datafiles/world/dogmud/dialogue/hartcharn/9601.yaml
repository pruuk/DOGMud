mobid: 9601
zone: Hartcharn
defaultMood: neutral
opener:
  text: I am Alard Fen. I learned from the hedge-healer who worked these hills
    before me, and every dose I make is measured true. Keep your hands off the
    bench, though. Some of what sits on it bites back. What ails you, or what do
    you need?
  hints: You could ask Alard Fen about his wares or his herbs.
topics:
# stock_general folds the "buy sell shop" pattern (both responses); "ask
# specific" became the list command.
- key: stock_general
  kind: info
  label: What do you have for sale?
  text: Roots, barks, and what goes into the brewing. Chrysalis cores and catalyst
    when I have them, and the herbs the caravans bring in from the lake and the forest.
    I keep the common makings on hand. The hills grow most of what I need.
  hints: To see what Alard sells and for how much, type list.
# herbs folds herbs_note and the "herbs roots sage mint" pattern.
- key: herbs
  kind: info
  label: Where do your herbs come from?
  text: Hill sage and marsh mint mostly, gathered close by. Most of it grows within
    a morning's walk of this hut. The rest comes down with the foragers from further
    out, and I pay fair for good stock.
