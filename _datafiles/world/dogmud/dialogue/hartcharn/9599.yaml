mobid: 9599
zone: Hartcharn
defaultMood: neutral
opener:
  text: You want something kept safe, then. I am Osric Vane, and the strongbox
    and the ledger for this end of town are mine. Every coin in or out gets its
    line. What am I looking after for you?
  hints: You could ask Osric Vane about keeping your coin, keeping your goods, or
    the strongbox itself.
topics:
# storage_general and the "bank storage deposit" pattern fold into the two
# topics below, one command each.
- key: storage_general
  kind: info
  label: Can you keep my coin safe?
  text: You can leave your coin with me and take it out again whenever you like.
    Every deposit gets a line in the ledger. What comes in comes back out, same as
    it went in.
  hints: To put coin in or take it out, type bank.
- key: goods
  kind: info
  label: Will you hold my goods as well?
  text: Goods too, for as long as you need. I keep careful count, and the page with
    your name on it does not lie.
  hints: To leave goods here or collect them, type storage.
# strongbox folds strongbox_note and the "strongbox safe secure" pattern.
- key: strongbox
  kind: info
  label: Is that strongbox as safe as it looks?
  text: That box has been bolted to this floor since before I took the post, right
    through into the stone beneath. Nothing in this hut has ever walked off on its
    own, and it is not going to start now.
