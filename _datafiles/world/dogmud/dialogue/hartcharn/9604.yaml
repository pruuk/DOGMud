mobid: 9604
zone: Hartcharn
defaultMood: friendly
opener:
  text: Sit, or take a bowl with you, I don't much care which, so long as you
    eat. Gerta Crook, and that's my kettle. Nobody leaves this cookhouse hungry.
    So are you hungry, or just passing through my smoke?
  hints: Choose a line below to learn about her cooking or the cooking fire.
topics:
# stock_general folds the "buy sell shop" pattern (both responses). Her
# static shop list is ingredients, but she is a crafter (crafter: true,
# crafterrecipeids hearty-stew, herbal-tea, spiced-wine and more), and
# mobs/crafter.go puts every craft into her shop stock. So the cooked food
# is offered only "when it is ready".
- key: stock_general
  kind: info
  label: What do you have for sale?
  text: Whatever the foragers bring down, I can turn into something worth eating.
    Meat, roots, clams off the lake, salt and the like for your own pot. Hearty stew,
    herbal tea, a bit of spiced wine, when it is ready. Come hungry and leave full.
  hints: To see what Gerta sells and for how much, type list.
# fire folds fire_note and the "fire kettle cook cooking" pattern.
- key: fire
  kind: info
  label: Does that fire ever go out?
  text: That fire has not gone cold in longer than I can remember. It knows the kettle
    better than I do most days. Banked coals and a steady hand, that is most of the
    trade. Let it simmer too long and everything tastes of smoke. Not long enough and
    it tastes of nothing at all.
