mobid: 9600
zone: Hartcharn
defaultMood: friendly
opener:
  text: Mind the shuttle there, it swings wide when the loom gets going. I'm
    Bryd Harrow. My mother wove in this shed before me, and I turn the hill wool
    into cloth and thread the same as she did. Were you after either?
  hints: You could ask Bryd Harrow about her wares or the loom.
topics:
# stock_general folds the "buy sell shop" pattern (both responses). The
# cloaks, satchels and bandoliers are her crafter recipes (crafter: true);
# mobs/crafter.go puts each craft into her shop stock, hence "when the loom
# is caught up".
- key: stock_general
  kind: info
  label: What do you have for sale?
  text: Thread spools, bone needles, and beeswax for waxing the seams. Wool comes
    off the hill flocks and I turn it into whatever the town needs. Cloaks,
    satchels, the odd bandolier, when the loom is caught up. Have a look at what is
    on the shelf.
  hints: To see what Bryd sells and for how much, type list.
# loom folds loom_note and the "loom weave weaving" pattern.
- key: loom
  kind: info
  label: How old is that loom?
  text: This loom has been in the family longer than I have. Feed the wool through
    even and let the treadle do the work. Rush it and the weave comes out lumpy, same
    as bread. Treadle it wrong and it lets you know.
