mobid: 9602
zone: Hartcharn
defaultMood: neutral
opener:
  text: Stop there, please. Not on the chalk. The circle is fresh, and I would
    rather not draw it again today. I am Sefa Crane. I set shards and odd
    growths into wire and stone so they hold still and do some good. What would
    you have set or bound?
  hints: Choose a line below if you would like to hear about her wares or the
    enchanting circle.
topics:
# stock_general folds the "buy sell shop" pattern (both responses); "ask
# specific" became the list command.
- key: stock_general
  kind: info
  label: What do you have for sale?
  text: Chrysalis shards, binding paste, mutation catalyst when I have it steady,
    and a setting or two if the last batch held true. I work in chrysalis shard and
    fine wire, mostly. Careful work, slow work, but it holds when I am done.
  hints: To see what Sefa sells and for how much, type list.
# circle folds circle_note and the "circle chalk working" pattern.
- key: circle
  kind: info
  label: Why must I keep off the chalk circle?
  text: I re-chalk the circle every few days. The lines wear thin under all the working,
    same as a path through grass. Every line has to be traced true. Smudge the chalk
    and the working comes out crooked, and crooked work in this trade tends to bite.
