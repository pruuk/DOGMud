mobid: 9603
zone: Hartcharn
defaultMood: neutral
opener:
  text: Til Marsh. Mind the bench, everything on it is small and easily lost. A
    setting, or stone for me to work?
  hints: You could ask Til Marsh about her wares or her stonework.
topics:
# stock_general folds the "buy sell shop" pattern (both responses); "ask
# specific" became the list command. Rings and pendants are her crafter
# recipes (crafter: true); mobs/crafter.go puts each craft into her shop
# stock, hence "if the last batch set clean".
- key: stock_general
  kind: info
  label: What do you have for sale?
  text: Copper and silver wire, polished stone, gem dust for the finer settings,
    and a ring or pendant if the last batch set clean. I set stones the foragers
    bring down off the hills. Copper and silver mostly, gold when someone pays for
    it.
  hints: To see what Til sells and for how much, type list.
# stone folds stone_note and the "stone polish setting" pattern.
- key: stone
  kind: info
  label: Is there a trick to setting stone?
  text: Good light and a patient hand, that is the whole trick. Stream stone polishes
    up nicer than most people expect, and shows its colour if you give it the time.
    Rush a setting and the stone comes loose the first time it is knocked against
    something.
