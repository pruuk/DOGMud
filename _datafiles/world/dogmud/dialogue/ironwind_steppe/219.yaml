mobid: 219
zone: Ironwind Steppe
defaultMood: hostile
opener:
  text: "Tall-thing comes to goblin home. Brave or stupid. Same thing, usually."
  hints: "The goblin shaman draws itself up to its full, if unimpressive, height
    and fixes you with a glare. Charms rattle on its staff as it plants the butt
    on the stone floor. The other goblins watch to see what the shaman will do.
    Choose a line below to learn about its clan, or about the caves to the
    north."
topics:
# camp (pattern) folded into clan_history; cave (pattern) folded into
# cave_warning.
- key: clan_history
  kind: info
  label: Who are your people?
  text: "The Ironwind clan. Born in stone, raised in shadow. We have lived in these
    coulees since before the tall-things built their stone nest to the west. We were
    here when the wolves first came. We were here when the boars claimed the mud. We
    will be here when your city is dust. The coulees are ours. Your city is the
    intruder, not us."
  hints: "The shaman's voice takes on a rhythmic, almost chanting quality."
- key: cave_warning
  kind: info
  label: What is in the caves to the north?
  text: "The caves to the north. The Windscour, the tall-things call them. Something
    lives in the deep. Old. Patient. It was old when the world was young. Even the
    spirits warn us away, and goblins will not go there. The stone itself remembers
    what it is. You want to die, go north. You want to live, go west."
  hints: "The shaman lowers its voice, and for the first time its hostility gives
    way to genuine unease. It shudders."
  marked: true
- key: wolf
  kind: info
  label: What else should I fear out here?
  text: "The wolves know their place. The boars know theirs. Only tall-things wander
    where they should not. The caves are worse. Old things live there. Even goblins
    know to stay away."
  hints: "The shaman gestures north."
  heardRequired:
  - clan_history
- key: shaman
  kind: info
  label: What do your charms do?
  text: "The old ways are strong here. Stone speaks to those who listen. You hear
    nothing. Too much noise in tall-thing heads."
  hints: "The shaman rattles its charm-hung staff and grins."
- key: quest
  kind: info
  label: Is there anything you want from me?
  text: "You want task? Here is task. Leave goblin lands and not come back. Simple
    task for simple mind."
  hints: "The shaman cackles."
