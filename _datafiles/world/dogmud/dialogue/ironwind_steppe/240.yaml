mobid: 240
zone: Ironwind Steppe
defaultMood: neutral
opener:
  text: "Hm. A visitor. Rare enough out here. You have the look of someone who
    solves problems. I have one that needs solving."
  hints: "A weathered man in patched leather looks up from a piece of cedar he
    is carving and sets down his knife. Choose a line below to learn about
    Sylara and Rhett, the two people he worries for, or about his years on the
    steppe."
  # Quest 11 states first. A flag map cannot say "no side yet", so the
  # unflagged 11-start variant comes after the two sided ones (#611).
  variants:
  - questRequired:
    - 11-start
    questExcluded:
    - 11-end
    questFlagRequired:
      11-branch: sylara
    text: "You sided with Sylara. Good or bad, do what she asks. The steppe will
      judge the rest."
    hints: "Sylara asked for her carved wolf totem, which the wolves dragged off to
      their Kill Ground."
  - questRequired:
    - 11-start
    questExcluded:
    - 11-end
    questFlagRequired:
      11-branch: rhett
    text: "You sided with Rhett. Good or bad, do what he asks. The steppe will judge
      the rest."
    hints: "Rhett asked for windstone samples from the Rocky Shelf, just south of
      his camp."
  - questRequired:
    - 11-start
    questExcluded:
    - 11-end
    text: "Have you chosen yet? Rhett camps at the ridge approach, down the western
      slope. Sylara is at the stone circle, east of the ridge trail junction. Hear
      them out, and know that choosing one means the other will not work with you."
    hints: "From this alcove, go west, south, west, then south twice to the Ridge
      Approach, where Rhett camps. Sylara's Stone Circle is south twice more from
      there, then east. Type talk rhett."
  - questRequired:
    - 12-end
    text: "The spirits walk with you now. I can feel it. The wind moves differently
      around you. The steppe has accepted you as one of its own."
    hints: "Kael nods with quiet respect."
  - questRequired:
    - 12-start
    questExcluded:
    - 12-end
    text: "Walking the Windwarden's path, are you? Sylara does not offer the covenant
      lightly. See it through."
    hints: "Kael returns to his whittling."
  - questRequired:
    - 13-end
    text: "Rhett got his crystal. Thornwall will benefit, I expect. Whether the
      steppe forgives the cost is another question."
    hints: "Kael stares out at the grasslands."
  - questRequired:
    - 13-start
    questExcluded:
    - 13-end
    text: "Walking the scholar's path. Rhett is eager, I will give him that. Just
      make sure eagerness does not outrun wisdom."
    hints: "Kael shakes his head."
  # Old saves that finished quest 11 with no side (empty value: flag unset).
  - questRequired:
    - 11-end
    questExcluded:
    - 12-start
    - 13-start
    questFlagRequired:
      11-branch: ""
    text: "You did what you set out to do, but you never chose between them. Either
      one would still hear you out, if you went back."
    hints: "Rhett camps at the Ridge Approach, and Sylara keeps the Stone Circle
      south of it. From this alcove, go west, south, west, then south twice to the
      Ridge Approach. Type talk rhett."
  - questRequired:
    - 11-end
    text: "You made your choice. The steppe will remember it, for good or ill. That
      is all any of us can ask."
    hints: "Kael picks up his whittling and returns to work."
topics:
- key: the_problem
  kind: offer
  quest: 11
  label: The Windwarden's Dilemma
  playerLine: What is the problem you need solved?
  text: "Two people I care about are on a collision course. Windwarden Sylara guards
    the ancient stone circle east of the ridge trail. It is the spiritual heart of
    the steppe. Geomancer Rhett, a Thornwall scholar, has found veins of rare
    windstone crystal in the ridge near the circle. He says it could advance healing
    magic. Sylara says taking it would crack the circle's foundation and unravel the
    steppe's balance. Neither is wrong, and neither will back down. Someone has to go
    to them, hear them out, and choose a side. But choose carefully. Once you pick
    one, the other will not trust you."
  hints: "Kael sighs. If you accept, go to the Ridge Approach, where Rhett camps:
    from this alcove, go west, south, west, then south twice. Sylara's Stone Circle
    is south twice more from there, then east."
  questExcluded:
  - 11-start
  - 11-end
  grantsQuest: 11-start
  moodChange: friendly
- key: sylara
  kind: info
  label: Who is Sylara?
  text: "Sylara is the Windwarden. She watches over the sacred places: the stone
    circle, the old cairns, the wind-paths. She has guarded the steppe's balance
    since before I came here. You will find her at the stone circle, east of the
    ridge trail junction."
  hints: "From this alcove, go west, south, west, then south four times to the Ridge
    Trail Junction, then east into the Stone Circle."
  marked: true
- key: rhett
  kind: info
  label: Who is Rhett?
  text: "Rhett is a scholar from Thornwall. Enthusiastic young man. He has been
    studying the rock formations on the ridge and found something he says could
    change everything. I believe him, which is the problem. His camp is at the ridge
    approach, down the western slope."
  hints: "From this alcove, go west, south, west, then south twice to the Ridge
    Approach."
  marked: true
# steppe (pattern) folded into about_steppe; work (pattern) is covered by the
# the_problem pitch.
- key: about_steppe
  kind: info
  label: How long have you lived out here?
  text: "Fifteen years. Maybe more. I stopped counting when the seasons started
    blending together. That is longer than most people stay anywhere. The steppe
    strips away everything that does not matter. What is left is either strong or
    gone. It is a hard place, but an honest one. The wind does not lie and the land
    does not pretend."
  hints: "Kael gestures at the vast grasslands."
