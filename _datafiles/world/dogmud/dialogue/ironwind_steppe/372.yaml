mobid: 372
zone: Ironwind Steppe
defaultMood: neutral
opener:
  text: "Wind's light today, and nothing on the flats but grass. You want
    something from me?"
  hints: "You could ask Halix about his work, the dangers of the steppes, or where he
    stays."
topics:
- key: forage
  kind: info
  label: What do you do out here?
  text: "Walk the flats and the lower ridge for what the steppes give. Sage,
    hare-meat, the odd creek-stone with iron in it. Take it down to the Thornwall
    apothecary and the smith. Steady work. The wind makes it lonely, but the wind
    also tells you what is moving and what is not."
- key: danger
  kind: info
  label: What should I watch out for?
  text: "Wolves keep to the long flats and the southern coulees. I do not go south of
    the dry creek. Ridge-raptors I can see coming. Goblin scouts have been spotted in
    the southern ridge spurs lately. That is a problem for the garrison, not for me.
    I take what is safe and leave what is not."
  marked: true
- key: thornwall
  kind: info
  label: Where do you stay?
  text: "The temple in Thornwall is where I rest between walks. The priests there put
    up with a forager who comes in dusty. I bring the satchel into town when it is
    full and trade it to the apothecary and the smith. Steady arrangement, years
    now."
- key: caravan
  kind: info
  label: Do others forage out here?
  text: "Not on the steppe. The caravan handles the Stillwater run. I do not. Marta
    keeps her own foragers up in the Fernway. Kessa, I think her name is. I have
    never met her. The flats are wide and we keep our own ground."
- key: wind
  kind: info
  label: What do you watch for in the wind?
  text: "The wind is the steppe, in the end. It moves the grass, the dust, the smell
    of any fire for miles. After enough years out here you stop arguing with it and
    start listening to what it is carrying. Today it is carrying nothing in
    particular. Good day for the work."
