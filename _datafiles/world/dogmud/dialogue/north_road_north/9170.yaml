mobid: 9170
zone: North Road North
defaultMood: neutral
opener:
  text: I am Garrick, toller on the north line, and short a courier this week, which
    is my trouble and may be your fortune. I have a dispatch that should be in the
    capital and no honest hand to carry it.
  hints: Choose a line below if you would like to hear about the dispatch he
    needs carried, the toll, or the road north.
  # Quest 60 states (first match wins); quest_active and quest_done became
  # these variants.
  variants:
  - questRequired:
    - 60-end
    text: So it reached the capital. Word came back down the line that the gate guard
      logged it in. You carry well, traveller. The post relay could use you again.
  - questRequired:
    - 60-manifest
    questExcluded:
    - 60-end
    text: Sealed for the capital already? Then there is one leg left. Go on, and
      do not stop for me.
    hints: Carry the sealed capital packet to the East Gate guard at New Plymouth.
      Type talk guard.
  - questRequired:
    - 60-waybill
    questExcluded:
    - 60-end
    text: Pell has had my dispatch, I hear. Then it is in the relay's hands, and
      yours. Keep going north.
    hints: Carry the counter-signed manifest to Tithe-Clerk Verrold at Kingsbarrow
      Vale, north past Hartcharn and the Greywater ford. Type talk verrold.
  - questRequired:
    - 60-start
    questExcluded:
    - 60-end
    carriesItem: 40071
    text: Still carrying my dispatch? Good. Severin Pell at Hartcharn is your first
      stop, the ferry agent. He will counter-sign it and send you on. North up the
      road. You cannot miss the town.
    hints: Follow the road north from the Tollgate, past the Lake and Ladle and through
      the Empty Reach, to the South Gate of Hartcharn. From there, go north twice
      to the Market Square, then west to the Ferry and Coach Agent. Type talk pell.
  - questRequired:
    - 60-start
    questExcluded:
    - 60-end
    text: Where is my dispatch? Do not tell me the road has had it off you already.
    hints: If you lost the sealed dispatch, Garrick keeps a copy. Choose to tell
      him below.
topics:
- key: quest_start
  kind: offer
  quest: 60
  label: The Long Road
  playerLine: Do you want help carrying your dispatch north?
  text: Would you? Then here is the work. A sealed dispatch for New Plymouth, and
    the post relay too short-handed to move it. Carry it north for me. The first stage
    is Severin Pell, the ferry agent at Hartcharn. He counter-signs it and makes out
    the manifest for the next leg. Hand it to him and the road will carry it the rest
    of the way, you with it. The capital pays its couriers well.
  hints: Garrick wants his sealed dispatch carried north to Severin Pell, the ferry
    agent at Hartcharn.
  questExcluded:
  - 60-start
  - 60-end
  grantsQuest: 60-start
  givesItem: 40071
  moodChange: friendly
- key: lost_report
  kind: info
  label: I have lost your dispatch.
  text: Lost the dispatch already? The road is no place for a careless courier. Here.
    I keep a sealed copy against exactly this. Do not lose this one. Severin Pell,
    ferry agent, Hartcharn.
  hints: You have a fresh sealed dispatch. Take it to Severin Pell at Hartcharn.
    Type talk pell.
  marked: true
  questRequired:
  - 60-start
  questExcluded:
  - 60-waybill
  - 60-end
  itemExcluded: 40071
  givesItem: 40071
# road_talk folds the greeting-only "hello" pattern ("North to the capital,
# is it? Long way yet."); the "job" pattern pointed at the dispatch, which
# the opener already names (FOLDED).
- key: road_talk
  kind: info
  label: How far is it to the capital?
  text: North to the capital, is it? Long way yet. Five days of hard walking, maybe
    more if the ford at Greywater runs high. Hartcharn first, then the granary country
    at Kingsbarrow, then the works at Kilnreach, and at the end of it all the walls
    of New Plymouth. A long road. The longest in the Marches.
- key: toll
  kind: info
  label: Is there a toll to pass here?
  text: The toll is paid to the road, not to me. I only count who passes.
- key: gossip
  kind: info
  label: Any news come up the road?
  text: I keep a ledger, not an ear. Though the post is always behind.
