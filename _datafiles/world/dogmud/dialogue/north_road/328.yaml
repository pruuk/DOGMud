mobid: 328
zone: North Road
defaultMood: neutral
opener:
  text: Name is Hagen. I cut wood. That is about all there is to say. You passing
    through, or you got business on the road?
  hints: You could ask Hagen about Stillwater, the road and the ford, the riders
    on the road, or his work.
topics:
- key: stillwater
  kind: info
  label: What is Stillwater like?
  text: Stillwater is a lake town. Good fishing, decent trade, a fish market, and
    one decent inn, The Pike and Lantern. Clean enough, fair prices. I have been supplying
    them cordwood twenty years. Most of what comes down this road ends up in Stillwater
    eventually. You will find what you need there.
- key: road
  kind: info
  label: Is the ford safe to cross?
  text: The ford is safe for wagons if the water is low. It is the only tricky part
    of the north road, and only if you go at night. Wild dogs have been working the
    tree line near it lately. Not wolves, just feral dogs, but they are bold. Keep
    your pack closed and your eyes open and you will be fine.
- key: agents
  kind: info
  label: Have you seen riders on the road?
  text: Riders came through a few days back. Two of them, dark coats, good horses.
    Not rough men. Official-looking. They stopped at the crossroads and asked the
    innkeeper something, then moved on north before noon. That kind of man is always
    asking questions somewhere.
- key: work
  kind: info
  label: Who buys all this cordwood?
  text: I supply cordwood to Stillwater. The inn, the smithy, the tannery. Everyone
    burns wood and nobody wants to cut their own. The forest here is thinning, and
    I have to go further in each season. Another ten years and it will not be worth
    the trek. I do not mind the work, though. Quiet out here.
- key: quest
  kind: info
  label: Could you use a hand with anything?
  text: Nothing I need from you. I have got my own cutting to do, and I work alone.
