mobid: 280
zone: North Road
defaultMood: neutral
opener:
  text: Hey! You look like you have been on the road. Pull up a chair. Buy me a drink
    and I will tell you about the time I... sit! Drink!
  hints: You could ask Tam about the bandits who robbed his master, their leader,
    or the road north.
topics:
# bandit corrected against the map: the camp is west of the North Road,
# one room north of the village square, south of the ditch.
- key: bandit
  kind: info
  label: What happened with the bandits?
  text: They tried to toll my master's wagon! Right there on the road, bold as anything.
    Big man with a sword and a woman who looked at you wrong and your head hurt. Camp
    is just off the road, west of it, the first stretch north of the square. My master
    refused to pay, so they took a crate right off the back.
  hints: From the village square, go north once, then west into the Bandit Camp.
  marked: true
- key: soren
  kind: info
  label: What was their leader like?
  text: The leader? Did not catch his name. Talks like a soldier, carries himself
    like one too. Not your usual road trash. Made it sound like he was owed something.
    Maybe he was. What do I know.
  heardRequired:
  - bandit
- key: road
  kind: info
  label: Would you walk the road north alone?
  text: I would not go north past the ditch without company. Just saying. Some of
    us have to use that road for work.
