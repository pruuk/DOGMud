mobid: 281
zone: North Road
defaultMood: neutral
opener:
  text: Good day. I am waiting for the road to clear before heading north. These bandits
    have made a mess of my schedule.
  hints: You could ask the caravan master about the bandits, about his cargo, about
    bartering, or about the dangers of the road.
  # Quest 17 states first (first match wins). The peaceful crate ending was
  # removed by the owner (2026-10-23): the quest is fight, take the pin,
  # hand it in.
  variants:
  - questRequired:
    - 17-end
    text: The road is clear, and my wagons roll on time. You earned your pay.
  - questRequired:
    - 17-start
    questExcluded:
    - 17-end
    carriesItem: 54
    text: Is that iron I see in your hand? Show me.
    hints: The caravan master wants to see Soren's iron pin. Choose The Caravan Guard
      below to hand it over.
  - questRequired:
    - 17-start
    questExcluded:
    - 17-end
    text: Any progress on those bandits? I cannot sit here forever.
    hints: The bandits camp just west of the north road. From the village square,
      go north once, then west into the Bandit Camp. Bring back the iron pin from
      Soren's collar.
topics:
- key: hire
  kind: offer
  quest: 17
  label: The Caravan Guard
  playerLine: Do you want help with the bandits on the road?
  text: You would do that? Good. Their camp is just off the road, west of the North
    Road, one stretch north of this square. Their leader is Soren, and he wears an
    iron pin on his collar, crossed swords. Put him down and bring me that pin, and
    I will pay you well.
  hints: The caravan master wants Soren dead and his iron pin as proof. From the
    village square, go north once, then west into the Bandit Camp.
  questExcluded:
  - 17-start
  - 17-end
  grantsQuest: 17-start
  moodChange: friendly
# pinhandoff merges quest 17 trigger 0's npc_say ("Soren's pin. So he is
# done."). The Letter of Introduction (item 51) was removed by the owner.
- key: pinhandoff
  kind: handin
  quest: 17
  label: The Caravan Guard
  playerLine: Here is Soren's iron pin. The road is clear.
  text: Crossed swords. That is Soren's mark, so he is done. You did the work and
    here is your pay. The road is ours again, and my schedule is salvageable. Worth
    more than I let on.
  hints: You handed over Soren's iron pin, and the caravan master paid you.
  questRequired:
  - 17-start
  questExcluded:
  - 17-end
  requiresItem: 54
  grantsQuest: 17-end
  setsQuestFlag:
    key: 17-resolution
    value: combat
  moodChange: friendly
- key: bandits
  kind: info
  label: What did the bandits do to you?
  text: A crew operating north of the village. They hit my last wagon and took cargo.
    I cannot afford another loss. I need someone to deal with them.
  questExcluded:
  - 17-start
  - 17-end
- key: bring_proof
  kind: info
  label: How will you know the bandits are dealt with?
  text: Bring me proof. Their leader, Soren, wears an iron pin on his collar, crossed
    swords. Bring it to me and we are square.
  hints: Kill the bandit leader Soren and bring his iron pin back to the caravan master.
  marked: true
  questRequired:
  - 17-start
  questExcluded:
  - 17-end
- key: cargo_ask
  kind: info
  label: What are you carrying north?
  text: Trade goods bound for Stillwater. Nothing exotic. My brother runs a trading
    post there and he is expecting delivery.
- key: barter
  kind: info
  label: How do you get the better of a deal?
  text: Everything is a negotiation. Do not insult me with first offers. A practiced
    tongue shaves coin off every purchase. Ask any merchant who has lost to one. Haggling
    is a skill you build one deal at a time, and the best hagglers never seem to be
    haggling. That is the point.
  hints: Bartering is a skill that improves your prices. Type help bartering.
- key: wolves
  kind: info
  label: Is the road dangerous for one traveler?
  text: I have lost wagons to packs. Never one wolf, never one bandit. Always three,
    four, more. They hear each other. They come. A lone traveler is a fool, and a lone
    merchant is a dead fool. On the road you watch treelines and ridges, not just the
    path. Where one of them shows itself, the rest are moving into place.
  moodChange: friendly
