mobid: 329
zone: North Road
defaultMood: neutral
opener:
  text: Hello. Sorry, long day on the road. I am fine, just tired. Heading up to
    Stillwater, and stopping to rest my feet a while.
  hints: Choose a line below to learn about Stillwater, the dangers of the road,
    the riders asking questions, or traveling alone.
topics:
- key: stillwater
  kind: info
  label: What is waiting in Stillwater?
  text: I know Stillwater well. The Pike and Lantern is a good inn, comfortable beds,
    decent food, the kind of place where nobody bothers you. The fish market in the
    morning is worth seeing. And the lake at dusk is one of the nicer things on this
    road. I try to arrive before dark so I can sit by the water before turning in.
- key: road
  kind: info
  label: What should I watch for on this road?
  text: The wild dogs near the ford have been worse this season. I startled a pack
    of them two days ago. They backed off, but they were not shy about it. Stick to
    the center of the road near the tree line. Bandits used to work the south stretch.
    I have not seen trouble there in a while, but I am not sure why. The road is safer
    the closer you get to Stillwater.
- key: agents
  kind: info
  label: Did anyone stop you on the road?
  text: A man stopped me south of here. Dark coat, very polite. Asked if I had seen
    a young woman traveling north alone. I told him I had not seen anyone matching
    that. He thanked me and moved on. He had the air of someone used to asking questions
    without getting answers.
- key: girl
  kind: info
  label: What did he say the young woman looked like?
  text: Young, dark-haired, traveling light and keeping to herself. Said she might
    have worked odd jobs along the road. That is half the people I pass on a busy
    market day. I could not help him, and I said so.
  heardRequired:
  - agents
- key: quest
  kind: info
  label: Do you need any help?
  text: Nothing I need, thank you. I appreciate the offer, but I have everything I
    need. Just tired legs, and I want to reach Stillwater before dark.
- key: alone
  kind: info
  label: Is it wise to travel alone out here?
  text: I do not travel at night anymore. The packs learned the road before I did,
    and they hunt in numbers. If you hear one call, the others are already moving
    into place. Run on the first call, not the third. They do not teach young hunters
    this, but running is a tactic. I have walked home from fights I had no business
    surviving because I ran the right way at the right time.
  hints: To run from a fight, type flee.
  moodChange: friendly
