mobid: 282
zone: North Road
defaultMood: neutral
# The opener folds the dropped greeting pattern's first line.
opener:
  text: Afternoon. Careful where you step, the rows are tighter than they look. I
    am just the farmer. Road runs past my field. Ask what you like, and I will answer
    when I feel like it.
  hints: You could ask the farmer about the farm, the road, or the bandits.
topics:
- key: farm
  kind: info
  label: How is the harvest this year?
  text: The soil here is thin. I get two decent crops a year out of it and count
    myself lucky. Used to be three, back when my knees still cooperated. Whatever
    you are thinking about farming as a trade, do not. Find honest work. Dig ditches.
- key: road
  kind: info
  label: Do many travelers come this way?
  text: I see every caravan that passes. They do not see me much, and I am fine with
    the arrangement. There were more travelers last year. Fewer now. Ask Haral at
    the tavern. He gets the real news.
  hints: Haral's tavern is on the west side of the village square.
- key: bandit
  kind: info
  label: Do the bandits trouble you?
  text: The bandits leave me alone. Nothing to take from a farmer that is not heavy
    and does not travel well. The smart ones know that. I have been here forty years.
    I do not scare easy anymore. What there is to fear, I have already met.
