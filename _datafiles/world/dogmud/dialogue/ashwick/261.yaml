mobid: 261
zone: Ashwick
defaultMood: neutral
opener:
  text: "Hesta. I farm. That is about the full story."
  hints: "You could ask Hesta about Delia's herbs, the empty cottage at the east
    end, life in Ashwick, or the patrols that pass through."
topics:
- key: herbs_shortage
  kind: info
  label: What is wrong with Delia's herbs?
  text: "Delia has been short on stock for weeks. Used to be you could always get a
    poultice or a tea from her. Now she is rationing. Something in the forest is
    wrong, she says. Someone is taking the herbs before she can get to them."
  hints: "Delia's cottage is north of the Central Green. She might need help."
  marked: true
- key: cottage_gossip
  kind: info
  label: Who lived in the empty cottage?
  text: "The cottage at the east end has been empty for years. The family left in a
    hurry, and nobody talks about why. The for-sale sign is a formality. Nobody is
    buying. If you are curious, the door is not locked. Nobody has bothered to lock
    it."
  hints: "The empty cottage is south of the East Edge of the hamlet."
  marked: true
- key: village_life
  kind: info
  label: What is life like in Ashwick?
  text: "It is a quiet place. Good soil, reliable water from the well, close enough
    to the crossroads for trade but far enough that trouble usually passes us by. I
    have been here twenty years and I do not plan to leave."
- key: bloodline
  kind: info
  label: Who are the patrols that pass through?
  text: "We see the patrols sometimes. They come through, ask questions, leave. They
    never buy anything. The last time was a year ago, maybe longer. They were
    looking for someone. They did not find them here."
- key: gossip
  kind: info
  label: Any news around the hamlet?
  text: "News? In Ashwick? The most exciting thing this month was a fox in the
    henhouse. You want gossip, talk to anyone at the well for more than five
    minutes."
