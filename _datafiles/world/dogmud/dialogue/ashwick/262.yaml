mobid: 262
zone: Ashwick
defaultMood: hostile
opener:
  text: "You should not have come this deep into the forest. This is my camp. I am
    not looking for company."
  hints: "The forager watches you, ready to run. Choose a line below if you want
    to hear about the herbs, or why someone would camp alone this deep in the
    woods."
  variants:
  - questRequired:
    - 16-end
    text: "You came back. I did not expect that."
    hints: "Choose a line below if you would like to hear about the arrangement
      with Delia, or to request a name."
  - questRequired:
    - 16-forager
    questExcluded:
    - 16-end
    text: "Have you spoken to her yet? I will not go near the village until I know."
    hints: "Delia keeps her cottage north of Ashwick's Central Green. From the camp,
      go south three times to the East Edge, west twice to the green, then north.
      She sleeps at the cottage at night. Type talk delia."
topics:
- key: why_herbs
  kind: info
  label: Why are you taking the herbs?
  text: "I need them. To trade, in towns where nobody knows my face. It is the only
    skill I have that is worth anything without showing myself in a market. I know
    what I am taking, and I know it causes problems for the woman in the village. I
    am sorry about that, but I do not have a better option."
  hints: "Choose a line below to hear why the forager hides, or propose an
    arrangement with Delia."
  questExcluded:
  - 16-end
  moodChange: neutral
- key: hollow_reveal
  kind: info
  label: Why do you hide from the towns?
  text: "You know what I am. Or you would not be asking like that. I have no change.
    No mutation. No mark. I am what the temples call hollow and the songs call
    unblooded, and what I call a person who has to be very careful about who sees
    them."
  heardRequired:
  - why_herbs
  moodChange: neutral
- key: negotiate
  kind: info
  label: Would you work with Delia instead?
  text: "Work with the herbalist? She would have to know what I am. And she would
    have to not care. You think she would accept that? A woman in a village with a
    deacon and a ritual circle and the whole weight of what people believe about the
    unchanged? If you truly think so, then go and ask her for me. I will wait to
    hear."
  hints: "Delia keeps her cottage north of Ashwick's Central Green. From the camp, go
    south three times to the East Edge, west twice to the green, then north. She
    sleeps at the cottage at night. Type talk delia."
  marked: true
  heardRequired:
  - why_herbs
  questRequired:
  - 16-start
  questExcluded:
  - 16-forager
  - 16-end
  moodChange: neutral
- key: negotiate_done
  kind: info
  label: Delia would rather work with you.
  text: "She knows someone is out here, and she would rather work with me than chase
    me off? Then I will go to her. Carefully. Thank you."
  questRequired:
  - 16-end
  moodChange: friendly
- key: name_reveal
  kind: info
  label: What is your name?
  text: "Sev. My name is Sev. I have not said it out loud in a while."
  heardRequired:
  - hollow_reveal
  moodChange: friendly
