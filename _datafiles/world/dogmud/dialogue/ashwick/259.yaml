mobid: 259
zone: Ashwick
defaultMood: neutral
opener:
  text: "I am Delia. I tend herbs, brew remedies, and try to keep this hamlet from
    falling apart one poultice at a time. Lately the falling apart has been
    winning."
  hints: "Choose a line below to hear what has gone wrong, or whether she has
    ever trained anyone."
  # quest_active and quest_done (tree nodes) became the 16-start and 16-end
  # variants.
  variants:
  - questRequired:
    - 16-end
    text: "The stock is recovering. You solved a problem I had been struggling with
      for weeks. My worktable is yours if you want to do any herb work."
    hints: "Choose a line below to hear about using her worktable."
  - questRequired:
    - 16-forager
    questExcluded:
    - 16-end
    text: "You have the look of someone who found something out there. Well? Who is
      it?"
    hints: "Choose The Herbalist's Shortage below to tell Delia about the forager."
  - questRequired:
    - 16-start
    questExcluded:
    - 16-end
    text: "Still short on stock. Have you found anything in the forest?"
    hints: "From Delia's cottage, go south to the Central Green, east twice to the
      East Edge, then north three times along the forest path to a hidden camp.
      Whoever lives there gathers in the herb clearing just west of it in the
      mornings."
topics:
- key: quest_start
  kind: offer
  quest: 16
  label: The Herbalist's Shortage
  playerLine: What has been going wrong?
  text: "Someone has been taking the wild herbs from the forest before I can harvest
    them. Feverfew, bitter-thistle, healers-root: the things I cannot grow fast
    enough in the garden. I have been rationing stock for weeks. If you are heading
    into the forest north of the east edge, I would be grateful if you found out
    who is stripping my supply."
  hints: "If you accept, start at the East Edge of Ashwick: from here, go south to
    the Central Green, then east twice. The forest path runs north from there."
  questExcluded:
  - 16-start
  - 16-end
  grantsQuest: 16-start
  moodChange: friendly
- key: quest_complete_forager
  kind: handin
  quest: 16
  label: The Herbalist's Shortage
  playerLine: A forager in the woods would rather work with you than against you.
  text: "Another herbalist? Living in the forest? And they know feverfew from
    fireweed? If they are willing to work, and I do not have to explain the
    difference between a poultice and a soup, I will take the help. Send them to
    me."
  questRequired:
  - 16-forager
  questExcluded:
  - 16-end
  grantsQuest: 16-end
  moodChange: friendly
- key: quest_complete_herbs
  kind: handin
  quest: 16
  label: The Herbalist's Shortage
  playerLine: I found these herbs in a grove deep in the woods.
  text: "Where did you find these? This is feverfew and bitter-thistle of a quality I
    have not seen in months. Fresh and potent. The grove, you say? I should have
    looked there myself. Whatever soil grew these is touched by something deeper
    than rainfall. My stock will be full again within the week. Thank you. And
    whoever has been cutting my clearing, if you meet them, tell them I would rather
    work with them than against them."
  questRequired:
  - 16-start
  questExcluded:
  - 16-forager
  - 16-end
  requiresItem: 40040
  grantsQuest: 16-end
  moodChange: friendly
- key: worktable_access
  kind: info
  label: May I use your worktable?
  text: "You want to work with herbs? The worktable is yours to use. Mortar, pestle,
    jars, everything you need. Start by looking at what grows where and asking why.
    Every plant is an answer to a question the soil asked."
  hints: "The worktable in Delia's cottage is an alchemy bench. To see what you can
    make here, type craft list."
  questRequired:
  - 16-end
- key: apprentice_surface
  kind: info
  label: Have you ever trained anyone?
  text: "I trained someone once. She had good hands. Quick with a mortar, patient
    with a slow extraction. She left. People leave small places."
  hints: "Delia seems reluctant to say more about this."
# apprentice_deep was gated on 17-letter, a step no quest has; it now opens
# for a player carrying the letter hidden in Maren's Cottage (item 40041).
- key: apprentice_deep
  kind: info
  label: Was Maren from the empty cottage your student?
  text: "You found something in that cottage, then. Yes. Her name was Maren. She left
    because she had to. I knew what she was before she told me, and I trained her
    anyway, because good hands are good hands, and the Chrysalis has nothing to do
    with whether someone can tell comfrey from cress. She was the best student I
    have had. I hope she is somewhere safe."
  hints: "Delia clearly cared about Maren."
  marked: true
  heardRequired:
  - apprentice_surface
  carriesItem: 40041
  moodChange: friendly
- key: buy
  kind: info
  label: Do you have anything to sell?
  text: "Not now. What little I have goes to the people here who need it, and the
    sign on my door says the rest."
- key: gossip
  kind: info
  label: Have you heard any news?
  text: "I hear what the plants tell me. They have been telling me they are being
    stolen."
