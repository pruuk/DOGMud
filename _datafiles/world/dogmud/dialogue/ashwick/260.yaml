mobid: 260
zone: Ashwick
defaultMood: neutral
opener:
  text: "I am Ferris, deacon of this chapel. It is a small congregation, but a
    sincere one. What brings you to Ashwick?"
  hints: "You could ask Ferris about the Rite, about the village, or about the symbol
    above the chapel door. He seems troubled by something."
topics:
- key: rite
  kind: info
  label: What is the Rite?
  text: "The Autumnal Rite is when the community gathers to witness the year's
    Bloomings. We celebrate the changes the Chrysalis brings. It is the most
    important day in Ashwick's year. The circle south of the green is where we hold
    it."
  hints: "The Ritual Circle is south of the Central Green."
- key: trouble_surface
  kind: info
  label: Is something troubling you?
  text: "Every community has its difficulties. We manage. The herb shortage has been
    a nuisance, but Delia will sort it out. She always does."
  hints: "The deacon seems to be deflecting."
# trouble_deep and family_deep were gated on 17-letter, a step no quest has;
# they now open for a player carrying the letter hidden in Maren's Cottage
# (item 40041). family_surface is folded into village.
- key: trouble_deep
  kind: info
  label: I found a hidden letter in Maren's cottage.
  text: "A hidden letter? Then you know more than most here. There was an incident
    at the last Rite. A pouch shifted during the ceremony, and something was
    revealed that should not have been visible. I have thought about it ever since.
    About what it means when someone among us is not what the Rite assumes they are.
    And about what my duty required me to do with that knowledge."
  hints: "The deacon is wrestling with something."
  marked: true
  heardRequired:
  - trouble_surface
  carriesItem: 40041
  moodChange: friendly
- key: family_deep
  kind: info
  label: Why did Maren's family leave so suddenly?
  text: "I saw what happened at the Rite. I saw the pouch shift, and I saw what was
    underneath, or what was not underneath. I reported what doctrine required me to
    report. The family left that night. I have prayed every day since about whether
    I did the right thing."
  hints: "The deacon carries guilt about this. The family's leaving was not entirely
    their own choice."
  marked: true
  heardRequired:
  - trouble_deep
  - village
  carriesItem: 40041
  moodChange: friendly
- key: symbol
  kind: info
  label: What is the symbol above your door?
  text: "The chapel was built on older foundations. Some of what is underneath the
    current stonework is not what I was taught it should be. The symbol above the
    door, for instance. The spiral everyone sees is carved over something that was
    there first. I am not sure what the older shape means. I am not sure anyone
    alive knows."
  hints: "The chapel's stonework hides an older symbol beneath the spiral."
  marked: true
- key: village
  kind: info
  label: What is Ashwick like?
  text: "Ashwick is a quiet place. We farm, we gather, we hold the Rite. Most people
    are born here and die here and consider that a good life. Not everyone. A family
    left some time ago, and their cottage at the east end still stands empty. These
    things happen in small places. People move on. I have served this chapel for
    fifteen years, and I would not trade it for a city posting."
- key: gossip
  kind: info
  label: Have you heard any news?
  text: "I hear confessions, not rumors. Though sometimes they sound the same."
