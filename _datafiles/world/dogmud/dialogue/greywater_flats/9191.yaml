mobid: 9191
zone: Greywater Flats
defaultMood: neutral
opener:
  text: I am Tamsin Reed. I keep the ford crossing here, pole the high water and walk
    folk over the low. I would keep it better if my passengers stopped getting struck
    in the reeds waiting their turn.
  hints: Choose a line below if you would like to hear about whatever is
    striking her passengers, the ford, or the goods she keeps for travellers.
  # Quest 62 states (first match wins); quest_active and quest_done became
  # these variants. The "free crossing" promise is gone: the ford has no
  # fare to waive.
  variants:
  - questRequired:
    - 62-end
    text: The reeds have stayed quiet since you cleared them, and my passengers cross
      whole. Safe roads, traveller.
  - questRequired:
    - 62-adder
    questExcluded:
    - 62-end
    text: The reeds have gone quiet. That was you, was it not?
  - questRequired:
    - 62-start
    questExcluded:
    - 62-end
    text: Still in the reeds, is it? I would know. I would have heard the quiet.
    hints: From the Ford Approach, go south twice to Greywater Meadows, where the
      marsh adder lies hidden in the reeds.
topics:
- key: quest_start
  kind: offer
  quest: 62
  label: Adders in the Ford
  playerLine: Do you want help with whatever is striking your passengers?
  text: Would you? There is a marsh adder lairing in the reeds on the south approach,
    a big one, grey as the mud, and it has struck two of my passengers this season
    already. I cannot pole a skiff and watch the reeds both, and I will not send folk
    over the ford to be bitten. Go south and put it down for me, and I will see you
    right for it.
  hints: Tamsin wants the marsh adder in the reeds south of the ford killed.
  questExcluded:
  - 62-start
  - 62-end
  grantsQuest: 62-start
  moodChange: friendly
- key: quest_turnin
  kind: handin
  quest: 62
  label: Adders in the Ford
  playerLine: The marsh adder in the reeds is dead.
  text: Dead, is it. I have watched those reeds all morning and nothing moved in them,
    the first time in a season I have not had to. You have made my crossing a kinder
    one, traveller, and I do not forget that.
  hints: Tamsin paid you, and her crossing is safe again.
  questRequired:
  - 62-start
  - 62-adder
  questExcluded:
  - 62-end
  grantsQuest: 62-end
  moodChange: friendly
# The "job" pattern (pointing at the adder) is FOLDED into the opener hint
# and the offer. ford_talk folds the "ferry" pattern.
- key: ford_talk
  kind: info
  label: How do I cross the ford safely?
  text: The ford is a paved causeway under a hand of water, marked by the withy stakes.
    Keep to the line and it is an easy crossing. Stray off and the bottom drops away,
    and the reeds on the south bank hold worse than deep water. I pole folk across
    when the river is high and walk them over the ford when it is not. Like now.
- key: buy
  kind: info
  label: What do you keep for travellers?
  text: I keep a little for travellers waiting on the crossing. Rations, and a lantern
    or a torch for the dark. Have a look.
  hints: To see what Tamsin sells and for how much, type list.
- key: gossip
  kind: info
  label: What do travellers complain about here?
  text: I hear the whole road's complaints from the landing. Lately mine is the reeds.
