mobid: 9396
zone: South Road
defaultMood: neutral
greetings:
- text: "Going north? Going south? Doesn't matter, talk to me anyway. I've been on
    the road three days with only a mule for conversation."
  moods:
  - neutral
opener:
  text: "Name's Pell. I run a peddler's circuit, north to the kilns and the corridor
    towns, south down into Amber Valley and back, round and round till my boots wear
    through. I carry goods, and what I really trade in is news. Which do you want?"
  hints: "Choose a line below if you want to hear about his goods and his route,
    about the news he is carrying, or about the road ahead."
topics:
# buy (pattern) folded into goods: Pell has no shop, and his pack is
# promised down the valley.
- key: goods
  kind: info
  label: What do you carry in that pack?
  text: "Small and light, that's the peddler's rule. Needles, thread, pins, ribbon,
    lamp oil, a few sweets the valley children would trample me for. The big stuff I
    leave to the caravans. Every pin in this pack is already promised to someone down
    the valley, so I've nothing to sell you today. My circuit's a long loop: up to
    the Kilnreach works, across the corridor, down the South Road into the valley,
    then home before the next dry moon. I know every pothole on it by name."
- key: news
  kind: info
  label: What news are you carrying?
  text: "North's quiet. Kilns smoking, roads passable, nothing to write home about.
    The valley, though, that's where the talk is. Two farmers down there feuding over
    water like it's the last cup in the world. A cut channel, a dry field, and two
    stubborn men each sure he's the wronged one. It's the kind of quarrel that spoils
    a whole village's mood. If you're nosy, and you look nosy, no offense, the
    Golden Bough's where you'd hear it all."
  hints: "The Golden Bough is Hesper's inn in Amber Valley, south down the road."
  marked: true
  moodChange: friendly
- key: road
  kind: info
  label: What is the road ahead like?
  text: "Easy walking from here on, mostly downhill. You'll pass the Full Ladle
    and Wick's sheep if you haven't already, then the land softens and you smell the
    orchards before you see them. Safe enough by day. I never travel it after dark.
    Not for fear, just for the mule. She's dramatic about owls."
