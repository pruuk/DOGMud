mobid: 9395
zone: South Road
defaultMood: friendly
greetings:
- text: "Welcome to the Full Ladle! Roof's sound and the hearth is warm. Sit
    yourself down."
  moods:
  - friendly
opener:
  text: "Bram Ostle, at your service. I run the Full Ladle, last honest roof
    before the valley road bends down. Folk stop here to shake the dust off before
    Amber Valley, and I'm glad of the company."
  hints: "You could ask Bram about the inn, about the travellers who pass through, or
    about the valley ahead."
topics:
# ale (pattern) folded into inn.
- key: inn
  kind: info
  label: How did the inn get its name?
  text: "Named for a lake that dried up two generations back, and a ladle my
    grandmother swore was lucky. The lake's a meadow now and the ladle's still on
    the wall, so you tell me which one was the bigger fool. We're the only proper
    stop on this leg, so I get everyone, and everyone's got somewhere to be but
    here. The pot's empty till the carter comes up from the valley, but the benches
    are free to anyone who needs to rest a while."
  hints: "Sitting down to rest helps you recover faster. Type sit."
- key: travellers
  kind: info
  label: Who passes through here?
  text: "All sorts. Pilgrims for the Chrysalis Rite, merchants chasing the valley
    markets, the odd lost soul who took the wrong fork at Hartcharn. Lately a fair
    few valley folk coming up the road instead of down, and grumbling about water
    the whole way. Dry tempers, those ones. I keep their mugs full and my opinions
    to myself."
  moodChange: friendly
- key: valley
  kind: info
  label: What waits in the valley ahead?
  text: "Amber Valley's a soft landing after this hard road. Warm folk, green fields,
    and they make a festival of the Chrysalis Rite. They'll tell you a mutation's a
    gift the body gives itself. Strange to some, but I've seen worse manners in
    places that called themselves refined. Ask for the Golden Bough when you're down
    there. Hesper sets a finer table than mine, though I'll deny saying it."
  hints: "Hesper keeps the Golden Bough in Amber Valley. From here, go south twelve
    times to the Market Square, then east twice."
  moodChange: friendly
