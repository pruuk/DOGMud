mobid: 9394
zone: South Road
defaultMood: neutral
greetings:
- text: "Mind the sheep, friend. They wander into the road and won't thank you for
    it."
  moods:
  - neutral
opener:
  text: "I'm Wick. I keep sheep along this stretch of the South Road, just above where
    it drops into Amber Valley. Quiet work, but you hear things, standing on a hill
    all day."
  hints: "You could ask Wick about the valley below, about his flock, or about the
    water trouble he has heard brewing between two valley farms."
topics:
- key: valley
  kind: info
  label: What is Amber Valley like?
  text: "Amber Valley's a warm place, friendliest in the region if you ask me. They
    take the Chrysalis Rite seriously down there. They hold a body's mutations as a
    blessing, not a curse. The road's safe enough by day. Just keep walking and the
    green opens up below you."
  hints: "The South Road runs south from here, down into Amber Valley."
  moodChange: friendly
# sheep (pattern) folded into flock.
- key: flock
  kind: info
  label: How is your flock?
  text: "Forty head, give or take a lamb, and fine wool this season. The valley grass
    agrees with them. They're simple souls and I like them for it. Up before dawn,
    down after dusk, and the same hill in between. A man could do worse for a
    life."
- key: water
  kind: info
  label: What is the water trouble in the valley?
  text: "Aye, there's bad blood down valley. Two farms. Fenn on the dry east side,
    and Ayres up where the water comes in. Word is a channel got cut, and now each
    swears the other did him wrong. Old Fenn's fields are browning and he's loud
    about it. I keep my nose out of it, but you hear the grumbling come up the hill
    on a still evening. If you're heading down, Hesper at the Golden Bough will know
    more than me. Folk talk in her common room."
  hints: "Hesper keeps the Golden Bough in Amber Valley. From here, go south eleven
    times to the Market Square, then east twice."
  marked: true
  moodChange: friendly
