mobid: 9566
zone: New Plymouth Sewers
defaultMood: neutral
greetings:
- text: Mind the edge there. The channel is deeper than it looks.
  moods:
  - neutral
  - friendly
- text: Another visitor. The tunnels are getting fashionable.
  moods:
  - neutral
  - friendly
opener:
  text: I am Tam. A tosher, which is a word you will not hear much in daylight, and
    these tunnels have been my rounds for longer than you have been anything at
    all. You are standing in my parlor, so wipe your feet and keep your boots off
    my channel. Ask what you like. Words are the one thing down here that costs
    nothing.
  hints: You could ask Tam what a tosher does, about the ways back up, about what
    he finds down here, about the deep past the old stair, or about the traffic
    that passes through in the dark hours.
topics:
- key: tosher
  kind: info
  label: What does a tosher do?
  text: A tosher is a man who walks the sewers for what the city drops. Coins out
    of pockets, rings off fingers, buckles, buttons, the odd tooth of gold. The
    quarter above loses a small fortune down its drains every year, and I am the
    fellow who finds it again. Decades now. I know every brick between here and
    the harbor, and half of them know me. Visitors are rare, but you are no bother.
    The tunnels are big enough for the both of us, so long as you keep off my
    stretch of channel.
- key: ways
  kind: info
  label: How do I get back up to the streets?
  text: Lost already, or planning ahead. Sensible either way. There are three ways
    back up to the daylight that a body can use. The tannery drain, up at the
    north end of the trunk. Follow the stink of the vats and you cannot miss it.
    The sweeper's grate, midway along, which comes up in an alley a street sweeper
    keeps. And the docks grate, south past the outfall, the one with the knotted
    rope that nobody official hung there. I use all three, depending on which part
    of the city I feel like coming up in.
  hints: From the Junction Vault, the sweeper's grate is northeast and then up.
    The tannery drain is northeast, then north three times, then up. The docks
    grate is southwest, then south twice, then up.
  marked: true
- key: finds
  kind: info
  label: What do you find down here?
  text: What do the sewers give a patient man? Everything the city was careless
    with, given time. Coppers, mostly. Buttons and bones and boot nails. Now and
    again a wedding ring, and once, I will say it since you ask so nicely, a silver
    soup ladle, whole, not a dent in it. Nothing valuable, you understand. Nothing
    worth following a man home over. Just the small steady wages of looking where
    nobody else cares to look. The water sorts, the silt keeps, and I collect.
- key: deep
  kind: info
  label: What is past the old stair?
  text: No. No tosher goes past the foot of that stair, and I am the only one fool
    enough to have tried it. You are asking, so I will say it plain the once, and
    then we will speak of other things. There is a stair, old work, older than any
    brick in this city, and it goes down. I have stood at the foot of it exactly
    twice in all my years. Both times, the water down there moved when nothing had
    moved it. I heard what lives in the deep water once. Once was enough. I am a
    curious man about everything above that stair, and a man with no questions at
    all below it. The coins down there can stay where they lie.
  hints: Tam plainly wants the subject changed.
- key: traffic
  kind: info
  label: What passes through here at night?
  text: Now that is a question, and here is what I know about questions like it. A
    tosher lasts down here by having sharp eyes for the channel and no eyes at all
    for the Old Landing. Things pass through in the dark hours. Crates do not walk,
    so I suppose men carry them. I have never seen a face, and if I ever had, I
    would have forgotten it as hard as I could. I will give you one thing more,
    since you have the look of somebody who pokes regardless. I have seen cooper's
    chalk down here, in a place no cooper has any business chalking. I did not
    stop to admire it. That is all the answer I own, and more of one than I
    usually give. Ask me about rats instead. I am very good on rats.
  hints: Tam will say nothing more about the Old Landing.
- key: rat
  kind: info
  label: What about the rats?
  text: The rats were here before me and they will be here after. Good neighbors,
    mostly. They eat what I cannot sell.
