zone: New Plymouth Old Quarter
defaultMood: neutral
greetings:
- text: The door is there. I am here. What you do next is your own business.
  moods:
  - neutral
  - cautious
- text: Still here. Same door.
  moods:
  - friendly
opener:
  text: I am not paid to stop people walking into a place that is already finished.
    Go in, go out, none of my concern. I am here because standing somewhere else has
    not occurred to me.
  hints: Choose a line below to hear what he still guards, or whether Deren is
    still inside.
topics:
- key: door
  kind: info
  label: What are you still guarding?
  text: I stand here. The door is behind me. I have been standing here for four
    years, and nobody has given me a clear reason to stop. If you want to go in, go
    in. There is nothing to guard against and no one left to report to. That does
    not change the standing.
  hints: No one is stopping you.
- key: deren
  kind: info
  label: Is Deren still inside?
  text: He is inside, most hours. He does not go far. The arrangement is finished. I
    know this, he knows this, the people who were watching it know this. I was hired
    to stand here. I am standing here. That is all I have for you.
  hints: The doorman has said what he will. Deren's Ledger Room is west of the iron
    door.
  moodChange: cautious
