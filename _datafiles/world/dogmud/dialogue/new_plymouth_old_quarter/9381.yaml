greetings:
- text: Watch your step near the passage. The floor is wet and the stone shifts where
    the canal has eaten through it.
  moods:
  - neutral
  - cautious
- text: You made it down. Not many bother. What is it?
  moods:
  - friendly
opener:
  text: I work the flooded chambers below. What the water has not taken, the silt
    has covered, and what the silt has covered, I find. If you are down here with a
    question, the stone can probably answer it better than I can. But ask.
  hints: Choose a line below to hear about the gray stone, the old symbol on the
    buried lintels, or who receives her finds. She looks as if she might ask a
    stranger to witness something.
