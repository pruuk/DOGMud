mobid: 373
zone: The Fernway South
defaultMood: neutral
opener:
  text: "Quiet in the pines, which suits me. Something you need?"
  hints: "Choose a line below to hear about her work, about how she sells what
    she gathers, or about her camp."
topics:
- key: forage
  kind: info
  label: What do you gather out here?
  text: "I forage these woods for the things the towns can't grow in their own
    gardens. Moonpetal, oak-bark, pine-pitch, the odd bundle of shadowcap when the
    season turns. The caravan picks up what I gather when it passes. I don't haul it
    through the bandits myself."
- key: caravan
  kind: info
  label: How do you sell what you gather?
  text: "I walk up to the road when the satchel is heavy and wait for the wagon. Marta
    knows my face, and the load goes north or south depending on which way she's
    rolling. Both towns' apothecaries pay fair rates for what I bring, and both get
    it through the caravan. It's a fair arrangement. The caravan's escort fights the
    bandits so I don't have to, and it keeps me out of the towns and them out of my
    woods."
- key: camp
  kind: info
  label: How long have you camped here?
  text: "I built the camp out a couple of seasons back, off the bracken trail where
    the wind breaks well. The fire keeps. The pines mind their own business. It
    suits me."
- key: danger
  kind: info
  label: What in these woods should I avoid?
  text: "Hares I take. Bees too, if the comb's worth it. Boars, wolves, the badger
    sett to the south, I leave alone. I have a way home that does not depend on
    outrunning them."
  marked: true
