mobid: 9337
zone: New Plymouth Crafting
defaultMood: neutral
greetings:
- text: You get used to the smell. What do you need?
  moods:
  - neutral
- text: Fresh stock just came off the frame.
  moods:
  - friendly
opener:
  text: Hides come in raw and leave as leather, and I don't hurry the part in
    between. Everything for sale here, I made. The smell comes with the work.
    Ask me about any of it, or about the quarter, and you'll get a straight
    answer.
  hints: Choose a line below to hear about his leatherwork, about the smell and
    his neighbors on the Common side, or about life in the Crafting Quarter. To
    see what he sells, type list.
topics:
- key: work
  kind: info
  label: How do you work the hides?
  text: I take hides in from the warehouse. Dunmar's people bring them up from the
    docks on the caravan circuit, and I cure them here. Scraping, soaking,
    tanning, finishing. It's slow work and the method matters. The Chrysalis
    change toughened my skin to the point where the lye baths don't trouble me the
    way they would otherwise, which is useful. The leather I sell is as honest as
    anything in this quarter. I take some pride in that.
- key: smell
  kind: info
  label: How do your neighbors put up with the smell?
  text: The smell is the work. I'm not going to pretend otherwise. The tannery sits
    on the border between this quarter and the Common. There are tannery lanes
    running south through there, and the people on that side know what they're
    living beside. My neighbors here have made their peace with it. Nobody's moved
    away on my account. The wind helps some days.
- key: quarter
  kind: info
  label: What is life like in the Crafting Quarter?
  text: People come to this quarter to get things made, not to look at them, and
    that suits me. Honest work, mostly honest prices, and the shops all buy from
    the same docks. Nobody here minds their nose for long.
