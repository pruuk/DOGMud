mobid: 9333
zone: New Plymouth Crafting
defaultMood: neutral
greetings:
- text: What are you after? Iron, steel, or just looking at the fire?
  moods:
  - neutral
- text: Good timing. The ingots are fresh.
  moods:
  - friendly
opener:
  text: This is my forge. Steel and ironwork, mostly, and ingots and fittings if
    you'd rather work the metal yourself. I'll talk too, if you like. My sister
    says I don't do enough of it, so you'd be doing her a favour.
  hints: Choose a line below to learn about his work at the forge, his sister
    Marda in the Common Quarter, or how iron reaches the Crafting Quarter. To
    see what he sells, type list.
topics:
- key: work
  kind: info
  label: What do you make at the forge?
  text: I make what the quarter needs. Ingots, fittings, finished blades when the
    order calls for it. The raw iron comes from Dunmar's warehouse on the docks. I
    take it from there and turn it into something worth more. Most of it stays in
    the Crafting Quarter. Some of the finer blades go north to Dame Ostry's shop
    in the Merchant Quarter. She moves quality work to buyers who pay for it.
- key: sister
  kind: info
  label: Who is your sister?
  text: Marda runs the cook stall in the Common Quarter. Best stew in that half of
    the city, though she'd say the pepper is what makes it and I'd say any grain
    you can't taste isn't worth the fire. We've been having this argument since we
    were small. I go down to her stall at midday because she says I'd forget to
    eat otherwise. I say I'm working. She says those aren't different things. She
    makes good food. I don't tell her that.
  hints: Halvard seems fond of his sister despite the long argument over seasoning.
  moodChange: friendly
- key: quarter
  kind: info
  label: Where does the quarter's iron come from?
  text: The quarter runs on what comes up from the docks. Dunmar's warehouse is
    where all the raw material lives before it reaches the craftsmen here. Iron,
    cloth, leather, reagents, all of it comes through that door first. Dobb runs
    the circuit that moves it between the warehouse and the shops. It works. As
    long as the ships come in and the numbers add up, this quarter stays busy. I
    don't complain about the arrangement.
