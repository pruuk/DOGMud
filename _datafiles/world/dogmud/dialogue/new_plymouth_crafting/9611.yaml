mobid: 9611
zone: New Plymouth Crafting
defaultMood: friendly
opener:
  text: Come in out of the light. It is better for the eyes at the bench than in
    the doorway. Perla Gilt. If you are after a setting or a ring, you have come to
    the right stool.
  hints: You could ask Perla about the jeweler's bench, or about her materials. To
    see what she sells, type list.
topics:
- key: gem
  kind: info
  label: Can I work at your bench?
  text: You may, if you mind my tools. A raw gem is only worth what the setting
    lets it show. I have wire in copper, silver, and gold, and I know which pairs
    with which. Set it flush enough that a fingernail cannot catch the seam, and
    you will have done it right.
  hints: To see what you know how to make, type craft list.
- key: wares
  kind: info
  label: What materials do you sell?
  text: Wire, stone, gem dust, chain link. The ordinary trade of the bench. Black
    pearl comes in by caravan and does not sit on the shelf long once it arrives.
