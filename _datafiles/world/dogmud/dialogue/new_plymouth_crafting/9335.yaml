mobid: 9335
zone: New Plymouth Crafting
defaultMood: neutral
greetings:
- text: Mind the kiln. Can I help you?
  moods:
  - neutral
- text: You're back. The vials are ready when you need them.
  moods:
  - friendly
opener:
  text: I'm the glassblower. The kiln's mine, the work's mine, and the vials you
    see on the shelf are ready stock. If you want to talk about the glass I don't
    mind. The old days here, what this place used to be, that depends on who's
    asking.
  hints: Choose a line below to learn about her glasswork, about the old days
    when this place ran full, or about the quarter and its people. To see what
    she sells, type list.
topics:
- key: glass
  kind: info
  label: What do you make at the kiln?
  text: I blow glass. Mostly small pieces, vials and vessels for the alchemist and
    the apothecaries, some decorative work when there's a commission. The kiln
    here is good. It was part of the original works and it was built for serious
    work. I keep it running. The heat scars on my arms are older than my Chrysalis
    change. Those burns came from the years before the change made the close work
    easier. The nails are the clearest sign of it. They went clear sometime in the
    second year.
- key: old_days
  kind: info
  label: What was this place like when it ran full?
  text: The works ran kilns and cooperage together. Glass on one end, barrels on
    the other. There were more of us then. Good workers, people I knew by name and
    habit. One of them was named Asha. She was on the barrel side, mostly. I don't
    know what happened. I know that one day they were here and the next they
    weren't, and the barrel end went quiet, and nobody in this quarter asked too
    many questions about it. I stayed. I work. That's most of what I'll say about
    the old days to someone I don't know.
  hints: Edda seems guarded about the old days, but not entirely closed.
  moodChange: cautious
- key: quarter
  kind: info
  label: What is the Crafting Quarter like?
  text: It's a working quarter. Honest trade, mostly. The smell from Corwin's
    tannery carries on the wrong wind, but that's the Common border for you. The
    bookseller on the Inkwalk is worth talking to if you have questions about this
    part of the city. I keep to my kiln. It suits me.
