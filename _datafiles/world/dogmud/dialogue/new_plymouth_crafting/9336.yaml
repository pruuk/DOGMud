mobid: 9336
zone: New Plymouth Crafting
defaultMood: neutral
greetings:
- text: Looking for thread and needles, or just watching the work?
  moods:
  - neutral
- text: Good to see you again.
  moods:
  - friendly
opener:
  text: Talk while I stitch, if you don't mind. The work doesn't stop for
    anyone. I'm the tailor here. Alterations, cloth work, pieces made to order,
    for the whole quarter and for some all the way up at the Noble end of town.
  hints: You could ask Nessa about her tailoring, the Noble Quarter clients she
    makes for, or how cloth reaches her bench. To see what she sells, type list.
topics:
- key: work
  kind: info
  label: What kind of tailoring do you do?
  text: I do alterations, new garments, and custom orders. The fingers help.
    That's the Chrysalis change, if you haven't noticed. They move faster than
    they used to, more than fast enough to keep pace with demand. I can turn a
    fitting into a finished piece in a sitting that would take another tailor half
    a week. I don't advertise it. I just price what the work is worth and let the
    work speak for itself.
- key: noble
  kind: info
  label: Who do you make clothes for uptown?
  text: I supply a clothier in the Noble Quarter. Modiste Aurel handles the
    upper-end customers, the kind who won't come down to the Crafting Quarter to
    be measured. That suits me. I make the pieces. Aurel sells them to people who
    have the gold for it and the connections to need to look like they do. The
    arrangement is simple. I don't go uptown often.
- key: cloth
  kind: info
  label: Where does your cloth come from?
  text: The cloth comes from the docks warehouse. Dunmar's people handle the
    import side and Dobb runs the circuit that brings it up to the quarter shops.
    I buy what I need in bulk when the quality is right, and I pick my own when I
    can get to the shipment before the other buyers. The good bolts go fast. I
    have an arrangement with Dobb to be told when the finer cloth comes through.
