zone: New Plymouth Crafting
defaultMood: neutral
greetings:
- text: Looking for something specific, or browsing?
  moods:
  - neutral
- text: Back again? The racks are restocked.
  moods:
  - friendly
opener:
  text: Mind the bench, please. There is a batch still setting. The work here is
    careful work. I brew compounds and measure reagents exactly, mostly salves
    and curatives, now and then a special order. There is also one
    standing order I would rather not think about.
  hints: You could ask Vesna about her brewing, about Ysolde the healer who buys
    her salves, about where her reagents come from, or about the buyer she seems
    uneasy about. To see what she sells, type list.
topics:
- key: work
  kind: info
  label: What do you brew here?
  text: I process raw plant and mineral material into stable compounds. Mostly
    salves and curatives, which sell steadily, and some special preparations for
    clients with particular needs. The lab here suits work at a middling scale. I
    can keep a steady output without rushing the process, which matters more in
    this work than most people realise. A batch that was hurried is a batch I can
    tell apart from the outside before I open it.
- key: ysolde
  kind: info
  label: Who buys your salves?
  text: Ysolde works out of the Common Quarter. She takes my salves on a standing
    order. She does good work with what I give her. I know because the order stays
    steady and she doesn't come back with complaints. What she uses the more
    unusual preparations for, I don't ask. A reliable customer who pays on time
    earns some discretion.
- key: reagents
  kind: info
  label: Where do your reagents come from?
  text: Some comes from the docks warehouse, raw bulk material that Dunmar's
    people bring in by weight. The rest comes from foragers who work the marshes
    and steppe country around the city. Forager supply is less predictable but
    better for the things that matter. I work with both. The glass vials are from
    Edda at the kiln just north of here. Local, which means I can check the seals
    myself before I use them.
- key: buyer
  kind: info
  label: What is the order you'd rather not think about?
  text: There is one standing order I do not like, if I am honest with myself,
    which I try not to be. A buyer I have never met, paying through a third party,
    always exact, always early, takes a refined extract I would otherwise sell
    maybe twice a year. They take it by the case. I tell myself it goes to a
    perfumer. The base note has a copper-flower sharpness that would suit one. But
    the carter who collects it goes down toward the canal, toward the Old Quarter,
    not toward any perfumer I know of. I have learned not to follow that thought
    too far. My end of the work is honest. I need that part to be true.
  hints: Vesna seems truly unsettled, by the buyer and by where the goods go.
  moodChange: neutral
