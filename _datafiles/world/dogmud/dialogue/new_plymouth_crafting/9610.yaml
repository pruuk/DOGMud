mobid: 9610
zone: New Plymouth Crafting
defaultMood: neutral
opener:
  text: Ansel Rune. If you have Chrysalis material worth binding, this is the circle
    to bind it in. I am mid-working, so state your business and I will try not to
    lose the thread.
  hints: You could ask Ansel about the enchanting circle, or about his materials.
    To see what he sells, type list.
topics:
- key: enchant
  kind: info
  label: Can I use your enchanting circle?
  text: The circle is chalked fresh before every working. Binding a sigil takes a
    steady hand and an empty room. I keep both, and you may use the circle if you
    keep it clean. Bring a shard or a core and a setting, and see what you can
    make.
  hints: To see what you know how to make, type craft list.
- key: wares
  kind: info
  label: What materials do you sell?
  text: Shard, paste, catalyst, setting. I keep a working stock of each. Oak bark
    and black pearl come in by caravan and I do not always have them, so check
    before you plan around them.
