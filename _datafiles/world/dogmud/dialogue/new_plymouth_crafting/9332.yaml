mobid: 9332
zone: New Plymouth Crafting
defaultMood: neutral
greetings:
- text: Maps and curios. Look all you like, though the best of the maps are not
    for sale.
  moods:
  - neutral
- text: I wondered when you'd be back. Something caught your eye last time.
  moods:
  - friendly
opener:
  text: Maps, mostly, and a few curios from estates I have bought up. Old pages,
    keepsakes, the odd printed rhyme. The best maps were made by the man who kept
    the shop across the Inkwalk, and those stay off the counter.
  hints: Choose a line below on his maps, Edvar the mapmaker or this quarter's old
    questions. He keeps glancing up the lane toward the shuttered cooperage. To
    see what he sells, type list.
