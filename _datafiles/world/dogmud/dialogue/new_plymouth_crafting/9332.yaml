topics:
- key: orinhandoff
  kind: handin
  quest: 70
  label: The Pre-Founding Web
  playerLine: Gritta sent me up with a rubbing of the Buried Lintel.
  text: 'A rubbing from the lintel. I am glad of it. This confirms what Edvar''s
    oldest surveys imply: the mark is older than the city''s own account of
    itself. There are hands on the temple''s wall that count toward it too, for
    anyone who reads them. The web is wider than I let myself believe.'
  questRequired:
  - 70-witness
  questExcluded:
  - 70-end
  questFlagExcluded:
    68-allegiance: bloodline
  requiresItem: 40118
  grantsQuest: 70-end
  bumpsRep:
  - faction: cooperage_circle
    delta: 5
# After the bloodline ending Orin takes the rubbing and pays no circle reputation.
- key: orinhandoff_cold
  kind: handin
  quest: 70
  label: The Pre-Founding Web
  playerLine: Gritta sent me up with a rubbing of the Buried Lintel.
  text: Leave it on the counter. I will see it reaches people who can read it, and
    you will not be one of them. That is all we have to say to each other.
  questRequired:
  - 70-witness
  questExcluded:
  - 70-end
  questFlagRequired:
    68-allegiance: bloodline
  requiresItem: 40118
  grantsQuest: 70-end
- key: q68_start
  kind: offer
  quest: 68
  label: The Cooperage Circle
  playerLine: Is there something I can do about the cooperage?
  text: You ask the kind of question that closed the cooperage. I will not pretend
    I have no answer, but I do not hand answers to strangers. There is a shuttered
    cooper's shop north of the square, shut by order years ago. Someone still
    tends the tools inside. Go and see for yourself, and find the lad, Toby. Bring
    me proof the place is still kept, and we will talk about what you are really
    asking.
  hints: Accept, then go to the shuttered cooperage north of Craftwell Square and
    find Toby.
  questExcluded:
  - 68-start
  - 68-end
  grantsQuest: 68-start
- key: q68_choice
  kind: info
  label: I found Edvar's survey under the floor.
  text: 'So it is true. The tools are kept, the circle did not all leave, and
    Edvar''s last survey survived them. Toby''s rubbing says the same, if you still
    have it: Asha''s name, and the line she never finished. Then you know what we
    are. We keep what the founding story leaves out, and we pay for it quietly.
    Clerk Vell has filed to take the cooperage as derelict. The inspection is days
    away. You can help us hold it. Leave the survey in the circle''s keeping, and
    Toby re-cuts the guild mark on the inner door so it reads as a working shop to
    whoever inspects it. Or you can take the survey to Vell, and be paid for it.
    That is a real choice, and it is yours. Ask me what standing with us would cost
    you before you make it.'
  hints: To hear what standing with the circle means, choose his line below.
    Clerk Vell, in the Permit Office in the Merchant Quarter, takes the survey
    for the bloodline. Neither choice can be undone.
  marked: true
  questRequired:
  - 68-survey
  questExcluded:
  - 68-choice
  - 68-end
  carriesItem: 40113
  moodChange: cautious
# Quest 68's circle choice (spec R28): the warning must be heard first
# (heardRequired), and both topics hide once the choice is made (68-end).
# The bloodline side is Clerk Vell's (9349), built the same way. The hand-in comes
# first, as Vell's does, because give plays the first eligible topic wanting the
# survey: the first give warns, and the next commits.
- key: circle_choice
  kind: handin
  quest: 68
  label: The Cooperage Circle
  playerLine: I stand with the circle, for good. Keep the survey.
  text: Then it is done, and it stays done. The survey stays with the circle, and
    Toby re-cuts the mark on the inner door tonight, where an inspector looks and
    the street does not. Here, a copy of Edvar's map in my own hand. What it charts
    is below, where the canal meets the old quarter. Someone outside the circle
    should know it is real. And from today the bloodline's office knows your name.
    Walk carefully.
  hints: You gave Edvar's survey to the circle. The choice is made and cannot be
    undone, and the bloodline's office now counts you against it.
  heardRequired:
  - circle_terms
  questRequired:
  - 68-choice
  questExcluded:
  - 68-end
  requiresItem: 40113
  grantsQuest: 68-end
  setsQuestFlag:
    key: 68-allegiance
    value: circle
  bumpsRep:
  - faction: cooperage_circle
    delta: 20
  - faction: bloodline_domestic
    delta: -15
  givesGold: 60
  givesItem: 40114
- key: circle_terms
  kind: info
  label: What would standing with the circle cost me?
  text: Plainly, then. If you stand with us, Edvar's survey stays with the circle
    and you do not get it back, so you cannot sell it to Vell afterwards. Toby
    re-cuts the mark, and when the inspection finds a working shop, the office
    will ask who helped. Your name will come up. The bloodline's domestic office
    does not forget a name, and it does not forgive one. I can pay you a little,
    and give you a copy of the map. Once it is done, it cannot be undone.
  hints: Standing with the circle gives it the survey for good and sets the
    bloodline's office against you. It cannot be undone. If you are sure, choose
    The Cooperage Circle.
  marked: true
  questRequired:
  - 68-choice
  questExcluded:
  - 68-end
  carriesItem: 40113
- key: books
  kind: info
  label: What maps and curios do you sell?
  text: Maps first. A plan of the city, the North Road as far as the Empty Reach,
    the coulee for those who remember waking there, and a copy of an old coast
    chart for anyone who likes old things. Then curios. I buy collections when
    estates break up or scholars move on, and the small things go on the counter.
    A rhyme sheet, a pressed flower in a temple reading, a bookmark, a page
    someone failed to burn. The maps Edvar left behind are another matter. Those
    I do not sell. Not yet, and not to just anyone.
  hints: To see what Orin sells, type list.
- key: edvar
  kind: info
  label: Who was Edvar?
  text: Edvar was a mapmaker, the best I've come across, and I've handled a great
    many maps in this work. He had the shop across the lane and spent years
    surveying this city in more detail than the official records ever tried. His
    maps are accurate. More accurate than the ones the city keeps, which means
    they include some things the city's maps leave out. He is not here any more.
    The maps still are. I keep them because they're his best work and because I
    think they should exist somewhere. That's most of what I'll say to a stranger.
  hints: Orin is protective of Edvar's memory and guarded about what the maps show.
  moodChange: cautious
- key: old_questions
  kind: info
  label: What don't the records say about this quarter?
  text: There are things in this quarter that the official record does not fully
    account for. The cooperage went quiet some years ago and nobody in the city
    administration has pressed for an answer. Edvar wrote down what he found. I
    keep those papers. I don't show them to everyone who asks, and I don't tell
    every customer what's in them. If you're asking because you already know
    something about this quarter's history, that is a different conversation. I'm
    not sure you're ready for it.
  hints: Orin is clearly guarded, but not dismissive.
- key: scholars
  kind: info
  label: Who comes to you for old surveys?
  text: Temple scholars come by when they're researching local history. The
    quarter has an older layer than most of the city wants to admit. I'm useful
    to them because I have surveys they can't get from the official archive. I'm
    careful about what I share and with whom. Scholars with good questions get
    more from me than scholars with an institution behind them.
- key: symbol
  kind: info
  label: What marks do Edvar's oldest surveys carry?
  text: There is one mark I cannot account for. An eight-pointed figure, four
    rings and eight points, scratched into the margins of Edvar's oldest surveys,
    on charts that are older than the founding the temple teaches. There is a
    novice at the temple who sees it everywhere. He is not imagining it. The same mark, in the same place, on
    works drawn a century apart by people who never met. I do not know what it
    meant. I know it was here before the city decided what its own story was. If
    the novice sent you, tell him he is not mad. Tell him also to be careful who
    he says it to.
  hints: Orin confirms the mark is real and older than the official founding, and
    warns of the danger in saying so.
  moodChange: cautious
- key: torn_pages
  kind: info
  label: Who asks about the eastern country?
  text: Few do, and fewer know what they are asking. There is a bookseller in Greenford,
    Aldith, who hears those questions far more often than I do, and from the
    university's own people. If it is old pages you are chasing, I would go and
    see her before you waste a day on my shelves.
  hints: Aldith keeps the bookshop off the Market Square in Greenford, a long way
    east.
