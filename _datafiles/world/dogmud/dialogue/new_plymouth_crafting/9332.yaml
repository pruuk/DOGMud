greetings:
- text: Maps and curios. Look all you like, though the best of the maps are not
    for sale.
  moods:
  - neutral
- text: I wondered when you'd be back. Something caught your eye last time.
  moods:
  - friendly
opener:
  text: Maps, mostly, and a few curios from estates I have bought up. Old pages,
    keepsakes, the odd printed rhyme. The best maps were made by the man who kept
    the shop across the Inkwalk, and those stay off the counter.
  hints: Choose a line below to learn about his maps and curios, about Edvar the
    mapmaker whose shop across the lane stands shuttered, or about the old
    questions this quarter raises. He keeps glancing up the lane toward the
    shuttered cooperage as he talks. To see what he sells, type list.
  variants:
  - questRequired:
    - 70-start
    questExcluded:
    - 70-end
    carriesItem: 40118
    text: That is charcoal on your fingers. What have you brought me up from below?
    hints: Choose The Pre-Founding Web below to give Orin the lintel rubbing.
  # 68-end: Orin reacts to the choice the player made (68-allegiance), as
  # Toby does in 9338.
  - questRequired:
    - 68-end
    questFlagRequired:
      68-allegiance: bloodline
    text: Vell has Edvar's survey now. I know whose hand carried it there. We have
      nothing more to discuss about the circle.
    hints: Orin is polite, and no more than polite. His other questions are still
      open to you.
  - questRequired:
    - 68-end
    text: Toby has re-cut the mark beside the cooperage door, and it reads as a
      working shop again. The circle remembers who stood with it. Thank you.
    hints: Choose a line below if you want to hear about his maps and curios,
      about Edvar the mapmaker, or about the old questions this quarter raises.
  # 68-choice without the survey: old saves made the choice step before the
  # survey step existed and never lifted the board. Either choice needs it.
