mobid: 9399
zone: Amber Valley
defaultMood: friendly
greetings:
- text: Ah, mind the shavings, they get everywhere. Pull up that stool, the one I
    carved. Tell me it is comfortable. I need to hear it today.
  moods:
  - friendly
opener:
  text: Hello, friend. I am Corwin Ashlade, and I make the things this valley
    lives its life on. Chairs, doors, cradles. Something to sit on, a door to
    close at night, a cradle for the new ones. It is quiet, honest work, and
    most days it is enough.
  hints: Choose a line below to hear about his craft and carving, about the
    valley and the Chrysalis Rite, or about his son Davan. He speaks of the boy
    with a proud, worried warmth, the way a father does when his child has gone
    far from home.
topics:
# craft folds the "carve wood craft work chair stool" pattern: its line
# ("Every piece of wood wants to be something") opens the reply.
- key: craft
  kind: info
  label: How long have you worked wood?
  text: Forty years with my hands in wood. Every piece of it wants to be something,
    and my job is just to listen. I learned to read grain the way some men read books,
    where it will split, where it will bend, where it is hiding something beautiful
    under the bark. People think a chair is a chair. It is not. A chair is the place
    a family will sit for thirty years. You make it like you mean it, or you do not
    make it at all.
- key: davan
  kind: info
  label: Where did your son Davan go?
  text: My boy. My Davan. He grew up under this bench, you know. The first thing
    he ever made was a wonky little spoon, and I still have it. But he was never made
    for chairs and cradles, that one. There was something in him that pointed north,
    away, out past the valley walls. The Rite would say his change called him somewhere,
    and maybe it did. He went last autumn. He wrote me twice, then the letters thinned.
    I am proud of him, truly. I just find myself making two stools out of habit. Then
    I remember, and I put one back. The bench is quieter than it used to be.
  moodChange: friendly
- key: valley
  kind: info
  label: Has the Rite made letting go any easier?
  text: Amber Valley is the only home I have known, and a kind one. The Chrysalis
    Rite taught me how to let go. That is the heart of it, really. When the body changes,
    you do not fight it, you thank it. I thought I understood that. Then my own son's
    change pointed him out the door, and I learned the Rite asks more of a father than
    a few kind words at a festival. I believe it still. I just believe it with a heavier
    hand now.
