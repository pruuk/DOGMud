mobid: 9406
zone: Amber Valley
defaultMood: neutral
greetings:
- text: Aye, it reeks, I know it reeks, you need not make the face. Tanning is an
    honest stink. Come in if your nose can stand it.
  moods:
  - neutral
opener:
  text: They put Tanner's Row downwind by general agreement, and I cannot say I
    blame them. I am Hollin Tarrow, and I turn raw hide into good leather. The
    brown hands and the brave nose come with it. What brings you to the smelly
    end of town?
  hints: You could ask Hollin about his trade, about the valley, or about life here
    in Amber Valley.
topics:
# trade folds the "leather hide tan work trade" pattern ("Patience and a
# strong stomach, that's the craft").
- key: trade
  kind: info
  label: How do you turn hide into leather?
  text: Slowly, with patience and a strong stomach. Most folk do not want to know
    the half of it. There is soaking and scraping and curing that would turn your
    stomach, and weeks of it before a single belt comes out the far end. But valley
    folk need boots and harness and bindings same as anyone, so somebody has to stand
    in the stink. I have made my peace with it. The leather is good. That is what
    lasts. The smell washes off, mostly.
- key: valley
  kind: info
  label: Does the valley look down on your trade?
  text: Amber Valley has treated me fair, downwind posting and all. Folk here do not
    look down on a working trade. The Rite has something to do with that, I think.
    When a place believes every change is a gift, it gets harder to sneer at the man
    who does the dirty necessary jobs. I am part of the weave same as the potter and
    the weaver. Just the part you smell before you see.
- key: life
  kind: info
  label: Are you content with the tanner's life?
  text: A tanner's life is early mornings and aching hands, and I would not swap it.
    I have a wife who has gone nose-blind to me, bless her, a steady stream of work,
    and a stool at the Golden Bough when the day is done. The Chrysalis Rite says
    be content with what your body and your lot have made of you. I am. Smell and
    all. My own hide has gone halfway to leather, and my eyes grew a second lid against
    the fumes. There are worse things to be than the man whose leather everybody trusts.
