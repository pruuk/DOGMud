mobid: 9398
zone: Amber Valley
defaultMood: neutral
# The greeting is the dropped "hello" pattern: the old greeting promised
# goods ("If it's on a shelf I've got it"), and Goss keeps no shop.
greetings:
- text: Morning. Mind the barrels by the door. Folk always trip on the barrels by
    the door.
  moods:
  - neutral
opener:
  text: Take your time. I do. The name is Goss Harrow, and the general store is
    mine, flour to fishhooks and rope to ribbon. Whatever the valley needs and
    does not grow in a field, odds are it passed through my hands first.
  hints: Choose a line below if you would like to hear about the shop and the
    valley's goods, about supply and the road, or about life here in Amber
    Valley.
topics:
# shop folds the "buy sell shop store goods" pattern ("Have a look round"):
# Goss has no shop list, so his stock is spoken for on account instead.
- key: shop
  kind: info
  label: What do you keep on these shelves?
  text: Practical things, mostly. Valley folk grow their food and weave a good deal
    of their own cloth, so what they come to me for is the in-between. Nails, oil,
    salt, the odd luxury when the markets are good. Half the valley buys on account
    and squares up at harvest, so most of what you see is spoken for before it reaches
    the shelf. I stock what sells. A shop that tries to carry everything ends up carrying
    dust.
- key: supply
  kind: info
  label: Where do your goods come from?
  text: Most of my goods come down the South Road, or up from the lower river when
    the water is high. Pell the peddler keeps me topped up between caravans. Restless
    fellow, but reliable. Lately the deliveries have been slow and dear, what with
    everyone up the road fussing. A store lives or dies by its supply line, so I watch
    the road like a farmer watches the sky.
- key: life
  kind: info
  label: Is the valley good for a shopkeeper?
  text: It is a good place to keep a shop. Folk are honest, they pay their tabs,
    and the Chrysalis Rite keeps everybody in a generous mood. You would be surprised
    how a festival loosens a purse. I am not a religious man, but I sell twice as
    much candle and ribbon in Rite season, so I will not say a word against it.
  moodChange: friendly
