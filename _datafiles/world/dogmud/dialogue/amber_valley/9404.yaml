mobid: 9404
zone: Amber Valley
defaultMood: friendly
# Text matched to her description (living blossoms along the collarbone,
# a market stall): the old lines spoke of a third arm.
greetings:
- text: Morning! Mind the puddle. And yes, before you ask, the flowers are real,
    and yes, they DO smell that sweet. Sun's out, so they're showing off.
  moods:
  - friendly
opener:
  text: Sela Brim, valley born and valley proud. I am just a market soul. I keep
    my stall, I know everyone, and I will talk the ear clean off a statue if you let
    me. What has caught your eye?
  hints: Choose a line below to learn about the market and valley life, about
    the blossoms she wears so proudly, or just for the latest valley gossip.
topics:
- key: market
  kind: info
  label: What is the market like?
  text: The market is the best part of any day. Amber honey, woven cloth, fruit so
    ripe it is nearly rude, and the people, the people are the real goods. Valley
    life is slow and sweet and everybody is in everybody's business, which I personally
    consider a feature. I could not live anywhere they did not know my name by breakfast.
- key: mutation
  kind: info
  label: Are those real flowers on your shoulders?
  text: Real as the plums! They came in two springs ago and I have never looked
    back. Out in the wide world they would have me hiding them under a high collar,
    poor things. Here the valley threw me a feast and I cried like a fool and ate too
    much honey-cake. The Chrysalis Rite has it right. Your body knows what it is doing
    better than your worries do. I wear my gift in the open, and I pity anyone taught
    to be ashamed of theirs.
  moodChange: friendly
- key: gossip
  kind: info
  label: What is the latest gossip?
  text: Oh, where to start. The Tarrow boy is sweet on the miller's daughter, the
    Deacon has gone all broody over the Bloomings, and, well, you will have heard
    the big one. Fenn and Ayres, the two farmers, snapping at each other over the
    water like a pair of wet cats. The whole valley is tired of it. It has put a grey
    cloud over a green place, and that is not how we do things here. Somebody ought
    to knock their heads together, gently. Hesper at the Golden Bough is about ready
    to.
  hints: The Golden Bough is east of the Market Square, through the East Market.
# buy folds the "market buy stall goods" pattern: Sela keeps no shop list,
# so it describes what the stalls carry (her description) and sells nothing.
- key: buy
  kind: info
  label: What do the stalls sell?
  text: Whatever the season hands us. Plums and greens now, walnuts and pressed cider
    come autumn. It is valley folk selling to valley folk, mostly, and half of it is
    gone by noon. Tell them Sela sent you. It will not get you a discount, but it is
    nice to be mentioned.
