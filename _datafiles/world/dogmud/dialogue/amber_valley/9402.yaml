mobid: 9402
zone: Amber Valley
defaultMood: friendly
greetings:
- text: Peace of the Chrysalis on you, traveller. You have come at a blessed season.
    The Bloomings are upon us. Though they... they come strangely this year.
  moods:
  - friendly
opener:
  text: I am Deacon Pember, and I travel the valleys keeping the Chrysalis Rite. I
    bless the Bloomings, those moments when a body changes and a soul is asked to
    accept its gift. It is holy work, and I have done it thirty years. I confess this
    year it has begun to trouble me, though I would be hard pressed to tell you exactly
    why.
  hints: You could ask the Deacon about the Chrysalis Rite and how the valley reads
    mutation as a gift, about where the Bloomings are kept, or about what has been
    troubling him this season. He seems to carry a worry he cannot quite put into
    words.
topics:
# rite folds the "rite chrysalis blooming mutation" pattern: its line ("The
# body gives itself a gift") closes the reply.
- key: rite
  kind: info
  label: What does the Chrysalis Rite teach?
  text: 'The Rite teaches a simple, beautiful thing: that a mutation is not a curse
    to be hidden, nor an accident to be mourned, but a gift the body bestows upon
    itself. When the change comes, the Blooming, we call it, the valley gathers, and
    we ask the soul to receive what the flesh has offered. Out in the wider world they
    flinch from such changes. Here we kneel and give thanks. The body gives itself
    a gift, and we gather to honour it. That is the whole of the Rite.'
# grove is corrected against the map: the Rite is kept here at the pavilion
# (6060); the Chrysalis Grove (6087) lies east of the dryside fields.
- key: grove
  kind: info
  label: Where are the Bloomings kept?
  text: Here, at the pavilion, where the valley gathers to watch its young come through,
    and their names go into the pillars after. The old grove is older still, a ring
    of amber trees past the dryside fields, where the markers of the Bloomed stand.
    There is a girl in her change now, young Linnet, over by the Old Well Yard. Frightened,
    brave, the way they always are. It steadies a soul to stand where so many have
    changed before.
  hints: From the pavilion, the Chrysalis Grove is south six times to the Dryside
    Track, then east three times. Linnet sits in the Old Well Yard, north twice to
    the Market Square, east, then south twice.
  marked: true
- key: worry
  kind: info
  label: What is troubling you this season?
  text: I will speak it aloud and trust your discretion. The Bloomings this year are...
    wrong. Not in their nature, a gift is a gift, but in their manner. They come faster
    than they should. Stronger. Stranger. A change that ought to take a slow season
    unfolds in days, and more dramatic than anything in my thirty years of keeping
    the Rite. Even my own eyes, shut since boyhood, have begun to stir. The faithful
    say it is an especially blessed season, and perhaps it is. But a shepherd knows
    the difference between a fat lamb and a swollen one, and something in me whispers
    this is the second kind. So I bless, and I watch, and I worry.
  marked: true
  moodChange: friendly
