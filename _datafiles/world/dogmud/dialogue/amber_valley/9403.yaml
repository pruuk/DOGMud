mobid: 9403
zone: Amber Valley
defaultMood: neutral
# Text matched to her description (chitin plates along the spine): the old
# lines spoke of hands and eyes.
greetings:
- text: Oh, hello. Sorry, I am a bit... my back keeps doing things on its own today.
    It is the change. They tell me it is a gift.
  moods:
  - neutral
opener:
  text: I am Linnet. I am in my Blooming. That is what they call it when the change
    comes on you. It is... a lot. The whole valley says it is the best thing that
    will ever happen to me, and I am trying to believe them, I really am.
  hints: You could ask Linnet about her change, about the valley she has grown up
    in, or about what it is like to face a Blooming here.
topics:
# change folds the "change blooming mutation rite" pattern ("Bit much,
# honestly. But it's a gift. Everyone says.").
- key: change
  kind: info
  label: What is happening to your back?
  text: It started a fortnight ago. Plates, along my spine and over my shoulders,
    coming up one at a time. Soft and wet at first, then hard, like beetle-shell.
    There is a warmth under my skin all the time now. Deacon Pember says it is coming
    on fast, faster than usual, and the way he says it makes me feel both special
    and a little bit scared. Mostly I lie awake feeling my own bones decide things
    without asking me. Bit much, honestly. But it is a gift. Everyone says.
- key: valley
  kind: info
  label: Is the valley kind to you about it?
  text: Amber Valley is the only place I know. It is warm and everybody knows everybody,
    which is lovely when you scrape your knee and awful when you would like one single
    secret. They are kind about the Bloomings here, not like the stories from outside
    where folk get driven off for changing. Here you get a feast. I would just like
    the feast to feel as nice as it looks, from the inside.
- key: growing
  kind: info
  label: Do the older folk remember how it feels?
  text: Everyone older than me has already Bloomed, so they all talk like they remember
    being where I am. But I do not think they do, not really. They remember the festival
    and forget the night before. I used to watch the Rite as a little girl and think
    it looked like magic. Now it is my turn and it feels less like magic and more like
    a door I did not choose to walk through, opening anyway. I am being brave about
    it. That is a thing you learn to do here. Be brave about the gift.
