mobid: 251
zone: Marches Spur Road
defaultMood: neutral
opener:
  text: Sit down before the road takes any more out of you. It has been a busy
    season, and you look tired from it. I am Thessa, and the Broken Yoke is
    mine. The food is hot, the ale is cold, and the fire never goes out. Tell me
    how you like things, and I will remember.
  hints: You could ask Thessa about the road, the inn, or the news.
topics:
- key: road_trouble
  kind: info
  label: Is there trouble on the road north?
  text: The road north has been dicey. That peddler camped up past the shrine has
    been waiting on a freight shipment for days. Something is holding things up between
    here and the crossroads. Bandits, most likely. They have been working the stretch
    near that old barn.
  hints: Peddler Malk's camp is north up the spur road, just west of the Waypoint
    Shrine.
  marked: true
- key: thornwall
  kind: info
  label: How far is Thornwall from here?
  text: Thornwall is a day's walk northeast through the crossing. Proper walls, proper
    guard, proper market. It is where most of the traffic through here is heading,
    or coming from.
- key: crossroads
  kind: info
  label: What is south of here?
  text: The crossroads is just south of here. Three roads meet. North to Thornwall,
    south toward Amber Valley and the Confluence, southwest toward Stillwater and
    the coast. Signposts are clear enough if you can read.
- key: inn_history
  kind: info
  label: Why is it called the Broken Yoke?
  text: Named for the day my grandmother decided she was done being a farm wife and
    opened a roadhouse instead. Split the yoke clean in half and hung it on the sign.
    We have been here three generations now.
- key: gossip
  kind: info
  label: What news have you heard?
  text: News comes through here whether I want it or not. It is part of the trade.
    People talk. I listen.
- key: buy
  kind: info
  label: What do you serve here?
  text: Hot food, cold ale, and a spot by the fire. Sit as long as you like.
