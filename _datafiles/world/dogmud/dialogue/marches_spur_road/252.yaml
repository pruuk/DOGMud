mobid: 252
zone: Marches Spur Road
defaultMood: neutral
opener:
  text: Just passing through. Heading north to the crossing and then east to Thornwall,
    if the road holds.
  hints: You could ask Bren about the road behind him or what lies south.
topics:
- key: stillwater
  kind: info
  label: What lies south of the crossroads?
  text: Stillwater is a day or two south of the crossroads. Lake town, fishing mostly.
    Quiet place. Good people, the kind who do not ask too many questions about where
    you have been.
- key: road_conditions
  kind: info
  label: How was the road on your way here?
  text: The road north from the crossroads has had some trouble. Bandits near an old
    barn, they say. I came through at dawn and did not see anyone, but I walk fast
    and I do not carry much worth stealing.
- key: bloodline_talk
  kind: info
  label: Did you see anything odd on the way?
  text: Saw some people asking questions at the crossroads. The kind who do not buy
    anything and do not smile and have very clean boots for people who claim to be
    traveling. I did not linger.
- key: gossip
  kind: info
  label: Any news from the road?
  text: I keep my ears open. The road teaches you that. Talk to the innkeeper. She
    collects news the way some people collect coins.
  hints: The Broken Yoke Inn is south along the road.
