mobid: 250
zone: Marches Spur Road
defaultMood: neutral
# R15: a player who found the crate before taking the quest sees the offer,
# accepts it, then hands in from the same menu. A give before accepting hands
# the crate back (R8). The opener variants notice the crate either way.
opener:
  text: You look like you have been walking a while. I am Malk, road peddler, when
    the road cooperates. It has not been cooperating.
  hints: Choose a line below if you want to hear about his missing freight, his
    goods, or the road.
  variants:
  - carriesItem: 40039
    questExcluded:
    - 15-start
    text: Is that... iron straps, my stencil on the side. That is my freight! Where
      did you find it?
    hints: Choose The Peddler's Overdue Freight below and accept it. Then choose it
      again to hand over the crate.
  - carriesItem: 40039
    questRequired:
    - 15-start
    questExcluded:
    - 15-end
    text: That crate. Iron straps, my stencil. That is my freight!
    hints: Choose The Peddler's Overdue Freight below to hand over the crate.
  # 15-return is granted when the crate is picked up; it drives hints only.
  # The hand-in gates on 15-start plus the crate (batch 2 review B1).
  - questRequired:
    - 15-return
    questExcluded:
    - 15-end
    text: You found my crate? Then where is it? If it is lost, the bandits may have
      dragged it back to that barn.
    hints: From this camp, go east to the Waypoint Shrine, then south three times,
      then west into the ruined barn. Type get freight crate from crates.
  - questRequired:
    - 15-start
    questExcluded:
    - 15-end
    text: Any sign of my freight? Sturdy wooden crate, iron straps, my stencil on the
      side.
    hints: From this camp, go east to the Waypoint Shrine, then south three times,
      then west into the ruined barn.
  - questRequired:
    - 15-end
    text: Good to see you again. The cart is full, thanks to you. Take a look at what
      I have.
    hints: To see what Malk sells, type list.
topics:
- key: quest_start
  kind: offer
  quest: 15
  label: The Peddler's Overdue Freight
  playerLine: Is the road giving you trouble? Can I help?
  text: I have been camped here for a week waiting on a freight shipment that should
    have come up from the crossroads. Paid in advance, which I do not usually do,
    but the supplier was reliable. Was. The crate never arrived. I cannot go check
    myself. One man with a cart on a road with bandits is an invitation. If you are
    heading south, keep an eye out. Sturdy wooden crate, iron straps, my stencil on
    the side.
  hints: The bandits have been seen near a ruined barn, west of the road past the
    farmland.
  questExcluded:
  - 15-start
  - 15-end
  grantsQuest: 15-start
  moodChange: friendly
# Hand-in. The quest 15 give trigger's npc_say lines are folded in; the
# "road prices" promise is dropped, since no price changes (quest 15 pays gold).
- key: quest_complete_dialogue
  kind: handin
  quest: 15
  label: The Peddler's Overdue Freight
  playerLine: I found your freight crate at the ruined barn.
  text: That is the one! The iron straps, the stencil marks. That is my consignment.
    Let me check the contents... rope, oil, provisions, all accounted for, near enough.
    Some of it has been opened, but nothing critical is missing. I owe you for this.
  questRequired:
  - 15-start
  questExcluded:
  - 15-end
  requiresItem: 40039
  grantsQuest: 15-end
  moodChange: friendly
# The lost_item node (the same gates, the same barn) is folded in here.
- key: quest_active
  kind: info
  label: Where do you think your freight went?
  text: The bandits have been working the road near an old barn, west of the farmland
    stretch. If no one has moved my crate, that is where it will be. Bring it back
    here. Sturdy wood, iron straps, my stencil.
  hints: From this camp, go east to the Waypoint Shrine, then south three times,
    then west into the ruined barn.
  marked: true
  questRequired:
  - 15-start
  questExcluded:
  - 15-end
- key: quest_done
  kind: info
  label: How is business now?
  text: Better, since you brought my shipment back. I am in your debt. Any time you
    need supplies, come to me first.
  questRequired:
  - 15-end
- key: road_talk
  kind: info
  label: Is the road safe to travel?
  text: The road south to the crossroads has been rough lately. Bandits working the
    stretch between here and the farmland. I would not travel it alone if I had the
    choice, which I do not, which is why I am still sitting here.
- key: new_plymouth
  kind: info
  label: Where is the real money on these roads?
  text: New Plymouth. The docks district, everything flows through there. I have
    made the run twice. It is a week's travel from the crossroads if the weather holds.
    Worth it, if you have goods to move.
- key: bloodline_talk
  kind: info
  label: Have you seen anything strange on the road?
  text: More patrols on the north road than I have seen in years. The kind that ask
    questions without buying anything. Looking for someone, if you believe the talk.
    I do not ask. Asking gets you remembered.
- key: crossroads_talk
  kind: info
  label: Where does the road south lead?
  text: The crossroads south of here connects to half the Marches. Amber Valley, the
    Confluence, all the river trade. Stillwater is a day or two further. Good people
    there, mostly.
- key: gossip
  kind: info
  label: Have you heard any news?
  text: I hear things on the road. Mostly complaints about the road. Talk to Thessa
    at the inn if you want the real news. She hears everything.
  hints: The Broken Yoke Inn is south along the spur road.
# Malk's shop (mobs/marches_spur_road/250-peddler_malk.yaml) sells iron
# lockpicks, a basic disarm kit and torches.
- key: buy
  kind: info
  label: What do you have for sale?
  text: Torches for the dark, lockpicks, and a kit for springing traps. Road goods.
    Take a look.
  hints: To see what Malk sells, type list.
