mobid: 254
zone: Marches Spur Road
defaultMood: hostile
# R19: nothing in conversation stops his ambush (his tree attacks a player
# who lingers). The toll, persuasion and refusal topics were dropped: no toll
# was ever charged and no persuasion check exists, so they promised a way out
# that the game does not have. His dialogue stays info only.
opener:
  text: You have walked into the wrong barn. You have got a moment before this gets
    ugly.
  hints: He means to fight. To size him up first, type consider leader.
topics:
- key: negotiate
  kind: info
  label: What do you want from me?
  text: Nobody patrols this stretch. We do. That makes this road ours, and whatever
    comes down it is ours too. You came for something in this barn? Then you will
    have to take it.
  hints: The freight crate sits in the crates against the back wall. Type get freight
    crate from crates.
