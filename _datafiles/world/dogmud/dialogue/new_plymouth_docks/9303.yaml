mobid: 9303
zone: New Plymouth Docks
defaultMood: neutral
greetings:
- text: State what you need. I have four things on my mind and you are now the fifth.
  moods:
  - neutral
opener:
  text: If you need something from the warehouse, the stock is on the list. If you
    want to talk about the warehouse, I have time for two questions.
  hints: You could ask Dunmar about his stock, the caravan runner who carries it
    into the city, or how the supply runs. To see what he sells, type list.
topics:
- key: stock
  kind: info
  label: What does the warehouse carry?
  text: What I carry depends on what came in and what Dobb has not moved out yet.
    Staples run reliably. Salt, rations, flour, water flasks, candles, knives. The
    specialty cargo varies by season and by what the captains decide is worth the
    freight weight. If the chalkboard says it's here, it is. If it doesn't, it
    isn't. I don't guess at what may arrive.
- key: caravan
  kind: info
  label: Who carries your stock into the city?
  text: Dobb runs the Long Market circuit. He loads here at the depot and walks it
    east through the Crafting Quarter, through the central market, then to the
    Temple. On the return he branches south into the Common Quarter. That leg has
    the most stops. Every vendor in this city who buys from this warehouse does it
    through Dobb. He knows what each of them is short of before they tell me. I
    find that useful.
- key: system
  kind: info
  label: How do goods get from the ships to the shops?
  text: Every piece of dry goods in this city that came off a ship passed through
    that door first. The iron on Halvard's forge, the cloth on the tailor's bench,
    the salt on every cookshop table from the docks to the Noble Quarter. It
    arrives here, I count it, Dobb moves it, the city uses it. That is the supply
    chain. I have no opinion about it beyond whether the numbers agree.
