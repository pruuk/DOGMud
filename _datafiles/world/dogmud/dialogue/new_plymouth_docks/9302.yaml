mobid: 9302
zone: New Plymouth Docks
defaultMood: neutral
greetings:
- text: If you have a manifest, put it on the counter.
  moods:
  - neutral
- text: Back again. I assume there's a reason.
  moods:
  - cautious
opener:
  text: The counter is open. What does this office need to do for you?
  hints: Choose a line below if you want to hear about the ship manifests, the
    harbor fees, or where the fees go.
topics:
- key: manifests
  kind: info
  label: What do you do with the ship manifests?
  text: Every hull that comes into this port files a manifest at that counter
    before it unloads. Declared cargo, flag, weight class, tariff status. I review
    them all. The ones that agree with what came off the barge go in the ledger.
    The ones that don't, we discuss. Most of the time it is honest error. Some of
    the time it isn't. That is what this office is for.
- key: fees
  kind: info
  label: How are the harbor fees worked out?
  text: The fee schedule is posted on the column to your right. It has been the
    same schedule for eleven years. Hull class, cargo type, declared weight. The
    calculation is mechanical. If you are asking because you plan to dispute a
    fee, that conversation happens after the ship berths, not before.
- key: bloodline
  kind: info
  label: Where do the fees go?
  text: The fees are split per the licensing agreement. The harbor authority
    receives its operating share. That funds this office, the quay upkeep, the
    clerks. The remainder goes to the bloodline's domestic office account. I file
    the quarterly split. It has been reviewed once in eleven years and the review
    found no errors. I intend to keep it that way.
  hints: Greer has said what he will about the licensing arrangement.
  moodChange: cautious
