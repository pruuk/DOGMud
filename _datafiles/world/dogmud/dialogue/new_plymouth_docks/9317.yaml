opener:
  text: It's... the ceiling's low. You can't stand up straight. Past the canal.
    Past it.
  hints: The wanderer's attention drifts. You might ask about the room they keep
    coming back to, or about the Bloom.
topics:
- key: room
  kind: info
  label: What room do you keep going back to?
  text: Down past where the water bends. There is a smell first. You follow the
    smell. Stone floor. A drain in it. The ceiling comes down and you have to fold
    yourself to get inside. I haven't gone back. I keep meaning not to go back.
  hints: The wanderer gives a broken direction toward somewhere along the canal,
    below the city.
- key: bloom
  kind: info
  label: Is it the Bloom that has hold of you?
  text: I'm... managing it differently now. Found something that helps with the
    withdrawal, and the thing that helps is the problem now. Don't ask me about
    the arm.
  hints: The wanderer deflects. They are not eager to talk about the Bloom or what
    it has done to them.
  moodChange: cautious
