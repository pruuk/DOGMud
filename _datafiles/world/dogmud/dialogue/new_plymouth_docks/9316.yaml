mobid: 9316
zone: New Plymouth Docks
defaultMood: neutral
greetings:
- text: Constable's post. If you have something to report, I'm listening. If
    you're here about the Teo matter, I've heard the first account.
  moods:
  - neutral
opener:
  text: I've got an accusation I'm working on with half the facts, and a foreman
    who gave me a very clean statement. If you know something that matters, I'll
    hear it.
  hints: You could ask the constable about the charge against Teo, the trouble on
    the docks, or what evidence would change the case.
  variants:
  - questRequired:
    - 63-start
    questExcluded:
    - 63-end
    carriesItem: 40100
    text: That book under your arm. Is that from the foreman's office?
    hints: Choose Dock Rat below to give the constable the tally-book.
  - questRequired:
    - 67-start
    questExcluded:
    - 67-end
    carriesItem: 40111
    text: That's a case file you're holding. Who put it together?
    hints: Choose The Bloom Trail below to give the constable the case file.
  - questRequired:
    - 67-witness
    questExcluded:
    - 67-end
    text: Word is you've a case against the Bloom trade. Then where is it? I
      can't move on talk. I need it on paper.
    hints: If you lost the case file, Quill can write it again. From the Dock
      Constable's Post, go west to the Outer Dock Lane, south five times to the
      Long Quay, then west twice to the Underdock Stair. Go down into the
      Underdocks, west twice to Lower Lintel Street, then north to Quill's
      Lamp-Walk. He sleeps through the day and is up from late afternoon until
      dawn, in his hovel just north or out on the Lamp-Walk. Type talk quill.
  - questRequired:
    - 63-end
    text: Hewd is answering for his two columns now, and Teo's name is off the
      board. That's the docks put a little straighter.
    hints: You could ask the constable what happens to Hewd now, or about the
      trouble on the docks.
topics:
- key: tallyhandoff
  kind: handin
  quest: 63
  label: Dock Rat
  playerLine: Hewd's tally-book shows two sets of numbers.
  text: Let me see that. Two columns. Manifest on the left, the true count on the
    right. That is the foreman's hand. The shortage was never Teo's. I'll have
    Hewd in by the next bell, and the boy's name off the board.
  questRequired:
  - 63-start
  questExcluded:
  - 63-end
  requiresItem: 40100
  grantsQuest: 63-end
- key: casefilehandoff
  kind: handin
  quest: 67
  label: The Bloom Trail
  playerLine: Here is the case against the Bloom trade.
  text: Let me read this properly. The wrapper. The address. A delivery account
    and the lamplighter's word. This is enough to move on the trade. The supply
    stops. Deren is another matter. The bloodline office holds a hand over him I
    cannot reach around. I can break up what he runs. The man himself stays out of
    my reach. You understand what I'm telling you.
  questRequired:
  - 67-start
  questExcluded:
  - 67-end
  requiresItem: 40111
  grantsQuest: 67-end
  bumpsRep:
  - faction: bloom_trade
    delta: -15
- key: teo
  kind: info
  label: What is the charge against Teo?
  text: The charge is on the board. A shortage on a manifest shift, Teo's name at
    the bottom of the entry. He's told me the count was already short before his
    shift started and that he flagged it to his foreman. The foreman's statement
    doesn't back that. I've got two accounts and one set of numbers, and the
    numbers sit somewhere between them.
  questExcluded:
  - 63-end
- key: hewd
  kind: info
  label: What happens to Hewd now?
  text: He answers for the difference between his two columns. Teo is back on the
    manifest, and I'm reading this season's other short counts again with the
    foreman's hand in mind. I expect I'll find it on more than one page.
  questRequired:
  - 63-end
- key: docks
  kind: info
  label: Has there been other trouble on the docks?
  text: It's been a rough season. Cargo light on arrival, accounts that don't
    reconcile at the quarter mark, enough small complaints that I've been writing
    reports upstream and getting polite answers in return. This Teo case is the
    first formal accusation, but it didn't come from nowhere. Something has been
    wrong with the count for longer than Teo's been on the manifest.
- key: evidence
  kind: info
  label: What would it take to clear Teo?
  text: If the manifest entry was corrected after the fact, I want the first entry
    compared against the correction. Handwriting, ink, anything that puts a
    different hand on that page. A witness who heard Teo flag the short count at
    the time, I can work with that. What I cannot work with is a claim without
    something to point at. Bring me something real and I will look at it.
  hints: The constable is willing to act if solid evidence reaches him.
  marked: true
  questExcluded:
  - 63-end
