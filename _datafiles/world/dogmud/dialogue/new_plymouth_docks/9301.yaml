mobid: 9301
zone: New Plymouth Docks
defaultMood: neutral
greetings:
- text: What'll it be?
  moods:
  - neutral
- text: Come in. Sit or stand, I don't much care which.
  moods:
  - neutral
- text: I had a feeling you'd come by. Same as before, or is it a different sort
    of night?
  moods:
  - friendly
opener:
  text: I can pour you something, or I can talk if the hour's slow. Most things
    worth knowing about this end of the docks I've heard from behind this counter
    one time or another.
  hints: You could ask Bressa about the dock gossip, the waterfront after dark, or
    who runs a tab. To see what she pours, type list.
topics:
- key: gossip
  kind: info
  label: What have you heard across the bar?
  text: People talk in here and forget I'm four feet away. That's been true every
    night for twelve years and I see no sign of it changing. The last shipment
    from the south came in light, and that worries the warehouse men more than
    they are letting on. Someone's been asking about the old harbor routes, the
    ones that don't go through the formal berths. I don't know who. I know what
    they ordered and how they tipped, and that's usually enough to get started.
- key: night
  kind: info
  label: What are the docks like after dark?
  text: The docks at night are a different place from the docks at noon. The
    working crowd comes in here or goes home, and what's left on the quay is a
    particular kind of busy that does not show up in the manifests. I don't see it
    from here. This is a room with walls. But I hear about it the next morning.
    The long quay stays lively. Cutter's Lane gets quieter than it has any reason
    to. I've learned not to ask what passes through there after the second bell.
  hints: Bressa keeps herself to the lit side of the waterfront's night business.
- key: tab
  kind: info
  label: Do you let people drink on credit?
  text: I keep a slate. Not because I'll refuse anyone who's short. I keep it
    because I like to know. Dock work runs irregular, and I'm not going to let a
    man go dry in a cold week because the unloading ran slow. But there's a
    difference between irregular and not trying, and I know which is which
    without asking. The slate evens out. It always has.
