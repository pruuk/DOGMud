mobid: 9300
zone: New Plymouth Docks
defaultMood: neutral
greetings:
- text: Looking for work, or just in the way?
  moods:
  - neutral
- text: Back again. Good.
  moods:
  - friendly
opener:
  text: You looking for the board or you looking for me? If it's me, there's a
    theft hung on one of my hands that I don't believe.
  hints: Choose a line below to hear about work on the docks, the harbor fees,
    or the people who passed through before you. His task is about the theft
    pinned on his dockhand Teo.
  variants:
  - questRequired:
    - 63-end
    text: Teo's back on the board, and Hewd answers to the constable now. That is
      how it should have gone the first time.
    hints: Choose a line below to learn about work on the docks, the harbor
      fees, or the people who passed through before you.
  - questRequired:
    - 63-start
    questExcluded:
    - 63-end
    carriesItem: 40100
    text: That's Hewd's book in your hand, isn't it? Let me see it.
    hints: Choose Dock Rat below to give Jesset the tally-book.
  - questRequired:
    - 63-evidence
    questExcluded:
    - 63-end
    text: You found his book and lost it? Then go back up to that office. A man who
      keeps two sets of numbers keeps a spare.
    hints: From the Long Quay, where Jesset keeps his board, go north five times
      to the Outer Dock Lane, then east into the Dock Constable's Post and up into
      the Foreman's Office. Type look floorboard.
  - questRequired:
    - 63-start
    questExcluded:
    - 63-evidence
    text: Still on it? Good. The cargo in the customs shed doesn't match the
      manifest, and the man who'd know why keeps a tidy office and an untidy
      conscience. Proof goes to the constable or to me, not to the wharf gossip.
    hints: From the Long Quay, where Jesset keeps his board, go north five times
      to the Outer Dock Lane, then east into the Dock Constable's Post and up into
      the Foreman's Office. Type look floorboard.
topics:
- key: tallyhandoff
  kind: handin
  quest: 63
  label: Dock Rat
  playerLine: I found Hewd's tally-book. It proves Teo didn't take the cargo.
  text: Hewd's book. I had a feeling it ran through that office. Look, the hand
    changes halfway down the column. I'll walk this to the constable myself. It
    lands harder from me. Teo's back on the board in the morning. You did right by
    him.
  questRequired:
  - 63-start
  questExcluded:
  - 63-end
  requiresItem: 40100
  grantsQuest: 63-end
- key: dockrat
  kind: offer
  quest: 63
  label: Dock Rat
  playerLine: Do you want help clearing your dockhand's name?
  text: There's a theft hung on one of my hands, Teo. Cargo came up short on a
    manifest shift and his name is on the entry. I don't buy it. The boy's green,
    not crooked, and he flagged the shortage himself before anyone else thought to
    look. Someone is skimming my docks and letting him carry it. Find out who. The
    cargo in the customs shed doesn't match its manifest, and the foreman, Hewd,
    keeps his books in the office above the constable's post. Mind the floor in
    that office. Bring proof to the constable, or back to me.
  hints: Accept, then go north five times from the Long Quay, where Jesset keeps
    his board, to the Outer Dock Lane, east into the Dock Constable's Post, and up
    into the Foreman's Office. There, type look floorboard.
  questExcluded:
  - 63-start
  - 63-end
  grantsQuest: 63-start
- key: work
  kind: info
  label: Is there work on the docks?
  text: The board's right there behind me. Fresh entries go up at dawn. Grain
    unload, net work, day labor. You read, you apply, I decide. The work is
    honest, the pay is what it says on the board, and if you don't show when you
    said you would, I draw a line through your name. I don't need to know why.
- key: licensing
  kind: info
  label: Who takes the harbor fees?
  text: Every ship that berths here pays a fee. Part goes to the harbormaster. The
    larger part goes to the bloodline's domestic office. In return, the harbor
    keeps its license and my crew keeps its work. I didn't negotiate that
    arrangement and I'm not going to lose sleep over it in public. That's all I'll
    say.
  moodChange: cautious
- key: group
  kind: info
  label: Who came through the docks before me?
  text: You mean the ones who came through here and then didn't. Pip worked the
    docks. Knew where everything was, knew everyone. The others I knew less. They
    had a particular kind of quiet that means a person is working on something
    they're not going to name. They left. The work goes on. I don't know more than
    that, and if I did, this wouldn't be where I told it.
  hints: Jesset has said what he will about the ones who left.
  moodChange: cautious
