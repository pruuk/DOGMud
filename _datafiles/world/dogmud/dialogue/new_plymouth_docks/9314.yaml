mobid: 9314
zone: New Plymouth Docks
defaultMood: agitated
greetings:
- text: You read that board? Because I need someone who can actually listen.
  moods:
  - agitated
- text: Still here. Still waiting for someone to look at the numbers properly.
  moods:
  - neutral
opener:
  text: I didn't take anything. I want to be clear about that. The numbers they're
    pinning on me were wrong before I touched the manifest. I flagged it. I have a
    witness who heard me flag it. Nobody has gone to find that person.
  hints: Choose a line below to hear about the theft charge, what was wrong with
    the manifest, or who he thinks is responsible.
  variants:
  - questRequired:
    - 63-end
    text: My name's off the board. Jesset says I start again in the morning. I
      don't know how to thank you properly, so I'll just say it. Thank you.
    hints: Choose a line below to hear what happens now, or what was wrong with
      the manifest.
topics:
- key: theft
  kind: info
  label: Did you take the cargo?
  text: I didn't steal anything. I have worked Jesset's manifest for two seasons
    without a shortfall. What's on that board is the first time my name has been
    on any complaint. The cargo was already light before I signed for my shift.
    Someone pinned this on me because I was next in the chain after them, and my
    name was the one at the bottom of the entry.
  questExcluded:
  - 63-end
- key: cleared
  kind: info
  label: What happens to you now?
  text: I go back on the manifest in the morning. Hewd's two columns are with the
    constable, and the shortage has his name on it now, not mine. I'll be counting
    every crate twice before I sign for it, for a while yet.
  questRequired:
  - 63-end
- key: discrepancy
  kind: info
  label: What was wrong with the manifest?
  text: The count on the manifest I signed was already two crates short. I noticed
    it. I flagged it to the man above me and expected it to get corrected upward.
    Instead it got corrected downward on paper, and my name stayed at the bottom
    of the entry. If you look at the first entry and the correction, the
    handwriting is different. Two different hands touched that page. Whoever made
    that correction keeps the real numbers somewhere.
  hints: The man above Teo on the manifest is the foreman, Hewd, whose office is
    up the stair from here.
  marked: true
- key: suspect
  kind: info
  label: Who do you think took it?
  text: I'm not going to say a name. I work these docks and I would like to keep
    working them after this is resolved. What I'll say is this. Whoever signed the
    manifest before me, and whoever made the correction after, the constable has
    both entries if he looks. I flagged the short count in front of a witness on
    the quay side. That's where the thread starts.
  hints: Teo has said what he will. He points at the manifest entries and a
    witness who can back his account.
  questExcluded:
  - 63-end
  moodChange: cautious
