mobid: 9304
zone: New Plymouth Docks
defaultMood: friendly
greetings:
- text: Hey! Haven't seen you on the circuit before. New to the city?
  moods:
  - friendly
  - neutral
opener:
  text: I'm Dobb. I run the Long Market route for Dunmar, everything from this
    warehouse out to every quarter in the city. What's on your mind?
  hints: You could ask Dobb about his delivery route, which parts of the city are
    short of supplies, or what he hears on the way.
topics:
- key: route
  kind: info
  label: Where does your route take you?
  text: I start here after Dunmar finishes loading and head east along the Long
    Market. The Crafting Quarter first, then the central market in the Merchant
    Quarter, then the Temple at the far end for what the healers and scholars
    need. On the return I branch south into the Common Quarter. That one's the
    longest leg, most stops. The full circuit takes until late afternoon if
    nothing unusual happens. Something unusual usually happens.
- key: shortage
  kind: info
  label: Who in the city is running short?
  text: The Crafting Quarter is always low on iron. Halvard uses it faster than it
    comes in, which is Dunmar's problem, not mine. The Common Quarter this week is
    out of salt. The cookshop and Tova's rooming house both flagged it when I
    passed. The Temple wants lamp oil and wouldn't say why, which usually means
    something ceremonial is coming. The central market is well stocked right now.
    Good week for them. The docks need nothing. We have the source.
- key: gossip
  kind: info
  label: What do you hear on your rounds?
  text: The ships arrive here first and the crews talk before they're properly off
    the gangplank, so the docks know things before the rest of the city does.
    What I'm hearing lately is that another bloodline assessment is coming. Not a
    rumor. One of Greer's clerks confirmed it. And there is a crate in bay seven
    of Dunmar's warehouse that nobody will tell me the origin of. He says it's
    handled. I notice he said handled and not explained.
