defaultMood: neutral
greetings:
- text: What is it.
  moods:
  - neutral
- text: Back. All right then.
  moods:
  - friendly
opener:
  text: Browse if you like. Ask if you have a question. I usually know the answer,
    though the answer sometimes costs more than whatever is on the shelf.
  hints: Choose a line below to learn about the rumors she trades in, the pawn
    trade, or what has come up from the docks lately. To see what she sells,
    type list.
topics:
- key: rumors
  kind: info
  label: Do you trade in rumors?
  text: Information is a perishable good. It has a shelf life, same as fish, and a
    price that moves with the market. I trade in it the same way I trade in
    anything else. You bring me something I don't already know, I tell you
    something you don't. Running it in one direction doesn't usually last long.
  hints: Old Sable treats information as goods with a going rate on both sides.
- key: trade
  kind: info
  label: How does the pawn trade work?
  text: People bring me what they need to not have any more. I price it, they
    decide, they leave without it. Someone else comes in who needs the thing, I
    charge them more than I paid, and the difference is the cost of the shelf
    space. It's the oldest business in any port. The art is reading what a thing
    is worth to the person selling and to the person who will one day buy. Those
    are never the same number.
- key: found
  kind: info
  label: What has come up from the docks lately?
  text: Things come up from the lower docks on a regular basis. I don't ask where
    they were before they reached my counter. The condition they arrive in
    suggests various histories, and none of those histories are my business. What
    I can say is that the last few weeks have been productive, if you mean that in
    the sense that interesting objects have appeared. I sent two of them back
    down. They carried a kind of attention I don't need pointed at this shop.
  hints: Old Sable is careful about what she keeps and what she chooses not to.
