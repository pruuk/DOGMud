mobid: 9315
zone: New Plymouth Docks
defaultMood: neutral
greetings:
- text: Foreman's office. If you have a manifest matter, I'm available. Other
    things are probably not my department.
  moods:
  - neutral
opener:
  text: The office handles cargo allocations and shift assignments. If you've come
    about the Teo matter, I've already given the constable my full statement.
  hints: Choose a line below if you want to hear about Teo, about his books, or
    about the correction in the manifest.
  variants:
  - questRequired:
    - 63-end
    text: I have nothing to say to you. Whatever you think you found, the
      constable can take it up with me.
    hints: Hewd does not look up from the stock ledger.
topics:
- key: teo
  kind: info
  label: What happened with Teo?
  text: A shame, but there it is. The count came up short on his manifest shift
    and the entry is in his hand. I gave the constable the same account I'll give
    you. The numbers don't lie, and Teo's name is on the page where the shortage
    starts. I have nothing to add to that.
  hints: Hewd is unhurried and dismissive on the subject of Teo.
  questExcluded:
  - 63-end
- key: ledger
  kind: info
  label: Are your books in order?
  text: In order. Everything reconciles to the quarter ledger. I run a tight
    accounting. It's what this office does. If there were broader problems, the
    numbers would show them. They haven't.
  hints: Hewd is smooth on the subject of the accounts.
  questExcluded:
  - 63-end
- key: discrepancy
  kind: info
  label: Why was the manifest corrected?
  text: Corrections are routine. Clerical work, same as anywhere. The manifest is
    accurate in its final form. If you've been listening to Teo's version of
    events, I'd consider your source. He is trying to keep his position. I
    understand that. It doesn't change what the document says in the end.
  hints: Hewd deflects. Something tightens briefly when the correction comes up,
    though he controls it quickly. His eyes go once to the floor near the far
    wall.
  questExcluded:
  - 63-end
  moodChange: cautious
