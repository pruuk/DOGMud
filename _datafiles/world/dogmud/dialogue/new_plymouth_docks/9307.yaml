mobid: 9307
zone: New Plymouth Docks
defaultMood: neutral
greetings:
- text: Tell me what you need and I'll tell you if I have it.
  moods:
  - neutral
opener:
  text: If it keeps a hull tight or a road lit, it's on these shelves. Pitch,
    oil, wax, lanterns and torches. I can put my hand on any of it without
    looking, so tell me which and it'll be on the counter.
  hints: You could ask Chandler Voss about his stock, or about the change that
    keeps him dry. To see what he sells, type list.
topics:
- key: stock
  kind: info
  label: What do you sell?
  text: Pine pitch for sealing hulls or ironwork. Harness oil. Beeswax for rope
    work and for weatherproofing cloth. Lanterns, plain and hooded, and torches.
    Cloth strips for patching. Everything a ship needs to put back to sea, or a
    traveler needs to stay dry and see in the dark on the road. The price is on
    the item. I don't haggle before third bell.
- key: trade
  kind: info
  label: Why does the water run off your skin?
  text: The skin started some years back. Tar gets into everything eventually. I
    just started shedding water instead of soaking it up. My wife says the sheets
    stay drier. I find it useful in bad weather. It doesn't affect the goods.
  hints: Chandler Voss has said what there is to say about it.
