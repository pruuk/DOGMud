mobid: 9392
zone: New Plymouth Docks
defaultMood: neutral
greetings:
- text: '...'
  moods:
  - neutral
- text: It's... I'm still here.
  moods:
  - friendly
opener:
  text: I used to run cargo on this wharf. I know every bollard by its scar. I'm
    not... I'm not what I was.
  hints: Teels' face is drawn tight and pale around the eyes. Their task below is
    a plea for help.
  variants:
  - questRequired:
    - 67-end
    text: I heard. I don't know from who. The docks talk, when something finally
      closes. I don't feel what I thought I would. Mostly I feel like I can stand
      on the wharf without wondering which way I am pointing. That's more than I
      had last season. I know what I was before. I think I can get back to being
      that, one day. Thank you for not... for not walking past.
    hints: Teels is steadier than when you first found them. Still fragile, but
      pointed somewhere that makes sense. The Bloom trail is closed.
  - questRequired:
    - 66-end
    questExcluded:
    - 67-start
    text: You came back. Most don't. The purge holds, for now. The source is still
      running, and I know it is. I'm not going back. I just know it is still there.
    hints: If you want to follow the Bloom to whoever sells it, choose The Bloom Trail
      below.
  - questRequired:
    - 66-end
    text: You came back. Most don't. The purge holds, for now. The source is still
      running, and I know it is. I'm not going back. I just know it is still there.
    hints: Teels seems steadier, but clear about what the purge cannot fix while the
      Bloom still flows from somewhere on the docks.
  - questRequired:
    - 66-dose
    questExcluded:
    - 66-end
    carriesItem: 40109
    text: Is that from her? Give it here. Please.
    hints: Choose The Addict's Plight below to give Teels the purge.
  - questRequired:
    - 66-dose
    questExcluded:
    - 66-end
    text: She gave you something for me? Where is it?
    hints: If you lost the purge, Ysolde has more, in her room off the Back-Alley in
      the Common Quarter. Type talk ysolde.
  - questRequired:
    - 66-start
    questExcluded:
    - 66-dose
    - 66-end
    carriesItem: 40110
    text: I'm... managing. Go. The alley, Common Quarter. Ysolde. She'll know the
      smell.
    hints: Ysolde's Room is off the Back-Alley in the Common Quarter, east of
      Sweeper's Corner. Type talk ysolde.
  - questRequired:
    - 66-start
    questExcluded:
    - 66-dose
    - 66-end
    text: Where's the wrapper? You need it. She has to smell it.
    hints: If you lost the wax wrapper, choose to tell Teels below.
topics:
- key: plea
  kind: offer
  quest: 66
  label: The Addict's Plight
  playerLine: Is there something I can do for you?
  text: I need... I need someone to go to the healer in the Common Quarter. The one
    in the back alley. No questions, no records. Ysolde. I can't get there on my
    own right now, and I can't send a message anyone should see. I have a wrapper
    she needs to see. She'll know the smell. It came from a clean little shop, a
    draper, somewhere down the dock streets here. She'll know what it means.
    Please.
  hints: Accept, and Teels presses a spent wax wrapper into your hands. It smells
    faintly of copper and flowers. Then take it to Ysolde, the back-alley healer
    in the Common Quarter.
  questExcluded:
  - 66-start
  - 66-end
  grantsQuest: 66-start
  givesItem: 40110
- key: purge_handoff
  kind: handin
  quest: 66
  label: The Addict's Plight
  playerLine: Ysolde sent this back for you. Drink it.
  text: From her. I know what this does. I know. Give it here. Stay a minute, would
    you. I don't want to do this one alone.
  questRequired:
  - 66-dose
  questExcluded:
  - 66-end
  requiresItem: 40109
  grantsQuest: 66-end
- key: q67_grant
  kind: offer
  quest: 67
  label: The Bloom Trail
  playerLine: Do you want help finding where the Bloom comes from?
  text: She did what she could. So did you. But the craving comes back, every time,
    while the source keeps running. I can tell you where my wrappers came from.
    There is a draper named Marn on the docks, at the north end of the Outer Dock
    Lane. A clean shop, respectable-looking. I never saw what he moves or how it
    moves. I only know what I paid him for. He is where the trail starts.
  hints: Accept, then go to Marn's fabric shop on the docks, at the north end of the
    Outer Dock Lane.
  questRequired:
  - 66-end
  questExcluded:
  - 67-start
  - 67-end
  grantsQuest: 67-start
- key: lost_wrapper
  kind: info
  label: I've lost the wrapper you gave me.
  text: Lost it? Here. I have more of them than I want. Take it to Ysolde. Please.
  hints: Teels presses another spent wax wrapper into your hands.
  questRequired:
  - 66-start
  questExcluded:
  - 66-dose
  - 66-end
  itemExcluded: 40110
  givesItem: 40110
