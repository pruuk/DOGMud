mobid: 9198
zone: Kingsbarrow Vale
defaultMood: neutral
opener:
  text: Tithe-clerk's post. I am Verrold, tithe-clerk for the vale, and a stage on
    the capital's post relay when a dispatch comes through. State your business and
    let me keep my count.
  hints: You could ask Verrold about the tithe he keeps, or the news of the vale.
  # Quest 60 states (first match wins); quest_active, quest_sent and
  # quest_done became these variants.
  variants:
  - questRequired:
    - 60-end
    text: The packet cleared the gate, then. The ledger is square. The capital is
      well served by a steady courier.
  - questRequired:
    - 60-manifest
    questExcluded:
    - 60-end
    text: Sealed, stamped, and entered. The packet is yours to carry the last leg,
      to the East Gate guard at New Plymouth. North to the works at Kilnreach, then
      the outskirts, then the walls. You are nearly there.
    hints: From the Great Tithe Barn, go east to the Tithe Road, then north until
      the road ends at the East Gate of New Plymouth. Type talk guard.
  - questRequired:
    - 60-waybill
    questExcluded:
    - 60-end
    carriesItem: 40072
    text: Pell's manifest, from Hartcharn? Give it here. I enter it in the tithe ledger
      and seal it into a capital packet, and then there is but one leg left.
    hints: Verrold will take the counter-signed manifest. Choose to hand it to him
      below.
  - questRequired:
    - 60-waybill
    questExcluded:
    - 60-end
    text: Pell sent you on with a manifest, and you have come without it?
    hints: If you lost the manifest, Severin Pell at Hartcharn can make out another
      from his counterfoil.
topics:
# verroldhandoff merges quest 60 trigger 1's npc_say ("Pell's counter-sign,
# good. Into the tithe ledger it goes."); the old text described Verrold in
# the narrator's voice.
- key: verroldhandoff
  kind: info
  label: Here is Pell's counter-signed manifest.
  text: Pell's counter-sign, good. Into the tithe ledger it goes. There. Sealed and
    stamped. The East Gate guard at New Plymouth takes it from here. That is the last
    of the road.
  hints: Verrold sealed the manifest into a capital packet for the East Gate guard
    at New Plymouth.
  marked: true
  questRequired:
  - 60-waybill
  questExcluded:
  - 60-manifest
  - 60-end
  requiresItem: 40072
  grantsQuest: 60-manifest
  givesItem: 40073
- key: lost_report
  kind: info
  label: I have lost the packet you sealed.
  text: Lost the packet? The ledger entry stands, so I can seal another against it.
    A moment. There. The East Gate guard, New Plymouth. Mind this one.
  hints: You have a fresh sealed packet. Give it to the East Gate guard at New Plymouth.
  marked: true
  questRequired:
  - 60-manifest
  questExcluded:
  - 60-end
  itemExcluded: 40073
  givesItem: 40073
# The "work" pattern (pointing at the manifest) is FOLDED into the 60-waybill
# opener variants.
- key: grain
  kind: info
  label: What is it you count in this barn?
  text: Every sack that leaves this vale for the capital passes my count first. One
    in ten is the capital's. The capital is fed on what I write down.
- key: gossip
  kind: info
  label: Is there any news from the vale?
  text: I keep the tithe ledger for the capital. Numbers, not news.
