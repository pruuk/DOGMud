mobid: 9413
zone: River Road
defaultMood: friendly
greetings:
- text: "Smoke needs another hour. Sit if you like. The river's good company while
    you wait."
  moods:
  - friendly
opener:
  text: "I've been at this smokehouse since before the dock was built, before the
    road was cut south. Just me and the river. It changes. Higher some years, lower
    others, different fish. But it's always itself. Good to know something that's
    always itself."
  hints: "Choose a line below to hear about his years on the river, how he
    smokes his fish, or about the Confluence where the rivers meet."
topics:
# old (pattern) folded into river; fish (pattern) into smoking.
- key: river
  kind: info
  label: How long have you fished this river?
  text: "Sixty years on the Aldren, give or take. Long enough to know the river
    better than my own children, which is its own kind of shame, but there it is.
    I've seen it flood five times bad and drop three times to stone. The fish change
    with it. Some years it's perch and pike, some years the catfish come up from the
    south mud in numbers that'd make your eyes water. My father fished it before me,
    and his mother before him. We don't own it. We just show up and see what it's
    offering. That's about all fishing is."
- key: smoking
  kind: info
  label: How do you smoke your fish?
  text: "Alder wood for the light smoke, a little green willow if you want the
    sweetness, nothing wet and nothing resinous, or you'll taste the resin for a
    week. Low heat, long time. People want it done fast and they ruin it. Fish'll
    tell you when it's ready. The flesh goes from clear to chalky at the center, and
    then you're done. I've ruined maybe three batches in sixty years. I keep count.
    The Aldren gives what it gives. I've stopped arguing with it."
- key: confluence
  kind: info
  label: What do you know of the Confluence?
  text: "Three rivers meet down there, that's the saying. Aldren, Brenn, Solt. They've
    got a name for each. My grandfather used to say there were four, once. That there
    was a fourth channel that went dry before his time, and people stopped counting
    it. Some old watercourse dried up or went underground, he said, and after a
    generation or two nobody thought to include it in the naming anymore. I don't
    know if it's true. Old men tell you things. Anyway, three is what's there now,
    and three is enough for a temple."
  marked: true
