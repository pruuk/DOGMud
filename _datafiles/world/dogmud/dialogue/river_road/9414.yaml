mobid: 9414
zone: River Road
defaultMood: friendly
greetings:
- text: "Peace on the road to you. We are bound for the Confluence temple. We can
    almost see the spires from here."
  moods:
  - friendly
opener:
  text: "I'm Wess. My companion Nara and I are pilgrims heading south to the Temple
    of Confluence, the great meeting place at the three rivers. I was raised hearing
    about it. I should have gone years ago. Now I am going, which is nearly the same
    thing, I suppose."
  hints: "You could ask Wess about the temple, about the symbol carved above its
    doors, or why she is making the journey."
topics:
# south (pattern) folded into why; pilgrim (pattern) into temple.
- key: temple
  kind: info
  label: What do you know of the temple?
  text: "The Temple of Confluence stands at the joining of the three rivers. They say
    the old builders chose that spot because moving water never forgets where it came
    from. It carries everything it has touched, all the way to the sea. The temple is
    old, older than the capital. The outer courts were opened to pilgrims within
    living memory. I have heard that inside, where the rivers join in a single
    channel below the floor, the sound is extraordinary. That is what I want to hear,
    I think. The sound of things joining. The road teaches patience, and patience
    teaches faith. Or that is what I tell myself on the steep parts."
  hints: "The Confluence Gates are a short walk south of the pilgrim camp, past the
    rise where the spires come into sight."
- key: symbol
  kind: info
  label: What is the symbol above the temple doors?
  text: "I have only seen drawings. They show three rivers flowing together into a
    single line, with a circle where they meet. That is the temple's own sign. But a
    woman I walked with two days back said the carving above the great doors is not
    that at all. Rings, she said, one inside the next, and older than the temple
    around it. She said there is an old stone up on a rise by the bluff with rings
    like that on it too. I would not know. I intend to see the real thing."
  hints: "The Old Waystone Rise lies west of the Confluence Bluff, north of the
    pilgrim camp."
- key: why
  kind: info
  label: Why are you making this journey?
  text: "I lost my brother two winters back. The grief was long. Someone told me the
    temple is a place where things that have been divided can be held together
    again, that it was built for exactly that feeling. I don't know if that's
    theology or poetry. I'm going to find out. I meant to make this journey for three
    years, and I should have started sooner. Nara is coming because she's kind enough
    to walk a long road with a sad woman, and because she's not entirely convinced
    it's a waste of time, which is the most faith she'll claim."
