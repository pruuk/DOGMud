mobid: 9410
zone: River Road
defaultMood: friendly
greetings:
- text: "Road's open. I'll have you know it took near three months to get it that
    way. She's sound all the way to the river now."
  moods:
  - friendly
opener:
  text: "You're standing on my work, and she's holding. I'm warden for this
    stretch of the south road, and I answer to the Council at New Plymouth for
    the crossings and the grade. The spring floods tore this section out badly.
    It took too long to put back, but it's been put back right."
  hints: "You could ask Carew about the road repair, about what lies south along the
    river, or about the pilgrims he sees come through."
topics:
# road (pattern) folded into repair.
- key: repair
  kind: info
  label: Why did the repair take so long?
  text: "The spring floods came early and fast. The south channel jumped its bank and
    ran straight down the road cut for near six weeks. We couldn't touch it while the
    water was moving. Then it drained and left four feet of silt and a broken
    culvert. We dug it out, cut the grade again, packed the shoulders with
    clay-gravel. Four men and a borrowed ox, three months. Proper work, the kind that
    lasts. We're all proud of it and won't pretend otherwise."
- key: south
  kind: info
  label: What lies south along the road?
  text: "South of here the road follows the Aldren River down to where the three
    rivers meet. That's the Confluence, if you've heard of it. Pilgrim traffic
    mostly, heading for the temple there. Beyond that the road picks up again toward
    the coast, though that's outside my remit. I just keep the stretch between Amber
    Valley and the Confluence sound."
  hints: "The River Road runs south from here to the Confluence Gates."
- key: pilgrims
  kind: info
  label: Do many pilgrims come this way?
  text: "More of them this season than I can remember. The temple at the Confluence
    draws folk from all over the river country. I've seen some come from as far as
    the coast road. Mostly peaceful. They're careful with the road too, which I
    appreciate. A road's only as good as the people who walk it gently."
