mobid: 9415
zone: River Road
defaultMood: friendly
greetings:
- text: "If you're going to ask if we're lost, we're not. We're taking the long way.
    On purpose. Allegedly."
  moods:
  - friendly
opener:
  text: "I'm Nara. Walking to the Temple of Confluence with Wess. She's the one with
    the calling, I'm the one with the better boots, which I am wearing out on her
    behalf, I'll note. We've been on the road ten days and it has been fine. Mostly
    fine. The last camp was fine."
  hints: "Choose a line below if you would like to hear about the journey, about
    where they have been sleeping, or about what she expects at the Confluence."
topics:
# lost (pattern) folded into road; pilgrim (pattern) into confluence.
- key: road
  kind: info
  label: How has the journey been?
  text: "We are not lost. I want to be very clear about that. We are slow. Ten days
    from the valley, more or less. We started further north than most pilgrims, so
    we came the longer way. The road's been decent since the warden's crew fixed the
    south cut. Before that I'm told it was a muddy slog for three months, which I am
    grateful I missed. My feet have opinions about soft ground. The river country's
    been beautiful, honestly. I'd rather take the pretty road and complain about it
    than take the easy road and have nothing to say."
- key: camp
  kind: info
  label: Where have you been sleeping?
  text: "We camp when there's no roof and take a roof when there is one. There has
    not been much roof. The road camps were fine, and the weather held. Now we're at
    the pilgrim camp, where the river-road folk stop in groups before the last
    stretch to the gates, and I am enjoying other people's campfire cooking. Mine is
    serviceable. Wess's is not."
- key: confluence
  kind: info
  label: What do you expect at the Confluence?
  text: "I'll say what I told Wess when she asked me to come. I don't know what the
    temple is. I've heard it's very old and that people come back from it different,
    and I've been skeptical of both claims. But Wess has had a hard two years and
    this is what she needs, and I'm not the kind of person who lets someone walk a
    long road alone when I can help it. Wess is going faithfully. I'm going
    supportively. Different posture, same road. If the temple turns out to be what
    she thinks it is, I'll be glad. If it turns out to be stones and river sound,
    I'll still be glad. It's a very nice river."
