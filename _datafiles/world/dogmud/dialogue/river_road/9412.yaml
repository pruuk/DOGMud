mobid: 9412
zone: River Road
defaultMood: friendly
greetings:
- text: "Fresh catch or smoked, both worth your coin. Or have a look and tell me what
    you need. I'm not proud."
  moods:
  - friendly
opener:
  text: "Mornings I mend nets, afternoons I sell fish, and in between I hear
    everything worth hearing at this landing. You'll find me here most days,
    unless it's market day or I've gone upriver to check my traps. Now, what can
    I do for you?"
  hints: "To see what Birrel sells, type list. Choose a line below if you would
    like to hear about the folk at the landing, or about the pilgrims passing
    through."
topics:
# net (pattern) folded into fish; news (pattern) is small talk, folded into
# village.
- key: fish
  kind: info
  label: What do you sell?
  text: "Fish right out of the Aldren, fresh or smoked over alder chips the way my
    mother taught me. I also keep river mussels and watercress, travel food, good
    for the pilgrims who don't want to carry much. Everything I sell I either caught,
    picked or smoked myself, and I mend every net on this stretch of the river. I
    can't speak for what's downriver at the Confluence market, but up here my word
    is my guarantee."
  hints: "To see what she sells, type list."
- key: village
  kind: info
  label: Who lives here at the landing?
  text: "Oh, we're a small lot. The fishers, the dock workers, the road warden Carew,
    who we're all a little afraid of, and old Sedge at the smokehouse, who has been
    here since the river was narrow. Good people, mostly. We get pilgrim traffic
    now, more every year since the temple opened its outer courts. Some are strange,
    some are devout, and you can't always tell which is which. I have a rule. They
    buy fish, I talk to them. They try to convert me, I go back to my nets."
- key: pilgrims
  kind: info
  label: What are the pilgrims like?
  text: "More of them every year, I'll say that. They come through in twos and threes,
    some in whole families. The devout ones are quiet and buy things without
    haggling, which I respect. The ones who've been at the Confluence and are coming
    back are different again. Steadier somehow. More themselves. Or maybe just tired
    from the road. Hard to say. Old Sedge at the smokehouse says the river's been
    busy like this before, in his father's day, before the temple was anything but a
    ruin."
