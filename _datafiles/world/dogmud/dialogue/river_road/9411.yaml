mobid: 9411
zone: River Road
defaultMood: friendly
greetings:
- text: "The barges here carry freight, not passengers. If you're bound south, the
    road will get you there. I just get the cargo off and the deck swept."
  moods:
  - friendly
opener:
  text: "Watch the edge, the current's quick here. This is the river landing.
    Barges come down from upriver, we take their cargo off, and we load what's
    bound south for the Confluence, grain and timber and trade goods. The water
    runs deep and steady through here. It's good work, if you can read it."
  hints: "Choose a line below to hear how often the barges run, what cargo moves
    on the river, or about the Confluence."
topics:
# river (pattern) folded into barges.
- key: barges
  kind: info
  label: How often do the barges run?
  text: "They run the downriver leg every few days when there's a load worth
    running. The Aldren is deep enough here that a good-draft barge makes the
    Confluence in a day and a half, if the current cooperates. Coming back upstream
    takes twice as long, because you're poling against the flow most of the way.
    Most goods come back by road. The barges mostly run south, and they carry
    freight, not travellers."
- key: cargo
  kind: info
  label: What moves on the river?
  text: "Grain from the valley farms, mostly. Dressed timber from the mill upriver.
    Some clay from the diggers along the north bank. The Confluence sends back
    salted fish, temple goods, ironwork from their smiths. Busy water. I have been
    landing cargo here seven years, and it only gets busier."
- key: confluence
  kind: info
  label: What is the Confluence like?
  text: "I haven't been down to the Confluence myself in three seasons. But from what
    I unload, I can tell you it's a proper place. They send out ironwork, fine
    cloth, carved stone. The pilgrims who come back up by road mostly look settled
    somehow. Like they found the thing they went looking for, or something near
    enough."
  hints: "The River Road runs south from the landing to the Confluence Gates."
