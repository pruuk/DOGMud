character:
  name: Tuck
  description: |
    A soot-smudged boy of twelve or so with a sack over one shoulder and a
    leather apron that belonged to someone twice his size. The smiths and
    glassblowers pay him in heels of bread to clear their yards of offcuts,
    and he has taken the job as a licence to pick up anything left lying
    anywhere in the quarter. He knows which forge throws out the best scrap
    and which apprentice drops things when the master shouts.
