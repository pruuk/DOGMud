activitylevel: 8
character:
  name: A River-Road Smuggler
  description: |
    A lean, weathered man who favors the ford shallows where the
    river-road thins to a muddy track and the gate-watch does not
    bother to patrol. He arranges papers, routes, and passage past
    the walls for those who can pay, and he operates on the principle
    that the less said, the cleaner the arrangement. He is very still
    when he wants to be, which is most of the time. His ears carry a
    secondary ridge of cartilage along the outer rim -- almost
    invisible unless the light falls sideways -- that angles sound
    toward him differently than it should, a Chrysalis drift that has
    sharpened his hearing well past what anyone standing in reeds a
    hundred yards away is supposed to have. He knew you were
    approaching before you thought you were close.
