character:
  name: A Gully-Denned Wolf
  description: |
    A black wolf, heavy through the chest and wide across the
    muzzle -- built more for the ravines than the open country
    above. The coat is so dark it reads as shadow in daylight and
    vanishes entirely at night. The eyes catch light from no
    visible source -- a quality that comes from living too long in
    lightless places. It has been in those gullies long enough
    that the dark now belongs to it. It watches you from inside
    that belonging, and it has already made up its mind about
    what you are.
