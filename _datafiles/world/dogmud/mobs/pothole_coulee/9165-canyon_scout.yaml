character:
  name: Canyon Scout
  description: |
    A raider posted to hold the sounding floor, the open stretch of canyon
    where every footfall and bowstring carries from wall to wall. Unlike the
    slingers on the ledges, this one is built to close: a short spear, a
    battered iron blade at the belt, and the heavy shoulders of someone who
    settles fights at arm's length. He knows the floor is a shooting gallery
    and he hates it -- the moment a shot comes at him from down the slot he
    will come straight up it after whoever loosed it, fast, to make the
    distance stop mattering.
