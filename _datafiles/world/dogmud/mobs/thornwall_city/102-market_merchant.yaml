character:
  name: Market Merchant
  description: |
    A stout man in a merchant's apron, his stall one of the busier spots
    in the market square. He sells cloth, leather goods, and small
    hardware -- the mid-range merchandise that keeps a city running. His
    manner is professionally friendly, his prices fair if not generous,
    and his knowledge of the market's politics encyclopedic. He pays his
    tithes to the temple and his taxes to the city, and has opinions
    about both.
