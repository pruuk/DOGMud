activitylevel: 10
character:
  name: Hobb Pennock
  description: |
    Hobb Pennock keeps the lodging house at the blind end of the alley,
    and he keeps it from a three-legged stool beside its door with a
    ledger across his knees. He is a narrow, stooped man with ink in
    the creases of his fingers and a patient, unhurried manner, as if
    he has decided that everything worth doing can be done slowly.
    His mutation is a quiet one. Whatever he makes with his hands
    remembers who it was made for, and the lock on the green door is
    his own work. It has never opened for a stranger. He lets rooms to
    people the quarter will vouch for, and to nobody else, and he has
    never once had to raise his voice about it.
