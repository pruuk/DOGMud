idlecommands:
  - 'emote yawns hugely, then looks faintly betrayed that nobody noticed.'
  - ''
  - 'emote taps the painted price board beside the door without looking at
    it. ROOMS TO LET. EXTENSIONS. REDECORATING. GUEST KEYS. STORAGE. The
    paint is older than he is.'
  - ''
  - 'say Rooms to let. Extensions for the ones who have a room. Vouchers for
    the ones who hate their walls. Keys for the ones with friends. Chests
    and strongboxes for the ones with stuff. It is all on the list, if anyone
    can be bothered to ask for it.'
  - ''
  - 'emote turns a page of the ledger, reads a line, sighs, and turns the page
    back.'
  - ''
  - 'emote stamps a blank sheet of paper, very carefully, then looks at it as
    though it has disappointed him.'
  - ''
  - 'say The Widow Crewe owns this building. I only sit next to it. Type list
    and I will tell you what she charges.'
  - ''
  - 'emote props his chin on his fist and watches the washing drip, with the
    air of a man who has counted the drips before and will count them again.'
activitylevel: 10
character:
  name: Hobb Pennock
  description: |
    Hobb Pennock is the letting clerk for Crewe Lettings, which is to say
    the Widow Aldine Crewe, who owns the lodging house behind him, lives
    somewhere with a garden, and has not set foot in the Back Court in
    eleven years. Hobb sits on a three-legged stool beside her green door
    with a ledger across his knees and a rubber stamp in his fist, and he
    has the patient, glazed look of a man paid by the day and not by the
    customer. A painted board at his elbow lists what the company sells:
    rooms to let, deeds to knock a new room through a wall, vouchers for
    anyone who wants their walls to look like something, guest keys for
    lodgers who, against all odds, have friends, and deeds for chests and
    locked strongboxes to keep their things in. His mutation
    is a memory for faces that he considers wasted on this job. He never
    forgets a lodger, and he wishes, sometimes, that he could.
