character:
  name: Old Mags
  description: |
    A stooped rag-and-bone woman in a coat made mostly of other coats,
    pushing a handcart with one wobbling wheel. Everything the Common drops
    ends up in that cart sooner or later: bent nails, odd boots, a spoon
    with somebody's initials on it. She sorts as she walks and talks to the
    cart while she does it. By nightfall she has sold the lot to the tinkers
    on Tinker's Lane, and by morning she is out again with an empty cart and
    the same bad wheel.
