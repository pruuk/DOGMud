character:
  name: Spine Lattice
  description: >-
    A knot of crystal spines held together by nothing at all, forever
    coming apart and putting itself back together. The spines slide past one
    another without touching, each one long and fine as a knitting needle,
    and the shape they make is never quite the same twice. Every few heartbeats
    all of them turn, together, to point at the same thing.
