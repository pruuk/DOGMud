# Taunt / rhetoric combat messages
# Tokens available:
# {actor}     - name of the taunter
# {actee}     - name of the target
# {actortype} - ansi name alias for the taunter: 'username' or 'mobname'
# {acteetype} - ansi name alias for the target: 'username' or 'mobname'
# {damage}    - conviction damage description text
#
# THE THREE LISTS IN EACH BAND PAIR BY INDEX. Variant N of actor,
# actee and observer describe the SAME moment, and combat.GetTauntTriad
# renders all three from ONE index so the room never sees a different event
# than the participants. combat.TauntMessageGroup.Validate enforces equal
# lengths, so adding a line to one list means adding its partner to the other
# two.

optionid: rhetoric
options:
