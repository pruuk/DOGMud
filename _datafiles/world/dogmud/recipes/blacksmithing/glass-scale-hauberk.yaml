success_actor: "You weave the chain, rivet the joins, and then begin the long work: lens after lens, wired into place row on row until they overlap like scales. When the last one sits flat the whole coat ripples like dark water. A glass-scale hauberk!"
failure_actor: "Halfway down the back the rows will not lie flat. One lens cracks against its neighbour, then the next, and the cracks run through the scales like frost. The work is lost."
