id: glass-scale-hauberk
name: Glass-Scale Hauberk
aliases: [hauberk, glasshauberk]
skill: blacksmithing
skill_minimum: 45
station: forge
time_rounds: 12
ingredients:
  - item_tag: chain-link
    quantity: 3
  - item_tag: iron-ingot
    quantity: 1
  - item_tag: obelisk-lens
    quantity: 24
output:
  item_id: 20099
