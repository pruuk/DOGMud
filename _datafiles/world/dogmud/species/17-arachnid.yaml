speciesid: 17
name: arachnid
description: A many-legged predator that spins silken webs and waits
  with eerie stillness. Arachnids inject paralyzing venom
  through needle-sharp fangs, then wrap their helpless prey
  in silk.
body_parts: [legs, eyes, mouth, skin]
intrinsic_mutations:
  tremorsense: 1
  silk-glands: 1
conditionids:
  - 29 # Night Vision
size: small
unarmedname: fangs
natural_attack: bite
selectable: false
tameable: true
angrycommands:
  - emote rears up on its hind legs, fangs glistening with venom.
  - emote skitters sideways, legs clicking on the ground.
stats:
  strength:
    base: 50
  dexterity:
    base: 110
  perception:
    base: 100
  vitality:
    base: 45
  willpower:
    base: 10
  charisma:
    base: 5
damage:
  basedamage: 4
  variance: 2
  critconditionids:
    - 39 # Venom
damage_multiplier: 0.50
disabledslots: ['weapon', 'offhand', 'head', 'neck', 'belt', 'gloves', 'ring', 'legs', 'feet']
# Wilderness trades: what a carcass gives to skin and butcher. Quantities
# are for a medium body (small halves, large doubles). See species/harvest.go.
harvest:
  skin:
    - {item: chitin, qty: 2}
  butcher:
    - {item: venom-sac, qty: 1, rare: true, chance: 0.3}
    - {item: silk-gland, qty: 1, rare: true, chance: 0.2}
