speciesid: 9
name: raptor
description: A keen-eyed bird of prey with razor talons and a hooked
  beak. Raptors circle high above, spotting movement from
  impossible distances before diving to strike.
body_parts: [legs, eyes, mouth, skin]
intrinsic_mutations:
  keen-senses: 1
  raptor-legs: 1
conditionids:
  - 29 # Night Vision
size: small
unarmedname: talons and beak
natural_attack: claws
selectable: false
tameable: true
angrycommands:
  - emote screeches and spreads its wings wide, talons extended.
  - emote fixes you with a piercing, unblinking stare.
stats:
  strength:
    base: 50
  dexterity:
    base: 140
  perception:
    base: 160
  vitality:
    base: 40
  willpower:
    base: 10
  charisma:
    base: 10
damage:
  basedamage: 4
  variance: 2
damage_multiplier: 0.50
disabledslots: ['weapon', 'offhand', 'head', 'neck', 'belt', 'gloves', 'ring', 'legs', 'feet']
# Wilderness trades: what a carcass gives to skin and butcher. Quantities
# are for a medium body (small halves, large doubles). See species/harvest.go.
harvest:
  butcher:
    - {item: feathers, qty: 4}
    - {item: fowl, qty: 1}
    - {item: bone, qty: 1, tool: cleaver}
    - {item: flight-feathers, qty: 1, rare: true, chance: 0.4}
    - {item: talons, qty: 1, tool: bone_saw, rare: true, chance: 0.3}
