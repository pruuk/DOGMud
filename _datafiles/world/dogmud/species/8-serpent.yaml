speciesid: 8
name: serpent
description: A legless predator that strikes with blinding speed. Serpents
  rely on stealth, patience, and venom to subdue prey far
  larger than themselves.
body_parts: [eyes, mouth, skin]
intrinsic_mutations:
  venom-glands: 1
conditionids:
  - 29 # Night Vision
size: small
unarmedname: fangs
natural_attack: bite
selectable: false
tameable: true
angrycommands:
  - emote coils tightly and hisses, hood flaring wide.
  - emote flicks its forked tongue and draws back to strike.
stats:
  strength:
    base: 40
  dexterity:
    base: 120
  perception:
    base: 110
  vitality:
    base: 50
  willpower:
    base: 10
  charisma:
    base: 5
damage:
  basedamage: 4
  variance: 2
  critconditionids:
    - 39 # Venom
damage_multiplier: 0.50
disabledslots: ['weapon', 'offhand', 'head', 'neck', 'belt', 'gloves', 'ring', 'legs', 'feet']
# Wilderness trades: what a carcass gives to skin and butcher. Quantities
# are for a medium body (small halves, large doubles). See species/harvest.go.
harvest:
  skin:
    - {item: scales, qty: 2}
  butcher:
    - {item: raw-meat, qty: 1}
    - {item: venom-sac, qty: 1, rare: true, chance: 0.3}
    - {item: fang, qty: 1, tool: bone_saw, rare: true}
