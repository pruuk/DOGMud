speciesid: 6
name: boar
description: A stocky, bristle-backed beast with curved tusks and a
  foul temper. Boars charge without hesitation and shrug
  off wounds that would fell lesser creatures.
body_parts: [legs, eyes, mouth, skin, tail, horns]
intrinsic_mutations:
  tail: 1
  thick-hide: 1
  dense-muscles: 1
naturalarmor: 5
size: medium
unarmedname: tusks
natural_attack: gore
selectable: false
tameable: true
angrycommands:
  - emote stamps the ground and snorts, lowering its tusks.
  - emote lets out a shrill squeal of rage.
stats:
  strength:
    base: 120
  dexterity:
    base: 70
  perception:
    base: 60
  vitality:
    base: 130
  willpower:
    base: 10
  charisma:
    base: 5
damage:
  basedamage: 6
  variance: 3
damage_multiplier: 0.75
disabledslots: ['weapon', 'offhand', 'head', 'neck', 'belt', 'gloves', 'ring', 'legs', 'feet']
# Wilderness trades: what a carcass gives to skin and butcher. Quantities
# are for a medium body (small halves, large doubles). See species/harvest.go.
harvest:
  skin:
    - {itemid: 40303, qty: 1}                       # boar hide
  butcher:
    - {item: raw-meat, qty: 3}
    - {item: sinew, qty: 1}
    - {item: bone, qty: 2, tool: cleaver}
    - {item: animal-fat, qty: 2, tool: cleaver}
    - {item: tusk, qty: 1, tool: bone_saw, rare: true, chance: 0.4}
    - {itemid: 40258, qty: 1, tool: bone_saw, rare: true, chance: 0.25, min_tool: 3}  # trophy tusks: steel saw or better
