speciesid: 13
name: fish
description: A streamlined aquatic creature that glides through water
  with effortless grace. Most fish flee from danger, but
  some larger specimens can deliver a surprising bite.
body_parts: [eyes, mouth, skin]
size: small
unarmedname: fins
natural_attack: bite
selectable: false
tameable: true
angrycommands:
  - emote thrashes its tail and snaps its jaws.
  - emote circles aggressively, fins flared wide.
stats:
  strength:
    base: 30
  dexterity:
    base: 80
  perception:
    base: 70
  vitality:
    base: 40
  willpower:
    base: 5
  charisma:
    base: 5
damage:
  basedamage: 2
  variance: 1
damage_multiplier: 0.25
disabledslots: ['weapon', 'offhand', 'head', 'neck', 'belt', 'gloves', 'ring', 'legs', 'feet']
# Wilderness trades: what a carcass gives to skin and butcher. Quantities
# are for a medium body (small halves, large doubles). See species/harvest.go.
harvest:
  skin:
    - {item: scales, qty: 2}
  butcher:
    - {item: river-catch, qty: 2}
    - {item: roe, qty: 1, rare: true, chance: 0.3}
