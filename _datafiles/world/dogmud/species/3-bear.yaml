speciesid: 3
name: bear
description: A massive apex predator with thick hide and devastating
  strength. Bears are solitary hunters capable of felling
  trees and crushing bone with a single swipe of their paws.
body_parts: [arms, legs, eyes, mouth, skin]
intrinsic_mutations:
  thick-hide: 1
  dense-muscles: 1
naturalarmor: 8
size: large
unarmedname: claws and teeth
natural_attack: claws
selectable: false
tameable: true
angrycommands:
  - emote rises onto its hind legs and roars, shaking the ground.
  - emote swats the air with a massive paw, claws extended.
stats:
  strength:
    base: 200
  dexterity:
    base: 60
  perception:
    base: 70
  vitality:
    base: 190
  willpower:
    base: 15
  charisma:
    base: 5
damage:
  basedamage: 10
  variance: 4
damage_multiplier: 1.25
disabledslots: ['weapon', 'offhand', 'head', 'neck', 'belt', 'gloves', 'ring', 'legs', 'feet']
# Wilderness trades: what a carcass gives to skin and butcher. Quantities
# are for a medium body (small halves, large doubles). See species/harvest.go.
harvest:
  skin:
    - {item: bear-fur, qty: 1}                      # large: two furs
    - {itemid: 40257, qty: 1, rare: true, chance: 0.3, min_tool: 4}    # great bear pelt: masterwork knife
  butcher:
    - {item: raw-meat, qty: 2}
    - {item: sinew, qty: 1}
    - {item: bone, qty: 2, tool: cleaver}
    - {item: animal-fat, qty: 1, tool: cleaver}
    - {item: claw, qty: 1, tool: bone_saw, rare: true, chance: 0.3}
    - {item: bear-gall, qty: 1, rare: true, chance: 0.1}
