    zones: [Stillwater]
    biomes: [city_thoroughfare, city_backstreet, interior, water, plains]
    exclude_rooms: [4104, 4126, 4137]
    home_room: 4117
    pickup_lines:
      - '{actor} swoops on the {item} and drops it into her clinking net bag.'
