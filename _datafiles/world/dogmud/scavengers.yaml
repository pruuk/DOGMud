  - mobid: 9834  # Widow Sallis
    city: Amber Valley
    zones: [Amber Valley]
    include_rooms: [6055, 6056, 6057, 6058, 6059, 6060, 6061, 6062, 6063, 6064, 6065, 6066, 6067, 6068, 6069, 6070, 6071, 6072, 6073, 6074]
    home_room: 6064
    pickup_lines:
      - '{actor} gleans the {item} into her apron pocket.'
      - '{actor} stoops for the {item}, as she stoops for everything, and it goes in the apron.'
      - '{actor} gathers up the {item} with a gleaner''s practised sweep.'
