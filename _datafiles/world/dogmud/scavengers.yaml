  - mobid: 9832  # Dunn
    city: Hartcharn
    zones: [Hartcharn]
    exclude_rooms: [5407]
    home_room: 5408
    pickup_lines:
      - '{actor} shovels up the {item} and tips it into the barrow he pushes ahead of him.'
