      - '{actor} collects {gold} as a specimen of the local economy.'
    reset_lines:
      - '{actor} delivers the day''s curiosities to the Margin Hall and returns with fresh labels.'
      - '{actor} hands in her satchel of specimens at the Scholars'' Gate and comes back with an empty one.'

  - mobid: 9830  # Penhallow
    city: Greenford
