# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'club'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
optionid: bludgeoning
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You heft your <ansi fg="item">{itemname}</ansi>, readying yourself against <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> hefts their <ansi fg="item">{itemname}</ansi>, readying themselves against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> hefts their <ansi fg="item">{itemname}</ansi>, readying against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You grip your <ansi fg="item">{itemname}</ansi> tightly, eyeing <ansi fg="{acteetype}">{actee}</ansi> for battle.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> grips their weapon tightly, eyes fixed on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly, facing off against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You raise your <ansi fg="item">{itemname}</ansi>, readying a heavy blow.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi> menacingly at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi>, readying a heavy blow at <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'You lock eyes with <ansi fg="{acteetype}">{actee}</ansi>, your <ansi fg="item">{itemname}</ansi> poised to strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> glares at you, <ansi fg="item">{itemname}</ansi> at the ready.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> locks eyes with <ansi fg="{acteetype}">{actee}</ansi>, weapon ready to deliver heavy blows.'
      - actor: 'You take a {stance} stance, {position}, preparing to face <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} stance against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you ready your <ansi fg="item">{itemname}</ansi> with calculated precision!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> with calculated precision, {position}.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>, {position}, readies their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi> warily, <ansi fg="item">{itemname}</ansi> hefted and ready.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you warily, weapon hefted and ready.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> warily, <ansi fg="item">{itemname}</ansi> hefted and ready.'
      master:
      - actor: 'With practiced ease, you adopt a {stance} stance while {position}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a masterful {stance} stance.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> settles into a masterful {stance} stance, facing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Your weapon settles into perfect position, {momentum}, as you face <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s weapon moves into perfect position, a clear threat.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s weapon settles into perfect position, {momentum}, facing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You flow into your {stance} fighting stance with fluid precision and devastating intent.'
        actee: 'With flowing grace, <ansi fg="{actortype}">{actor}</ansi> prepares to deliver crushing blows.'
        observer: 'With practiced precision, <ansi fg="{actortype}">{actor}</ansi> prepares to engage <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: '{momentum}, you read <ansi fg="{acteetype}">{actee}</ansi>''s posture, weapon poised perfectly.'
        actee: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> reads your posture, weapon poised perfectly.'
        observer: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s posture, weapon poised perfectly.'
