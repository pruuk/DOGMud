      - actor: 'You circle around <ansi fg="{acteetype}">{actee}</ansi> uncertainly.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles around you uncertainly.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles around <ansi fg="{acteetype}">{actee}</ansi> uncertainly.'
      expert:
