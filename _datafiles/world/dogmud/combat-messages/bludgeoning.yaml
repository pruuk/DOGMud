        observer: 'While {position}, <ansi fg="{actortype}">{actor}</ansi> anticipates <ansi fg="{acteetype}">{actee}</ansi>''s next move with clarity.'
      - actor: 'Your {stance} training allows you to analyze <ansi fg="{acteetype}">{actee}</ansi> effortlessly.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> analyzes your stance with masterful clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s {stance} training lets them analyze <ansi fg="{acteetype}">{actee}</ansi> effortlessly.'
      - actor: 'Like a predator, you assess <ansi fg="{acteetype}">{actee}</ansi>''s every weakness and vulnerability.'
