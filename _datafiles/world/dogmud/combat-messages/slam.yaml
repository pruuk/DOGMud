# slam: heavy bodies that pound with fists and drive with their weight.
# Used by the earth elemental (37, "stone fists") and the automaton (45,
# "servo-driven fists"); both have arms, legs and skin, and no head, chest or
# shoulder. Lines may name fists, arms, forearms, legs, bulk, mass and weight;
# they name no head, chest, shoulder, feet, breathing or footwork of the actor.
# The value of {itemname}, always a plural "... fists", may be raised, swung,
# smashed or hammered. Every rendered line fits 80 visible columns with
# 20-character names and the longest value of every token.
#
# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'stone fists'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
# {bodypart}    - the defender's body part struck e.g. 'right shoulder'
optionid: slam
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You raise your <ansi fg="item">{itemname}</ansi>, ready to slam into <ansi fg="{acteetype}">{actee}</ansi>.'
