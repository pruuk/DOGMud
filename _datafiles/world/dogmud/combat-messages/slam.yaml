        observer: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You brace your legs and square up to <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> braces their legs and squares up to you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> braces their legs and squares up to <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You shift your bulk toward <ansi fg="{acteetype}">{actee}</ansi>, ready to smash.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> shifts their bulk toward you, ready to smash.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> shifts their bulk toward <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You hunch forward, preparing to barrel into <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> hunches forward, preparing to barrel into you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> hunches forward to barrel into <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'You take a {stance} stance and coil your mass to slam <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance and coils to slam you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'From your {stance} posture, you gauge the distance to <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> gauges the distance to you from a {stance} posture.'
