# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'horns'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
optionid: gore
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You lower your head, leveling your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lowers their <ansi fg="item">{itemname}</ansi> at you menacingly.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lowers their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You paw the ground and snort, preparing to charge <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> paws the ground and snorts, preparing to charge you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> paws the ground, preparing to charge <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You eye <ansi fg="{acteetype}">{actee}</ansi> and toss your <ansi fg="item">{itemname}</ansi> with menace.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> tosses their <ansi fg="item">{itemname}</ansi> and eyes you with fury.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> tosses their <ansi fg="item">{itemname}</ansi> and eyes <ansi fg="{acteetype}">{actee}</ansi> with menace.'
      - actor: 'You lower your <ansi fg="item">{itemname}</ansi> and brace to charge.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> braces, <ansi fg="item">{itemname}</ansi> leveled squarely at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> braces, <ansi fg="item">{itemname}</ansi> leveled squarely at <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'You take a {stance} stance, dipping your <ansi fg="item">{itemname}</ansi> low at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance, dipping their <ansi fg="item">{itemname}</ansi> toward you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance, <ansi fg="item">{itemname}</ansi> aimed at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you plant your hooves and prepare a calculated charge.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> plants their hooves and prepares a calculated charge.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> plants their hooves {position}, preparing a calculated charge at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi> leveled, reading their posture.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you with their <ansi fg="item">{itemname}</ansi> leveled low.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with lowered head and deadly intent.'
      - actor: '{stance}, you angle your <ansi fg="item">{itemname}</ansi> for the perfect hooking strike!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance, angling their <ansi fg="item">{itemname}</ansi> for the perfect hooking strike at you!'
        observer: '<ansi fg="{actortype}">{actor}</ansi>, {stance}, angles their <ansi fg="item">{itemname}</ansi> for the perfect hooking strike at <ansi fg="{acteetype}">{actee}</ansi>.'
      master:
      - actor: 'With predatory calm, you adopt a {stance} stance, {momentum}, horns primed.'
        actee: 'With unsettling calm, <ansi fg="{actortype}">{actor}</ansi> lowers their <ansi fg="item">{itemname}</ansi> to strike.'
        observer: 'With masterful calm, <ansi fg="{actortype}">{actor}</ansi> prepares a devastating charge at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You read <ansi fg="{acteetype}">{actee}</ansi>''s every shift, {momentum}, your {itemname} perfectly angled.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your posture and angles their <ansi fg="item">{itemname}</ansi> perfectly.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s position and angles their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You flow into a masterful charge stance while {position}, waiting for the moment.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into position with their <ansi fg="item">{itemname}</ansi>: a clear and lethal threat.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> flows into a masterful charge stance {position}, waiting for the moment against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: '{momentum}, you lower your <ansi fg="item">{itemname}</ansi> with the precision of a seasoned gorer.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>, {momentum}, lowers their <ansi fg="item">{itemname}</ansi> at you with a seasoned gorer''s precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>, {momentum}, lowers their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi> with a seasoned gorer''s precision.'
  wait:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You snort and paw the ground, watching <ansi fg="{acteetype}">{actee}</ansi> warily.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> snorts and circles you dangerously.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> snorts and paws the ground, watching <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="item">{itemname}</ansi> ready to hook.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> watches you intently, <ansi fg="item">{itemname}</ansi> ready to hook.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with lowered head and dark intent.'
      - actor: 'You watch <ansi fg="{acteetype}">{actee}</ansi> closely, waiting to charge.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> watches you closely, waiting for the moment to charge.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> watches <ansi fg="{acteetype}">{actee}</ansi> closely, waiting for the moment to charge.'
      - actor: 'You stamp and toss your <ansi fg="item">{itemname}</ansi>, biding your time.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> stamps and waits for an opening.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> stamps and tosses their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, biding their time.'
      expert:
      - actor: 'From your {stance} stance, you hold {position}, tracking <ansi fg="{acteetype}">{actee}</ansi>''s footwork.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> low, eyes fixed on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> eyes <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="item">{itemname}</ansi> leveled and ready.'
      - actor: 'While {position}, you feign a charge, probing <ansi fg="{acteetype}">{actee}</ansi>''s reactions.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> feigns a charge, probing your reactions.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> feigns a charge, probing <ansi fg="{acteetype}">{actee}</ansi>''s guard.'
      - actor: 'You pace with lowered head, looking for the perfect angle to gore.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> paces with a lowered head, studying your guard.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> paces with a lowered head, looking for the perfect angle on <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You probe <ansi fg="{acteetype}">{actee}</ansi>''s guard with a short threatening lunge.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> probes your guard with a short, threatening lunge.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> probes <ansi fg="{acteetype}">{actee}</ansi>''s guard with a short, threatening lunge.'
      master:
      - actor: '{momentum}, you read every subtle shift in <ansi fg="{acteetype}">{actee}</ansi>''s footwork.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your every movement with predatory patience.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>, {momentum}, reads every subtle shift in <ansi fg="{acteetype}">{actee}</ansi>''s footwork.'
      - actor: 'While {position}, you anticipate <ansi fg="{acteetype}">{actee}</ansi>''s next step with terrifying clarity.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> analyzes your guard with masterful, terrible clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> analyzes <ansi fg="{acteetype}">{actee}</ansi>''s stance with terrifying stillness.'
      - actor: 'Your {stance} patience lets you analyze <ansi fg="{acteetype}">{actee}</ansi> like a charging beast in wait.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s patient stance lets them analyze you like a beast in wait.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s patient stance lets them analyze <ansi fg="{acteetype}">{actee}</ansi> like a beast in wait.'
      - actor: 'Like a beast before a fatal charge, you assess every weakness in <ansi fg="{acteetype}">{actee}</ansi>''s stance.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s eyes track your footwork like a beast before it charges.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi> like a beast before a killing charge.'
  miss:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You charge at <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>, but miss!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> charges at you with their <ansi fg="item">{itemname}</ansi> but misses.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> charges at <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>, but misses.'
      - actor: 'You hook through empty air with your <ansi fg="item">{itemname}</ansi> as <ansi fg="{acteetype}">{actee}</ansi> sidesteps!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> slashes through the air with their <ansi fg="item">{itemname}</ansi> as you dodge!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> cuts through empty air with their <ansi fg="item">{itemname}</ansi> as <ansi fg="{acteetype}">{actee}</ansi> dodges!'
      - actor: 'You lunge forward but fail to connect with <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lunges at you but fails to connect!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lunges at <ansi fg="{acteetype}">{actee}</ansi> but fails to connect!'
      - actor: 'You charge wildly and find nothing with your <ansi fg="item">{itemname}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> charges wildly and misses entirely!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> charges wildly and misses <ansi fg="{acteetype}">{actee}</ansi> entirely!'
      expert:
      - actor: 'Your calculated charge falls short as <ansi fg="{acteetype}">{actee}</ansi> evades!'
        actee: 'You sidestep <ansi fg="{actortype}">{actor}</ansi>''s calculated charge!'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s calculated charge is evaded by <ansi fg="{acteetype}">{actee}</ansi>!'
      - actor: 'You feint and lunge, but <ansi fg="{acteetype}">{actee}</ansi> reads your approach!'
        actee: 'You anticipate <ansi fg="{actortype}">{actor}</ansi>''s lunge and slip aside!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> anticipates the lunge and sidesteps neatly!'
      - actor: 'Despite your {stance} approach, you hook only air with your <ansi fg="item">{itemname}</ansi>!'
        actee: 'You dodge as <ansi fg="{actortype}">{actor}</ansi>''s {stance} approach finds only air!'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s {stance} approach fails as <ansi fg="{acteetype}">{actee}</ansi> sidesteps their <ansi fg="item">{itemname}</ansi>!'
      - actor: 'Your tactical charge is neatly sidestepped by <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s tactical charge is foiled as you evade!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> counters <ansi fg="{actortype}">{actor}</ansi>''s charge with clean footwork!'
      master:
      - actor: '<ansi fg="{acteetype}">{actee}</ansi>''s unexpected footwork forces your perfect charge wide!'
        actee: 'Your footwork forces <ansi fg="{actortype}">{actor}</ansi>''s perfect charge wide!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi>''s footwork forces the perfect charge wide!'
      - actor: 'Despite flawless timing, <ansi fg="{acteetype}">{actee}</ansi> reads your line and dodges!'
        actee: 'You read <ansi fg="{actortype}">{actor}</ansi>''s line and slip the hook with grace!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> reads the line and slips aside with flowing grace!'
      - actor: 'Your masterful hook finds an equally masterful sidestep!'
        actee: 'Your superior technique turns <ansi fg="{actortype}">{actor}</ansi>''s masterful gore aside!'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s masterful gore meets <ansi fg="{acteetype}">{actee}</ansi>''s equally masterful sidestep!'
      - actor: '{momentum}, your sweeping charge is barely turned aside!'
        actee: 'You barely turn aside <ansi fg="{actortype}">{actor}</ansi>''s {momentum} sweeping charge!'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s {momentum} sweeping charge is barely turned aside by <ansi fg="{acteetype}">{actee}</ansi>!'
  weak:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You graze <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> grazes you with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> grazes <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You catch <ansi fg="{acteetype}">{actee}</ansi> with a glancing hook of your <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> catches you with a glancing hook.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> catches <ansi fg="{acteetype}">{actee}</ansi> with a glancing hook.'
      - actor: 'You barely nick <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>.'
        actee: 'You feel a shallow nick as <ansi fg="{actortype}">{actor}</ansi> barely catches you with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> barely nicks <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You lunge awkwardly, barely catching <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lunges awkwardly, barely catching you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lunges awkwardly, barely catching <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'You dart in and hook <ansi fg="{acteetype}">{actee}</ansi> lightly with your <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> darts in and hooks you lightly.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> darts in and hooks <ansi fg="{acteetype}">{actee}</ansi> lightly.'
      - actor: 'Angling from your {stance} approach, you score a shallow jab.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> angles in from a {stance} approach and scores a shallow jab.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> angles in and scores a shallow jab on <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you feint high and drive low, grazing <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: 'You feel a graze as <ansi fg="{actortype}">{actor}</ansi> feints and drives low.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> feints and drives a glancing hook low, grazing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You probe their guard with a quick toss of your <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> tests your guard with a probing hook.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> tests <ansi fg="{acteetype}">{actee}</ansi>''s guard with a probing hook.'
      - actor: 'Testing their defense, you deliver a glancing hook to <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> flicks a glancing hook at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> tests <ansi fg="{acteetype}">{actee}</ansi>''s defense with a glancing hook.'
      master:
      - actor: 'You draw their guard and catch the {bodypart} with a light hook, {momentum}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> draws your guard and catches your {bodypart} lightly.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> draws <ansi fg="{acteetype}">{actee}</ansi>''s guard and lands a glancing hook.'
      - actor: 'You press forward and nick <ansi fg="{acteetype}">{actee}</ansi> from your {stance} stance.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> presses forward and nicks you from their {stance} stance.'
        observer: 'From a {stance} stance, <ansi fg="{actortype}">{actor}</ansi> presses forward and nicks <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Stepping aside, you flick a short hook at <ansi fg="{acteetype}">{actee}</ansi> with precision.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> steps aside and flicks a short hook with precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> steps aside and flicks a short hook at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You find a small opening and deliver a shallow jab to the {bodypart}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> finds a small opening and delivers a shallow jab.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> finds a small opening and scores a shallow jab on <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'With patient precision, you score a calculated glancing gore.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> scores a calculated glancing gore with patient precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> delivers a calculated glancing gore to <ansi fg="{acteetype}">{actee}</ansi> with patient precision.'
  normal:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You hook into <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> hooks into you with their <ansi fg="item">{itemname}</ansi>!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> hooks into <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
      - actor: 'You gore <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> gores you with their <ansi fg="item">{itemname}</ansi>!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> gores <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
      - actor: 'You tear through <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> tears through you with their <ansi fg="item">{itemname}</ansi>!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> tears through <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>!'
