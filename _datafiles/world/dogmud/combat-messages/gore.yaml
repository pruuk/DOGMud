        actee: '<ansi fg="{actortype}">{actor}</ansi> charges and drives their <ansi fg="item">{itemname}</ansi> into you!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> charges and drives their <ansi fg="item">{itemname}</ansi> into <ansi fg="{acteetype}">{actee}</ansi>!'
      expert:
      - actor: 'You lower and charge, hooking <ansi fg="{acteetype}">{actee}</ansi> cleanly from your {stance} stance!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lowers and charges, hooking you cleanly!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lowers and charges, hooking <ansi fg="{acteetype}">{actee}</ansi> cleanly!'
      - actor: 'Stepping into the charge, you drive your <ansi fg="item">{itemname}</ansi> through <ansi fg="{acteetype}">{actee}</ansi>''s guard!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> drives their <ansi fg="item">{itemname}</ansi> through your guard!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> drives their <ansi fg="item">{itemname}</ansi> through <ansi fg="{acteetype}">{actee}</ansi>''s guard!'
      - actor: 'You pivot and hook decisively, {momentum}!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> pivots and hooks you decisively!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> pivots and hooks <ansi fg="{acteetype}">{actee}</ansi> decisively!'
      - actor: 'While {position}, you feint and sweep your <ansi fg="item">{itemname}</ansi> up in a sharp arc!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> feints and sweeps their <ansi fg="item">{itemname}</ansi> up sharply!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> feints and sweeps their <ansi fg="item">{itemname}</ansi> up at <ansi fg="{acteetype}">{actee}</ansi> sharply!'
      - actor: 'You draw their defense while {momentum} and drive your <ansi fg="item">{itemname}</ansi> low!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> draws your defense and drives their <ansi fg="item">{itemname}</ansi> low!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> draws <ansi fg="{acteetype}">{actee}</ansi>''s defense high and drives their <ansi fg="item">{itemname}</ansi> low!'
