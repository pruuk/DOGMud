# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'fangs'
# {actor}      - name of mob or user e.g. 'wolf'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
optionid: maul
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You bare your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, a low growl building in your throat.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> bares their <ansi fg="item">{itemname}</ansi> at you with a low growl.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> bares their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="item">{itemname}</ansi> gleaming with savage intent.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you, <ansi fg="item">{itemname}</ansi> gleaming dangerously.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="item">{itemname}</ansi> bared and gleaming.'
      - actor: 'You crouch low, <ansi fg="item">{itemname}</ansi> ready to savage <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> crouches low, <ansi fg="item">{itemname}</ansi> ready to tear into you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> crouches low, <ansi fg="item">{itemname}</ansi> ready to tear into <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Your lips curl back, revealing your <ansi fg="item">{itemname}</ansi> in open threat.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s lips curl back, revealing savage <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s lips curl back, baring savage <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'From your {stance} stance, you fix <ansi fg="{acteetype}">{actee}</ansi> with predatory focus, <ansi fg="item">{itemname}</ansi> bared.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> fixes you with predatory focus, <ansi fg="item">{itemname}</ansi> bared.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance, <ansi fg="item">{itemname}</ansi> aimed at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you lower your head and bare your <ansi fg="item">{itemname}</ansi>, reading their guard.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lowers their head and bares their <ansi fg="item">{itemname}</ansi>, reading your guard.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with lowered head and deadly intent.'
      - actor: '{stance}, you stalk forward and bare your <ansi fg="item">{itemname}</ansi> in calculating menace.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> stalks forward with calculating menace, <ansi fg="item">{itemname}</ansi> gleaming.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> stalks toward <ansi fg="{acteetype}">{actee}</ansi> in calculating menace, <ansi fg="item">{itemname}</ansi> bared.'
      - actor: 'You angle for the throat, {momentum}, <ansi fg="item">{itemname}</ansi> primed to savage.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> angles for your throat, {momentum}, <ansi fg="item">{itemname}</ansi> primed to savage.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> angles for <ansi fg="{acteetype}">{actee}</ansi>''s throat, {momentum}, <ansi fg="item">{itemname}</ansi> primed to savage.'
      master:
      - actor: 'With predatory calm, you adopt a {stance} stance, {momentum}, <ansi fg="item">{itemname}</ansi> ready.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles their <ansi fg="item">{itemname}</ansi> into position: a clear and lethal threat.'
        observer: 'With masterful calm, <ansi fg="{actortype}">{actor}</ansi> prepares a savage mauling charge.'
      - actor: 'You read <ansi fg="{acteetype}">{actee}</ansi>''s every shift, {momentum}, <ansi fg="item">{itemname}</ansi> perfectly angled for the kill.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your posture and angles their <ansi fg="item">{itemname}</ansi> for the kill.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s position and angles their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You flow into a masterful pounce-ready stance while {position}, waiting for the moment.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> flows into a masterful pounce-ready stance, waiting for the moment to strike.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> flows into a pounce-ready stance, watching <ansi fg="{acteetype}">{actee}</ansi>, waiting for the moment.'
      - actor: '{momentum}, you lower your head with the focus of a seasoned predator.'
        actee: 'With unsettling calm, <ansi fg="{actortype}">{actor}</ansi> lowers their head to strike.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lowers their head, {momentum}, with the focus of a seasoned predator.'
  wait:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You stalk <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="item">{itemname}</ansi> dripping in anticipation.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> growls and circles you dangerously.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with lowered head and dark intent.'
      - actor: 'You growl low, watching <ansi fg="{acteetype}">{actee}</ansi> for an opening.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> watches you intently, <ansi fg="item">{itemname}</ansi> ready to bite.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> growls and stalks <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You watch <ansi fg="{acteetype}">{actee}</ansi> closely, waiting to savage.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> paces around you, waiting for an opening.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> paces around <ansi fg="{acteetype}">{actee}</ansi>, watching closely, waiting to savage.'
      - actor: 'You pace and bristle, biding your time.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> paces and bristles, biding their time.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> paces and bristles, biding their time.'
      expert:
      - actor: 'From your {stance} stance, you hold {position}, tracking <ansi fg="{acteetype}">{actee}</ansi>''s footwork.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> low, eyes fixed on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> eyes <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="item">{itemname}</ansi> bared and ready.'
      - actor: 'While {position}, you feign a lunge, probing <ansi fg="{acteetype}">{actee}</ansi>''s reactions.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> feigns a lunge, probing your reactions.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> feigns a lunge, probing <ansi fg="{acteetype}">{actee}</ansi>''s guard.'
      - actor: 'You pace with lowered head, looking for the perfect angle to savage.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> paces with a lowered head, studying your guard.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> paces with a lowered head, looking for the perfect angle to savage.'
      - actor: 'You probe <ansi fg="{acteetype}">{actee}</ansi>''s guard with a short threatening snap of your <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> probes your guard with a short threatening snap of their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> probes <ansi fg="{acteetype}">{actee}</ansi>''s guard with a short threatening snap of their <ansi fg="item">{itemname}</ansi>.'
      master:
      - actor: '{momentum}, you read every subtle shift in <ansi fg="{acteetype}">{actee}</ansi>''s footwork.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your every movement with predatory patience.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads every subtle shift in <ansi fg="{acteetype}">{actee}</ansi>''s footwork, {momentum}.'
      - actor: 'While {position}, you anticipate <ansi fg="{acteetype}">{actee}</ansi>''s next step with terrifying clarity.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> analyzes your guard with masterful, terrible clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> anticipates <ansi fg="{acteetype}">{actee}</ansi>''s next step with terrifying clarity.'
      - actor: 'Your {stance} patience lets you analyze <ansi fg="{acteetype}">{actee}</ansi> like a beast before the killing bite.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> analyzes you with patient stillness, like a beast before the killing bite.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi> like a beast before a killing bite.'
      - actor: 'Like a wolf before a fatal lunge, you assess every weakness in <ansi fg="{acteetype}">{actee}</ansi>''s stance.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s eyes track your footwork like a wolf before it charges.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> analyzes <ansi fg="{acteetype}">{actee}</ansi>''s stance with terrifying stillness.'
