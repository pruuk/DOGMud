# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'stinger'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
optionid: sting
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You flex your <ansi fg="item">{itemname}</ansi> menacingly at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> flexes their <ansi fg="item">{itemname}</ansi> menacingly at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> flexes their <ansi fg="item">{itemname}</ansi> menacingly at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You curl your <ansi fg="item">{itemname}</ansi> overhead, ready to strike at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi> overhead, ready to plunge it into you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi>, facing off against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You rear back, <ansi fg="item">{itemname}</ansi> poised to inject venom into <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> rears back, <ansi fg="item">{itemname}</ansi> poised to inject venom into you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> rears back, <ansi fg="item">{itemname}</ansi> poised to inject venom into <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'You lock eyes with <ansi fg="{acteetype}">{actee}</ansi>, your <ansi fg="item">{itemname}</ansi> trembling with venom.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> glares at you, <ansi fg="item">{itemname}</ansi> quivering with venom.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> locks eyes with <ansi fg="{acteetype}">{actee}</ansi>, barb ready to strike.'
      - actor: 'You take a {stance} stance, {position}, preparing to face <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} stance against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you coil your <ansi fg="item">{itemname}</ansi> in a {stance} guard!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> coils their <ansi fg="item">{itemname}</ansi> in a {stance} guard.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> coils their <ansi fg="item">{itemname}</ansi> in a {stance} guard against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi> warily, <ansi fg="item">{itemname}</ansi> arched and ready to plunge.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you with deadly, coiled precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> warily, barb arched and ready to plunge.'
      master:
      - actor: 'With practiced ease, you adopt a {stance} stance while {position}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a masterful {stance} stance.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> adopts a masterful {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You settle your <ansi fg="item">{itemname}</ansi> into perfect striking position, {momentum}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> arches their <ansi fg="item">{itemname}</ansi> into perfect position, a lethal threat.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> settles their <ansi fg="item">{itemname}</ansi> into perfect striking position against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You flow into your {stance} fighting stance with lethal, coiled precision.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> flows into a {stance} fighting stance with lethal, coiled precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> flows into a {stance} fighting stance, coiled to strike at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: '{momentum}, you read <ansi fg="{acteetype}">{actee}</ansi>''s every opening, barb poised to inject.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your every opening, barb poised to inject.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s every opening, barb poised to inject.'
  wait:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You watch <ansi fg="{acteetype}">{actee}</ansi> closely, waiting for the perfect moment to strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> watches you intently, waiting to sting.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> watches <ansi fg="{acteetype}">{actee}</ansi> closely, waiting to strike.'
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi> slowly, <ansi fg="item">{itemname}</ansi> arched overhead.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles dangerously, barb overhead.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with barbed menace.'
      - actor: 'You hesitate, looking for an unguarded moment to inject your venom.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> stalks about, looking for an opening to inject venom.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> stalks around <ansi fg="{acteetype}">{actee}</ansi>, awaiting an opening.'
      - actor: 'You stalk around <ansi fg="{acteetype}">{actee}</ansi>, barb trembling with anticipation.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> stalks around you, barb trembling with anticipation.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> stalks around <ansi fg="{acteetype}">{actee}</ansi>, barb trembling with anticipation.'
      expert:
      - actor: 'From your {stance} stance, you stand {position}, eyeing <ansi fg="{acteetype}">{actee}</ansi> for weakness.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> ready, eyes fixed on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> eyes <ansi fg="{acteetype}">{actee}</ansi> warily, barb poised to strike.'
      - actor: 'While {position}, you adopt a {stance} posture, coiled to lunge at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} posture, coiled to lunge at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} posture, coiled to lunge at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You probe <ansi fg="{acteetype}">{actee}</ansi>''s defenses, seeking an opening to inject your venom.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> probes your defenses with calculated patience.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> probes for weakness in <ansi fg="{acteetype}">{actee}</ansi>''s guard.'
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi> with predatory patience, {momentum}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you with venomous, tactical intent.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with predatory patience.'
      master:
      - actor: '{momentum}, you read every subtle shift in <ansi fg="{acteetype}">{actee}</ansi>''s posture.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your every movement with unsettling precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads every subtle shift in <ansi fg="{acteetype}">{actee}</ansi>''s posture.'
      - actor: 'While {position}, you anticipate <ansi fg="{acteetype}">{actee}</ansi>''s next move with clarity.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s eyes track your every shift like a predator.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> anticipates <ansi fg="{acteetype}">{actee}</ansi>''s next move with clarity.'
      - actor: 'Your {stance} training lets you analyze <ansi fg="{acteetype}">{actee}</ansi> like prey.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s {stance} training lets them analyze you like prey.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi> like helpless prey.'
      - actor: 'Like a venomous predator, you assess every vulnerability in <ansi fg="{acteetype}">{actee}</ansi>''s guard.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> analyzes your guard with masterful, venomous clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> analyzes <ansi fg="{acteetype}">{actee}</ansi> with venomous, predatory precision.'
  miss:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You jab your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, but miss!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> jabs their <ansi fg="item">{itemname}</ansi> at you, but misses.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> jabs their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, but misses.'
      - actor: 'Your sting arcs through the air as <ansi fg="{acteetype}">{actee}</ansi> dodges!'
        actee: '<ansi fg="{actortype}">{actor}''s</ansi> barb slices through the air as you dodge!'
        observer: '<ansi fg="{actortype}">{actor}''s</ansi> barb slices through the air as <ansi fg="{acteetype}">{actee}</ansi> dodges!'
      - actor: 'You lunge at <ansi fg="{acteetype}">{actee}</ansi> with your barb, but fail to connect!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lunges their stinger at you, but fails to connect!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lunges at <ansi fg="{acteetype}">{actee}</ansi> but fails to connect.'
      - actor: 'You stab wildly with your <ansi fg="item">{itemname}</ansi> and find only empty air!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> stabs wildly with their <ansi fg="item">{itemname}</ansi> and finds only empty air.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> stabs wildly at <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi> and finds only empty air.'
      expert:
      - actor: 'Your calculated strike misses as <ansi fg="{acteetype}">{actee}</ansi> evades!'
        actee: 'You evade <ansi fg="{actortype}">{actor}</ansi>''s calculated strike!'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s calculated sting is evaded by <ansi fg="{acteetype}">{actee}</ansi>!'
      - actor: 'You feint and lunge, but <ansi fg="{acteetype}">{actee}</ansi> anticipates your sting!'
        actee: 'You anticipate <ansi fg="{actortype}">{actor}</ansi>''s feint and avoid their plunge!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> anticipates the feint and avoids the plunge!'
      - actor: 'Despite your {stance} approach, your barb finds only air!'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s {stance} approach fails as their barb finds only air!'
        observer: '<ansi fg="{actortype}">{actor}''s</ansi> {stance} approach on <ansi fg="{acteetype}">{actee}</ansi> fails as their barb finds only air!'
      - actor: 'Your tactical jab is countered expertly by <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}''s</ansi> tactical approach fails as you counter expertly!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> counters <ansi fg="{actortype}">{actor}</ansi>''s tactical barb!'
      master:
      - actor: '<ansi fg="{acteetype}">{actee}</ansi>''s unexpected skill forces your perfect sting wide!'
        actee: 'Your masterful defense forces <ansi fg="{actortype}">{actor}</ansi>''s perfect sting wide!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi>''s masterful defense forces the perfect sting wide!'
      - actor: 'Despite flawless execution, <ansi fg="{acteetype}">{actee}</ansi> reads your intent and evades!'
        actee: 'You read <ansi fg="{actortype}">{actor}</ansi>''s intent and evade with fluid grace!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> reads the intent and evades with fluid grace!'
      - actor: 'Your masterful lunge meets an equally masterful defense!'
        actee: 'Your masterful defense meets <ansi fg="{actortype}">{actor}</ansi>''s equally masterful lunge!'
        observer: '<ansi fg="{actortype}">{actor}''s</ansi> masterful lunge meets <ansi fg="{acteetype}">{actee}</ansi>''s equally masterful defense!'
      - actor: '{momentum}, your flowing strike is barely deflected away!'
        actee: 'Your superior technique deflects <ansi fg="{actortype}">{actor}</ansi>''s venomous lunge!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> barely deflects <ansi fg="{actortype}">{actor}''s</ansi> flowing strike away.'
  weak:
    # messages for when they are in the same room
