# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'pseudopods'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
# {bodypart}    - the actee's body part that is hit e.g. 'left hand'
#
# Used by the amorphous species: slime ('pseudopods') and fungal colony
# ('spore tendrils'). Every line must read right for both. They whip, lash,
# coil, smother, engulf, cling and splatter. The actor has skin only: no line
# names a limb, a sense organ or any body part other than the {itemname}, and
# no line has them breathe, look or step. The body-part guard forbids the
# word list it names, in comments too. Both names are plural body-part
# nouns, yet no verb follows the weapon (#455): the actor lashes, stretches
# or coils their {itemname}.
# Every rendered line fits 80 visible columns with 20-character names.
optionid: lash
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You quiver and stretch your <ansi fg="item">{itemname}</ansi> toward <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> quivers and stretches their <ansi fg="item">{itemname}</ansi> toward you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> quivers and reaches out toward <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You bunch up your soft mass, ready to lash at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> bunches up their soft mass, ready to lash at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> bunches up, ready to lash at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You ripple and swell, ready to engulf <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> ripples and swells, ready to engulf you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> ripples and swells, ready to engulf <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You sway your <ansi fg="item">{itemname}</ansi> slowly toward <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> sways their <ansi fg="item">{itemname}</ansi> slowly toward you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> sways their <ansi fg="item">{itemname}</ansi> toward <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'You coil your <ansi fg="item">{itemname}</ansi> in a {stance} stance, ready to strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> coils their <ansi fg="item">{itemname}</ansi>, aimed at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> coils their <ansi fg="item">{itemname}</ansi>, aimed at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'From your {stance} posture, you gauge the reach to <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> gauges their reach to you from a {stance} posture.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> gauges their reach to <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You spread wide, hemming <ansi fg="{acteetype}">{actee}</ansi> in.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> spreads wide, hemming you in.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> spreads wide, hemming <ansi fg="{acteetype}">{actee}</ansi> in.'
      - actor: 'While {position}, you pulse slowly toward <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> pulses slowly toward you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> pulses slowly toward <ansi fg="{acteetype}">{actee}</ansi>.'
      master:
      - actor: 'You settle into a {stance} stance, {position}, utterly still.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a {stance} stance, utterly still.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> settles, utterly still, before <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {momentum}, you sense every tremor of <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> senses your every tremor with eerie precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> senses every tremor of <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You draw your <ansi fg="item">{itemname}</ansi> in tight, ready to engulf <ansi fg="{acteetype}">{actee}</ansi>.'
