        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you ready your <ansi fg="item">{itemname}</ansi> in a {stance} posture!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds a {stance} posture while {position}, blade ready.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> holds a {stance} posture while {position}, facing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi> warily, <ansi fg="item">{itemname}</ansi> at the ready.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you warily, blade ready.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> warily, blade at the ready.'
      master:
      - actor: 'With practiced ease, you adopt a {stance} stance while {position}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a masterful {stance} stance.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> settles into a masterful {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Your blade settles into perfect position, {momentum}, as you face <ansi fg="{acteetype}">{actee}</ansi>.'
