  # U5c: sent when a hit lands on a target that is ALREADY DYING; it has taken
  # its lethal blow and the attributed death is queued but not yet resolved.
  # These fire instead of ordinary hit text, and never alongside a second kill
  # announcement: the killing blow is announced exactly once, by whoever landed
  # it. Any weapon file may define its own coupdegrace block to override this.
  coupdegrace:
    together:
      beginner:
      - actor: 'You strike <ansi fg="{acteetype}">{actee}</ansi> again, past any need for it.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> strikes you as you fall.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> keeps striking <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
      - actor: 'You drive your <ansi fg="item">{itemname}</ansi> down into <ansi fg="{acteetype}">{actee}</ansi> once more.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> drives their <ansi fg="item">{itemname}</ansi> down into you once more.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> drives their <ansi fg="item">{itemname}</ansi> down into <ansi fg="{acteetype}">{actee}</ansi> once more.'
      expert:
      - actor: '<ansi fg="{acteetype}">{actee}</ansi> is already falling. You strike anyway.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> strikes you again as you fall.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> keeps striking <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
      - actor: 'You hammer <ansi fg="{acteetype}">{actee}</ansi> down with your <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> hammers you down with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> hammers <ansi fg="{acteetype}">{actee}</ansi> down with their <ansi fg="item">{itemname}</ansi>.'
      master:
      - actor: 'You bear <ansi fg="{acteetype}">{actee}</ansi> to the ground under a final flurry.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> bears you down under a final flurry.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> batters <ansi fg="{acteetype}">{actee}</ansi> to the ground.'
      - actor: 'Your <ansi fg="item">{itemname}</ansi> finds <ansi fg="{acteetype}">{actee}</ansi> again, and again after that.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi> finds you again, and again after that.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi> finds <ansi fg="{acteetype}">{actee}</ansi> again, and again after that.'
    separate:
      beginner:
      - actor: 'Your shot finds <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        actee: 'A shot from the {entrancename} finds you as you fall.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> fires on <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        remote_observer: 'A shot from the {entrancename} strikes <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
      expert:
      - actor: 'Your shot finds <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        actee: 'A shot from the {entrancename} finds you as you fall.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> fires on <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        remote_observer: 'A shot from the {entrancename} strikes <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
      master:
      - actor: 'Your shot punches into <ansi fg="{acteetype}">{actee}</ansi> as they go down.'
        actee: 'A shot from the {entrancename} punches into you as you go down.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> puts another shot into <ansi fg="{acteetype}">{actee}</ansi> as they go down.'
        remote_observer: 'A shot from the {entrancename} puts <ansi fg="{acteetype}">{actee}</ansi> down for good.'
