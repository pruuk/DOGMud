  # These fire instead of ordinary hit text, and never alongside a second kill
  # announcement: the killing blow is announced exactly once, by whoever landed
  # it. Any weapon file may define its own coupdegrace block to override this.
  coupdegrace:
    together:
      actor:
        beginner:
        - 'You strike <ansi fg="{acteetype}">{actee}</ansi> again, past any need for it.'
        - 'You drive your <ansi fg="item">{itemname}</ansi> down into <ansi fg="{acteetype}">{actee}</ansi> once more.'
        expert:
        - '<ansi fg="{acteetype}">{actee}</ansi> is already falling. You strike anyway.'
        - 'You hammer <ansi fg="{acteetype}">{actee}</ansi> down with your <ansi fg="item">{itemname}</ansi>.'
        master:
        - 'You bear <ansi fg="{acteetype}">{actee}</ansi> to the ground under a final flurry.'
        - 'Your <ansi fg="item">{itemname}</ansi> finds <ansi fg="{acteetype}">{actee}</ansi> again, and again after that.'
      actee:
        beginner:
        - '<ansi fg="{actortype}">{actor}</ansi> strikes you as you fall.'
        - '<ansi fg="{actortype}">{actor}</ansi> drives their <ansi fg="item">{itemname}</ansi> down into you once more.'
        expert:
        - '<ansi fg="{actortype}">{actor}</ansi> strikes you again as you fall.'
        - '<ansi fg="{actortype}">{actor}</ansi> hammers you down with their <ansi fg="item">{itemname}</ansi>.'
        master:
        - '<ansi fg="{actortype}">{actor}</ansi> bears you down under a final flurry.'
        - '<ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi> finds you again, and again after that.'
      observer:
        beginner:
        - '<ansi fg="{actortype}">{actor}</ansi> keeps striking <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        - '<ansi fg="{actortype}">{actor}</ansi> drives their <ansi fg="item">{itemname}</ansi> down into <ansi fg="{acteetype}">{actee}</ansi> once more.'
        expert:
        - '<ansi fg="{actortype}">{actor}</ansi> keeps striking <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        - '<ansi fg="{actortype}">{actor}</ansi> hammers <ansi fg="{acteetype}">{actee}</ansi> down with their <ansi fg="item">{itemname}</ansi>.'
        master:
        - '<ansi fg="{actortype}">{actor}</ansi> batters <ansi fg="{acteetype}">{actee}</ansi> to the ground.'
        - '<ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi> finds <ansi fg="{acteetype}">{actee}</ansi> again, and again after that.'
    separate:
      actor:
        beginner:
        - 'Your shot finds <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        expert:
        - 'Your shot finds <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        master:
        - 'Your shot punches into <ansi fg="{acteetype}">{actee}</ansi> as they go down.'
      actee:
        beginner:
        - 'A shot from the {entrancename} finds you as you fall.'
        expert:
        - 'A shot from the {entrancename} finds you as you fall.'
        master:
        - 'A shot from the {entrancename} punches into you as you go down.'
      observer:
        beginner:
        - '<ansi fg="{actortype}">{actor}</ansi> fires on <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        expert:
        - '<ansi fg="{actortype}">{actor}</ansi> fires on <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        master:
        - '<ansi fg="{actortype}">{actor}</ansi> puts another shot into <ansi fg="{acteetype}">{actee}</ansi> as they go down.'
      remote_observer:
        beginner:
        - 'A shot from the {entrancename} strikes <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        expert:
        - 'A shot from the {entrancename} strikes <ansi fg="{acteetype}">{actee}</ansi> as they fall.'
        master:
        - 'A shot from the {entrancename} puts <ansi fg="{acteetype}">{actee}</ansi> down for good.'
