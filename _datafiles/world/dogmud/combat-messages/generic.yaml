        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your stance and strikes with precision!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s stance and strikes with precision!'
      - actor: 'You exploit an opening and hit decisively!'
