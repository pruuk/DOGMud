# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
optionid: generic
options:
  prepare:
    together:
      beginner:
      - actor: 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You grip your <ansi fg="item">{itemname}</ansi> tightly, readying yourself against <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly, readying against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly, facing off against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You raise your <ansi fg="item">{itemname}</ansi>, facing <ansi fg="{acteetype}">{actee}</ansi> nervously.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi> menacingly at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi>, facing <ansi fg="{acteetype}">{actee}</ansi> menacingly.'
      expert:
      - actor: 'You lock eyes with <ansi fg="{acteetype}">{actee}</ansi>, your <ansi fg="item">{itemname}</ansi> poised to strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> glares at you, <ansi fg="item">{itemname}</ansi> at the ready.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> locks eyes with <ansi fg="{acteetype}">{actee}</ansi>, weapon ready to strike.'
      - actor: 'You take a {stance} stance, {position}, preparing to face <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} stance against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance, preparing to face <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you ready your <ansi fg="item">{itemname}</ansi> in a {stance} posture!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> in a {stance} posture against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> in a {stance} posture against <ansi fg="{acteetype}">{actee}</ansi>.'
      master:
      - actor: 'With practiced ease, you adopt a {stance} stance while {position}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a masterful {stance} stance.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> adopts a masterful {stance} stance, facing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Your weapon settles into perfect position, {momentum}, as you face <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s weapon settles into perfect position, {momentum}, as they face you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s weapon settles into place, {momentum}, as they face <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You flow into your {stance} fighting stance with fluid precision.'
        actee: 'With flowing grace, <ansi fg="{actortype}">{actor}</ansi> prepares to attack.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> flows into a {stance} stance with fluid precision, facing <ansi fg="{acteetype}">{actee}</ansi>.'
  wait:
    together:
      beginner:
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi> dangerously, with cruel intentions.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles dangerously.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with cruel intentions.'
      - actor: 'You watch <ansi fg="{acteetype}">{actee}</ansi> closely, waiting for the perfect moment.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> watches you intently, waiting to strike.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> watches <ansi fg="{acteetype}">{actee}</ansi> intently, waiting to strike.'
      expert:
      - actor: 'You circle around <ansi fg="{acteetype}">{actee}</ansi>, looking for an opening.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles around you, looking for an opening.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi>, looking for an opening.'
      - actor: 'From your {stance} stance, you stand {position}, eyeing <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> steady, eyes fixed on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> eyes <ansi fg="{acteetype}">{actee}</ansi> warily, ready to strike.'
      master:
      - actor: '{momentum}, you read every subtle shift in <ansi fg="{acteetype}">{actee}</ansi>''s posture.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your every movement with unsettling precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi> like an open book.'
      - actor: 'While {position}, you anticipate <ansi fg="{acteetype}">{actee}</ansi>''s next move with clarity.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> anticipates your next move with unsettling clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> anticipates <ansi fg="{acteetype}">{actee}</ansi>''s next move with clarity.'
  miss:
    together:
      beginner:
      - actor: 'You swing at <ansi fg="{acteetype}">{actee}</ansi> but miss!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> swings wildly, missing you entirely!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> swings at <ansi fg="{acteetype}">{actee}</ansi> but misses!'
      - actor: 'Your attack misses <ansi fg="{acteetype}">{actee}</ansi> completely!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> misses you completely!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> misses <ansi fg="{acteetype}">{actee}</ansi> completely!'
      expert:
      - actor: 'Your calculated strike misses as <ansi fg="{acteetype}">{actee}</ansi> evades!'
        actee: 'You evade <ansi fg="{actortype}">{actor}</ansi>''s calculated strike!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> evades <ansi fg="{actortype}">{actor}</ansi>''s calculated strike!'
      - actor: 'Despite your {stance} approach, your attack finds only air!'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s {stance} approach finds only air against you!'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s {stance} approach finds only air where <ansi fg="{acteetype}">{actee}</ansi> stood!'
      master:
      - actor: '<ansi fg="{acteetype}">{actee}</ansi>''s unexpected skill forces your perfect strike wide!'
        actee: 'Your masterful defense forces <ansi fg="{actortype}">{actor}</ansi>''s perfect strike wide!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi>''s masterful defense forces the strike wide!'
      - actor: '{momentum}, your flowing attack is barely parried away!'
        actee: '<ansi fg="{actortype}">{actor}</ansi>, {momentum}, sends a flowing attack you barely parry away!'
        observer: '<ansi fg="{actortype}">{actor}</ansi>, {momentum}, sends a flowing attack that <ansi fg="{acteetype}">{actee}</ansi> barely parries away!'
  weak:
    together:
      beginner:
      - actor: 'You hit <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> hits you with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> hits <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Your <ansi fg="item">{itemname}</ansi> grazes <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> grazes you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi> grazes <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'You step forward and strike <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> steps in and strikes you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> steps forward and strikes <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Circling left, you score a shallow hit on <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles left and scores a shallow hit on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles left and scores a shallow hit on <ansi fg="{acteetype}">{actee}</ansi>.'
      master:
      - actor: 'You draw their defense and land a light strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> draws out your defense and lands a light strike.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> draws out <ansi fg="{acteetype}">{actee}</ansi>''s defense and lands a light strike.'
      - actor: 'You find a small opening and deliver a shallow strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> finds a small opening and strikes you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> finds a small opening and strikes <ansi fg="{acteetype}">{actee}</ansi>.'
  normal:
