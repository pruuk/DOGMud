        observer: '<ansi fg="{actortype}">{actor}</ansi> is {momentum} as their weapon hits <ansi fg="{acteetype}">{actee}</ansi>!'
      - actor: 'You strike <ansi fg="{acteetype}">{actee}</ansi> squarely in the {bodypart}!'
