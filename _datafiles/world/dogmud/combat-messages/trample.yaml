        actee: '<ansi fg="{actortype}">{actor}</ansi> surges forward and strikes you with a clean forehoof!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> surges forward and strikes <ansi fg="{acteetype}">{actee}</ansi> cleanly!'
