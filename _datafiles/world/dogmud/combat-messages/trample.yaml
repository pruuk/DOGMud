        actee: '<ansi fg="{actortype}">{actor}</ansi> barges at you, but you step aside!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> barges at <ansi fg="{acteetype}">{actee}</ansi>, who steps aside!'
