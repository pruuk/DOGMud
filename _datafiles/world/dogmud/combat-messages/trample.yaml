      - actor: 'You dart in and nip <ansi fg="{acteetype}">{actee}</ansi>, then back off.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> darts in and nips you, then backs off.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> darts in and nips <ansi fg="{acteetype}">{actee}</ansi>, then backs off.'
