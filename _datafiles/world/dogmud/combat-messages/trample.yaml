        actee: '<ansi fg="{actortype}">{actor}</ansi> draws your guard aside and kicks through it!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> draws <ansi fg="{acteetype}">{actee}</ansi>''s guard aside and kicks through!'
      - actor: 'Reading <ansi fg="{acteetype}">{actee}</ansi>''s stance, you stamp down with purposeful weight!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your stance and stamps down with purposeful weight!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s stance and stamps down hard!'
      master:
      - actor: 'You press in with a sweeping kick while {momentum}!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> presses in with a sweeping kick at you!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> presses in with a sweeping kick at <ansi fg="{acteetype}">{actee}</ansi>!'
