        actee: '<ansi fg="{actortype}">{actor}</ansi> stamps clumsily and barely hits you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> stamps clumsily and barely hits <ansi fg="{acteetype}">{actee}</ansi>.'
