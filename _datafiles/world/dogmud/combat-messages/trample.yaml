      - actor: 'You score a careful, light hit on <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> scores a careful, light hit on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> scores a careful, light hit on <ansi fg="{acteetype}">{actee}</ansi>.'
  normal:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You kick <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> kicks you with their <ansi fg="item">{itemname}</ansi>!'
