        observer: '<ansi fg="{acteetype}">{actee}</ansi> slides clear of <ansi fg="{actortype}">{actor}</ansi>''s lunge!'
      - actor: 'Despite your {stance} approach, you strike only the ground with your <ansi fg="item">{itemname}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> strikes the ground beside you with their <ansi fg="item">{itemname}</ansi>!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> stamps the ground beside <ansi fg="{acteetype}">{actee}</ansi>!'
      - actor: 'Your powerful kick only just misses <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s powerful kick only just misses you!'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s powerful kick only just misses <ansi fg="{acteetype}">{actee}</ansi>!'
      master:
      - actor: '<ansi fg="{acteetype}">{actee}</ansi>''s sudden sidestep sends your perfect kick wide!'
        actee: 'Your sudden sidestep sends <ansi fg="{actortype}">{actor}</ansi>''s perfect kick wide!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi>''s sidestep sends <ansi fg="{actortype}">{actor}</ansi>''s perfect kick wide!'
      - actor: 'Your timing is flawless, but <ansi fg="{acteetype}">{actee}</ansi> reads it and steps clear!'
        actee: 'You read <ansi fg="{actortype}">{actor}</ansi>''s flawless timing and step clear!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> reads <ansi fg="{actortype}">{actor}</ansi>''s timing and steps clear!'
      - actor: 'You lash out with both hind legs, but <ansi fg="{acteetype}">{actee}</ansi> twists away!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lashes out with both hind legs, but you twist away!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> twists away from <ansi fg="{actortype}">{actor}</ansi>''s double kick!'
      - actor: 'Your perfect strike meets <ansi fg="{acteetype}">{actee}</ansi>''s equally perfect retreat!'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s perfect strike meets your equally perfect retreat!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> retreats just ahead of <ansi fg="{actortype}">{actor}</ansi>''s strike!'
  weak:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You glance off <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> glances off you with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> glances off <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You bump <ansi fg="{acteetype}">{actee}</ansi> with your chest, barely moving them.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> bumps you with their chest, barely moving you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> bumps <ansi fg="{acteetype}">{actee}</ansi> with their chest.'
      - actor: 'Your weak kick only grazes <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s weak kick only grazes you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s weak kick only grazes <ansi fg="{acteetype}">{actee}</ansi>.'
