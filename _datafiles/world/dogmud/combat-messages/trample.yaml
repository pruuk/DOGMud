        observer: '<ansi fg="{actortype}">{actor}</ansi> stamps down hard, but <ansi fg="{acteetype}">{actee}</ansi> is not there!'
      - actor: 'Your clumsy kick swings wide of <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s clumsy kick swings wide of you!'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s clumsy kick swings wide of <ansi fg="{acteetype}">{actee}</ansi>!'
      expert:
      - actor: 'Your {stance} kick misses as <ansi fg="{acteetype}">{actee}</ansi> reads it coming!'
        actee: 'You read <ansi fg="{actortype}">{actor}</ansi>''s kick coming and slip aside!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> reads <ansi fg="{actortype}">{actor}</ansi>''s kick and slips aside!'
      - actor: 'You drive your weight forward, but <ansi fg="{acteetype}">{actee}</ansi> slides out of reach!'
