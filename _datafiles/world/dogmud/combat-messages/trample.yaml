        actee: '<ansi fg="{actortype}">{actor}</ansi> lands a testing kick on you from their {stance} stance.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lands a testing kick on <ansi fg="{acteetype}">{actee}</ansi>.'
