# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'hooves'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
# {bodypart}    - the body part struck on the actee e.g. 'right shoulder'
#
# Used by: horse (species 26, unarmedname 'hooves'). Lines kick, rear,
# stamp, trample and barge with bulk. They may name the attacker's hooves,
# legs, head, chest, flank and tail, and no other attacker body part (no
# hands, fists, shoulders or feet). The actee's body is named only through
# {bodypart}. Every rendered line fits 80 visible columns with 20-character
# names and the longest value of every token.
optionid: trample
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You stamp a hoof and neigh loudly at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> stamps a hoof and neighs loudly at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> stamps a hoof and neighs loudly at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You toss your head and paw at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> tosses their head and paws at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> tosses their head and paws at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You turn your flank to <ansi fg="{acteetype}">{actee}</ansi>, ready to kick.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> turns their flank to you, ready to kick.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> turns their flank to <ansi fg="{acteetype}">{actee}</ansi>, ready to kick.'
      - actor: 'You rear up over <ansi fg="{acteetype}">{actee}</ansi>, your <ansi fg="item">{itemname}</ansi> raised to strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> rears up over you, <ansi fg="item">{itemname}</ansi> raised to strike!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> rears up over <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="item">{itemname}</ansi> raised.'
      expert:
      - actor: 'You sink onto your hind legs, facing <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> sinks onto their hind legs, facing you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> sinks onto their hind legs, facing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'From your {stance} stance, you measure your reach to <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> measures their reach to you with a cold eye.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> measures their reach to <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You lower your head and plant your <ansi fg="item">{itemname}</ansi>, eyes on <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lowers their head and plants their <ansi fg="item">{itemname}</ansi>, eyes on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lowers their head, eyes on <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You tense every leg, ready to kick <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> tenses every leg, ready to kick you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> tenses every leg, ready to kick <ansi fg="{acteetype}">{actee}</ansi>.'
      master:
      - actor: 'You stand square to <ansi fg="{acteetype}">{actee}</ansi>, weight balanced on all four <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> stands square to you, weight balanced on all four <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> stands square to <ansi fg="{acteetype}">{actee}</ansi>, perfectly balanced.'
      - actor: 'You read <ansi fg="{acteetype}">{actee}</ansi>''s balance and shift your weight to your forelegs.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your balance and shifts their weight forward.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s balance and shifts forward.'
      - actor: 'Your {stance} stance is set, your <ansi fg="item">{itemname}</ansi> ready to strike <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> sets their {stance} stance, <ansi fg="item">{itemname}</ansi> ready to strike you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> sets their {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Staying {momentum}, you choose where to land your <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> studies you, choosing where to land their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> studies <ansi fg="{acteetype}">{actee}</ansi>, choosing where to strike.'
  wait:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You swish your tail, watching <ansi fg="{acteetype}">{actee}</ansi> warily.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> swishes their tail, watching you warily.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> swishes their tail, watching <ansi fg="{acteetype}">{actee}</ansi> warily.'
      - actor: 'You shift from hoof to hoof, eyeing <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> shifts from hoof to hoof, eyeing you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> shifts from hoof to hoof, eyeing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You snort loudly, biding your time.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> snorts loudly, biding their time.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> snorts loudly at <ansi fg="{acteetype}">{actee}</ansi>, biding their time.'
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi> slowly, your <ansi fg="item">{itemname}</ansi> thudding on the ground.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you slowly, <ansi fg="item">{itemname}</ansi> thudding on the ground.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> slowly, <ansi fg="item">{itemname}</ansi> thudding.'
      expert:
      - actor: 'From your {stance} stance, you watch how <ansi fg="{acteetype}">{actee}</ansi> moves.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> watches how you move from their {stance} stance.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> watches how <ansi fg="{acteetype}">{actee}</ansi> moves, patient and still.'
      - actor: 'While {position}, you hold back, waiting for the moment to kick.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds back, waiting for the moment to kick you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> holds back, waiting to kick <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You track <ansi fg="{acteetype}">{actee}</ansi>''s every shift, your <ansi fg="item">{itemname}</ansi> at rest.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> tracks your every shift, <ansi fg="item">{itemname}</ansi> perfectly at rest.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> tracks <ansi fg="{acteetype}">{actee}</ansi>''s every shift, <ansi fg="item">{itemname}</ansi> at rest.'
      - actor: 'You edge sideways, keeping your flank toward <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> edges sideways, keeping their flank toward you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> edges sideways, flank turned to <ansi fg="{acteetype}">{actee}</ansi>.'
      master:
      - actor: 'Still {momentum}, you read every shift of <ansi fg="{acteetype}">{actee}</ansi>''s weight.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads every shift of your weight with calm eyes.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads every shift of <ansi fg="{acteetype}">{actee}</ansi>''s weight.'
      - actor: 'While {position}, you sense <ansi fg="{acteetype}">{actee}</ansi>''s next step early.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> senses your next step before you take it.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> senses <ansi fg="{acteetype}">{actee}</ansi>''s next step early.'
      - actor: 'Your {stance} stance keeps all four <ansi fg="item">{itemname}</ansi> ready to strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> keeps all four <ansi fg="item">{itemname}</ansi> ready, {stance} and patient.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> keeps all four <ansi fg="item">{itemname}</ansi> ready against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You stand still as stone, your great strength held back.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> stands still as stone, great strength held back.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> stands still as stone before <ansi fg="{acteetype}">{actee}</ansi>.'
  miss:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You kick wildly at <ansi fg="{acteetype}">{actee}</ansi>, but hit only air!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> kicks wildly at you, but hits only air!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> kicks wildly at <ansi fg="{acteetype}">{actee}</ansi>, but misses!'
