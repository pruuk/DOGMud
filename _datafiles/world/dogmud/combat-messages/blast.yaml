        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> slowly, seeking an opening.'
      - actor: 'Your form shifts restlessly as you wait on <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s form shifts restlessly as they wait on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s form shifts restlessly near <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You pulse with impatient power, eager to strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> pulses with impatient power, eager to strike.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> pulses with impatient power near <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
