# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'scorching strike'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
# {bodypart}    - the struck body part of the actee e.g. 'right shoulder'
#
# Used by the energy elementals: water (watery surge), air (slicing gust),
# fire (scorching strike), magma (molten slam), sand (abrasive whirl),
# storm (arcing strike) and ice (crystal strike). Every line must read right
# for all seven: the element arrives and strikes; {itemname}, if named, comes only after
# "with your/their", "unleash", "ready", "turn ... on" and the like, never as
# the subject of a verb. Several of the seven have no limbs, so no line names
# feet, foot, head, chest, shoulder, footwork, fists or hands for the actor.
optionid: blast
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You gather your element and aim it at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> gathers their element and aims it at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> gathers their element and aims it at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You swell with power, ready to strike <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> swells with power, ready to strike you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> swells with power, ready to strike <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You turn your <ansi fg="item">{itemname}</ansi> on <ansi fg="{acteetype}">{actee}</ansi>, ready to strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> turns their <ansi fg="item">{itemname}</ansi> on you, ready to strike.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> turns their <ansi fg="item">{itemname}</ansi> on <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You surge and swell, eager to crash into <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> surges and swells, eager to crash into you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> surges, eager to crash into <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'In a {stance} stance, you aim your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: 'In a {stance} stance, <ansi fg="{actortype}">{actor}</ansi> aims <ansi fg="item">{itemname}</ansi> at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> aims their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you gauge the distance to <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> gauges the distance to you while {position}.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> gauges the distance to <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You draw in your power, aimed squarely at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> draws in their power, aimed squarely at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> draws in their power, aimed at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {momentum}, you build toward your <ansi fg="item">{itemname}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> builds toward their <ansi fg="item">{itemname}</ansi>, aimed at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> builds power, aimed at <ansi fg="{acteetype}">{actee}</ansi>.'
      master:
      - actor: 'With calm control, you shape your <ansi fg="item">{itemname}</ansi> for <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: 'With calm control, <ansi fg="{actortype}">{actor}</ansi> shapes their <ansi fg="item">{itemname}</ansi> for you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> shapes their <ansi fg="item">{itemname}</ansi> for <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You settle into a {stance} stance, your element held still and ready.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a {stance} stance, held still and ready.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> settles in, facing <ansi fg="{acteetype}">{actee}</ansi> with deadly calm.'
      - actor: 'You read <ansi fg="{acteetype}">{actee}</ansi>''s every shift, your element poised to strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your every shift, their element poised to strike.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s every shift, poised to strike.'
      - actor: 'You hold back your <ansi fg="item">{itemname}</ansi>, waiting for <ansi fg="{acteetype}">{actee}</ansi> to open.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds back their <ansi fg="item">{itemname}</ansi>, waiting for an opening.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> holds back, waiting for <ansi fg="{acteetype}">{actee}</ansi> to open.'
  wait:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You linger near <ansi fg="{acteetype}">{actee}</ansi>, biding your time.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lingers near you, biding their time.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lingers near <ansi fg="{acteetype}">{actee}</ansi>, biding their time.'
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi> slowly, seeking an opening.'
