      - actor: 'While {position}, you sense <ansi fg="{acteetype}">{actee}</ansi>''s next move.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> senses your next move before you make it.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> senses <ansi fg="{acteetype}">{actee}</ansi>''s next move before it comes.'
      - actor: 'Your {stance} training lets you read <ansi fg="{acteetype}">{actee}</ansi>''s intent early.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s {stance} training lets them read your intent early.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s intent early.'
      - actor: 'Like a storm before it breaks, you hold your power in reserve.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds their power in reserve, like a storm about to break.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> holds their power in reserve near <ansi fg="{acteetype}">{actee}</ansi>.'
  miss:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You unleash your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, but miss!'
