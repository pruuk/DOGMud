      - actor: '<ansi fg="{acteetype}">{actee}</ansi>''s unexpected movement forces your perfect reach wide!'
        actee: 'Your movement forces <ansi fg="{actortype}">{actor}</ansi>''s perfect reach wide!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi>''s movement forces the perfect drain wide!'
      - actor: 'Despite flawless timing, <ansi fg="{acteetype}">{actee}</ansi> slips the drain!'
