# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'claws'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless'
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground'
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured'
optionid: siphon
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You turn your <ansi fg="item">{itemname}</ansi> on <ansi fg="{acteetype}">{actee}</ansi>, your will wavering and hungry.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> turns their <ansi fg="item">{itemname}</ansi> on you, their will wavering and hungry.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> turns their <ansi fg="item">{itemname}</ansi> on <ansi fg="{acteetype}">{actee}</ansi>, their will wavering and hungry.'
      - actor: 'You fix <ansi fg="{acteetype}">{actee}</ansi> with a cold, hungry stare, and the air grows chill.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> fixes you with a cold, hungry stare, and the air grows chill.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> fixes <ansi fg="{acteetype}">{actee}</ansi> with a cold, hungry stare, and the air grows chill.'
      - actor: 'You gather your will, unsure, aching for the life you sense in <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> gathers their will, unsure, aching for the life they sense in you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> gathers their will, unsure, aching for the life in <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'From your {stance} stance, you reach for <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>.'
        actee: 'From their {stance} stance, <ansi fg="{actortype}">{actor}</ansi> reaches for you with their <ansi fg="item">{itemname}</ansi>.'
        observer: 'From their {stance} stance, <ansi fg="{actortype}">{actor}</ansi> reaches for <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'While {position}, you sense <ansi fg="{acteetype}">{actee}</ansi>''s life-force and prepare to draw it out.'
        actee: 'While {position}, <ansi fg="{actortype}">{actor}</ansi> senses your life-force and prepares to draw it out.'
        observer: 'While {position}, <ansi fg="{actortype}">{actor}</ansi> senses <ansi fg="{acteetype}">{actee}</ansi>''s life-force, ready to draw it out.'
      - actor: 'You hold your {stance} stance as the air between you and <ansi fg="{acteetype}">{actee}</ansi> turns cold.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds their {stance} stance as the air between you turns cold.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> holds their {stance} stance as the air around <ansi fg="{acteetype}">{actee}</ansi> turns cold.'
      master:
      - actor: 'You wait in your {stance} stance, and the warmth fades from around <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> waits in their {stance} stance, and the warmth fades from around you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> waits in their {stance} stance as the warmth fades from around <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You read <ansi fg="{acteetype}">{actee}</ansi>''s every shift, your will poised to take their life.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your every shift, their will poised to take your life.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s every shift, their will poised to take life.'
      - actor: 'While {position}, you go utterly still, and <ansi fg="{acteetype}">{actee}</ansi>''s breath turns to frost.'
        actee: 'While {position}, <ansi fg="{actortype}">{actor}</ansi> goes utterly still, and your breath turns to frost.'
        observer: 'While {position}, <ansi fg="{actortype}">{actor}</ansi> goes utterly still, and <ansi fg="{acteetype}">{actee}</ansi>''s breath frosts.'
      - actor: 'You fix <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>, calm as an old and patient hunger.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> fixes you with their <ansi fg="item">{itemname}</ansi>, calm as an old and patient hunger.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> fixes <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>, calm as an old, patient hunger.'
