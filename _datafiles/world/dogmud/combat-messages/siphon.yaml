        observer: '<ansi fg="{actortype}">{actor}</ansi> watches <ansi fg="{acteetype}">{actee}</ansi> with cold, patient hunger.'
      - actor: 'You bide your time, hunger coiling behind your eyes.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> seems to be savoring something only they can sense.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> bides their time, hunger coiling behind their eyes.'
      expert:
      - actor: 'From your {stance} stance, you hold {position}, probing <ansi fg="{acteetype}">{actee}</ansi>''s defenses.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> low, eyes fixed on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> eyes <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="item">{itemname}</ansi> poised and ready.'
      - actor: 'While {position}, you feign a reach, testing <ansi fg="{acteetype}">{actee}</ansi>''s reactions.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> feigns a reach, probing your defenses.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> feigns a reach, probing <ansi fg="{acteetype}">{actee}</ansi>''s guard.'
      - actor: 'You pace with cold patience, looking for the perfect moment to feed.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> paces with cold patience, studying your every movement.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> paces with cold patience, waiting for the perfect moment to feed.'
      - actor: 'You sense the ebb and flow of <ansi fg="{acteetype}">{actee}</ansi>''s life-force with hungry clarity.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> senses the ebb and flow of your life-force with hungry clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> senses the ebb and flow of <ansi fg="{acteetype}">{actee}</ansi>''s life-force with hungry clarity.'
      master:
      - actor: '{momentum}, you read every subtle tremor in <ansi fg="{acteetype}">{actee}</ansi>''s aura.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s eyes track your aura like a beast before it feeds.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi> like a predator sensing warmth.'
      - actor: 'While {position}, you anticipate <ansi fg="{acteetype}">{actee}</ansi>''s next breath with terrifying precision.'
        actee: 'While {position}, <ansi fg="{actortype}">{actor}</ansi> anticipates your next breath with terrifying precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> analyzes <ansi fg="{acteetype}">{actee}</ansi>''s aura with terrifying stillness.'
      - actor: 'Your {stance} patience lets you feel every flicker of <ansi fg="{acteetype}">{actee}</ansi>''s vitality.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> senses the flow of your vitality with masterful, terrible clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> senses the flow of <ansi fg="{acteetype}">{actee}</ansi>''s vitality with masterful, terrible clarity.'
      - actor: 'Like a predator savoring the hunt, you assess every opening in <ansi fg="{acteetype}">{actee}</ansi>''s guard.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your every movement with predatory patience.'
        observer: 'Like a predator savoring the hunt, <ansi fg="{actortype}">{actor}</ansi> assesses every opening in <ansi fg="{acteetype}">{actee}</ansi>''s guard.'
