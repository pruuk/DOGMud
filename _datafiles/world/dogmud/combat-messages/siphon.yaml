# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'claws'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless'
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground'
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured'
optionid: siphon
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You extend your <ansi fg="item">{itemname}</ansi> hungrily toward <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> extends their <ansi fg="item">{itemname}</ansi> toward you hungrily.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> extends their <ansi fg="item">{itemname}</ansi> toward <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You fix <ansi fg="{acteetype}">{actee}</ansi> with a cold, consuming stare.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> fixes you with a cold, consuming stare.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> eyes <ansi fg="{acteetype}">{actee}</ansi> with cold, consuming hunger.'
      - actor: 'You reach for <ansi fg="{acteetype}">{actee}</ansi>, fingers curled, ready to feed.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> eyes you with predatory hunger.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reaches for <ansi fg="{acteetype}">{actee}</ansi>, fingers curled, ready to feed.'
      expert:
      - actor: 'From a {stance} stance, you extend your <ansi fg="item">{itemname}</ansi> toward <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance, <ansi fg="item">{itemname}</ansi> extending toward you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance, <ansi fg="item">{itemname}</ansi> aimed at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you sense the life-force of <ansi fg="{acteetype}">{actee}</ansi>, ready to take it.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> senses your life-force and prepares to claim it.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> senses <ansi fg="{acteetype}">{actee}</ansi>''s life-force, ready to take it.'
      - actor: '{stance}, you fix your predatory gaze and prepare to drain!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> opens themselves to the drain, eyes fixed on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with predatory focus.'
      master:
      - actor: 'With cold precision, you adopt a {stance} stance, {momentum}, ready to leech.'
        actee: 'With cold precision, <ansi fg="{actortype}">{actor}</ansi> adopts a {stance} stance, {momentum}, ready to leech from you.'
        observer: 'With cold precision, <ansi fg="{actortype}">{actor}</ansi> adopts a {stance} stance, {momentum}, ready to leech from <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You read <ansi fg="{acteetype}">{actee}</ansi>''s every shift, {momentum}, your <ansi fg="item">{itemname}</ansi> perfectly positioned.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your posture and positions their <ansi fg="item">{itemname}</ansi> perfectly.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s position and reaches with chilling intent.'
      - actor: 'You flow into a masterful predatory stance while {position}, waiting for the moment.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s eyes gleam as they settle into a predatory and lethal posture.'
        observer: 'With masterful calm, <ansi fg="{actortype}">{actor}</ansi> prepares to drain <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: '{momentum}, you extend your <ansi fg="item">{itemname}</ansi> with the focus of a seasoned lifedrinker.'
        actee: 'With unsettling calm, <ansi fg="{actortype}">{actor}</ansi> reaches for your life-force.'
        observer: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> extends their <ansi fg="item">{itemname}</ansi> with the focus of a seasoned lifedrinker.'
  wait:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="item">{itemname}</ansi> ready to latch on.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you with hungry, hollow eyes.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with hollow, hungry eyes.'
