      - actor: '{momentum}, your draining strike is barely turned aside!'
        actee: '{momentum}, <ansi fg="{actortype}">{actor}</ansi>''s draining strike is barely turned aside!'
        observer: '{momentum}, <ansi fg="{actortype}">{actor}</ansi>''s draining strike is barely turned aside by <ansi fg="{acteetype}">{actee}</ansi>!'
