        actee: 'From their {stance} stance, <ansi fg="{actortype}">{actor}</ansi> probes your guard with their will.'
        observer: 'From their {stance} stance, <ansi fg="{actortype}">{actor}</ansi> probes <ansi fg="{acteetype}">{actee}</ansi>''s guard with their will.'
      - actor: 'While {position}, you feign a reach, testing <ansi fg="{acteetype}">{actee}</ansi>''s reactions.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> feigns a reach, probing your defenses.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> feigns a reach, probing <ansi fg="{acteetype}">{actee}</ansi>''s guard.'
      - actor: 'You wait with cold patience for <ansi fg="{acteetype}">{actee}</ansi>''s warmth to waver.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> waits with cold patience for your warmth to waver.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> waits with cold patience for <ansi fg="{acteetype}">{actee}</ansi>''s warmth to waver.'
      - actor: 'You sense the ebb and flow of <ansi fg="{acteetype}">{actee}</ansi>''s life-force with hungry clarity.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> senses the ebb and flow of your life-force with hungry clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> senses the ebb and flow of <ansi fg="{acteetype}">{actee}</ansi>''s life-force with hungry clarity.'
      master:
      - actor: 'You read every flicker of <ansi fg="{acteetype}">{actee}</ansi>''s aura, unmoving and cold.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads every flicker of your aura, unmoving and cold.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads every flicker of <ansi fg="{acteetype}">{actee}</ansi>''s aura, unmoving and cold.'
      - actor: 'While {position}, you anticipate <ansi fg="{acteetype}">{actee}</ansi>''s next breath with dreadful calm.'
        actee: 'While {position}, <ansi fg="{actortype}">{actor}</ansi> anticipates your next breath with dreadful calm.'
        observer: 'While {position}, <ansi fg="{actortype}">{actor}</ansi> anticipates <ansi fg="{acteetype}">{actee}</ansi>''s next breath with dreadful calm.'
      - actor: 'Patient in your {stance} stance, you feel every pulse of <ansi fg="{acteetype}">{actee}</ansi>''s vitality.'
        actee: 'Patient in their {stance} stance, <ansi fg="{actortype}">{actor}</ansi> feels every pulse of your vitality.'
        observer: 'Patient in their {stance} stance, <ansi fg="{actortype}">{actor}</ansi> feels every pulse of <ansi fg="{acteetype}">{actee}</ansi>''s life.'
      - actor: 'You let the cold gather around <ansi fg="{acteetype}">{actee}</ansi>, waiting for an opening.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lets the cold gather around you, waiting for an opening.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lets the cold gather around <ansi fg="{acteetype}">{actee}</ansi>, waiting for an opening.'
