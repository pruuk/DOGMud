# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'sceptre'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {stance}      - combat stance (Stage 9.4)
# {position}    - combat position (Stage 9.4)
# {momentum}    - combat momentum (Stage 9.4)
optionid: sceptre
options:
  prepare:
    together:
      beginner:
      - actor: 'You raise your <ansi fg="item">{itemname}</ansi>, its crystal pulsing with inner light.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi> toward you, its crystal pulsing.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi> toward <ansi fg="{acteetype}">{actee}</ansi>, crystal pulsing.'
      - actor: 'You heft your <ansi fg="item">{itemname}</ansi>, readying yourself against <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> hefts their <ansi fg="item">{itemname}</ansi> menacingly in your direction.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> hefts their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You grip your <ansi fg="item">{itemname}</ansi> tightly, the crystal flickering to life.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly, the crystal flickering to life.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly toward <ansi fg="{acteetype}">{actee}</ansi>, the crystal flickering to life.'
      expert:
      - actor: 'You settle into a {stance} stance, your <ansi fg="item">{itemname}</ansi> glowing with channeled power.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a {stance} stance, their <ansi fg="item">{itemname}</ansi> glowing with channeled power.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> settles into a {stance} stance, their <ansi fg="item">{itemname}</ansi> glowing, facing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you level your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi> with focused intent.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> levels their glowing <ansi fg="item">{itemname}</ansi> at you with focused intent.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> levels their glowing <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You balance your <ansi fg="item">{itemname}</ansi> in hand, attuning to <ansi fg="{acteetype}">{actee}</ansi>''s energy.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> balances their <ansi fg="item">{itemname}</ansi>, attuning to your energy.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> balances their <ansi fg="item">{itemname}</ansi>, attuning to <ansi fg="{acteetype}">{actee}</ansi>''s energy.'
      master:
      - actor: 'With measured confidence, you bring your <ansi fg="item">{itemname}</ansi> to bear, power surging within.'
        actee: 'Power surges through <ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi> as they prepare.'
        observer: 'With measured confidence, <ansi fg="{actortype}">{actor}</ansi> brings their <ansi fg="item">{itemname}</ansi> to bear on <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Your <ansi fg="item">{itemname}</ansi>''s crystal blazes as you read <ansi fg="{acteetype}">{actee}</ansi>''s posture.'
