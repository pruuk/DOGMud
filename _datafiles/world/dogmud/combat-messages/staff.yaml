# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'staff'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {stance}      - combat stance (Stage 9.4)
# {position}    - combat position (Stage 9.4)
# {momentum}    - combat momentum (Stage 9.4)
optionid: staff
options:
  prepare:
    together:
      beginner:
      - actor: 'You plant your <ansi fg="item">{itemname}</ansi> and ready yourself against <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> plants their <ansi fg="item">{itemname}</ansi> and readies for battle.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> plants their <ansi fg="item">{itemname}</ansi> and readies against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You grip your <ansi fg="item">{itemname}</ansi> with tremendous force, sigils flickering along its length.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> with tremendous force, sigils flickering.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> with tremendous force, facing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You raise your <ansi fg="item">{itemname}</ansi>, adopting a defensive posture against <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi>, adopting a defensive posture against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi>, adopting a defensive posture against <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'You settle into a {stance} stance, your <ansi fg="item">{itemname}</ansi> balanced and ready.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a {stance} stance with their <ansi fg="item">{itemname}</ansi> balanced.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> settles into a {stance} stance, their <ansi fg="item">{itemname}</ansi> balanced at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you level your <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi> with measured control.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> levels their <ansi fg="item">{itemname}</ansi> at you with measured control.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> levels their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi> with control.'
      - actor: 'You rotate your <ansi fg="item">{itemname}</ansi> slowly, the iron-shod ends tracing careful arcs.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> rotates their <ansi fg="item">{itemname}</ansi> slowly, the iron-shod ends tracing careful arcs.'
        observer: 'Watching <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="{actortype}">{actor}</ansi> rotates their <ansi fg="item">{itemname}</ansi> in slow, careful arcs.'
      master:
      - actor: 'With fluid grace, you bring your <ansi fg="item">{itemname}</ansi> into guard position, sigils glowing.'
        actee: 'With fluid grace, <ansi fg="{actortype}">{actor}</ansi> brings their <ansi fg="item">{itemname}</ansi> to bear.'
        observer: 'With fluid grace, <ansi fg="{actortype}">{actor}</ansi> brings their <ansi fg="item">{itemname}</ansi> to guard against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Your <ansi fg="item">{itemname}</ansi> hums with restrained power as you assess <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi> hums with restrained power as they assess you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s <ansi fg="item">{itemname}</ansi> hums with restrained power as they assess <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: '{momentum}, you center your weight behind your <ansi fg="item">{itemname}</ansi> with absolute focus.'
        actee: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> centers their weight behind their <ansi fg="item">{itemname}</ansi>, focused on you.'
        observer: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> sets their weight behind their <ansi fg="item">{itemname}</ansi>, facing <ansi fg="{acteetype}">{actee}</ansi>.'
