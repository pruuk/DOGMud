        actee: '<ansi fg="{actortype}">{actor}</ansi> probes your defenses with sweeping feints.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> probes <ansi fg="{acteetype}">{actee}</ansi>''s defenses with sweeping feints.'
