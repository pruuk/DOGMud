        actee: '<ansi fg="{actortype}">{actor}</ansi>, settled into a {stance} stance, studies you over the length of their staff.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>, settled into a {stance} stance, studies <ansi fg="{acteetype}">{actee}</ansi> over the length of their staff.'
