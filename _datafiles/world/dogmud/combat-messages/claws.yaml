# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'claws'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
optionid: claws
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You flex your <ansi fg="item">{itemname}</ansi> menacingly at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> flexes their <ansi fg="item">{itemname}</ansi> menacingly at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> flexes their <ansi fg="item">{itemname}</ansi> tightly, facing off against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You let out a low growl, preparing to pounce on <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lets out a low growl, preparing to pounce on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lets out a low growl, preparing to pounce on <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You bare your <ansi fg="item">{itemname}</ansi>, hissing with barely contained rage.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> bares their <ansi fg="item">{itemname}</ansi>, hissing with barely contained rage.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> bares their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, hissing with barely contained rage.'
      expert:
      - actor: 'You lock eyes with <ansi fg="{acteetype}">{actee}</ansi>, your <ansi fg="item">{itemname}</ansi> poised to strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> glares at you, <ansi fg="item">{itemname}</ansi> ready to rake.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> locks eyes with <ansi fg="{acteetype}">{actee}</ansi>, claws ready to strike.'
      - actor: 'You take a {stance} stance, {position}, preparing to face <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} stance against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you circle <ansi fg="{acteetype}">{actee}</ansi> with predatory precision.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you warily with predatory intent.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> warily with predatory precision.'
      - actor: '{stance}, you ready your <ansi fg="item">{itemname}</ansi> for the perfect strike!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> for the perfect strike against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> for the perfect strike against <ansi fg="{acteetype}">{actee}</ansi>.'
      master:
      - actor: 'With practiced ease, you adopt a {stance} stance while {position}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a masterful {stance} stance.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> adopts a masterful combat stance.'
      - actor: 'Your claws settle into perfect position, {momentum}, as you assess <ansi fg="{acteetype}">{actee}</ansi>''s weaknesses.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s claws move into perfect position, a clear and devastating threat.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s claws move into perfect position, a clear and devastating threat to <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You flow into your {stance} fighting stance with the grace of an apex predator.'
        actee: 'With the grace of an apex predator, <ansi fg="{actortype}">{actor}</ansi> prepares to strike.'
        observer: 'With the grace of an apex predator, <ansi fg="{actortype}">{actor}</ansi> prepares to engage <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: '{momentum}, you read <ansi fg="{acteetype}">{actee}</ansi>''s every muscle, claws poised perfectly.'
        actee: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> reads your every muscle, claws poised perfectly.'
        observer: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s every muscle, claws poised perfectly.'
