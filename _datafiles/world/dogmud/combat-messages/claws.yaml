        observer: '<ansi fg="{actortype}">{actor}</ansi> analyzes <ansi fg="{acteetype}">{actee}</ansi> with terrifying apex predator clarity.'
      - actor: 'Your {stance} training allows you to analyze <ansi fg="{acteetype}">{actee}</ansi> like prey.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> analyzes your stance with masterful apex predator clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi> like helpless prey.'
      - actor: 'Like an apex predator, you assess <ansi fg="{acteetype}">{actee}</ansi>''s every weakness and vulnerability.'
