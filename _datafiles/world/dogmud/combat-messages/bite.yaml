# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'fangs'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
optionid: bite
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You snap your <ansi fg="item">{itemname}</ansi> menacingly at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> snaps their <ansi fg="item">{itemname}</ansi> menacingly at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> snaps their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You let out a low snarl, preparing to lunge at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> lets out a low snarl, preparing to lunge at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> lets out a low snarl, preparing to lunge at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You bare your <ansi fg="item">{itemname}</ansi> with a threatening growl.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> bares their <ansi fg="item">{itemname}</ansi> with a threatening growl.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> bares their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi> with a threatening growl.'
      expert:
      - actor: 'You lock eyes with <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="item">{itemname}</ansi> poised to snap.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> glares at you, <ansi fg="item">{itemname}</ansi> ready to snap.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> locks eyes with <ansi fg="{acteetype}">{actee}</ansi>, jaws ready to snap.'
      - actor: 'You take a {stance} stance, {position}, preparing to face <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} stance against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you circle <ansi fg="{acteetype}">{actee}</ansi> with predatory hunger.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you warily with predatory hunger.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with predatory hunger.'
      - actor: '{stance}, you ready your <ansi fg="item">{itemname}</ansi> for the perfect strike!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> for the perfect strike, {stance}.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> at <ansi fg="{acteetype}">{actee}</ansi>, {stance}.'
      master:
      - actor: 'With practiced ease, you adopt a {stance} stance while {position}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a masterful {stance} stance.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> adopts a masterful combat stance.'
      - actor: 'You settle your <ansi fg="item">{itemname}</ansi> into perfect position, {momentum}, as you read <ansi fg="{acteetype}">{actee}</ansi>''s weaknesses.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> moves their <ansi fg="item">{itemname}</ansi> into perfect position, a clear and deadly threat.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> settles their <ansi fg="item">{itemname}</ansi> into perfect position as they read <ansi fg="{acteetype}">{actee}</ansi>''s weaknesses.'
      - actor: 'You flow into your {stance} fighting stance with the patience of an apex predator.'
        actee: 'With the patience of an apex predator, <ansi fg="{actortype}">{actor}</ansi> prepares to strike.'
        observer: 'With the patience of an apex predator, <ansi fg="{actortype}">{actor}</ansi> prepares to engage <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: '{momentum}, you read <ansi fg="{acteetype}">{actee}</ansi>''s every muscle, jaws poised perfectly.'
        actee: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> reads your every muscle, jaws poised perfectly.'
        observer: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s every muscle, jaws poised perfectly.'
  wait:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You watch <ansi fg="{acteetype}">{actee}</ansi> closely, waiting for the right moment to snap.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> watches you intently, waiting to lunge.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> watches <ansi fg="{acteetype}">{actee}</ansi> closely, waiting for the right moment to snap.'
      - actor: 'You circle around <ansi fg="{acteetype}">{actee}</ansi>, <ansi fg="item">{itemname}</ansi> at the ready.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles dangerously.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with predatory intent.'
      - actor: 'You track <ansi fg="{acteetype}">{actee}</ansi> carefully, trembling with predatory focus.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> tracks you carefully, trembling with predatory focus.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> tracks <ansi fg="{acteetype}">{actee}</ansi> carefully, trembling with predatory focus.'
      - actor: 'You growl softly, searching for an opening to lunge.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> growls softly, looking for an opening.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> growls softly, searching for an opening to lunge at <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'From your {stance} stance, you stand {position}, eyeing <ansi fg="{acteetype}">{actee}</ansi> for weakness.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> ready, eyes fixed on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> eyes <ansi fg="{acteetype}">{actee}</ansi> warily, waiting to strike.'
      - actor: 'While {position}, you adopt a {stance} posture, reading <ansi fg="{acteetype}">{actee}</ansi>''s movements.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} posture while {position}, reading your movements.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} posture, reading <ansi fg="{acteetype}">{actee}</ansi>''s movements.'
      - actor: 'You prowl around <ansi fg="{acteetype}">{actee}</ansi>, seeking the perfect moment to snap.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you with tactical intent.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> prowls around <ansi fg="{acteetype}">{actee}</ansi>, seeking the perfect moment to snap.'
      - actor: 'You probe <ansi fg="{acteetype}">{actee}</ansi>''s defenses with predatory precision.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> probes your defenses with calculated predatory patience.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> probes for weakness in <ansi fg="{acteetype}">{actee}</ansi>''s guard with predatory patience.'
      master:
      - actor: '{momentum}, you read every subtle shift in <ansi fg="{acteetype}">{actee}</ansi>''s posture.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your every movement with unsettling predatory precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads every subtle shift in <ansi fg="{acteetype}">{actee}</ansi>''s posture, {momentum}.'
      - actor: 'While {position}, you anticipate <ansi fg="{acteetype}">{actee}</ansi>''s next move with haunting clarity.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s eyes track your every shift like a hunting beast.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> anticipates <ansi fg="{acteetype}">{actee}</ansi>''s next move with haunting clarity.'
      - actor: 'Your {stance} discipline lets you study <ansi fg="{acteetype}">{actee}</ansi> like helpless prey.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> studies you like helpless prey, disciplined and {stance}.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi> like helpless prey.'
      - actor: 'Like an apex predator, you assess every weakness and opening in <ansi fg="{acteetype}">{actee}</ansi>''s guard.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> analyzes your stance with apex predator clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> analyzes <ansi fg="{acteetype}">{actee}</ansi> with terrifying apex predator clarity.'
  miss:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You snap at <ansi fg="{acteetype}">{actee}</ansi> with your <ansi fg="item">{itemname}</ansi>, but miss!'
