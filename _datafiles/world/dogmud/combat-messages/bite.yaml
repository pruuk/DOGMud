      - actor: 'You snap wildly at <ansi fg="{acteetype}">{actee}</ansi> in frenzied rage, failing to connect!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> snaps wildly in frenzied rage, missing you entirely!'
        observer: '<ansi fg="{actortype}">{actor}</ansi> snaps wildly at <ansi fg="{acteetype}">{actee}</ansi> in frenzied rage, failing to connect!'
      expert:
      - actor: 'Your calculated lunge misses as <ansi fg="{acteetype}">{actee}</ansi> evades!'
        actee: 'You evade <ansi fg="{actortype}">{actor}</ansi>''s calculated lunge!'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s calculated lunge is evaded by <ansi fg="{acteetype}">{actee}</ansi>!'
      - actor: 'You feint and snap, but <ansi fg="{acteetype}">{actee}</ansi> anticipates your bite!'
        actee: 'You anticipate <ansi fg="{actortype}">{actor}</ansi>''s feint and avoid their bite!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> anticipates the feint and avoids the bite!'
      - actor: 'Despite your {stance} approach, you find only air with your <ansi fg="item">{itemname}</ansi>!'
        actee: 'Despite <ansi fg="{actortype}">{actor}</ansi>''s {stance} approach, they find only air with their <ansi fg="item">{itemname}</ansi>!'
        observer: 'Despite a {stance} approach, <ansi fg="{actortype}">{actor}</ansi> finds only air with their <ansi fg="item">{itemname}</ansi>!'
      - actor: 'Your tactical strike is countered expertly by <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s tactical approach fails as you counter expertly!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> counters <ansi fg="{actortype}">{actor}</ansi>''s tactical snap!'
      master:
      - actor: '<ansi fg="{acteetype}">{actee}</ansi>''s unexpected skill forces your perfect bite wide!'
        actee: 'Your masterful defense forces <ansi fg="{actortype}">{actor}</ansi>''s perfect bite wide!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi>''s masterful defense forces the perfect bite wide!'
      - actor: 'Despite flawless execution, <ansi fg="{acteetype}">{actee}</ansi> reads your intent and evades!'
        actee: 'You read <ansi fg="{actortype}">{actor}</ansi>''s intent and evade with fluid grace!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> reads the intent and evades with fluid grace!'
      - actor: 'Your masterful snap meets an equally masterful defense!'
        actee: 'Your superior technique deflects <ansi fg="{actortype}">{actor}</ansi>''s masterful snap!'
        observer: 'A masterful clash of jaws results in no contact!'
      - actor: '{momentum}, your lunging attack is narrowly turned aside!'
        actee: '{momentum}, you narrowly turn aside <ansi fg="{actortype}">{actor}</ansi>''s lunging attack!'
        observer: '{momentum}, <ansi fg="{acteetype}">{actee}</ansi> narrowly turns aside <ansi fg="{actortype}">{actor}</ansi>''s lunging attack!'
  weak:
