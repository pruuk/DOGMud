# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'bow'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
optionid: shooting
# Only prepare and wait: a bow swung in melee narrates as bludgeoning (items.MeleeSwingNarratedAs), and the shoot command has its own lines (narration/special-moves/shoot.yaml).
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You prepare to enter into ranged combat with <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> prepares to fire at you with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You grip your <ansi fg="item">{itemname}</ansi> tightly, readying yourself against <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly, readying against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly, facing off against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You aim poorly at <ansi fg="{acteetype}">{actee}</ansi>, uncertain of your form.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> takes poor aim at you, wavering with doubt.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> aims poorly at <ansi fg="{acteetype}">{actee}</ansi>, uncertain of their form.'
      - actor: 'You hold your <ansi fg="item">{itemname}</ansi> shakily, preparing to fire.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi> uncertainly at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> shakily, preparing to fire at <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'You lock eyes with <ansi fg="{acteetype}">{actee}</ansi>, your <ansi fg="item">{itemname}</ansi> steady and aimed true.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> glares at you, <ansi fg="item">{itemname}</ansi> steady and aimed.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> locks eyes with <ansi fg="{acteetype}">{actee}</ansi>, weapon ready to fire.'
      - actor: 'From your {stance} stance, {position}, you prepare to take a calculated shot at <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> assumes a {stance} stance against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you steady your <ansi fg="item">{itemname}</ansi> with tactical precision!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> steadies their aim with professional focus.'
        observer: 'While {position}, <ansi fg="{actortype}">{actor}</ansi> steadies their <ansi fg="item">{itemname}</ansi> on <ansi fg="{acteetype}">{actee}</ansi> with precision.'
      - actor: 'You take a measured breath, {position} and focused on <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> takes a measured breath, focused entirely on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a measured breath, {position} and focused on <ansi fg="{acteetype}">{actee}</ansi>.'
      master:
      - actor: 'With instinctive ease, you assume a {stance} stance while {position}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a masterful {stance} stance.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> settles into a masterful {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Your aim settles into perfect position, {momentum}, as you face <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s weapon moves into perfect position, a clear threat.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s aim settles into perfect position, {momentum}, facing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You assume your flawless shooting stance with practiced perfection.'
        actee: 'With flowing grace, <ansi fg="{actortype}">{actor}</ansi> prepares to fire.'
        observer: 'With practiced precision, <ansi fg="{actortype}">{actor}</ansi> prepares to engage <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: '{momentum}, you read <ansi fg="{acteetype}">{actee}</ansi>''s movements before they happen, weapon poised perfectly.'
        actee: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> reads your every movement before you make it, weapon poised perfectly.'
        observer: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s movements before they happen, weapon poised perfectly.'
  wait:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You aim carefully at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles dangerously, aiming at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi>, aiming with cruel intentions.'
      - actor: 'You steady your <ansi fg="item">{itemname}</ansi>, focusing on <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> watches you intently, their <ansi fg="item">{itemname}</ansi> poised to fire.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> steadies their <ansi fg="item">{itemname}</ansi>, focusing on <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You take a shaky breath and line up your shot at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> takes a shaky breath, lining up a shot at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a shaky breath, lining up a shot at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You hesitate while aiming at <ansi fg="{acteetype}">{actee}</ansi> uncertainly.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> looks for an opening awkwardly.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> hesitates, aiming at <ansi fg="{acteetype}">{actee}</ansi> uncertainly.'
      expert:
      - actor: 'You circle around <ansi fg="{acteetype}">{actee}</ansi>, looking for the perfect angle to fire.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you with tactical precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi>, looking for the perfect angle to fire.'
      - actor: 'From your {stance} stance, {position}, you eye <ansi fg="{acteetype}">{actee}</ansi> carefully.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> steady, eyes calculating.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> eyes <ansi fg="{acteetype}">{actee}</ansi> warily, ready to take a shot.'
      - actor: 'While {position}, you account for wind and distance, targeting <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> accounts for wind and distance, targeting you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> accounts for wind and distance, targeting <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You probe <ansi fg="{acteetype}">{actee}</ansi>''s defenses, seeking the best shot.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> probes your positioning carefully.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> probes for weakness in <ansi fg="{acteetype}">{actee}</ansi>''s guard.'
      master:
      - actor: '{momentum}, you read every subtle shift in <ansi fg="{acteetype}">{actee}</ansi>''s posture before they move.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your every movement with unsettling precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi> like an open book.'
      - actor: 'While {position}, you predict <ansi fg="{acteetype}">{actee}</ansi>''s next action with perfect clarity.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> predicts your next action with perfect clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> predicts <ansi fg="{acteetype}">{actee}</ansi>''s next action with perfect clarity.'
      - actor: 'Your {stance} training allows you to analyze <ansi fg="{acteetype}">{actee}</ansi>''s vulnerabilities effortlessly.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> analyzes your stance with masterful clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s training lets them analyze <ansi fg="{acteetype}">{actee}</ansi>''s vulnerabilities effortlessly.'
      - actor: 'Like a predator, you instinctively assess <ansi fg="{acteetype}">{actee}</ansi>''s every weakness.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s eyes track your every shift like a predator.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> analyzes <ansi fg="{acteetype}">{actee}</ansi> with predatory precision.'
