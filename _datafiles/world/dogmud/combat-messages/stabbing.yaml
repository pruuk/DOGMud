      - actor: 'Your tactical thrust is countered expertly by <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s tactical approach fails as you counter expertly!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> counters <ansi fg="{actortype}">{actor}</ansi>''s tactical approach!'
      master:
      - actor: '<ansi fg="{acteetype}">{actee}</ansi>''s unexpected skill forces your perfect thrust wide!'
        actee: 'Your masterful defense forces <ansi fg="{actortype}">{actor}</ansi>''s perfect thrust wide!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi>''s masterful defense forces the perfect thrust wide!'
      - actor: 'Despite flawless execution, <ansi fg="{acteetype}">{actee}</ansi> reads your intent and evades!'
        actee: 'You read <ansi fg="{actortype}">{actor}</ansi>''s intent and evade with flowing grace!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> reads the intent and evades with flowing grace!'
      - actor: 'Your masterful lunge meets an equally masterful defense!'
        actee: 'Your superior technique deflects <ansi fg="{actortype}">{actor}</ansi>''s masterful lunge!'
        observer: '<ansi fg="{acteetype}">{actee}</ansi> meets <ansi fg="{actortype}">{actor}</ansi>''s masterful lunge with a masterful defense!'
      - actor: '{momentum}, your flowing thrust is barely parried away!'
        actee: '{momentum}, you barely parry away <ansi fg="{actortype}">{actor}</ansi>''s flowing thrust!'
        observer: '{momentum}, <ansi fg="{acteetype}">{actee}</ansi> barely parries away <ansi fg="{actortype}">{actor}</ansi>''s flowing thrust!'
  weak:
