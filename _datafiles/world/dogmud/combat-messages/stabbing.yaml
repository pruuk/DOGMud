# Possible tokens:
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}      - name of mob or user e.g. 'goblin'
# {actortype}  - 'user' or 'mob'
# {actee}      - name of mob or user e.g. 'goblin'
# {acteetype}  - 'user' or 'mob'
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
# {stance}      - combat stance: 'aggressive', 'defensive', 'balanced', 'reckless' (Stage 9.4)
# {position}    - combat position: 'standing', 'prone', 'locked in close combat', 'grappling on the ground' (Stage 9.4)
# {momentum}    - combat momentum: 'on the offensive', 'on the defensive', 'in control', 'pressured' (Stage 9.4)
optionid: stabbing
options:
  prepare:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You prepare to enter into mortal combat with <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> prepares to attack <ansi fg="{acteetype}">{actee}</ansi> with their <ansi fg="item">{itemname}</ansi>.'
      - actor: 'You grip your <ansi fg="item">{itemname}</ansi> tightly, readying yourself against <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly, readying against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> grips their <ansi fg="item">{itemname}</ansi> tightly, facing off against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You raise your <ansi fg="item">{itemname}</ansi> in an uncertain guard against <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi> menacingly at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> raises their <ansi fg="item">{itemname}</ansi> in an uncertain guard against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You hold your <ansi fg="item">{itemname}</ansi> awkwardly, preparing to thrust.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> grips their blade awkwardly, preparing to thrust.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> awkwardly, preparing to thrust at <ansi fg="{acteetype}">{actee}</ansi>.'
      expert:
      - actor: 'You lock eyes with <ansi fg="{acteetype}">{actee}</ansi>, your <ansi fg="item">{itemname}</ansi> poised to strike.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> glares at you, <ansi fg="item">{itemname}</ansi> at the ready.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> locks eyes with <ansi fg="{acteetype}">{actee}</ansi>, weapon ready to thrust.'
      - actor: 'You take a {stance} stance, {position}, preparing to face <ansi fg="{acteetype}">{actee}</ansi>!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} stance against you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> takes a {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you ready your <ansi fg="item">{itemname}</ansi> in a {stance} guard!'
        actee: '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> in a {stance} guard, {position}.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> readies their <ansi fg="item">{itemname}</ansi> in a {stance} guard, {position}, against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You circle <ansi fg="{acteetype}">{actee}</ansi> warily, <ansi fg="item">{itemname}</ansi> at the ready.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you warily, blade ready to strike.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> warily, <ansi fg="item">{itemname}</ansi> at the ready.'
      master:
      - actor: 'With practiced ease, you adopt a {stance} stance while {position}.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> settles into a masterful {stance} stance.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> adopts a masterful {stance} stance against <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'Your blade settles into perfect position, {momentum}, as you face <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s blade moves into perfect position, a clear threat.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s blade settles into perfect position, {momentum}, facing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You flow into your {stance} fighting stance with fluid precision.'
        actee: 'With flowing grace, <ansi fg="{actortype}">{actor}</ansi> prepares to attack.'
        observer: 'With practiced precision, <ansi fg="{actortype}">{actor}</ansi> prepares to engage <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: '{momentum}, you read <ansi fg="{acteetype}">{actee}</ansi>''s posture, blade poised perfectly.'
        actee: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> reads your posture, blade poised perfectly.'
        observer: '{momentum}, <ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi>''s posture, blade poised perfectly.'
  wait:
    # messages for when they are in the same room
    together:
      beginner:
      - actor: 'You aim carefully at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> aims carefully at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> aims carefully at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You watch <ansi fg="{acteetype}">{actee}</ansi> closely, waiting for the perfect moment to thrust.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> watches you intently, waiting to strike with their <ansi fg="item">{itemname}</ansi>.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> watches <ansi fg="{acteetype}">{actee}</ansi> closely, waiting for the perfect moment to thrust.'
      - actor: 'You hesitate, looking for an opening to jab.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> looks for an opening awkwardly.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> hesitates, looking for an opening to jab at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You circle around <ansi fg="{acteetype}">{actee}</ansi> uncertainly.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles dangerously.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi> with cruel intentions.'
      expert:
      - actor: 'You circle around <ansi fg="{acteetype}">{actee}</ansi>, looking for an opening to pierce.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> circles you with tactical precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> circles <ansi fg="{acteetype}">{actee}</ansi>, looking for an opening to pierce.'
      - actor: 'From your {stance} stance, you stand {position}, eyeing <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> holds their <ansi fg="item">{itemname}</ansi> steady, eyes fixed on you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> stands in a {stance} stance, eyeing <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'While {position}, you adopt a {stance} posture, ready to lunge at <ansi fg="{acteetype}">{actee}</ansi>.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} posture, ready to lunge at you.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> adopts a {stance} posture, ready to lunge at <ansi fg="{acteetype}">{actee}</ansi>.'
      - actor: 'You probe <ansi fg="{acteetype}">{actee}</ansi>''s defenses, seeking a weakness to exploit.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> probes your defenses carefully.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> probes for weakness in <ansi fg="{acteetype}">{actee}</ansi>''s guard.'
      master:
      - actor: '{momentum}, you read every subtle shift in <ansi fg="{acteetype}">{actee}</ansi>''s posture.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> reads your every movement with unsettling precision.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> reads <ansi fg="{acteetype}">{actee}</ansi> like an open book.'
      - actor: 'While {position}, you anticipate <ansi fg="{acteetype}">{actee}</ansi>''s next move with clarity.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>, while {position}, anticipates your next move with clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> anticipates <ansi fg="{acteetype}">{actee}</ansi>''s next move while {position}.'
      - actor: 'Your {stance} training allows you to analyze <ansi fg="{acteetype}">{actee}</ansi> effortlessly.'
        actee: '<ansi fg="{actortype}">{actor}</ansi> analyzes your stance with masterful clarity.'
        observer: '<ansi fg="{actortype}">{actor}</ansi>''s {stance} training lets them analyze <ansi fg="{acteetype}">{actee}</ansi> effortlessly.'
      - actor: 'Like a predator, you assess <ansi fg="{acteetype}">{actee}</ansi>''s every vulnerability.'
        actee: '<ansi fg="{actortype}">{actor}</ansi>''s eyes track your every shift like a predator.'
        observer: '<ansi fg="{actortype}">{actor}</ansi> analyzes <ansi fg="{acteetype}">{actee}</ansi> with predatory precision.'
  miss:
    # messages for when they are in the same room
    together:
      beginner:
