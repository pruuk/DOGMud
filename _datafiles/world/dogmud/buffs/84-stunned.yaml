buffid: 84
name: Stunned
description: |
  A particularly brutal submission left you reeling — you can't mount
  any meaningful attack or defense this round.
triggerrate: 1 round
triggercount: 1
statmods:
  defense: -50
  combatmodifier: -75
start_user_text: '<ansi fg="red">The submission''s pressure leaves you stunned, unable to react.</ansi>'
end_user_text: '<ansi fg="green">You shake off the stun and regain your composure.</ansi>'
flags:
  # Same bargain as buff 83: the submission outcome applies this
  # synchronously, internal/combat cannot send the holder a line, so the
  # submission hook sends the start_user_text above right after the crit
  # release lands.
  - silent-start
