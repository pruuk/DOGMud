buffid: 95
name: Hull Dampening
description: The buried place presses the change in your blood back down. Your gifts feel distant, your certainty thin.
start_user_text: The buried place presses your gift down and holds it.
end_user_text: The pressure lifts and your gift stirs awake again.
triggerrate: 1 round
triggercount: 3
flags:
  - dampened
statmods:
  willpower: -30
  charisma: -30
# The hull_suppression mutator refreshes this every round while the player
# stays in the zone, so the start line fires once on entering and the end
# line fires once on leaving, not every few rounds. The mutator's
# descriptionmodifier ("your gifts go quiet here...") still carries the
# standing feedback on room look. triggercount 3 lets it lapse a few rounds
# after leaving instead of dropping the instant a player steps out.
