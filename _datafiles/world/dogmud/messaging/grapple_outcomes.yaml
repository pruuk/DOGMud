  # ── BackGround Reversal ─────────────────────────────────────────────────────
  # Turn-in-and-pin: defender peels the hook, spins into attacker, mounts.
  background_reverse:
    actor:
      - "You lose the hooks. {actee} peels your top hook and spins\
        \ into you. They land in mount before you can recover."
      - "{actee} rolls toward your near hook. You can't readjust in\
        \ time and they end up sitting on your chest."
      - "The seatbelt breaks. {actee} turns inside and you find\
        \ yourself pinned flat under mount."
    actee:
      - "You peel the top hook, rotate hard into {actor}, and sit\
        \ on their chest in mount. Back mount is gone."
      - "You roll toward {actor}'s near side, drag the hook down,\
        \ and come up on top in mount."
      - "You spin inside the seatbelt before {actor} can tighten\
        \ it. They go flat; you land in mount."
    observer:
      - "{actee} peels {actor}'s hook and spins inside,\
        \ landing in mount: back mount reversed."
      - "{actee} rolls toward the near hook and comes up in mount\
        \ on {actor}."
      - "{actee} turns into {actor}'s seatbelt grip and\
        \ pins them flat in mount."

  # ── Generic Reversal ────────────────────────────────────────────────────────
  # Role-swap in the same geometry; no position-specific move named.
  generic_reverse:
    actor:
      - "{actee} finds the leverage you missed. The position flips\
        \ and suddenly they're the one in control."
      - "A scramble, a shift, and you're on the wrong end of the pin."
      - "You held it a half-second too long. {actee} reverses the\
        \ position and pins you down."
    actee:
      - "You find the angle and force the reversal. {actor} is\
        \ now the one pinned."
      - "You exploit the opening. The pressure reverses and you're on top,\
        \ in control."
      - "A sharp change of direction and {actor}'s control evaporates.\
        \ You've reversed the position."
    observer:
