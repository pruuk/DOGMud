# Grapple outcome flavor templates for chunk 4b-fixup.
# See docs/superpowers/specs/2026-05-18-state-chunk-4b-fixup-position-
# advancement-design.md §7 for the authoring rubric.
#
# Template substitution variables:
#   {actor} - the controller side's display name
#   {actee} - the controlled side's display name
#
# Speaker variants (the canonical role keys, M4b-1):
#   actor    - second-person to the controller side
#   actee    - second-person to the controlled side
#   observer - third-person to the room
#
# Gradients use the same three keys. They were authored as
# self/partner/observers, a separate vocabulary for the same three
# audiences, until M4b-1 merged the two.
#
# This file is loaded at boot by internal/grapplemessaging.
# Skeleton committed in T6; full templates land in T8-T13.

advancements:
  # ── Clinch exits ────────────────────────────────────────────────────────
  clinch_to_mount:
    actor:
      - "You wrench the underhook, drive forward, and ride them down into\
        \ mount."
      - "A snap-down sets it up: you sprawl over the shoulder and slide\
        \ into mount before they can recover."
      - "Their stance breaks. You drag them flat and climb on top, knees\
        \ high in mount."
    actee:
      - "{actor} wrenches the underhook and rides you down. The\
        \ ceiling spins overhead. They're mounted on your chest."
      - "You feel the snap-down too late. Their weight crashes onto your\
        \ sternum and the world goes vertical."
      - "Your stance crumbles. {actor}'s knees hammer up under\
        \ your armpits: full mount."
    observer:
      - "{actor} wrenches an underhook and rides {actee}\
        \ down into mount."
      - "{actor} snaps {actee} down and climbs into mount\
        \ before they can post."
      - "{actee}'s stance breaks; {actor} drags them flat\
        \ and mounts them."

  clinch_to_sidecontrol:
    actor:
      - "You overbalance them with a hip throw feint, catch them on the way\
        \ down, and land in side control."
      - "A two-on-one on the wrist lets you lever them sideways; they hit\
        \ the ground and you sprawl across the chest."
      - "You trip the near leg and follow them down, chest-to-chest, cutting\
        \ off the hip with your weight."
    actee:
      - "{actor} levers your wrist outward. Your hip buckles and\
        \ you land hard. Their weight pins your upper chest before you can\
        \ roll."
      - "A trip catches your trailing foot mid-step. You go down sideways\
        \ and {actor} is already stacking across you."
      - "You lose the underhook battle. {actor} dumps you to the\
        \ floor and settles their hips perpendicular to yours: side control."
    observer:
      - "{actor} leverages a wrist and sweeps {actee} to\
        \ the mat, settling into side control."
      - "{actor} trips {actee}'s near leg and follows them\
        \ down chest-to-chest."
      - "{actee} hits the ground off a hip feint; {actor}\
        \ drops into side control before they can recover."

  clinch_to_background:
    actor:
      - "You pummel inside and spin behind them, both hands locking on the\
        \ waist. Their back is yours before they can pivot."
      - "A deep underhook lets you rotate around their outside. You're at\
        \ their back, hands clasped at the belly."
      - "You snap them forward at the neck, and as they duck they hand you\
        \ the back. You slap in a seatbelt grip and drag them down."
    actee:
      - "{actor} spins inside your guard and suddenly they're\
        \ behind you, arms cinched around your waist."
      - "You give the underhook, they take the back. It happens in one\
        \ fluid rotation and now {actor}'s hands are clasped at\
        \ your belly."
      - "The snap-down doubles you over and {actor} flows behind\
        \ you before you can stand back up."
    observer:
      - "{actor} pummels inside and spins behind {actee},\
        \ locking both hands at the waist."
      - "{actor} sweeps around the outside underhook and takes\
        \ {actee}'s back standing."
      - "{actee} is snapped forward; {actor} flows behind\
        \ them and slaps on a seatbelt grip."

  clinch_to_backstanding:
    actor:
      - "You body-lock from behind, lifting slightly to break their base,\
        \ then drag them back against you. They're upright but your hooks\
        \ are hunting."
      - "A duck-under puts you behind them on one knee. You stand up into\
        \ a rear clinch, both forearms framing their ribs."
      - "You slip the double-collar and rotate around their hip, one\
        \ circling step and you're at their back, chest pressed to their\
        \ spine."
    actee:
      - "A duck-under steals your hip. {actor} rises behind you,\
        \ forearms boxing your ribs. You're standing but helpless."
      - "{actor} body-locks from behind and your balance shifts\
        \ back, so you're on your heels, their hands are clasped at your\
        \ sternum."
      - "You feel the slip before you see it. {actor} is behind\
        \ you now, rear clinch locked, waiting for the moment to drag you\
        \ down."
    observer:
      - "{actor} ducks under and rises behind {actee} in\
        \ a rear clinch."
      - "{actor} body-locks {actee} from behind, both\
        \ standing, {actor} framing for a takedown."
      - "{actor} slips the hip and steps behind {actee},\
        \ locking a rear waist grip."

  # ── BackStanding exits ──────────────────────────────────────────────────
  backstanding_to_background:
    actor:
      - "You haul down on the seatbelt, kick one heel behind their knee,\
        \ and drag both of you to the mat. Hooks in."
      - "You sit to the mat and pull them back. They land across your lap\
        \ and you thread your hooks in before they can roll."
      - "A sharp lift-and-drop breaks their base. You fall back with them\
        \ and your legs swing over their hips: back mount secured."
    actee:
      - "{actor} bites down on the seatbelt and sweeps your knee\
        \ out. You land hard on your back with them coiled behind you."
      - "The floor comes up fast. {actor} sat down and pulled you\
        \ with them. Their heels are already digging into your hips."
      - "A lift-and-dump breaks your posture. You hit the mat on your side\
        \ and feel {actor}'s hooks thread in."
    observer:
      - "{actor} sweeps {actee}'s knee and drags them to\
        \ the mat, sinking hooks on the way down."
      - "{actor} sits to the mat, pulling {actee} back,\
        \ and threads both hooks in for back mount."
      - "{actee} goes down hard off a lift-and-drop;\
        \ {actor} lands behind them and locks the back mount."

  # ── Mount exits ─────────────────────────────────────────────────────────
  mount_to_background:
    actor:
      - "They turn to shield their face from your elbow. You take the gift\
        \ Seatbelt over the shoulder, hooks in, back mount."
      - "As they roll to their stomach you ride the roll, posting your hand\
        \ and sliding your legs around their torso."
      - "They give up the turtle to dodge strikes. You follow and sink one\
        \ hook, then the other, chest pressed to their back."
    actee:
      - "You roll away from {actor}'s elbows but you hand them\
        \ your back. They slap in a seatbelt and your position worsens."
      - "You try to come to your knees but {actor} rides you over,\
        \ hooks landing as you settle face-down."
      - "{actor}'s elbow thuds near your temple; you flinch and\
        \ roll. They follow smoothly onto your back."
    observer:
      - "{actee} rolls to avoid strikes; {actor} rides\
        \ the roll and takes back mount."
      - "{actor} follows {actee} as they turn away,\
        \ threading hooks in for back mount."
      - "{actee} turtles under pressure; {actor} slides\
        \ to their back and sinks both hooks."

  # ── SideControl exits ───────────────────────────────────────────────────
  sidecontrol_to_mount:
    actor:
      - "You walk your knee up their hip line, step across the belly, and\
        \ settle your weight into full mount."
      - "A cross-face pins the head while you swing the far leg over.\
        \ Mount is locked before they can replace guard."
      - "Their near elbow frames high; you undercut it, knee-slide across\
        \ the torso, and ride into mount."
    actee:
      - "{actor} walks their knee across your belly. You scramble\
        \ but their hips are already past your guard. Mounted."
      - "A cross-face drives your head to the mat. In the same motion\
        \ {actor}'s knee swings over and their weight drops on you."
      - "You feel the knee-slide before you can react. {actor}\
        \ steps over and settles in mount."
    observer:
      - "{actor} knee-slides across {actee}'s torso into\
        \ full mount."
      - "{actor} pins {actee}'s head with a cross-face\
        \ and swings into mount."
      - "{actor} undercuts {actee}'s frame and mounts them."

  sidecontrol_to_background:
    actor:
      - "They roll to their knees under the pressure. You ride them up,\
        \ slap on the seatbelt, and drag them back down with hooks in."
      - "As they turtle you flow to their back: one hook, then two,\
        \ chest tight on their spine."
      - "You sense the turn coming and time it: as they face down you spin\
        \ to the back, threading both legs around their hips."
    actee:
      - "You try to come up to your knees but {actor} rides the\
        \ turtle and wraps over your shoulder. Seatbelt. Their hooks\
        \ dig in."
      - "Rolling to escape side control hands {actor} your back.\
        \ They follow and settle in before you can stand."
      - "{actor} reads your roll and is already at your back as\
        \ you face the floor."
    observer:
      - "{actee} turtles; {actor} rides to their back\
        \ and sinks both hooks."
      - "{actor} times {actee}'s roll and flows to back\
        \ mount from side control."
      - "{actee} comes to their knees; {actor} follows\
        \ and takes the back."

  # ── Knee-On-Belly exits ─────────────────────────────────────────────────
  kob_to_mount:
    actor:
      - "You slide your knee forward off the belly and step the foot\
        \ through into mount without them finding a frame."
      - "Their elbows crash inward to relieve the knee pressure; you use\
        \ the gap to swing the leg over. Mount."
      - "A quick shift of your base and the knee crosses the hip line;\
        \ you settle into full mount before they recover breath."
    actee:
      - "You bridge against {actor}'s knee and they slide it\
        \ forward, straight into mount, heavier and worse."
      - "You try to shrimp but {actor} steps the knee through\
        \ before you clear the hip. Mounted."
      - "{actor}'s knee slides off your belly and their weight\
        \ redistributes. Full mount drops on you."
    observer:
      - "{actor} slides the knee off {actee}'s belly\
        \ and settles into full mount."
      - "{actee} pushes the knee but {actor} steps\
        \ through into mount."
      - "{actor} shifts base and transitions knee-on-belly into\
        \ full mount on {actee}."

  kob_to_background:
    actor:
      - "They roll away from the knee to find breathing room. You jump\
        \ the roll and land on their back, already hunting hooks."
      - "As they face down to escape the pressure, you flow behind them:\
        \ seatbelt cinched, hooks threading in."
      - "You read the roll before it happens. By the time they're face-down\
        \ you're coiled at their back with both legs locked in."
    actee:
      - "You roll to get away from {actor}'s knee, but they flow\
        \ with you and end up at your back. Hooks dig into your hips."
      - "Facing down feels safer than the knee on your stomach, but\
        \ {actor} is already sinking the seatbelt across your\
        \ shoulder."
      - "{actor} reads your escape roll. You're face-down, they're\
        \ behind you, hooks in."
    observer:
      - "{actee} rolls to escape the knee; {actor} flows\
        \ to their back and sinks hooks."
      - "{actor} times {actee}'s face-down escape from\
        \ knee-on-belly and lands in back mount."
      - "{actee} turns away from the knee; {actor}\
        \ follows and takes the back."

  # ── North-South exits ───────────────────────────────────────────────────
  ns_to_sidecontrol:
    actor:
      - "You rotate ninety degrees, framing the shoulder, and drop your\
        \ hip across their chest: side control."
      - "From north-south you step the near knee down to the hip line,\
        \ pivot, and stack into side control."
      - "You shift your weight laterally, catch the far arm, and swing\
        \ your hip across to land in side control."
    actee:
      - "{actor} pivots out of north-south and drops their hip\
        \ across your chest. You're in side control before you can frame."
      - "The weight shifts sideways. {actor} steps through and\
        \ stacks on your chest in side control."
      - "{actor} catches your far arm and swings their hip across;\
        \ you're now under side control."
    observer:
      - "{actor} rotates from north-south and drops into side\
        \ control on {actee}."
      - "{actor} steps the knee down and pivots into side control\
        \ from north-south."
      - "{actor} swings the hip across {actee} and\
        \ settles in side control."

  ns_to_mount:
    actor:
      - "You walk your hips forward along their body line and swing your\
        \ legs over in one smooth pivot into mount."
      - "From north-south you creep forward, thread the legs past the\
        \ elbows, and land in mount before they can bridge."
      - "A sharp forward drive with both knees slides you past the guard\
        \ line. You drop into full mount."
    actee:
      - "{actor} walks forward from north-south and swings into\
        \ mount. You're pinned before you can lift your hips."
      - "They thread through the arms from above and {actor}'s\
        \ knees clear your guard and they drop into mount."
      - "{actor} creeps forward and the transition happens too\
        \ fast to stop. Full mount."
    observer:
      - "{actor} walks forward from north-south and pivots into\
        \ full mount on {actee}."
      - "{actor} threads the legs through {actee}'s\
        \ elbows and lands in mount."
      - "{actor} slides from north-south into full mount before\
        \ {actee} can bridge."

  ns_to_background:
    actor:
      - "You spin fully, hips over their face, and drive forward. They\
        \ roll to stay oriented and hand you the back."
      - "A north-south choke setup forces them to turn; you ride the\
        \ roll and arrive at their back with a seatbelt ready."
      - "You creep forward past the shoulder line. They turtle to protect\
        \ the neck. You take the seatbelt and drop both hooks."
    actee:
      - "{actor} drives into a north-south choke position. You\
        \ roll to escape and wake up with them at your back."
      - "You turn to protect your neck from north-south and\
        \ {actor} flows right behind you."
      - "{actor} advances past your shoulder. You turtle and\
        \ they immediately take the seatbelt and back mount."
    observer:
      - "{actee} rolls to avoid a north-south choke setup;\
        \ {actor} takes the back."
      - "{actor} drives past {actee}'s shoulder line\
        \ from north-south; {actee} turtles and the back is\
        \ taken."
      - "{actor} spins toward {actee}'s hips and follows\
        \ the roll to back mount."

  # ── Half Guard exits ────────────────────────────────────────────────────
  halfguard_to_sidecontrol:
    actor:
      - "You hip-escape, free the trapped leg with a knee-slice, and\
        \ clear the half guard into side control."
      - "A cross-face and underhook flatten them out; you walk the knee\
        \ through and post in side control."
      - "You dig the underhook and switch your hips and the trapped leg\
        \ pops free and you stack into side control."
    actee:
      - "{actor} knee-slices through your half guard. The leg\
        \ pops free and they sprawl into side control."
      - "A cross-face grinds your head away while {actor} walks\
        \ through the trapped leg. Side control."
      - "{actor} underhooks, switches their hips, and your\
        \ half guard collapses. They land in side control."
    observer:
      - "{actor} knee-slices through {actee}'s half\
        \ guard and settles in side control."
      - "{actor} flattens {actee} with cross-face and\
        \ underhook, then passes to side control."
      - "{actee}'s half guard breaks; {actor} posts into\
        \ side control."

  halfguard_to_mount:
    actor:
      - "You flatten them out, free the trapped leg, and step directly\
        \ over into mount without pausing in side control."
      - "A deep underhook lifts their shoulder; you thread the knee over\
        \ their hip and go straight to mount."
      - "You drive the cross-face hard, walk the knee through the half\
        \ guard, and step into mount in one flowing sequence."
    actee:
      - "{actor} frees their leg and steps directly into mount.\
        \ No pause, no warning. You're mounted."
      - "The underhook pries your shoulder up and {actor}'s knee\
        \ threads past your guard. Mount."
      - "{actor} drives the cross-face and your half guard\
        \ crumbles. The knee threads through and they mount you."
    observer:
      - "{actor} frees the trapped leg from {actee}'s\
        \ half guard and steps straight into mount."
      - "{actor} underhooks {actee}'s shoulder and\
        \ knee-threads into mount."
      - "{actee}'s half guard collapses; {actor} steps\
        \ directly into mount."

  halfguard_to_background:
    actor:
      - "They roll to prevent the pass. You abandon the leg, slap the\
        \ seatbelt over their shoulder, and drag them to their back."
      - "A wide guard-pass attempt forces them face-down. You flow\
        \ immediately to their back: one hook, then two."
      - "They give up the half guard by rolling. You read it, back-step\
        \ out of the leg entanglement, and take the back."
    actee:
      - "You roll to block {actor}'s pass but you expose your\
        \ back. They wrap the seatbelt and the hooks land."
      - "{actor} backs out of the leg trap and flows to your\
        \ back before you can stand."
      - "You abandon the half guard to come to your knees;\
        \ {actor} takes the back in the transition."
    observer:
      - "{actee} rolls to block the pass; {actor} takes\
        \ the back from half guard."
      - "{actor} back-steps the leg trap and flows to\
        \ {actee}'s back."
      - "{actee} comes to their knees from half guard;\
        \ {actor} seizes the back mount."

  # ── Guard exits (controller starts on bottom, sweep = advance) ──────────
  guard_to_sidecontrol:
    actor:
      - "You off-balance them with a hip bump, catch the arm on the way\
        \ over, and come up in side control."
      - "A scissor sweep rolls them and you pop straight up to side\
        \ control before they can frame."
      - "You plant a foot on the hip, push them sideways, and follow them\
        \ to the top: side control."
    actee:
      - "The hip bump catches you leaning; you tip and {actor}\
        \ comes up over you into side control."
      - "{actor}'s scissor sweep dumps you sideways. You land\
        \ flat and they're already stacking."
      - "A foot drives into your hip and the world tilts. {actor}\
        \ is on top in side control."
    observer:
      - "{actor} hip-bumps {actee} and sweeps to side\
        \ control."
      - "{actor} scissor-sweeps {actee} and posts in\
        \ side control."
      - "{actee} is swept sideways; {actor} comes up to\
        \ side control."

  guard_to_mount:
    actor:
      - "You trap the arm and bridge the hips. The sweep rolls them\
        \ over and puts you on top in mount."
      - "A pendulum sweep with the legs sends them airborne. You swing\
        \ up and land in mount before they settle."
      - "You break their posture with a collar grip, roll them over your\
        \ hips, and land in full mount."
    actee:
      - "The arm trap locks your elbow and the hip bridge sends you\
        \ rolling. {actor} is mounted on your chest."
      - "{actor}'s leg pendulum catches your weight mid-pass.\
        \ You fly over and land with them mounted."
      - "A collar-and-hip roll breaks your base. {actor} winds\
        \ up in full mount."
    observer:
      - "{actor} arm-trap bridges {actee} and sweeps\
        \ to mount."
      - "{actor} pendulum-sweeps {actee} and lands in\
        \ full mount."
      - "{actee} is collar-dragged over {actor}'s hips;\
        \ {actor} mounts them."

  guard_to_background:
    actor:
      - "They posture to escape the guard; you take the back in the\
        \ scramble: seatbelt on, hooks threading in."
      - "You transition to a back-take by rolling to the side, trapping\
        \ the arm, and swinging behind them as they try to stand."
      - "As they push up to break the guard you roll to the side and\
        \ take the back, hooks in before their knees straighten."
    actee:
      - "You posture to escape {actor}'s guard and they follow\
        \ you up, slapping on the seatbelt. Back mount."
      - "{actor} rolls sideways and arrives at your back as you\
        \ try to stand, hooks already in."
      - "You push up to break the guard and {actor} transitions\
        \ right behind you. The hooks dig in before you're upright."
    observer:
      - "{actee} postures to escape; {actor} takes the\
        \ back with a seatbelt and hooks."
      - "{actor} rolls to {actee}'s back in the guard\
        \ scramble and sinks both hooks."
      - "{actee} pushes to stand; {actor} swings\
        \ behind them and takes back mount."

  # ── Turtle exits ────────────────────────────────────────────────────────
  turtle_to_background:
    actor:
      - "You drive a seatbelt grip over the far shoulder, kick one heel\
        \ across their hip, and roll them onto their back, hooks in."
      - "You dig under the far arm, lock the seatbelt, and roll them to\
        \ the side. Both hooks land as they straighten out."
      - "A clock-choke setup forces them to react; they expose the hip\
        \ and you sink one hook, then drag them to their back for the\
        \ second."
    actee:
      - "{actor} clamps the seatbelt across your far shoulder\
        \ and rolls you over. You land on your back, hooks already in."
      - "The seatbelt snaps tight under your arm and {actor}\
        \ rolls you to the side. Their hooks dig into your hips."
      - "You resist the clock-choke by shifting your hip but\
        \ {actor} threads a hook in on that side and flattens\
        \ you out."
    observer:
      - "{actor} seatbelts {actee} from turtle and\
        \ rolls them to back mount."
      - "{actor} locks a seatbelt under {actee}'s far\
        \ arm and rolls them to the side, sinking hooks."
      - "{actee} exposes a hip resisting the clock-choke;\
        \ {actor} threads a hook in and flattens them to back\
        \ mount."

degradations:
  # ── BackStanding degradation ─────────────────────────────────────────────
  backstanding_to_clinch:
    actor:
      - "{actee} pivots hard and strips your waist grip. Suddenly\
        \ you're facing each other in a clinch instead of riding their back."
      - "They duck the chin, peel your hand off the seatbelt, and spin to\
        \ face you. The back control dissolves into a chest-to-chest clinch."
      - "A sharp elbow drives into your forearm and your grip breaks.\
        \ {actee} wheels around before you can reestablish. Clinch."
    actee:
      - "You drop your chin, peel {actor}'s seatbelt hand, and\
        \ pivot hard. Their grip peels away and you're face-to-face in a\
        \ clinch."
      - "You drive your elbow back into {actor}'s forearm and feel\
        \ the grip loosen. You spin out and secure the clinch before they\
        \ can adjust."
      - "You shuck the waist lock sideways and rotate into {actor}.\
        \ Back control becomes clinch, still in their space, but facing\
        \ them now."
    observer:
      - "{actee} peels {actor}'s seatbelt grip and pivots\
        \ to face them; back control gives way to a clinch."
      - "{actee} drives an elbow back, strips the grip, and wheels\
        \ around into a clinch with {actor}."
      - "{actee} shucks the waist lock and rotates out;\
        \ {actor} can only follow into a mutual clinch."

  # ── Mount degradation ────────────────────────────────────────────────────
  mount_to_sidecontrol:
    actor:
      - "{actee} bridges hard and hip-escapes and your mount slides\
        \ off into side control."
      - "You can't keep your base. {actee} shrimps free and lands\
        \ in side control."
      - "A frame on your hip pries your knees apart; you settle for side\
        \ control."
    actee:
      - "You bridge hard and shrimp the hip free.\
        \ {actor}'s mount slides off you and into side control."
      - "Your elbow frames between you and {actor}'s hip. You\
        \ hip-escape and they settle for side."
      - "You buckle your knees and arc your back. {actor} loses\
        \ base; you scramble to side."
    observer:
      - "{actee} bridges and hip-escapes from under\
        \ {actor}; the mount slides to side control."
      - "{actee} shrimps a frame in; {actor} can't hold\
        \ mount and settles for side."
      - "{actee}'s buckle-and-arc pries {actor} off;\
        \ mount becomes side control."

# NOTE: degradation keys above use controller/controlled/observers
# (TemplateTriad). Gradient keys below use self/partner/observers
# (GradientTriad) — different type, different YAML field names.

  # ── SideControl degradation ──────────────────────────────────────────────
  sidecontrol_to_halfguard:
    actor:
      - "{actee} threads a knee inside and recovers half guard.\
        \ Your side control compresses to a half-guard pin."
      - "They worm their near knee across your hip and you feel the half\
        \ guard close around your leg. Side control tightens to half guard."
      - "A frame on your shoulder creates just enough space.\
        \ {actee} pumps the near knee in and recovers half guard."
    actee:
      - "You elbow-frame {actor}'s shoulder and work your near\
        \ knee inside. It threads through and you close the half guard."
      - "You shrimp out on the hip side, make space, and pump your knee\
        \ through. Half guard recovered."
      - "You post the inside elbow, flatten your near hip, and pull the\
        \ knee in. {actor}'s side control compresses to half guard."
    observer:
      - "{actee} elbow-frames and threads the near knee inside;\
        \ side control becomes half guard."
      - "{actee} shrimps a gap on the hip and recovers half\
        \ guard on {actor}."
      - "{actee} posts the inside elbow and pumps the knee\
        \ through; {actor} is reduced to half guard."

  # ── Knee-On-Belly degradation ────────────────────────────────────────────
  kob_to_sidecontrol:
    actor:
      - "{actee} shrimps sideways and knocks your knee off their\
        \ belly. You drop your hip back down into side control."
      - "They bridge off the knee pressure and twist. You can't rebalance\
        \ Your base falls and you settle for side control."
      - "A two-handed push on your knee breaks the pin; you ride the shove\
        \ down into side control instead."
    actee:
      - "You shrimp into {actor} and knock the knee off your belly\
        \ and they drop back into side control. Uncomfortable, but better."
      - "You bridge against the knee and twist your hips out. The knee-on-\
        \ belly collapses and {actor} settles for side control."
