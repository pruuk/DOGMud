  # ── North-South degradation ──────────────────────────────────────────────
  ns_to_sidecontrol:
    actor:
      - "{actee} turns their hips out and frames your thigh away.\
        \ North-south loses grip and you slide to side control."
      - "They shrimp their hips sideways and you can't follow. You settle\
        \ for side control rather than lose position entirely."
      - "A bridge and hip roll pries your weight off center;\
        \ {actee} angles out and you drop to side control."
    actee:
      - "You shrimp your hips sideways and frame {actor}'s thigh\
        \ out. Their north-south hold breaks; they slide to side control."
      - "You bridge and roll the hips. {actor} loses alignment and\
        \ slides off to side control, and you take it."
      - "You work the elbow frame against {actor}'s knee and angle\
        \ your hips out until the north-south hold breaks into side control."
    observer:
      - "{actee} shrimps the hips and frames {actor}'s\
        \ thigh away; north-south degrades to side control."
      - "{actee} bridges and hip-rolls out from under\
        \ {actor}; the position becomes side control."
      - "{actee} elbow-frames {actor}'s knee and angles\
        \ free; north-south collapses to side control."

  # ── Crucifix degradation ─────────────────────────────────────────────────
  crucifix_to_background:
    actor:
      - "{actee} rolls the trapped arm free and the crucifix\
        \ unravels. You're left with back mount instead."
      - "They force the elbow inside and break your arm trap. The crucifix\
        \ is gone and you settle onto their back."
      - "A violent roll strips the figure-four on the arm.\
        \ {actee} pulls free and you return to back mount."
    actee:
      - "You force your elbow down, drive the arm inside {actor}'s\
        \ grip, and break the figure-four. The crucifix falls apart and\
        \ you're back to back mount."
      - "You tuck the chin, bridge into the arm trap, and roll the elbow\
        \ free. {actor} loses the crucifix and settles for back\
        \ mount."
      - "You flatten the arm and swim it through the trap. The crucifix\
        \ dissolves. {actor} still has your back, but the arm\
        \ is free."
    observer:
      - "{actee} forces the elbow inside {actor}'s grip\
        \ and breaks the arm trap; crucifix falls back to back mount."
      - "{actee} bridges into the figure-four and rolls the arm\
        \ free; {actor} loses the crucifix."
      - "{actee} swims the trapped arm through;\
        \ {actor}'s crucifix unravels to back mount."

  # ── BackGround degradation ───────────────────────────────────────────────
  background_to_mount:
    actor:
      - "{actee} turns into you and they roll face-up and pull\
        \ you forward. You're in mount now, on top but no longer at the\
        \ back."
      - "They hip-escape sideways and drag your top hook down. You\
        \ tumble forward as they rotate, and the position becomes mount."
      - "A fast roll toward your hook-side spins them face-up.\
        \ {actee} pulls you over and you land in mount."
    actee:
      - "You roll toward {actor}'s hook-side, drag the top hook\
        \ down, and pull them forward. Back mount becomes mount. You're\
        \ face-up now with {actor} on top."
      - "You hip-escape to the side and torque your upper body toward\
        \ {actor}. They tumble forward and the position flips\
        \ to mount."
      - "You post the outside elbow and roll hard toward the hook.\
        \ {actor} loses the back and lands in mount, but you\
        \ escaped the back."
    observer:
      - "{actee} rolls toward {actor}'s hook-side and\
        \ pulls them forward; back mount becomes mount."
      - "{actee} hip-escapes and turns face-up;\
        \ {actor} tumbles forward into mount."
      - "{actee} rolls hard toward the hook and drags\
        \ {actor} over; back mount gives way to front mount."

  # ── Half Guard degradation ───────────────────────────────────────────────
  halfguard_to_guard:
    actor:
      - "{actee} wiggles the trapped leg out and closes full\
        \ guard. Your half-guard pin is gone, with both legs locked around\
        \ your waist."
      - "They shrimp to create space and drag the knee through. Half\
        \ guard becomes full guard before you can flatten them again."
      - "A hip bump creates enough room for {actee} to pull\
        \ the second leg free. Full guard closes and the pass resets."
    actee:
      - "You shrimp hard on the pinned side, create a little space,\
        \ and drag the knee through. Half guard becomes full guard."
      - "You hip-bump {actor} to break their weight and snake\
        \ the second leg free. Full guard: you're back in the fight."
      - "You bridge and shrimp, working the trapped knee toward the\
        \ center until it clears {actor}'s thigh. Full guard\
        \ locks in."
    observer:
      - "{actee} shrimps and drags the trapped knee through;\
        \ half guard becomes full guard on {actor}."
      - "{actee} hip-bumps {actor} and pulls the\
        \ second leg free; full guard closes."
      - "{actee} bridges and shrimps the knee clear;\
        \ {actor}'s half guard becomes full guard."
reversals:
  # ── Mount Reversal ──────────────────────────────────────────────────────────
  # Bridge-and-roll: former controller tumbles forward into closed guard.
  mount_reverse:
    actor:
      - "{actee} bridges and you tumble forward. They roll up\
        \ between your legs and now you're in their guard."
      - "Your base evaporates. {actee} bucks you off and comes up\
        \ between your legs: full guard."
      - "Hooks dig under your hips and lift; you cartwheel forward into their\
        \ guard."
