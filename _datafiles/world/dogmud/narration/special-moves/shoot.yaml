moveid: shoot
# Mobs and players draw from one pool per event (M6 slice 2, ledger row 56). Variant N of every role describes one moment.
events:
  # hit/partial/miss carry the shooter's own actor line and the target's actee
  # line. The room line for a same-room shot comes from fire_announce instead.
  hit:
    actor:
      - 'Your shot strikes {actee}! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your shot takes {actee}! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor}''s shot strikes you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s shot strikes you! (<ansi fg="damage">{damage}</ansi>)'
  partial:
    actor:
      - 'Your shot grazes {actee}! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your shot only half finds {actee}, but the edge of it still barely hits them! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor}''s shot grazes you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s shot only half finds you, but the edge of it still barely hits you! (<ansi fg="damage">{damage}</ansi>)'
  miss:
    actor:
      - 'Your shot narrowly misses {actee}!'
      - 'Your shot flies past {actee}!'
    actee:
      - '{actor}''s shot narrowly misses you!'
      - '{actor}''s shot narrowly misses you!'
  # The ambush shot's own actor line, for a shooter firing from concealment.
  # Actor only: the room and the target learn about the shot through
  # fire_announce and hit/partial/miss as usual; this is the extra line the
  # SHOOTER alone reads, and it is why the surprise shot feels different from
  # an ordinary one.
  surprise_hit:
    actor:
      - 'Your shot from cover takes {actee} unaware! (<ansi fg="damage">{damage}</ansi>)'
  surprise_miss:
    actor:
      - 'Your shot from cover flies past {actee}!'
  fire_announce:
    observer:
      - '{actor} fires their {weapon} at {actee}!'
  fire_depart:
    observer:
      - '{actor} fires their {weapon} towards the <ansi fg="exit">{exitname}</ansi>.'
  # The defender's room sees the shot arrive. Go picks the key from two axes --
  # whether an exit back to the shooter is known, and the outcome -- so each of
  # the six is a COMPLETE sentence. An earlier draft composed this from
  # an origin and a verb fragment, which made hit/partial/miss carry a
  # remote_observer role holding half a clause. Enumerating costs six short
  # lines and buys a store where every authored value is a sentence.
  arrival_unknown_hit:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and strikes {actee}!'
  arrival_unknown_partial:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and barely hits {actee}!'
  arrival_unknown_miss:
    remote_observer:
      - 'A shot streaks in from somewhere nearby and narrowly misses {actee}!'
  arrival_known_hit:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and strikes {actee}!'
  arrival_known_partial:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and barely hits {actee}!'
  arrival_known_miss:
    remote_observer:
      - 'A shot streaks in from beyond the <ansi fg="exit">{exitname}</ansi> and narrowly misses {actee}!'
