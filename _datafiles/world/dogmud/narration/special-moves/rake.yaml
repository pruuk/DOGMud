moveid: rake
# Mobs and players draw from one pool per event (M6 slice 2, ledger row 56). Variant N of every role describes one moment.
events:
  hit:
    actor:
      - 'Your claws rake {actee}, opening bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your claws rake across {actee}, opening raking gashes that weep! (<ansi fg="damage">{damage}</ansi>)'
      - 'You slash {actee} with raking claws, leaving bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your raking strike tears into {actee}! (<ansi fg="damage">{damage}</ansi>)'
      - 'You drive your claws across {actee}''s flesh and blood wells up! (<ansi fg="damage">{damage}</ansi>)'
      - 'A vicious rake of your claws shreds {actee}! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor}''s claws rake you, opening bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} rakes their claws across you, opening bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} slashes you with raking claws! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s raking strike tears into you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} drives their claws across your flesh and you bleed! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s vicious rake of claws shreds you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} rakes their claws across {actee}!'
      - '{actor} rakes their claws across {actee}!'
      - '{actor} slashes {actee} with raking claws!'
      - '{actor}''s claws tear into {actee}!'
      - '{actor} drives their claws across {actee}''s flesh, drawing blood!'
      - '{actor}''s vicious rake of claws shreds {actee}!'
  partial:
    actor:
      - 'Your claws still scratch {actee} as they get mostly clear! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your raking claws only half land on {actee}, but still leave a shallow scratch! (<ansi fg="damage">{damage}</ansi>)'
      - '{actee} stops most of your swipe, but your claws still catch them! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor}''s claws still scratch you as you get mostly clear! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} rakes their claws at you; the rake only half lands, but still scratches you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} swipes at you; you stop most of it, but not all! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor}''s claws still scratch {actee}, who gets mostly clear!'
      - '{actor} rakes their claws at {actee}; the rake only half lands, but still scratches!'
      - '{actor} swipes at {actee}, who stops most of it but not all!'
  # DIVERGENT (Task 3, owner-approved 2026-09-21): variants 1 to 3 (the
  # player's original lines) describe different feels -- plain miss / dodge
  # / rake glances off -- one feel per variant across all three roles.
  miss:
    actor:
      - 'You swipe your claws at {actee}, but miss!'
      - 'Your raking claws miss {actee}!'
      - 'You swipe at {actee} but they dodge your claws!'
      - 'Your rake glances off {actee} harmlessly!'
    actee:
      - '{actor} swipes their claws at you, but misses!'
      - '{actor} rakes their claws at you, but misses!'
      - '{actor} swipes at you but you dodge!'
      - '{actor}''s rake glances off you harmlessly!'
    observer:
      - '{actor} swipes their claws at {actee}, but misses!'
      - '{actor} rakes their claws at {actee}, but misses!'
      - '{actor} swipes at {actee}, who dodges the claws!'
      - '{actor}''s rake glances off {actee} harmlessly!'
