moveid: maul
# Mobs and players draw from one pool per event (M6 slice 2, ledger row 56). Variant N of every role describes one moment.
events:
  hit:
    actor:
      - 'Your fangs savage {actee}, tearing bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your fangs savage {actee}, tearing wounds that weep blood! (<ansi fg="damage">{damage}</ansi>)'
      - 'You maul {actee}, worrying their flesh with savage fury! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your savage bite tears into {actee}! (<ansi fg="damage">{damage}</ansi>)'
      - 'You drive your fangs into {actee} and worry the wound viciously! (<ansi fg="damage">{damage}</ansi>)'
      - 'A brutal mauling drives your teeth deep into {actee}! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} savages you with vicious fangs, tearing bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} savages you with their fangs, tearing bleeding wounds! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} mauls you, worrying your flesh with savage fury! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s savage bite tears into you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} drives their fangs into you and worries the wound! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s brutal mauling drives their teeth deep into you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} savages {actee} with vicious fangs!'
      - '{actor} savages {actee} with vicious fangs!'
      - '{actor} mauls {actee} savagely!'
      - '{actor}''s fangs tear deep into {actee}!'
      - '{actor} drives their fangs into {actee} and worries the wound viciously!'
      - '{actor}''s brutal mauling drives fangs deep into {actee}!'
  partial:
    actor:
      - 'Your fangs still tear {actee} as they get mostly clear! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your bite only half lands on {actee}, but still tears a shallow gash! (<ansi fg="damage">{damage}</ansi>)'
      - '{actee} avoids the worst of your bite, but your fangs still rake them! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} snaps at you and you get mostly clear, but the fangs still tear you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} snaps at you; the bite only half lands, but the fangs still tear you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} lunges to maul you; you avoid most of it, but not all! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} snaps at {actee}, who gets mostly clear but still gets torn!'
      - '{actor} lunges to maul {actee}; the bite only half lands, but still tears them!'
      - '{actor} lunges to maul {actee}, who avoids most of it but not all!'
  # DIVERGENT (Task 3, owner-approved 2026-09-21): variants 1 to 3 (the
  # player's original lines) describe different feels -- bite misses / snap
  # and dodge / lunge glances off -- one feel per variant across all three
  # roles.
  miss:
    actor:
      - 'You snap your fangs at {actee}, but miss!'
      - 'Your savage bite misses {actee}!'
      - 'You snap at {actee} but they dodge your fangs!'
      - 'Your mauling lunge glances off {actee} harmlessly!'
    actee:
      - '{actor} snaps their fangs at you, but misses!'
      - '{actor} snaps their fangs at you, but misses!'
      - '{actor} lunges to maul you but you dodge!'
      - '{actor}''s mauling lunge glances off you harmlessly!'
    observer:
      - '{actor} snaps their fangs at {actee}, but misses!'
      - '{actor} lunges to maul {actee}, but misses!'
      - '{actor} snaps at {actee}, who dodges the fangs!'
      - '{actor}''s mauling lunge glances off {actee} harmlessly!'
