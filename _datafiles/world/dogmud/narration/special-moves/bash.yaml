moveid: bash
# Mobs and players draw from one pool per event (M6 slice 2, ledger row 56). Variant N of every role describes one moment.
events:
  knockdown:
    actor:
      - 'Your <ansi fg="yellow-bold">{label}</ansi> knocks {actee} to the ground! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your <ansi fg="yellow-bold">{label}</ansi> sends {actee} crashing to the ground! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor}''s <ansi fg="yellow-bold">{label}</ansi> knocks you to the ground! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s <ansi fg="yellow-bold">{label}</ansi> sends you crashing to the ground! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor}''s <ansi fg="yellow-bold">{label}</ansi> knocks {actee} to the ground!'
      - '{actor}''s <ansi fg="yellow-bold">{label}</ansi> sends {actee} crashing to the ground!'
  hit:
    actor:
      - 'Your <ansi fg="yellow-bold">{label}</ansi> strikes {actee} hard! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your <ansi fg="yellow-bold">{label}</ansi> catches {actee} squarely! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor}''s <ansi fg="yellow-bold">{label}</ansi> strikes you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s <ansi fg="yellow-bold">{label}</ansi> catches you squarely! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} {verb} {actee} {with}!'
      - '{actor}''s {label} catches {actee} squarely!'
  partial:
    actor:
      - 'Your <ansi fg="yellow-bold">{label}</ansi> fails to floor {actee}, but lands! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your <ansi fg="yellow-bold">{label}</ansi> fails to floor {actee}, but still hits! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor}''s <ansi fg="yellow-bold">{label}</ansi> fails to floor you, but still crashes into you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s <ansi fg="yellow-bold">{label}</ansi> fails to floor you, but hits you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} {verb} {actee} {with}, but fails to floor them!'
      - '{actee} staggers under {actor}''s {label}, but stays up!'
  miss:
    actor:
      - 'Your <ansi fg="yellow-bold">{label}</ansi> misses {actee}!'
      - '{actee} avoids your <ansi fg="yellow-bold">{label}</ansi>!'
    actee:
      - '{actor} attempts a {label}, but misses!'
      - 'You avoid {actor}''s {label}!'
    observer:
      - '{actor} attempts to bash {actee}, but misses!'
      - '{actee} avoids {actor}''s {label}!'
