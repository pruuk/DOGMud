moveid: gore
# Mobs and players draw from one pool per event (M6 slice 2, ledger row 56). Variant N of every role describes one moment.
events:
  knockdown:
    actor:
      - 'You charge into {actee} and drive them to the ground! (<ansi fg="damage">{damage}</ansi>)'
      - 'You lower your head and charge {actee}, driving your horns in and sending them flying! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your charge slams into {actee} with bone-jarring force, hurling them to the ground! (<ansi fg="damage">{damage}</ansi>)'
      - 'You thunder forward and gore {actee}, tossing them aside like a ragdoll! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your horns catch {actee} and you heave them backward off their feet! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} charges into you, driving you to the ground! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} lowers their head and charges you. The impact sends you sprawling! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} drives their horns into you with shattering force and hurls you to the ground! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s charge catches you and tosses you off your feet! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s horns catch you and they heave you backward off your feet! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} charges into {actee} and hurls them to the ground!'
      - '{actor} charges {actee} and hurls them to the ground!'
      - '{actor} drives their horns into {actee} and sends them flying!'
      - '{actor}''s horned charge tosses {actee} off their feet!'
      - '{actor}''s horns catch {actee} and heave them backward off their feet!'
  hit:
    actor:
      - 'You drive your horns into {actee} with a powerful charge! (<ansi fg="damage">{damage}</ansi>)'
      - 'You ram your horns into {actee} with a powerful charge! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your horned charge drives into {actee}, rocking them back! (<ansi fg="damage">{damage}</ansi>)'
      - 'You lower your head and slam your horns into {actee}! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your charge catches {actee} with your horns, drawing a pained grunt! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} drives their horns into you with a powerful charge! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} charges and drives their horns into you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s horned charge slams into you and rocks you back! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} lowers their head and rams their horns into you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s charge catches you with their horns, drawing a pained grunt from you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} drives their horns into {actee}!'
      - '{actor} charges {actee} and drives their horns in!'
      - '{actor}''s horned charge slams into {actee}!'
      - '{actor} lowers their head and slams their horns into {actee}!'
      - '{actor}''s charge catches {actee} with their horns, drawing a pained grunt!'
  partial:
    actor:
      - 'Your horns still graze {actee} as they get mostly clear! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your charge at {actee} is mostly stopped, but your horns still graze them! (<ansi fg="damage">{damage}</ansi>)'
      - '{actee} takes only part of your charge, but your horns still catch them! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} charges you and you get mostly clear, but the horns still graze you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} charges you and you stop most of it, but the horns still graze you! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} thunders toward you; you avoid most of the gore, but not all! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} charges {actee}, who gets mostly clear but still gets grazed by the horns!'
      - '{actor} charges {actee}, who stops most of it but still gets grazed by the horns!'
      - '{actor} charges {actee}, who takes only part of it but still gets caught by the horns!'
  # DIVERGENT (Task 4b Step 3, owner-approved 2026-09-21): variants 1 to 3
  # (the player's original lines) describe different feels -- target
  # sidesteps / target dodges / charge carries past -- one feel per variant
  # across all three roles.
  miss:
    actor:
      - 'You charge at {actee}, but they sidestep the gore!'
      - 'Your charge at {actee} misses as they sidestep your horns!'
      - 'You thunder toward {actee} but they dodge your gore!'
      - 'Your horned charge carries you past {actee}. They step aside!'
    actee:
      - '{actor} charges at you, but you sidestep the gore!'
      - '{actor} charges you but you sidestep their horns!'
      - '{actor} thunders toward you, but you dodge the gore!'
      - '{actor}''s horned charge carries them past you as you step aside!'
    observer:
      - '{actor} charges at {actee}, but misses!'
      - '{actor} charges {actee}, but misses!'
      - '{actor} thunders toward {actee}, who dodges the gore!'
      - '{actor}''s horned charge carries them past {actee}, who steps aside!'
