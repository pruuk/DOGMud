moveid: grapple
# Mobs and players draw from one pool per event (M6 slice 2, ledger row 56). Variant N of every role describes one moment.
events:
  success:
    actor:
      - 'You <ansi fg="yellow-bold">grapple</ansi> {actee} into <ansi fg="cyan">{position}</ansi> position!'
      - 'You <ansi fg="yellow-bold">grapple</ansi> {actee}, transitioning to <ansi fg="cyan">{position}</ansi> position!'
    actee:
      - '{actor} <ansi fg="yellow-bold">grapples</ansi> you, transitioning to <ansi fg="cyan">{position}</ansi> position!'
      - '{actor} <ansi fg="yellow-bold">grapples</ansi> you, transitioning to <ansi fg="cyan">{position}</ansi> position!'
    observer:
      - '{actor} <ansi fg="yellow-bold">grapples</ansi> {actee} into <ansi fg="cyan">{position}</ansi> position!'
      - '{actor} <ansi fg="yellow-bold">grapples</ansi> {actee} into <ansi fg="cyan">{position}</ansi> position!'
  fail:
    actor:
      - 'You try to grapple {actee}, but they slip away!'
      - 'Your <ansi fg="yellow-bold">grapple</ansi> attempt against {actee} fails!'
    actee:
      - '{actor} tries to grapple you, but you slip away!'
      - '{actor} tries to grapple you, but you slip away!'
    observer:
      - '{actor} tries to grapple {actee}, but fails!'
      - '{actor} tries to grapple {actee}, but fails!'
  # crit_failure and disarm are shared between the mob and player call sites
  # via internal/combat/grapple_narration.go.
  crit_failure:
    actor:
      - '<ansi fg="red-bold">You overextend badly and fall to the ground!</ansi>'
    actee:
      - '<ansi fg="yellow-bold">Your opponent overextends and falls - you see an opening!</ansi>'
    observer:
      - '<ansi fg="combat">The failed grapple sends them sprawling!</ansi>'
  disarm:
    actor:
      - '<ansi fg="yellow-bold">You disarm {actee_plain}, loosening their grip on their <ansi fg="item">{weapon}</ansi>!</ansi>'
    actee:
      - '<ansi fg="red-bold">{actor_plain} disarms you! Your <ansi fg="item">{weapon}</ansi> slips from your grasp!</ansi>'
    observer:
      - '<ansi fg="combat">{actor_plain} disarms {actee_plain}, knocking their <ansi fg="item">{weapon}</ansi> loose!</ansi>'
  # Private knowledge: no actee or observer line. A room line here would
  # invent an observation nobody in the room made, about a grapple the
  # success event already narrated to them.
  prone_penalty:
    actor:
      - '<ansi fg="yellow">{actee_plain} was already prone - they had little chance to resist!</ansi>'
  defense_exposed:
    actor:
      - '<ansi fg="red">Your failed attempt leaves you exposed!</ansi>'
