moveid: hamstring
events:
  hit:
    actee:
      - '{actor} lunges low and tears into your legs! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} lunges low and tears into {actee}''s legs!'
  partial:
    actee:
      - '{actor} lunges low at your legs; you avoid the worst of it, but it still catches you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} lunges low at {actee}, who avoids the worst of it but still gets caught!'
  miss:
    actee:
      - '{actor} lunges at your legs, but you sidestep the attack!'
    observer:
      - '{actor} lunges at {actee}''s legs, but misses!'
