moveid: hamstring
events:
  hit:
    actee:
      - '{actor} lunges low and tears into your legs! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} lunges low and tears into {actee}''s legs!'
  partial:
    actee:
      - '{actor} lunges at your legs and still catches you! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} lunges at {actee}''s legs, who mostly dodges but still gets caught!'
  miss:
    actee:
      - '{actor} lunges at your legs, but you sidestep the attack!'
    observer:
      - '{actor} lunges at {actee}''s legs, but misses!'
