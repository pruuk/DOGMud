moveid: drain
# Mobs and players draw from one pool per event (M6 slice 2, ledger row 56). Variant N of every role describes one moment.
events:
  hit:
    actor:
      - 'You plunge into {actee} and leech away their life-force! (<ansi fg="damage">{damage}</ansi>)'
      - 'You seize {actee}, and their warmth floods into you! (<ansi fg="damage">{damage}</ansi>)'
      - 'You latch onto {actee} and drink deep, leeching their life-force! (<ansi fg="damage">{damage}</ansi>)'
      - 'Your touch drains {actee}, pulling their vitality into you! (<ansi fg="damage">{damage}</ansi>)'
      - 'You tear into {actee} and feed, growing stronger as they weaken! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - '{actor} plunges into you, sapping your vitality and leeching your life-force! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} seizes you, sapping your vitality! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} latches onto you and drinks deep, leeching your life-force! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor}''s touch drains you, pulling vitality through their grasp! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} tears into you and feeds, growing stronger as you weaken! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} plunges into {actee} and leeches their vitality!'
      - '{actor} seizes {actee}, leeching their vitality!'
      - '{actor} latches onto {actee} and drinks deep!'
      - '{actor}''s touch drains {actee}, pulling at their vitality!'
      - '{actor} tears into {actee} and feeds hungrily!'
  # Actor-only: private knowledge about the drainer's own returning vigour,
  # under the detail-line ruling (see intentionallySilentRoles' drain/
  # hit_heal and drain/partial_heal entries).
  hit_heal:
    actor:
      - '<ansi fg="green">Their stolen vitality flows into you — {heal}.</ansi>'
      - '<ansi fg="green">Stolen life-force surges through you — {heal}.</ansi>'
      - '<ansi fg="green">You feel {heal} as their warmth becomes yours.</ansi>'
  partial:
    actor:
      - '{actee} pulls mostly free, but you still drain a little! (<ansi fg="damage">{damage}</ansi>)'
      - 'You mostly miss {actee}, but still drain some life! (<ansi fg="damage">{damage}</ansi>)'
      - '{actee} slips most of your grip, but you still sap a trace of their life-force! (<ansi fg="damage">{damage}</ansi>)'
    actee:
      - 'You pull mostly free, but {actor} still drains a little! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} mostly misses, but still drains some of your life! (<ansi fg="damage">{damage}</ansi>)'
      - '{actor} lunges to drain you; you slip most of it away, but not all! (<ansi fg="damage">{damage}</ansi>)'
    observer:
      - '{actor} reaches for {actee} hungrily, who slips mostly free but still gets caught!'
      - '{actor} lunges to drain {actee}, who slips mostly free but still gets caught!'
      - '{actor} lunges to drain {actee}, who slips most of it away but not all!'
  partial_heal:
    actor:
      - '<ansi fg="green">A trickle of stolen vitality flows into you. You feel {heal}.</ansi>'
      - '<ansi fg="green">You feel {heal} as a sliver of their warmth becomes yours.</ansi>'
  # DIVERGENT (Task 3, owner-approved 2026-09-21): variants 1 to 3 (the
  # player's original lines) describe different feels -- plain whiff /
  # target slips away / lunge glances off -- one feel per variant across all
  # three roles.
  miss:
    actor:
      - 'You reach for {actee} hungrily, but miss!'
      - 'Your drain misses {actee}!'
      - 'You reach for {actee} but they slip away!'
      - 'Your draining lunge glances off {actee} harmlessly!'
    actee:
      - '{actor} reaches for you hungrily, but misses!'
      - '{actor} lunges to drain you, but misses!'
      - '{actor} lunges to drain you but you slip away!'
      - '{actor}''s draining lunge glances off you harmlessly!'
    observer:
      - '{actor} reaches for {actee} hungrily, but misses!'
      - '{actor} lunges to drain {actee}, but misses!'
      - '{actor} reaches for {actee}, who slips away!'
      - '{actor}''s draining lunge glances off {actee} harmlessly!'
