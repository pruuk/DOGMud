# The room's own light: its lamp, and its fixtures (lighting 5e). A street
# lamp is lit when the clear sky grows too dim to read a face and put out
# once it is bright again, at night and on a dim winter morning or evening
# alike (lighting plan 6, gametime.LampsLit), and the North Gate's arch
# lantern with it; a pulsing stone rises and falls. These lines fire when one
# moves the observer's band, so none may name the hour: each must read true
# at a dim morning as well as at nightfall.
cause: lamp
transitions:
  darker_faces:
    any:
      - 'The lamps dim, and the glare eases from your eyes.'
      - 'The lamplight softens; your eyes stop aching.'
  darker_shapes:
    any:
      - 'The lamps gutter low; faces blur into shapes.'
      - 'The lamplight fades, and you can make out shapes, not faces.'
  darker_dark:
    any:
      - 'The lamps go out, and darkness closes in.'
      - 'The last lamplight dies; you can see nothing.'
  lighter_shapes:
    any:
      - 'A lamp flickers to life; shapes come out of the dark.'
      - 'Weak lamplight spreads; you can make out shapes.'
  lighter_faces:
    any:
      - 'The lamps burn brighter; faces are clear again.'
      - 'The lamplight grows; you can make out faces again.'
  dazzled:
    any:
      - 'The lamplight stabs at your eyes.'
      - 'The lamps flare too bright for your eyes.'
