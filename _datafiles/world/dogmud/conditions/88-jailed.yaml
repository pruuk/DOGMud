conditionid: 88
name: Jailed
description: You are locked in a holding cell. You cannot leave until your
  sentence is served or your fine is paid. Type fine to see what you owe.
triggerrate: 1 round
triggercount: 1
flags:
  # ExecuteArrest applies this condition synchronously, because the two flags below
  # are read inside the same round dispatch as the arrest. It therefore never
  # travels the event that narrates a condition start, and ExecuteArrest sends the
  # start_user_text above to the player itself.
  - silent-start
  - no-go
  - no-aggro-target
start_actee: "The cell door clangs shut behind you. You are held here until your sentence is served or your fine is paid."
end_actee: "The cell door swings open. You are free to go."
