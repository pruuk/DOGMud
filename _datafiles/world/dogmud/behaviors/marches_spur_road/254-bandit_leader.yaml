# Bandit Leader — Behavior Tree
# Timed aggro: if a player stays in the room, he attacks after a delay.
# Talking does not stop him (#375 R19: the talk option that set the
# negotiating state is dropped; his dialogue is info only).
#
# State: "negotiating" is no longer set by anything; the invert check
# below always passes. Kept so a future parley mechanic has a hook.

tree:
  type: selector
  children:

    # ── IDLE EVENT: timed aggro countdown ──
    - type: sequence
      event: mob_idle
      children:
        # Only if not negotiating
        - type: decorator
          mod: invert
          child:
            type: condition
            check: state_equals
            key: negotiating
            value: "true"
        # Only if players are present
        - type: condition
          check: players_in_room
        # Wait 5 rounds, then attack a player in the room
        - type: decorator
          mod: delay
          rounds: 5
          child:
            type: action
            do: attack
