# The Barge Poleman — mob 9575 — crews the Grey Heron.
# Talks in short bursts between pushes; does not book passage himself.
tree:
  type: selector
  children:

    # His greeting lives in his dialogue opener (dialogue/ferries/9575.yaml).

    # Silent player_enter no-op: claims the event so composition never
    # falls through to noncombat_passive's "pays you little mind." emote.
    - type: sequence
      event: player_enter
      children:
        - type: action
          do: set_state
          key: poleman_player_enter_suppressed
          value: "true"
