# The Weathered Deckhand — mob 9574 — crews the Lakewind Packet.
# Answers questions in the shortest form that is not rude (per his
# character description); does not book passage himself.
tree:
  type: selector
  children:

    # His greeting lives in his dialogue opener (dialogue/ferries/9574.yaml).

    # Silent player_enter no-op: claims the event so composition never
    # falls through to noncombat_passive's "pays you little mind." emote.
    - type: sequence
      event: player_enter
      children:
        - type: action
          do: set_state
          key: deckhand_player_enter_suppressed
          value: "true"
