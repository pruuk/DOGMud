# The Quay Agent — mob 9572 — books passage at the North Quay.
# Serves BOTH North Quay routes, one talk topic per destination.
tree:
  type: selector
  children:

    # ── PURCHASE: one talk topic per destination (#375 R14). The topic's
    # destination param picks the route; board_ferry resolves schedule,
    # fare, and movement. Her greeting lives in her dialogue opener. ──
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: to_stillwater
        - type: action
          do: board_ferry
          destination: stillwater
          routes:
            stillwater: stillwater_np_packet
            confluence: confluence_np_barge

    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: to_confluence
        - type: action
          do: board_ferry
          destination: confluence
          routes:
            stillwater: stillwater_np_packet
            confluence: confluence_np_barge

    # Silent player_enter no-op: claims the event so composition never
    # falls through to noncombat_passive's "pays you little mind." emote.
    - type: sequence
      event: player_enter
      children:
        - type: action
          do: set_state
          key: quay_agent_player_enter_suppressed
          value: "true"
