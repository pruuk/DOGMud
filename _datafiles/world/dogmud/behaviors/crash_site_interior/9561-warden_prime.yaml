# Warden-Prime -- Teaching Boss Behavior Tree (crash-site-boss-mechanics
# Chunk C). The introductory encounter for the Crash Site Interior's
# endgame arc: teaches the counterplay for the boss abilities that return,
# harder, on The Core Guardian (mobid 9562, a later chunk). Two mechanics
# only:
#
#   1. Warden Discharge -- a telegraphed party-wide harm spell cast on a
#      fixed cooldown while in combat: the lesser form of the Core
#      Guardian's Core Discharge, with its own spell since #480 so each
#      boss's damage is tuned to its own stats. The tree announces, then
#      casts; the spell's `min_cast_rounds: 2` holds the cast open (internal/
#      hooks processFoldRound), so the windup is the cast round with its
#      `cast_observer` line, one held round showing its `wait_observer`
#      warning (sendMobWindupWarning, in place of the generic weave), then
#      the blast. It is interruptible across the whole windup by the
#      existing disruptor system (a thrown flashbang or a disruption spell)
#      per Chunk A. MagicUserText/MagicRoomText are still consumed only by
#      the PLAYER fold-casting path; the resolution line mob-casters get is
#      the engine's own per-target damage text, which surfaces the spell's
#      `name` against each hit player.
#      For a mob caster an area harm spell targets every player in the
#      room (resolveMobSpell -> mobAreaHarmTargets in internal/hooks/
#      spell_resolution.go), so warden-discharge hits each of them.
#
#   2. Repair Frame add -- spawned once, at 50% HP, via `summon_companion`
#      (deliberately NOT `spawn_mob`: that action creates the mob instance
#      but never calls room.AddMob, so it would never register into the
#      room's mob list -- room.GetMobs()/"look"/targeting all read
#      room.mobs, an explicit slice only populated by AddMob. `spawn_mob`
#      has zero existing usage anywhere in this codebase's behavior trees,
#      so this looks unexercised/broken. `summon_companion` DOES call
#      room.AddMob and is the exact pattern Old Edrin
#      (behaviors/marches_spur_road/275-old_edrin.yaml) already uses to
#      summon combat adds on a mob_hurt/HP trigger -- mirrored here).
#      Repair Frame's own tree (9585-repair_frame.yaml) already branches
#      on `mob_in_room: 9561` to heal Warden-Prime by name (Task A6's
#      `cast` target passthrough) -- this tree only has to spawn it.
#
# No drain, no grapple, no sweep -- those are Core Guardian mechanics
# (Chunk D, a full fight). This is the teaching version.

tree:
  type: selector
  children:

    # ── Warden Discharge: telegraphed AoE, fixed cadence while in combat.
    #    Announce, then cast (#480). The spell's min_cast_rounds: 2 holds the
    #    cast open for a two-round windup, as on the Core Guardian, so the
    #    lesson matches the exam. ──
    - type: decorator
      event: mob_combat_round
      mod: cooldown
      rounds: 6
      child:
        type: sequence
        children:
          - type: condition
            check: mob_in_combat
          - type: action
            do: send_room_text
            text: >-
              Warden-Prime's eye dims as it pulls its light inward. Stop it now!
          - type: action
            do: cast
            spell: warden-discharge

    # ── Repair Frame: one-shot spawn at 50% HP (state-gated so it never
    #    re-fires if Warden-Prime's HP crosses 50% more than once, e.g.
    #    after a Repair Frame heal ticks it back up) ──
    - type: sequence
      event: mob_hurt
      children:
        - type: condition
          check: mob_health_below
          percent: 50
        - type: decorator
          mod: invert
          child:
            type: condition
            check: state_equals
            key: repair_frame_spawned
            value: "true"
        - type: action
          do: set_state
          key: repair_frame_spawned
          value: "true"
        - type: action
          do: send_room_text
          text: >-
            Warden-Prime's core flickers and dims -- a spindly Repair
            Frame wakes from a wall alcove and skitters in on a column
            of cold light to mend it.
        - type: action
          do: summon_companion
          mob_id: 9585
          count: 1
          base_pool: 50
          hostile: true
