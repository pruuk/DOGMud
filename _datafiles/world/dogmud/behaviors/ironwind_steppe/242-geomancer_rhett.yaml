# Geomancer Rhett — Behavior Tree
# Handles: player_give for items no dialogue topic wants.
#
# The windstone sample (item 40032) is a dialogue hand-in (topic
# sample_return, quest 11, #375 R7/R8): give resolves as that topic
# before this tree runs, and hands the sample back when the topic is not
# eligible. The old sample branches here granted 11-end without checking
# the side flag; they were removed in the #375 zone pass.
# All conversation handled by dialogue YAML.

tree:
  type: selector
  children:

    # ── GIVE: any other item — reject and return ──
    - type: sequence
      event: player_give
      children:
        - type: action
          do: say
          text: Interesting, but not what I need right now.
        - type: action
          do: return_item
