# Windwarden Sylara — Behavior Tree
# Handles: player_give for items no dialogue topic wants.
#
# The wolf totem (item 40033) is a dialogue hand-in (topic totem_return,
# quest 11, #375 R7/R8): give resolves as that topic before this tree
# runs, and hands the totem back when the topic is not eligible. The old
# totem branches here granted 11-end without checking the side flag; they
# were removed in the #375 zone pass.
#
# NOTE: The onAsk/fetish-dispensing branch is deferred to a later
# task — it requires player_has_spell, player_has_misc_data,
# give_item_multiple, and set_misc_data actions not yet implemented.
# All conversation handled by dialogue YAML.

tree:
  type: selector
  children:

    # ── GIVE: any other item — reject and return ──
    - type: sequence
      event: player_give
      children:
        - type: action
          do: say
          text: The steppe provides what I need. I have no use for this.
        - type: action
          do: return_item
