# The Threshold-Keeper — mob 9553 — opens the way into the buried thing.
# Modeled on Sable (315). Gates the portal on the Attuned Disc (40168);
# gold sets the tier. The disc is NOT consumed (a reusable key).
#
# Her greetings (and the 77-end variant for those who came back knowing),
# the way and the no-disc refusal live in her dialogue
# (dialogue/eastern_highlands/9553.yaml). Choosing open_crash there (a
# topic gated carriesItem: 40168) fires the branch below (#375 R14):
# open_instance_portal with zone set shows the guidance and asks "How
# much gold will you stake?" privately.
#
# Guidance approved by the owner 2026-10-23 (batch 7): the zone is a group
# effort from the start, ranges for groups of three. Facts from
# rooms/crash_site_interior/zone-config.yaml: death_policy rejoin,
# allow_recall false, no instance_gold, min_gold 200 here. Gold and
# material scaling with the stake is filed as #657 (not implemented).
tree:
  type: selector
  children:

    # ── PURCHASE: topic open_crash, gated on the Attuned Disc ──
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: open_crash
        - type: condition
          check: player_has_item
          item_id: 40168
        - type: action
          do: open_instance_portal
          zone: crash
          min_gold: 200
          exit_expires: "30 real minutes"
          zones:
            crash: "Crash Site Interior"
          guidance: |-
            No one goes into the buried thing alone and comes out. Bring others.
            The more gold you stake, the more of the deep wards wake, and the
            more the place has kept for those who reach it.
            Two hundred to four hundred gold suits three of you, moderately well
            armed and armoured. Four hundred to eight hundred wants three of you
            very well armed and armoured. Eight hundred and more, and you should
            bring a great many friends, every one of them at the height of their
            strength.
            I take no less than two hundred. If you fall inside, you may come
            back in while the way stays open, but no magic calls you home from
            there.

    # Silent player_enter no-op: claims the event so composition never
    # falls through to noncombat_passive's "pays you little mind." emote.
    - type: sequence
      event: player_enter
      children:
        - type: action
          do: set_state
          key: threshold_keeper_player_enter_suppressed
          value: "true"
