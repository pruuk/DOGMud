# Dock Master Arn — Behavior Tree
# Handles: player_give refusals for the leviathan tooth (40054).
# The quest 19 hand-in is the dialogue topic arnhandoff (#375 R7/R8): give
# resolves as that topic before this tree runs. When the topic is not
# eligible, give keeps the tooth with the player and offers it here as a
# hand-back, so these branches say why; return_item then only says the
# tooth came back. A hand-back branch may only speak and return_item.

tree:
  type: selector
  children:

    # ── GIVE: leviathan tooth, quest already complete — return it ──
    - type: sequence
      event: player_give
      children:
        - type: condition
          check: item_matches
          item_id: 40054
        - type: condition
          check: player_has_quest
          quest: "19-end"
        - type: action
          do: say
          text: The bounty is paid out. Keep the tooth -- it is worth a story.
        - type: action
          do: return_item

    # ── GIVE: leviathan tooth before signed bounty — return it ──
    - type: sequence
      event: player_give
      children:
        - type: condition
          check: item_matches
          item_id: 40054
        - type: condition
          check: player_missing_quest
          quest: "19-signed"
        - type: action
          do: say
          text: >-
            That is the proof, all right -- but the dock fund only pays
            on a bounty the constable has signed. See Drunn first, then
            come back.
        - type: action
          do: return_item

    # (GIVE: leviathan tooth WITH 19-signed and missing 19-end is the
    #  arnhandoff topic and never reaches this tree.)
