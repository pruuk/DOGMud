# The Ferry Agent — mob 9571 — books passage at the Stillwater pier.
# Serves BOTH Stillwater routes, one talk topic per destination.
tree:
  type: selector
  children:

    # ── PURCHASE: one talk topic per destination (#375 R14). The topic's
    # destination param picks the route; board_ferry resolves schedule,
    # fare, and movement. His greeting lives in his dialogue opener. ──
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: to_plymouth
        - type: action
          do: board_ferry
          destination: plymouth
          routes:
            plymouth: stillwater_np_packet
            confluence: stillwater_confluence_barge

    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: to_confluence
        - type: action
          do: board_ferry
          destination: confluence
          routes:
            plymouth: stillwater_np_packet
            confluence: stillwater_confluence_barge

    # Silent player_enter no-op: claims the event so composition never
    # falls through to noncombat_passive's "pays you little mind." emote.
    - type: sequence
      event: player_enter
      children:
        - type: action
          do: set_state
          key: ferry_agent_player_enter_suppressed
          value: "true"
