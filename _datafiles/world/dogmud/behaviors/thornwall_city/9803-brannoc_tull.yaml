# Brannoc Tull, mob 9803, Torvan Cresk's doorman at the mouth of the Burrows
# (6671, east off the smugglers' escape shaft 499 under Thornwall). What he
# sells is on his list (the list and buy commands,
# internal/usercommands/housing_shop.go). This tree lets players ask for the
# same things in words. Buying and the terms are Go actions in
# internal/housing, so every price, vacancy and standing check reads the
# authored building file (housing_buildings/the_burrows.yaml).
tree:
  type: selector
  children:

    # PURCHASE. Sits first (grant-node-first SOP). Explicit buying words
    # only, and only a plain request buys (buy_housing answers questions
    # with the terms). The ask text picks the offer: home, deed, voucher,
    # key, container or strongbox ("buy a room" means an extension to
    # someone who already lodges here).
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [buy, purchase]
        - type: action
          do: buy_housing
          building: the_burrows
          tier: simple

    # TERMS. Price, vacancy and what this player still needs.
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [room, rooms, hole, holes, hideout, hide-out, lodging, lodgings, let, rent, lease, price, prices, cost, much, house, home, vacancy, vacancies, key, lock, door, extension, extensions, deed, deeds, voucher, vouchers, redecorate, redecorating, decorate, paint, digging, list, sell, selling, guest, guests, friend, friends, visit, visitor, visitors, invite, container, containers, chest, chests, storage, strongbox, strongboxes, safe, furniture, bed, beds, sleep, station, stations, craft, crafting, forge, loom, bench, workbench, workshop]
        - type: action
          do: housing_terms
          building: the_burrows
          tier: simple

    # Greetings and who-are-you.
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [hello, hi, hey, greetings, who, name, brannoc, tull, job, work, torvan, cresk, boss, owner, burrows, warren]
        - type: action
          do: say
          text: Brannoc. I mind Torvan's door. Torvan owns the Burrows. I get the chair and the questions. Type list if you want a hole. If you don't, stop blocking my lantern.

    # Silent player_enter no-op: claims the event so composition never falls
    # through to noncombat_passive's "pays you little mind." emote.
    - type: sequence
      event: player_enter
      children:
        - type: action
          do: set_state
          key: tull_player_enter_suppressed
          value: "true"
