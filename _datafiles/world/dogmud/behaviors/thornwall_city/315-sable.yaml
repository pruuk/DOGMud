# Sable — Mob 315 — Rift Archway Vendor
# Opens instance zones for a player-chosen stake (#375 R14). Her greeting,
# the portal list and the arena, oasis and talk answers live in her
# dialogue (dialogue/thornwall_city/315.yaml). Choosing open_arena or
# open_oasis there fires the matching branch below: open_instance_portal
# with zone set shows that zone's guidance and asks "How much gold will
# you stake?" privately. The open_instance_portal action manages the full
# purchase flow: checks the minimum and the purse, charges, clones the
# instance, adds a temporary exit, and speaks the result.
#
# Guidance ranges are the owner's (Oasis 2026-10-20, spec R14; Arena
# 2026-10-21, spec R26, one step lower than the Oasis because the Arena
# gives no second chance). Facts from rooms/instance_*/zone-config.yaml:
# the Arena is death_policy ejected, allow_recall false; the Planar Oasis
# is death_policy rejoin, allow_recall true; both instance_gold true. In
# the arena rooms 5002, 5006, 5007 and 5008 run north in a line from the
# entrance, each holds one or two fighters marked hostile, and a fallen
# fighter respawns within a round to a few minutes. Room 5002 has
# respawnrate "1h" (one game hour, about two and a half real minutes at
# RoundsPerDay 900). Rooms 5006 to 5008 use "1h 30m" and "120m" (plus one
# "1h" fighter in 5006), which gametime.AddPeriod does not know, so those
# fall back to one round. That one-round respawn is the owner's intended
# gold farm (2026-10-17).

tree:
  type: selector
  children:

    # ── TOPIC open_arena: stake prompt for the Arena ──────────────────────
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: open_arena
        - type: action
          do: open_instance_portal
          zone: arena
          min_gold: 100
          exit_expires: "30 real minutes"
          zones:
            arena: "Instance Arena"
            oasis: "Instance Planar Oasis"
          guidance: |-
            The more gold you stake, the harder the Arena fights and the richer
            it pays.
              100 to 200 gold: a midgame fighter on their own.
              200 to 400 gold: an endgame fighter on their own.
              400 gold and up: only the bravest alone, or a group.
            There is no second chance. If you die, you are sent out and cannot
            go back in, and recall magic does not work inside.
            The fights come one after another. Every room past the entrance
            holds fighters who attack on sight, and the fallen soon return.

    # ── TOPIC open_oasis: stake prompt for the Planar Oasis ───────────────
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: open_oasis
        - type: action
          do: open_instance_portal
          zone: oasis
          min_gold: 100
          exit_expires: "30 real minutes"
          zones:
            arena: "Instance Arena"
            oasis: "Instance Planar Oasis"
          guidance: |-
            The more gold you stake, the harder the Planar Oasis fights and the
            richer it pays.
              100 to 300 gold: a midgame run on your own.
              300 to 600 gold: an endgame run on your own.
              600 gold and up: only the bravest alone, or a group.
            If you die, you may go back in, and recall magic works inside.
