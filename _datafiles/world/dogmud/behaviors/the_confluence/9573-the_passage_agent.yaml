# The Passage Agent — mob 9573 — books passage at the Confluence Barge Dock.
# Serves BOTH Barge Dock routes, one talk topic per destination.
tree:
  type: selector
  children:

    # ── PURCHASE: one talk topic per destination (#375 R14). The topic's
    # destination param picks the route; board_ferry resolves schedule,
    # fare, and movement. The agent's greeting lives in the dialogue opener. ──
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: to_stillwater
        - type: action
          do: board_ferry
          destination: stillwater
          routes:
            stillwater: stillwater_confluence_barge
            plymouth: confluence_np_barge

    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: to_plymouth
        - type: action
          do: board_ferry
          destination: plymouth
          routes:
            stillwater: stillwater_confluence_barge
            plymouth: confluence_np_barge

    # Silent player_enter no-op: claims the event so composition never
    # falls through to noncombat_passive's "pays you little mind." emote.
    - type: sequence
      event: player_enter
      children:
        - type: action
          do: set_state
          key: passage_agent_player_enter_suppressed
          value: "true"
