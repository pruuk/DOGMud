# companion_battlemage archetype (Isaura Vey, aicompanion)
#
# The scholar with force of will. She strikes from where she stands with
# her harm spells, her strongest first, until her conviction runs low, and
# keeps herself standing. Running and the plan are the aicompanion
# module's (see companion_archer.yaml); the model can also call for a
# particular spell (combat spell).
#
# Decision order per mob_combat_round:
#   1. Below 40% health: her best self_heal spell, if she has learned one.
#   2. Her best self_defense spell, if she has learned one.
#   3. Several foes: her best harm_multi spell.
#   4. Her best harm_single spell at the foe she is fighting.
#   fall through to the ordinary attack (a wand is a poor club).
tree:
  type: selector
  children:
    - type: selector
      event: mob_combat_round
      children:
        - type: sequence
          children:
            - type: condition
              check: mob_health_below
              percent: 40
            - type: action
              do: cast_best_in_category
              category: self_heal
              target: self
        - type: action
          do: cast_best_in_category
          category: self_defense
          target: self
        - type: sequence
          children:
            - type: condition
              check: multiple_foes
            - type: action
              do: cast_best_in_category
              category: harm_multi
        - type: action
          do: cast_best_in_category
          category: harm_single
