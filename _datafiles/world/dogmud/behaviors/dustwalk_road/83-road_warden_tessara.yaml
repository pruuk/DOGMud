# Road Warden Tessara — Behavior Tree
# Handles: player_give event for item rejection only.
# The quest 4 purse hand-in is the dialogue topic evidence_handoff
# (#375 R7/R8): give resolves as that topic before this tree runs. When it
# is not eligible, give keeps the purse with the player and offers it here
# as a hand-back (return_item then only says it came back). Other items
# are ordinary gives.

tree:
  type: selector
  children:

    # ── GIVE: bandit's purse, Q4 active ──
    # (no branch: the evidence_handoff topic takes it before this tree runs)

    # ── GIVE: bandit's purse, Q4 already complete — return it ──
    - type: sequence
      event: player_give
      children:
        - type: condition
          check: item_matches
          item_id: 16
        - type: condition
          check: player_has_quest
          quest: "4-end"
        - type: action
          do: say
          text: >-
            You have already done your part. The Watchers
            remember it.
        - type: action
          do: return_item

    # ── GIVE: any non-quest item — reject and return ──
    - type: sequence
      event: player_give
      children:
        - type: condition
          check: player_has_quest
          quest: "4-end"
        - type: action
          do: say
          text: I appreciate the thought, but I do not need that.
        - type: action
          do: return_item

    # ── GIVE: not on quest at all — reject and return ──
    - type: sequence
      event: player_give
      children:
        - type: condition
          check: player_missing_quest
          quest: "4-start"
        - type: action
          do: say
          text: I appreciate the thought, but I do not need that.
        - type: action
          do: return_item
