# Warden Esk (9107) — portal warden at the Threshold House (room 5215).
#
# The permanent way out of Pothole Coulee. The arch itself is one-way
# outbound; the way back in is the `portal` exit in the Thornwall temple
# (468 -> 5215, owner ruling 2026-10-17), open to anyone, since entering
# the coulee skips no gate. Gated on quest token
# 30-end: only the Opened may cross. The teleport rides the hardened
# move_player action with a static delay so the transit lines land
# first. Destination: Thornwall Temple Interior (room 468) -- the same
# room the "thornwall" sethome key resolves to.
# Selector order matters: the Opened branch is tried first; the
# not-yet-opened branch catches the same keywords below it.

tree:
  type: selector
  children:

    # ── PASSAGE: an Opened player asks to cross ──
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [passage, portal, arch, thornwall, through]
        - type: condition
          check: player_has_quest
          quest: "30-end"
        - type: action
          do: say
          text: So. The coulee has taught you what it can, for now.
          delay: 1.0
        - type: action
          do: emote
          text: >-
            rises from the stool and sets one broad hand flat against
            the basalt arch. The ember-light behind his eyes brightens,
            banked coals breathed on.
          delay: 3.0
        - type: action
          do: say
          text: >-
            Thornwall sits on the far side. Temple stone, city noise,
            more people than you have ever needed. Walk through. The
            arch keeps no count and no grudge. You can come back
            through the portal in the Thornwall temple.
          delay: 5.5
        - type: action
          do: emote
          text: >-
            steps back as the empty air inside the arch goes taut, then
            silvers, like deep water deciding to be a door.
          delay: 9.0
        - type: action
          do: move_player
          room_id: 468
          delay: 11.0
        # Close quest 29 "Two Roads" on Esk's road. Its room_enter trigger on
        # 468 never fires here: a move_player teleport raises no room_enter.
        # Same gate as that trigger (has 29-start, lacks 29-end), so a player
        # who already took Toke's road sees no second completion banner. The
        # fallback branch keeps this sequence a Success either way (30-end is
        # already proven above), so the ask never falls through to dialogue.
        # Delay 12.0 lands the banner after the arrival look.
        - type: selector
          children:
            - type: sequence
              children:
                - type: condition
                  check: player_has_quest
                  quest: "29-start"
                - type: condition
                  check: player_missing_quest
                  quest: "29-end"
                - type: action
                  do: grant_quest
                  quest: "29-end"
                  delay: 12.0
            - type: condition
              check: player_has_quest
              quest: "30-end"

    # ── NOT YET: an unopened player asks to cross ──
    - type: sequence
      event: player_ask
      children:
        - type: condition
          check: keyword_match
          keywords: [passage, portal, arch, thornwall, through]
        - type: condition
          check: player_missing_quest
          quest: "30-end"
        - type: action
          do: say
          text: >-
            The arch answers the Opened, and you are not yet. The pool
            comes first -- Cleric Hadwen keeps it, at the heart of
            town. There is no shame in arriving unready. Only in
            staying that way.
          delay: 1.0
