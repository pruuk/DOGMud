# Warden Esk (9107), portal warden at the Threshold House (room 5215).
#
# The permanent way out of Pothole Coulee. The arch itself is one-way
# outbound; the way back in is the `portal` exit in the Thornwall temple
# (468 -> 5215, owner ruling 2026-10-17), open to anyone, since entering
# the coulee skips no gate. Gated on quest token
# 30-end: only the Opened may cross. The teleport rides the hardened
# move_player action with a static delay so the transit lines land
# first. Destination: Thornwall Temple Interior (room 468), the same
# room the "thornwall" sethome key resolves to.
# The crossing is the `passage` talk topic (#375 R12), shown only to the
# Opened; its text speaks his first line ("So. The coulee has taught you
# what it can, for now."), and this branch runs the rest. The refusal for
# a player not yet Opened is the passage_2 topic in his dialogue.

tree:
  type: selector
  children:

    # ── PASSAGE: an Opened player asks to cross ──
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: passage
        - type: condition
          check: player_has_quest
          quest: "30-end"
        - type: action
          do: emote
          text: >-
            rises from the stool and sets one broad hand flat against
            the basalt arch. The ember-light behind his eyes brightens,
            banked coals breathed on.
          delay: 3.0
        - type: action
          do: say
          text: >-
            Thornwall sits on the far side. Temple stone, city noise,
            more people than you have ever needed. Walk through. The
            arch keeps no count and no grudge. You can come back
            through the portal in the Thornwall temple.
          delay: 5.5
        # The line the move follows goes out through `respond`, which sends
        # at its own delay. An emote goes through mob.Command onto Esk's
        # input queue (one command a turn, behind any pending one), so it
        # could land after the 11 s move_player or reach a player already
        # gone (#620).
        - type: action
          do: respond
          user_text: >-
            {actor} steps back as the empty air inside the arch goes taut,
            then silvers, like deep water deciding to be a door.
          room_text: >-
            {actor} steps back as the empty air inside the arch goes taut,
            then silvers, like deep water deciding to be a door.
          delay: 9.0
        - type: action
          do: move_player
          room_id: 468
          delay: 11.0
        # Crossing does not close quest 89 (Esk's Road): his hand-in
        # road_esk_end is its only end (#375 phase 7), and the portal in the
        # temple leads back to him.

    # ── FLAVOUR (#375 phase 7, owner ruling 2026-10-30): a player who holds
    #    all eight "Report to Toke" bridges (90-end to 97-end) is greeted, one
    #    arrival in four, with a line about one teacher's standing work, to
    #    that player alone (respond with user_text only). The cascade (25,
    #    33, 50, last) gives each line an even share. Toke's tree
    #    (9106-crier_toke.yaml) names the other four teachers. ──
    - type: sequence
      event: player_enter
      children:
        - type: condition
          check: player_has_quest
          quest: "90-end"
        - type: condition
          check: player_has_quest
          quest: "91-end"
        - type: condition
          check: player_has_quest
          quest: "92-end"
        - type: condition
          check: player_has_quest
          quest: "93-end"
        - type: condition
          check: player_has_quest
          quest: "94-end"
        - type: condition
          check: player_has_quest
          quest: "95-end"
        - type: condition
          check: player_has_quest
          quest: "96-end"
        - type: condition
          check: player_has_quest
          quest: "97-end"
        - type: condition
          check: random_chance
          percent: 25
        - type: selector
          children:
            - type: decorator
              mod: random
              percent: 25
              child:
                type: action
                do: respond
                user_text: >-
                  {actor} looks up from his whittling. "Ovell asked after you.
                  The smith's fire still wants a steady hand."
            - type: decorator
              mod: random
              percent: 33
              child:
                type: action
                do: respond
                user_text: >-
                  {actor} nods to you. "Delk was through. Pronghorn are running
                  on the fringe again, and he wants someone to bring one down."
            - type: decorator
              mod: random
              percent: 50
              child:
                type: action
                do: respond
                user_text: >-
                  {actor} turns his ember eyes your way. "Sere says the stones
                  in the Reliquary have more to tell. She waits for whoever
                  will listen."
            - type: action
              do: respond
              user_text: >-
                {actor} speaks without rising. "Bryn is drilling at the canyon
                mouth again. The eye drifts if you stop using it, he says."
