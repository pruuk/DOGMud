# Warden Esk (9107) — portal warden at the Threshold House (room 5215).
#
# The permanent way out of Pothole Coulee. The arch itself is one-way
# outbound; the way back in is the `portal` exit in the Thornwall temple
# (468 -> 5215, owner ruling 2026-10-17), open to anyone, since entering
# the coulee skips no gate. Gated on quest token
# 30-end: only the Opened may cross. The teleport rides the hardened
# move_player action with a static delay so the transit lines land
# first. Destination: Thornwall Temple Interior (room 468) -- the same
# room the "thornwall" sethome key resolves to.
# The crossing is the `passage` talk topic (#375 R12), shown only to the
# Opened; its text speaks his first line ("So. The coulee has taught you
# what it can, for now."), and this branch runs the rest. The refusal for
# a player not yet Opened is the passage_2 topic in his dialogue.

tree:
  type: selector
  children:

    # ── PASSAGE: an Opened player asks to cross ──
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: passage
        - type: condition
          check: player_has_quest
          quest: "30-end"
        - type: action
          do: emote
          text: >-
            rises from the stool and sets one broad hand flat against
            the basalt arch. The ember-light behind his eyes brightens,
            banked coals breathed on.
          delay: 3.0
        - type: action
          do: say
          text: >-
            Thornwall sits on the far side. Temple stone, city noise,
            more people than you have ever needed. Walk through. The
            arch keeps no count and no grudge. You can come back
            through the portal in the Thornwall temple.
          delay: 5.5
        # The line the move follows goes out through `respond`, which sends
        # at its own delay. An emote goes through mob.Command onto Esk's
        # input queue (one command a turn, behind any pending one), so it
        # could land after the 11 s move_player or reach a player already
        # gone (#620).
        - type: action
          do: respond
          user_text: >-
            {actor} steps back as the empty air inside the arch goes taut,
            then silvers, like deep water deciding to be a door.
          room_text: >-
            {actor} steps back as the empty air inside the arch goes taut,
            then silvers, like deep water deciding to be a door.
          delay: 9.0
        - type: action
          do: move_player
          room_id: 468
          delay: 11.0
        # Quest 29 "Two Roads" closes on arrival through its own room_enter
        # trigger on 468, which a move_player teleport raises (#619).
