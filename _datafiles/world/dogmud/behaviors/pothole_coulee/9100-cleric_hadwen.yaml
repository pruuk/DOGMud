# Cleric Hadwen (9100) — rite-keeper at the Awakening Pool (room 5200).
#
# Owns the Awakening Rite beat of quest 30:
#   - dialogue (dialogue/pothole_coulee/9100.yaml) grants 30-start
#   - this tree answers the player choosing to begin the rite (talk hadwen,
#     topic `begin`, #375 R17; the topic's text is empty, so this tree
#     speaks every line) while 30-start is held,
#     plays the paced rite sequence, and fires 30-end (the "Opened" token).
#     Blank-slate Awakening: the rite grants NO starter mutation — mutations
#     are earned afterward through use-based drift.
# Single-shot: 30-end is granted at the CLOSE of the rite (a delayed
# action), so for the ~41 s the rite runs the asker still lacks 30-end
# and token gating alone would let a second begin queue a
# second rite (2026-10-17 audit S6). The `rite_running` state flag closes
# that window, the way The Landing's tree holds `leaving`
# (behaviors/rooms/newcomer_antechamber/6467.yaml): set instantly when the
# rite starts, checked by the rite and by the mid-rite answer below. 6467
# never clears its flag; Hadwen serves every newcomer, so his clear is a
# delayed action queued with the rite itself. Queued closures run whether
# or not the asker is still online, and BehaviorState is not saved
# (mobs.Mob.BTreeState is yaml:"-"), so a logout or a reboot mid-rite
# cannot leave the flag stuck. After the rite, the begin topic is hidden by
# its 30-end gate, so the player cannot choose it again.
# The flag is PER PLAYER (`per_player: true`, BehaviorState key
# "rite_running:<user id>"): the 2026-10-17 newbie-duo playtest had two
# newcomers ask at once, and a mob-wide flag hushed the second one and left
# them un-Opened. Each asker now gets their own rite, and every spoken line
# is addressed to its own asker (`to_actor: true`, sayto: "says to you" for
# them, "says to <name>" for the room), so two interleaved rites both read.
# Test: internal/behaviortree/hadwen_rite_guard_test.go.

tree:
  type: selector
  children:

    # ── MID-RITE: the player chooses to begin while the rite is already running ──
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: begin
        - type: condition
          check: state_equals
          key: rite_running
          per_player: true
          value: "1"
        - type: action
          do: say
          to_actor: true
          text: >-
            Hush, now. The pool is still speaking, and it will not be
            hurried. Let it finish.

    # ── THE RITE: the player chooses to begin (30-start held, not yet opened) ──
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topic: begin
        - type: condition
          check: player_has_quest
          quest: "30-start"
        - type: condition
          check: player_missing_quest
          quest: "30-end"
        - type: condition
          check: state_equals
          key: rite_running
          per_player: true
          value: ""
        - type: action
          do: set_state
          key: rite_running
          per_player: true
          value: "1"
        - type: action
          do: say
          to_actor: true
          text: Then we begin. Step to the edge with me.
          delay: 1.0
        - type: action
          do: respond
          user_text: >-
            {actor} wades into the shallows and turns to face you. The pale
            plates along his jaw catch the light coming up off the water.
          room_text: >-
            {actor} wades into the shallows and turns to face the one
            beside him.
          delay: 3.0
        - type: action
          do: say
          to_actor: true
          text: >-
            Gaius is made of belief. The land believes itself into
            shape. So does everything that lives on it. So will you.
          delay: 6.0
        - type: action
          do: say
          to_actor: true
          text: >-
            Most worlds let you stay what you arrived as. This one will
            not. The body answers effort, conflict, fear, wanting -- it
            changes. We call the changes mutations, and none of them are
            a punishment, whatever they look like at first.
          delay: 9.5
        - type: action
          do: say
          to_actor: true
          text: >-
            The pool answers first. It is older than the town and more
            patient than I am. Look into the water.
          delay: 13.0
        # The rite happens to the asker alone (#515): they read it in the
        # second person, and the rest of the room watches it in the third.
        - type: action
          do: respond
          user_text: >-
            {actor} rests a hand on your shoulder. The pool's light rises
            to meet you, and for a moment you are somewhere else, folded
            inside something vast and warm that is looking back at you
            with your own eyes.
          room_text: >-
            {actor} rests a hand on the shoulder of the one beside him,
            and the pool's light rises to meet them.
          delay: 16.0
        - type: action
          do: respond
          user_text: >-
            {actor} lifts his hand away. The light lets you go: the water
            is only water again, the morning is just a morning, and
            something under your skin is newly, quietly awake.
          room_text: >-
            {actor} lifts his hand away, and the light sinks back into
            the pool.
          delay: 20.0
        - type: action
          do: say
          to_actor: true
          text: It is done. You will feel it settle for a while. That is normal.
          delay: 23.0
        # What a mutation is, said to each player as it is true for them
        # (owner ruling 2026-10-17: a mutation can fire mid-tutorial, in
        # Dewey's rooms, as long as Hadwen explains it). Checked when the
        # rite starts; either branch queues its one line and succeeds, so
        # the rite goes on.
        - type: selector
          children:
            - type: sequence
              children:
                - type: condition
                  check: player_has_mutation
                - type: action
                  do: say
                  to_actor: true
                  text: >-
                    The chrysalis has already changed you. The spores in
                    you answer how you live, and each change they make is
                    called a mutation. Type <ansi fg="command">mutations</ansi>
                    to see what has changed in you, and
                    <ansi fg="command">help mutations</ansi> to read more.
                    The rest you earn the slow way: by how you fight, what
                    you endure, and who you decide to be.
                  delay: 26.0
            - type: action
              do: say
              to_actor: true
              text: >-
                In time the chrysalis will change you. The spores in you
                answer how you live, and each change they make is called a
                mutation. Type <ansi fg="command">mutations</ansi> to see
                what has changed in you, and
                <ansi fg="command">help mutations</ansi> to read more. You
                earn them the slow way: by how you fight, what you endure,
                and who you decide to be.
              delay: 26.0
        - type: action
          do: say
          to_actor: true
          text: >-
            If the name you carried here no longer fits the shape of
            you, <ansi fg="command">rename</ansi> lets you choose a
            truer one. And <ansi fg="command">help</ansi> answers most
            questions with more patience than I have.
          delay: 29.5
        # The light spell, for both roads (2026-10-17 audit B3: a player
        # who leaves through Esk never hears Toke's hub lessons).
        - type: action
          do: say
          to_actor: true
          text: >-
            One gift more, and you carry it from today: a light of your
            own. Gaius keeps true dark in its caves and mines, and the
            dark will blind you. When it does, type
            <ansi fg="command">cast glow</ansi> and the spores
            in you will answer.
          delay: 33.0
        - type: action
          do: say
          to_actor: true
          text: >-
            Now, two roads lead on from here, and both are good ones.
            Check what you carry first with
            <ansi fg="command">inv</ansi>. Little enough, I'd wager,
            and that is the point: the folk down each road will arm you
            and teach you their trade. Crier Toke's road teaches you
            the town. Warden Esk's road takes you out to the wider
            world.
          delay: 36.5
        - type: action
          do: say
          to_actor: true
          text: >-
            Talk to me again when you are ready, with
            <ansi fg="command">talk hadwen</ansi>, and I will set you
            on either road, or both. The coulee will still be here
            either way.
          delay: 40.0
        # Blank-slate Awakening: no starter mutation is granted during the rite.
        # The pool opens the capacity; every mutation is earned afterward through
        # use-based drift (see the mutation-graph acquisition design). The quest
        # completion is the FINAL beat, after the last send-off line at 40.0 --
        # otherwise the "quest complete" banner fires at t=0 and spoils the rite.
        # This action honors the static `delay` param (behaviortree/actions.go).
        - type: action
          do: grant_quest
          quest: "30-end"
          delay: 40.5
        # No quest 29 grant here any more (#375 R17): the two roads are the
        # road_toke and road_esk offer topics in his dialogue, which the
        # closing line above sends the player back to with talk hadwen.
        # The rite is over: clear the flag so the next newcomer can begin.
        # Queued after the 30-end grant (the queue runs in order), so by the
        # time a second begin can pass the flag the asker already holds 30-end.
        - type: action
          do: set_state
          key: rite_running
          per_player: true
          value: ""
          delay: 41.0

    # ── GREETING: an un-Opened player arrives (incl. FIRST SPAWN —
    #    HandleJoin emits player_enter once per brand-new character).
    #    Gated on missing 30-end, not 30-start: the quest engine's
    #    room_enter auto-grant runs before this fires, so new arrivals
    #    already hold 30-start. ──
    - type: sequence
      event: player_enter
      children:
        - type: condition
          check: player_missing_quest
          quest: "30-end"
        - type: action
          do: say
          text: >-
            New to Gaius? Welcome. This is Pothole Coulee, and I keep
            its pool, which is waiting for you. Type
            <ansi fg="command">talk hadwen</ansi>, then choose what
            happens in the rite if you want the why of it, or choose
            to begin the rite when you are ready.
          delay: 2.0

    # ── AMBIENT BACKSTOP: every so often, repeat the invitation aloud.
    #    Gated on an un-Opened player actually being present (custom
    #    condition — mob_idle has no triggering player, so plain
    #    player_missing_quest can't apply here). Opened players never
    #    hear this again. ──
    - type: sequence
      event: mob_idle
      children:
        - type: condition
          check: player_in_room_missing_quest
          quest: "30-end"
        - type: condition
          check: random_chance
          percent: 4
        - type: action
          do: say
          text: >-
            If you are new to Gaius and not yet Opened, type
            <ansi fg="command">talk hadwen</ansi> and choose to begin
            the rite when you are ready. The pool is patient.
