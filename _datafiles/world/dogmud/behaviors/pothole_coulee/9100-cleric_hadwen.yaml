# Cleric Hadwen (9100), rite-keeper at the Awakening Pool (room 5200).
#
# Owns the Awakening Rite beat of quest 30 (#375 phase 7 token flow):
#   - his dialogue (dialogue/pothole_coulee/9100.yaml) grants 30-start from
#     the offer rite_offer, and 30-end from the hand-in rite_report;
#   - this tree answers the player choosing to begin the rite (talk hadwen,
#     topic `begin`, #375 R17; the topic's text is empty, so this tree
#     speaks every line) while 30-start is held, grants 30-rite as the rite
#     starts, plays the paced rite sequence, and grants 30-woken at its
#     close. Blank-slate Awakening: the rite grants NO starter mutation;
#     mutations are earned afterward through use-based drift.
# Single-shot: 30-woken is granted at the CLOSE of the rite (a delayed
# action), so for the ~41 s the rite runs the asker still lacks 30-woken,
# and token gating alone would let a second begin queue a second rite
# (2026-10-17 audit S6). The `rite_running` state flag closes that window:
# set instantly when the rite starts, checked by the rite and by the
# mid-rite answer below. Hadwen serves every newcomer, so his clear is a
# delayed action queued with the rite itself. Queued closures run whether
# or not the asker is still online, and BehaviorState is not saved
# (mobs.Mob.BTreeState is yaml:"-"), so a logout or a reboot mid-rite
# cannot leave the flag stuck. After the rite, the begin topic is hidden by
# its 30-rite gate and rite_wait by its 30-woken gate.
# The flag is PER PLAYER (`per_player: true`, BehaviorState key
# "rite_running:<user id>"): the 2026-10-17 newbie-duo playtest had two
# newcomers ask at once, and a mob-wide flag hushed the second one and left
# them un-Opened. Each asker now gets their own rite, and every spoken line
# is addressed to its own asker (`to_actor: true`, sayto: "says to you" for
# them, "says to <name>" for the room), so two interleaved rites both read.
# Test: internal/behaviortree/hadwen_rite_guard_test.go.

tree:
  type: selector
  children:

    # ── MID-RITE: the player chooses begin, or the mid-rite topic rite_wait,
    #    while the rite is already running ──
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topics: [begin, rite_wait]
        - type: condition
          check: state_equals
          key: rite_running
          per_player: true
          value: "1"
        - type: action
          do: say
          to_actor: true
          text: >-
            Hush, now. The pool is still speaking, and it will not be
            hurried. Let it finish.

    # ── THE RITE: the player chooses to begin (30-start held, not yet opened).
    #    rite_wait reaches here only when the rite is NOT running although the
    #    player holds 30-rite: a logout or a restart cut it short (the tree
    #    state is not saved). The rite then starts again, so no one is stuck. ──
    - type: sequence
      event: player_topic
      children:
        - type: condition
          check: topic_is
          topics: [begin, rite_wait]
        - type: condition
          check: player_has_quest
          quest: "30-start"
        - type: condition
          check: player_missing_quest
          quest: "30-woken"
        - type: condition
          check: state_equals
          key: rite_running
          per_player: true
          value: ""
        - type: action
          do: set_state
          key: rite_running
          per_player: true
          value: "1"
        # The mob_idle line for a stalled rite cannot read the per-player flag
        # (mob_idle has no player), so it reads this one. Two rites overlapping
        # clear it at the first close, and that only lets the line speak a few
        # seconds early. Not saved, and cleared by a delayed action, so it
        # cannot stick.
        - type: action
          do: set_state
          key: a_rite_is_running
          value: "1"
        # The rite marks itself on the player at once (#375 phase 1
        # playtest): Hadwen's dialogue cannot read rite_running, so it gates
        # its mid-rite opener and the rite_wait topic on 30-rite, and hides
        # begin. 30-woken at the close supersedes it.
        - type: action
          do: grant_quest
          quest: "30-rite"
        - type: selector
          children:
            - type: sequence
              children:
                - type: condition
                  check: topic_is
                  topic: rite_wait
                - type: action
                  do: say
                  to_actor: true
                  text: >-
                    The pool went quiet before it was done with you. We
                    begin again. Step to the edge with me.
                  delay: 1.0
            - type: action
              do: say
              to_actor: true
              text: Then we begin. Step to the edge with me.
              delay: 1.0
        - type: action
          do: respond
          user_text: >-
            {actor} wades into the shallows and turns to face you. The pale
            plates along his jaw catch the light coming up off the water.
          room_text: >-
            {actor} wades into the shallows and turns to face the one
            beside him.
          delay: 3.0
        - type: action
          do: say
          to_actor: true
          text: >-
            Gaius is made of belief. The land believes itself into
            shape. So does everything that lives on it. So will you.
          delay: 6.0
        - type: action
          do: say
          to_actor: true
          text: >-
            Most worlds let you stay what you arrived as. This one will
            not. The body answers effort, conflict, fear and wanting. It
            changes. We call the changes mutations, and none of them are
            a punishment, whatever they look like at first.
          delay: 9.5
        - type: action
          do: say
          to_actor: true
          text: >-
            The pool answers first. It is older than the town and more
            patient than I am. Look into the water.
          delay: 13.0
        # The rite happens to the asker alone (#515): they read it in the
        # second person, and the rest of the room watches it in the third.
        - type: action
          do: respond
          user_text: >-
            {actor} rests a hand on your shoulder. The pool's light rises
            to meet you, and for a moment you are somewhere else, folded
            inside something vast and warm that is looking back at you
            with your own eyes.
          room_text: >-
            {actor} rests a hand on the shoulder of the one beside him,
            and the pool's light rises to meet them.
          delay: 16.0
        - type: action
          do: respond
          user_text: >-
            {actor} lifts his hand away. The light lets you go: the water
            is only water again, the morning is just a morning, and
            something under your skin is newly, quietly awake.
          room_text: >-
            {actor} lifts his hand away, and the light sinks back into
            the pool.
          delay: 20.0
        - type: action
          do: say
          to_actor: true
          text: It is done. You will feel it settle for a while. That is normal.
          delay: 23.0
        # What a mutation is, said to each player as it is true for them
        # (owner ruling 2026-10-17: a mutation can fire mid-tutorial, in
        # Dewey's rooms, as long as Hadwen explains it). Checked when the
        # rite starts; either branch queues its one line and succeeds, so
        # the rite goes on.
        - type: selector
          children:
            - type: sequence
              children:
                - type: condition
                  check: player_has_mutation
                - type: action
                  do: say
                  to_actor: true
                  text: >-
                    The chrysalis has already changed you. The spores in
                    you answer how you live, and each change they make is
                    called a mutation. Type <ansi fg="command">mutations</ansi>
                    to see what has changed in you, and
                    <ansi fg="command">help mutations</ansi> to read more.
                    The rest you earn the slow way: by how you fight, what
                    you endure, and who you decide to be.
                  delay: 26.0
            - type: action
              do: say
              to_actor: true
              text: >-
                In time the chrysalis will change you. The spores in you
                answer how you live, and each change they make is called a
                mutation. Type <ansi fg="command">mutations</ansi> to see
                what has changed in you, and
                <ansi fg="command">help mutations</ansi> to read more. You
                earn them the slow way: by how you fight, what you endure,
                and who you decide to be.
              delay: 26.0
        - type: action
          do: say
          to_actor: true
          text: >-
            If the name you carried here no longer fits the shape of
            you, <ansi fg="command">rename</ansi> lets you choose a
            truer one. And <ansi fg="command">help</ansi> answers most
            questions with more patience than I have.
          delay: 29.5
        # The light spell, for every road (2026-10-17 audit B3: a player
        # who leaves through Esk never hears Toke's hub lessons).
        - type: action
          do: say
          to_actor: true
          text: >-
            One gift more, and you carry it from today: a light of your
            own. Gaius keeps true dark in its caves and mines, and the
            dark will blind you. When it does, type
            <ansi fg="command">cast glow</ansi> and the spores
            in you will answer.
          delay: 33.0
        - type: action
          do: say
          to_actor: true
          text: >-
            Now, one good road leads on from here. Check what you carry
            first with <ansi fg="command">inv</ansi>. Little enough, I'd
            wager, and that is the point: the folk down that road will
            arm you and teach you their trade. Crier Toke's road teaches
            you the town. If you already know a world like this one,
            ask me, and I will tell you another way out.
          delay: 36.5
        - type: action
          do: say
          to_actor: true
          text: >-
            When you are ready, type
            <ansi fg="command">talk hadwen</ansi> and choose The
            Awakening to tell me the rite is done. Then I will set you
            on your road.
          delay: 40.0
        # Blank-slate Awakening: no starter mutation is granted during the rite.
        # The pool opens the capacity; every mutation is earned afterward through
        # use-based drift (see the mutation-graph acquisition design). The rite's
        # close is the FINAL beat, after the last line at 40.0, so the step
        # lands as the rite ends. 30-end, with its reward line, comes from his
        # hand-in topic rite_report when the player tells him it is done (#375
        # phase 7). This action honors the static `delay` param
        # (behaviortree/actions.go).
        - type: action
          do: grant_quest
          quest: "30-woken"
          delay: 40.5
        # The rite is over: clear the flag so the next newcomer can begin.
        # Queued after the 30-woken grant (the queue runs in order), so by the
        # time a second begin can pass the flag the asker already holds
        # 30-woken.
        - type: action
          do: set_state
          key: rite_running
          per_player: true
          value: ""
          delay: 41.0
        - type: action
          do: set_state
          key: a_rite_is_running
          value: ""
          delay: 41.0

    # ── GREETING: a player who has not finished the rite arrives (the
    #    mud-vet start fires player_enter here, internal/usercommands/start.go;
    #    a walk-in does too). Since #375 phase 7 nothing grants quest 30 by
    #    itself, so the line names the offer. Dewey's send-off names it for
    #    the newcomer route, whose move_player fires no player_enter.
    #    Each state names a line on its own menu (dialogue 9100.yaml): The
    #    Awakening is gone once 30-start is held. The hand-in at 30-woken has
    #    the rite's closing line and the pool's gate to name it. ──
    - type: sequence
      event: player_enter
      children:
        - type: condition
          check: player_missing_quest
          quest: "30-start"
        - type: action
          do: say
          text: >-
            New to Gaius? Welcome. This is Pothole Coulee, and I keep
            its pool, which is waiting for you. Type
            <ansi fg="command">talk hadwen</ansi> and choose The
            Awakening, the line marked [!], when you are ready.
          delay: 2.0
    - type: sequence
      event: player_enter
      children:
        - type: condition
          check: player_has_quest
          quest: "30-start"
        - type: condition
          check: player_missing_quest
          quest: "30-rite"
        - type: action
          do: say
          to_actor: true
          text: >-
            You have asked, and the pool is ready when you are. Type
            <ansi fg="command">talk hadwen</ansi> and choose I'm ready.
            Let us begin the rite.
          delay: 2.0
    - type: sequence
      event: player_enter
      children:
        - type: condition
          check: player_has_quest
          quest: "30-rite"
        - type: condition
          check: player_missing_quest
          quest: "30-woken"
        - type: action
          do: say
          to_actor: true
          text: >-
            The rite is under way, so stay by the water. If nothing is
            happening, type <ansi fg="command">talk hadwen</ansi> and
            choose Is the rite still going?
          delay: 2.0

    # ── AMBIENT BACKSTOP: every so often, repeat the invitation aloud.
    #    Gated on a player in that state actually being present (custom
    #    condition: mob_idle has no triggering player, so plain
    #    player_missing_quest can't apply here). The pool is shared, so the
    #    `missing` param reads one player at a time, and the whole room hears
    #    the line, so each says who it is for. Each state rolls its own dice:
    #    one player waiting here cannot silence the line another needs. ──
    - type: sequence
      event: mob_idle
      children:
        - type: condition
          check: player_in_room_missing_quest
          quest: "30-start"
        - type: condition
          check: random_chance
          percent: 4
        - type: action
          do: say
          text: >-
            If you have not asked me for the rite yet, type
            <ansi fg="command">talk hadwen</ansi> and choose The
            Awakening, the line marked [!]. The pool is patient.
    - type: sequence
      event: mob_idle
      children:
        - type: condition
          check: player_in_room_has_quest
          quest: "30-start"
          missing: "30-rite"
        - type: condition
          check: random_chance
          percent: 4
        - type: action
          do: say
          text: >-
            If you have asked me for the rite, the pool is ready when
            you are. Type <ansi fg="command">talk hadwen</ansi> and
            choose I'm ready. Let us begin the rite.
    - type: sequence
      event: mob_idle
      children:
        - type: condition
          check: player_in_room_has_quest
          quest: "30-rite"
          missing: "30-woken"
        - type: condition
          check: state_equals
          key: a_rite_is_running
          value: ""
        - type: condition
          check: random_chance
          percent: 4
        - type: action
          do: say
          text: >-
            If your rite has begun and nothing is happening, type
            <ansi fg="command">talk hadwen</ansi> and choose Is the rite
            still going? The pool is patient.
