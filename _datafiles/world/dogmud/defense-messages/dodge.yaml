      - '<ansi fg="attack-bad"><ansi fg="mob">{actee}</ansi> barely dodges your attack!</ansi>'
      - '<ansi fg="attack-bad"><ansi fg="mob">{actee}</ansi> twists aside at the last moment!</ansi>'
