# Dodge defense messages
# Tokens available:
# {actee} - name of the defending character
# {actor} - name of the attacking character
# {weapon}   - name of attacker's weapon
#
# Every actee and observer line names the attacker ({actor}): a defender
# facing two foes, and a room watching a crowd, must know whose attack was
# avoided (#631, owner ruling). Guarded by TestDefenceLinesNameTheAttacker.

optionid: dodge
options:
  weak:
    # Narrow dodges - defender barely avoided the attack (z-score < 0.5)
    together:
      actee:
      - '<ansi fg="defense-good">You barely dodge <ansi fg="user">{actor}</ansi>''s attack!</ansi>'
      - '<ansi fg="defense-good">You twist aside at the last moment, narrowly avoiding <ansi fg="user">{actor}</ansi>!</ansi>'
      - '<ansi fg="defense-good">You duck under <ansi fg="user">{actor}</ansi>''s blow just in time!</ansi>'
      - '<ansi fg="defense-good">You stumble back, barely escaping <ansi fg="user">{actor}</ansi>''s <ansi fg="item">{attack}</ansi>!</ansi>'
      - '<ansi fg="defense-good">You weave aside desperately, <ansi fg="user">{actor}</ansi>''s strike whistling past your face!</ansi>'
      - '<ansi fg="defense-good">You roll away clumsily, avoiding <ansi fg="user">{actor}</ansi>''s attack by inches!</ansi>'
      - '<ansi fg="defense-good">You flinch back reflexively, narrowly escaping <ansi fg="user">{actor}</ansi>!</ansi>'
      - '<ansi fg="defense-good">You pivot at the last second, feeling the rush of air as <ansi fg="user">{actor}</ansi>''s attack passes!</ansi>'
      - '<ansi fg="defense-good">You throw yourself aside desperately, barely avoiding <ansi fg="user">{actor}</ansi>''s blow!</ansi>'
      - '<ansi fg="defense-good">You lean back sharply as <ansi fg="user">{actor}</ansi>''s <ansi fg="item">{attack}</ansi> rushes past!</ansi>'
