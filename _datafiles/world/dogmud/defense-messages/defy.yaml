      - '<ansi fg="attack-bad"><ansi fg="mob">{defender}</ansi> refuses to rise fully to your {attack}.</ansi>'
      - '<ansi fg="attack-bad">Your {attack} finds only a narrow purchase on <ansi fg="mob">{defender}</ansi>.</ansi>'
      - '<ansi fg="attack-bad"><ansi fg="mob">{defender}</ansi> answers your {attack} with silence, blunting its edge.</ansi>'
