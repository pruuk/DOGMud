# Mental-spell defence messages. Each index is one coordinated event.
optionid: quell
options:
  weak:
    together:
      actee:
      - '<ansi fg="defense-good">You catch the edge of {actor}''s {attack}, dulling its force.</ansi>'
      - '<ansi fg="defense-good">You push against {actor}''s {attack}; part of its pressure still reaches you.</ansi>'
      - '<ansi fg="defense-good">You steady your thoughts and blunt {actor}''s {attack}.</ansi>'
      - '<ansi fg="defense-good">Your will strains against {actor}''s {attack}, weakening what gets through.</ansi>'
      - '<ansi fg="defense-good">You disrupt the edge of {actor}''s working, but do not break it.</ansi>'
      actor:
      - '<ansi fg="attack-bad">{actee} catches the edge of your {attack}, dulling its force.</ansi>'
      - '<ansi fg="attack-bad">{actee} pushes against your {attack}, though part still lands.</ansi>'
      - '<ansi fg="attack-bad">{actee} steadies their thoughts and blunts your {attack}.</ansi>'
      - '<ansi fg="attack-bad">{actee} strains against your {attack}, weakening it.</ansi>'
      - '<ansi fg="attack-bad">{actee} disrupts the edge of your working without breaking it.</ansi>'
      observer:
      - '<ansi fg="combat">{actee} catches the edge of {actor}''s {attack}.</ansi>'
      - '<ansi fg="combat">{actee} pushes against {actor}''s {attack}, though part still lands.</ansi>'
      - '<ansi fg="combat">{actee} steadies and blunts {actor}''s {attack}.</ansi>'
      - '<ansi fg="combat">{actee} strains against {actor}''s {attack}, weakening it.</ansi>'
      - '<ansi fg="combat">{actee} disrupts the edge of {actor}''s working.</ansi>'
  normal:
    together:
      actee:
      - '<ansi fg="defense-good">You quell the heart of {actor}''s {attack}, though a fading echo reaches you.</ansi>'
      - '<ansi fg="defense-good">You impose calm on {actor}''s {attack} and strip away most of its force.</ansi>'
      - '<ansi fg="defense-good">You unravel the strongest threads of {actor}''s {attack}, but a remnant reaches you.</ansi>'
      - '<ansi fg="defense-good">Your will closes firmly around {actor}''s {attack}, though a muted pulse reaches you.</ansi>'
      - '<ansi fg="defense-good">You break the momentum of {actor}''s {attack}, though a remnant reaches you.</ansi>'
      actor:
      - '<ansi fg="attack-bad">{actee} quells the heart of your {attack}, though an echo still lands.</ansi>'
      - '<ansi fg="attack-bad">{actee} imposes calm on your {attack} and strips away most of its force.</ansi>'
      - '<ansi fg="attack-bad">{actee} unravels the strongest threads of your {attack}, though a remnant lands.</ansi>'
      - '<ansi fg="attack-bad">{actee} closes their will around your {attack}, though a muted pulse lands.</ansi>'
      - '<ansi fg="attack-bad">{actee} breaks your {attack}''s momentum, though a remnant lands.</ansi>'
      observer:
      - '<ansi fg="combat">{actee} quells the heart of {actor}''s {attack}, though an echo still lands.</ansi>'
      - '<ansi fg="combat">{actee} imposes calm on {actor}''s {attack}, stripping away most of its force.</ansi>'
      - '<ansi fg="combat">{actee} unravels the strongest threads of {actor}''s {attack}, though a remnant lands.</ansi>'
      - '<ansi fg="combat">{actee} closes their will around {actor}''s {attack}, though a muted pulse lands.</ansi>'
      - '<ansi fg="combat">{actee} breaks {actor}''s {attack}''s momentum, though a remnant lands.</ansi>'
  heavy:
    together:
      actee:
      - '<ansi fg="defense-good">You take no damage from {actor}''s {attack}, though its momentum still reaches you.</ansi>'
      - '<ansi fg="defense-good">You close your mind against injury from {actor}''s {attack}, though its motion can still move you.</ansi>'
      - '<ansi fg="defense-good">You prevent all damage from {actor}''s working, while its other effects remain possible.</ansi>'
      - '<ansi fg="defense-good">Your will prevents injury from {actor}''s {attack}, though its force can still displace you.</ansi>'
      - '<ansi fg="defense-good">You suffer no damage from {actor}''s working, though the working itself persists.</ansi>'
      - '<ansi fg="defense-good">{actor}''s {attack} fizzles against your quelling will. You take no damage from it.</ansi>'
      - '<ansi fg="defense-good">You smother {actor}''s {attack} until it fizzles. No injury reaches you.</ansi>'
      actor:
      - '<ansi fg="attack-bad">{actee} takes no damage from your {attack}, though its momentum still reaches them.</ansi>'
      - '<ansi fg="attack-bad">{actee} closes their mind against injury from your {attack}, though its motion can still move them.</ansi>'
      - '<ansi fg="attack-bad">{actee} prevents all damage from your working, while its other effects remain possible.</ansi>'
      - '<ansi fg="attack-bad">{actee} prevents injury from your {attack}, though its force can still displace them.</ansi>'
      - '<ansi fg="attack-bad">{actee} suffers no damage from your working, though the working itself persists.</ansi>'
      - '<ansi fg="attack-bad">Your {attack} fizzles against {actee}''s quelling will and deals no damage.</ansi>'
      - '<ansi fg="attack-bad">{actee} smothers your {attack} until it fizzles. No injury reaches them.</ansi>'
      observer:
      - '<ansi fg="combat">{actee} takes no damage from {actor}''s {attack}, though its momentum still reaches them.</ansi>'
      - '<ansi fg="combat">{actee} closes their mind against injury from {actor}''s {attack}, though its motion can still move them.</ansi>'
      - '<ansi fg="combat">{actee} prevents all damage from {actor}''s working, while its other effects remain possible.</ansi>'
      - '<ansi fg="combat">{actee} prevents injury from {actor}''s {attack}, though its force can still displace them.</ansi>'
      - '<ansi fg="combat">{actee} suffers no damage from {actor}''s working, though the working itself persists.</ansi>'
      - '<ansi fg="combat">{actor}''s {attack} fizzles against {actee}''s will, dealing no damage.</ansi>'
      - '<ansi fg="combat">{actee} smothers {actor}''s {attack} until it fizzles, taking no injury.</ansi>'
