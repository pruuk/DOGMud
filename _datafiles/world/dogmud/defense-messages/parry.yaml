# Parry defense messages
# Tokens available:
# {actee} - name of the defending character
# {actor} - name of the attacking character
# {weapon}   - name of attacker's weapon
#
# Every actee and observer line names the attacker ({actor}): a defender
# facing two foes, and a room watching a crowd, must know whose attack was
# turned (#631, owner ruling). Guarded by TestDefenceLinesNameTheAttacker.

optionid: parry
options:
  weak:
    # Narrow parries - defender barely deflected the attack (z-score < 0.5)
    together:
      actee:
      - '<ansi fg="defense-good">You barely parry <ansi fg="user">{actor}</ansi>''s attack!</ansi>'
      - '<ansi fg="defense-good">You deflect <ansi fg="user">{actor}</ansi>''s strike at the last moment!</ansi>'
      - '<ansi fg="defense-good">You desperately catch <ansi fg="user">{actor}</ansi>''s blow on your weapon!</ansi>'
      - '<ansi fg="defense-good">You awkwardly intercept <ansi fg="user">{actor}</ansi>''s <ansi fg="item">{attack}</ansi>!</ansi>'
      - '<ansi fg="defense-good">You scramble to block, barely turning aside <ansi fg="user">{actor}</ansi>''s strike!</ansi>'
      - '<ansi fg="defense-good">Your guard almost fails against <ansi fg="user">{actor}</ansi>, but you manage to deflect!</ansi>'
      - '<ansi fg="defense-good">You clumsily bat <ansi fg="user">{actor}</ansi>''s <ansi fg="item">{attack}</ansi> away!</ansi>'
