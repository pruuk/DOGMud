      actee:
      - '<ansi fg="defense-good">You barely block <ansi fg="user">{actor}</ansi>''s attack!</ansi>'
      - '<ansi fg="defense-good">You brace desperately, barely absorbing <ansi fg="user">{actor}</ansi>''s blow!</ansi>'
      - '<ansi fg="defense-good">Your defense holds against <ansi fg="user">{actor}</ansi>, but just barely!</ansi>'
      - '<ansi fg="defense-good">You awkwardly intercept <ansi fg="user">{actor}</ansi>''s strike with your shield!</ansi>'
      - '<ansi fg="defense-good">You scramble to block <ansi fg="user">{actor}</ansi>, feeling the impact jar your bones!</ansi>'
      - '<ansi fg="defense-good">Your armor barely turns <ansi fg="user">{actor}</ansi>''s strike aside!</ansi>'
      - '<ansi fg="defense-good">You raise your guard at the last second, absorbing <ansi fg="user">{actor}</ansi>''s heavy blow!</ansi>'
      - '<ansi fg="defense-good">You hunker down, your defense creaking as <ansi fg="user">{actor}</ansi> strikes!</ansi>'
      - '<ansi fg="defense-good">You catch <ansi fg="user">{actor}</ansi>''s strike awkwardly, staggering from the force!</ansi>'
