# The line each side reads when a block wins the contest but the swing still
# does damage. actor and actee pair by index; variant 0 is the original line.
# Tokens: {actor} the attacker, {actee} the defender, {damage} the wound words.
deflected:
  actor:
  - '{actee} blocks your swing, but you still connect! (<ansi fg="damage">{damage}</ansi>)'
  - '{actee} blocks late, but your swing still lands! (<ansi fg="damage">{damage}</ansi>)'
  - '{actee} blocks badly, but your swing still hurts them! (<ansi fg="damage">{damage}</ansi>)'
  - '{actee} blocks poorly, but your swing still gets through! (<ansi fg="damage">{damage}</ansi>)'
  actee:
  - 'You block {actor}''s swing, but it still catches you! (<ansi fg="damage">{damage}</ansi>)'
  - 'You block late, but {actor}''s swing still lands! (<ansi fg="damage">{damage}</ansi>)'
  - 'You block badly, but {actor}''s swing still hurts you! (<ansi fg="damage">{damage}</ansi>)'
  - 'You block poorly, but {actor}''s swing still gets through! (<ansi fg="damage">{damage}</ansi>)'
