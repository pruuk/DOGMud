# Quest 54 — Back to the Forge (Pothole Coulee, Spoke B repeatable)
#
# Token flow:
#   54-start: granted by Survivor Ovell's dialogue (forge_loop_offer node).
#             Requires 37-end (Into the Vein). Repeatable with cooldown.
#   54-end:   command trigger on craft at the forge (room 5245). It finishes
#              the quest on the spot (reward + clears for repeat), so no text
#              asks the player to come back. Any recipe crafted at the forge
#              counts; the hint names the iron dagger because every player who
#              reaches this quest has made one and Rusk sells its materials.

questid: 54
name: Back to the Forge
description: >-
  Ovell wants to see you keep your hand in at the forge. Head back to the
  smith's fire and turn out another piece of work.
secret: false
repeatable: true
cooldown_rounds: 300

steps:
  - id: start
    map_target: 5245
    description: >-
      Ovell has asked you to put your blacksmithing to work once more.
      Any recipe made at the forge in the Coulee Smithy counts, and the
      quest is done the moment the craft succeeds. An iron dagger needs an iron
      ingot and a leather strip, and Smith Rusk sells both.
    hint: >-
      At the forge in the Coulee Smithy, type craft iron dagger.
      A craft can fail. If it does, buy an iron ingot and a leather
      strip again and retry.
  - id: end
    description: >-
      You put good work through the forge again. Ovell will have another
      reason to send you back before long.

rewards:
  gold: 6
  skillinfo: "blacksmithing:1"
  actor: >-
    Ovell nods from his slope, that quartz eye catching the forge-light
    through the distance. "Still sharp. The iron knows a practiced hand.
    Come back when you want to keep it that way."
  observer: "Ovell raises a hand from the talus -- a slow, approving gesture."

triggers:
  - event: command
    command: craft
    room: 5245
    conditions:
      has: ["54-start"]
      missing: ["54-end"]
    actions:
      - grant: "54-end"
      - actor: >-
          The work rings clean off the anvil. That is what Ovell wanted
          to know: the forge is still yours.
