questid: 16
name: The Herbalist's Shortage
description: Ashwick's herbalist Delia has been unable to
  restock her supplies. Someone in the forest has been
  harvesting the wild herbs before she can reach them.
secret: false

steps:
  - id: start
    map_target: 4031  # Forager's Camp — The Forager (mob 262)
    description: "Delia, the herbalist in Ashwick, cannot
      restock her supplies. Someone has been taking the
      wild herbs from the forest before she can harvest
      them. Investigate the forest north of the hamlet's
      east edge."
    hint: "From the East Edge of Ashwick, follow the forest
      path north three times to a hidden camp. Whoever lives
      there gathers in the herb clearing just west of it in
      the mornings. They sleep at the camp late at night. Type talk
      forager."
  - id: forager
    map_target: 4027  # fallback when Delia is not spawned
    map_target_mob: 259  # follow Delia (schedule ashwick_delia) — a fixed room is wrong for part of the day
    description: "You found a forager living in the woods
      who has been harvesting Delia's herbs. They have
      agreed to work with Delia if you vouch for them.
      Return to Delia with the news."
    hint: "Delia keeps her cottage north of Ashwick's Central
      Green. From the forager's camp, go south three times to
      the East Edge, west twice to the green, then north. In
      the afternoon she works in the garden behind the cottage,
      and at dusk she sits on the green. She sleeps at the cottage at
      night. Type talk delia."
  - id: end
    description: "You resolved Delia's herb shortage. She
      is grateful, and her worktable is open to you."

rewards:
  actor: "Delia nods slowly, the practical assessment
    of someone who has weighed a solution and found it sound.
    'You have a good eye for problems and their fixes. My
    worktable is yours whenever you need it. Come back any
    time.'"
  observer: "Delia's expression shifts from concern to
    quiet satisfaction as the herb supply problem is resolved."
  gold: 12

triggers:
  # forager: hearing The Forager's "negotiate" topic (moved from the
  # topic's grantsQuest, #375 phase 3b).
  - event: topic_heard
    mob: 262
    topic: negotiate
    conditions:
      has: ["16-start"]
      missing: ["16-forager"]
    actions:
      - grant: "16-forager"
