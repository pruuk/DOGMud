questid: 63
name: Dock Rat
description: >-
  A cargo theft has been pinned on Teo, one of Jesset's dockhands. Jesset
  doesn't believe it. Find out who is really skimming the docks.
secret: false

steps:
  - id: start
    destination:
      room: 5526
    description: >-
      Jesset doesn't buy the theft charge against his hand Teo. He's asked
      you to find who's really been skimming cargo. The foreman, Hewd,
      keeps his books in the office above the constable's post, and Jesset
      told you to mind the floor there.
    hint: >-
      From the Long Quay, where Jesset keeps his board, go north five times
      to the Outer Dock Lane, then east into the Dock Constable's Post and up
      into the Foreman's Office.
      Type look floorboard.
  - id: evidence
    destination:
      mob: [9316, 9300]  # the Dock Constable or Jesset takes the tally-book (owner ruling 16)
    description: >-
      Beneath a loose floorboard in the foreman's office you found Hewd's
      hidden tally-book, with two sets of numbers: proof that he is the one
      skimming and that he hung the shortage on Teo.
    hint: >-
      Take the tally-book to the Dock Constable, just down the stair from the
      Foreman's Office. Jesset on the Long Quay will take it too. Type talk
      constable.
  - id: report
    # destination inferred from triggers (#375 p4); was: bundled objectives, rooms [5503, 5525]; Phase 2 split review
    description: >-
      The tally-book is in trusted hands and Hewd's skimming is exposed.
      Teo is in the clear.
    hint: >-
      The matter is closed.
  - id: end
    description: >-
      Hewd's skimming is exposed, his tally-book handed over, and Teo's
      name is cleared. The docks know who really took the cargo.

rewards:
  gold: 35
  rep_faction: np_dockfolk
  rep_amount: 15
  actor: >-
    The matter settles the way the docks settle things: quietly, and for
    good. Hewd will answer for the difference between his two columns, and
    Teo goes back on the board in the morning. The dockfolk will hear who
    sorted it, and down here that is worth more than coin, though there is
    coin in it too.
  observer: >-
    Word moves along the wharves in the way it does, and more than one
    dockhand gives the traveller a short, respectful nod.

triggers:
  # ── EVIDENCE: pry up the loose floorboard in the foreman's office (5526) ──
  # The noun is the room's own key, `floorboard` (it was `floor-board`, then
  # `floor board`; one word since 2026-10-21 so 63 and 68 teach the same
  # spelling). Triggers 2 to 5 add `board` and the lost-book recovery.
  - event: room_interact
    room: 5526
    noun: floorboard
    conditions:
      has: ["63-start"]
      missing: ["63-evidence"]
    actions:
      - grant: "63-evidence"
      - give_item: 40100
      - actor: >-
          The proud board lifts with a little persuasion. In the gap
          beneath, wrapped in oilcloth, lies a small tally-book, and a
          glance inside is enough. Two columns of numbers for every
          shipment: the manifest count on the left, the real one on the
          right. Foreman Hewd has been skimming the difference for a long
          time, and the shortage he reported was Teo's only by his choosing.
      - observer: "{actor} works a loose floorboard free and pockets something wrapped in oilcloth."

  # ── floorboard, no quest yet ──
  - event: room_interact
    room: 5526
    noun: floorboard
    conditions:
      missing: ["63-start"]
    actions:
      - actor: >-
          One floorboard sits a little proud of its neighbors. You could
          work it loose, but prying up another man's floor without a
          reason is a fast way to find trouble you came here to avoid.

  # ── EVIDENCE, short noun: `look board` reaches the same floorboard ──
  - event: room_interact
    room: 5526
    noun: board
    conditions:
      has: ["63-start"]
      missing: ["63-evidence"]
    actions:
      - grant: "63-evidence"
      - give_item: 40100
      - actor: >-
          The proud board lifts with a little persuasion. In the gap
          beneath, wrapped in oilcloth, lies a small tally-book, and a
          glance inside is enough. Two columns of numbers for every
          shipment: the manifest count on the left, the real one on the
          right. Foreman Hewd has been skimming the difference for a long
          time, and the shortage he reported was Teo's only by his choosing.
      - observer: "{actor} works a loose floorboard free and pockets something wrapped in oilcloth."

  # ── board, no quest yet ──
  - event: room_interact
    room: 5526
    noun: board
    conditions:
      missing: ["63-start"]
    actions:
      - actor: >-
          One floorboard sits a little proud of its neighbors. You could
          work it loose, but prying up another man's floor without a
          reason is a fast way to find trouble you came here to avoid.

  # ── LOST tally-book: Hewd kept a fair copy under the same board ──
  - event: room_interact
    room: 5526
    noun: floorboard
    conditions:
      has: ["63-evidence"]
      missing: ["63-end"]
      missing_item: 40100
    actions:
      - give_item: 40100
      - actor: >-
          You lift the board again. Hewd kept a fair copy as well as his
          working book, and it is still there in the oilcloth. You take it.
      - observer: "{actor} lifts a loose floorboard and takes something wrapped in oilcloth."

  - event: room_interact
    room: 5526
    noun: board
    conditions:
      has: ["63-evidence"]
      missing: ["63-end"]
      missing_item: 40100
    actions:
      - give_item: 40100
      - actor: >-
          You lift the board again. Hewd kept a fair copy as well as his
          working book, and it is still there in the oilcloth. You take it.
      - observer: "{actor} lifts a loose floorboard and takes something wrapped in oilcloth."
