questid: 79
name: Secret of the Vitalis Bandolier
description: >-
  Veyra has shared her secret recipe for the Vitalis Bandolier. Gather the
  materials, craft the parts by your own hand, and bring them to her
  stations to be bound together.
steps:
  - id: start
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Veyra has shared the recipe. Gather the reagents and
      craft the parts by your own hand."
  - id: end
    description: "The Vitalis Bandolier is made."
triggers:
  # Veyra's teach_ node charges the price in the dialogue itself, in the
  # same step as the gold check, and only then grants this token. This
  # trigger teaches the recipes.
  - event: quest_granted
    quest_token: "79-start"
    actions:
      - learn_recipe: {recipe: "reinforced-harness"}
      - learn_recipe: {recipe: "preservation-runes"}
      - learn_recipe: {recipe: "assemble-vitalis-bandolier"}
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Paid. The recipes are yours. Bind the
                straps true. This one has to breathe on its own before
                I will call it finished."}

  - event: item_gain
    item: 40182
    conditions:
      has: ["79-start"]
      missing: ["79-end"]
    actions:
      - grant: "79-end"
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "It moves like it wants to be worn. Good.
                It has already found your pulse. Don't go still on it."}
