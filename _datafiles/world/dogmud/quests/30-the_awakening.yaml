# Quest 30 — The Awakening (Pothole Coulee hub, mandatory beat)
#
# Token flow:
#   30-start  — AUTO-GRANTED at the pool (room_enter trigger below).
#               HandleJoin notifies the quest engine room_enter on every
#               login/spawn, so a brand-new character gets the quest the
#               moment they materialize at 5200 — zero input required.
#               Cleric Hadwen's dialogue also grants it (ask hadwen
#               rite) for veterans who walk in via the corridor.
#   30-end    — granted by Hadwen's behavior tree at the close of the
#               rite sequence (behaviors/pothole_coulee/9100-*.yaml).
#               Blank-slate Awakening: the rite grants NO starter mutation
#               — mutations are earned afterward through use-based drift.

questid: 30
name: The Awakening
description: Undergo the Awakening Rite at the pool in Pothole Coulee.
secret: false

steps:
  - id: start
    map_target: 5200  # fallback when Cleric Hadwen is not spawned
    map_target_mob: 9100  # follow Cleric Hadwen (schedule pothole_hadwen) — a fixed room is wrong for part of the day
    description: "Cleric Hadwen will open the pool for you when you are ready. Type ask hadwen begin at the pool to start the rite."
    hint: "Stand at the Awakening Pool and type ask hadwen begin when you are ready."
  - id: end
    description: "The pool has opened you. Two roads from here: learn the town with Crier Toke, or leave through Warden Esk's arch."
    # An end hint is never displayed (the quest is complete). What a new
    # Opened needs to hear lives where it is shown: quest 29's start hint
    # names the next road, and the reward line below names the light spell.
    hint: "Quest 29, Two Roads, shows the way on from here."

rewards:
  actor: >-
    Something under your skin settles into place, the way silt settles
    in still water. You are not quite who you were when you arrived.
    A small light waits in you now too: in any dark place, type cast
    chrysalis-glow.

triggers:
  # ── THE POOL: arriving at 5200 starts the quest (incl. first spawn —
  #    HandleJoin fires room_enter on login, so brand-new characters get
  #    this with zero input). Conditions make it idempotent.
  - event: room_enter
    room: 5200
    conditions:
      missing: [30-start, 30-end]
    actions:
      - grant: 30-start
