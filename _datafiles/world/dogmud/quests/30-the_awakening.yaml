# Quest 30 — The Awakening (Pothole Coulee hub, mandatory beat)
#
# Token flow:
#   30-start  — AUTO-GRANTED at the pool (room_enter trigger below).
#               HandleJoin notifies the quest engine room_enter on every
#               login/spawn, so a brand-new character gets the quest the
#               moment they materialize at 5200 — zero input required.
#               Cleric Hadwen's dialogue also offers it (his offer topic
#               rite_offer) for veterans who walk in via the corridor.
#   30-rite   — granted by Hadwen's behavior tree as the rite starts.
#   30-end   — granted by Hadwen's behavior tree at the close of the
#               rite sequence (behaviors/pothole_coulee/9100-*.yaml).
#               Blank-slate Awakening: the rite grants NO starter mutation
#               — mutations are earned afterward through use-based drift.

questid: 30
name: The Awakening
description: Undergo the Awakening Rite at the pool in Pothole Coulee.
secret: false

steps:
  - id: start
    map_target: 5200  # fallback when Cleric Hadwen is not spawned
    map_target_mob: 9100  # follow Cleric Hadwen (schedule pothole_hadwen) — a fixed room is wrong for part of the day
    description: "Cleric Hadwen will open the pool for you when you are ready. Talk to him at the pool and choose to begin the rite."
    hint: "Stand at the Awakening Pool and type talk hadwen. When you are ready, choose to begin the rite."
  # Granted by Hadwen's tree the moment the rite starts, so his dialogue can
  # tell a player mid-rite from one still waiting (#375 phase 1 playtest).
  # A rite cut short by a logout or a restart leaves a player here; his
  # rite_wait topic then starts the rite again.
  - id: rite
    map_target: 5200
    map_target_mob: 9100
    description: "The rite has begun. Stay by the Awakening Pool until Cleric Hadwen is done."
    hint: "Stay by the Awakening Pool until the rite is done. If nothing is happening, type talk hadwen and ask whether the rite is still going."
  - id: end
    description: "The pool has opened you. Two roads from here: learn the town with Crier Toke, or leave through Warden Esk's arch. Cleric Hadwen can point you down either one."
    # An end hint is never displayed (the quest is complete). What a new
    # Opened needs to hear lives where it is shown: Hadwen's two road
    # offers (quests 88 and 89, R17) and the rite's closing lines name the
    # next road, and the reward line below names the light spell.
    hint: "Talk to Cleric Hadwen to choose a road on from here."

rewards:
  actor: >-
    Something under your skin settles into place, the way silt settles
    in still water. You are not quite who you were when you arrived.
    A small light waits in you now too: in any dark place, type cast
    glow.

triggers:
  # ── THE POOL: arriving at 5200 starts the quest (incl. first spawn —
  #    HandleJoin fires room_enter on login, so brand-new characters get
  #    this with zero input). Conditions make it idempotent.
  - event: room_enter
    room: 5200
    conditions:
      missing: [30-start, 30-end]
    actions:
      - grant: 30-start
