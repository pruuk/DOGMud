questid: 35
name: First Heat
description: >-
  The coulee smithy's forge, and Smith Rusk to judge your work. Buy
  an iron ingot and a leather strip from her stall, work them at the
  forge into an iron dagger, and bring the finished blade back to her.
secret: false

# Token flow (owner ruling 2026-10-17: one command per step, in order,
# each trigger gated on the step before it):
#   35-start  granted by Rusk's craft_offer node (9116.yaml).
#   35-list   list beside Rusk in the smithy (5245); she is the merchant.
#   35-ingot  item_gain of an iron ingot (40001), gated on 35-list.
#   35-strip  item_gain of a leather strip (40002), gated on 35-ingot.
#   35-craft  craft at the forge (5245), LENIENT: gated on 35-start, because
#             the craft cannot begin without both materials in hand. A player
#             saved on 35-start (the old first step) who already bought them
#             can craft straight away.
#   35-end    Rusk's hand-in topics (gated on 35-craft): craft_turnin when
#             the player carries the dagger (also what giving it to her
#             resolves to; she never keeps it), craft_turnin_told when not.
#             The item_give trigger below goes in Task 16 (#375).

steps:
  - id: start
    map_target: 5245
    description: "The forge is where iron learns its shape. First see
      what Smith Rusk sells. She stands at the forge in the Coulee
      Smithy, and her goods are on her stall."
    hint: "In the Coulee Smithy, next to Rusk, type list."
  - id: list
    map_target: 5245
    description: "You have seen Rusk's goods. The dagger needs an iron
      ingot and a leather strip. Buy the ingot first."
    hint: "Type buy iron ingot."
  - id: ingot
    map_target: 5245
    description: "You have an iron ingot. Now buy the leather strip for
      the grip."
    hint: "Type buy leather strip."
  - id: strip
    map_target: 5245
    description: "You have both materials. Stand at the forge in the
      Coulee Smithy and make the dagger. The forge takes a few moments
      to finish the work."
    hint: "At the forge in the Coulee Smithy, type craft iron dagger.
      A craft can fail. If it does, buy an iron ingot and a leather
      strip again and retry."
  - id: craft
    map_target: 5245
    description: "You worked iron at the forge for the first time
      and turned raw materials into something that did not exist
      before. Bring it back to Rusk."
    hint: "Go to Smith Rusk at the forge and type talk rusk."
  - id: end
    description: "Rusk is satisfied with your first work at the
      forge. The coulee is your range now. Go
      north to the Quench Shed and west to the talus slope, and
      find Survivor Ovell in the Collapsed Cut."

rewards:
  skillinfo: "blacksmithing:1"
  gold: 15
  # Neutral on purpose: Rusk's two hand-in topics (the dagger shown, or
  # her taking the player's word) both end here, and her own reply has
  # already said where Ovell is.
  actor: >-
    Rusk looks at you, not at the forge, with the measuring expression
    of a smith deciding whether a piece of iron is worth tempering.
    Then she nods once and presses a few coins into your hand with the
    finality of a door closing.
  observer: "Rusk nods once and presses a few coins into {actor}'s
    hand."

triggers:
  # ── LIST RUSK'S GOODS (she trades in the smithy, room 5245) ─────
  - event: command
    command: list
    room: 5245
    conditions:
      has: ["35-start"]
      missing: ["35-list"]
    actions:
      - grant: "35-list"
      - actor: "Those are Rusk's goods. The dagger needs an iron
          ingot and a leather strip. Type buy iron ingot."

  # ── BUY THE IRON INGOT (item 40001) ─────────────────────────────
  - event: item_gain
    item: 40001
    conditions:
      has: ["35-list"]
      missing: ["35-ingot"]
    actions:
      - grant: "35-ingot"
      - actor: "You have an iron ingot. Now the grip. Type buy
          leather strip."

  # ── BUY THE LEATHER STRIP (item 40002) ──────────────────────────
  - event: item_gain
    item: 40002
    conditions:
      has: ["35-ingot"]
      missing: ["35-strip"]
    actions:
      - grant: "35-strip"
      - actor: "You have the leather strip. That is everything the
          dagger needs. At the forge, type craft iron dagger."

  # ── CRAFT AT THE FORGE (room 5245) ───────────────────────
  # Lenient gate (35-start, not 35-strip): the craft cannot succeed without
  # the ingot and the strip in hand, so a craft proves the buying steps.
  - event: command
    command: craft
    room: 5245
    conditions:
      has: ["35-start"]
      missing: ["35-craft"]
    actions:
      - grant: "35-craft"
      # The craft quest event fires only when a craft SUCCEEDS (coordinator,
      # 2026-10-17), so the dagger exists when this line plays. The wield/inv
      # teaching lives on the recipe's success_actor
      # (recipes/blacksmithing/iron-dagger.yaml).
      - actor: "The iron dagger is yours, made at the forge. Take it
          to Rusk and type talk rusk."

  # ── TURN IN BY GIVING THE BLADE ──────────────────────────
  # Alternate completion path to the `ask rusk done` dialogue node:
  # a player who does the intuitive thing and physically hands the
  # finished dagger to Rusk completes the quest too. We consume the
  # crafted blade and hand back a clean one so the newbie keeps a
  # weapon to wield (Equals compares UUID, so the returned dagger is
  # a distinct instance and give.go's post-consume RemoveItem is a
  # no-op). consume_item makes give.go take its consume branch, which
  # returns before the generic archetype "hands it back" emote, so
  # the turn-in reads cleanly.
  - event: item_give
    mob: 9116
    item: 10009
    conditions:
      has: ["35-craft"]
      missing: ["35-end"]
    actions:
      - actor: "Rusk takes the blade, turns it once, checks the
          edge with a thumbnail, and presses it straight back into
          your hand. \"Yours. You made it.\""
      - consume_item: 10009
      - give_item: 10009
      - grant: "35-end"
