# Quest 45 — The Unquiet Grove (Pothole Coulee, Spoke E / Folding middle ring)
#
# Token flow (steps run in order, one command each; owner ruling 2026-10-17):
#   45-start — granted by Keeper Orrin's grove_offer node (requires 44-end).
#   45-cast  — command trigger on `cast conviction-spike` in the
#              unquiet_grove area (areas/unquiet_grove.yaml: the grove combat
#              rooms 5311/5312/5313), the creatures there being hostile:
#              casting with a fight on you. Gates on 45-start. One trigger
#              with `area:` since #375 phase 3b slice 4 (it was three
#              copies, one per room).
#   45-kill  — mob_death of a veil-warped grove foe (Drift-Wisp 9147 OR Grove
#              Revenant 9148); two triggers, either grants it. Gates on 45-cast.
#   45-end   — granted by Orrin's grove_turnin node (needs 45-kill).
#
# Design: teach casting in a live fight + concentration (damage/movement can
# break a cast; push through it). Cast first, then finish the creature: the
# quest asks for a spell "in the thick of" the fight, and casting at the
# creature then bringing it down is one fight. Reward grants the player's
# first AoE spell, sparks (Conviction Sparks), via the spellid reward field.
#
# Saved characters (2026-10-17 reorder; the old list was start, kill, cast
# and either order was accepted): a player saved on `kill` is now on the last
# step and can turn in. A player saved on `cast` now needs one kill, which the
# next trigger accepts.

questid: 45
name: The Unquiet Grove
description: >-
  Keeper Orrin tends the meditation grove, where the veil between the world
  and the Folding has worn thin and the things on the far side bleed through.
  He will teach you to cast with a fight on you -- to hold a thought steady
  while the world tries to knock it loose.
secret: false

steps:
  - id: start
    map_target: 5311  # Veil Hollow, west of Orrin; a grove revenant spawns
    description: >-
      Orrin wants you to fight in the grove and cast while you do it. The
      creatures in the Veil Hollow, the Thinning Wood and the Grove Heart
      attack on sight. Loose a spell at one with the fight on you. A hit can
      break the casting, so push through it.
    hint: >-
      If it is dark, type cast glow first. Go west to the Veil Hollow and
      type cast spike revenant.
  - id: cast
    map_target: 5311
    description: >-
      You held a casting together while the grove worked at you. Now bring
      the creature down. A drift-wisp in the Thinning Wood serves as well as
      the revenant.
    hint: >-
      Keep casting until it falls. Type cast spike again.
  - id: kill
    map_target: 5309  # Whispering Grove, Orrin
    description: >-
      You cast with a fight on you and put down a veil-warped creature.
      Report to Keeper Orrin in the Whispering Grove.
    hint: >-
      Go back to Keeper Orrin in the Whispering Grove and type talk orrin.
  - id: end
    description: >-
      Orrin has named your concentration sound. West of the Grove Heart and up
      through the Veil Tear, the scabland waits, where the world comes apart
      and the thing that unmade it still casts in the thinnest place.

rewards:
  skillinfo: "spellcasting:1"
  spellid: sparks
  gold: 25
  actor: >-
    Orrin's late-arriving outline catches up to him as he goes still. "You
    were hit, and the fold held anyway. That is concentration -- not the
    absence of disturbance, but the holding-on through it." He turns a palm
    up, and a scatter of weightless sparks gathers above it and disperses.
    "Here is a wider working, then -- sparks. It is the weakest of the area
    spells, which is to say it is the first one you can trust yourself with:
    it touches everything in front of you at once. You loosed it from the
    same conviction you woke with. When you are ready, go west from the
    Grove Heart and climb through the Veil Tear. The scabland is where the
    grove's trouble comes from, and where it ends."
  observer: ""

triggers:
  # ── CAST: conviction-spike mid-fight anywhere in the unquiet_grove area ──
  - event: command
    command: cast
    noun: conviction-spike
    area: unquiet_grove
    conditions:
      has: ["45-start"]
      missing: ["45-cast"]
    actions:
      - grant: "45-cast"
      - actor: >-
          You shape the fold with the fight pressing on you, and it holds.
          That is concentration. Now bring the creature down: type cast
          spike again until it falls.

  # ── KILL: defeat a veil-warped grove foe after the cast ─────────────────
  - event: mob_death
    mob: 9147
    conditions:
      has: ["45-cast"]
      missing: ["45-kill"]
    actions:
      - grant: "45-kill"
      - actor: >-
          The drift-wisp comes apart into the motes it was made of and does
          not gather again. Go back to Keeper Orrin in the Whispering Grove
          and type talk orrin.
  - event: mob_death
    mob: 9148
    conditions:
      has: ["45-cast"]
      missing: ["45-kill"]
    actions:
      - grant: "45-kill"
      - actor: >-
          The grove revenant folds down and is still. Go back to Keeper Orrin
          in the Whispering Grove and type talk orrin.
