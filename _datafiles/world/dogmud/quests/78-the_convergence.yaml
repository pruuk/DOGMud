questid: 78
name: The Convergence
description: >-
  Veyra Coil-Tongue has taken your measure and found you worth her time.
  Her secret recipes are open to you now, if you can pay for them.
secret: false

steps:
  - id: start
    map_target: -1  # -1: no single resolved destination (near [6438]); Phase 2 review
    description: >-
      You have shown Veyra a piece of your own making. She will share a
      secret recipe now.
  - id: end
    description: "You are known to Veyra."

triggers:
  # Fires the moment Veyra's dialogue grants 78-start and closes out the
  # quest in the same beat. There is no separate turn-in step: this quest
  # exists to mark the player known to Veyra (78-end), which her recipe
  # offers key on. The missing:["78-end"] guard prevents any double-fire
  # if Veyra's dialogue somehow re-grants 78-start after completion.
  - event: quest_granted
    quest_token: "78-start"
    conditions:
      missing: ["78-end"]
    actions:
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Good. When you want one of my secrets,
                ask me for it by name."}
      - grant: "78-end"
