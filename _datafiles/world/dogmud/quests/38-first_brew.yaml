# Quest 38 — First Brew (Pothole Coulee, Spoke C / Alchemy inner ring, cert)
#
# Token flow (one command per step, owner ruling 2026-10-17):
#   38-start: granted by Herbalist Birna's brew_offer dialogue node. Requires
#             30-end (Awakening).
#   38-list:  command trigger on `list` at Birna's pool (5265).
#   38-vial:  item_gain of a Glass Vial (40006), once the stock is listed.
#   38-roots: item_gain of a Healer's Root (40004), once the vial is in hand.
#             A foraged root counts too; the lesson is having the root.
#   38-brew:  command trigger on craft in the bench rooms (5265 or 5267).
#   38-drink: command trigger on quaff (anywhere). Teaches the quaff command.
#   38-end:   granted by Birna's brew_turnin dialogue node (needs 38-drink).
#
# The steps run IN ORDER. The old start step asked for list, two purchases and
# the craft at once, which this engine cannot track (a character holds ONE
# current step per quest). start, brew and drink keep their ids so a player
# saved on them resumes. The brew trigger gates on 38-start, not 38-roots, on
# purpose (lenient grant 38-brew): craft cannot succeed without the vial and
# the roots in hand, and a player saved on the old start step may already
# carry both.
#
# Design: healing-salve is a skill_minimum 0 recipe (every character knows it),
# so the lesson is the LOOP (buy/forage -> craft at a station -> drink), not the
# recipe. The reward grants the minor-antidote recipe (skill 8 -- a real new
# recipe to grow into) plus a couple of spare vials (item_info) to keep brewing.

questid: 38
name: First Brew
description: >-
  Herbalist Birna keeps the drying-racks at the sheltered pool, and the
  first brew waits there. Buy a glass vial and a pair of healer's roots
  from her stall, grind and steep them at the alchemy bench into a
  healing salve, then drink it down.
secret: false

steps:
  - id: start
    destination:
      room: 5265
    description: >-
      The alchemy bench at the sheltered pool is where brewing begins.
      First see what Birna sells. If you already carry a glass vial and two
      healer's roots, you can go straight to the bench and brew.
    hint: >-
      At Birna's pool, type list.
  - id: list
    destination:
      room: 5265
    description: >-
      You have seen Birna's stock. A healing salve needs one glass vial and
      two healer's roots. Start with the vial.
    hint: >-
      Type buy glass vial.
  - id: vial
    destination:
      room: 5265
    description: >-
      You have a glass vial. Now the roots: a healing salve takes two.
      Foraged roots work just as well as bought ones.
    hint: >-
      Type buy 2 healers root.
  - id: roots
    destination:
      room: 5265
    description: >-
      You have the glass vial and the roots. The bench at Birna's pool is an
      alchemy bench, and so is the one on the Drying Racks just west of it.
      Type craft list at a bench to see everything you can make.
    hint: >-
      At the alchemy bench, type craft healing salve. A craft can fail. If
      it does, buy a glass vial and two healer's roots again and retry.
  - id: brew
    destination:
      room: 5265
    description: >-
      You brewed a healing salve. Now drink it. A brew is only worth what
      it does.
    hint: >-
      Type quaff healing salve.
  - id: drink
    destination:
      room: 5265
    description: >-
      The salve went to work, warm and steady. Tell Birna how it felt.
    hint: >-
      Go back to Herbalist Birna at the Sheltered Pool and type talk
      birna.
  - id: end
    description: >-
      Birna has named you brewer enough to leave the pool. The marsh
      lies south; a fenwalker named Falv keeps a camp in the reeds.

rewards:
  skillinfo: "alchemy:1"
  recipe_info: "minor-antidote"
  item_info: "40006:2"
  gold: 15
  actor: >-
    Birna takes the empty vial back and turns it to the light, checking
    the film the salve left behind. The green-gold veining in her hands
    catches the same light. "Clean steep. You did not scorch the root --
    most do, the first time." She tucks a pair of empty vials into your
    pack and presses a folded scrap of waxed paper after them. "The
    antidote formula. You will want it before the marsh teaches you why.
    Falv keeps a camp south in the reeds -- he is rough, but he knows the
    water. Set your home here first so you have somewhere to wake."
  observer: "Birna inspects the empty vial, nods, and tucks a few
    things into the newcomer's pack."

triggers:
  # ── LIST: browse Birna's stall (room 5265) ───────────────────────────
  - event: command
    command: list
    room: 5265
    conditions:
      has: ["38-start"]
      missing: ["38-list"]
    actions:
      - grant: "38-list"
      - actor: >-
          That is Birna's stock. A healing salve needs one glass vial and
          two healer's roots. Type buy glass vial.

  # ── VIAL: a glass vial in hand, after the list ───────────────────────
  - event: item_gain
    item: 40006
    conditions:
      has: ["38-list"]
      missing: ["38-vial"]
    actions:
      - grant: "38-vial"
      - actor: >-
          The glass vial will hold the salve. Now the roots. Type buy 2
          healers root.

  # ── ROOTS: a healer's root in hand, after the vial ───────────────────
  - event: item_gain
    item: 40004
    conditions:
      has: ["38-vial"]
      missing: ["38-roots"]
    actions:
      - grant: "38-roots"
      - actor: >-
          Healer's root, pale and bitter-smelling. With two roots and the
          vial, you have a salve's worth. At the alchemy bench, type craft
          healing salve.

  # ── BREW: craft at an alchemy bench (rooms 5265 / 5267) ──────────────
  # Lenient on 38-start: craft fails without the vial and roots in hand.
  - event: command
    command: craft
    room: 5265
    conditions:
      has: ["38-start"]
      missing: ["38-brew"]
    actions:
      - grant: "38-brew"
      - actor: >-
          The root ground to paste, the water drew it green, and the
          healing salve is sealed in the vial. Type quaff healing salve.
  - event: command
    command: craft
    room: 5267
    conditions:
      has: ["38-start"]
      missing: ["38-brew"]
    actions:
      - grant: "38-brew"
      - actor: >-
          The root ground to paste, the water drew it green, and the
          healing salve is sealed in the vial. Type quaff healing salve.

  # ── DRINK: quaff the salve (anywhere) ───────────────────────────────
  - event: command
    command: quaff
    conditions:
      has: ["38-brew"]
      missing: ["38-drink"]
    actions:
      - grant: "38-drink"
      - actor: >-
          The salve spreads warm through you, a slow steady mending.
          That is what a brew is for. Go back to Birna and type talk
          birna.
