questid: 4
name: The Warden's Report
description: Road Warden Tessara needs someone to investigate bandit activity south
  of her post and bring back evidence of their operations.
secret: false

steps:
  - id: start
    destination:
      room: 408  # the Bandit Hollow (search the camp)
    description: "Road Warden Tessara at the Warden's Post on Dustwalk Road has asked\
      \ you to investigate a bandit camp in the gullies to the south. Search the\
      \ abandoned campsite and the hollow beyond for evidence of their operations."
    hint: "From the Warden's Post, go south twice along the Dustwalk Road to the\
      \ Abandoned Campsite, where the bandits have been working."

  - id: investigate
    destination:
      room: 408  # the Bandit Hollow — find the purse here
    description: "You have reached the bandit camp. Search the Bandit Hollow for\
      \ evidence. A purse containing incriminating documents should prove the\
      \ scope of their operation."
    hint: "The Bandit Hollow is just south of the Abandoned Campsite. Look among\
      \ the stolen goods for a purse. Type get purse."

  - id: evidence
    destination:
      room: 405
    description: "You found the bandit's purse containing caravan schedules and\
      \ route information. Return to Road Warden Tessara at the Warden's Post\
      \ with this evidence."
    hint: "Road Warden Tessara keeps the Warden's Post. From the Bandit Hollow,\
      \ go north three times. Type talk tessara."

  - id: end
    description: "You have delivered the evidence to Warden Tessara. The road\
      \ wardens will act on this intelligence."

rewards:
  actor: "Tessara examines the papers from the purse with a grim expression,\
    \ then folds them carefully into her report stack. 'Names, routes, schedules.\
    \ The wardens at Watchers Crossing will want to see this.' She reaches into\
    \ a pouch and produces a clay token, pressing it into your hand. 'You have\
    \ earned this. Every warden on these roads will know what it means.'"
  observer: "Tessara nods to herself as she reads through the confiscated\
    \ documents, already composing her report."
  gold: 15
  itemid: 17

# Migrated 2026-07-21 from the legacy inline step-trigger format (type:/roomid:/
# grants: nested under steps), which the questengine does not process at runtime —
# the quest could be started but never advanced. Same chain, questengine format.
triggers:
  # start -> investigate: reach the bandit camp (Bandit Hollow, 408).
  - event: room_enter
    room: 408
    conditions:
      has: ["4-start"]
      missing: ["4-investigate"]
    actions:
      - grant: "4-investigate"

  # investigate -> evidence: pick up the bandit's purse (item 16).
  - event: item_gain
    item: 16
    conditions:
      has: ["4-investigate"]
      missing: ["4-evidence"]
    actions:
      - grant: "4-evidence"
