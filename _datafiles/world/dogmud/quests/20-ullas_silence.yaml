questid: 20
name: Ulla's Silence
description: Ulla has asked you to look through her late husband Elgar's
  things in the workshop above her parlor. The town accepts that he was
  lost on a fishing trip twelve years ago. Ulla has always sensed there
  was more.
secret: false

flags:
  - key: truth
    values: [whole, partial]
    description: "Whether the player told Ulla the full truth about
      Vella's role in Elgar's death, or just gave her the journal"

steps:
  - id: start
    destination:
      room: 4138
    description: "Ulla has asked you to look through her late husband
      Elgar's things in the workshop above her parlor. She cannot bring
      herself to do it. She wants to know what was on his mind in the
      months before he disappeared."
    hint: "From Ulla's Parlor, go up the stair to the workshop.
      Something is carved into the handle of the vise on Elgar's
      bench. Type search."
  - id: workshop_carving
    destination:
      room: 4122
    description: "Beneath the cast-iron handle of Elgar's bench-vise,
      a long tight spiral inside an outer circle has been scratched
      into the metal. Old work. Older than the cottage. Whoever
      scratched it knew the symbol meant something. The two stone
      pillars on the Temple Approach in town carry a spiral too."
    hint: "From the workshop, go down, then east to North Square. Go
      south twice to Lakefront Square, then east three times to the
      Temple Approach. Type search."
  - id: temple_pillars
    destination:
      room: 4124
    description: "The two stone pillars on the Temple Approach carry
      the same spiral as Elgar's bench-vise, cut long before the
      present temple was built. The temple garden, south of the
      temple, may hold more of the same."
    hint: "From the Temple Approach, go east into the temple, then
      south into the Temple Garden. Something is buried at the foot of
      the crab-apple tree. Bring a light after dark. Type search."
  - id: garden_marker
    destination:
      room: 4144
    description: "The marker beneath the crab-apple tree carries the
      same spiral, older than the temple. Northwest of the town, on a
      low rise, stand a circle of wardstones and the ruin of an old
      chapel just west of it. The symbol may appear there too."
    hint: "From North Square, go north, northwest, west and north to
      the Wardstone Circle. The Old Chapel Ruin is just west of it. In
      the ruin, type search. Bring a light after dark."
  - id: chapel_altar
    destination:
      room: 4145
    description: "The altar stone in the Old Chapel Ruin bears the
      same spiral. The chapel stood here long before the temple was
      built in town. The Wardstone Circle, just east, has a carved
      altar slab at its centre."
    hint: "Go back east into the Wardstone Circle. A carved altar slab
      lies at its centre. Bring a light after dark. Type search."
  - id: wardstone_altar
    destination:
      room: 4130
    description: "The altar slab in the Wardstone Circle carries the
      spiral too, the fourth site, and a worn line, almost a channel,
      pointing east toward the lake. The chapel and the wardstones
      form a line that runs east past the north edge of the town and
      on out under the lake, where only the lake caves can reach. The
      pillars and the garden marker lie south of it, like signposts.
      Elgar followed it."
    hint: "Bring a light: the caves are dark. From the Fishing Docks, go
      north twice, then east twice to the Cave Mouth. Go down, then west
      into the Bone Shoals. A cairn stands there. Type search."
  - id: bone_shoals_cache
    destination:
      mob: 337  # follow Smith Brindle (schedule brindle): a fixed room is wrong for part of the day
      room: 4106  # fallback when Smith Brindle is not spawned
    description: "Elgar's cache lay where he hid it before going
      deeper: an oilskin pouch with a folded note to Brindle the
      smith, a small Stillwater Black Pearl, and a curl of waxed
      line. You left the pearl and the line in the cache where he set
      them. The note explains the spiral: the sites are markers on a
      line, and the lake caves meet that line in the deep sump.
      Elgar wrote that he was going down alone because he could not
      wait for Brindle to finish the work he was doing. The note is
      dated the day he disappeared."
    hint: "Smith Brindle should know what you found. By day he is in
      his smithy, west of Tinder & Tackle. In the evening he is at the
      Pike & Lantern, west of Lakefront Square. Type talk brindle."
  - id: brindle_confession
    destination:
      room: 4140
    description: "Brindle was Elgar's friend and was meant to go down
      with him. He did not go that day. The hook-spear Elgar ordered
      has sat half-finished on his bench ever since. Now that he has
      said it aloud, he means to finish it at last and take it to Ulla.
      He says Vella the healer, Elgar's sister, buried something at
      Elgar's empty grave for whoever came looking."
    hint: "Go to Stillwater Cemetery, three rooms west of North Square,
      through Ulla's Parlor and the Healer's Cottage. At the foot of
      Elgar's grave, type search. Bring a light after dark."
  - id: kingfisher_found
    destination:
      mob: 355  # follow Vella Thorne (schedule vella): a fixed room is wrong for part of the day
      room: 4136  # fallback when Vella Thorne is not spawned
    description: "Beneath Elgar's empty grave, Vella buried a small
      wooden box with a single carved kingfisher and a note in her
      own hand reading 'He was your brother.' The kingfisher is
      unmistakably Elgar's work."
    hint: "Take the carved kingfisher to Vella Thorne at the Healer's
      Cottage. In the morning she may be at the temple's Healer's
      Alcove, and in the evening in Ulla's Parlor. Type talk vella."
  - id: vella_journal
    destination:
      room: 4137
    description: "Vella has accepted the kingfisher and entrusted you
      with Elgar's last journal entry, the page he wrote the morning
      before he went down. The page records what he expected to
      find, and what he wanted Ulla to know if he did not come back."
    hint: "Take Elgar's journal page to Ulla, in Ulla's Parlor, just
      east of the Healer's Cottage. Type talk ulla."
  - id: end
    description: "The matter of Elgar Voss has been laid open. Ulla
      has read his last words and can finally grieve in the open
      instead of behind closed doors. Brindle finished Elgar's
      hook-spear at last and brought it to her, and she has given it
      to you."

rewards:
  actor: "Ulla unfolds the journal page slowly. She reads it
    twice. The second time she sets it on her knee and puts both hands
    flat over it for a long moment, as if to keep it from blowing
    away. When she looks up, her eyes are wet but steady for the
    first time in years.\n\n'I knew it was something,' she says
    quietly. 'I knew it was something he could not say.'\n\nShe rises
    with effort and takes up a long wrapped bundle from beside the
    hearth: Elgar's hook-spear, the lake-iron bright and new.
    'Brindle brought this to my door after you spoke with him. He
    finished it at last, twelve years late.' She places it in your
    hands without ceremony.\n\n'It was meant for someone who would
    understand. He'd want it to be you.'"
  observer: "is given a long wrapped bundle by Ulla, who closes her
    hand over hers for a moment before letting go."
  gold: 100
  itemid: 10032
  rep_faction: stillwater_citizens
  rep_amount: 15

triggers:
  # ============================================================
  # SEARCH: spiral-motif breadcrumb trail. Each site is found with a
  # real search in its room (tier 2 ruling), never a typed noun.
  # ============================================================

  # ── Step 2: workshop carving (4138) ──
  - event: command
    command: search
    room: 4138
    conditions:
      has: ["20-start"]
      missing: ["20-workshop_carving"]
    actions:
      - grant: "20-workshop_carving"
      - actor: "A long tight spiral inside an outer ring, scratched
          into the iron with a patient hand. The cuts are dark with
          age: old work, set where it would not be noticed by anyone
          who did not know to look. Not a Chrysalis sigil and not a
          Stillwater fish-mark. The same spiral is cut into the two
          stone pillars on the Temple Approach in town."

  # ── Step 3a: temple pillars (4122, the Temple Approach; the temple
  #    sanctuary 4123 has no pillars) ──
  - event: command
    command: search
    room: 4122
    conditions:
      has: ["20-workshop_carving"]
      missing: ["20-temple_pillars"]
    actions:
      - grant: "20-temple_pillars"
      - actor: "The two pillars that frame the Temple Approach carry
          the same spiral that Elgar scratched into his bench-vise,
          worked into the stone with patience and skill, far older
          than the temple behind them. The temple garden, south of
          the temple, may hold more of the same."

  # ── Step 3b: hearing Temple Priest Seren's "acknowledge_spiral" topic,
  #    the other way to this step (moved from the topic's grantsQuest,
  #    #375 phase 3b) ──
  - event: topic_heard
    mob: 344
    topic: acknowledge_spiral
    conditions:
      has: ["20-workshop_carving"]
      missing: ["20-temple_pillars"]
    actions:
      - grant: "20-temple_pillars"

  # ── Step 4: buried marker in the temple garden (4124) ──
  - event: command
    command: search
    room: 4124
    conditions:
      has: ["20-temple_pillars"]
      missing: ["20-garden_marker"]
    actions:
      - grant: "20-garden_marker"
      - discover: "buried marker"
      - actor: "The buried marker beneath the crab-apple carries
          the same spiral. Older than the garden it sits in. Northwest
          of town, on a low rise, there is a circle of standing stones
          with an old chapel ruin just west of it. The symbol may
          appear there again."

  # ── Step 5: chapel altar stone (4144) ──
  - event: command
    command: search
    room: 4144
    conditions:
      has: ["20-garden_marker"]
      missing: ["20-chapel_altar"]
    actions:
      - grant: "20-chapel_altar"
      - actor: "The chapel altar carries the same spiral, the third
          site you have found. Back to the east, the Wardstone Circle
          has a carved altar slab at its centre. It may be the
          fourth."

  # ── Step 6: wardstone altar slab (4145) ──
  - event: command
    command: search
    room: 4145
    conditions:
      has: ["20-chapel_altar"]
      missing: ["20-wardstone_altar"]
    actions:
      - grant: "20-wardstone_altar"
      - actor: "The wardstone slab carries the spiral worn deep
          enough to set a finger into: the fourth site you have
          found. A worn channel runs from it straight toward the
          east. Stand at the circle's centre with the chapel ruin at
          your back, follow the channel with your eye, and the
          alignment is plain: the chapel, this slab, and on east past
          the north edge of the town, out under the lake, and down,
          somewhere only the lake caves can reach. The pillars and
          the garden marker lie south of the line, like signposts
          pointing to it."

  # ── Step 7: Bone Shoals cache (4130) ──
  - event: command
    command: search
    room: 4130
    conditions:
      has: ["20-wardstone_altar"]
      missing: ["20-bone_shoals_cache"]
    actions:
      - grant: "20-bone_shoals_cache"
      - discover: "cache"
      - actor: "The oilskin pouch holds a folded note in Elgar's
          hand, addressed to Brindle the smith. The note explains the
          spiral: the chapel, the wardstone circle and the deep sump
          beneath the lake lie on one line, and the marks at the
          temple point the way to it. Elgar wrote that he was going
          down alone because he could not wait for Brindle to finish
          the work he was doing. The note is dated the day he
          disappeared. A small black pearl and a curl of waxed line
          lie with it; you leave them where he set them. Brindle
          needs to know you found this."

  # ── Step 8: hearing Smith Brindle's "confession" topic (moved from the
  #    topic's grantsQuest, #375 phase 3b) ──
  - event: topic_heard
    mob: 337
    topic: confession
    conditions:
      has: ["20-bone_shoals_cache"]
      missing: ["20-brindle_confession"]
    actions:
      - grant: "20-brindle_confession"

  # ── Step 9: the disturbed turf at Elgar's grave (4140). Gives the
  #    kingfisher. ──
  - event: command
    command: search
    room: 4140
    conditions:
      has: ["20-brindle_confession"]
      missing: ["20-kingfisher_found"]
    actions:
      - grant: "20-kingfisher_found"
      - discover: "disturbance"
      - give_item: 40060
      - actor: "Inside the buried wooden box: a single small
          carved kingfisher in dark wood, unmistakably Elgar's work,
          and a folded note in a different hand reading 'He was your
          brother. V.' The kingfisher is yours now. Bring it to Vella
          at the Healer's Cottage."

  # ── Step 9 RECOVERY: replacement kingfisher if player lost it ──
  - event: command
    command: search
    room: 4140
    conditions:
      has: ["20-kingfisher_found"]
      missing: ["20-vella_journal"]
      missing_item: 40060
    actions:
      - give_item: 40060
      - actor: "There was another small carving wrapped beneath
          the first. You can take this one to Vella in place of
          the one you lost."

  # ── Step 10: hearing Mistress Vella Thorne's "vellahandoff" topic,
  #    which takes the kingfisher and gives the journal page (moved from
  #    the topic's grantsQuest, #375 phase 3b) ──
  - event: topic_heard
    mob: 355
    topic: vellahandoff
    conditions:
      has: ["20-kingfisher_found"]
      missing: ["20-vella_journal"]
    actions:
      - grant: "20-vella_journal"
