# Quest 33 — Hold the Wash (Pothole Coulee, combat spoke)
#
# Token flow (one command per step, in order; owner ruling 2026-10-17):
#   33-start    — granted by Caravan Guard Garve's dialogue (wash_offer
#                 node). Requires 32-end (First Blood). Teaches: real
#                 combat against hostile foes, the flee command, and the
#                 death-wake-at-Mending-Hut loop as a designed lesson.
#   33-scout    — mob_death trigger on Bandit Scout (9110). Requires
#                 33-start. Scouts hold the Lower Wash (5232, north of
#                 Garve's hollow), Gravel Bend (5233) and Upper Wash (5236).
#   33-squatter — mob_death trigger on Bandit Squatter (9111). Requires
#                 33-scout: Garve's order is scout first, squatter second.
#                 The squatter camps in the Cracked Cistern (5235, east of
#                 the hollow) and the Upper Wash (5236).
#   33-end:       granted by Garve's dialogue (wash_turnin node), which
#                 gates on 33-squatter.
#
# Design intent: the wash CAN kill a careless newbie. That is intentional.
# The death loop (fall → wake at Mending Hut → walk back) is a taught
# mechanic. Garve's offer text names flee and the wake location explicitly
# so players are never surprised by either.

questid: 33
name: Hold the Wash
description: >-
  Caravan Guard Garve's convoy was ambushed in the wash, and he holds
  Squatter's Hollow with a wounded sword arm. He has asked you to drive
  out a bandit scout and then a bandit squatter so the hollow is safe
  enough to hold.
secret: false

steps:
  - id: start
    destination:
      mob: 9110  # the nearest Bandit Scout the player can see; else the four rooms that spawn one
    description: >-
      Garve needs the wash cleared: a bandit scout first, then a bandit
      squatter. The nearest scout is in the Lower Wash, just north of
      Squatter's Hollow. If a fight goes badly, type flee to get away. If
      you fall, you wake at the Mending Hut, not in a grave, and you can
      walk back and try again.
    hint: >-
      Go north from Squatter's Hollow to the Lower Wash and type attack
      scout. If it is dark, type cast glow first.
  - id: scout
    destination:
      room: 5235  # Cracked Cistern: Bandit Squatter (mob 9111)
    description: >-
      One bandit scout is down. The squatter camps in the Cracked
      Cistern, east of Squatter's Hollow. Type flee if the fight turns
      against you. When a bandit falls, its gear stays on the corpse:
      type loot corpse to take it.
    hint: >-
      From Squatter's Hollow, go east to the Cracked Cistern and type
      attack squatter.
  - id: squatter
    destination:
      room: 5234
    description: >-
      The bandit squatter is down too. Garve waits in Squatter's Hollow,
      west of the Cracked Cistern.
    hint: >-
      Go back to Garve in Squatter's Hollow and type talk garve.
  - id: end
    description: >-
      Garve can hold the wash now. He mentioned the bandits still hold
      a tower further up. Come back to him when you are ready.
    hint: >-
      The wash behind you is clear. Garve hinted the bandit tower up
      ahead may have more work waiting.

rewards:
  skillinfo: "weapon-combat:1"
  itemid: 20087
  gold: 25
  actor: >-
    Garve presses a purse into your hand and holds your gaze a moment
    longer than is strictly necessary -- the look of someone revising
    their estimate upward. The leggings he slides from the pack beside
    him are well-made, cut for movement, and they fit.

triggers:
  # ── SCOUT: defeat a bandit scout (mob 9110) ─────────────────────────
  - event: mob_death
    mob: 9110
    conditions:
      has: ["33-start"]
      missing: ["33-scout"]
    actions:
      - grant: "33-scout"
      - actor: >-
          The bandit scout goes down. His gear stays on the body until
          you take it: type loot corpse to strip it. Next is the
          squatter. From Squatter's Hollow, go east to the Cracked
          Cistern and type attack squatter.

  # ── SQUATTER: defeat a bandit squatter (mob 9111), after the scout ──
  - event: mob_death
    mob: 9111
    conditions:
      has: ["33-scout"]
      missing: ["33-squatter"]
    actions:
      - grant: "33-squatter"
      - actor: >-
          The bandit squatter drops, and he was wearing something worth
          having. Loot the corpse before you go. Then go back to Garve
          in Squatter's Hollow and type talk garve.
