questid: 85
name: Secret of the Zephyr Treads
description: >-
  Veyra has shared her secret recipe for the Zephyr Treads. Gather the
  materials, craft the parts by your own hand, and bring them to her
  stations to be bound together.
steps:
  - id: start
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Veyra has shared the recipe. Gather the reagents and
      craft the parts by your own hand."
  - id: end
    description: "The Zephyr Treads are made."
triggers:
  # Veyra's teach_ node charges the price in the dialogue itself, in the
  # same step as the gold check, and only then grants this token. This
  # trigger teaches the recipes.
  - event: quest_granted
    quest_token: "85-start"
    actions:
      - learn_recipe: {recipe: "quicksilver-soles"}
      - learn_recipe: {recipe: "windlace-bindings"}
      - learn_recipe: {recipe: "assemble-zephyr-treads"}
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Paid. The recipes are yours. Work
                quickly. The soles won't wait around for slow hands."}

  - event: item_gain
    item: 40188
    conditions:
      has: ["85-start"]
      missing: ["85-end"]
    actions:
      - grant: "85-end"
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Light as a held breath. Try not to
                outrun your own feet."}
