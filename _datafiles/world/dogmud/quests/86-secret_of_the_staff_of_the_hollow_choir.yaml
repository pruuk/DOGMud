questid: 86
name: Secret of the Staff of the Hollow Choir
description: >-
  Veyra has shared her secret recipe for the Staff of the Hollow Choir.
  Gather the materials, craft the parts by your own hand, and bring them
  to her stations to be tuned together.
steps:
  - id: start
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Veyra has shared the recipe. Gather the reagents and
      craft the parts by your own hand."
  - id: end
    description: "The Staff of the Hollow Choir is made."
triggers:
  # Veyra's teach_ node charges the price in the dialogue itself, in the
  # same step as the gold check, and only then grants this token. This
  # trigger teaches the recipes.
  - event: quest_granted
    quest_token: "86-start"
    actions:
      - learn_recipe: {recipe: "conductor-core"}
      - learn_recipe: {recipe: "choir-focus-gems"}
      - learn_recipe: {recipe: "assemble-hollow-choir-staff"}
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Paid. The recipes are yours. Tune each
                gem true, or the whole choir sings out of key."}

  - event: item_gain
    item: 40189
    conditions:
      has: ["86-start"]
      missing: ["86-end"]
    actions:
      - grant: "86-end"
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "...listen to that. Every voice in the
                wood agrees. Let it sing for you."}
