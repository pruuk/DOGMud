questid: 28
name: Waking to Gaius
description: >-
  You wake in the grey between-place with a guide named Dewey beside you.
  Learn the first handful of things every soul needs before it steps into
  the world, one at a time, at your own pace.
secret: false

# Hint style (owner ruling 2026-10-17): one command per step. Say what the
# thing IS first, then the command, then the help topic to read for more.
#
# Pacing: an npc_say line's delay counts from the line before it, not from
# the trigger (each line goes through mobs.Mob.Command, which schedules from
# the mob's last queued command), so delays of 0, 3, 8 and 13 put the last
# line 24 seconds out. Keep each step's lines short and the next-step prompt
# last, said within a few seconds (2026-10-17 newbie-duo playtest; test:
# internal/questengine/quest28_pacing_test.go).
#
# Two steps wait on purpose: warcry, cast and trip share the special-move
# cooldown (Balance.SpecialMoveCooldown rounds of Timing.RoundSeconds, 16
# seconds as shipped), so the cast spike and trip prompts come one cooldown
# plus a second after the move before them (owner, #621). The same test
# checks those two steps against the shipped knobs.

steps:
  - id: start
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You have woken, and Dewey has marked your path."
    # Only ever read by typing hint at this step, which finishes it, so it
    # names the step after (R24, owner 2026-10-21).
    hint: "Hint names your next step whenever you are not sure. Next, look
      shows you the room you are in. Type look. For more, type help look."
  - id: hinted
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You read your first hint. That command is your compass now."
    hint: "Look shows you the room you are in. Type look. For more, type
      help look."
  - id: looked
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You took in the room around you."
    hint: "Words shown in a different color in a room are things you can
      look at. Type look guide."
  - id: examined
    description: "You looked closely at your guide. Reading is the first
      survival skill."
    hint: "To walk to the next room, type its direction. Type north."
  - id: status_prompt
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You stepped into the place where you meet yourself."
    hint: "Status shows a page about you: what you are good at, and how much
      you have left to spend. Type status. For more, type help status."
  - id: statused
    map_target: -1  # action step (command/skill), no travel destination
    description: "You read your six attributes and three pools."
    hint: "Skills are the things you get better at by doing them. Type
      skills. For more, type help skills."
  - id: skilled
    map_target: -1  # action step (command/skill), no travel destination
    description: "You read your skills. Each one grows when you use it."
    hint: "Spells are the magic you know. Type spells to list yours. For
      more, type help spells."
  - id: spelled
    map_target: -1  # action step (command/skill), no travel destination
    description: "You read the list of spells you know."
    hint: "Chrysalis Glow is a spell that makes a soft light around you. Type
      cast glow. For more, type help chrysalis-glow."
  - id: glowed
    description: "You cast your first spell: a light of your own for dark
      places."
    hint: "To walk to the next room, type its direction. Type north."
  - id: carry_prompt
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Small things matter out there."
    hint: "Get picks a thing up and puts it in your pack. Type get token.
      For more, type help get."
  - id: got
    map_target: -1  # action step (command/skill) — no travel destination
    description: "The token is yours now."
    hint: "Inventory lists what you carry and what you wear. Type
      inventory."
  - id: invd
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You checked what you are carrying."
    hint: "Help lists every topic the game can explain. Type help."
  - id: helped
    description: "You opened the help index, your patient, permanent
      reference."
    hint: "To walk to the next room, type its direction. Type north."
  - id: speaks_prompt
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Out in the world, people answer when you speak."
    hint: "Say speaks out loud to everyone in the room. Type say hello.
      For more, type help say."
  - id: said
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You spoke, and the world can hear you."
    hint: "Talk starts a conversation with one person, and you choose what
      to ask about. Type talk dewey, then choose the question about the
      world. For more, type help talk."
  - id: asked
    description: "You learned to talk with someone and ask a question. Half
      of what matters is learned that way."
    hint: "To walk to the next room, type its direction. Type north."
  - id: proving_prompt
    map_target: -1  # action step (command/skill) — no travel destination
    description: "The practice ring, where you make your mistakes safely."
    hint: "A war cry is a shout that steadies you for a fight. Type warcry.
      For more, type help warcry."
  - id: warcried
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Your war cry steadied your nerve. It is a condition, an
      effect on you."
    hint: "Conditions are effects on you, good or bad. Type conditions to
      see yours. For more, type help conditions."
  - id: saw_conditions
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You read your conditions. They can be good or bad."
    hint: "Big moves need time to rest after you use them. Type cooldowns to
      see which ones are resting. An empty list means they have all rested.
      For more, type help cooldowns."
  - id: checked_cooldowns
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You checked your cooldowns. Your big moves share one
      well."
    hint: "Consider tells you how hard a foe is before you fight it. Type
      consider effigy. For more, type help consider."
  - id: considered
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You read the effigy true. Some fights cannot be won."
    hint: "The ring is safe, so fight anyway. Attack starts a fight. Type
      attack effigy."
  - id: attacked
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You closed with the effigy. Your swings keep going on
      their own."
    hint: "Conviction Spike is a spell that strikes your foe with the force
      of belief. Once your shout has rested, type cast spike. For more, type
      help conviction-spike."
  - id: cast_spike
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You loosed a spike of conviction. Belief is a weapon here."
    hint: "A trip knocks your foe to the ground. Once your spike has rested,
      type trip. For more, type help trip."
  - id: tripped
    map_target: -1  # action step (command/skill) — no travel destination
    description: "You put the effigy down: voice, belief, and body, all
      yours."
    hint: "This fight cannot be won. Flee breaks you out of a fight and
      runs you to safety. Type flee. For more, type help flee."
  - id: fled
    map_target: -1  # -1: no single resolved destination; Phase 2 review
    description: "You broke away. Running is how you live to win the next one."
    hint: "Dewey is waiting at the Landing for one last word. Type talk
      dewey."
  - id: end
    description: "Dewey sent you through to the world. Gaius is waiting."

rewards:
  actor: >-
    Dewey's voice stays with you a moment after the grey lets go: steady,
    warm, already a little proud. You are awake now, and the world is real.

triggers:
  # ── 6258 The Threshold: greet, hint, look, look guide, north ──
  - event: room_enter
    room: 6258
    conditions:
      missing: [28-start, 28-end]
    actions:
      - grant: 28-start
      - npc_say:
          mob: 9491
          lines:
            # A newcomer has never played a MUD (R24, owner 2026-10-21): say
            # what a quest and a command are before the first instruction.
            - {delay: 1, text: "There you are, waking up at last. Easy, now.
                Nothing here can harm you. I am Dewey, your guide."}
            - {delay: 2, text: "You have a quest now. A quest is a task, done
                one step at a time. This one teaches you to live here."}
            - {delay: 2, text: "You act here by typing. The first word you type
                is the command. Type it, press Enter, and the world answers."}
            - {delay: 2, text: "Your first command is hint. It names your next
                step, any time you are not sure. Type hint."}

  - event: command_issued
    command: hint
    conditions:
      has: [28-start]
      missing: [28-hinted]
    actions:
      - grant: 28-hinted
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "Good. Now take stock of where you stand. Look
                shows you the room around you. Type look."}

  # A player who types look guide before a bare look has done both lessons.
  # First, so the bare-look trigger below (which also matches look guide)
  # does not say "Type look guide" in the same command (#495).
  #
  # The room-noun lesson (owner ruling 2026-10-17): "guide" is a room noun
  # of 6258 and its description names it, so it shows highlighted.
  - event: command_issued
    command: look
    noun: guide
    conditions:
      has: [28-hinted]
      missing: [28-looked]
    actions:
      - grant: 28-looked
      - grant: 28-examined
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "That's the whole trick of this world. The
                ones who read what is in front of them live longest. Any
                word shown in a different color is worth a look. The exits
                line shows the ways out. To walk north, type north."}

  - event: command_issued
    command: look
    noun: guide
    conditions:
      has: [28-looked]
      missing: [28-examined]
    actions:
      - grant: 28-examined
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "That's the whole trick of this world. The
                ones who read what is in front of them live longest. Any
                word shown in a different color is worth a look. The exits
                line shows the ways out. To walk north, type north."}

  # Last: it matches look guide too, and would grant what the trigger
  # above requires in the same command.
  - event: command_issued
    command: look
    conditions:
      has: [28-hinted]
      missing: [28-looked]
    actions:
      - grant: 28-looked
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "Good. See the words shown in a different
                color? Those are things you can look at more closely. Try
                one. Type look guide."}

  # ── 6259 Knowing Yourself: status, skills, spells, cast glow, north ──
  - event: room_enter
    room: 6259
    conditions:
      has: [28-examined]
      missing: [28-status_prompt]
    actions:
      - grant: 28-status_prompt
      - npc_say:
          mob: 9491
          lines:
            - {delay: 1, text: "This is where you meet yourself. Status shows
                a page about you: what you are good at, and how much you have
                left to spend. Type status."}

  # The pools and reservation in plain words (owner ruling 2026-10-17).
  - event: command_issued
    command: status
    conditions:
      has: [28-status_prompt]
      missing: [28-statused]
    actions:
      - grant: 28-statused
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "There you are, all of you on one page. The six
                attributes at the top are how strong, quick and sharp you are.
                They grow when you use them."}
            - {delay: 2, text: "Your three pools matter most. Health keeps you
                alive. Stamina pays for swings and other moves of the body.
                Conviction pays for spells and shouts. All three refill with
                time and rest."}
            - {delay: 2, text: "The line at the bottom of your screen shows
                the same three pools as bars: HP is health, SP is stamina,
                CP is conviction. That line is your prompt."}
            - {delay: 2, text: "Some things you keep, like a companion or a
                piece of enchanted gear, hold part of a pool back for as
                long as you keep them. That is called reservation. Rest
                does not bring it back, and status shows how much is held."}
            - {delay: 2, text: "Next, your skills. Skills are the things you
                get better at by doing them. Type skills."}

  - event: command_issued
    command: skills
    conditions:
      has: [28-statused]
      missing: [28-skilled]
    actions:
      - grant: 28-skilled
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "Every skill starts small and grows each time
                you use it. Now your spells. Spells are the magic you know.
                Type spells."}

  - event: command_issued
    command: spells
    conditions:
      has: [28-skilled]
      missing: [28-spelled]
    actions:
      - grant: 28-spelled
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "You woke knowing a few already. Chrysalis Glow
                makes a soft light around you. Out in the world, nights and
                caves are dark, and a light lets you see your way. Type cast
                glow."}

  # `command`, not command_issued: a cast can be refused. The noun is the
  # canonical spell id, so `cast glow` and `cast chrysalis-glow` both count.
  - event: command
    command: cast
    noun: chrysalis-glow
    conditions:
      has: [28-spelled]
      missing: [28-glowed]
    actions:
      - grant: 28-glowed
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "Good. Hold still while it gathers. Spells take
                a moment. The light lasts a while, then fades. When it fades,
                cast it again. Once it is up, type north."}

  # ── 6260 What You Carry: get token, inventory, help, north ──
  - event: room_enter
    room: 6260
    conditions:
      has: [28-glowed]
      missing: [28-carry_prompt]
    actions:
      - grant: 28-carry_prompt
      - npc_say:
          mob: 9491
          lines:
            - {delay: 1, text: "Small things matter out there. Get picks a
                thing up and puts it in your pack. Type get token."}

  - event: command_issued
    command: get
    noun: token
    conditions:
      has: [28-carry_prompt]
      missing: [28-got]
    actions:
      - grant: 28-got
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "Yours now. Inventory lists everything you
                carry and wear. Type inventory."}

  - event: command_issued
    command: inventory
    conditions:
      has: [28-got]
      missing: [28-invd]
    actions:
      - grant: 28-invd
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "When you forget a command, the game remembers
                for you. Help lists every topic it can explain. Type help."}

  - event: command_issued
    command: help
    conditions:
      has: [28-invd]
      missing: [28-helped]
    actions:
      - grant: 28-helped
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "That list is always there. Help and a topic,
                like help look, explains one thing. When you are ready, type
                north."}

  # ── 6261 The World Speaks: say, talk, north ──
  #    The talk lesson (R20, #375 phase 1): Dewey's topic asked_28 (the
  #    question about the world, dialogue/newcomer_antechamber/9491.yaml)
  #    grants 28-asked when chosen from his talk menu.
  - event: room_enter
    room: 6261
    conditions:
      has: [28-helped]
      missing: [28-speaks_prompt]
    actions:
      - grant: 28-speaks_prompt
      - npc_say:
          mob: 9491
          lines:
            - {delay: 1, text: "People answer when you speak to them out
                there. Say speaks out loud to everyone in the room. Type say
                hello."}

  # `command`, not command_issued: a refused bare `say` must not count.
  # The same goes for every step below whose command can be refused.
  - event: command
    command: say
    conditions:
      has: [28-speaks_prompt]
      missing: [28-said]
    actions:
      - grant: 28-said
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "Ha, and the world will answer, out there. Talk
                starts a conversation with one person. A numbered list of
                questions comes up, and you type a number to ask one. Type
                talk dewey."}

  # ── 6262 The Proving: warcry, conditions, cooldowns, consider, attack,
  #    cast, trip, flee ──
  - event: room_enter
    room: 6262
    conditions:
      has: [28-asked]
      missing: [28-proving_prompt]
    actions:
      - grant: 28-proving_prompt
      - npc_say:
          mob: 9491
          lines:
            # Dewey's lesson topics stay open here, and while one is unheard
            # his name shows [*] (dialogue Marker). Tie the mark the player
            # met in the first menu back to him (R24). Worded so it holds
            # whether or not the mark is showing; the warcry prompt stays last.
            - {delay: 1, text: "When you see [*] beside my name, I still have
                something worth hearing. If you want it, type talk dewey."}
            - {delay: 2, text: "The practice ring, where you make your
                mistakes safely. A war cry is a shout that steadies you
                before a fight. Type warcry."}

  - event: command
    command: warcry
    conditions:
      has: [28-proving_prompt]
      missing: [28-warcried]
    actions:
      - grant: 28-warcried
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "Feel that lift? That is a condition, an effect
                on you. Conditions can be good or bad. Type
                conditions to see yours."}

  - event: command_issued
    command: conditions
    conditions:
      has: [28-warcried]
      missing: [28-saw_conditions]
    actions:
      - grant: 28-saw_conditions
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "Shouting used one of your big moves. Big moves
                need time to rest after you use them. Type cooldowns to see
                what is resting. If the list is empty, your shout has rested
                already."}

  - event: command_issued
    command: cooldowns
    conditions:
      has: [28-saw_conditions]
      missing: [28-checked_cooldowns]
    actions:
      - grant: 28-checked_cooldowns
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "Before you fight, size up your foe. Consider
                tells you how hard a fight will be. Type consider effigy."}

  - event: command_issued
    command: consider
    noun: effigy
    conditions:
      has: [28-checked_cooldowns]
      missing: [28-considered]
    actions:
      - grant: 28-considered
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "Your instincts speak true. That thing is
                woven too tight for anyone to break. Remember the feeling
                of a fight you cannot win. It will matter in a moment."}
            - {delay: 2, text: "But this ring is safe. Its blows are too
                soft to matter. So fight anyway. Type attack effigy."}

  # From here until the flee, the effigy fight is running and its text
  # floods the screen. Dewey whispers these lines to the player instead of
  # saying them to the room, so each one prints once, framed, and stands
  # out (owner ruling 2026-10-17). The antechamber is a solo instance, so
  # no one else needed the room line.
  - event: command_issued
    command: attack
    noun: effigy
    conditions:
      has: [28-considered]
      missing: [28-attacked]
    actions:
      - grant: 28-attacked
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, whisper: true, text: "You keep swinging on your own
                while the fight goes on. Your shout is still resting, so
                watch a few blows land first."}
            - {delay: 17, whisper: true, text: "Rested. Now strike with belief
                too. Conviction Spike is a spell that hits with force. Type
                cast spike."}

  # Noun is the canonical spell id on the cast success event, so `cast spike`
  # and `cast conviction-spike` both count and a refused cast does not.
  - event: command
    command: cast
    noun: conviction-spike
    conditions:
      has: [28-attacked]
      missing: [28-cast_spike]
    actions:
      - grant: 28-cast_spike
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, whisper: true, text: "Spells take a moment to
                gather. Watch it build."}
            - {delay: 8, whisper: true, text: "There. A spell is a big move
                too, so it rests the way your shout did. Wait for it."}
            - {delay: 9, whisper: true, text: "Rested. Now knock the effigy
                down. A trip sweeps a foe off its feet. Type trip."}

  # A trip that is carried out, landed or not, counts. So does the refusal
  # "already on the ground": an automatic SWEEP often drops the effigy first,
  # and trip.go reports that case as a trip so the step cannot soft-lock.
  - event: command
    command: trip
    conditions:
      has: [28-cast_spike]
      missing: [28-tripped]
    actions:
      - grant: 28-tripped
      - npc_say:
          mob: 9491
          lines:
            - {delay: 1, whisper: true, text: "That is the body's way. When a
                trip lands, the foe goes down wearing a condition of its
                own. Voice, belief, and body: all yours."}
            - {delay: 2, whisper: true, text: "Out here you grow by doing.
                Belief deepens your Willpower, and blades sharpen your
                Dexterity. You earn it. You never pick it."}
            - {delay: 2, whisper: true, text: "Now the last lesson, the one
                your instincts already gave you. This fight cannot be won.
                Flee breaks you out of a fight. Type flee to break away and
                live."}

  # Fires once the flee has worked and the player has arrived in 6467, where
  # Dewey is waiting (NewRound_DoCombat_helpers.go notifyFleeSucceeded). A
  # refused or blocked flee does not count, and Dewey's line no longer
  # prints before "You flee to the north exit!".
  - event: command
    command: flee
    conditions:
      has: [28-tripped]
      missing: [28-fled]
    actions:
      - grant: 28-fled
      - npc_say:
          mob: 9491
          lines:
            - {delay: 0, text: "Running isn't losing. It's how you live to
                win the next one."}

  # ── 6467 The Landing: the `talk dewey` handoff (farewell + teleport to the
  #    Awakening Pool + grant of quest 30 + completion of 28-end) is handled by
  #    the room's behavior tree, which INTERCEPTS the talk command so Dewey's
  #    generic dialogue hint does not also fire. See
  #    behaviors/rooms/newcomer_antechamber/6467.yaml.
