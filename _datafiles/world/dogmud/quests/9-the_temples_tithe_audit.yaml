questid: 9
name: The Temple's Tithe Audit
description: Temple Priest Olen suspects merchants of under-paying their tithes. The
  merchants suspect the temple of inflating expenses. Both are right. Retrieve the
  tithe ledger and decide who sees it.
secret: false

steps:
  - id: start
    map_target: 476  # the Records Office — find the tithe ledger
    description: "Temple Priest Olen has asked you to investigate discrepancies in
      the tithe records. He suspects merchants in the market are under-reporting
      their income to avoid full tithes. Find the tithe ledger in the Records
      Office."
    hint: "From the Temple Interior, go south twice, then east, then north
      into the Records Office. Type get ledger."
  - id: deliver
    map_target: 468  # fallback when Temple Priest Olen is not spawned
    map_target_mob: 95  # follow Temple Priest Olen (schedule thornwall_temple_priest) — a fixed room is wrong for part of the day
    description: "You have the tithe ledger. Take it to Temple Priest Olen. Its
      contents damn both the merchants and the temple."
    hint: "Take the tithe ledger to Temple Priest Olen in the Temple Interior
      and type talk olen."
  - id: end
    description: "The tithe dispute is in other hands now. Neither side is
      entirely clean."

rewards:
  actor: "The ledger's contents are damning in both directions. Whoever
    receives it will use it to their advantage, and the other side will suffer
    for it. Or perhaps the public airing of both parties' dishonesty will force
    a more honest arrangement. In Thornwall, optimism is a luxury, but sometimes
    the truth is enough."
  observer: "The tithe ledger changes hands, and the balance of power shifts."
  gold: 12
  itemid: 27
  rep_faction: thornwall_citizens
  rep_amount: 15

triggers:
  # Pick up the ledger in the Records Office -> advance to the deliver step.
  - event: item_gain
    item: 29
    conditions:
      has: ["9-start"]
      missing: ["9-deliver"]
    actions:
      - grant: "9-deliver"

  # A player who found the ledger first accepts the offer holding it, so the
  # step hint moves on to the hand-in. Dialogue grants reach quest_granted
  # (hooks/Quest_HandleQuestUpdate.go).
  - event: quest_granted
    quest_token: "9-start"
    conditions:
      missing: ["9-deliver"]
      has_item: 29
    actions:
      - grant: "9-deliver"
