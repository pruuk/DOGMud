questid: 5
name: The Innkeeper's Complaint
description: Innkeeper Tolva believes the bridge toll at Watchers Crossing is unauthorized
  and is strangling trade through the settlement. She wants proof from the toll
  collector's own records.
secret: false

steps:
  - id: start
    destination:
      room: 421  # the Tollhouse — find the crossing ledger
    description: "Innkeeper Tolva at the Crossing Inn has asked you to investigate the bridge toll. She believes it is unauthorized and wants proof. Find the crossing ledger at the tollhouse."
    hint: "From the Crossing Inn, go south to the West Approach, then east into the Tollhouse. The crossing ledger sits on the counter. Type get ledger."
  - id: deliver
    destination:
      mob: 84  # follow Innkeeper Tolva (schedule watchers_tolva) — a fixed room is wrong for part of the day
      room: 423  # fallback when Innkeeper Tolva is not spawned
    description: "You have the crossing ledger. Bring it back to Innkeeper Tolva at the Crossing Inn."
    hint: "Innkeeper Tolva keeps the Crossing Inn. From the Tollhouse, go west to the West Approach, then north. She sleeps in the back room late at night. Type talk tolva."
  - id: end
    description: "You delivered the ledger to Tolva. She will use the records to petition Thornwall for an official review of the toll."

triggers:
  # Pick up the ledger at the Tollhouse -> advance to the deliver step.
  - event: item_gain
    item: 21
    conditions:
      has: [5-start]
      missing: [5-deliver]
    actions:
      - grant: 5-deliver

rewards:
  actor: "Tolva pages through the ledger with practiced speed, her lips pressed thin. 'Just as I thought. No writ of authority, no commission from Thornwall, no charter. He set this toll up himself.' She closes the book firmly. 'I will send this to the magistrate with my next supply order. You have done this settlement a service.' She slides a wooden token across the counter."
  observer: "Tolva examines the ledger with grim satisfaction, already composing a letter in her head."
  gold: 12
  itemid: 20
