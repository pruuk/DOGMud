# Quest 36 — Pick the Vein (Pothole Coulee, Forge spoke)
#
# Token flow (owner ruling 2026-10-17: one command per step, in order, each
# trigger gated on the step before it; the order is the one Ovell gives in
# vein_offer: the scavenger, then the lurker, then the forage):
#   36-start:     granted by Survivor Ovell's dialogue (vein_offer node).
#                 Requires 35-end (First Heat with Smith Rusk). Teaches:
#                 real combat on the talus slope, gathering local ore via
#                 forage, and the component bag mechanic.
#   36-scavenger: mob_death trigger on Scree Scavenger (9118). Requires
#                 36-start. Scavengers crawl the Lower Talus, the Scree
#                 Field and the Upper Talus (rooms 5249/5250/5253).
#   36-lurker:    mob_death trigger on Talus Lurker (9119). Requires
#                 36-scavenger. Lurkers wait in the Ore Pocket and on the
#                 Upper Talus, the high shoulder (rooms 5252/5253).
#   36-ore:       command trigger on forage in rooms 5250 or 5252.
#                 Requires 36-lurker. A forage that rolls and finds
#                 nothing still counts, so its lines never claim ore.
#   36-end:       granted by Ovell's dialogue (vein_turnin node, gated on
#                 36-ore, the last step).
#
# Routes (rooms.txt): Collapsed Cut 5251 north -> Lower Talus 5249; Cut west
# -> Ore Pocket 5252; Lower Talus west -> Scree Field 5250; Scree Field south
# -> Ore Pocket, west -> Upper Talus 5253; Upper Talus west -> Mine Mouth.
#
# Design intent: the slope is more dangerous than the forge yard but less
# than the wash. Scree Scavengers are fast; Talus Lurkers are durable.
# Foraging the vein teaches the forage command and the component bag in
# the same breath. Ovell's turn-in gifts the Component Pouch (item 30033)
# so the lesson lands at the moment of reward.

questid: 36
name: Pick the Vein
description: >-
  Survivor Ovell pulled himself out of a cave-in on the talus slope.
  His leg keeps him off the high scree, but the basalt-iron vein is
  still there and so are the scavengers and lurkers that claimed it.
  He has asked you to clear them out and work the vein yourself.
secret: false

steps:
  - id: start
    map_target: 5249
    description: >-
      Ovell needs the slope cleared, starting with a scree scavenger.
      They crawl the Lower Talus just north of his cut, and the Scree
      Field and Upper Talus beyond it. If a fight turns against you,
      flee: you wake at the Mending Hut, not in the rock.
    hint: >-
      Go north from the Collapsed Cut to the Lower Talus and type
      attack scavenger. If it is dark, type cast chrysalis-glow first.
  - id: scavenger
    map_target: 5252
    description: >-
      One scree scavenger is down. Next is a talus lurker. One waits
      in the Ore Pocket, west of Ovell's cut and south of the Scree
      Field, and another on the Upper Talus. Lurkers are tough, so
      flee if the fight turns.
    hint: >-
      In the Ore Pocket, west of the Collapsed Cut, type attack lurker.
  - id: lurker
    map_target: 5250
    description: >-
      The talus lurker is down. Now work the basalt-iron vein. It
      shows in the bluff above the Scree Field and runs into the
      rubble of the Ore Pocket below it.
    hint: >-
      In the Ore Pocket or on the Scree Field just north of it, type
      forage.
  - id: ore
    map_target: 5251
    description: >-
      You have worked the basalt-iron vein, and the slope is cleared.
      Report back to Ovell in the Collapsed Cut.
    hint: >-
      Go back to Survivor Ovell in the Collapsed Cut, east of the Ore
      Pocket, and type ask ovell done.
  - id: end
    description: >-
      The slope is clear and you have worked the vein. Ovell
      pressed a component pouch into your hands: your crafting
      materials now route into it automatically. The mine below
      still holds something he would not name.
    hint: >-
      You have cleared Spoke B of the forge path. Ovell mentioned
      the mine below the slope is pitch dark and something waits
      in it. Make sure you can cast chrysalis-glow before you
      go down.

rewards:
  skillinfo: "blacksmithing:1"
  itemid: 30033
  gold: 25
  actor: >-
    Ovell digs a worn leather pouch from his coat with the care of
    someone parting with something that has been useful. The quartz
    eye tracks you steadily while the other squints in the slope
    light. "You cleared it. Worked the vein. I did not know if you
    would come back." He presses the component pouch into your hands
    and curls your fingers around the strap. "Materials go in on
    their own once you carry it. Sort if you have loose ones already.
    And if you ever want to break a piece of kit back down,
    salvage it. The slope gives back what you put into it, mostly."

triggers:
  # ── SCAVENGER: defeat a scree scavenger (mob 9118) ─────────────────
  - event: mob_death
    mob: 9118
    conditions:
      has: ["36-start"]
      missing: ["36-scavenger"]
    actions:
      - grant: "36-scavenger"
      - actor: >-
          The scree scavenger goes still on the rock. Next is the
          talus lurker. In the Ore Pocket, type attack lurker.

  # ── LURKER: defeat a talus lurker (mob 9119) ────────────────────────
  - event: mob_death
    mob: 9119
    conditions:
      has: ["36-scavenger"]
      missing: ["36-lurker"]
    actions:
      - grant: "36-lurker"
      - actor: >-
          The talus lurker drops back into the rock and does not
          rise. Now work the vein. In the Ore Pocket or on the Scree
          Field, type forage.

  # ── ORE: forage the basalt-iron vein (room 5250 — scree field) ──────
  # A forage can roll and find nothing; it still counts, so this line
  # does not claim ore was found.
  - event: command
    command: forage
    room: 5250
    conditions:
      has: ["36-lurker"]
      missing: ["36-ore"]
    actions:
      - grant: "36-ore"
      - actor: >-
          You work the exposed vein for whatever it will give. The
          seam is open to anyone now. Go back to Ovell in the
          Collapsed Cut and type ask ovell done.

  # ── ORE: forage the basalt-iron vein (room 5252 — ore pocket) ───────
  - event: command
    command: forage
    room: 5252
    conditions:
      has: ["36-lurker"]
      missing: ["36-ore"]
    actions:
      - grant: "36-ore"
      - actor: >-
          You pick through the rubble where the vein crosses the ore
          pocket. The seam is open to anyone now. Go back to Ovell,
          just east of here, and type ask ovell done.
