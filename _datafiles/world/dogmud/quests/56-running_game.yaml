# Quest 56 — Running Game (Pothole Coulee, Spoke D repeatable)
#
# Token flow (one command per step, owner ruling 2026-10-17):
#   56-start — granted by Hunter Delk's dialogue (game_loop_offer node).
#              Requires 43-end (Break the Pack). Repeatable with cooldown.
#   56-hunt: mob_death trigger on a Pronghorn (9139). Requires 56-start.
#   56-end:  command trigger on forage on the Open Steppe (5284).
#              Requires 56-hunt. Auto-grants reward + clears for repeat.
#
# The run finishes on the forage itself, with no visit back to Delk, and the
# forage counts only on the Open Steppe. The hints used to send the player to
# forage "at the camp" (Delk's camp is Hunter's Hollow, 5290, where the
# trigger does not listen) and to "come back to Delk", which completes
# nothing. They now say what completes each step. Step ids are unchanged, so
# a player saved on start or hunt resumes as before.

questid: 56
name: Running Game
description: >-
  Delk keeps a close eye on what moves through the fringe. He wants
  you to bring down a pronghorn and forage the country before you
  let the land get strange on you.
secret: false
repeatable: true
cooldown_rounds: 300

steps:
  - id: start
    destination:
      room: 5289
    description: >-
      Delk wants you to bring down a pronghorn and then forage the Open
      Steppe before you lose the feel for the country. Pronghorn graze the
      Thornbrake, north of his camp, and the Carrion Flat, south of the Game
      Trail.
    hint: >-
      In the Thornbrake, north of Delk's camp, type attack pronghorn. If it
      is dark, type cast glow first.
  - id: hunt
    destination:
      room: 5284
    description: >-
      One pronghorn down. Forage the Open Steppe, north of the Steppe Fringe,
      to finish the run. The forage ends it; you do not need to go back to
      the camp.
    hint: >-
      On the Open Steppe, type forage.
  - id: end
    description: >-
      You took game and worked the land. Delk will have another run
      waiting before long.

rewards:
  gold: 6
  skillinfo: "search:1"
  actor: >-
    The run is done: clean kill, eyes open, and the land worked after it.
    The fringe teaches you different things each pass. When you want
    another run, talk to Delk for work.
  observer: ""

triggers:
  - event: mob_death
    mob: 9139
    conditions:
      has: ["56-start"]
      missing: ["56-hunt"]
    actions:
      - grant: "56-hunt"
      - actor: >-
          The pronghorn goes down clean. Now, on the Open Steppe, type
          forage.

  - event: command
    command: forage
    room: 5284
    conditions:
      has: ["56-hunt"]
      missing: ["56-end"]
    actions:
      - grant: "56-end"
      - actor: >-
          You work the steppe for what it gives. Some days that is little,
          and the run still counts.
