questid: 71
name: The Tribute
description: >-
  Dame Ostry pays the bloodline's quarterly tribute like every vendor in
  the city, but an audit and a held deposit are bleeding her. She wants to
  know what the tribute is for, and whether there is any floor under it at
  all. The answer runs from a permit clerk's desk to a private gate no one
  argues with.
secret: false

steps:
  - id: start
    destination:
      mob: 9349  # follow Clerk Vell (schedule np_merchant_vell), a fixed room is wrong for part of the day
      room: 5817  # fallback when Clerk Vell is not spawned
    description: >-
      Dame Ostry is squeezed by Clerk Vell's audit and a held surety
      deposit. She asked you to find out what the tribute pays for and
      whether it can be appealed.
    hint: >-
      Clerk Vell keeps the Permit Office, north of Coin Alley from Dame
      Ostry's Armoury. Type talk vell.
  - id: vell
    destination:
      mob: 9344  # follow Horst (schedule np_merchant_horst), a fixed room is wrong for part of the day
      room: 5820  # fallback when Horst is not spawned
    description: >-
      Vell says the rate is set by charter and is not negotiable. The
      charter derives from the founding, and you may know more about the
      founding than Vell does.
    hint: >-
      The tribute runs upward, past the clerk, to Horst at the Watched House
      Gate, north of the Watched Lane. Type talk horst.
  - id: horst
    destination:
      room: 5815
    description: >-
      Horst gatekeeps the bloodline's private business and told you, in so
      many words, that the tribute funnels up and discretion is the whole
      arrangement. Papers were left in the parlor.
    hint: >-
      The papers are in the private parlor of the Gilt Threshold, through the
      curtain to the east of its taproom. Type search there.
  - id: ledger
    destination:
      mob: 9347  # follow Dame Ostry (schedule np_merchant_ostry), a fixed room is wrong for part of the day
      room: 5810  # fallback when Dame Ostry is not spawned
    description: >-
      You lifted a page of the tribute ledger: vendor sums all routed to
      one unnamed account, with a note to hold filings until permits clear.
      It does not prove a crime. It proves leverage.
    hint: >-
      Take the ledger page back to Dame Ostry in her Armoury, south of Coin
      Alley. Type talk ostry.
  - id: end
    description: >-
      Ostry cannot break the bloodline, and neither can you. But with the
      ledger page and a quiet word, her deposit is released and her permit
      clears. One merchant breathes. The arrangement goes on.

rewards:
  gold: 110
  rep_faction: np_commonfolk
  rep_amount: 10
  itemid: 40120
  actor: >-
    Ostry reads the page once, folds it, and puts it somewhere you do not
    see. "I cannot fight them with this," she says, "and I am not fool
    enough to try. But I can let the right person know I have it, and
    tomorrow my deposit comes back and my permit clears, and nobody says
    why. That is how it works down here." She presses a blade into your
    hands before you can decline it. "You will get more use from it than
    from my thanks."
  observer: >-
    Dame Ostry clasps the traveller's forearm once, hard and brief, the
    nearest thing she has to ceremony.

triggers:
  # VELL: hearing Clerk Vell's "q71_vell" topic (moved from the topic's
  # grantsQuest, #375 phase 3b).
  - event: topic_heard
    mob: 9349
    topic: q71_vell
    conditions:
      has: ["71-start"]
      missing: ["71-vell"]
    actions:
      - grant: "71-vell"

  # HORST: hearing Horst's "q71_horst" topic (moved from the topic's
  # grantsQuest, #375 phase 3b).
  - event: topic_heard
    mob: 9344
    topic: q71_horst
    conditions:
      has: ["71-vell"]
      missing: ["71-horst"]
    actions:
      - grant: "71-horst"

  # Lost ledger page: another of the same column has worked loose. First, so one
  # search gives one page. Ostry's hand-in takes the page, so a player who lost
  # it finds another while the quest is open.
  - event: command
    command: search
    room: 5815
    conditions:
      has: ["71-ledger"]
      missing: ["71-end"]
      missing_item: 40119
    actions:
      - give_item: 40119
      - actor: >-
          The ledger-board is still on the table among the cup rings, and
          another page of the same column has worked loose beneath it. You
          take it: the same quarterly sums, routed up to the same unnamed
          account.
      - observer: "{actor} palms a page from the table among the cup rings."

  # LEDGER: a search of the parlor finds what the torn scrap came from.
  - event: command
    command: search
    room: 5815
    conditions:
      has: ["71-horst"]
      missing: ["71-ledger"]
    actions:
      - give_item: 40119
      - grant: "71-ledger"
      - actor: >-
          The torn scrap on the floor reads "before the permit clears",
          and the page it tore from is still on the table among the
          cup rings, slid half under a ledger-board. You take it: a column
          of quarterly sums against vendor names, every figure routed up to
          one unnamed account. It does not prove a crime. It proves exactly
          where the money goes, and who waits on whom.
      - observer: "{actor} palms a page from the table among the cup rings."

  # bonus: cooperage rep if the player has already proven the false founding (Q69)
  - event: quest_granted
    quest_token: "71-end"
    conditions:
      has: ["69-end"]
    actions:
      - bump_rep: {faction: cooperage_circle, delta: 5}
