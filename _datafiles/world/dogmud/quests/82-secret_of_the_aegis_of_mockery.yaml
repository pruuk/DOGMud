questid: 82
name: Secret of the Aegis of Mockery
description: >-
  Veyra has shared her secret recipe for the Aegis of Mockery. Gather the
  materials, craft the parts by your own hand, and bring them to her
  stations to be set into the housing.
steps:
  - id: start
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Veyra has shared the recipe. Gather the reagents and
      craft the parts by your own hand."
  - id: end
    description: "The Aegis of Mockery is made."
triggers:
  # Veyra's teach_ node charges the price in the dialogue itself, in the
  # same step as the gold check, and only then grants this token. This
  # trigger teaches the recipes.
  - event: quest_granted
    quest_token: "82-start"
    actions:
      - learn_recipe: {recipe: "voice-amber-housing"}
      - learn_recipe: {recipe: "resonance-lacquer"}
      - learn_recipe: {recipe: "assemble-aegis-of-mockery"}
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Paid. The recipes are yours. Set the
                housing clean. A voice that cannot carry an insult is
                just noise, and I will not put my name on noise."}

  - event: item_gain
    item: 40185
    conditions:
      has: ["82-start"]
      missing: ["82-end"]
    actions:
      - grant: "82-end"
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Listen to it laugh. Go let something
                regret standing close to you."}
