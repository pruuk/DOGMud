# Quest 88 -- Toke's Road (Pothole Coulee, post-rite bridge)
#
# One of the two roads that replace quest 29 "Two Roads" (owner ruling R17,
# 2026-10-20, #375 phase 1). Cleric Hadwen offers both roads after the rite
# (30-end); the player takes either, both, or neither. Esk's road is 89.
#
# Token flow:
#   88-start -- granted on Accept of Hadwen's offer topic road_toke
#               (dialogue/pothole_coulee/9100.yaml). Hidden once footing has
#               started (31-start), since the player is already on this road.
#   88-end   -- granted by Crier Toke's hand-in topic road_toke_end
#               (dialogue/pothole_coulee/9106.yaml), or by the trigger below
#               when the player accepts Toke's footing walk (31-start) without
#               handing this in first, so the quest never lingers.
#
# destination room 5203 (Hub Square) is the fallback; Toke follows his schedule
# (pothole_toke), so the marker follows him.

questid: 88
name: Toke's Road
description: >-
  Cleric Hadwen has pointed you to Crier Toke, who knows every door in
  Pothole Coulee and will walk you through the town.
secret: false

steps:
  - id: start
    destination:
      mob: 9106  # follow Crier Toke (schedule pothole_toke)
      room: 5203  # fallback when Crier Toke is not spawned
    description: >-
      Crier Toke waits in Hub Square, just south of the Awakening Pool. He
      will teach you the town.
    hint: >-
      From the Awakening Pool, go south to Hub Square. Type talk toke.
  - id: end
    description: >-
      You found Crier Toke, and he will walk you through the town.

triggers:
  # ── FOOTING FIRST: accepting Toke's footing walk closes this road too. ──
  - event: quest_granted
    quest_token: 31-start
    conditions:
      has: [88-start]
      missing: [88-end]
    actions:
      - grant: 88-end
