questid: 7
name: The Fallow Field
description: Farmer Dorn's neighbour was evicted by the Thornwall
  Tax Authority, and the abandoned field is breeding pests that
  threaten the remaining farms. Kill the pests and bring Dorn a
  sample.
secret: false

steps:
  - id: start
    map_target: 444  # the Pest Fields — kill pests for a sample
    description: "Farmer Dorn has asked you to clear the crop pests
      from the south fields and bring back a sample."
    hint: "From Dorn's farm, go east to the fallow field, then south to
      the Pest Fields. There, type attack pest."
  - id: deliver
    map_target: 442  # Farmer Dorn's farm
    description: "You have a pest sample. Bring it back to Farmer Dorn."
    hint: "Take the pest sample back to Farmer Dorn's farm and type talk
      dorn."
  - id: end
    description: "You reported back to Dorn. The pest problem is
      under control for now."

rewards:
  actor: "Dorn examines the pest sample with a grim
    expression, then sets it down carefully. 'Bigger than they
    should be. The fallow field is feeding them, all that
    untended root growth, it is a paradise for vermin.' He looks
    toward Thornwall's walls. 'Gareth was a good farmer. The tax
    took everything. And now the rest of us pay for it in
    different coin.' He reaches into a pouch. 'This is not much,
    but it is honest.'"
  observer: "Dorn nods slowly, the weight of the situation
    evident in his weathered face."
  gold: 8
  itemid: 23
  rep_faction: thornwall_citizens
  rep_amount: 15

triggers:
  # A pest drops a sample -> advance to the deliver step.
  - event: item_gain
    item: 24
    conditions:
      has: [7-start]
      missing: [7-deliver]
    actions:
      - grant: 7-deliver

  # Corpses hold the loot (CorpsesEnabled), and every crop pest carries a
  # sample (item 24 is a carried item, which always drops), so after each
  # kill the player is told how to search the body.
  # `loot corpse` reaches the newest corpse at every sight level
  # (rooms.FindCorpseIndex); the Pest Fields are outdoors and dark at night,
  # where only the word "corpse" matches.
  - event: mob_death
    mob: 91
    conditions:
      has: [7-start]
      missing: [7-deliver]
      missing_item: 24
    actions:
      - actor: "The pest goes still. To search it for a sample, type loot
          corpse."

  # A player who found the sample first accepts the offer holding it, so the
  # step hint moves on to the hand-in. Dialogue grants reach quest_granted
  # (hooks/Quest_HandleQuestUpdate.go).
  - event: quest_granted
    quest_token: "7-start"
    conditions:
      missing: [7-deliver]
      has_item: 24
    actions:
      - grant: 7-deliver
