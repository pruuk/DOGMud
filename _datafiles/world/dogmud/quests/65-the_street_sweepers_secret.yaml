questid: 65
name: The Street Sweeper's Secret
description: >-
  Coll the sweeper keeps finding fragments of an odd gray material in the
  Common Quarter's gutters, older than the city and harder than stone.
  Trace them to their source.
secret: false

steps:
  - id: start
    destination:
      room: 5624
    description: >-
      Coll the sweeper has been finding fragments of a strange gray
      material in the gutters for two years. He's asked you to trace them
      to their source. The gutters run down from somewhere, and the oldest
      stone in the quarter lies below, down the Undercroft Stair past the
      Fighting-Pit Gate.
    hint: >-
      From Carter's Rise, where Coll sweeps by day, go west twice to Dockgate
      Street, then north three times to Tenement Row. Go east, then north to Tannery Street. Go east
      twice to the Flophouse Steps, north to the Fighting-Pit Gate, east to
      the Undercroft Stair, then down into the Old Foundation. Type look
      seam.
  - id: discover
    destination:
      mob: 9320  # follow Coll the Sweeper (schedule np_common_coll) — a fixed room is wrong for part of the day
      room: 5602  # fallback when Coll the Sweeper is not spawned
    description: >-
      Beneath the Common Quarter you found a pre-Founding undercroft, and the
      gray material runs in seams through stonework far older than New
      Plymouth itself. This is the source of Coll's gutter-fragments.
    hint: >-
      From the Old Foundation, go up, then west three times to Sweeper's
      Corner. Go south to Tannery Street, west to the Back Court, then south
      four times to Dockgate Street and east twice to Carter's Rise. Coll
      sweeps there from morning to evening. Type talk coll.
  - id: report
    # destination inferred from triggers (#375 p4); was: return-to-giver / in-place (start room 5602); Phase 2 split review
    description: >-
      Coll has the lump and the truth of where it came from.
    hint: >-
      The sweeper knows his secret now.
  - id: end
    description: >-
      Coll knows where his fragments come from: the buried city beneath
      the Common, and the gray material seamed through its bones. Some
      rumors, it turns out, are worth confirming quietly.

rewards:
  gold: 30
  rep_faction: np_commonfolk
  rep_amount: 15
  actor: >-
    Coll turns the cold gray lump over in his sweeper's hands, and for once
    he has nothing to say for a long moment. "Older than the city. Under
    the city. And it washes up in my gutters when the rain's hard enough to
    loosen it." He pockets it carefully. "The bookseller wasn't wrong to go
    quiet. Keep this between us. The sort who'd want to know about a
    buried city aren't the sort I'd want knowing I found it. But you did
    right by an old sweeper, and the quarter remembers that."
  observer: >-
    Coll the sweeper closes his hand around a cold gray lump and, for once,
    says nothing at all.

triggers:
  # ── DISCOVER: examine the gray-material seam in the undercroft (5624) ──
  # The noun is the room's own key, `gray material seam` (it was
  # `gray-material seam`, which only the old hyphenated highlight could
  # reach). Triggers 2 to 5 add `seam` and the lost-lump recovery.
  - event: room_interact
    room: 5624
    noun: gray material seam
    conditions:
      has: ["65-start"]
      missing: ["65-discover"]
    actions:
      - grant: "65-discover"
      - give_item: 40101
      - actor: >-
          You set a hand to the seam and the cold of it goes straight to
          the bone: not the cold of stone but something older and more
          patient. A lump comes loose in your fingers, fist-sized and far
          too heavy: the same gray material Coll finds in fragments, here
          in the mass, seamed through worked stone that was old before New
          Plymouth's first wall was laid. The rain loosens pieces of it and
          the gutters carry them up to the streets above. This is the
          source.
      - observer: "{actor} works a heavy gray lump loose from a seam in the old stonework."

  # ── seam, no quest yet ──
  - event: room_interact
    room: 5624
    noun: gray material seam
    conditions:
      missing: ["65-start"]
    actions:
      - actor: >-
          A seam of cold gray material runs through the old stone. Not
          quarried rock, something stranger and far older. You could work a
          piece loose, but without a reason it is just a curiosity in the
          dark.

  # ── DISCOVER, short noun: `look seam` reaches the same seam ──
  - event: room_interact
    room: 5624
    noun: seam
    conditions:
      has: ["65-start"]
      missing: ["65-discover"]
    actions:
      - grant: "65-discover"
      - give_item: 40101
      - actor: >-
          You set a hand to the seam and the cold of it goes straight to
          the bone: not the cold of stone but something older and more
          patient. A lump comes loose in your fingers, fist-sized and far
          too heavy: the same gray material Coll finds in fragments, here
          in the mass, seamed through worked stone that was old before New
          Plymouth's first wall was laid. The rain loosens pieces of it and
          the gutters carry them up to the streets above. This is the
          source.
      - observer: "{actor} works a heavy gray lump loose from a seam in the old stonework."

  # ── seam, no quest yet ──
  - event: room_interact
    room: 5624
    noun: seam
    conditions:
      missing: ["65-start"]
    actions:
      - actor: >-
          A seam of cold gray material runs through the old stone. Not
          quarried rock, something stranger and far older. You could work a
          piece loose, but without a reason it is just a curiosity in the
          dark.

  # ── LOST lump: the seam gives up another piece ──
  - event: room_interact
    room: 5624
    noun: gray material seam
    conditions:
      has: ["65-discover"]
      missing: ["65-end"]
      missing_item: 40101
    actions:
      - give_item: 40101
      - actor: >-
          You work another lump of the gray material loose from the seam.
          It is just as cold, and just as heavy.
      - observer: "{actor} works a heavy gray lump loose from a seam in the old stonework."

  - event: room_interact
    room: 5624
    noun: seam
    conditions:
      has: ["65-discover"]
      missing: ["65-end"]
      missing_item: 40101
    actions:
      - give_item: 40101
      - actor: >-
          You work another lump of the gray material loose from the seam.
          It is just as cold, and just as heavy.
      - observer: "{actor} works a heavy gray lump loose from a seam in the old stonework."
