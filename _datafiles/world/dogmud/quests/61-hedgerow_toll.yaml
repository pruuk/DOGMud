questid: 61
name: Hedgerow Toll
description: >-
  Goodwife Pemberton's trade at the Lake & Ladle is bleeding: her
  lodgers and the road's travellers are being robbed and beaten on the
  road. She has asked you to put down the two that work it: a hedgerow
  bandit in the reeds at the Mire Cutoff, and a Reach-touched thing out
  in the Empty Reach to the north.
secret: false

steps:
  - id: start
    # destination inferred from triggers (#375 p4); was: bundled objectives, rooms [5376, 5395]; Phase 2 split review
    description: >-
      Goodwife Pemberton asked you to clear the two preying on the road:
      a hedgerow bandit hidden in the reeds at the Mire Cutoff, and a
      Reach-Touched out in the Empty Reach to the north. Clear them in
      that order.
    hint: "Start with the hedgerow bandit, hidden in the reeds at the
      Mire Cutoff: from the Lake & Ladle's yard, go southwest. Then
      Pemberton wants the Reach-Touched dead too."
  - id: bandit
    destination:
      mob: 9178  # the Reach-Touched, a hidden ambusher: tracked only by a player who sees hidden
      zone: The Empty Reach  # otherwise the zone it haunts (owner 2026-10-28, ruling 11)
    description: >-
      The hedgerow bandit at the Mire Cutoff is dead. The Reach-Touched
      still haunts the Empty Reach to the north.
    hint: >-
      From the Mire Cutoff, go northeast to the Lake & Ladle yard, then
      follow the road north through the Empty Reach to the Abandoned
      Camp, and put down the Reach-Touched.
  - id: reach
    destination:
      room: 5378
    description: >-
      The Reach-Touched is down, and so is the hedgerow bandit. Report
      back to Pemberton at the Lake & Ladle.
    hint: >-
      Return to the Lake & Ladle. Pemberton keeps the common room, east
      of the inn yard. Type talk pemberton.
  - id: end
    description: >-
      Pemberton can promise her lodgers a safe road again. The toll the
      hedgerows took is paid off.

rewards:
  gold: 40
  itemid: 30036
  skillinfo: "weapon-combat:1"
  actor: >-
    Pemberton listens to the whole of it, then lets out a breath she
    seems to have been holding for a week. "Both of them. Then I can
    tell my lodgers the road north is walkable again and not be lying."
    She counts coin from the strongbox without haggling for once, and
    presses a salve into your hand on top of it. "For the next set of
    bruises. You will have them, doing work like this. There is always
    a seat by my fire for you."
  observer: >-
    Goodwife Pemberton settles a purse into the traveller's hand with
    the air of a woman whose trade just started breathing again.

triggers:
  # ── HEDGEROW BANDIT defeated first (mob 9173, North Road North) ──────
  - event: mob_death
    mob: 9173
    conditions:
      has: ["61-start"]
      missing: ["61-bandit"]
    actions:
      - grant: "61-bandit"
      - actor: >-
          The hedgerow bandit folds into the ditch he ambushed from and
          does not get up. One of the road's two is done. The
          Reach-Touched still haunts the Empty Reach to the north.

  # ── REACH-TOUCHED defeated second (mob 9178, The Empty Reach) ────────
  # Needs 61-bandit: the order is fixed (tier 2). Killing it earlier is trigger 2.
  - event: mob_death
    mob: 9178
    conditions:
      has: ["61-bandit"]
      missing: ["61-reach"]
    actions:
      - grant: "61-reach"
      - actor: >-
          The Reach-Touched shudders, goes still, and is just a body on
          the stones. The road north is clear of both now. Carry the
          word back to Pemberton at the Lake & Ladle.

  # ── REACH-TOUCHED defeated before the bandit: counts for nothing ─────
  - event: mob_death
    mob: 9178
    conditions:
      has: ["61-start"]
      missing: ["61-bandit"]
    actions:
      - actor: >-
          The Reach-Touched shudders, goes still, and is just a body on
          the stones. It will not stay down long. Pemberton wanted the
          bandit in the reeds dealt with first.
