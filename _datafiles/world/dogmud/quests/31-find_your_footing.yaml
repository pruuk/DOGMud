# Quest 31 — Find Your Footing (Pothole Coulee hub, optional orientation)
#
# Token flow:
#   31-start   — granted by Crier Toke's dialogue (requires 30-end)
#   31-school  — room_enter trigger, Chrysalis School Hall (5213)
#   31-list:     command trigger, `list` at Coulee Provisions (5207), teaches
#                the `list` command (step inserted 2026-10-17: one command
#                per step; it used to be a nudge that did not advance)
#   31-shop    — item_gain trigger, buying a cotton shirt (20008) at Coulee
#                Provisions (5207) — teaches the `buy` command
#   Steps run in order; each trigger gates on the step before it.
#   31-equip   — command trigger, `equip` — teaches wearing gear
#   31-lantern — room_enter trigger, The Drowned Lantern (5205)
#   31-end:      granted by Toke's dialogue turn-in (requires 31-lantern);
#                after it, Toke offers the seven trail quests one at a time

questid: 31
name: Find Your Footing
description: Walk the hub of Pothole Coulee, kit yourself out, and learn where everything lives.
secret: false

steps:
  - id: start
    description: "Crier Toke wants you to learn the town before the town has to learn you. Start at the Chrysalis School Hall. If you lose your way, the map command shows where you have been."
    hint: "From Hub Square go north past the Awakening Pool, then keep north up the basalt stair to the Chrysalis School Hall. Walking in is enough."
  - id: school
    destination:
      mob: 9104  # follow Trader Onna (schedule pothole_onna) — a fixed room is wrong for part of the day
      room: 5207  # fallback when Trader Onna is not spawned
    description: "You found the school hall. Next, kit yourself out at Coulee Provisions, Trader Onna's shop. First see what she sells."
    hint: "From the school hall go south four times to Hub Square, south again to Market Row, then east into Coulee Provisions. There, type list."
  # list: inserted 2026-10-17 (one command per step). A player saved on
  # `school` is told to list; one saved on `shop` or later is past it.
  - id: list
    destination: anywhere
    description: "Onna's wares are laid out. Buy a cotton shirt. You start with coin to spare."
    hint: "Type buy cotton shirt."
  - id: shop
    destination: anywhere
    description: "You bought a cotton shirt. Now put it on. Gear does nothing folded in your pack."
    hint: "Type equip cotton shirt."
  - id: equip
    description: "You are dressed for the coulee. Now put your head into The Drowned Lantern, the town's inn."
    hint: "The Drowned Lantern is the inn off Market Row. From Coulee Provisions go west twice. Walking in is enough."
  - id: lantern
    destination:
      mob: 9106  # follow Crier Toke (schedule pothole_toke) — a fixed room is wrong for part of the day
      room: 5203  # fallback when Crier Toke is not spawned
    description: "You have seen the school, kitted out at the shop, and found the inn. Report back to Crier Toke in Hub Square."
    hint: "From the inn go east to Market Row, then north to Hub Square. Find Toke at the notice post, type talk toke, and choose Find Your Footing to finish."
  - id: end
    description: "You know the hub now. Toke says the coulee mouths are next, whenever you are ready. He can send you down any of the seven."
    hint: "Talk to Crier Toke when you want to push outward. He offers each of the seven trails."

rewards:
  gold: 20
  actor: >-
    Toke presses a small purse into your palm with his upper mouth still
    talking and the lower one already calling the next notice.

triggers:
  # ── SCHOOL HALL: arrive (room 5213) ─────────────────────
  - event: room_enter
    room: 5213
    conditions:
      has: [31-start]
      missing: [31-school]
    actions:
      - grant: 31-school
      - actor: >-
          A tutor glances up from a slate as you enter. "Newly Opened.
          When the changes start and you want to know what is happening to
          you, this hall is where you come." Next, go to Coulee Provisions,
          south past Hub Square to Market Row and then east, and type list.

  # ── PROVISIONS: list Onna's wares (room 5207), teaches `list` ──
  #    list sends `command` only when a merchant was actually listed.
  - event: command
    command: list
    room: 5207
    conditions:
      has: [31-school]
      missing: [31-list]
    actions:
      - grant: 31-list
      - actor: >-
          Trader Onna watches you weigh her wares. "The cotton shirt keeps the
          chill off and the coulee's teeth out. You have coin enough." Type
          buy cotton shirt.

  # ── PROVISIONS: buy a cotton shirt (room 5207) — teaches `buy` ──
  #    item_gain fires when the shirt lands in the pack; a route-2 player
  #    starts with no gear, so the first cotton shirt they gain is this purchase.
  - event: item_gain
    item: 20008
    conditions:
      has: [31-list]
      missing: [31-shop]
    actions:
      - grant: 31-shop
      - actor: >-
          Trader Onna nods as the coin changes hands. "A shirt won't turn a
          blade, but it beats bare skin. Put it on. Gear does nothing folded
          in your pack." Type equip cotton shirt.

  # ── EQUIP: wear the shirt — teaches `equip` ──
  #    item: the cotton shirt (20008) only; the equip event names its item.
  - event: command
    command: equip
    item: 20008
    conditions:
      has: [31-shop]
      missing: [31-equip]
    actions:
      - grant: 31-equip
      - actor: >-
          You settle the shirt across your shoulders. That is the whole of it:
          buy the gear, wear the gear, and the coulee bites a little less.
          Next, find The Drowned Lantern: from Coulee Provisions go west twice.

  # ── THE DROWNED LANTERN: arrive (room 5205) ─────────────
  - event: room_enter
    room: 5205
    conditions:
      has: [31-equip]
      missing: [31-lantern]
    actions:
      - grant: 31-lantern
      - actor: >-
          The keeper of the Drowned Lantern tips you a nod as you step in.
          "First one is on the house -- the coulee's welcome. Rest while it
          is still being gentle with you." Now go back to Crier Toke in Hub
          Square, east and then north, and type talk toke.

  # The 31-end trigger that granted all seven trail quests at once (and the
  # cudgel, sling and shot with them) is gone (owner ruling R21, #375 phase
  # 1): no quest is handed out in a batch. Crier Toke offers each of the
  # seven trails (32, 35, 38, 41, 44, 47, 50) as its own topic after 31-end,
  # and each starter item rides on the offer of the quest it belongs to.
