questid: 83
name: Secret of the Thornwall Harness
description: >-
  Veyra has shared her secret recipe for the Thornwall Harness. Gather the
  materials, craft the parts by your own hand, and bring them to her
  stations to be quenched and set.
steps:
  - id: start
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Veyra has shared the recipe. Gather the reagents and
      craft the parts by your own hand."
  - id: end
    description: "The Thornwall Harness is made."
triggers:
  # Veyra's teach_ node charges the price in the dialogue itself, in the
  # same step as the gold check, and only then grants this token. This
  # trigger teaches the recipes.
  - event: quest_granted
    quest_token: "83-start"
    actions:
      - learn_recipe: {recipe: "barbed-spike-plates"}
      - learn_recipe: {recipe: "anti-corrosion-quench"}
      - learn_recipe: {recipe: "assemble-thornwall-harness"}
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Paid. The recipes are yours. Set the
                spikes even and quench them slow. A wall that cannot
                hold its edge is just a fence."}

  - event: item_gain
    item: 40186
    conditions:
      has: ["83-start"]
      missing: ["83-end"]
    actions:
      - grant: "83-end"
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "It will not yield first. Stand your
                ground, and let it do the arguing."}
