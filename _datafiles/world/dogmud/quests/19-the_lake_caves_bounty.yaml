questid: 19
name: The Lake-Caves Bounty
description: Constable Drunn has posted a bounty on the lake-cave creatures
  spilling into the shallows. Clear the shrimp swarms and the drowned hunters,
  then return to the constabulary for further instructions. Bringing back a
  leviathan tooth from the sump dweller pays the full reward.
secret: false

flags:
  - key: completion
    values: [partial, full]
    description: "Whether the player closed the bounty for the partial payment
      after signing, or pushed for the boss kill and brought back the tooth"

steps:
  - id: start
    map_target: 4121  # Cave Mouth — sole entrance to the cave system (down -> 4127)
    description: "Constable Drunn has posted a bounty on the lake-cave creatures.
      Clear the shallows of shrimp swarms, deal with at least one drowned
      hunter, then come back to the constabulary for further instructions.
      The cave mouth is past the boat pier, north of the Fishing Docks."
    hint: "Bring a light: the caves are dark. From the Constabulary, go
      west to North Square, south twice to Lakefront Square, east twice
      to the Lake-View Promenade, and north twice to the Net Yard. Go
      east, north and east to the Cave Mouth, then down into the
      Dripping Antechamber. Skitter-shrimp swarms gather there. Type
      attack swarm."
  - id: shrimp
    map_target: 4128  # Pool Chamber — first room a Drowned Hunter (mob 331) can hold
    description: "You have cleared a swarm of skitter-shrimp from the cave
      shallows. The fishing nets will hold longer."
    hint: "A drowned hunter lurks deeper in the caves. From the Dripping
      Antechamber, go north into the Pool Chamber. Type attack hunter."
  - id: hunter
    map_target: 4110  # fallback when Constable Drunn is not spawned
    map_target_mob: 335  # follow Constable Drunn (maxwander 2) — a fixed room is wrong for part of the day
    description: "You have killed a drowned hunter. The shallows are
      meaningfully safer."
    hint: "Report to Constable Drunn at the Constabulary, on the east
      side of North Square. Type talk drunn."
  - id: signed
    map_target: -1  # -1: bundled objectives, rooms [4110, 4116]; Phase 2 split review
    description: "Drunn has signed the upgraded bounty. The constabulary will
      pay handsomely for proof that the deepest threat in the sump has been
      put down, but the warrant is now yours to pursue or to walk away
      from. Either way you have earned the smaller payment."
    hint: "For the full reward, kill the sump dweller in the Hollow Sump,
      north of the Pool Chamber, and bring back its tooth. Dock Master
      Arn at the Fishing Docks pays for the tooth too. To report, with
      the tooth or without it, type talk drunn."
  - id: end
    description: "The lake-caves bounty is closed. The shallows are safer.
      The lake-folk owe you a quiet round at the inn."

rewards:
  actor: "The lake-caves bounty is closed. A purse changes hands."
  observer: "is paid out the lake-caves bounty."
  gold: 150
  rep_faction: stillwater_guards
  rep_amount: 15

triggers:
  # ── SHRIMP: kill a skitter shrimp swarm (mob 330) ──
  - event: mob_death
    mob: 330
    conditions:
      has: ["19-start"]
      missing: ["19-shrimp"]
    actions:
      - grant: "19-shrimp"
      - actor: "The skitter-shrimp swarm has been broken. The lake-folk's
          nets will hold longer for it."

  # ── HUNTER: kill a drowned hunter (mob 331) ──
  - event: mob_death
    mob: 331
    conditions:
      has: ["19-start"]
      missing: ["19-hunter"]
    actions:
      - grant: "19-hunter"
      - actor: "The drowned hunter is dead. The shallows are meaningfully
          safer."

  # ── END (FULL): give leviathan tooth to Drunn ──
  # Baseline 150g comes from the rewards block; the give_gold here is the
  # full-path bonus on top, bringing the full reward to 500g total.
  # consume_item suppresses give.go's behavior-tree fallthrough so the
  # noncombat_questgiver archetype's "declines politely" emote does not
  # fire after the quest engine accepts the tooth.
  - event: item_give
    mob: 335
    item: 40054
    conditions:
      has: ["19-signed"]
      missing: ["19-end"]
    actions:
      - consume_item: 40054
      - grant: "19-end"
      - set_flag:
          key: "19-completion"
          value: "full"
      - give_gold: 350
      - npc_say:
          mob: 335
          lines:
            - {delay: 1, text: "By the lake. So there really WAS something
                down there."}
            - {delay: 4, text: "I had half-decided that thing was a story
                the dock-drunks made up. Stillwater owes you for this."}
            - {delay: 8, text: "Drinks at the Pike & Lantern are on the
                constabulary tonight. Tell Sigrid I sent you."}

  # ── END (FULL): give leviathan tooth to Arn ──
  # Same full-path bonus as Drunn's path — 350g on top of the 150g baseline.
  # consume_item suppresses behavior-tree fallthrough — see Drunn note.
  - event: item_give
    mob: 342
    item: 40054
    conditions:
      has: ["19-signed"]
      missing: ["19-end"]
    actions:
      - consume_item: 40054
      - grant: "19-end"
      - set_flag:
          key: "19-completion"
          value: "full"
      - give_gold: 350
      - npc_say:
          mob: 342
          lines:
            - {delay: 1, text: "I will be damned. There really WAS one."}
            - {delay: 4, text: "I have not got Drunn's purse, but the
                dockmen keep a fund for things like this. Take it."}
            - {delay: 7, text: "And -- thank you. For the men I sent down
                there before I knew what was waiting."}
