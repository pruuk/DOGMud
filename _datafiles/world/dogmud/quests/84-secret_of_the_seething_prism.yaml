questid: 84
name: Secret of the Seething Prism
description: >-
  Veyra has shared her secret recipe for the Seething Prism. Gather the
  materials, craft the parts by your own hand, and bring them to her
  stations to be contained.
steps:
  - id: start
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Veyra has shared the recipe. Gather the reagents and
      craft the parts by your own hand."
  - id: end
    description: "The Seething Prism is made."
triggers:
  # Veyra's teach_ node charges the price in the dialogue itself, in the
  # same step as the gold check, and only then grants this token. This
  # trigger teaches the recipes.
  - event: quest_granted
    quest_token: "84-start"
    actions:
      - learn_recipe: {recipe: "containment-lattice"}
      - learn_recipe: {recipe: "nutrient-suspension"}
      - learn_recipe: {recipe: "assemble-seething-prism"}
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Paid. The recipes are yours. Contain it
                properly, or it will grow past whatever you built to
                hold it."}

  - event: item_gain
    item: 40187
    conditions:
      has: ["84-start"]
      missing: ["84-end"]
    actions:
      - grant: "84-end"
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "...it's still growing. Good. That means
                the lattice took. Mind where you set it down."}
