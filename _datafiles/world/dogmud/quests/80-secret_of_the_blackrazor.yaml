questid: 80
name: Secret of the Blackrazor
description: >-
  Veyra has shared her secret recipe for The Blackrazor. Gather the
  materials, craft the parts by your own hand, and forge the blade at her
  stations.
steps:
  - id: start
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Veyra has shared the recipe. Gather the reagents and
      forge the parts by your own hand."
  - id: end
    description: "The Blackrazor is made."
triggers:
  # Veyra's teach_ node charges the price in the dialogue itself, in the
  # same step as the gold check, and only then grants this token. This
  # trigger teaches the recipes.
  - event: quest_granted
    quest_token: "80-start"
    actions:
      - learn_recipe: {recipe: "hungering-guard"}
      - learn_recipe: {recipe: "obsidian-edge-resin"}
      - learn_recipe: {recipe: "assemble-the-blackrazor"}
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Paid. The recipes are in your hands.
                Forge it at my stations when you are ready."}

  - event: item_gain
    item: 40183
    conditions:
      has: ["80-start"]
      missing: ["80-end"]
    actions:
      - grant: "80-end"
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "...it holds. Take it, before it gets
                ideas."}
