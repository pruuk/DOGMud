questid: 32
name: First Blood
description: A cudgel, a training dummy, and Drillmaster Vorn's Drill Yard.
  Learn the basics of combat there before you take your bruises somewhere
  they can kill you.
secret: false

# One command per step, in order (owner ruling 2026-10-17). Each trigger
# gates on the step before it. Step ids start, wield, strike, special,
# consider and verbosity are what saved characters hold, so each keeps its
# place in the order. wield was inserted between start and strike, so a
# player saved on start is told to wield and resumes.
#
# Consider comes first, before the fight (owner 2026-10-19): sized_up was
# inserted after wield. The old consider step (after special) is no longer
# granted; it stays so a player saved on it resumes, and the verbosity step
# gates on special, which a player on consider also holds.
steps:
  - id: start
    map_target: 5227
    description: "You were given a cudgel. Hold it in your hand
      before you fight. If you already hold it, type remove cudgel, then
      wield it again."
    hint: "Type wield cudgel."
  - id: wield
    map_target: 5227
    description: "The cudgel is in your hand. Before you fight, size up the
      training dummy in the Drill Yard. From Hub Square, go north to the
      Awakening Pool, then east four times to the Drill Yard. Crier Toke
      knows the way too: ask toke yard."
    hint: "From Hub Square, go north, then east four times to the Drill
      Yard. Consider tells you how hard a foe is before you fight it. Type
      consider dummy."
  - id: sized_up
    map_target: 5227
    description: "You sized up the training dummy. Consider tells you how
      dangerous a foe is before you start a fight. Now fight the dummy
      until it falls."
    hint: "Type attack dummy."
  - id: strike
    map_target: 5227
    description: "You beat the training dummy. A new dummy stands up in the
      yard after a short wait. Now try a special move on it: a kick hits
      hard, and a trip (trip dummy) puts it on the ground. Either one
      counts."
    hint: "Type kick dummy."
  - id: special
    map_target: 5227
    description: "You used a special move. Kicks and trips cost stamina,
      so use them when they help most. Next, choose how much combat detail
      you see: full shows every swing, medium shows only the hits, and
      light shows one line a round."
    hint: "Combat verbosity sets how much fight text you see. Type set
      combatverbosity full. For more, type help combatverbosity."
  # No longer granted (see the note above steps); kept for saved players.
  - id: consider
    map_target: 5227
    description: "You sized up the training dummy. Consider tells you how
      dangerous a foe is before you start a fight. Next, choose how much
      combat detail you see: full shows every swing, medium shows only the
      hits, and light shows one line a round."
    hint: "Combat verbosity sets how much fight text you see. Type set
      combatverbosity full. For more, type help combatverbosity."
  - id: verbosity
    map_target: 5227
    description: "You chose your combat detail. You can change it at any
      time. The Drill Yard has taught you what it can."
    hint: "Drillmaster Vorn waits in the Drill Yard. Type ask vorn report."
  - id: end
    description: "Drillmaster Vorn has signed off on your first fight. Go
      north to the Sparring Circle, east three times to the Lower Wash,
      then south to Squatter's Hollow, where Caravan Guard Garve waits."

rewards:
  gold: 15
  skillinfo: "weapon-combat:1"
  actor: >-
    Vorn turns your performance over in his head for a long moment,
    the way a smith eyes a finished blade for flaws. Then he nods
    once, short, like it costs him something. "Passable. You did not
    freeze, you did not panic, and you remembered to think between
    swings. That is more than most manage on the first day." He
    presses a few coins into your hand. "Go north, then east along
    the wash. Find Garve. He will put that edge to use."
  observer: "Vorn nods at {actor} with a gruff, brief approval."

triggers:
  # ── WIELD: the cudgel (10043); the equip event names its item ──
  - event: command
    command: equip
    item: 10043
    conditions:
      has: ["32-start"]
      missing: ["32-wield"]
    actions:
      - grant: "32-wield"
      - actor: "The cudgel sits in your hand. Before you fight, size up
          the training dummy: type consider dummy."

  # ── CONSIDER, before the fight ────────────────────────
  # event: command: consider sends it only once its target resolves, so
  # `consider dummy` while the dummy is down does not count.
  - event: command
    command: consider
    conditions:
      has: ["32-wield"]
      missing: ["32-sized_up"]
    actions:
      - grant: "32-sized_up"
      - actor: "Now you know what you face. Fight it: type attack dummy."

  # ── DUMMY DEFEATED (mob 9109) ─────────────────────────
  - event: mob_death
    mob: 9109
    conditions:
      has: ["32-sized_up"]
      missing: ["32-strike"]
    actions:
      - grant: "32-strike"
      - actor: "The training dummy shudders and goes still. Your arms
          remember the rhythm of it: weight, angle, follow through. A new
          dummy stands up soon. When it does, type kick dummy."

  # ── SPECIAL MOVE: kick or trip ────────────────────────
  # event: command, not command_issued. kick and trip send `command` only
  # once the move resolves against a target (a hit or a miss; a trip on a
  # target already on the ground also counts), so a refused move ("no
  # target", not enough stamina, on cooldown) does not finish the step.
  # This depends on the training dummy standing back up promptly after the
  # 32-strike kill (the room 5227 respawn fix, 2026-10-17): the dummy is
  # fragile, and a player who arrives here while it is still down has
  # nothing to kick until it returns.
  - event: command
    command: kick
    conditions:
      has: ["32-strike"]
      missing: ["32-special"]
    actions:
      - grant: "32-special"
      - actor: "That is a special move. Now choose how much combat detail
          you see: type set combatverbosity full."

  - event: command
    command: trip
    conditions:
      has: ["32-strike"]
      missing: ["32-special"]
    actions:
      - grant: "32-special"
      - actor: "That is a special move. Now choose how much combat detail
          you see: type set combatverbosity full."

  # ── COMBATVERBOSITY ───────────────────────────────────
  # Reached via `set combatverbosity`, which fires a logical
  # "combatverbosity" command event (set.go). Gates on special, so a player
  # saved on the old consider step (after special) resumes here too.
  - event: command
    command: combatverbosity
    conditions:
      has: ["32-special"]
      missing: ["32-verbosity"]
    actions:
      - grant: "32-verbosity"
      - actor: "Your combat detail is set. Report to Drillmaster Vorn: type
          ask vorn report."
