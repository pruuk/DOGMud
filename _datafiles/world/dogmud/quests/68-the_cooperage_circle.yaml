questid: 68
name: The Cooperage Circle
description: >-
  Orin the bookseller asks the wrong questions about the city's founding,
  and he is not the only one. A shuttered cooperage in the quarter still
  has someone tending its tools. The bloodline means to seize it. What you
  do about that is yours to decide.
secret: false

flags:
  - key: allegiance
    values: [circle, bloodline]
    description: "Whether the player aided the cooperage circle or reported
      it to the bloodline domestic"

steps:
  - id: start
    destination:
      mob: 9338  # follow Toby the Cooper's Lad (schedule np_crafting_toby), a fixed room is wrong for part of the day
      room: 5719  # fallback when Toby the Cooper's Lad is not spawned
    description: >-
      Orin asked you to visit the shuttered cooperage and find Toby, to see
      whether anyone still tends the place, and bring back proof.
    hint: >-
      The Abandoned Cooperage is north of Craftwell Square, up the lane from
      the Inkwalk. Find Toby. Type talk toby.
  - id: evidence
    destination:
      room: 5720
    description: >-
      Toby keeps the cooperage's tools oiled and its master's bench-mark
      clean, and gave you a rubbing of it. He says Edvar's hidden survey is
      under a loose floorboard by the cot: the pre-founding map the
      bloodline would seize the place to bury. Clerk Vell has filed to take
      the cooperage as derelict.
    hint: >-
      Edvar's survey is under a loose floorboard by the cot, on the Cooperage
      Floor north of the front. Type search there.
  # Granted by a search of the Cooperage Floor. Orin's choice needs it.
  - id: survey
    destination:
      mob: 9332  # follow Orin the Bookseller (schedule np_crafting_orin)
      room: 5706  # fallback when Orin the Bookseller is not spawned
    description: >-
      Under the floorboard you found Edvar's survey, a torn quarter of a map
      far older than the city's own records. Orin needs to see it.
    hint: >-
      Orin's Bookstall is off the Inkwalk, south of Craftwell Square. Type
      talk orin.
  # The choice is made in talk (spec R28, owner 2026-10-21): Orin takes the
  # circle's side, Clerk Vell the bloodline's. Each first explains what the
  # player is signing up for, and neither choice can be undone.
  - id: choice
    destination:
      mob: [9332, 9349]  # Orin (the circle) or Clerk Vell (the bloodline) takes the survey (owner ruling 16)
    description: >-
      Orin laid out the choice: stand with the circle and leave Edvar's
      survey in its keeping, or take the survey to Clerk Vell and be paid
      for it. Whichever you choose is final.
    hint: >-
      Orin will tell you what standing with the circle means. Clerk Vell, in
      the Permit Office, takes the survey for the bloodline. Neither can be
      undone. Type talk orin.
  - id: end
    description: >-
      The matter of the cooperage is settled, one way or the other.

rewards:
  actor: ""
  observer: ""

triggers:
  # evidence: hearing Toby the Cooper's Lad's "q68_toby" topic, which gives
  # the bench-mark rubbing.
  - event: topic_heard
    mob: 9338
    topic: q68_toby
    conditions:
      has: ["68-start"]
      missing: ["68-evidence"]
    actions:
      - grant: "68-evidence"

  # choice: hearing Orin the Bookseller's "q68_choice" topic.
  - event: topic_heard
    mob: 9332
    topic: q68_choice
    conditions:
      has: ["68-survey"]
      missing: ["68-choice"]
    actions:
      - grant: "68-choice"

  # LOST survey, and old saves at 68-choice that never lifted the board. First,
  # so one search gives one survey.
  - event: command
    command: search
    room: 5720
    conditions:
      has: ["68-survey"]
      missing: ["68-end"]
      missing_item: 40113
    actions:
      - give_item: 40113
      - actor: >-
          You lift the loose floorboard by the cot, quietly. Edvar's survey is
          back in its oilcloth where someone returned it, or another quarter of
          it is. You ease it free.
      - observer: "{actor} works a loose floorboard free and lifts something wrapped in oilcloth."

  # SURVEY: a search of the Cooperage Floor finds it, Toby asleep beside it or not.
  - event: command
    command: search
    room: 5720
    conditions:
      has: ["68-evidence"]
      missing: ["68-survey"]
    actions:
      - give_item: 40113
      - grant: "68-survey"
      - actor: >-
          A floorboard by the cot sits proud of its neighbors, as Toby said. You
          keep your hands quiet. Beneath it, wrapped in oilcloth against the damp,
          is a torn quarter of a survey in an old, exact hand: Edvar's work. You
          ease it free and pocket it.
      - observer: "{actor} works a loose floorboard free and lifts something wrapped in oilcloth."
