questid: 68
name: The Cooperage Circle
description: >-
  Orin the bookseller asks the wrong questions about the city's founding,
  and he is not the only one. A shuttered cooperage in the quarter still
  has someone tending its tools. The bloodline means to seize it. What you
  do about that is yours to decide.
secret: false

flags:
  - key: allegiance
    values: [circle, bloodline]
    description: "Whether the player aided the cooperage circle or reported
      it to the bloodline domestic"

steps:
  - id: start
    map_target: 5719  # fallback when Toby the Cooper's Lad is not spawned
    map_target_mob: 9338  # follow Toby the Cooper's Lad (schedule np_crafting_toby) — a fixed room is wrong for part of the day
    description: >-
      Orin asked you to visit the shuttered cooperage and find Toby, to see
      whether anyone still tends the place, and bring back proof.
    hint: >-
      From Orin's Bookstall, go west to the Inkwalk, then north twice to the
      Abandoned Cooperage. Toby keeps it by day. Type talk toby.
  - id: evidence
    map_target: 5720
    description: >-
      Toby keeps the cooperage's tools oiled and its master's bench-mark
      clean, and gave you a rubbing of it. He says Edvar's hidden survey is
      under a loose floorboard by the cot: the pre-founding map the
      bloodline would seize the place to bury. Clerk Vell has filed to take
      the cooperage as derelict.
    hint: >-
      Edvar's survey is under a loose floorboard by the cot. From the
      cooperage front, go north onto the Cooperage Floor. Type look
      floorboard.
  # Inserted 2026-10-21 (#375 batch 4): the evidence step needed two
  # commands (look floorboard, then talk orin), so the survey is its own
  # step. Granted by the floorboard triggers; Orin's choice needs it.
  - id: survey
    map_target: 5706  # fallback when Orin the Bookseller is not spawned
    map_target_mob: 9332  # follow Orin the Bookseller (schedule np_crafting_orin)
    description: >-
      Under the floorboard you found Edvar's survey, a torn quarter of a map
      far older than the city's own records. Orin needs to see it.
    hint: >-
      From the Cooperage Floor, go south three times to the Inkwalk, then
      east into Orin's Bookstall. Type talk orin.
  # The choice is made in talk (spec R28, owner 2026-10-21): Orin takes the
  # circle's side, Clerk Vell the bloodline's. Each first explains what the
  # player is signing up for, and neither choice can be undone.
  - id: choice
    map_target: -1  # -1: bundled objectives, rooms [5706, 5817]; Phase 2 split review
    description: >-
      Orin laid out the choice: stand with the circle and leave Edvar's
      survey in its keeping, or take the survey to Clerk Vell and be paid
      for it. Whichever you choose is final.
    hint: >-
      Orin will tell you what standing with the circle means. Clerk Vell, in
      the Permit Office in the Merchant Quarter, takes the survey for the
      bloodline. Hear both out before you choose: neither can be undone.
      Type talk orin.
  - id: end
    description: >-
      The matter of the cooperage is settled, one way or the other.

rewards:
  actor: ""
  observer: ""

triggers:
  # Edvar's map-fragment: under the loose floorboard on the cooperage floor (5720).
  # The nouns here were `loose-floorboard` and `old-guild-mark`, which no
  # player could guess; they are now `floorboard` and the room's own key
  # `old guild mark`, and triggers 4 to 9 add the other spellings and the
  # survey step's catch-up. Since 2026-10-21 (spec R28) the mark only
  # describes; the choice is made in talk (Orin 9332, Clerk Vell 9349).
  - event: room_interact
    room: 5720
    noun: floorboard
    conditions:
      has: ["68-evidence"]
      missing: ["68-end"]
      missing_item: 40113
    actions:
      - give_item: 40113
      - grant: "68-survey"
      - actor: >-
          A floorboard by the cot sits proud of its neighbors. Beneath it,
          wrapped in oilcloth against the damp, is a torn quarter of a survey
          in an old, exact hand: Edvar's work, the map Toby said was hidden
          here. You ease it free and pocket it.
      - observer: "{actor} works a loose floorboard free and lifts something wrapped in oilcloth."

  # loose floorboard, before Toby's word
  - event: room_interact
    room: 5720
    noun: floorboard
    conditions:
      missing: ["68-evidence"]
    actions:
      - actor: >-
          One floorboard near the cot sits a little proud of the rest. Prying
          up the floor of an occupied workshop without a reason is the kind of
          thing that ends a welcome before it starts. You leave it.

  # Guild mark while the choice is open (5719). This trigger made the
  # circle choice until 2026-10-21; under spec R28 the choice is made in
  # talk with Orin (or Vell), so the mark only describes.
  - event: room_interact
    room: 5719
    noun: old guild mark
    conditions:
      has: ["68-choice"]
      missing: ["68-end"]
    actions:
      - actor: >-
          The cooper's guild mark, a stave and hammer, is painted beside
          the door, the paint cracked and lifting. Re-cut, it would tell any
          clerk this is a working shop. Whether that happens is the circle's
          to decide, and Orin speaks for the circle.

  # guild mark, before the choice
  - event: room_interact
    room: 5719
    noun: old guild mark
    conditions:
      missing: ["68-choice"]
    actions:
      - actor: >-
          The cooper's guild mark, a stave and hammer, is painted beside
          the door in faded paint. Re-cutting it would be a real act with real
          consequences. You do not yet have a reason to.

  # ── loose floorboard, the room's full noun: same as triggers 0 and 1 ──
  - event: room_interact
    room: 5720
    noun: loose floorboard
    conditions:
      has: ["68-evidence"]
      missing: ["68-end"]
      missing_item: 40113
    actions:
      - give_item: 40113
      - grant: "68-survey"
      - actor: >-
          A floorboard by the cot sits proud of its neighbors. Beneath it,
          wrapped in oilcloth against the damp, is a torn quarter of a survey
          in an old, exact hand: Edvar's work, the map Toby said was hidden
          here. You ease it free and pocket it.
      - observer: "{actor} works a loose floorboard free and lifts something wrapped in oilcloth."

  - event: room_interact
    room: 5720
    noun: loose floorboard
    conditions:
      missing: ["68-evidence"]
    actions:
      - actor: >-
          One floorboard near the cot sits a little proud of the rest. Prying
          up the floor of an occupied workshop without a reason is the kind of
          thing that ends a welcome before it starts. You leave it.

  # ── SURVEY catch-up: a save at 68-evidence that already took the survey
  #    (before the survey step existed) moves on when it looks again ──
  - event: room_interact
    room: 5720
    noun: floorboard
    conditions:
      has: ["68-evidence"]
      missing: ["68-survey"]
      has_item: 40113
    actions:
      - grant: "68-survey"
      - actor: >-
          The board is loose and the space beneath it is empty. You already
          have Edvar's survey. Take it to Orin.

  - event: room_interact
    room: 5720
    noun: loose floorboard
    conditions:
      has: ["68-evidence"]
      missing: ["68-survey"]
      has_item: 40113
    actions:
      - grant: "68-survey"
      - actor: >-
          The board is loose and the space beneath it is empty. You already
          have Edvar's survey. Take it to Orin.

  # ── guild mark, the short noun: same as triggers 2 and 3 (describes only;
  #    the choice is made in talk, spec R28) ──
  - event: room_interact
    room: 5719
    noun: guild mark
    conditions:
      has: ["68-choice"]
      missing: ["68-end"]
    actions:
      - actor: >-
          The cooper's guild mark, a stave and hammer, is painted beside
          the door, the paint cracked and lifting. Re-cut, it would tell any
          clerk this is a working shop. Whether that happens is the circle's
          to decide, and Orin speaks for the circle.

  - event: room_interact
    room: 5719
    noun: guild mark
    conditions:
      missing: ["68-choice"]
    actions:
      - actor: >-
          The cooper's guild mark, a stave and hammer, is painted beside
          the door in faded paint. Re-cutting it would be a real act with real
          consequences. You do not yet have a reason to.
