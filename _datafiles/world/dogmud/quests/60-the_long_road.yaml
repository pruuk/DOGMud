questid: 60
name: The Long Road
description: A sealed dispatch must travel the length of the road from the
  northern toll to the gates of New Plymouth, passed hand to hand up the
  official post relay, from ferry agent to tithe-clerk to gate.
secret: false

steps:
  - id: start
    map_target: 5409
    description: "Toller Garrick hands you a sealed dispatch bound for New
      Plymouth when you take this on. Carry it north to Severin Pell, the ferry
      agent at Hartcharn, who handles the first stage of the post relay."
    hint: "Follow the road north from the Tollgate, past the Lake & Ladle
      and through the Empty Reach, to the South Gate of Hartcharn. From
      there, go north twice to the Market Square, then west to the Ferry
      and Coach Agent. Type talk pell."
  - id: waybill
    map_target: 5445
    description: "Severin Pell counter-signed the dispatch and made out a
      manifest. Carry it onward to Tithe-Clerk Verrold at Kingsbarrow Vale,
      who must enter it in the capital's ledger."
    hint: "From the Ferry and Coach Agent, go east to the Market Square
      and follow the road north out of Hartcharn, over the Greywater ford,
      to Kingsbarrow Vale. At the Tithe Road, go west into the Great Tithe
      Barn. Type talk verrold."
  - id: manifest
    map_target: 5471
    description: "Verrold entered the manifest in the tithe ledger and sealed
      it into a capital packet. Deliver it to the East Gate guard at New
      Plymouth, the last leg of the road."
    hint: "From the Great Tithe Barn, go east to the Tithe Road, then north
      until the road ends at the East Gate of New Plymouth. Type talk guard."
  - id: end
    description: "You delivered the dispatch the length of the road, from the
      northern toll to the gates of the capital."

rewards:
  actor: "The guard breaks the seal, scans the packet, and marks the gate
    ledger with a short nod. The brass token he pressed into your hand is
    stamped with the tower and three waves of New Plymouth: the mark of a
    courier who carried the capital's word the length of the road."
  observer: "The East Gate guard takes the sealed packet, checks its seal
    against the gate ledger, and logs it in."
  gold: 150

triggers:
  # waybill: hearing Severin Pell's "pellhandoff" topic, which takes the
  # dispatch and gives the manifest (moved from the topic's grantsQuest,
  # #375 phase 3b).
  - event: topic_heard
    mob: 9182
    topic: pellhandoff
    conditions:
      has: ["60-start"]
      missing: ["60-waybill"]
    actions:
      - grant: "60-waybill"

  # manifest: hearing Tithe-Clerk Verrold's "verroldhandoff" topic, which
  # takes the manifest and gives the sealed packet (moved from the topic's
  # grantsQuest, #375 phase 3b).
  - event: topic_heard
    mob: 9198
    topic: verroldhandoff
    conditions:
      has: ["60-waybill"]
      missing: ["60-manifest"]
    actions:
      - grant: "60-manifest"
