# Quest 50, First Shot (Pothole Coulee, archery line, quest 1 of 3)
#
# Token flow (#375 phase 7, one action per step, giver to giver):
#   50-start:      granted by Crier Toke's send_range offer (9106), after
#                  31-end; the offer hands over a sling (givesItem 10038). It
#                  is the only starter since #375 phase 7. A quest_granted
#                  trigger below hands over a pouch of shot (30064) unless the
#                  player already carries one.
#   50-met:        topic_heard on Marksman Iden's shoot_lesson topic (9161).
#   50-equip:      command trigger on `equip` of the sling (item 10038).
#   50-shoot:      command trigger on `fire` at the practice butt (9163) on the
#                  Long Terrace (5351). Gated on 50-equip, so the steps run in
#                  order (the one-action rule; the old gate on 50-start let a
#                  fire skip the equip step). The trigger names the butt
#                  (target: mob, mob: 9163): a shot at nothing is refused
#                  before the quest hears of it, and a shot at anyone else
#                  must not count. A shot that misses counts too, because the
#                  event goes out when the shot resolves, so no line below
#                  promises a hit.
#   50-ambush:     command trigger on `sneak` at the Long Terrace: take cover.
#                  Sneak raises its event only when the player ends up hidden.
#   50-cover_shot: command trigger on `fire` at the butt once hidden.
#   50-end:        granted by Iden's shoot_turnin hand-in (needs 50-cover_shot).
#
# The butt falls to a stone or two and a fresh one is hauled out 5 rounds
# later (room 5351 spawninfo), so the shot hints say to wait for it.
#
# A player who already holds the sling in hand at the equip step takes it
# off (`remove sling`) and readies it again: Toke hands the sling over before
# Iden is met, equip reads only the pack, and nothing checks an early equip.
# Every line at the met step says so (see quest 32's wield step).
#
# Every character can sneak from creation (initAllSkills seeds every skill at
# rank 1).
#
# Saved characters: start, equip, shoot, ambush and cover_shot keep their
# ids; quest progress is ordered, so a player saved on equip or later counts
# as having met Iden. A player saved on start now hears Iden first, and a fire
# at the butt before the sling step no longer counts.

questid: 50
name: First Shot
description: >-
  Marksman Iden keeps the shooting terraces above the coulee, where the
  bluff-folk learn to reach out and touch a thing from across a distance.
  Ready your sling and send a stone at the straw butt at the end of the
  range.
secret: false

steps:
  - id: start
    destination:
      mob: 9161
    description: >-
      Crier Toke hands you a sling when you take this on and sends you to
      Marksman Iden, who keeps the shooting terraces up the bluff.
    hint: >-
      From Hub Square, go north, east, east, north, up, north, north and up
      to the Firing Range. Type talk iden.
  - id: met
    destination: anywhere
    description: >-
      Iden wants the sling ready in your hand before anything else, and she
      wants to see you do it. If it is already in your hand, use remove
      sling to put it back in your pack, then use equip sling.
    hint: >-
      Type equip sling. If it is already in your hand, that will not work:
      first use remove sling to put it back in your pack.
  - id: equip
    destination:
      room: 5351
    description: >-
      The sling is in your hand. The practice butt stands down-range on the
      Long Terrace, east of Marksman Iden on the Firing Range.
    hint: >-
      Go east from the Firing Range to the Long Terrace and type fire butt.
      If no butt stands there, wait a moment for a fresh butt.
  - id: shoot
    destination:
      room: 5351
    description: >-
      You loosed a stone at the butt, and the sling readied itself without
      being told. Iden wants you to try it once more from cover.
    hint: >-
      Type sneak.
  - id: ambush
    destination:
      room: 5351
    description: >-
      You are out of sight. A shot taken from cover lands far harder than one
      the target saw coming, and it gives your place away when it lands.
    hint: >-
      Type fire butt. If no butt stands, wait a moment for a fresh butt.
  - id: cover_shot
    destination:
      mob: 9161
    description: >-
      You shot from cover and felt the difference. Marksman Iden is waiting
      on the Firing Range, west of the Long Terrace.
    hint: >-
      Go west to Marksman Iden and type talk iden.
  - id: end
    description: >-
      Iden has named your eye sound. When you are ready, she will send you on
      to Scout Bryn at the Canyon Mouth.

rewards:
  skillinfo: "ranged-combat:1"
  gold: 15
  actor: >-
    Iden watches your last stone fly down the range and gives a single nod.
    "There. A sling readies itself while your eye is still on the mark, so the
    only thing you have to think about is the mark. And you have the other
    half already: a shot from cover lands like nothing else, and it works
    once, because afterward they know where you are. The eye is the thing that
    matters now, the eye and never the arm. Keep the sling and the shot. They
    are yours." She tips her head north, toward the canyon mouth. "When you are
    ready, I will send you up to Bryn. He will show you how to put a shot into
    something a whole room away, before it ever knows you are there."
  observer: "Marksman Iden nods as the newcomer's last stone flies down the range."

triggers:
  # SHOT: a pouch to feed the sling, unless the player already has one.
  - event: quest_granted
    quest_token: 50-start
    conditions:
      missing_item: 30064
    actions:
      - give_item: 30064

  # MET: hearing Iden's lesson.
  - event: topic_heard
    mob: 9161
    topic: shoot_lesson
    conditions:
      has: ["50-start"]
      missing: ["50-met"]
    actions:
      - grant: "50-met"
      - actor: >-
          Iden has your measure. Ready the sling: type equip sling. If it is
          already in your hand, first use remove sling.

  # EQUIP: ready the sling (only the sling, item 10038, counts).
  - event: command
    command: equip
    item: 10038
    conditions:
      has: ["50-met"]
      missing: ["50-equip"]
    actions:
      - grant: "50-equip"
      - actor: >-
          The sling settles in your hand. Go to the Long Terrace, east of the
          Firing Range, and type fire butt.

  # FIRST SHOT: loosed at the practice butt down-range (5351). A miss counts.
  - event: command
    command: fire
    room: 5351
    target: mob
    mob: 9163
    conditions:
      has: ["50-equip"]
      missing: ["50-shoot"]
    actions:
      - grant: "50-shoot"
      - actor: >-
          The stone leaves the sling and flies at the butt. Your hand has
          already found another. Iden calls down the range: "Now again, from
          where it cannot see you coming. Type sneak."

  # AMBUSH: take cover.
  - event: command
    command: sneak
    room: 5351
    conditions:
      has: ["50-shoot"]
      missing: ["50-ambush"]
    actions:
      - grant: "50-ambush"
      - actor: >-
          You settle out of sight behind the butts. Type fire butt and see
          what a shot is worth when nothing is expecting it. If the butt is
          down, wait a moment for a fresh butt.

  # COVER SHOT: the shot that follows the sneak. A miss counts.
  - event: command
    command: fire
    room: 5351
    target: mob
    mob: 9163
    conditions:
      has: ["50-ambush"]
      missing: ["50-cover_shot"]
    actions:
      - grant: "50-cover_shot"
      - actor: >-
          That shot left from cover. Go west to Marksman Iden and type talk
          iden.
