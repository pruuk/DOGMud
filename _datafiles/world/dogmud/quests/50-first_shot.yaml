# Quest 50 — First Shot (Pothole Coulee, Spoke G / Ranged inner ring, cert)
#
# Token flow (one command per step, owner ruling 2026-10-17):
#   50-start      — granted by Marksman Iden's shoot_offer node (requires 30-end),
#                   which also hands the player a sling (givesItem 10038), or by
#                   Crier Toke's quest 31 send-off. A quest_granted trigger
#                   below hands over a pouch of shot (30064) unless the player
#                   already carries one (Toke's send-off gives one).
#   50-equip      — command trigger on `equip` of the sling (item 10038).
#   50-shoot      — command trigger on `fire` at the Long Terrace (5351): loose a
#                   stone at the practice butt (9163).
#   50-ambush     — command trigger on `sneak` at the Long Terrace: take cover.
#   50-cover_shot — command trigger on `fire` at the Long Terrace once hidden:
#                   the shot from cover.
#   50-end        — granted by Iden's shoot_turnin node (needs 50-cover_shot).
#
# Design: teach the ranged loop, which is ONE verb: equip a ranged weapon and
# `fire`. The weapon readies its own next round, so there is no reload beat to
# teach, and the freed beat teaches the ambush instead: the part of ranged
# worth knowing, which nothing else in the game points at.
#
# The ambush used to be one step that asked for sneak AND a second shot, and
# its hint asked for both. It is now two steps, each with one command. The
# command event carries only the command NAME, so the engine cannot tell a
# shot from cover from any other shot; the cover-shot step is simply the shot
# that follows the sneak step. Sneak sends its `command` event only when the
# player ends up hidden (skill.skullduggery.sneak.go).
#
# The fire at the start of the range is gated on 50-start, not on 50-equip,
# so a player who already wields the sling (an older save, or one who equipped
# it before asking) is never held on the equip step: the shot counts.
#
# Every character can sneak from creation: initAllSkills seeds every skill at
# rank 1. The practice butt dies to a stone or two and respawns after 5 rounds
# (room 5351 spawninfo), so two students sharing the range do not wait long.
# ranged-combat is a Perception skill; the cert seeds the first rank.
#
# Mid-quest saves: start, shoot and ambush keep their ids. A player saved on
# `shoot` is asked to sneak; one saved on `ambush` is asked for the shot from
# cover, which the turn-in now needs.

questid: 50
name: First Shot
description: >-
  Marksman Iden keeps the shooting terraces above the coulee, where the
  bluff-folk learn to reach out and touch a thing from across a distance.
  Ready your sling and put a stone into the straw butt at the end of the
  range.
secret: false

steps:
  - id: start
    map_target: 5350
    description: >-
      You have a sling and a pouch of shot. First, ready the sling.
      Marksman Iden keeps the range.
    hint: >-
      Type equip sling.
  - id: equip
    map_target: 5351
    description: >-
      The sling is in your hand. The practice butt stands down-range on the
      Long Terrace, east of Marksman Iden.
    hint: >-
      Go east to the Long Terrace and type fire butt.
  - id: shoot
    map_target: 5351
    description: >-
      You put a stone into the butt, and the sling readied itself without
      being told. Iden wants you to try it once more from cover.
    hint: >-
      Type sneak.
  - id: ambush
    map_target: 5351
    description: >-
      You are out of sight. A shot taken from cover lands far harder than one
      the target saw coming, and it gives your place away when it lands.
    hint: >-
      Type fire butt.
  - id: cover_shot
    map_target: 5350
    description: >-
      You shot from cover and felt the difference. Marksman Iden is waiting
      on the Firing Range, west of the Long Terrace.
    hint: >-
      Go west to Marksman Iden and type ask iden done.
  - id: end
    description: >-
      Iden has named your eye sound. Scout Bryn, at the Canyon Mouth, will
      teach you to shoot a thing you cannot reach with your hands. From the
      Firing Range, go east twice to the High Terrace, then north.

rewards:
  skillinfo: "ranged-combat:1"
  gold: 15
  actor: >-
    Iden watches the stone bury itself in the straw and gives a single nod.
    "There. A sling readies itself while your eye is still on the mark, so the
    only thing you have to think about is the mark. And you have the other
    half already: a shot from cover lands like nothing else, and it works
    once, because afterward they know where you are. The eye is the thing that
    matters now. Not the arm -- the eye. Keep the sling and the shot; they are
    yours." She tips her head north, toward the canyon mouth. "Bryn holds the
    slot below the raider bluffs. He will show you the next part -- how to put
    a shot into something a whole room away, before it ever knows you are
    there."
  observer: "Marksman Iden nods as the newcomer's shot finds the straw."

triggers:
  # ── SHOT: a pouch to feed the sling, unless the player already has one ──
  # Fires on the grant from either road in (Iden's offer or Toke's quest 31
  # send-off). Toke's send-off gives the pouch in the same action list, before
  # this chained trigger runs, so missing_item keeps it to one pouch.
  - event: quest_granted
    quest_token: 50-start
    conditions:
      missing_item: 30064
    actions:
      - give_item: 30064

  # ── EQUIP: ready the sling ─────────────────────────────────────────────
  # item: the equip event names what was put on, so only the sling (10038)
  # counts; a wielded cudgel used to finish this step (2026-10-17).
  - event: command
    command: equip
    item: 10038
    conditions:
      has: ["50-start"]
      missing: ["50-equip"]
    actions:
      - grant: "50-equip"
      - actor: >-
          The sling settles in your hand, a stone already in its cradle. Go
          east to the Long Terrace and type fire butt.

  # ── FIRST SHOT: loose at the practice butt down-range (5351) ───────────
  - event: command
    command: fire
    room: 5351
    conditions:
      has: ["50-start"]
      missing: ["50-shoot"]
    actions:
      - grant: "50-shoot"
      - actor: >-
          The stone leaves the sling and strikes the straw with a solid thud.
          Your hand has already found another and settled it in the cradle.
          Iden calls down the range: "Now again, from where it cannot see you
          coming. Once the butt is down, type sneak."

  # ── AMBUSH: take cover ─────────────────────────────────────────────────
  - event: command
    command: sneak
    room: 5351
    conditions:
      has: ["50-shoot"]
      missing: ["50-ambush"]
    actions:
      - grant: "50-ambush"
      - actor: >-
          You settle out of sight behind the butts. The sling is already
          loaded, because it loaded itself. Type fire butt and see what a
          shot is worth when nothing is expecting it.

  # ── COVER SHOT: the shot that follows the sneak ────────────────────────
  - event: command
    command: fire
    room: 5351
    conditions:
      has: ["50-ambush"]
      missing: ["50-cover_shot"]
    actions:
      - grant: "50-cover_shot"
      - actor: >-
          The stone takes the butt dead center, harder than any shot before
          it. Go west to Marksman Iden and type ask iden done.
