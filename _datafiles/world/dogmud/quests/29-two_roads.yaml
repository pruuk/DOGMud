# Quest 29: Two Roads (Pothole Coulee, post-rite signpost). RETIRED.
#
# Retired by owner ruling R17 (2026-10-20, #375 phase 1): Cleric Hadwen
# grants no quest from his rite tree, and this signpost is replaced by two
# quests he offers after the rite, Toke's Road (88) and Esk's Road (89).
# Nothing grants 29-start any more.
#
# The file stays because saved characters hold 29 tokens (quest 29 shipped
# in July 2026; local saves checked 2026-10-21 hold both 29: start and
# 29: end). A player saved on 29-start can still finish it: every road out
# grants 29-end through the triggers below, so nobody is left holding it.
#
# Token flow (holders only):
#   29-end: granted when the player commits to a road: accepting Toke's
#            footing walk (31-start), accepting either replacement road (88
#            or 89), or arriving in Thornwall (room 468) through the arch.

questid: 29
name: Two Roads
description: >-
  The pool has opened you. Two roads lead on from Pothole Coulee -- learn the
  town with Crier Toke, or leave through Warden Esk's arch. Choose one.
secret: false

steps:
  - id: start
    map_target: 5203  # fallback when Crier Toke is not spawned
    map_target_mob: 9106  # follow Crier Toke (schedule pothole_toke) — a fixed room is wrong for part of the day
    description: >-
      Freshly Opened, you stand at a fork. Crier Toke waits in Hub Square, just
      south of the pool, ready to teach you the town. That is the road for
      anyone new to Gaius. The other road leaves the coulee at once: Warden Esk
      keeps the arch in the Threshold House, south from Hub Square through
      Market Row, and he can send you out to the wider world. Either road is
      yours.
    hint: >-
      New to Gaius? From the pool go south to Hub Square, find Crier Toke at
      the notice post, and type talk toke.
  - id: end
    description: >-
      You have chosen your road out of the coulee.

triggers:
  # ── TOKE'S ROAD: accepting Toke's footing walk grants 31-start, which
  #    fires quest_granted, closing the signpost.
  - event: quest_granted
    quest_token: 31-start
    conditions:
      has: [29-start]
      missing: [29-end]
    actions:
      - grant: 29-end
  # ── THE REPLACEMENT ROADS: accepting either of Hadwen's road offers.
  - event: quest_granted
    quest_token: 88-start
    conditions:
      has: [29-start]
      missing: [29-end]
    actions:
      - grant: 29-end
  - event: quest_granted
    quest_token: 89-start
    conditions:
      has: [29-start]
      missing: [29-end]
    actions:
      - grant: 29-end
  # ── ESK'S ROAD: passing through the arch into Thornwall (468) closes it.
  #    Every way in raises it: the arch transits (Esk's behavior tree 9107
  #    and the room tree 5215) are move_player teleports, which raise
  #    room_enter like a walk does (#619).
  - event: room_enter
    room: 468
    conditions:
      has: [29-start]
      missing: [29-end]
    actions:
      - grant: 29-end
