# Quest 57 — Tending the Grove (Pothole Coulee, Spoke E repeatable)
#
# Token flow:
#   57-start — granted by Keeper Orrin's dialogue (grove_loop_offer node).
#              Requires 46-end (The Unfolded). Repeatable with cooldown.
#   57-end   — mob_death trigger on Drift-Wisp (9147). Player kills it by
#              casting. Auto-grants reward + clears for repeat. Orrin is not
#              there when it lands, so no text sends the player back to him.
#              Nearest wisp: the Grove Edge (5308), south of Orrin (5309).

questid: 57
name: Tending the Grove
description: >-
  Orrin says the grove needs tending -- warped things drift back in
  whenever the watch slips. Go clear one out; the practice is as
  important as the clearing.
secret: false
repeatable: true
cooldown_rounds: 300

steps:
  - id: start
    map_target: 5308  # the Grove Edge, where a drift-wisp spawns
    description: >-
      Orrin has asked you to go into the grove and put down one of
      the veil-warped things that wanders back in. The task is done
      the moment the drift-wisp falls.
    hint: >-
      If it is dark, type cast glow first. Go south to the Grove Edge and
      type cast spike wisp until it falls.
  - id: end
    description: >-
      The grove is quiet again for now. Orrin will have more work
      when the watch slips.

rewards:
  gold: 6
  skillinfo: "spellcasting:1"
  actor: >-
    The grove goes still around you, and for a moment every edge
    arrives on time. The fold held clean. Orrin will have more work
    when the warped things drift back in. They always drift back in.
  observer: >-
    The grove settles around the caster, as if it approves of the
    stillness.

triggers:
  - event: mob_death
    mob: 9147
    conditions:
      has: ["57-start"]
      missing: ["57-end"]
    actions:
      - grant: "57-end"
      - actor: >-
          The drift-wisp unravels and is gone. The grove is a little
          quieter, and the task is done.
