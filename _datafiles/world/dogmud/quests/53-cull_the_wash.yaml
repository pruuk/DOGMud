# Quest 53 — Cull the Wash (Pothole Coulee, Spoke A repeatable)
#
# Token flow (one command per step, in order; owner ruling 2026-10-17):
#   53-start     — granted by Caravan Guard Garve's dialogue (cull_offer node).
#                  Requires 34-end (Take the Tower). Repeatable with cooldown.
#   53-firstkill — mob_death trigger on Bandit Scout (9110). Requires 53-start.
#   53-end       — mob_death trigger on Bandit Squatter (9111). Requires
#                  53-firstkill. The quest completes on this kill, wherever
#                  it happens: there is no turn-in at Garve. Completion
#                  grants the reward and clears progress for the repeat.

questid: 53
name: Cull the Wash
description: >-
  Garve always has more work clearing bandits out of the wash. Kill a
  bandit scout, then a bandit squatter. The job is done the moment the
  squatter falls, and the pay comes to you then.
secret: false
repeatable: true
cooldown_rounds: 300

steps:
  - id: start
    destination:
      room: 5232  # Lower Wash, north of Squatter's Hollow: Bandit Scout (mob 9110)
    description: >-
      Garve has asked you to thin out the bandits in the wash again: a
      bandit scout first, then a bandit squatter. The nearest scout is in
      the Lower Wash, just north of Squatter's Hollow.
    hint: >-
      Go north from Squatter's Hollow to the Lower Wash and type attack
      scout. If it is dark, type cast glow first.
  - id: firstkill
    destination:
      room: 5235  # Cracked Cistern: Bandit Squatter (mob 9111)
    description: >-
      One bandit scout is down. Now the bandit squatter, in the Cracked
      Cistern east of Squatter's Hollow. The job is done when it falls.
    hint: >-
      From Squatter's Hollow, go east to the Cracked Cistern and type
      attack squatter.
  - id: end
    description: >-
      You thinned the wash again. Garve will have more work after a
      while.

rewards:
  gold: 6
  skillinfo: "weapon-combat:1"
  actor: >-
    The wash is quiet for now. Garve's pay finds its way to you: a few
    coins, and a surer hand with your weapon. He will have more work
    after a while.
  observer: ""

triggers:
  - event: mob_death
    mob: 9110
    conditions:
      has: ["53-start"]
      missing: ["53-firstkill"]
    actions:
      - grant: "53-firstkill"
      - actor: >-
          One scout down. Now the squatter: from Squatter's Hollow, go
          east to the Cracked Cistern and type attack squatter.

  - event: mob_death
    mob: 9111
    conditions:
      has: ["53-firstkill"]
      missing: ["53-end"]
    actions:
      - grant: "53-end"
      - actor: >-
          The squatter drops. The wash is clear for now, and Garve's job
          is done.
