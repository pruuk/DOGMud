# Quest 92, Report to Toke (Brewing) (Pothole Coulee, brewing line bridge).
#
# Fenwalker Falv (9129) offers it (report_brewing_offer) once Heart of the
# Mire (40) is handed in. Crier Toke (9106) takes the hand-in
