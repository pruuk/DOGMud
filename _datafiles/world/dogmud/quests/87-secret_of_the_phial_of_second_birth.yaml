questid: 87
name: Secret of the Phial of Second Birth
description: >-
  Veyra has shared her secret recipe for the Phial of Second Birth. Gather
  the materials, craft the base by your own hand, and bring it to her
  stations to be finished.
# Sold once, like the other eight secrets. The recipes it teaches are kept,
# so a player crafts further phials without buying the secret again.
steps:
  - id: start
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Veyra has shared the recipe. Gather the reagents and
      craft the base by your own hand."
  - id: end
    description: "The Phial of Second Birth is made."
triggers:
  # Veyra's teach_ node charges the price in the dialogue itself, in the
  # same step as the gold check, and only then grants this token. This
  # trigger teaches the recipes.
  - event: quest_granted
    quest_token: "87-start"
    actions:
      - learn_recipe: {recipe: "reduction-base"}
      - learn_recipe: {recipe: "assemble-phial-of-second-birth"}
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Paid. The recipes are yours. Reduce it
                slow. Rush the base and there is no second birth in it,
                only ash."}

  - event: item_gain
    item: 40181
    conditions:
      has: ["87-start"]
      missing: ["87-end"]
    actions:
      - grant: "87-end"
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "...it breathes. Whatever dies to fill it
                will not stay dead long. Use it with care."}
