questid: 72
name: The Water Dispute
description: >-
  Two farms at Amber Valley's dry edge are at each other's throats over the
  water that once fed them both. The channel between them has been cut, and
  each man blames the other. Someone from outside might see it clearer.
secret: false

flags:
  - key: outcome
    values: [mediated, restored, fenn]
    description: "How the water dispute was settled: a brokered compromise,
      the source restored for both, or by the letter of the old water-right"
  # Added 2026-10-23 (#375 batch 7, spec R28): the choice moved into talk
  # with Hesper (9397). These four only record what the player has learned;
  # each unlocks one of her warning topics, and the choice is made there.
  - key: heard-fenn
    values: ["yes"]
    description: "The player heard Marrow Fenn's side for Hesper (9400)"
  - key: heard-ayres
    values: ["yes"]
    description: "The player heard Ayres' side for Hesper (9401)"
  - key: channel
    values: [found]
    description: "The player looked over the collapsed channel (6078)"
  - key: record
    values: [read]
    description: "The player read the old water-right in the records (6060)"

steps:
  # Owner ruling 15 (2026-10-28, #375 phase 4): one conversation per step,
  # in a fixed order. Hear Fenn, then Ayres, then settle it with Hesper.
  # The channel (6078) and the records (6060) stay optional finds.
  - id: start
    destination: {mob: 9400}
    description: >-
      Amber Valley's two dryside farms are feuding over a cut irrigation
      channel. Hesper at the Golden Bough wants you to hear Marrow Fenn's
      side first.
    hint: >-
      From the Golden Bough, go west twice to the Market Square, then south
      six times to the Irrigation Head-Gate. Fenn's holding is east of it.
      Type talk fenn.
  - id: heard_fenn
    destination: {mob: 9401}
    description: >-
      You have heard Marrow Fenn out. Now hear Ayres, who holds the upstream
      ground where the water comes into the valley.
    hint: >-
      Ayres' holding is west of the Irrigation Head-Gate. From Fenn's
      holding, go west twice. Type talk ayres.
  - id: heard_ayres
    destination: {mob: 9397}
    description: >-
      You have heard both farmers. Go back to Hesper at the Golden Bough and
      find a way to settle it.
    hint: >-
      From Ayres' holding, go east, north six times, then east twice to the
      Golden Bough. Type talk hesper. The records at the Rite pavilion and
      the fallen channel in the foothills may help.
  - id: end
    description: >-
      The water dispute is settled, one way or another. The valley's dry
      edge has its answer.

rewards:
  gold: 60
  actor: >-
    Word of the settling runs the valley before you have even left the lane.
    Whatever was decided, the shouting at the Golden Bough will quiet now,
    and that alone has earned you a place at its hearth.
  observer: >-
    The traveller has the settled look of someone who has untangled a thing
    that stayed knotted for a long time.

triggers:
  # THE FALLEN CHANNEL (6078). Until 2026-10-23 this trigger made the
  # "restored" choice. Under spec R28 the look only discovers it: it sets
  # 72-channel, and Hesper (9397) explains the cost and makes the choice.
  # Kept at this index.
  - event: room_interact
    room: 6078
    noun: the collapsed channel
    conditions:
      has: ["72-start"]
      missing: ["72-end"]
    actions:
      - set_flag: {key: "72-channel", value: "found"}
      - actor: >-
          You climb the slide and look it over. A whole span of the old
          aqueduct lies buried under fallen rock and slumped earth. Above it
          the water stands brimming and blocked; below it the bed runs dry
          all the way down to the farms. Neither man cut this channel. The
          hill did. It is far too much stone for one back, but a valley
          turned out with ropes could clear it in a day, and then the water
          would run down to both farms at once. Hesper at the Golden Bough
          could call them out.
      - observer: "{actor} climbs over the slide of fallen stone across the old aqueduct, studying it."

  # THE OLD WATER-RIGHT (6060). Until 2026-10-23 this trigger made the
  # "fenn" choice. Under spec R28 the look only discovers it: it sets
  # 72-record, and Hesper (9397) explains the cost and makes the choice.
  # Kept at this index.
  - event: room_interact
    room: 6060
    noun: the records
    conditions:
      has: ["72-start"]
      missing: ["72-end"]
    actions:
      - set_flag: {key: "72-record", value: "read"}
      - actor: >-
          The old water-right is here among the ceremony rolls, dated and
          witnessed in a careful hand: the head-gate share was set to feed
          both holdings, turn and turn about. By the letter of it, Ayres has
          taken more than his due for years. It is not a kind answer. It is
          the true one, and it favours Fenn. Hesper at the Golden Bough
          would know what reading it aloud would do to the valley.

  # heard_fenn: hearing Marrow Fenn's "q72_side" topic (owner ruling 15,
  # #375 phase 4; the topic still sets 72-heard-fenn).
  - event: topic_heard
    mob: 9400
    topic: q72_side
    conditions:
      has: ["72-start"]
      missing: ["72-heard_fenn"]
    actions:
      - grant: "72-heard_fenn"

  # heard_ayres: hearing Ayres' "q72_side" topic, offered only once Fenn is
  # heard (owner ruling 15; the topic still sets 72-heard-ayres).
  - event: topic_heard
    mob: 9401
    topic: q72_side
    conditions:
      has: ["72-heard_fenn"]
      missing: ["72-heard_ayres"]
    actions:
      - grant: "72-heard_ayres"

  # The three endings are Hesper Vane's hand-in topics (9397): each grants
  # 72-end and sets 72-outcome. The reward block above fires on 72-end
  # whichever ending completed it.
