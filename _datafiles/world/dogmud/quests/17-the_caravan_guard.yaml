questid: 17
name: The Caravan Guard
description: A caravan master at the crossroads village needs the
  bandits camped just off the north road dealt with. Their leader,
  Soren, wears an iron pin on his collar.
secret: false

flags:
  # One value since the owner removed the crate ending (2026-10-23).
  - key: resolution
    values: [combat]
    description: "How the player resolved the bandit problem"

steps:
  - id: start
    destination:
      room: 4052  # Bandit Camp: Soren (mob 286)
    description: "The caravan master has asked you to deal with
      the bandits on the north road and bring back their leader's
      iron pin as proof."
    hint: "The bandits camp just west of the north road. From the
      village square, go north once, then west into the Bandit Camp.
      Kill their leader, Soren. He carries an iron pin; pick it up
      when he falls and bring it back to the caravan master in the
      village square. Type talk caravan."
  - id: end
    description: "The bandit situation has been resolved."

rewards:
  gold: 40
