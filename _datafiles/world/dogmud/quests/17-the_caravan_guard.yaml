questid: 17
name: The Caravan Guard
description: A caravan master at the crossroads village needs the
  bandits camped just off the north road dealt with. Their leader,
  Soren, wears an iron pin on his collar.
secret: false

flags:
  # "diplomacy" is no longer set by anything once Task 15 step 4 lands the
  # converted dialogue (owner 2026-10-23 removed the crate ending). The
  # shipped old-format 281/286 still set it until then, and the boot flag
  # validator panics without it; drop it after step 4.
  - key: resolution
    values: [combat, diplomacy]
    description: "How the player resolved the bandit problem"

steps:
  - id: start
    map_target: 4052  # Bandit Camp: Soren (mob 286)
    description: "The caravan master has asked you to deal with
      the bandits on the north road and bring back their leader's
      iron pin as proof."
    hint: "The bandits camp just west of the north road. From the
      village square, go north once, then west into the Bandit Camp.
      Kill their leader, Soren. He carries an iron pin; pick it up
      when he falls and bring it back to the caravan master in the
      village square. Type talk caravan."
  - id: end
    description: "The bandit situation has been resolved."

rewards:
  gold: 40

triggers:
  # Task 16 deletes this trigger (the hand-in is 281 pinhandoff). The
  # Letter of Introduction (item 51) was removed from the quest by the
  # owner, 2026-10-23.
  - event: item_give
    mob: 281
    item: 54
    conditions:
      has: [17-start]
      missing: [17-end]
    actions:
      - grant: 17-end
      - set_flag:
          key: "17-resolution"
          value: "combat"
      - consume_item: 54
      - npc_say:
          mob: 281
          lines:
            - {delay: 1, text: "Soren's pin. So he is done."}
            - {delay: 3, text: "The road is ours again, and you have
                earned your pay."}
