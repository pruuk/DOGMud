questid: 13
name: The Prospector's Gambit
description: You have chosen to help Geomancer Rhett extract windstone
  from the ridge. The crystal could advance healing magic and protect
  Thornwall. Siding with Rhett locked The Warden's Covenant.
secret: false
steps:
  - id: start
    destination:
      room: 3030  # travel to Rhett at the Ridge Approach
    description: "Tell Geomancer Rhett at the Ridge Approach when you
      are ready to help him begin the windstone extraction."
    hint: "Tell Rhett you are ready to hold the brace. He camps at the
      Ridge Approach: from the Old Citadel Plaza at Thornwall's eastern
      edge, go east seven times. Type talk rhett."
  - id: extraction
    # destination inferred from triggers (#375 p4); was: return-to-giver / in-place (start room 3030); Phase 2 split review
    description: "Assist Rhett with the delicate extraction process.
      The crystal must be removed without shattering."
    hint: "Hold the brace for Rhett at the Ridge Approach, then tell
      him it held. Type talk rhett."
  - id: end
    description: "The extraction is complete. Rhett has the windstone
      he needs."
rewards:
  actor: "Rhett grins broadly, cradling the extracted crystal
    like a newborn. He disappears into his work for hours, and when
    he emerges, he holds a shield of pale blue crystal: the
    Windstone Aegis, forged in gratitude."
  observer: "Rhett emerges from his camp, grinning, and presents
    a shield of pale blue crystal to his companion."
  gold: 15
  itemid: 20053
triggers:
  # extraction: hearing Geomancer Rhett's "extraction_begin" topic (moved
  # from the topic's grantsQuest, #375 phase 3b).
  - event: topic_heard
    mob: 242
    topic: extraction_begin
    conditions:
      has: ["13-start"]
      missing: ["13-extraction"]
    actions:
      - grant: "13-extraction"
