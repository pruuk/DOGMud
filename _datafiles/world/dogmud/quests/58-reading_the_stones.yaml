# Quest 58 — Reading the Stones (Pothole Coulee, Spoke F repeatable)
#
# Token flow:
#   58-start — granted by Hermit Sere's dialogue (stones_loop_offer node).
#              Requires 49-end (The Old Shrine). Repeatable with cooldown.
#   58-end: a `verb: search` room_interact on the Reliquary floor (5343),
#              the feature quest 49's disc is tucked into (#375 phase 3a).
#              Requires 58-start. Auto-grants reward + clears for repeat.
#              There is no report back (2026-10-17): the hint, Sere's offer
#              and the reward lines all say the search finishes it, and the
#              reward plays in the Reliquary, where Sere is not.

questid: 58
name: Reading the Stones
description: >-
  Sere believes the shrine still has things to teach anyone patient
  enough to listen. She wants you to go back to the Reliquary and
  read what the stones have to say. The reading is the whole of it:
  the stones finish the lesson themselves.
secret: false
repeatable: true
cooldown_rounds: 300

steps:
  - id: start
    map_target: 5343
    description: >-
      Sere has asked you to go back to the Reliquary and search the
      old stones again. The search itself completes the reading.
    hint: >-
      From the Old Shrine, go west into the Collapsed Nave and north
      into the Reliquary, then type search floor.
  - id: end
    description: >-
      You read the stones again. Sere will have more for you when the
      shrine is ready to give it.

rewards:
  gold: 6
  skillinfo: "rhetoric:1"
  actor: >-
    You sit back on your heels in the quiet of the Reliquary and let
    what the stones showed you settle. It is not quite what they said
    last time. Sere was right: very old places keep speaking, and the
    words shift with the listener. Come again when you have the
    patience for it.
  observer: >-
    {actor} kneels by the cracked floor, quiet, as though listening to
    something no one else can hear.

triggers:
  - event: room_interact
    verb: search
    noun: floor
    room: 5343
    conditions:
      has: ["58-start"]
      missing: ["58-end"]
    actions:
      - grant: "58-end"
      - actor: >-
          The stones give up a little more than they did before --
          not much, but something. The mark at the center of the
          disc catches your eye again, unchanged and patient.
