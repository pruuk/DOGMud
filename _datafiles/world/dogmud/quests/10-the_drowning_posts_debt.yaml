questid: 10
name: The Drowning Post's Debt
description: Tavern keeper Marek is being squeezed between city taxes and protection
  money demanded by back-alley thugs. A non-combat quest that opens a future sewer
  dungeon hook through the tavern's cellar.
secret: false

steps:
  - id: start
    map_target: 473  # fallback when Guard Captain Velk is not spawned
    map_target_mob: 94  # follow Guard Captain Velk (schedule thornwall_guard_captain) — a fixed room is wrong for part of the day
    description: "Tavern keeper Marek at the Drowning Post hands you a protection
      notice when you take this on, as evidence of the racket squeezing his
      business. Take it to Guard Captain Velk at the barracks."
    hint: "Take the protection notice to Guard Captain Velk. From the
      Drowning Post, go north twice, then west twice, then north into the
      barracks. Type talk velk."
  - id: report
    map_target: 472  # fallback when Tavern Keeper Marek is not spawned
    map_target_mob: 96  # follow Tavern Keeper Marek (schedule thornwall_tavern_keeper) — a fixed room is wrong for part of the day
    description: "Guard Captain Velk has seen the evidence and will act on it.
      Return to Marek with the good news."
    hint: "Go back to Marek at the Drowning Post tavern and type talk
      marek."
  - id: end
    description: "Marek's protection problem is in the hands of the city guard.
      The tax debt remains, but at least one boot is off his neck. The cellar,
      however, has its own secrets."

rewards:
  actor: "Marek pours you a drink on the house, the good stuff, from
    the bottle he keeps behind the keg. 'The guard cannot fix the taxes, but at
    least I will not have to pay two masters. That is something.' He glances
    toward the cellar stairs. 'While you were gone, I heard noises down there
    again. Something in the old drainage tunnels beneath the city. I have been
    meaning to look, but...' He trails off. 'Another time, perhaps. For now,
    drink.'"
  observer: "Marek pours a drink with visible relief, some of the tension
    leaving his shoulders."
  gold: 10
  itemid: 28
  rep_faction: thornwall_citizens
  rep_amount: 15
