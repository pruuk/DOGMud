questid: 81
name: Secret of the Wayfarer's Bottomless Pack
description: >-
  Veyra has shared her secret recipe for the Wayfarer's Bottomless Pack.
  Gather the materials, craft the parts by your own hand, and bring them
  to her stations to be stitched together.
steps:
  - id: start
    map_target: -1  # action step (command/skill) — no travel destination
    description: "Veyra has shared the recipe. Gather the reagents and
      craft the parts by your own hand."
  - id: end
    description: "The Wayfarer's Bottomless Pack is made."
triggers:
  # Veyra's teach_ node charges the price in the dialogue itself, in the
  # same step as the gold check, and only then grants this token. This
  # trigger teaches the recipes.
  - event: quest_granted
    quest_token: "81-start"
    actions:
      - learn_recipe: {recipe: "reinforced-frame"}
      - learn_recipe: {recipe: "spatial-stitching"}
      - learn_recipe: {recipe: "assemble-wayfarers-pack"}
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Paid. The recipes are yours. Cut the
                frame square. A pack that fails you three roads from
                home is worse than none at all."}

  - event: item_gain
    item: 40184
    conditions:
      has: ["81-start"]
      missing: ["81-end"]
    actions:
      - grant: "81-end"
      - npc_say:
          mob: 9584
          lines:
            - {delay: 1, text: "Light on the shoulder, deep in the belly.
                It will carry more than it should and never complain.
                Safe roads."}
