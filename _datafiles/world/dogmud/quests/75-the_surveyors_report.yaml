questid: 75
name: The Surveyor's Report
description: >-
  Brennan, the university's old field man, is certain that the surveyor
  Reth saw something in the eastern country and filed a report designed
  to say nothing. He has sent you to read that survey in the university
  Archive, the one that calls a site a mineral deposit in three lines
  where a careful surveyor would write pages, and then to bring back
  whatever you find to earn an introduction to Reth himself, who lives
  retired at the quiet end of the residential streets.
secret: false

steps:
  - id: start
    destination:
      room: 6303
    description: "Brennan has set you to read the survey Reth filed on the
      eastern country, the one that says nothing."
    hint: "Reth's filed survey lies on the reading stand in the university
      Archive, south of the Reading Room. Type look filed survey."
  - id: survey
    destination:
      mob: 9516  # follow Brennan the Surveyor (schedule gf_brennan) — a fixed room is wrong for part of the day
      room: 6305  # fallback when Brennan the Surveyor is not spawned
    description: "You found Reth's filed survey: a mineral deposit entry,
      strangely empty, from a man who saw something out there and chose
      not to write it down."
    hint: "Take what you saw back to Brennan. From the Archive, go north to
      the Reading Room, west to the Cloister Walk, then west into Brennan's
      Office. He sleeps at his desk late at night. Type talk brennan."
  - id: intro
    destination:
      mob: 9524  # follow Reth (schedule gf_reth), a fixed room is wrong for part of the day
      room: 6315  # fallback when Reth is not spawned
    description: "Brennan, convinced, has given you his word to take to
      Reth, who lives retired at the quiet end of the residential streets."
    hint: "Take Brennan's word to Reth at the Blue Door end of College Row. Type talk reth."
  - id: notes
    destination:
      mob: 9516  # follow Brennan the Surveyor (schedule gf_brennan)
      room: 6305  # fallback when Brennan the Surveyor is not spawned
    description: "Reth has told you what he saw and given you his marked map:
      a route east, and a warning that whatever is out there is not natural.
      Brennan should hear it."
    hint: "Take Reth's account back to Brennan at the university. Type talk brennan."
  - id: end
    description: "You have Reth's map, and Brennan knows what his old friend
      would not write down. The thread runs east, into the broken highland
      country, to the thing he would not name."

rewards:
  actor: >-
    You carry a retired surveyor's directions to a place he would not name.
    The road runs east into the highland country, older and stranger than
    the university's quiet maps. Whatever Reth saw out there and chose not
    to write down is still out there, waiting in the broken hills.
  observer: ""
  gold: 0

triggers:
  # ── The filed survey (6303, the Archive) -- gated: has 75-start, missing 75-survey ──
  - event: room_interact
    room: 6303
    noun: filed-survey
    conditions:
      has: ["75-start"]
      missing: ["75-survey"]
    actions:
      - grant: "75-survey"
      - actor: >-
          You read the survey the way someone looking for what is not said
          would read it. The site is classified as a mineral deposit in
          three lines. A survey of that site, with elevations, material
          samples and seasonal access, would ordinarily run to a page or
          more. This one does not. The entry is formal and correct and
          stops exactly where the detail should get louder. Reth saw
          something out there, and he filed a paper that buries it.
          Time to take this back to Brennan.
      - observer: "{actor} reads the thin filed survey with sudden, careful attention."
  # ── Ungated fallback: no 75-start ──
  - event: room_interact
    room: 6303
    noun: filed-survey
    conditions:
      missing: ["75-start"]
    actions:
      - actor: >-
          An old survey filed under the eastern country, dry and
          technical. Without a reason to read it closely, it is only
          a brief, dull entry.

  # ── Intro: hearing Brennan the Surveyor's "turnin" topic (moved from the
  #    topic's grantsQuest, #375 phase 3b) ──
  - event: topic_heard
    mob: 9516
    topic: turnin
    conditions:
      has: ["75-survey"]
      missing: ["75-intro"]
    actions:
      - grant: "75-intro"

  # ── Reth's account: hearing his testimony topic gives the map. The item
  #    moves before the grant, so a pack too heavy for it holds the step. ──
  - event: topic_heard
    mob: 9524
    topic: testimony
    conditions:
      has: ["75-intro"]
      missing: ["75-notes"]
    actions:
      - give_item: 40160
      - grant: "75-notes"
      - bump_rep: {faction: margin, delta: 20}
      - actor: >-
          Reth takes a folded map from the table and holds it out without
          looking at it: his own hand, a route inked in red, a circled waymark,
          elevation ticks. No name for what is at the end of it.
      - observer: "Reth hands {actor} a folded map."
