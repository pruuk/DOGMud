questid: 75
name: The Surveyor's Report
description: >-
  Brennan, the university's old field man, is certain that the surveyor
  Reth saw something in the eastern country and filed a report designed
  to say nothing. He has sent you to read that survey in the university
  Archive, the one that calls a site a mineral deposit in three lines
  where a careful surveyor would write pages, and then to bring back
  whatever you find to earn an introduction to Reth himself, who lives
  retired at the quiet end of the residential streets.
secret: false

steps:
  - id: start
    map_target: 6303
    description: "Brennan has set you to read the survey Reth filed on the
      eastern country, the one that says nothing."
    hint: "Reth's filed survey lies on the reading stand in the university
      Archive. From Brennan's Office, go east to the Cloister Walk, east to
      the Reading Room, then south into the Archive. Type look filed survey."
  - id: survey
    map_target: 6305  # fallback when Brennan the Surveyor is not spawned
    map_target_mob: 9516  # follow Brennan the Surveyor (schedule gf_brennan) — a fixed room is wrong for part of the day
    description: "You found Reth's filed survey: a mineral deposit entry,
      strangely empty, from a man who saw something out there and chose
      not to write it down."
    hint: "Take what you saw back to Brennan. From the Archive, go north to
      the Reading Room, west to the Cloister Walk, then west into Brennan's
      Office. He sleeps at his desk late at night. Type talk brennan."
  - id: intro
    map_target: 6315  # fallback when Reth is not spawned
    map_target_mob: 9524  # follow Reth (schedule gf_reth) — a fixed room is wrong for part of the day
    description: "Brennan, convinced, has given you his word to take to
      Reth, who lives retired at the quiet end of the residential streets.
      Brennan asks only that Reth let you read his original field notes."
    hint: "From Brennan's Office, go east to the Cloister Walk, south three
      times to College Row, west to the Blue Door, then south twice to
      Reth's Cottage. With Brennan's word, Reth's notes on the table are
      yours to read. Type look field notes."
  - id: testimony
    map_target: -1  # -1: return-to-giver / in-place (start room 6315); Phase 2 split review
    description: "You found Reth's notes, and with Brennan's word they are
      yours: directions and landmarks toward the eastern highlands, and a
      warning that whatever is out there is not natural."
    hint: "You have Reth's account and his marked directions. The thread
      runs east."
  - id: end
    description: "You have Reth's directions. The thread runs east, into
      the broken highland country, to the thing he would not name."

rewards:
  actor: >-
    You carry a retired surveyor's directions to a place he would not name.
    The road runs east into the highland country, older and stranger than
    the university's quiet maps. Whatever Reth saw out there and chose not
    to write down is still out there -- waiting in the broken hills. That
    climb is for another day.
  observer: ""
  gold: 0

triggers:
  # ── The filed survey (6303, the Archive) -- gated: has 75-start, missing 75-survey ──
  - event: room_interact
    room: 6303
    noun: filed-survey
    conditions:
      has: ["75-start"]
      missing: ["75-survey"]
    actions:
      - grant: "75-survey"
      - actor: >-
          You read the survey the way someone looking for what is not said
          would read it. The site is classified as a mineral deposit in
          three lines. A survey of that site -- elevations, material
          samples, seasonal access -- would ordinarily run to a page or
          more. This one does not. The entry is formal and correct and
          stops exactly where the detail should get louder. Reth saw
          something out there, and he filed a paper that buries it.
          Time to take this back to Brennan.
      - observer: "{actor} reads the thin filed survey with sudden, careful attention."
  # ── Ungated fallback: no 75-start ──
  - event: room_interact
    room: 6303
    noun: filed-survey
    conditions:
      missing: ["75-start"]
    actions:
      - actor: >-
          An old survey filed under the eastern country, dry and
          technical. Without a reason to read it closely, it is only
          a brief, dull entry.

  # ── Reth's field-notes (6315, Reth's Cottage) -- gated: has 75-intro, missing 75-end ──
  - event: room_interact
    room: 6315
    noun: field-notes
    conditions:
      has: ["75-intro"]
      missing: ["75-end"]
    actions:
      - grant: "75-testimony"
      - grant: "75-end"
      - give_item: 40160
      - bump_rep: {faction: margin, delta: 20}
      - actor: >-
          You take the marked map from the table — Reth's hand, annotated
          in the close careful script of a man who does not waste ink.
          A route east into the highland country, a circled waymark,
          elevation ticks that tell you what kind of ground you are going
          into. No name for what is at the end of it. Whatever Reth saw
          out there he would not write down, and he has not written it
          down now — but the route is exact, and the final mark is
          deliberate, and it is enough. The thread runs east.
      - observer: "{actor} takes the surveyor's marked map from the table."
  # ── Ungated fallback: no 75-intro ──
  - event: room_interact
    room: 6315
    noun: field-notes
    conditions:
      missing: ["75-intro"]
    actions:
      - actor: >-
          A retired surveyor's old papers spread across the table —
          terrain charts and route sketches in a close, careful hand.
          Without his leave they are not yours to take, and they say
          little to a stranger at the window.
