questid: 74
name: The Undercroft
description: >-
  The Margin's question has led you under the temple's own roof. Brother Cael,
  the Confluence's archivist, has set you to examine three of the temple's own
  building records, the ones that do not match its founding story, and, if
  what you find warrants it, to earn the senior Keepers' leave to descend into
  the undercroft beneath the island.
secret: false

steps:
  - id: start
    map_target: 6189  # fallback when Brother Cael is not spawned
    map_target_mob: 9465  # follow Brother Cael (schedule cf_cael) — a fixed room is wrong for part of the day
    description: "Brother Cael has set you to examine three of the temple's
      construction records that disagree with its founding story."
    hint: "First, the building ledger open on the stand in the Archive, beside
      Brother Cael. Type look ledger."
  - id: ledger
    map_target: 6188
    description: "The building ledger accounts for the temple's raising in
      meticulous detail, and is oddly silent on the oldest, lowest courses,
      as if the foundation were received, not built."
    hint: "Next, the consecration record in the Chapter House. From the
      Archive, go west to the North Walk, then west into the Chapter House.
      Type look record."
  - id: record
    map_target: 6198
    description: "The consecration record's own wording gives it away: the
      Founders consecrated the site, language that assumes something was
      already standing there to consecrate."
    hint: "Last, the mason's survey in the Older East Corridor. From the
      Chapter House, go east to the North Walk, south to the Cloister Garth,
      east twice to the Prioress's Oratory, then south into the Older East
      Corridor. Type look survey."
  - id: survey
    map_target: 6189  # fallback when Brother Cael is not spawned
    map_target_mob: 9465  # follow Brother Cael (schedule cf_cael) — a fixed room is wrong for part of the day
    description: "The mason's survey is plainest of all: the lower courses are
      older work, cut by hands the temple's records do not name. Three records,
      one conclusion: the temple was raised on something older."
    hint: "Return to Brother Cael with what you found. From the Older East
      Corridor, go north into the Prioress's Oratory, west twice to the
      Cloister Garth, north to the North Walk, then east into the Archive. He
      sleeps in the archive chair late at night. Type talk cael."
  - id: descent
    map_target: 6215
    description: "Cael has heard you out, and Aldric, reluctantly, has granted
      a supervised descent. The stair down lies past the Older East Corridor.
      Go down when you are ready."
    hint: "From the Archive, go west to the North Walk, south to the Cloister
      Garth, east twice to the Prioress's Oratory, south into the Older East
      Corridor, then east to the Descent Stairhead. Go down, then west three
      times to the Seeping Passage. Go down again, then west twice to the
      Water Gallery. Go down once more, then west three times to the Chamber
      of the Old Sky. Type look orbital face."
  # The choice is made in talk (spec R28, owner 2026-10-21): Aldric 9464
  # keeps the rubbing for the Keepers, the Margin scholar 9454 carries it
  # out. Each first explains what the player is signing up for, and
  # neither choice can be undone.
  - id: reveal
    map_target: -1  # -1: bundled objectives, rooms [6167, 6188]; Phase 2 split review
    description: "In a sealed chamber beneath the temple you found the old sky
      carved in four rings, where the temple's teaching keeps to three, and took a
      rubbing of it. There was a fourth. Aldric the Keeper would keep the proof
      inside the order; the Margin scholar at the Temple Portico would carry it
      out. The choice is yours, and it cannot be undone."
    hint: "Talk to Aldric and to the Margin scholar before you choose who gets
      the rubbing. From the Chamber of the Old Sky, go east three times, up,
      east twice, up, east three times, up, then west into the Older East
      Corridor. Go north into the Prioress's Oratory, west twice to the
      Cloister Garth, north to the North Walk, then west into the Chapter
      House. Aldric keeps it by day and sleeps in his study, east of the
      Archive, from evening until dawn. Type talk aldric."
  - id: end
    description: "You made your choice with the rubbing of the old sky. The
      Confluence's deepest secret is either carried out into the light, or kept
      quiet a little longer, and either way the thread runs onward, north and
      older, to wherever the sky was changed."

flags:
  - key: allegiance
    values: [margin, keepers]
    description: "Whether the player carries the truth to the Margin or keeps
      the Keepers' confidence. Set by the hand-in topic the player chooses:
      Aldric (9464) or the Margin scholar (9454)."

# Rewards fire on the `end` step (granted by either allegiance hand-in topic).
# Faction reputation is flag-specific and delivered by the hand-in topics; this
# block is the faction-neutral completion message, pointing onward.
rewards:
  actor: >-
    The Undercroft kept its threshold and gave up its secret: there was a
    fourth, struck from the sky and the count and the record, and the temple
    was raised on the place that remembered. What unmade it is not here. The
    rubbing in your memory points away from the Confluence entirely, north
    and older, to wherever the sky was changed. That road is for another day.
  observer: ""
  gold: 0

triggers:
  # ── RECORD 1: the building-ledger (6189, the Archive) ──
  - event: room_interact
    room: 6189
    noun: building-ledger
    conditions:
      has: ["74-start"]
      missing: ["74-ledger"]
    actions:
      - grant: "74-ledger"
      - actor: >-
          You read the building-ledger past its careful columns. It accounts
          for every stone of the temple's raising, except the lowest courses,
          which it simply assumes, as though the foundation were a thing
          received rather than built. The first of the three records.
      - observer: "{actor} reads the open building-ledger with sudden attention."
  - event: room_interact
    room: 6189
    noun: building-ledger
    conditions:
      missing: ["74-start"]
    actions:
      - actor: >-
          An old construction ledger open on a reading-stand, meticulous and
          dry. Without a reason to read it closely, it is only an account book.
  # ── RECORD 2: the consecration-record (6188, the Chapter House) ──
  - event: room_interact
    room: 6188
    noun: consecration-record
    conditions:
      has: ["74-ledger"]
      missing: ["74-record"]
    actions:
      - grant: "74-record"
      - actor: >-
          The consecration-record sets out the Founders' dedication of the
          temple, and its own wording betrays it: they consecrated the site,
          a word that assumes something already stood here to be made holy. The
          second record agrees with the first.
      - observer: "{actor} reads the open consecration-record closely."
  - event: room_interact
    room: 6188
    noun: consecration-record
    conditions:
      missing: ["74-ledger"]
    actions:
      - actor: >-
          The temple's consecration-record, open on its stand in the Chapter
          House. A formal dedication in old script, nothing you have reason to
          parse word by word.
  # ── RECORD 3: the mason's survey (6198, the Older East Corridor) ──
  - event: room_interact
    room: 6198
    noun: masons-survey
    conditions:
      has: ["74-record"]
      missing: ["74-survey"]
    actions:
      - grant: "74-survey"
      - actor: >-
          The mason's survey is the plainest of the three: the lower courses of
          this corridor are older work, it notes, cut and laid by hands the
          temple's own records do not name. Three records, three different
          rooms, one conclusion. Time to report to Cael.
      - observer: "{actor} examines the old mason's survey framed in the corridor."
  - event: room_interact
    room: 6198
    noun: masons-survey
    conditions:
      missing: ["74-record"]
    actions:
      - actor: >-
          A mason's survey-note framed on the corridor wall, marking the
          stonework's courses. Technical, and old. You have no particular
          reason to study it.

  # ── DESCENT: hearing Brother Cael's "q74_turnin" topic (moved from the
  #    topic's grantsQuest, #375 phase 3b) ──
  - event: topic_heard
    mob: 9465
    topic: q74_turnin
    conditions:
      has: ["74-survey"]
      missing: ["74-descent"]
    actions:
      - grant: "74-descent"

  # ── THE REVEAL: the orbital-face (6215, z-3 sealed chamber) ──
  - event: room_interact
    room: 6215
    noun: orbital-face
    conditions:
      has: ["74-descent"]
      missing: ["74-reveal"]
    actions:
      - grant: "74-reveal"
      - give_item: 40142
      - actor: >-
          You read the carving the way the mason's survey taught you to read
          stone. Four rings, cut with an instrument's care, where the
          temple's teaching keeps to three. The temple did not miscount. It chose a
          count, and built three hundred years on the choice, and set its
          floor over the wall that remembers otherwise. There was a fourth.
          The sky the Founders found was not the sky we are taught. You take a
          rubbing of it, proof in soft black line, and the dark keeps the
          rest of its counsel. Whatever unmade the fourth, the stone does not
          say. That answer is somewhere else.
      - observer: "{actor} takes a careful rubbing from the great carving on the chamber wall."
  - event: room_interact
    room: 6215
    noun: orbital-face
    conditions:
      missing: ["74-descent"]
    actions:
      - actor: >-
          A vast carving of the night sky in nested rings, cut into the
          chamber's far wall by a very old hand. Without a reason to count
          them closely, it is only a beautiful, weathered thing in the dark.
