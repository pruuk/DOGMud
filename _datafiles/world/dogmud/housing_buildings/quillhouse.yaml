# The Quillhouse: a tall, narrow lodging house at the end of Quill Court
# (6570), west off Hall Lane (6144) behind the Municipal Hall in the
# Confluence. It belongs to Madam Orla Venn, a retired chart-keeper of the
# Margin, and lets to people the Margin will speak for. Its under-clerk,
# Aubric Sallow, sells everything below from a list.
#
# It runs independently of every other building: a player may own one home
# here and one in each other building, with its own deeds, guests and
# containers. Its items are its own (60-64), so a deed bought here is good
# only here.
#
# Authored content (internal/housing). Who owns which room, their doorways,
# floors, containers and descriptions are living state under
# housing/quillhouse/, never in this file.
#
# To add capacity: run tools/housing_units.py with
# --template tools/housing_unit_templates/quillhouse.yaml.tmpl over a new id
# range, then list the new ids in unit_rooms below.
building_id: quillhouse
name: the Quillhouse
door_room: 6570
door_exit: door
landlord_mob_id: 9802
# Standing with the Margin, the Confluence's scholars. Warm (15+) means the
# Margin speaks for you: a new character starts at 10 (neutral), and the
# Margin's quest The Margin Notation (+15, from Quist the Elder at the Margin
# Hall) is enough.
faction: margin
min_rep_tier: warm

# How the landlord and the house commands speak of this building.
proprietor: Madam Venn
vouched_by: the Margin
standing_hint: Quist the Elder at the Margin Hall, west through the Scholars' Gate, always has some old chart that needs a second pair of eyes. Be the eyes, then come back.
location: Quill Court, west off Hall Lane behind the Municipal Hall in the Confluence
outside_text: You find yourself back out in Quill Court, the blue door shut behind you.

tiers:
  - tier_id: simple
    name: a Quillhouse room
    price: 500
    rooms: 1

# Extensions. Each deed costs extension_price_multiplier times everything the
# lodger has paid for rooms in this house so far: 500 for the home makes the
# first deed 1500, 500 + 1500 makes the second 6000, then 24000, and so on.
extension_item_id: 60
extension_price_multiplier: 3
# A house can hold at most this many rooms, home included.
max_rooms: 8
extension_title: A Quillhouse Back Room
extension_description: >
  A room knocked through from the rest of the lodging, the brick of the new
  doorway still raw at its edges. Bare boards, walls whitewashed to shoulder
  height, and a narrow leaded window over a deep writing sill. It is empty,
  and it is yours.

# Redecorating: a one-use voucher that rewrites one room's description.
redecorate_item_id: 61
redecorate_price: 500

# Guests: a lodger buys a guest key and gives it to a friend, who uses it at
# the door once and is let in from then on. The owner revokes with
# `house revoke <name>`. A house admits at most max_guests.
guest_key_item_id: 62
guest_key_price: 100
max_guests: 5

# Containers: a deed places one container in the room it is used in, under a
# one-word name the lodger chooses. A container deed's container can be used
# by anyone in the room; a strongbox deed's opens for the owner alone. What
# they hold lives in the house file. Each room of a house holds at most
# max_containers_per_room; the house as a whole has no limit.
container_item_id: 63
container_price: 250
strongbox_item_id: 64
strongbox_price: 500
max_containers_per_room: 6

unit_rooms: [6571, 6572, 6573, 6574, 6575, 6576, 6577, 6578, 6579, 6580,
