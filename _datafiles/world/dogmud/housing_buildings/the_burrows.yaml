# The Burrows: a warren of wide tunnels and hide-outs cut under Thornwall,
# behind a single iron-banded door at the Burrow Mouth (6671), east off the
# smugglers' escape shaft (499) past Torvan Cresk's operations room. Torvan
# owns it. His doorman, Brannoc Tull, lets the holes and sells everything
# below from a list, rudely.
#
# It runs independently of every other building: a player may own one home
# here and one in each other building, with its own deeds, guests and
# containers. Its items are its own (65-69), so a deed bought here is good
# only here. Everything paid is a gold sink: nothing sold here can be sold to
# a merchant, and the doorman buys nothing and carries no gold.
#
# Authored content (internal/housing). Who owns which hide-out, their
# doorways, floors, containers and descriptions are living state under
# housing/the_burrows/, never in this file.
#
# To add capacity: run tools/housing_units.py with
# --template tools/housing_unit_templates/burrows.yaml.tmpl over a new id
# range, then list the new ids in unit_rooms below.
building_id: the_burrows
name: the Burrows
door_room: 6671
door_exit: door
landlord_mob_id: 9803
# Standing with the Thornwall Citizenry. Warm (15+) means the folk upstairs
# vouch for you: a new character starts at 0, and one of the city's quests
# (The Drowning Post's Debt, The Fallow Field or The Undertow, +15 each) is
# enough. Torvan wants no Watch plants in his warren, only people the city
# itself knows.
faction: thornwall_citizens
min_rep_tier: warm

# How the doorman and the house commands speak of this building.
proprietor: Torvan
vouched_by: the folk upstairs
standing_hint: "Marek at the Drowning Post has got thugs leaning on him. Sort that out, and the folk upstairs will know your name. Then come back and bother me."
location: the Burrow Mouth, east off the smugglers' escape shaft past Torvan Cresk's rooms, in the tunnels under Thornwall
outside_text: You get shoved back out into the Burrow Mouth, and the iron-banded door grinds shut behind you.

# Brannoc's own words for everything he says (internal/housing/voice.go lists
# every line and its {placeholders}). He is rude to everybody. It is not
# personal. It is a little bit personal.
voice:
  terms.owner: "You've already got a hole. Door's right there. Plate, palm, in. It's not hard."
  terms.extension: "Want more hole? Digging deed's {price} gold for you. Goes up every time, that's {proprietor}'s rule, not mine, so don't whine at me. Paint's {voucher}. Type list."
  terms.no_extension: "No more digging for you. {reason}. Paint's {voucher}, if the rock's too ugly for you. Type list."
  terms.guest_key: "Got a friend? Shocking. Key's {price}. Hand it over, they use it on the door, done. Type house to see who's been in."
  terms.storage: "Got stuff? Container deed's {container}, strongbox deed's {strongbox}. You name it, the lads drag it in. Anyone you let in can root in a container. A strongbox opens for you and nobody else."
  terms.full: "Every hole's taken. Nothing I can do. Don't stand there looking at me like that."
  terms.pitch: "{Tier}, {price} gold, once. Rock walls, dry floor, a door that opens for you and not the Watch. Digging and paint after, for them as live here. It's all on the slate. Read it."
  terms.not_vouched: "But {proprietor} only lets to people {vouched_by} will vouch for, and nobody's vouched for you. {standing_hint}"
  terms.no_gold: "Come back with the gold. Bank counts. Type buy home when you've got it and not before."
  terms.ready: "{Vouched_by} know your face, more's the pity. Type buy home and I'll write you in."
  home.unknown_tier: "Don't let that kind of hole."
  home.already_owner: "You've got a hole already. {Door}'s behind me. It knows you. Go away."
  home.not_vouched: "{Proprietor} only lets to people {vouched_by} will vouch for, and nobody's vouched for you. {standing_hint} Now clear off."
  home.no_gold: "It's {price} gold for {tier}, and you haven't got it, not even with the bank. Stop wasting my lantern oil."
  home.held_owner: "Your name's in the book already, but the page is a mess. {Proprietor}'s having it looked at. Nothing for you till it's sorted."
  home.frozen: "Book's a mess. {Proprietor}'s having it gone over, and I'm to let nothing till it's done. Come back another day. Or don't."
  home.full: "Every hole's taken. Try another day. Try another city."
  home.welcome: "Done. You're in the book. Welcome to the Burrows. Don't touch anybody else's stuff and don't bring the Watch."
  ledger_error: "Book's a mess. I'm not taking your coin till it's straight. Come back later."
  deed.no_home: "Digging's for them as live here. Get a hole first. It's on the slate."
  deed.frozen: "Book's a mess. {Proprietor}'s having it gone over, and there's no digging till it's done."
  deed.unused: "You've got a deed already, with your name on, not used. Use that one. One hole at a time."
  deed.reissued: "Lost your deed? Course you did. The book says you paid and never dug. Here's another, free, so stop crying. Whichever you use first counts, and the other one's rubbish after."
  deed.max_rooms: "You've dug as much as {proprietor} allows anybody. That's the rule. Take it up with him. Actually don't."
  deed.no_gold: "Digging deed's {price} gold, bank and all. You're short. Obviously."
  deed.no_units: "Nowhere left to dig. Every empty hole's promised to somebody's deed already. Come back when someone clears out."
  deed.too_heavy: "You're carrying too much to take a bit of paper. Impressive. Drop something."
  deed.sold: "{price} gold. It's got your name on, so don't bother flogging it. Go stand in your hole and type use deed. It'll ask which wall. Try to keep up."
  voucher.no_home: "Paint for what? Get a hole first."
  voucher.no_gold: "Paint's {price} gold. You haven't got it."
  voucher.too_heavy: "You're carrying too much to take a playing card. Drop something."
  voucher.sold: "{price} gold. Use it in whichever hole you want to look different, then tell it what you want. One hole, one go. Don't come crying if it's ugly."
  key.no_home: "A key to what? Get a hole first."
  key.max: "Your lock knows as many palms as {proprietor} puts up with. Throw somebody out first. Type house guests."
  key.no_gold: "Key's {price} gold. You haven't got it."
  key.too_heavy: "You're carrying too much to take a washer. Drop something."
  key.sold: "{price} gold. Give it to whoever you want in. They use it on the door, once, and the lock learns them. Type house guests to see who's in and house revoke to kick them out."
  storage.no_home: "A {what} for where? Get a hole first."
  storage.full: "Every hole you've got is stuffed with furniture already. {Proprietor} won't have more. Get another hole."
  storage.carrying: "You're carrying deeds enough for every corner you've got. Use them first."
  storage.no_gold: "It's {price} gold for a {what}. You haven't got it."
  storage.too_heavy: "You're carrying too much to take a bit of sacking. Drop something."
  storage.container_sold: "{price} gold. Stand where you want it and use the deed. Give it one word for a name when it asks. Crate, sack, whatever. Anyone you let in can root in it."
  storage.strongbox_sold: "{price} gold. Stand where you want it and use the deed. Give it one word for a name. Only you'll get it open. Not even me. I've tried."
  ask.buy_what: "Buy what? Type list. It's on the slate. Then buy home, buy deed, whatever. Stop just saying buy at me."

tiers:
  - tier_id: simple
    name: a hide-out in the Burrows
    price: 500
    rooms: 1

# Extensions. Each deed costs extension_price_multiplier times everything the
# lodger has paid for holes in this warren so far: 500 for the first makes the
# first deed 1500, 500 + 1500 makes the second 6000, then 24000, and so on.
extension_item_id: 65
extension_price_multiplier: 3
# A lodging can hold at most this many hide-outs, the first included.
max_rooms: 8
extension_title: A Burrow Side-Cut
extension_description: >
  A side-cut dug through from the rest of the lodging, the rock of the new
  opening still sharp and pale where the picks went in. A packed earth floor,
  a candle niche and an iron hook in the wall. It is empty, and it is yours.

# Paint: a one-use voucher that rewrites one hide-out's description.
redecorate_item_id: 66
redecorate_price: 500

# Guests: a lodger buys a guest key and gives it to a friend, who uses it at
# the door once and is let in from then on. The owner revokes with
# `house revoke <name>`. A lodging admits at most max_guests.
guest_key_item_id: 67
guest_key_price: 100
max_guests: 5

# Containers: a deed places one container in the hide-out it is used in,
# under a one-word name the lodger chooses. A container deed's container can
# be used by anyone in the room; a strongbox deed's opens for the owner alone.
# What they hold lives in the house file. Each hide-out holds at most
# max_containers_per_room; the lodging as a whole has no limit.
container_item_id: 68
container_price: 250
strongbox_item_id: 69
strongbox_price: 500
max_containers_per_room: 6

