spellid: repair-pulse
name: Arc-Weld Repair
aliases: [repair]
description: >
  Directs a raw current through failing servos and cracked plating,
  forcing damaged construct systems to knit themselves whole again.
  Mob-castable only. This is a construct maintenance routine, not a
  spell any living caster could learn.
attack_type: none
damage_type: non_harm
targeting: single
schools:
  - vital
cost: 15
waitrounds: 1
difficulty: 10
mob_only: true   # boss/NPC signature ability: players may never DISCOVER it (GetEligibleSpells)
primarystat: willpower
base_folds: 2
effect_type: heal
effect_magnitude: 8
# The heal this spell lands, its multiplier on the holder's natural healing
# (effect_magnitude) and its own duration (the condition's triggercount),
# per the slice 1 identity table (messaging M6 slice 1, owner ruling R9):
# as before slice 1.
condition_ids:
  - 142
cast_actor: "Arc-light gathers between your manipulators."
cast_observer: "{actor} crackles with hard blue-white arc-light, current arcing toward {actee}."
