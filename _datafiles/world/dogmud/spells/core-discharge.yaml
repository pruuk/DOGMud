spellid: core-discharge
name: Core Discharge
aliases: [discharge]
description: >
  A ruinous vent of raw power torn straight from the Core Guardian's
  core: a room-wide detonation of cold light and crushing force that
  scours everything standing in the open. Mob-castable only; the
  buildup would kill any living caster before release.
attack_type: spell
damage_type: physical
targeting: area
schools:
  - elemental
cost: 20
waitrounds: 1
difficulty: 45
mob_only: true   # boss/NPC signature ability: players may never DISCOVER it (GetEligibleSpells)
primarystat: willpower
base_folds: 2
effect_type: damage
effect_magnitude: 150
# damage_multiplier (#480). Owner ruling 2026-10-10: a missed discharge
# must never one-shot a full-health UNARMOURED player; it takes about 85-90%
# of their pool, and armour takes it well below that. 2.0 shipped until
# SpellDamageScale doubled (1.56 to 3.12, f68db5baf) and it one-shot
# everyone. Arithmetic for the Core Guardian in a 400g run (pool 7 x gold,
# room 6395, so 2800, its authored statpool) against the #480 reference
# player (530 HP, raw 0.02 physical), normal hit, shipped config.yaml:
#   willpower  = 30 species + 2800 x 0.125 fighting mental share + 200 Core
#                Matrix = 580
#   skill mult = SkillMultiplier(41: Core Matrix 40 + 1) = 1 + 2 x sqrt(41/50)
#                = 2.811
#   raw        = 580 x 2.811 x 0.185 x SpellDamageScale 3.12 x Global 0.5
#              = 470
#   mitigation = 0.02 (below the curve's 0.50 knee, so linear)
#   mean hit   = 470 x 0.98 = 461, 87% of 530
# A raw 0.56 player (curve 0.559) takes 470 x 0.441 = 207, 39%. Willpower
# scales with gold: 300g (2100) about 74%, 200g (1400) about 61%.
# A crit is NOT tuned: it skips mitigation up to the knee and scales by
# CritDamageMultiplier(41) = 2.0 + 0.05 x 41 = 4.05, so 470 x 4.05 = about
# 1,900, still a one-shot. Warden-Prime (9561) has its own weaker
# warden-discharge. Pinned by internal/hooks/core_discharge_balance_test.go.
damage_multiplier: 0.185
no_damage_interrupt: true
# min_cast_rounds (#480): the Guardian makes about 57 folds a round, so
# without this the cast completed on its first step and left one round to
# interrupt. Held open for 2 steps: the round it starts (cast_observer), one
# warning round (wait_observer), then the blast. Every disruptor lands across
# the whole windup.
min_cast_rounds: 2
categories:
  - harm_multi
cast_actor: "Power floods inward, gathering at your core."
cast_observer: "{actor}'s core flares white-hot and the air screams. Stop it now!"
wait_observer: "{actor}'s core shrieks and blazes. It is about to burst!"
ignore_move_cooldown: true
