spellid: core-discharge
name: Core Discharge
aliases: [discharge]
description: >
  A ruinous vent of raw power torn straight from the Core Guardian's
  core: a room-wide detonation of cold light and crushing force that
  scours everything standing in the open. Mob-castable only; the
  buildup would kill any living caster before release.
attack_type: spell
damage_type: physical
targeting: area
schools:
  - elemental
cost: 20
waitrounds: 1
difficulty: 45
mob_only: true   # boss/NPC signature ability: players may never DISCOVER it (GetEligibleSpells)
primarystat: willpower
base_folds: 2
effect_type: damage
effect_magnitude: 150
# damage_multiplier (#480). Owner ruling 2026-10-10: a missed discharge
# must never one-shot a full-health UNARMOURED player, so its HIGHEST normal
# (non-crit) roll stays under their pool; armour takes it well below that.
# 2.0 shipped until SpellDamageScale doubled (1.56 to 3.12, f68db5baf) and
# it one-shot everyone. Reference: the playtest `mid` profile, 491 HP at raw
# 0.02 physical, in a 400g run (pool 7 x gold, room 6395, so 2800, the
# authored statpool). Normal hit, shipped config.yaml:
#   willpower  = 30 species + 2800 x 0.125 fighting mental share + 200 Core
#                Matrix = 580
#   skill mult = SkillMultiplier(41: Core Matrix 40 + 1) = 1 + 2 x sqrt(41/50)
#                = 2.811
#   raw        = 580 x 2.811 x 0.12 x SpellDamageScale 3.12 x Global 0.5
#              = 305
#   mitigation = 0.02 (below the curve's 0.50 knee, so linear)
#   mean hit   = 305 x 0.98 = 299, 61% of 491
# The roll is a normal with sd = mean x RollSpread 0.15 and no clamp: a z=3
# roll (one hit in about 740) is x1.45. A live boss also runs above the
# spawn mean: its willpower is random per spawn (sd about 17) and it trains
# spellcasting on its own drains. The re-playtest of cdc2250de logged raw
# 489.7 to 493 at 0.185, 4% over this mean, so allow 5%:
#   highest normal = 299 x 1.45 x 1.05 = 455, 93% of 491
# The boss's own hull suppression does not apply: hull_suppression gives
# condition 95 to players only. Willpower scales with gold: 300g about 52%,
# 200g about 43% mean. A raw 0.56 player (curve 0.559) takes about 27%.
# A crit is NOT tuned: it skips mitigation up to the knee and scales by
# CritDamageMultiplier(41) = 2.0 + 0.05 x 41 = 4.05, so 305 x 4.05 = about
# 1,240, still a one-shot. Warden-Prime (9561) has its own weaker
# warden-discharge. Pinned by internal/hooks/core_discharge_balance_test.go.
damage_multiplier: 0.12
no_damage_interrupt: true
# min_cast_rounds (#480): the Guardian makes about 57 folds a round, so
# without this the cast completed on its first step and left one round to
# interrupt. Held open for 2 steps: the round it starts (cast_observer), one
# warning round (wait_observer), then the blast. Every disruptor lands across
# the whole windup.
min_cast_rounds: 2
categories:
  - harm_multi
cast_actor: "Power floods inward, gathering at your core."
cast_observer: "{actor}'s core flares white-hot and the air screams. Stop it now!"
wait_observer: "{actor}'s core shrieks and blazes. It is about to burst!"
ignore_move_cooldown: true
