spellid: core-drain
name: Core Drain
aliases: [drain]
description: >
  The Core Guardian irises open its chest-cavity and reaches into the
  room itself, drawing the vitality from everything living in it to feed
  its own cold fire. Mob-castable only; this is the Guardian's
  signature recharge, not a spell any living caster could learn.
attack_type: spell
damage_type: physical
targeting: area
schools:
  - vital
cost: 20
waitrounds: 1
difficulty: 45
mob_only: true   # boss/NPC signature ability: players may never DISCOVER it (GetEligibleSpells)
primarystat: willpower
base_folds: 2
effect_type: drain_area
no_damage_interrupt: true
# effect_magnitude is NOT read by the drain_area handler. resolveMobDrainArea
# (internal/hooks/spell_resolution.go) dispatches straight to
# actions.ExecuteDrainArea, which derives its damage from the caster's own
# Strength stat + the TripDamagePercent balance knob -- mirroring the
# single-target `drain` command exactly (internal/actions/combat_drain.go).
# Left here at a nominal value for schema completeness; a future Chunk-E
# tuning pass may wire a real scalar in, but today this field has zero
# mechanical effect on the drain's damage/heal.
effect_magnitude: 100
cast_actor: "Power gathers inward, filaments of cold light reaching for your prey."
# min_cast_rounds (#480): the Guardian's fold rate finished this on its first
# step, so the "two-round windup" its help page promised was one round. Held
# open for 2 steps, as Core Discharge is: the cast line, one warning round,
# then the drain. Core Charge still rises only when the drain resolves
# (resolveMobDrainArea), so an interrupt anywhere in the windup denies it.
min_cast_rounds: 2
cast_observer: "{actor}'s chest irises open. Cold filaments reach toward you."
wait_observer: "{actor}'s filaments pull tight. It is about to feed!"
ignore_move_cooldown: true
