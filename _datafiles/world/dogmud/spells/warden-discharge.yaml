spellid: warden-discharge
name: Warden Discharge
description: >
  A vent of raw power from Warden-Prime's core: a room-wide burst of cold
  light and crushing force, the lesser form of the Core Guardian's own
  discharge. Mob-castable only; the buildup would kill any living caster
  before release.
attack_type: spell
damage_type: physical
targeting: area
schools:
  - elemental
cost: 20
waitrounds: 1
difficulty: 45
mob_only: true   # boss/NPC signature ability: players may never DISCOVER it (GetEligibleSpells)
primarystat: willpower
base_folds: 2
effect_type: damage
effect_magnitude: 150
# damage_multiplier (#480, 2026-10-10). Warden-Prime is the teaching boss:
# an uninterrupted discharge should cost a mid player about 30-40% of their
# health, so the lesson lands without a death. It cast core-discharge until
# #480, which now suits only the Core Guardian (Core Matrix: +200 willpower,
# +40 spellcasting). Arithmetic for a 400g run (Warden-Prime's pool is
# 5 x gold paid, room 6392, so 2000) against the #480 reference player
# (530 HP, raw 0.56 physical), normal hit, shipped config.yaml:
#   willpower  = 30 species + 2000 x 0.125 fighting mental share = 280
#   skill mult = SkillMultiplier(1) = 1 + 2 x sqrt(1/50) = 1.283
#   raw        = 280 x 1.283 x 0.75 x SpellDamageScale 3.12 x Global 0.5
#              = 420
#   mitigation = 0.50 + 0.45 x 0.06 / (0.06 + 0.40) = 0.559 on the curve
#   mean hit   = 420 x 0.441 = 186, 35% of 530
# At 300g (1500) about 27%, at 200g (1000) about 19%. Pinned by
# internal/hooks/core_discharge_balance_test.go.
damage_multiplier: 0.75
no_damage_interrupt: true
# min_cast_rounds (#480): held open for 2 fold steps, as the Core
# Guardian's discharge is, so the warning and the interrupt window match.
min_cast_rounds: 2
categories:
  - harm_multi
cast_actor: "Power floods inward, gathering at your core."
cast_observer: "{actor}'s core flares white-hot, and the air begins to hum."
wait_observer: "{actor}'s core whines and burns brighter. It is about to burst!"
ignore_move_cooldown: true
