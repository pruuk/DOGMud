spellid: charm
name: Charm
description: |
  You reach into the mind of a hostile creature and bend its
  will to yours. A stubborn mind fights you hardest. Raw
  strength is no defence at all, so the biggest thing in the
  room can be the easiest to take, and the worst to lose hold
  of. A creature already fighting is harder to reach.
  What you bind will follow you and fight for you, but not for
  long. There is no warning and no sign of the hold weakening.
  It simply ends. The more completely you win, the longer you
  keep it.
  When it ends, if you are standing beside it, it attacks you.
cost: 120
base_folds: 36
type: harmsingle
schools:
  - manifestation
difficulty: 60
primarystat: charisma
# Charm is answered by DEFY, not quell: it is an act of social domination whose
# attack side is already Charisma. Declaring the channel here is what lets charm
# resolve off the contest its cast already runs, instead of running a second
# private one of its own (U10c slice B).
target_defense_type: social
effect_type: charm
cast_user_text: >-
  You fix your gaze on your target, pressing your will
  against its mind...
cast_room_text: >-
  {source} stares intently at {target}, brow furrowed with
  fierce concentration.
