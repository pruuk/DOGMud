################################################################################
#
#   CONFIGURATION FILE
#   This file contains all of the configuration options for the game.
#   You can change these options to customize the game to your liking.
#
#   Note: If you decide to use a custom config.yaml, it is recommended that you
#   copy only the properties you want to change of this file into your own
#   config.yaml.
#   When running the server, use the environment variable: CONFIG_PATH like so:
#   CONFIG_PATH=../mudfiles/config.yaml to specify where your custom config file
#   can be found.
#
#   This way when you update the server, your custom config file will not be
#   overwritten.
#
#   Note: The name/value pairs are hierarchical, nested under other values.
#   This means you must tab out values that belong under a namespace.
#   For example: MudName is tabbed out two spaces from Server
#   Alternatively, you can specify it using a dot-syntax in your overrides file:
#   Server.MudName: "GoMud"
#
################################################################################

################################################################################
#
#   SERVER CUSTOMIZATIONS
#   Small changes such as login commands and the seed can ensure your mud has
#   differences from others on the same code base.
#
################################################################################
Server:
  # - MudName -
  #   Display name of the MUD.
  #   This will be used a few places by default (such as the web pages).
  MudName: "Delusions of Grandeur"
  # - MSSP -
  #   MUD Server Status Protocol (telnet option 70). Lets directory sites read
  #   live player count, uptime, world size, and features. Hostname/Port are
  #   public knowledge (README, listings) so they live here; Contact stays
  #   empty in the public repo — set it in the droplet's config override.
  MSSP:
    Enabled: true
    Website: https://www.dogmud.org
    Genre: Fantasy
    Gameplay:
      - Adventure
      - Roleplaying
    Status: Open Beta
    Language: English
    Family: Custom
    Location: United States
    Created: "2026"
    Contact: ""
    Hostname: "dogmud.org"
    Port: "33333"
  # - Seed -
  #   The seed used for certain types of content generation
  #   To prevent certain secrets or content from being spoiled, you can set this
  #   to a random string.
  #   Note: Once the Mud has been played and data saved, changing this will
  #   probably break certain things that get saved to files, such as user KeyRings,
  #   so only set it before the first time you run the server.
  Seed: "DOGMud-Chrysalis-2026"
  # - MaxCPUCores -
  #   Maximum CPU cores to use. 0 for all available cores.
  #   Most of the game is single threaded, but there are a few things that can
  #   benefit from multiple cores, such as the web server and telnet server.
  MaxCPUCores: 0
  # - OnLoginCommands -
  #   Commands to run when a user logs in. These commands are run by the user
  #   and can be anything they have access to.
  OnLoginCommands:
  - 'emote @appears before you in a flash of <ansi fg="yellow-bold">⚡l<ansi fg="white-bold">i</ansi>gh<ansi fg="white-bold">tn</ansi>i<ansi fg="white-bold">n</ansi>g⚡</ansi>!'
  - print
  - motd
  - print
  - online
  - print
  - inbox check
  - print
  - mudletmap
  - checkclient
  # - Motd -
  #   Message of the day. This is displayed when the motd command is run.
  Motd: '{{ t "THE PINNACLE CRAFTS — Nine legendary works, each the best of its kind, can now be commissioned from Veyra Coil-Tongue at the Confluence — but only if you first show her a masterwork of your own making. Gather the rarest reagents in the world, craft the parts by your own hand across a half-dozen disciplines, assemble them at her stations, and pay her ruinous staged fee. The god-touched might gather all nine; a determined master might earn a few. That is the point. (2026-07-05.)\nTHE GUARDIANS FIGHT BACK — The constructs of the buried Crash Site no longer stand and trade blows. Watch for the Core Guardian''s core flaring white-hot and interrupt it with a thrown flashbang or a disrupting spell; cut down the Repair Frames before they mend it; free whoever the Grapnel Warden locks down. A coordinated party that reads the tells lives — a DPS race does not. (2026-07-06.)\nTHE ROAD RUNS OUT — A hidden road climbs east past the mountains, and at the end of it a sealed door waits for a single key. Beyond lies the buried Crash Site: the hardest thing we have ever built, a true endgame dungeon for a coordinated party of masters and their companions. Find the branch, earn the disc, and pay the scavenger at the threshold to wake it as deep as you dare. Something at its heart has been waiting a very long time. Come back changed — some do not come back at all. (2026-07-01.)\nA NEW BEGINNING — When you make your character you choose your way in: brand-new to MUDs gets a guided tutorial that teaches the basics; new to DOGMud starts at the glowing pool of Pothole Coulee and learns the world hands-on across seven trails — blade, forge, brew, wild country, the Folding, old lore, and the bow; and a veteran skips straight into the wider world, already Awakened. (2026-06-29.)\nTAKE AIM — Bows, crossbows, and primitive pistols have arrived: fire instantly with shoot, even into the next room, then reload from an ammo bundle. The revived ranged-combat skill rewards a keen eye, and Smith Brindle in Stillwater stocks the gear. Watch for archers who keep their distance and shoot back as they retreat. (2026-06-12.)\nNovel: https://github.com/pruuk/DOGMud/blob/master/what_the_moons_keep.md\nFull patch notes: https://github.com/pruuk/DOGMud/blob/master/PATCH_NOTES.md" }}'
  # - NextRoomID -
  # This number is auto-updated to the highest number of rooms in the game.
  #   If creating your own rooms but don't want to risk an update conflicting,
  #   update this to a large number (like 100000), so that as new rooms are
  #   created they will be far beyond the range of any room id's expected through
  #   a code update.
  NextRoomId: 1002
  # - Locked -
  #   All config names defined here are immutable to the `server set` admin
  #   command. They can only be changed by editing the config file directly.
  #   It is a good idea to lock configs related to folder/file paths to prevent
  #   accidental changes that could break the game.
  Locked:
  - FilePaths
  - Server.CurrentVersion
  - Server.NextRoomId
  - Server.Seed
  - Server.OnLoginCommands
  - Server.BannedNames
  # Presence machine (chunk 5 — 2026-05-19) — replaces MaxMobBoredom +
  # ad-hoc AFK computation. See internal/state/presence/context.md.
  PresenceIdleAfterRounds: 8         # Active → Idle (~30s)
  PresenceAFKAfterRounds: 75         # Idle → AFK (~5min)
  PresenceDisconnectAfterRounds: 900 # AFK → Disconnected (~1h)
  PresenceMobDormantAfterRounds: 30  # mob Active → Dormant
  PresenceMobDespawnAfterRounds: 60  # mob Dormant → Despawning

################################################################################
#
#   MEMORY/CPU OPTIMIZATIONS
#   Changes that can help reduce memory and CPU usage.
#
################################################################################
Memory:
  # - MobUnloadThreshold -
  #   Do not unload any bots if the in-memory count is under this threshold.
  MobUnloadThreshold: 100
  # - RoomUnloadRounds -
  #   How many rounds must pass without a visitor before a room is considered
  #   for unloading from memory.
  RoomUnloadRounds: 450
  # - RoomUnloadThreshold -
  #   Do not unload any rooms if the in-memory count is under this threshold.
  RoomUnloadThreshold: 200

################################################################################
#
#   LOOT GOBLIN CONFIGURATIONS
#   This is a special mob that cleans up items and gold left on the ground.
#   It portals in from a special zone and when it can't find any items or gold
#   to pick up, it portals back.
#   Players can actually chase the goblin to its realm and possibly find some
#   treasure.
#
################################################################################
LootGoblin:
  # - RoomId -
  #   The room the loot goblin spawns in (per its spawninfo). Also the room it returns
  #   to to drop off loot it finds. If zero (0), no loot goblin spawning.
  RoomId: 139
  # - RoundCount -
  #   How often the Loot Goblin will spawn. It is a good idea to keep this
  #   number low to keep the game from getting bogged down with too many items
  #   on the ground. At 4 seconds per round, 900 rounds is 1 hour.
  RoundCount: 900
  # - MinimumItems -
  #   How many items there must be on the room to attract the loot goblin
  MinimumItems: 3
  # - MinimumGold -
  #   How much gold there must be on the room to attract the loot goblin
  MinimumGold: 100
  # - IncludeRecentRooms -
  #   If true, the loot goblin will also clean recently visited by players rooms
  #   If allowed, this could create a situation where a lot of loot drops and the
  #   suddenly the goblin shows up.
  IncludeRecentRooms: true


################################################################################
#
#   ENGINE TIMING
#   Fine tuning for input throttling, round time, day length etc.
#
################################################################################
Timing:
  # - TurnMs -
  #   How many milliseconds per turn. While lower is generally better, this can
  #   greatly increase overhead on the server - a command per mob or user is
  #   processed per turn. This is not the same as rounds, which is how often the
  #   mobs choose their actions, but if multiple actions are queued up, they will
  #   be processed in order once per turn.
  #   50 is a good balance between handling input from players and not bogging
  #   down the server.
  #   Note: If your automapper/walker seems slow, this is probably the culprit.
  TurnMs: 50
  # - RoundSeconds -
  #   How many seconds per round. Anything gated by rounds will be affected by
  #   this. This is the main setting for controlling the pace of the game.
  RoundSeconds: 4
  # - RoundsPerAutoSave -
  #   How often the server will automatically save the game state. This is a
  #   backup feature in case the server crashes. The game state is also saved
  #   whenever the server is shut down.
  RoundsPerAutoSave: 225
  # - AutosaveWritesPerTick -
  #   How many prepared files autosave writes per turn.
  #   Autosave works in two steps. First it takes one consistent snapshot of
  #   everything that changed, which is fast and happens in a single pass so a
  #   player and a room can never disagree about who is holding an item. Then it
  #   writes those snapshots to disk a few at a time, spread over the following
  #   turns, because the write itself is by far the slow part.
  #   Raise this to finish a save sooner, at the cost of a bigger slice of each
  #   turn. Lower it for the reverse. If a save cannot finish before the next one
  #   starts, the server logs a warning naming this setting.
  #   Values below 1 are ignored and treated as the default.
  AutosaveWritesPerTick: 3
  # - RoundsPerDay -
  #   How many rounds are in a day? This is used to calculate the time of day.
  #   The lower this number, the faster the day/night cycle will be.
  #   A 4 second round and a 900 round day means the day/night cycle is 1 hour.
  RoundsPerDay: 900
  # - NightHours -
  #   How many hours of each 24 hour day will be nighttime?
  NightHours: 8

################################################################################
#
#   FILEPATH CONFIGURATIONS
#   Relative or absolute filepaths, and sometimes URI's
#
################################################################################
FilePaths:
  # - WebDomain -
  #   This can be mysite.com, or www.mysite.com, etc.
  #   Do not include the protocol such as http:// or https://
  WebDomain: "localhost"
  # - WebCDNLocation -
  #   Optional alternative location to serve static files from such as audio
  #   Example: http://files.gomud.net
  #   Leave blank if no CDN config or similar desired
  WebCDNLocation: ""
  # - DataFiles -
  #   The folder where all datafiles reside.
  #   If you are planning to create your own world, copying the current folder
  #   and its entire tree of content is a good place to start.
  DataFiles: _datafiles/world/dogmud
  # - PublicHtml -
  #   The folder where all web html files/templates reside.
  PublicHtml: _datafiles/html/public
  # - PublicHtml -
  #   The folder where all web ADMIN files/templates reside.
  AdminHtml: _datafiles/html/admin
  # - CarefulSaveFiles -
  #   If true, save files are written to a temporary file, flushed to the disk,
  #   and then renamed over the real file. A reader then sees either the whole
  #   old file or the whole new one, never a half-written mixture.
  #
  #   LEAVE THIS ON. Turning it off does not just risk "some file corruption".
  #   It removes the durability guarantee from the game's living state, which is
  #   the data that CANNOT be rebuilt from this repository:
  #
  #     - mob instance progression (stats, skills, mutations, gold, gear)
  #     - shop economies (stock levels, merchant gold, restock timers)
  #     - room instance state (dropped items, gold, signs, container contents)
  #     - player and alt saves
  #
  #   A crash or power loss mid-write with this off truncates the file, and the
  #   next load starts that mob, shop or room over from its template. Since
  #   2026-08-10 a truncated file is at least quarantined and logged at ERROR
  #   rather than silently reseeding, but the lost data is still lost.
  #
  #   If you are turning this off because saving feels slow, that is very
  #   probably not the real cause: autosave currently writes EVERY loaded room
  #   whether or not it changed. Fixing that is tracked as roadmap chunk 3.6a
  #   and will help far more than disabling this ever could.
  CarefulSaveFiles: true
  # - HttpsCertFile/HttpsKeyFile -
  #   Used to negotiate TLS/https requests
  HttpsCertFile: ""
  HttpsKeyFile: ""

################################################################################
#
#   GAMEPLAY CONFIGURATIONS
#   These modify the way the game players, the pace/speed of the game, etc.
#
################################################################################
GamePlay:
  # - AllowItemBuffRemoval -
  #   Whether to allow the removal of buffs assigned by items using spells etc.
  #   By default, once an item has buffed a player, the player cannot remove the
  #   buff unless they removing the item. However, if set to true, players can
  #   temporarily remove the buff with spells, items, etc. and the buff will not
  #   return until the player re-equips the item, or logs out and back in.
  AllowItemBuffRemoval: false
  # Death settings
  Death:
    # - EquipmentDropChance -
    #   The chance that a player will drop a piece of worn/backpack equipment when
    #   they die. This is a percentage, so 0.5 is 50% chance.
    EquipmentDropChance: 0
    # - AlwaysDropBackpack -
    #   If true, players will always drop their backpack contents when they die.
    #   If false, it will failover to EquipmentDropChance.
    AlwaysDropBackpack: false
    # DOGMud death penalties (Stage 20.1)
    StatDecayMin: 1            # Min Training loss on 1 random stat
    StatDecayMax: 2            # Max Training loss on 1 random stat
    SkillRustCount: 1          # Number of skills to decay
    SkillRustAmount: 1         # Skill ranks lost per decayed skill
    # Floors. Anything already at or below its floor is left completely alone:
    # no loss, no message, no event. Skills and stats are BOTH picked uniformly
    # at random; there is no "protected" set. SkillRecencyThreshold used to sit
    # here and was removed 2026-08-14 — it compared against a LIFETIME use
    # count, so every skill a character actually used was protected forever and
    # the loss fell every time on the few they had barely touched.
    StatDecayFloor: 100        # Never degrade a stat's PERMANENT part (racial roll + training) below this. Equipment and buff mods are excluded on purpose, so a permanent loss cannot hinge on what you were wearing.
    SkillRustFloor: 1          # Never rust a skill below this rank
    DeathsShadowBuffId: 25     # Buff ID for Death's Shadow debuff
    # - ProtectionSkillRanks -
    #   Players with total skill ranks at or below this value are protected
    #   from death penalties. Gives new players a grace period.
    ProtectionSkillRanks: 10
    # - CorpsesEnabled -
    #   If set to true, corpses are left behind by players or mobs that are killed.
    CorpsesEnabled: true
    # - CorpseDecayTime -
    #   How long until corpses crumble to dust (Go away).
    #   See ShopRestockRate comments for time format.
    CorpseDecayTime: 4 hours
  # - ShopRestockRate -
  #   The default time for a shops to restock 1 item. This can still be
  #   overriden in character shop definitions if desired.
  #   Should be in the format of: {num} {unit}
  #   Unit can be: rounds, hours, days, weeks, months, years
  #   Default is in-game time, not real time. To use real time, use the following
  #   format: {num} real {unit} - Example: 1 real day
  ShopRestockRate: 2 hours
  # - ContainerSizeMax -
  #   Maximum number of objects a container can hold before stuff overflows
  ContainerSizeMax: 10
  # - MaxAltCharacters -
  #   How many characters beyond their original character can they create? Players
  #   can swap between characters and work on them independently if this is set
  #   greater than 0. Otherwise they are locked to a signle character and have to
  #   sign up with a new user login if they intend to create a new character.
  MaxAltCharacters: 3
  # - PVP -
  #   Possible Values:
  #     enabled   - PVP is enabled everywhere
  #     disabled  - PVP is disabled eveywhere
  #     limited   - PVP is enabled for all players but only in PVP enabled rooms
  PVP: disabled
  # - PVPMinimumSkillRanks -
  #   Total skill ranks required to engage in PVP combat.
  PVPMinimumSkillRanks: 15
  # - MobConverseChance -
  #   Chance in 100 that the mob will attempt to converse when idle.
  MobConverseChance: 3
  # - UseSkillProgression -
  #   If true, skill and stat usage will trigger progression chance checks.
  UseSkillProgression: true
  # - DualProgressionMode -
  #   If true, successful progression checks grant actual skill/stat increases.
  #   Requires UseSkillProgression to be true. When enabled, progression
  #   checks grant actual skill/stat increases.
  DualProgressionMode: true
  # - MapConsistencyEnforce -
  #   Cartesian map consistency enforcement at startup:
  #     off   = no checking
  #     warn  = log collisions / non-reciprocal exits, server still boots (default)
  #     panic = block server boot on any inconsistency
  #   Toroidal/maze zones must set `non_cartesian: true` in their zone-config.yaml
  #   to be exempt; one-way exits use `oneway: true` on the exit.
  MapConsistencyEnforce: panic
  # - FerriesEnabled -
  # Master toggle for the scheduled ferry vessels (Stage 1 ferry system).
  FerriesEnabled: true

  # - WarehousesEnabled -
  # Master toggle for the city warehouse buffer pools (Stage 3 ferry system).
  WarehousesEnabled: true

  # - WarehouseDrawdownEnabled -
  # Stage 4 kill switch: warehouse-first loading (ferry factors + Dobb's
  # depot) plus local vendor-gap release. Requires WarehousesEnabled also
  # true; with either off, behavior degrades exactly to Stage 3 (or
  # earlier if both are off).
  WarehouseDrawdownEnabled: true

  # - PinnacleItemsEnabled -
  # Master toggle for pinnacle item ticks (sentient chatter, ambient effects,
  # hunger, mutation growth).
  PinnacleItemsEnabled: true

  # - ItemProcsEnabled -
  # Master toggle for item proc firing (on_hit/on_block/on_kill/etc.).
  ItemProcsEnabled: true

  # - Moderation -
  # PetitionCooldownRounds: min rounds between a player's petitions (anti-spam).
  # PetitionMaxLen: max characters accepted in a petition message.
  PetitionCooldownRounds: 50
  PetitionMaxLen: 500

  # - SplashesEnabled -
  # Master toggle for scene splashes (sunrise/sunset/moon, season turns, severe
  # weather). Rendered as inline SVG on the web client, refined ASCII on terminal.
  SplashesEnabled: true

################################################################################
#
#   BALANCE
#   Every numeric gameplay-balance constant, grouped by subsystem.
#   All values here are the current defaults — change without recompiling.
#   Use "server set Balance.FieldName value" to override at runtime.
#
################################################################################
Balance:
  # ============================================================================
  # ── ROLL SPREAD ── *** THE MASTER RANDOMNESS KNOB ***
  #
  #   Controls the standard deviation for EVERY stat-based dice roll in the
  #   game: all attacks, defenses, spell checks, grapples, bash/trip/kick, and
  #   skill/stat checks.  A single number that governs how chaotic or
  #   skill-dominant the entire game feels.
  #
  #   Formula: stdDev = stat_value * RollSpread
  #   At the human baseline (stat = 100): stdDev = 100 * RollSpread
  #
  #   GAMEPLAY FEEL BY VALUE:
  #     0.05  Very tight rolls. High-stat characters win ~99% of even matches.
  #     0.10  Low variance. Skill/stat clearly dominates. Upsets are rare.
  #     0.15  DEFAULT — recommended balanced spread.
  #     0.20  Higher variance. Upsets are common. Combat feels dynamic.
  #     0.30  Chaotic. Luck rivals skill. Not recommended for competitive play.
  #
  #   Crits/fumbles unaffected (always ~2.3% each at z-score ±2.0).
  #   Valid range: 0.05-0.50. Requires server restart.
  # ============================================================================
  RollSpread: 0.15

  # ── COMBAT: DEFENSE COSTS ──────────────────────────────────────────────────
  # These ONLY affect how much stamina each defense costs. They do NOT
  # change how effective the defense is at avoiding hits.
  #
  # U7 replaced the old per-defence base costs with ONE base plus a per-action
  # modifier, so every defence is priced by the same formula as every other
  # action in the game:
  #
  #   cost = base x encumbrance x inverseSkill x perActionModifier
  #
  # The three retired keys (DodgeBaseStaminaCost 2, ParryBaseStaminaCost 4,
  # BlockBaseStaminaCost 5) and their three multipliers (DodgeMultiplier and
  # friends, all 0.9) were deleted rather than left in place. The loader is
  # non-strict and would have ignored them silently, which is exactly the
  # problem: they read like live tuning dials and were not.
  #
  # DefenceBaseStaminaCost: what ONE defence costs before any multiplier.
  #   Deliberately the same 1.0 as AttackBaseStaminaCost, so a round of
  #   attacking and a round of defending cost the same before skill and load
  #   are taken into account. Charged per defence resolved, not per round.
  DefenceBaseStaminaCost: 1.0
  #
  # The per-defence modifiers. These are the ONLY thing that separates the
  # three defences by price, and the ordering is a design statement rather than
  # a tuning accident: dodge moves your whole body and is dearest, block takes
  # the blow on a shield and is next, parry only interposes a weapon already in
  # your hand and is cheapest. Raising DodgeCostModifier makes evasive
  # unarmoured builds pay more for the defence they lean on hardest.
  DodgeCostModifier: 1.25
  ParryCostModifier: 1.10
  BlockCostModifier: 1.15
  #
  # QuellBaseConvictionCost / DefyBaseConvictionCost: quell (mental spells) and
  #   defy (taunts) are paid in CONVICTION, not stamina, because they are acts
  #   of will rather than of body. Seeded at 2, matching dodge, the cheapest
  #   physical defence: neither has been played against yet, and the conviction
  #   pool is smaller than stamina for most builds, so starting cheap is the
  #   conservative direction. First retune is a config edit.
  QuellBaseConvictionCost: 2
  DefyBaseConvictionCost: 2
  #
  # Quell and defy are NOT multiplied by encumbrance. They are acts of will,
  # not of body, so a heavy pack does not make them dearer. They DO take the
  # inverse-skill discount, like every other action with a skill behind it.

  # ── COMBAT: DEFENSE EFFECTIVENESS ─────────────────────────────────────────
  # MULTIPLIER on the defense score BEFORE the opposed roll. Applied in
  # all situations (standing, prone, grappled) — stacks with prone penalties.
  # 1.0 = no change. 1.2 = 20% stronger. 0.8 = 20% weaker.
  # Defense scores:
  #   Dodge = Dex + UnarmedSkill
  #   Parry = Dex + WeaponSkill + weapon ParryRating
  #   Block = (Str+Dex)/2 + WeaponSkill + shield BlockRating
  # Example: defender Dex 100, skill 10, DodgeEffectiveness 0.97:
  #   dodge score = (100 + 10) × 0.97 = 106.7 (vs attacker's ~110)
  DodgeEffectiveness: 0.95      # Nerfed: dodge is most common defense, needs counterplay
  ParryEffectiveness: 0.97      # Slight nerf: parry is middle ground
  BlockEffectiveness: 1.05      # Buffed: requires shield investment, should reward it
  #
  # U6 added quell (mental spells, Willpower + spellcasting) and defy (taunts,
  #   Willpower + rhetoric) as real defence types, so all five defences now have
  #   the same per-defence dial. Both ship NEUTRAL at 1.0 rather than tuned:
  #   nothing has been played against them yet, and they exist so the first
  #   retune is a config edit instead of a code change.
  QuellEffectiveness: 1.0
  DefyEffectiveness: 1.0
  #
  # MinDefenseChance and MinAttackHitChance were deleted in U6. They were the
  #   last two of the eight per-channel floor knobs; ContestFloor below replaces
  #   all of them. They were also applied AFTER crit resolution, which returned
  #   early on five branches, so against a defender who reliably defence-crit
  #   they were evaluated on almost nothing.
  #
  # MinAttackCritChance / MinDefenseCritChance (roadmap chunk 5.11e): the same
  #   last-resort idea applied to CRITS, once 5.11d/g made crit derive from the
  #   opposed-roll margin. A badly outclassed attacker's crit rate went to
  #   literally zero under that derivation, because the margin can never reach
  #   two sigma no matter how the dice fall.
  #
  #   Denominated in HITS, not swings, and that distinction is the whole design.
  #   An outclassed attacker hits about 15% of the time, so "1% of swings" would
  #   demand roughly 6.7% of their hits be crits, a HIGHER per-hit rate than an
  #   even match gets at 2.3%. Incoherent. 1% of hits instead composes with the
  #   two floors above as independent last resorts.
  #
  #   Applied only AFTER the hit outcome is final. A crit forces a hit, so a
  #   floor evaluated any earlier becomes an undeclared second hit floor
  #   stacked on MinAttackHitChance.
  #
  #   Range: 0.0-1.0. Set to 0 to disable either direction entirely.
  MinAttackCritChance: 0.01
  MinDefenseCritChance: 0.01
  #
  # ContestFloor: the single last-resort probability for EVERY opposed contest
  #   in the game. A symmetric floor F bounds the outcome to [F, 1-F], so 0.125
  #   means a hopelessly outclassed actor still succeeds one attempt in eight,
  #   and an overwhelming one is still stopped one attempt in eight.
  #
  #   It replaces six knobs deleted in U6: MinContestSuccessChance and
  #   MinContestResistChance (out-of-combat), MinSpellHitChance and
  #   MinSpellResistChance, MinManeuverHitChance and MinManeuverResistChance.
  #   MinAttackHitChance and MinDefenseChance above are the last two of the old
  #   set and go when the melee path is reordered.
  #
  #   Those per-channel values encoded THE COST OF A SINGLE FAILURE: a melee
  #   swing is a fraction of a round so it floored at 0.15, while a maneuver, a
  #   spell or an out-of-combat attempt consumes the whole round and floored at
  #   0.05. That distinction is deliberately discarded in favour of one rule.
  #   Picking the wrong pair used to be numerically invisible in production and
  #   would have become a live balance bug on the first retune.
  #
  #   Applies to OPPOSED contests only.
  #   Static-difficulty rolls -- search, track, forage -- are not floored.
  #   Concentration IS floored, by its own ConcentrationFloor below, through
  #   combat.RunConcentrationContest.
  #
  #   Range: above 0.0 and at most 0.50. Zero is NOT legal: it fails validation
  #   and reverts to 0.125, because a zero here would silently disable the
  #   mechanism everywhere including in every Go test.
  ContestFloor: 0.125
  # ConcentrationFloor: the symmetric mercy band for concentration
  #   contests only (damage, position, and throttle triggers). The
  #   standard ContestFloor would break a master one-in-eight per
  #   disruption; concentration holds get a much smaller band. Zero is
  #   not allowed (rewritten to the default).
  ConcentrationFloor: 0.02
  # ConcentrationDamageThresholdPct: damage below this percent of the pool
  #   never rolls for concentration. Chip damage should not generate
  #   rolls. Minimum 1; there is no roll-on-any-hit zero setting.
  ConcentrationDamageThresholdPct: 10

  # ── CRIT BAR (U6b) ──────────────────────────────────────────────────
  # The crit threshold every channel tests its normalized margin against:
  #   bar = 2.0 - CritBarSkillSlope x (attacker rank - defender rank)
  # clamped to [CritBarFloor, CritBarCeiling]. The ranks are the CHANNEL
  # governing skills: the attack skill vs the WINNING defence skill.
  # Out-skill your target and the bar falls toward the floor; get
  # out-skilled and it rises to the ceiling. The ceiling is what lets a
  # gold-scaled, skill-poor boss still buy crits against a veteran.
  # Raising the ceiling makes skill protect harder against boss crits;
  # CritBarCeiling: 0 is LEGAL and means uncapped (bosses then almost
  # never crit skilled defenders, on any channel).
  CritBarSkillSlope: 0.05
  CritBarFloor: 1.5
  CritBarCeiling: 3.0
  #
  # CounterDamagePercent: a defensive crit earns the defender a free counter
  # (U6b): one answering swing at this fraction of normal weapon damage.
  # This is the same knob melee riposte has always used at its old
  # hardcoded value. 0 is LEGAL and disables counter damage entirely.
  CounterDamagePercent: 0.5

  # ── COMBAT: PRONE & GRAPPLE ───────────────────────────────────────────────
  # When a character is knocked prone, these multipliers modify combat scores.
  #
  # ProneAttackMultiplier: attack score when attacking WHILE prone.
  #   Example: attacker score 110, multiplier 0.80 → score 88.
  ProneAttackMultiplier: 0.80
  #
  # GrappleProneDefenderMod / GrappleProneAttackerMod: grapple-contest score
  # multipliers when that SIDE is prone or supine. The names carry the side
  # they modify; the shipped values are deliberately asymmetric (a downed
  # defender is far easier to pin than a kneeling attacker is weakened) and
  # were literals in the code before U6b.
  GrappleProneDefenderMod: 0.3
  GrappleProneAttackerMod: 0.5
  #
  # GrappleAggressorDriftBonus: whole-score multiplier on the grapple
  # AGGRESSOR side of the per-round drift contest. The old 2.2-vs-2.0
  # coefficient accident gave the aggressor an edge; uniform weights
  # deleted it, and this knob restores it deliberately. 1.038 was SOLVED
  # (tools/balance/u6b_model_counters_family_costs.py) to reproduce the
  # old parity drift of about +0.196 steps per round at every tier.
  GrappleAggressorDriftBonus: 1.038
  #
  # ProneDodge/Parry/BlockPenalty: fraction of defense score kept while prone.
  #   1.0 = full defense (no penalty). 0.50 = half defense. 0 = no defense.
  #   Example: dodge score 100, penalty 0.95 → score 95.
  ProneDodgePenalty: 0.93        # Mild; prone already punishes via attack + damage mults
  ProneParryPenalty: 0.93
  ProneBlockPenalty: 0.95
  #
  # ProneDamagePenalty: damage dealt while attacking from prone.
  #   Example: 15 raw damage × 0.80 = 12 damage from the ground.
  ProneDamagePenalty: 0.80
  #
  # ProneVulnerabilityMultiplier: attack score bonus when the TARGET is prone.
  #   Stacks with the defense penalties above.
  #   Example: attacker score 110 × 1.05 = 115.5 vs prone target.
  ProneVulnerabilityMultiplier: 1.05  # Tuned 39.2: lowered from 1.15; defense penalties already stack
  #
  # Grapple position (chunk 5.11c). Moved off the crit threshold and onto the
  #   attack score so grapple and prone use the same mechanism. As threshold
  #   shifts the ground pair self-cancelled to net zero -- BOTH participants
  #   satisfy IsGroundGrapple(), so the controller's -0.4 and the victim's +0.4
  #   erased each other, making ground control worth LESS than standing. As
  #   multipliers they compound, which was always the intent.
  GrappleGroundControlAttackMultiplier: 1.15    # controller, on the ground
  GrappleStandingControlAttackMultiplier: 1.08  # controller, standing clinch
  GrappleGroundedVulnerabilityMultiplier: 1.15  # vs a grounded, non-controlling target
  #
  # StandStaminaCost: fraction of StaminaMax required to stand up from prone.
  #   Example: StaminaMax 400, cost 0.15 → must spend 60 SP to stand.
  StandStaminaCost: 0.15
  # StandMinStamina: must have at least this fraction of max SP to attempt standing.
  #   Example: StaminaMax 400, min 0.15 → need at least 60 SP.
  StandMinStamina: 0.15
  #
  # FleeStaminaCost: base stamina charged for breaking off to flee. Charged
  #   partially, never refused: fleeing is the only player-initiated disengage
  #   while in combat, so refusing it at low stamina would leave no alternative.
  FleeStaminaCost: 10
  #
  # ThirdPartyGrapplePenalty: defense score multiplier when attacked by a third
  #   party while grappling. Only block is available; dodge/parry stripped.
  #   Example: block score 80 × 0.70 = 56 vs third-party attacker.
  ThirdPartyGrapplePenalty: 0.70
  #
  # ClinchDodge/Parry/BlockPenalty: defense score kept while clinched.
  #   Clinch is a standing grapple — limited movement but not on the ground.
  ClinchDodgePenalty: 0.80
  ClinchParryPenalty: 0.83
  ClinchBlockPenalty: 0.85
  #
  # GroundedDodge/Parry/BlockPenalty: defense score kept while grounded.
  #   Grounded is worse than clinch — on the floor with opponent on top.
  GroundedDodgePenalty: 0.75
  GroundedParryPenalty: 0.77
  GroundedBlockPenalty: 0.80

  # ── COMBAT: SPECIAL MOVES ─────────────────────────────────────────────────
  # Bash, trip, and kick all share a cooldown so players can't chain knockdowns.
  # Spellcasting also shares this cooldown slot.
  #
  # SpecialMoveCooldown: rounds before another special move can be used.
  #   Example: 4 = after a bash, must wait 4 rounds before bash/trip/kick/cast.
  # SpecialMoveBaseStaminaCost is the configured base before load, governing
  #   skill, and action modifiers. Grapple initiation uses this special base;
  #   ongoing maintenance uses GrappleStaminaCostPerRound instead.
  SpecialMoveBaseStaminaCost: 4
  SpecialMoveCooldown: 4

  # - ConjureCooldown -
  # Rounds between corpse-free conjure/summon casts, on their OWN cooldown key
  # rather than the shared special-move budget. Conjure needs no corpse and no
  # target, so an unthrottled conjure ran at 225 casts/hour standing still, with
  # a free summon/dismiss loop. 36 rounds paces it to roughly the raise+assess
  # rate. Retune once the kill rate is measured.
  ConjureCooldown: 36
  # RhetoricActionBaseConvictionCost prices taunt, rally, and warcry before the
  #   shared inverse-skill multiplier. Carried load never affects these actions.
  RhetoricActionBaseConvictionCost: 4
  #
  # DamagePercent: fraction of a normal melee swing's damage this move deals.
  BashDamagePercent: 0.50        # Bash deals 50% of a normal swing
  TripDamagePercent: 0.25        # Trip deals 25% of a normal swing (low damage, high knockdown)
  KickDamagePercent: 0.40        # Kick deals 40% of a normal swing
  #
  # KnockdownFactor: multiplier on the attacker's score in the knockdown
  # contest (attack score x factor vs defender Dex + unarmed x SkillWeight).
  # Anchored to the INTENDED per-move rates at score parity (the old
  # threshold knobs claimed these numbers but never delivered them). The
  # contest floor pulls observed parity rates slightly toward even. Zero
  # is not allowed (rewritten to the default); a move with no knockdown
  # component sets factor 0 in code, not here.
  BashKnockdownFactor: 1.0       # intended half-and-half at parity
  TripKnockdownFactor: 1.057     # intended strong-favorite at parity
  KickKnockdownFactor: 0.924     # intended underdog at parity
  #
  # CoupDeGraceRounds: rounds a mob waits before finishing a downed player.
  #   0 = disabled (mob disengages when player is downed).
  #   1 = mob finishes the player after 1 grace round of lying helpless.
  CoupDeGraceRounds: 1
  # Shoot and reload bases are composed by the shared action-cost formula with
  #   Ranged Combat and physical load. They are not final whole-point charges.
  ShootBaseStaminaCost: 2
  ReloadBaseStaminaCost: 1
  # - RangedShotScale -
  #   Global multiplier on ranged shot damage (tuning knob)
  RangedShotScale: 1.0

  # ── COMBAT: SPELL COSTS ───────────────────────────────────────────────────
  # Global multipliers for spell resource costs. Applied to ALL spells.
  #   1.0 = no scaling. 0.5 = half cost. 2.0 = double cost.
  # Example: a spell costs 30 conviction base, multiplier 1.5 → 45 conviction.
  SpellConvictionCostMultiplier: 1.0
  SpellHealthCostMultiplier: 1.0      # For life-force magic (health-cost spells)

  # ── COMBAT: MESSAGES ──────────────────────────────────────────────────────
  # If true, each weapon ID consistently uses the same attack message
  #   (gives each weapon a unique feel). If false, messages are randomized
  #   (more variety but weapons feel generic).
  # See _datafiles/combat-messages/* for message definitions.
  ConsistentAttackMessages: false

  # ── SKULLDUGGERY: LIGHT-CONDITIONAL SNEAK MODIFIERS ──────────────────────
  # Four-way conditional applied in CalcSneakScore(effectiveLit).
  # effectiveLit = room is lit OR observer has NightVision buff.
  #   beacon in darkness: sneaker emits light, room dark  → 0.5x  (very hard to hide)
  #   blend in:           sneaker emits light, room lit   → 0.85x (lit, but so is room)
  #   alert observers:    sneaker dark, room lit          → 0.9x  (harder to hide)
  #   baseline:           sneaker dark, room dark         → 1.0x  (best stealth)
  HiddenMoveStaminaMultiplier: 3.0  # Extra stamina cost multiplier for hidden movement
  SneakModEmitsLightDarkRoom: 0.5   # Beacon penalty: emitting light in a dark room
  SneakModEmitsLightLitRoom: 0.85   # Blend-in modifier: emitting light in a lit room
  SneakModNoLightLitRoom: 0.9       # Alert-observer modifier: dark sneaker in lit room

  # ── COMBAT: DARKNESS ───────────────────────────────────────────────────────
  # Multiplier on attack AND defense scores when fighting in a dark room
  # without nightvision. 0.80 = 20% penalty to hit and defend while blind.
  DarknessCombatPenalty: 0.80

  # ── COMBAT: DAMAGE ────────────────────────────────────────────────────────
  # Global panic buttons. 1.0 = no change. GlobalDamageMultiplier is
  # applied to ALL damage channels in CalcRawDamage().
  GlobalDamageMultiplier: 0.5  # Halved for chunk-4b-fixup smoke — let grapples develop before TTK
  GlobalDefenseMultiplier: 1.0
  #
  # Legacy unarmed knobs — still used by GetDefaultDistributionDamage()
  # for attack count and crit buff calculation. Actual unarmed damage is
  # controlled by UnarmedDamageMultiplier below.
  UnarmedBaseDamage: 2.0         # Legacy: base damage for attack count calc
  UnarmedStrengthDivisor: 25.0   # Legacy: Str / this = damage bonus
  UnarmedSkillDivisor: 10.0      # Legacy: UnarmedSkill / this = damage bonus
  UnarmedBaseVariance: 3.0       # Legacy: randomness of unarmed hits
  #
  # UnarmedDamageMultiplier: the "weapon multiplier" used when fighting
  # with bare fists. Works like a weapon's damage_multiplier field.
  # Also used as the fallback when a weapon has no multiplier set.
  # Example: Str 100, skill 0, MeleeDamageScale 0.05:
  #   raw = 100 × 1.0 × 0.30 × 0.05 = 1.5 (fists are weak)
  # A weapon with damage_multiplier 1.0 would do:
  #   raw = 100 × 1.0 × 1.0 × 0.05 = 5.0
  UnarmedDamageMultiplier: 0.30 # Tuned 39.2: fists are a last resort; 0.30 = ~1/3 of a basic weapon
  # UnarmedSpeedMultiplier: attack speed for unarmed combat.
  # Faster than weapons to compensate for dodge-only defense (no parry).
  UnarmedSpeedMultiplier: 1.8
  #
  # ── Per-Channel Damage Scales ──
  # All channels use the same formula:
  #   raw = stat × SkillMultiplier(rank) × itemMult × ChannelScale
  #
  # MeleeDamageScale: master knob for ALL physical (melee/ranged) damage
  #   for both players AND NPCs. Stats are ~100, so this directly sets
  #   the per-swing baseline at skill 0 with a 1.0x weapon.
  #   Examples at Str 100, skill 0, weapon 1.0x:
  #     0.05 →   5 raw damage per swing (current — low, needs MobDamageMultiplier)
  #     0.15 →  15 raw damage per swing
  #     0.30 →  30 raw damage per swing (original default)
  MeleeDamageScale: 0.52       # 2026-08-03: +20% (from 0.43) — player melee up to offset the 08-02 mitigation/crit fixes
  #
  # MobDamageMultiplier: extra multiplier applied ONLY to NPC melee
  #   damage. Lets you keep player damage low while making NPCs threatening.
  #   Example: MeleeDamageScale 0.05, MobDamageMultiplier 4.0:
  #     Player Str 100 → 100 × 1.0 × 1.0 × 0.05 = 5 raw (unchanged)
  #     Mob Str 100    → 100 × 1.0 × 1.0 × 0.05 × 4.0 = 20 raw
  MobDamageMultiplier: 0.83     # 2026-08-03: from 2.0 — nets mob melee to HALF its old value (0.52×0.83=0.43 vs old 0.43×2.0=0.86) after the 08-02 fixes made mobs hit much harder in practice
  #
  # SpellDamageScale: multiplier on ALL spell damage output (players + NPCs).
  #   1.0 = no scaling. Example at Wil 100, skill 0, spell mult 1.0:
  #     1.0 → 100 raw,  1.5 → 150 raw,  0.5 → 50 raw
  SpellDamageScale: 3.12        # 2026-08-03: doubled (from 1.56) — spells went from unmissable to resistible in the 08-02 hit/mitigation decoupling, so per-hit damage doubles to keep DPS. NOTE: also doubles NPC caster spells (no mob-spell-only knob exists)
  #
  # RhetoricDamageScale: multiplier on taunt/conviction damage output.
  #   Taunt uses itemMult 0.5 as base. Example at Cha 100, skill 0:
  #     1.0 → 50 raw,  2.0 → 100 raw
  RhetoricDamageScale: 3.0      # Bumped from 2.0; taunts need to be a real damage threat to justify the conviction cost
  #
  # SkillMultiplierBase/Max: controls how much skill rank affects damage.
  #   At rank 0 the multiplier is Base, at soft cap (50) it's Max.
  #   Curve: mult = Base + (Max - Base) × sqrt(rank / 50)
  #   Example: rank 0 → 1.0x, rank 12 → 1.98x, rank 25 → 2.41x, rank 50 → 3.0x
  SkillMultiplierBase: 1.0
  SkillMultiplierMax: 3.0
  # SkillWeight: Global multiplier on skill contributions in additive formulas
  # (hit rolls, defense scores, spell attack, etc.). Higher = skills matter more.
  #
  # Raised 2.0 -> 5.0 by roadmap chunk 5.11b. Measured: prod Meirok
  # (weapon-combat 69, the highest on the server) landed exactly
  # MinAttackHitChance against a 325g Elemental King. The 5.9 floor was the only
  # thing keeping him in that fight, because skill contributed +138 against the
  # King's Dexterity of 417.
  #
  # NOTE this is asymmetric in practice: defense score is ALSO
  # stat + skill*SkillWeight, and every mob has combat skill 1 (no skills block;
  # GetCombatSkillLevel floors at 1). So it lifts players on offense AND defense
  # while handing mobs +3 points. Deliberate. See tools/balance/matrix.py.
  SkillWeight: 5.0
  #
  # Crit damage (roadmap chunk 5.11g). critMult = base + perSkill * skillRank,
  # applied to a crit's pre-mitigation damage ON TOP of the mitigation bypass.
  # Skill 1 = 2.05x, 25 = 3.25x, 50 = 4.50x, 69 = 5.45x, 100 = 7.00x.
  #
  # Before 5.11g a crit was ONLY a mitigation bypass, so its worth was set
  # entirely by the defender's armor: 4x at the 75% cap, but exactly 1x (a
  # normal hit) against an unarmored target. Skill governed how often you crit
  # but not what a crit was worth.
  #
  # The curve is LINEAR, not the sqrt used by SkillMultiplier, and it does not
  # clamp at the skill soft cap. Both are deliberate: a sqrt curve puts rank 25
  # at ~75% of rank 69's value for 36% of the skill, which is the exact
  # complaint chunk 5.7 opened with. Applies to all three channels (melee,
  # spell, taunt), each using its own governing skill.
  #
  # NOTE: 0 is not expressible for either knob — both defaults are non-zero, so
  # the loader treats 0 as absent and falls back. To disable skill scaling, set
  # CritDamagePerSkill to a negligible value instead.
  CritDamageBase: 2.0
  CritDamagePerSkill: 0.05
  #
  # SurpriseOpeningStrikeMultiplier: extra multiplier on the opening strike of a
  # MELEE surprise attack, on top of the stacked combat-skill and skullduggery
  # crit multipliers. 1.0 = no change. Exists so the ambush can be retuned
  # WITHOUT moving CritDamageBase / CritDamagePerSkill, which are global.
  SurpriseOpeningStrikeMultiplier: 1.0

  # SurpriseRangedStrikeMultiplier: the ranged counterpart, touching the ranged
  # opening shot ALONE. Deliberately below the melee value: a shot answers one
  # fewer defence, and the opener already inherits RangedUnengagedDamageMultiplier
  # because it is unengaged by definition.
  SurpriseRangedStrikeMultiplier: 0.5

  # RangedUnengagedDamageMultiplier: ranged damage multiplier applied when
  # nothing in the room is targeting the shooter. 1.0 = no change. The archer's
  # compensation for firing once where melee swings up to four times per weapon,
  # and for reload sharing the special-move cooldown. Replaces the flat inflation
  # the bow damage_multiplier line used to carry.
  RangedUnengagedDamageMultiplier: 2.75
  #
  # Mitigation caps: maximum % damage reduction from armor for each channel.
  # 0.75 = armor can block at most 75% of incoming damage in that channel.
  PhysicalMitigationCap: 0.75
  MagicalMitigationCap: 0.75
  ConvictionMitigationCap: 0.75
  #
  # Avoidance damage multipliers: damage taken when successfully avoiding a spell or taunt.
  # 0.50 = take 50% damage on successful avoidance (half damage).
  SpellAvoidanceDamageMultiplier: 0.50     # Damage multiplier on successful spell deflection
  RhetoricAvoidanceDamageMultiplier: 0.50  # Damage multiplier on successful stoic resolve
  #
  # ── Resource Depletion Penalties ──
  # As HP/SP/CP drain, combat effectiveness gradually decreases.
  # Formula: mult = 1 - maxPenalty × (1 - ratio)^curve
  #
  # ResourcePenaltyCurve: exponent controlling curve shape. Higher values
  #   make the penalty kick in later (closer to empty). At 2.0:
  #     100% resource → 0% penalty      50% → 7% penalty
  #      25% resource → 16% penalty      5% → 25% penalty
  #       0% resource → 28% penalty (= maxPenalty)
  ResourcePenaltyCurve: 2.0
  #
  # Per-pool max penalty (at 0% resource). Each pool affects different things:
  #   Health    → melee damage output (wounded = weaker swings)
  #   Stamina   → attack count + melee hit rate (exhausted = slower/sloppier)
  #   Conviction → taunt hit/damage + spell damage (demoralized = weaker magic)
  HealthPenaltyMax: 0.28         # At 0% HP: melee damage reduced by 28%
  StaminaPenaltyMax: 0.28        # At 0% SP: attacks/hit rate reduced by 28%
  ConvictionPenaltyMax: 0.28     # At 0% CP: taunt/spell reduced by 28%

  # ── Chunk 4e: Third-party interference ───────────────────────────────────
  ControlDegradeOnOutsideHit: true     # chunk 4e §5; set false to disable 3rd-party hit → controller ControlLevel drift
  SubInterruptDamageThresholdPct: 0.10  # chunk 4e §7; 10% of max HP triggers sub interrupt. Set 0 to disable threshold path (crit-only).

  # ── Grapple Control Axis (chunk 4b — per-round drift mechanics) ──────────
  # See docs/superpowers/specs/2026-05-16-state-chunk-4b-position-control-axis-design.md
  # Penalty curves are deliberately steeper than the combat ResourcePenalty
  # knobs above — grappling cardio-stresses faster than stand-up fighting.
  GrappleStaminaPenaltyMax: 0.60        # Max roll-mult reduction at 0% stamina
  GrappleStaminaPenaltyCurve: 1.5       # Exponent — higher = steeper near 0% stamina
  GrappleEncumbrancePenaltyMax: 0.80    # Max roll-mult reduction at "crushed" encumbrance
  GrappleEncumbrancePenaltyCurve: 1.5   # Exponent — higher = steeper near max
  GrappleStaminaCostPerRound: 2         # Ongoing base before role, load, and Unarmed Combat skill
  GrappleControllerCostMultiplier: 1.0  # Controller base multiplier (2 × 1.0 before shared cost calculation)
  GrappleControlledCostMultiplier: 2.0  # Controlled base multiplier (2 × 2.0 before shared cost calculation)
  GrappleStaminaLowThreshold: 0.25      # Stamina fraction below which "you're getting gassed" fires once per grapple
  PositionConsistencyCheckRounds: 10    # How often the periodic invariant checker runs

  # ── Reach Utility Curve (chunk 4c — weapon reach vs grapple radius) ────────
  # Long weapons (spears, longswords) take a damage penalty when the attacker
  # is grappling. Short weapons (daggers, fists) stay effective. The radius
  # (meters) defines the space available in each grapple class; weapons whose
  # reach exceeds the radius are penalized (radius/reach, floored at
  # reach_utility_floor). See internal/combat/reach.go for formula details.
  reach_standing_grapple_radius: 0.5  # Clinch / BackStanding: ~chest-to-chest
  reach_ground_grapple_radius: 0.3    # Ground grapples: body-on-body distance
  reach_utility_floor: 0.15          # Floor: even a pike can still poke (hilt-strike)

  # ── Chunk 4d: Submission tick ─────────────────────────────────────────────
  # Per-round opportunistic submission attempts gated on the chunk-4b
  # control-axis drift roll. See spec
  # docs/superpowers/specs/2026-05-18-state-chunk-4d-submission-rework-design.md
  submission_attempt_alpha: 1.0          # Drift margin (std devs) that opens a sub window for the winning side
  submission_attempt_crit_z: 2.0         # Defender-crit shortcut for bottom-sub windows
  sub_skill_weight: 1.5                  # Unarmed-combat skill weight in the sub roll
  sub_bad_z_threshold: -1.0              # Sub roll z < this → attempter falls prone, pair breaks
  sub_crit_z_threshold: 2.0              # Sub roll z >= this → recipient stunned next round
  sub_gold_loss_fraction: 0.20           # Fraction of carried gold transferred on subdue/cripple
  broken_limb_buff_duration: 900         # Rounds (~60 min of play at 4s rounds); expires naturally

  # ── REGEN RATES (fraction of pool max per tick; 0.01 = 1%) ────────────────
  PlayerHealthRegenPct: 0.02     # Bumped from 1% to 2%; players needed faster recovery
  PlayerStaminaRegenPct: 0.02    # Tuned 39.2: doubled from 0.01; fights felt too exhausting at 1%
  PlayerConvictionRegenPct: 0.02  # Bumped to 2% to match health/stamina regen rates
  MobHealthRegenPct: 0.01        # NPC HP regen per tick (1% of HealthMax)
  MobStaminaRegenPct: 0.02       # NPC stamina regen per tick (raised to match players)
  MobConvictionRegenPct: 0.02    # NPC conviction regen per tick (raised to match players)

  # ── STAMINA & CONVICTION ────────────────────────────────────────────────────
  # SneakBaseStaminaCost is the configured base before load and Skullduggery.
  #   A detected attempt currently has no additional failure cooldown.
  SneakBaseStaminaCost: 2.5
  # MovementBaseStaminaCost: stamina spent per room move on normal terrain,
  #   BEFORE the encumbrance and inverse-skill multipliers and before the
  #   terrain multiplier. Lowered from 2.0 to 0.5 by U7. This is not a nerf
  #   reversal: travelling light now costs LESS than it used to, while
  #   travelling near your carrying limit costs a great deal more. The point of
  #   the move was to make load, rather than distance, the thing that tires you.
  #
  #   Terrain still multiplies on top, so a swamp remains dearer than a road.
  MovementBaseStaminaCost: 0.5
  # MovementMaxStaminaCost: ceiling for any single move, regardless of terrain.
  MovementMaxStaminaCost: 20.0
  # MovementSearchTrainChance: chance that one successful move records a use of
  #   the search skill, which is what gives movement its inverse-skill
  #   discount. Deliberately tiny. Search is already easy to train through
  #   forage and other mechanics, and a generous rate here would make every
  #   player a grandmaster searcher purely by walking around, with every other
  #   skill lagging behind. Set to 0 for the default; set NEGATIVE to disable
  #   the training entirely.
  MovementSearchTrainChance: 0.005
  #
  # AttackBaseStaminaCost: what ONE swing costs before multipliers, armed or
  #   unarmed alike. It replaces UnarmedAttackStaminaCost (retired at 4), which
  #   priced only bare hands and left weapons to an item field. Charged PER
  #   SWING: a fast fighter throwing several blows in a round now pays for all
  #   of them, where the old code charged once per round no matter how many
  #   times you struck.
  AttackBaseStaminaCost: 1.0
  # AttackCostModifier: attacking's per-action modifier, the counterpart of the
  #   three defence modifiers above. It ships NEUTRAL at 1.0 on purpose: it is
  #   the reference the defence modifiers were tuned against, so dodge costing
  #   a quarter more than a swing is a statement about dodge, not about
  #   attacking. Raise it to make trading blows dearer than turning them
  #   aside, which would push the game toward defensive play.
  AttackCostModifier: 1.0

  # ── RESOURCE MAXIMUMS ───────────────────────────────────────────────────────
  # Formulas:
  #   HealthMax     = HealthBase + Vit x HealthPerVitality + Str x HealthPerStrength
  #   StaminaMax    = StaminaBase + Vit x StaminaPerVitality + Wil x StaminaPerWillpower
  #   ConvictionMax = ConvictionBase + Cha x ConvictionPerCharisma + Wil x ConvictionPerWillpower
  #
  # Restored 2026-08-02 to the intended design: each pool has one primary
  # stat (x3) and one secondary (x1). The previous values had drifted while
  # being tuned against compressed output — HealthMax is a StatInfo, so
  # Recalculate() was silently shrinking every pool by roughly 40%. Pools
  # are larger now; this is accepted, and NPCs use the same formulas.
  HealthBase: 5                  # Flat HP before stat contribution
  HealthPerVitality: 3           # + Vit x this toward HealthMax (primary)
  HealthPerStrength: 1           # + Str x this toward HealthMax (secondary)
  StaminaBase: 5                 # Flat stamina before stat contribution
  StaminaPerVitality: 3          # + Vit x this toward StaminaMax (primary)
  StaminaPerWillpower: 1         # + Wil x this toward StaminaMax (secondary)
  StaminaPerStrength: 0          # Strength does not contribute to stamina
  ConvictionBase: 5              # Flat conviction before stat contribution
  ConvictionPerCharisma: 3       # + Cha x this toward ConvictionMax (primary)
  ConvictionPerWillpower: 1      # + Wil x this toward ConvictionMax (secondary)

  # ── PROGRESSION ─────────────────────────────────────────────────────────────
  # Skills and stats improve through use, but how HARD they are to improve is
  # keyed to how far they have already come, not to how often they have been
  # used. A stat's rank is its trained points; a skill's rank is its level.
  # Chance decays exponentially as rank approaches the soft cap.
  #
  # Keying on use counts punished frequency: a stat you used constantly
  # exhausted its curve while one you used rarely stayed cheap forever. It also
  # leaked equipment into difficulty, because the old anti-exploit floor read
  # the final stat VALUE, which includes gear.
  SkillSoftCap: 50               # Skill level at which progression slows sharply
  # NOT a cap on stat values, and no longer an anti-exploit floor: rank IS the
  # trained points, so a high value cannot buy a cheap rank.
  # A fresh stat is ~27% per use (0.12 x 2.25); at 50 trained points, ~1.3%.
  StatProgressionSoftCap: 50     # Trained points at which stat progression slows sharply
  # Retained as TELEMETRY only. Use counters are still recorded in saves and
  # shown on the admin dashboard, but they no longer feed the progression curve.
  UsesPerRank: 25                # Legacy: uses per virtual rank (no longer drives decay)
  BaseProgressionChance: 0.12    # Chance to progress per check at rank 0 (12%)
  StatProgressionRate: 2.25      # 6e: ~2.25x STAT progression (skills unaffected)
  ProgressionDecayBelowCap: 3.0  # Exponential steepness below soft cap (higher = faster decay)
  ProgressionDecayAboveCap: 2.0  # Exponential steepness above soft cap
  # Smallest chance a stat or skill roll may present. Below this a stat is not
  # slow, it is SEALED: the roll quantises to zero and can never fire again.
  # Two of Meiroks six stats were in that state (strength 3.98e-05, dexterity
  # 9.25e-12) before this existed. Does NOT apply to regen progression, whose
  # chance is meant to vanish as the pool fills.
  ProgressionChanceFloor: 0.00001
  # CritProgressionBonus: multiplier on the progression roll for whichever side
  # DID the crit or the fumble. Failure teaches, so a fumble pays it too.
  # Raising it makes exceptional moments the main way characters improve;
  # lowering it makes progression purely a function of repetition. 0 turns
  # bonus progression off entirely and is a legal value.
  CritProgressionBonus: 2.0
  # ObservedCritProgressionBonus: multiplier for the side that RECEIVED the crit
  # or fumble rather than causing it. Deliberately well below
  # CritProgressionBonus: observing is worth strictly less than doing. This is
  # also the rate at which being critically hit toughens you, which before U9
  # was a flat rate that never decayed with rank. 0 is a legal off-switch.
  ObservedCritProgressionBonus: 0.5
  # ProgressionFailureFraction: how much of a full progression event a LOST
  # resolved action awards. One resolved action produces one progression event,
  # for the single highest-rolling candidate skill, at full weight when the
  # action wins and at this fraction when it loses. Raise it toward 1.0 to make
  # losing almost as good a teacher as winning; lower it toward 0 to make only
  # success train you.
  # 0 is a legal off-switch: a lost action then teaches nothing at all.
  # Omitting the key entirely still gets 0.35, not 0.
  ProgressionFailureFraction: 0.35

  # ── PER-STAT PROGRESSION MULTIPLIERS ────────────────────────────────────────
  # Scales the progression chance for each stat independently.
  # 1.0 = normal rate. Dexterity is 0.5 because weapon-combat and
  # unarmed-combat both map dexterity as their primary stat, firing
  # OnStatUse("dexterity") multiple times per combat round.
  StatProgressionMultipliers:
    # Solved on measured play-time rates, U10b-1 Task 23.
    # Regenerate with `python tools/balance/u10b1_solve_v4.py`.
    # v3 is superseded: it read the HIT rate as the CLEAN-HIT rate, and it
    # predates the Best-of firing convention.
    strength: 1.11
    # dexterity is still the fastest-firing stat, but far less so than it was:
    # the firing convention caps it at TWO rolls per round (one attacker award,
    # one defender award) where it used to collect the attacker gain, both
    # weapon entries and a flat +2 from defence. Its rate fell to ~0.36x, so the
    # multiplier rises to hold the same points per hour.
    #
    # Solved at BARE HANDS as of 2026-08-27. Dexterity is the primary stat on
    # BOTH sides of a bare-handed round (unarmed-combat attacking, dodge
    # defending), so the build that maximises unarmed-combat maximises dexterity
    # too. Adding that build moved this from 0.34; it is a 6% trim and well
    # inside the J inputs' noise, kept only because every other track in the
    # solver is solved at concentration and this one now can be.
    dexterity: 0.32
    # perception after Phase D unhooked look/consider. Its feeders are now
    # forage/search, the perception crafts, salvage and ranged-combat. Barely
    # moved by U10b-1 (~1.03x): its feeders were success-only and now pay a
    # fraction on a loss, which is a small gain, not a reshape.
    perception: 0.43
    # Vitality was retuned by the U10b-0 vitality slice, not by the Phase D
    # solver: its faucets are the regen damper and the crit-toughen path, and
    # neither is a uses/hour track, so the solver has no row for it.
    vitality: 2.2    # was 4.5. Solved against the damage-taken faucet added by
                     # the slice (tools/balance/u10b_vitality_solve.py). Scales
                     # BOTH the regen and crit-toughen paths, whose bases differ
                     # 13.5x, so it cannot be tuned for one without the other.
    willpower: 1.70
    # charisma has no direct player faucet; it is the primary stat behind
    # rhetoric, bartering and manifestation.
    charisma: 0.75

  # ── PER-SKILL PROGRESSION MULTIPLIERS ───────────────────────────────────────
  # Overrides the hardcoded skill progression multipliers in skills.go.
  # Combat skills fire many times per round (low mult), utility skills
  # fire rarely (high mult). Only skills listed here override the defaults.
  SkillProgressionMultipliers:
    # Solved on measured play-time rates, U10b-1 Task 23.
    # Regenerate with `python tools/balance/u10b1_solve_v4.py`.
    # v3 is superseded: it read the HIT rate as the CLEAN-HIT rate, and it
    # predates the Best-of firing convention.
    # MUST stay in sync with SkillProgressionMultipliers in internal/skills/skills.go
    # -- that Go map is what every test binary sees, since tests never load this file.
    #
    # unarmed sits BELOW weapon deliberately, and the gap WIDENED under the
    # firing convention. Each is solved at its OWN concentrating build, and for
    # unarmed-combat that build is BARE HANDS, which was missing from the solver
    # until 2026-08-27. Two empty hands swing two fist entries; those fold into
    # ONE unarmed-combat candidate, so it wins the attacker Best-of every single
    # round. Eight swings make its clean hit near-certain (0.98), and the
    # dodge-only equipment gate on unarmed style hands it the WHOLE defence
    # award rather than dodge's 83.6% share. That is 1.74 events per engaged
    # round against a shield build's 0.93.
    #
    # It was previously solved at 1H+fist, a build an unarmed grinder would
    # never choose, and on a share (the fist winning two rounds in three) that
    # assumed both hands rolled off the SAME skill term. The offhand fix ended
    # that assumption; the missing bare-handed build was the larger error, and
    # together they moved this from 1.01 to 0.72.
    weapon-combat: 1.34
    unarmed-combat: 0.72
    # These share ONE 4-round "special-move" key with 15 other verbs, so a
    # concerted grinder gets ~22.5 uses/hour between them, not each. ranged-combat
    # joins indirectly: firing is ungated but reload is, and a weapon must be
    # loaded to fire.
    ranged-combat: 6.88
    spellcasting: 2.99
    rhetoric: 6.88
    # Assumes the Phase D conjure cooldown. Without it manifestation runs at
    # 225/hr standing still and this over-rewards it ~9x.
    manifestation: 5.13
    # search is anchored on forage's 6-round cooldown at 100% engagement, NOT on
    # the `search` command, which is anti-botting-gated and cannot be ground.
    search: 1.02
    # bartering assumes the Phase D per-transaction fix; awarding per unit made
    # it unbounded in time and unfittable.
    bartering: 2.07
    skullduggery: 1.23
    salvage: 2.80
    # Crafts at 40% engagement: an hour of crafting is gather THEN craft.
    blacksmithing: 1.56
    alchemy: 1.56
    tailoring: 1.56
    cooking: 1.56
    jewelcrafting: 1.56
    enchanting: 1.56

  # ── SALVAGE ────────────────────────────────────────────────────────────────
  SalvageMinChance: 0.15      # Per-ingredient recovery chance at skill 1
  SalvageMaxChance: 0.85      # Hard cap on per-ingredient chance
  SalvageSoftCap: 50          # Skill level where curve flattens
  SalvageGoldPerRound: 10     # Ingredient gold value per salvage round
  SalvageMaxRounds: 5         # Maximum salvage duration

  # ── SHOP ECONOMY ──────────────────────────────────────────────────────────
  ShopBuyRatio: 0.50            # NPC buy offer = baseValue * BuyRatio * scarcityMult
  ShopPriceFloor: 0.25          # Minimum scarcity multiplier (overstocked)
  ShopPriceCeiling: 5.0         # Maximum scarcity multiplier (out of stock)
  ShopAbundanceThreshold: 3.0   # Stock/restock ratio where price hits floor
  ShopMaterialReserve: 1        # Units a crafter reserves per material before selling
  # Per-ingredient stock-reserve floor for crafter mobs. The crafter will
  # not consume an ingredient if doing so would drop its current stock below
  # MaxStock × CrafterIngredientReservePct (or 1, whichever is higher).
  # Default 0.25 keeps at least 25% of each ingredient available for players.
  CrafterIngredientReservePct: 0.25
  ShopGoldReserveRatio: 0.50    # Fraction of gold pool kept in reserve before buying
  MobUpgradeGoldReserve: 50     # Gold a shopping mob keeps in reserve (5.3)
  MobUpgradeMinDelta: 1.0       # Min itemvalue delta worth buying (5.3)
  ShopMaxStockMultiplier: 2.0   # Chunk 3.8: global 2x cap on EffectiveMaxStock to give caravan room to build cross-city surplus
  ShopOverstockDecayRounds: 21600  # Rounds above-baseline non-material stock must sit un-grown before 1 unit decays (~several in-game days)
  ShopOverstockDecayQty: 1         # Units removed per overstock decay fire
  BarterMaxDiscount: 0.15       # Max fractional buy-price discount from bartering
  BarterMaxBonus: 0.15          # Max fractional sell-price bonus from bartering

  # ── STORAGE FEES ───────────────────────────────────────────────────────────
  StorageFeePerItem: 1               # Gold charged per stored item per game month

  # ── WAREHOUSES (Stage 3 ferry system) ─────────────────────────────────────
  WarehouseItemCap: 4000000     # Per-item stock cap in city warehouses (effectively unbounded reserves)
  WarehouseAccrualHours: 2      # Game-hours between ambient accrual ticks

  # ── CRAFTER MOBS ─────────────────────────────────────────────────────────
  # Per-rarity-tier restock cadences (game-time). Replaces the single
  # CrafterMaterialRestockRate. Common items refill quickly so
  # crafting grinders have stock; rare items refill slowly as a
  # backstop above forager/player-sale input.
  RestockCadenceTier50Hours: 1   # game-hours
  RestockCadenceTier40Hours: 2
  RestockCadenceTier30Hours: 6
  RestockCadenceTier20Hours: 24
  RestockCadenceTier10Days:  5   # game-days
  CrafterEnabled: true            # Enable mob autonomous crafting
  CrafterMaterialRestockRate: 75  # Rounds between restock/craft ticks (~5 min)

  # ── QUEST ENGINE ──────────────────────────────────────────────────────────
  QuestLogLevel: verbose        # verbose, medium, minimal
  QuestChainDepthLimit: 10      # max chained grant evaluations per event
  QuestPerformanceWarnMs: 50    # warn if trigger evaluation exceeds this (ms)

  # ── MOB PROGRESSION ──────────────────────────────────────────────────────────
  # When enabled, mobs gain stats and skills through combat just like players.
  # Mobs that survive longer become more dangerous. Progression resets when
  # the mob dies and respawns from its template.
  MobProgressionEnabled: true
  # How fast mobs progress relative to players. This multiplies the base
  # progression chance. At 0.5, mobs have half the chance per combat action
  # to gain a stat or skill point compared to a player doing the same action.
  # Range: 0.01-1.0. Lower = slower mob growth. 1.0 = same rate as players.
  MobProgressionRate: 0.5
  # Hard ceiling on any single stat a mob can reach through progression.
  # Prevents runaway growth if a mob survives many fights. The mob's base
  # stat from its template StatPool is NOT counted against this cap -- only
  # the final computed stat value matters. Default 200 (double human baseline).
  MobStatCap: 200
  # MobStatTrainingCap caps how many points a mob may GAIN per stat, which is
  # what MobStatCap should always have done. The value cap above is asymmetric:
  # a mob authored at base 250 can gain nothing while one at 180 can gain 20,
  # purely because of how big it was written. Since U10b-0 Phase C a mob's
  # Training is gains-since-spawn, exactly as a player's is, so capping gains
  # treats every creature the same regardless of its authored size.
  MobStatTrainingCap: 50
  # Maximum skill level a mob can reach through use-based progression.
  # Player soft cap is 50; mobs are intentionally much lower since they
  # fight constantly. At rank 3, the SkillMultiplier curve gives ~1.77x
  # damage -- meaningful but not overwhelming. Range: 1-50.
  MobSkillCap: 3
  # MobSkillSoftCap / MobSkillTrainingCap supersede MobSkillCap above.
  #
  # The old cap of 3 was reachable in roughly 180 rounds of fighting, so any
  # long-lived creature hit its ceiling and stopped. These raise it: mobs decay
  # against their own soft cap (they fight far more often than players, so the
  # shared 50 leaves them flat too long) and stop at the hard cap.
  #
  # This is a CEILING, not a starting point. Every mob begins at skill 1, and
  # at shipped pacing reaching 10 takes ~1,500 combat rounds and 25 takes
  # ~17,500. An ordinary mob dies long before that and respawns at 1, so in
  # practice the raise lands on companions and other creatures that persist
  # and fight constantly. Skill progression cannot survive death: the instance
  # file is deleted in the death pipeline.
  #
  # At rank 25 a mob's damage multiplier is 2.41x (vs 1.49x at 3) and its
  # contest contribution is +125 (vs +15). To walk the raise back, lower
  # MobSkillTrainingCap -- not the multiplier curve, which players share.
  MobSkillSoftCap: 20
  MobSkillTrainingCap: 25

  # ── REGEN-BASED STAT PROGRESSION ──────────────────────────────────────────
  # Every regen tick (every 3 rounds), each resource pool (HP, SP, CP) has
  # a small chance to trigger stat progression based on how depleted it is.
  # This replaces the old hard 25%-threshold system. The chance follows a
  # smooth curve: nearly zero when the pool is full, rising as it empties.
  #
  # Formula: chance = RegenProgressionBase × (1 - currentPct) ^ RegenProgressionCurve
  #
  # Each pool maps to two stats:
  #   Health    → Vitality, Willpower   (enduring injury toughens body + mind)
  #   Stamina   → Strength, Vitality    (exertion builds power + endurance)
  #   Conviction→ Willpower, Charisma   (mental strain sharpens will + presence)
  #
  # The existing StatProgressionMultipliers (above) apply on top of this,
  # so per-stat tuning is still available. Mob progression uses MobProgressionRate.
  #
  # RegenProgressionBase: Maximum chance per stat per tick when the pool is
  #   at 0%. At the default 0.01 (1%), a character sitting at 0% HP would
  #   have a 1% chance per tick (every 3 rounds) to gain Vitality and a
  #   separate 1% chance to gain Willpower. Higher = faster stat gains from
  #   resource depletion. Range: 0.001 to 1.0.
  RegenProgressionBase: 0.01
  # RegenProgressionCurve: Controls how steeply the chance ramps up as the
  #   pool empties. Higher values mean the chance stays near zero until the
  #   pool is very low, then spikes. Lower values spread the chance more
  #   evenly across the depletion range.
  #   - 1.0 = linear (50% pool = 50% of max chance)
  #   - 2.0 = quadratic (50% pool = 25% of max chance)
  #   - 3.0 = cubic (50% pool = 12.5% of max chance)  ← default
  #   - 5.0 = very steep (almost nothing above 50% pool)
  #   Range: 0.5 to 10.0.
  RegenProgressionCurve: 1.5

  # - DamageProgressionThresholdPct -
  # Fraction of a pool's REACHABLE max (raw minus reservation) that a single
  # hit must remove to train that pool's stats. Health trains vitality and
  # willpower, stamina trains strength and vitality, conviction trains
  # willpower and charisma -- the same mapping regen uses, so a taunt (which
  # damages conviction) is a faucet for free.
  #
  # The gate exists so parking in a zone that cannot hurt you and leaving the
  # keyboard cannot farm progression off chip damage. 5%% is generous: the mean
  # landed hit removes about 45 against a ~425 health pool, roughly twice this.
  DamageProgressionThresholdPct: 0.05

  # ── COSTS: THE SHARED CURVES (U7) ───────────────────────────────────────────
  # Every action in the game is priced by one formula:
  #
  #   cost = base x encumbrance x inverseSkill x perActionModifier
  #
  # The base is per action and lives with that action's own knobs above. The
  # three multipliers are shared, and this is where they are shaped. Changing
  # anything in this block moves the price of EVERY action at once, so treat a
  # change here as a modelled retune rather than a nudge.
  #
  # Note the multipliers apply differently by action kind: encumbrance touches
  # PHYSICAL actions only (a heavy pack does not make an act of will harder),
  # while the inverse-skill discount applies to any action with a skill behind
  # it, physical or not.

  # INVERSE-SKILL MULTIPLIER. Runs OPPOSITE to the familiar skill curve: a
  #   practised fighter spends less on the same action than an untrained one.
  #   Two straight segments joined at CostSkillMidRank, flat below rank 0 and
  #   flat at or above CostSkillCapRank.
  #
  #   The midpoint is deliberately NEUTRAL at 1.00, which makes rank 25 the
  #   line where an action costs exactly its base. Below it you pay a small
  #   penalty, above it you earn a real discount. That keeps the novice
  #   penalty mild (a beginner should feel unskilled, not punished) while
  #   letting mastery matter: at the cap an action costs well under half.
  #
  #   0 is NOT a usable value for any of these five. Each is replaced by its
  #   default at load if left at or below 0, and the two rank fields if left
  #   below 1. CostSkillCapRank must exceed CostSkillMidRank; that is enforced
  #   at load, not merely documented.
  CostSkillMultAtZero: 1.10
  CostSkillMultAtMid: 1.00
  CostSkillMultAtCap: 0.40
  CostSkillMidRank: 25
  CostSkillCapRank: 100

  # ENCUMBRANCE MULTIPLIER. Prices carried weight into physical actions. Two
  #   straight segments joined at the knee: gentle from empty up to the knee,
  #   steep from the knee to full capacity, flat at or beyond capacity.
  #
  #   The knee is the whole design. Below it a player should not have to think
  #   about weight at all, so the climb to 1.5 across three quarters of the
  #   range is barely perceptible. Above it the cost triples across the last
  #   quarter, which is what turns "carry everything" from the obvious choice
  #   into a real decision. Lowering CostEncumbranceKnee makes the game
  #   punish hoarding much earlier and is the single most disruptive value in
  #   this block.
  CostEncumbranceKnee: 0.75
  CostEncumbranceKneeMult: 1.5
  CostEncumbranceMax: 5.0

  # COMPOSED-TOTAL CEILING. Clamps the PRODUCT of the three multipliers, not
  #   each one in turn. Clamping them individually still lets a full
  #   encumbrance penalty, a novice penalty and a dodge premium stack to
  #   nearly seven times base, which a laden beginner simply cannot pay, and a
  #   cost nobody can pay does not read to the player as expensive. It reads
  #   as everything failing for no stated reason. The action's base price sits
  #   OUTSIDE this ceiling, so raising a base still raises the final cost.
  CostTotalMultiplierMax: 6.0

  # ── CHARACTER CREATION ──────────────────────────────────────────────────────
  # Stats are rolled as a normal distribution, clamped to [Min, Max].
  # Example: mean 100, stddev 15 → ~68% of rolls land in 85–115,
  #   ~95% in 70–130. Min/Max hard-clamp outliers.
  StatRollMean: 100.0            # Center of the bell curve
  StatRollStdDev: 15.0           # Width of the bell curve
  StatRollMin: 85.0              # Hard floor (no stat below this)
  StatRollMax: 115.0             # Hard ceiling (no stat above this)
  StartingHealth: 10             # HP assigned at creation (before stat-based HealthMax)

  # ── CRAFTING ────────────────────────────────────────────────────────────────
  # Formula: chance = clamp(Base + (skillLevel - recipeMinimum) × BonusPerLevel, Min, Max)
  # Example: skill 5, recipe min 3, base 50, bonus 5:
  #   chance = clamp(50 + (5-3)×5, 5, 95) = 60%
  CraftingBaseSuccessChance: 50  # % chance before skill adjustment
  CraftingSkillBonusPerLevel: 5  # +% per skill level above recipe minimum
  CraftingMinSuccessChance: 5    # Floor — never below this %
  CraftingMaxSuccessChance: 95   # Ceiling — never above this %

  # ── CRAFT DIFFICULTY (U10b-1b) ────────────────────────────────────────────
  # Craft is an ordinary contest. The crafter scores
  #   primaryStat + craftSkill × SkillWeight
  # against a difficulty of
  #   (CraftBaseDifficulty + recipe.SkillMinimum × CraftSkillMinWeight) × materialTierMult
  #
  # The primary stat differs by discipline: blacksmithing reads strength,
  # alchemy/cooking/enchanting perception, tailoring/jewelcrafting dexterity.
  #
  # CraftBaseDifficulty is 100 because 100 is the human stat baseline, so a
  # baseline crafter holding exactly the recipe minimum is a coin flip. That
  # reproduces CraftingBaseSuccessChance above with no special case.
  CraftBaseDifficulty: 100
  CraftSkillMinWeight: 5

  # The mercy band, replacing the Min/Max clamps above and the salvage pair.
  # Both clamps are symmetric about 50%, so each is exactly a contest floor.
  #
  # Do NOT set either to 0. A 0 floor deletes the band rather than disabling a
  # nicety, and uncapped salvage is the dangerous half: at salvage skill 50 the
  # craft-then-salvage loop would retain about 99.9% of materials against 80.75%
  # today, roughly a 250x cut to the crafting material sink.
  # Material tier band. items.MaterialTierMultiplier spreads the five authored
  # buckets evenly between these: 0.95 / 0.975 / 1.0 / 1.025 / 1.05.
  #
  # Narrowed from 0.75-1.25 on 2026-08-28. The tier term is SCALE-INVARIANT, so
  # it shifts every recipe by the same amount regardless of skill or stat. At the
  # old width it outweighed nine levels of mastery, and on a skill_minimum 65
  # recipe it pushed the 50/50 point out to 86 -- past the skill soft cap of 50.
  # At this band the worst case is about four levels, which is what a modifier on
  # a difficulty SkillMinimum already carries should be.
  MaterialTierMultiplierMin: 0.95
  MaterialTierMultiplierMax: 1.05

  CraftFloor: 0.05
  SalvageFloor: 0.15

  # ── RECIPE DISCOVERY ──────────────────────────────────────────────────────
  # Chance to learn a new recipe on a successful craft.
  # Formula: chance = BaseChance / (1 + knownRecipes × DecayRate)
  # Example: base 10%, decay 0.1, 5 recipes known:
  #   chance = 10 / (1 + 5×0.1) = 6.7%
  RecipeDiscoveryBaseChance: 10.0
  RecipeDiscoveryDecayRate: 0.1

  # ── MUTATIONS ───────────────────────────────────────────────────────────────
  # Mutations are combat-earned abilities that grow through fighting.
  # Progress needed for the Nth mutation: BaseProgress × ProgressScale^(N-1)
  #   Example: base 50, scale 1.5:
  #     1st mutation: 50 progress,  2nd: 75,  3rd: 112.5,  4th: 168.75
  MutationBaseProgress: 30.0         # was 15 in 6e (~8x w/ 2x/round); dialed back to ~4x of the pre-6e 60 — faster than original but not overboard (retest: a newbie earned 2 mutations in one dummy-grind). PROVISIONAL, tune in playtest.
  MutationProgressScale: 1.5         # Each additional mutation costs Scale^n more
  MutationMaxCount: 8                # 6e: room for a full cluster spine + apex + a splash
  MutationMaxLevel: 4                # Max level any single mutation can reach (1–4)
  MutationDeepenChance: 0.70         # Probability of deepening vs new when both possible (0.0-1.0)
  MutationProgressGainPerRound: 2.0  # 2x/round; combined with BaseProgress 30 = ~4x the pre-6e acquisition speed
  # Mutation graph (drift + Body<->Belief opposition)
  MutationAffinityPerSkillUse: 0.5    # Drift affinity gained per cluster-relevant skill use (halved so reaching high tiers takes sustained play, not one fight)
  MutationAffinityPerCombatEvent: 0.5 # 6e: drift from tanking/dodging/controlling in combat (halved alongside PerSkillUse)
  MutationAffinityPerRarity: 2.0      # Coefficient of the QUADRATIC depth gate (threshold = rarity^2 * this): r3 entry ~18, r6 ~72, r8 bridge ~128, r9 apex ~162. Spreads the journey so apex/bridge powers (Extra Arms) need many fights of dedicated drift, not one. PROVISIONAL, tune in playtest.
  MutationAffinityDecay: 0.98         # Per-event multiplicative decay of cluster affinity (0.0-1.0)
  MutationBodyConvictionDecayMax: 0.9 # Max fraction of ConvictionMax lost to deep Body commitment
  MutationBeliefGearDecayMax: 0.9     # Max fraction of gear effectiveness lost to deep Belief commitment
  MutationPoleDecayRef: 60.0          # Pole-depth at which opposition decay reaches half its max
  MutationLevel2Multiplier: 1.6      # 6e: non-linear curve — a clear step at level 2
  MutationLevel3Multiplier: 2.5      # 6e: a bigger step at level 3
  MutationLevel4Multiplier: 4.0      # 6e: dramatic max-rank payoff for deep investment

  # ── SPELLCASTING ──────────────────────────────────────────────────────
  # Spell discovery: chance to learn a new spell on a successful cast.
  # Formula: chance = BaseChance / (1 + knownSpells × DecayRate)
  # Example: base 5%, decay 0.1, 3 spells known:
  #   chance = 5 / (1 + 3×0.1) = 3.8%
  SpellDiscoveryBaseChance: 5.0
  SpellDiscoveryDecayRate: 0.1
  DiscoveryPerceptionScale: 200.0
  DiscoverySkillScale: 100.0
  DiscoveryMaxDecayOffset: 0.8
  # U10b-3: a spell's difficulty IS its discovery skill minimum, the spell-side
  # equivalent of a recipe's skill_minimum. Required skill = ceil(difficulty x
  # this), so at 1.0 a difficulty-45 spell needs spellcasting (or, for
  # manifestation spells, manifestation) 45.
  #
  # This REPLACED a base_folds ladder. Folds measure how long and involved a
  # cast is, not how hard a spell is to learn, and the two diverge in the
  # authored content: Core Discharge and Core Drain are difficulty 45 at 2
  # folds, so a spellcasting-0 novice could discover both, while Charm at 36
  # folds sat above the ladder's ceiling of 32 and was undiscoverable by anyone.
  #
  # There is deliberately NO 0 off-switch (the guard is `<= 0`), because an
  # absent key reading as 0 would silently ungate spell discovery entirely. To
  # relax the gate, set a small ratio: 0.01 puts a difficulty-75 spell at skill 1.
  SpellDiscoverySkillPerDifficulty: 1.0
  # U10b-3: how strongly difficulty biases WHICH candidate a successful
  # discovery roll draws. Weight = 1 / (1 + difficulty x this), so at 0.02 a
  # difficulty-50 candidate surfaces about half as often as a difficulty-0 one
  # sharing its pool. Nothing is excluded: the skill gate above decides what you
  # can find at all, and this only shades what you find first. Kept mild on
  # purpose, because skill should dominate discovery.
  DiscoveryDifficultyWeightScale: 0.02
  #
  # The spell-initiation gate was DELETED (roadmap U0, 2026-08-12), along with
  # SpellInitiationBase and SpellInitiationSkillFactor. It clamped at 95 while a
  # maxed caster's computed chance was 1372, so no amount of skill could beat it
  # and every caster failed one cast in twenty forever, each failure carrying a
  # 2-round cooldown. Concentration break already covers the intent and, unlike
  # initiation, responds to skill. Do not reintroduce a flat initiation gate.
  #
  # Folds per round: how fast a spell charges each combat round.
  # Formula includes: SpellcastingLevel × SpellFoldsSkillFactor
  SpellFoldsSkillFactor: 25
  #
  #
  # Proficiency: successful casts needed to gain 1 proficiency point
  #   with a specific spell. Higher proficiency reduces fizzle chance.
  SpellProficiencyCastsPerPoint: 50

  # ── DIFFICULTY ─────────────────────────────────────────────────────────────
  # SpellDifficultyProgressionScale and CraftDifficultyProgressionScale were
  # REMOVED by U10b-3. Harder spells and recipes used to train faster to use;
  # now difficulty decides what you can DISCOVER instead, via
  # SpellDiscoverySkillPerDifficulty and DiscoveryDifficultyWeightScale above.
  # Practising a hard spell no longer trains faster than practising an easy one
  # -- earning access to it is the reward.
  SelfCastProgressionMultiplier: 0.5      # self-only buffs get half progression

  # ── ENCHANTMENTS ────────────────────────────────────────────────────────────
  # Enchanted items grow stronger with use. Each tier requires more uses.
  # Uses threshold per tier: UsesBase × UsesScale^tier
  #   Example: base 25, scale 2.5:
  #     Tier 0→1: 25 uses,  Tier 1→2: 63 uses,  Tier 2→3: 156 uses
  # Once the uses threshold is met, each additional use has BaseChance to
  #   advance the tier.
  EnchantTierUpBaseChance: 0.02     # 2% chance per use to tier up (once threshold met)
  EnchantTierUsesBase: 25           # Uses needed for tier 0→1
  EnchantTierUsesScale: 2.5         # Multiplier per tier for uses threshold
  EnchantRemovalPenaltyRounds: 50   # Rounds of withdrawal debuff after disenchant
  EnchantMaxTier: 4                 # Maximum tier (tiers 0–4 = 5 levels total)

  # ── POOL RESERVATION ────────────────────────────────────────────────────────
  # Ceiling on TOTAL reservation per pool, as a fraction of that pool's max.
  # Applies to health, stamina and conviction alike, and to companions as well
  # as players (GetPoolReservation has never had a mob gate, and companions
  # wearing enchanted gear reserve on prod today).
  #
  # The breaching action is REFUSED rather than allowed through and clamped,
  # and a character already past the ceiling keeps everything they have: only
  # additions are refused. That grandfathering falls out of the arithmetic, so
  # nobody is ever force-dismissed by a retune here.
  #
  # Raising this toward 1.0 walks back toward the pre-U7b state, where 96%
  # health reservation was reachable with shipped gear and no mutation.
  # Lowering it makes multi-companion summoners and deep enchant stacks choose
  # sooner. Every enforcement site reads it live, so a change takes effect on
  # restart with no migration and no data edit.
  #
  # 0 or above 1 is REJECTED by the defaulter and falls back to 0.66. A cap
  # that silently disabled itself is the one failure mode nobody would notice
  # until U8's skill-strip made an over-reserved pool crippling.
  PoolReservationCapPct: 0.66

  # ── ENCHANT SALVAGE BANDS ───────────────────────────────────────────────────
  # Tiered potion → enchanting-mat mapping, keyed by alchemy recipe
  # skill_minimum. Band 1 (below Band2Min) always yields binding-paste.
  # Higher bands add chances at chrysalis-setting, mutation-catalyst,
  # and chrysalis-core. Band 4 is chrysalis-potion tier (skill_min >= 28).
  EnchantSalvageBand2Min: 10          # skill_min >= 10 → band 2
  EnchantSalvageBand3Min: 18          # skill_min >= 18 → band 3
  EnchantSalvageBand4Min: 28          # skill_min >= 28 → band 4
  EnchantSalvageBand2SettingPct: 25   # band 2: % chance for chrysalis-setting
  EnchantSalvageBand3SettingPct: 35   # band 3: % chance for chrysalis-setting
  EnchantSalvageBand3CatalystPct: 12  # band 3: % chance for mutation-catalyst
  EnchantSalvageBand4CatalystPct: 40  # band 4: % chance for mutation-catalyst
  EnchantSalvageBand4SettingPct: 30   # band 4: % chance for chrysalis-setting
  EnchantSalvageBand4CorePct: 8       # band 4: % chance for chrysalis-core

  # ── CHARACTER MANAGEMENT ────────────────────────────────────────────────────
  # Hours between player rename uses. 0 disables the cooldown (rename
  # anytime). Default 168 (7 real-time days).
  CharacterRenameCooldownHours: 168

  # ── MOB MUTATIONS ──────────────────────────────────────────────────────────
  MobMutationEnabled: true   # Mobs can acquire mutations through combat
  MobMutationRate: 0.3       # Mutation progress rate vs players (default 0.3)

  # ── MOB AI ──────────────────────────────────────────────────────────────────
  CombatMemoryDuration: 300       # Rounds before mob forgets combat target
  MobAIEnabled: true              # Global toggle for reactive mob AI
  MobReactionDelayMin: 0.25       # Minimum reaction delay (seconds)
  MobReactionDelayMax: 2.0        # Maximum reaction delay (seconds)
  MobBTreeReactionBase: 2.0       # Base delay before perception reduction (seconds)

  # ── GOSSIP SYSTEM ───────────────────────────────────────────────────────────
  GossipIntervalRounds: 75  # Rounds between gossip broadcasts for "gossiper" mobs (min 20)

  # ── MOON PHASES ─────────────────────────────────────────────────────────────
  MoonStatModMax: 0.10  # Max fractional stat modifier from moon phases (±10% at full/new moon)

  # ── MANIFESTATION / COMPANION SCALING ──────────────────────────────────────
  ManifestStatScaleChaFactor: 150    # Charisma divisor — stronger Cha contribution to companion pools
  ManifestStatScaleSkillFactor: 0.02 # Manifestation skill additive factor per rank
  # HomunculusConvictionReserve: base Conviction the Chrysifier homunculus
  #   reserves, before the owner's manifestation and mutation reductions. It was
  #   1000 until U7b, and at 1000 the new reservation ceiling made a CRAFTING
  #   apex unfieldable by exactly the crafter it was built for, while leaving it
  #   fieldable by a summoner who does not need it.
  #
  #   At 300 it still wants roughly 455 Conviction max to fit under a 66% cap,
  #   and nearer 500 once the rank-0 skill rider applies, so a very
  #   low-Conviction crafter can still be refused. That refusal is SPOKEN rather
  #   than silent precisely so it arrives as a player report instead of a
  #   mystery. This is the lever if it bites.
  HomunculusConvictionReserve: 300
  # ── CHARM DURATION (U10c) ───────────────────────────────────────────────────
  # A charm is no longer permanent. The bond lasts a span bought with the MARGIN
  # of the winning contest: scrape a win and it is brief, dominate and it holds.
  # When it runs out the creature breaks free and turns on the caster.
  #
  # The player is never told the number, nor how long is left. That uncertainty
  # is the mechanic -- a bond you cannot plan around is the whole risk of
  # charming something dangerous.
  #
  # Rounds are 4 seconds (Timing.RoundSeconds), so 30 is about 3.4 minutes and
  # 450 about 30. The ceiling is deliberately inside a typical session: a bond
  # that rarely spans a logout is what makes "logging out destroys the creature"
  # an edge case rather than a strategy players build around.
  #
  # Min is also what a FLOORED win takes. A mercy-granted success is not a
  # dominant one, so it must not read as dominance.
  CharmDurationMinRounds: 30
  CharmDurationMaxRounds: 450

  # ── CARAVAN SYSTEM ───────────────────────────────────────────────────────────
  # Zones whose vendors restock on caravan visit only (per-mob
  # TickMobShopRestock is suppressed). Vendors in zones not listed here
  # keep the legacy auto-restock tick.
  CaravanServedZones:
    - "Stillwater"
    - "Thornwall City"
    - "New Plymouth Crafting"

  # Rounds the caravan rests at each depot between transit legs.
  # 360 rounds ≈ 24 min real ≈ a half-game-day. Halved from 720 on
  # 2026-05-02 — foragers are the day-to-day pipeline regardless,
  # and a more visible caravan beats a more realistic one.
  CaravanDepotDwellRounds: 360

  # Dwell at the Fernway forager meeting point (North Road 4038) on
  # each caravan transit leg. Long enough to detect the forager.
  FernwayPickupDwellRounds: 6

  # ── Forager system (Stage 3.1) ─────────────────────────────────────
  # Carry-capacity ratio (0-1) at which the forager heads home.
  ForagerCarryThresholdPct: 0.75

  # HP ratio (0-1) below which the forager casts fold-recall.
  ForagerHPRecallThresholdPct: 0.50

  # HP ratio (0-1) below which the forager auto-drinks a salve.
  ForagerHealPotionThresholdPct: 0.75

  # Max rounds the Fernway forager idles at the meeting point waiting
  # for the caravan before recalling home with the satchel.
  ForagerWaitTimeoutRounds: 150

  # Stage 3.4: when forager's carry-capacity ratio exceeds this value at
  # her sanctuary (home), she stays resting instead of cycling back to
  # forage. Prevents futile forage loops when local vendors are saturated.
  ForagerRestCarryThreshold: 0.5

  # Stage 5.4: storage-lockbox fill fraction at/below which a rested
  # forager resumes gathering. While the chest is fuller than this value,
  # the forager stays resting until vendor-backfill drains it. 0.9 = 90%.
  ChestBackpressureResumePct: 0.9

  # How long a forager rests at sanctuary before re-entering territory.
  # Gated by HP-full and carry-ratio checks too — actual rest can be
  # longer if the forager arrived hurt or over-encumbered. 40 rounds is
  # ~3 real minutes / ~1 game-hour at default round cadence.
  ForagerRestDurationRounds: 40

  # Sanctuary lockbox capacity (per forager). When full, the forager
  # falls back to rest-extension behavior until a player clears space.
  ForagerLockboxCapacity: 500

  # - ForagerStuckThresholdRounds -
  # Forager watchdog: if a forager has been in the same state for more
  # than this many rounds, force-reset the state to Recalling so it
  # heads home, dumps satchel, and re-cycles. Logs a warning on reset.
  ForagerStuckThresholdRounds: 600

  # - ForagerStoringWatchdogRounds -
  # Maximum rounds a forager spends in StateStoring before bailing back
  # to StateRecalling. Prevents infinite loops if the chest workflow stalls
  # (e.g., persistently full chest or unreachable chest room).
  ForagerStoringWatchdogRounds: 20

  # ── ECONOMY HEALTH DASHBOARD ────────────────────────────────────────────────
  # Wall-clock cadence for auto-snapshots (hours). Default 1.
  EconomySnapshotIntervalHours: 1
  # Days to retain auto-snapshots before pruning. Default 30.
  EconomySnapshotRetentionDays: 30
  # Overall-score component weights (must sum to 1.0 for meaningful scores).
  EconomyScoreWeightShop: 0.6
  EconomyScoreWeightCaravan: 0.2
  EconomyScoreWeightForager: 0.2

  # Economy scoring — TtR targets per rarity tier (game-time)
  TtRTargetTier50Hours: 3
  TtRTargetTier40Hours: 6
  TtRTargetTier30Hours: 18
  TtRTargetTier20Days:  3
  TtRTargetTier10Days:  7
  TtRWindowGameDays:    7

  # Logistics health scoring
  LogisticsStuckRounds:     3000
  LogisticsStuckMultiplier: 0.4

  # Five-axis overall score blend (must sum to 1.0)
  ScoreWeightStock:      0.40
  ScoreWeightInput:      0.30
  ScoreWeightThroughput: 0.20
  ScoreWeightShopGold:   0.10

  # ── PINNACLE ITEMS ──────────────────────────────────────────────────────────
  BandolierAttuneRounds: 10           # Rounds of re-attunement after bandolier contents change
  SentientChatterCooldownRounds: 20   # Min rounds between sentient item lines
  SentientChatterChancePct: 15        # Percent chance per eligible round that a sentient item speaks

  # ── BOSS INTERRUPTS ──────────────────────────────────────────────────────────
  # General-purpose disruptor allowlists (not crash-site-specific). A mob
  # mid-fold-cast has its cast interrupted when hit by a thrown item whose id
  # is listed here, or targeted with a player spell whose id is listed here.
  # Generic melee never interrupts a cast.
  BossInterruptItemIds:
    - 30057  # Flashbang
  BossInterruptSpellIds:
    - "neural-stun"
    - "sensory-overload"
    - "kinetic-shove"

################################################################################
#
#   LLM
#   Optional local LLM integration via Ollama for NPC dialogue.
#   Set Enabled to true and point Endpoint at your Ollama instance.
#
################################################################################
LLM:
  Enabled: true
  Endpoint: "http://localhost:11434"
  Timeout: 10

################################################################################
#

#   ANALYTICS
#   Combat analytics subsystem. When enabled, records combat events to a
#   ring buffer and periodically flushes aggregated summaries to a JSONL log.
#   Opt-in: set Enabled to true for data-driven balance tuning.
#
################################################################################
Analytics:
  Enabled: true
  MaxEvents: 500000   # Reduced from 250k; tuning pass complete, 50k sufficient for monitoring
  FlushIntervalSec: 300
  LogPath: "_datafiles/logs/combat-analytics.jsonl"

################################################################################
#
#   INTEGRATIONS
#   Special settings for third party integrations such as discord messages
#
################################################################################
Integrations:
  # - Discord settings -
  Discord:
    # Optional webhook URL to send mud event messages to, such as joins/disconnects
    # Can also be set via environment variable: DISCORD_WEBHOOK_URL
    WebhookUrl: ''


################################################################################
#
#   TEXT FORMATS
#   Basic text strings that occur often, and may need customization
#
################################################################################
TextFormats:
  # - Prompt -
  #   Default prompt formatting.
  #   See: "help prompt" in game to learn more about this.
  Prompt: '{8}[{t} {255}HP:{hpbar} {255}SP:{stbar} {255}CP:{cvbar}{8}]{239}{h}{8}:'
  # - FightPrompt -
  #   Default fight prompt (shown during combat). Players can toggle individual
  #   elements with "set fprompt tog <name>" or set a fully custom string with
  #   "set fprompt <string>". See "help set-prompt" in game for all options.
  FightPrompt: '{8}[{t} {255}HP:{hpbar} SP:{stbar} CP:{cvbar}{pos}{8}] {255}» {target}{8}[{targetpos}{8}|{targethealth}{8}] {255}{tank}{tankpos}{tankbar}{239}{h}{8}:'
  # - TimeFormat -
  #   When real world time is shown, what format should be used?
  #   This uses a Go time format string, which is kinda weird.
  #   See: https://go.dev/src/time/format.go
  Time: 'Monday, 02-Jan-2006 3:04:05PM'
  # - TimeFormatShort -
  #   Same as TimeFormat, but shorter form
  TimeShort: 'Jan 2 ''06 3:04PM'
  # - EnterRoomMessageWrapper -
  #   Decorate entrance text with this. Put a %s where the message should be.
  EnterRoomMessageWrapper: "   <ansi fg=\"enters-message\"> >>> </ansi>%s\n"
  # - ExitRoomMessageWrapper -
  #   Decorate exit text with this. Put a %s where the message should be.
  ExitRoomMessageWrapper: "   <ansi fg=\"leaves-message\"> >>> </ansi>%s\n"

################################################################################
#
#   TRANSLATION SETTINGS
#   Custom game language translation settings.
#
################################################################################
Translation:
  # - DefaultLanguage -
  # Specify the default game language (fallback)
  DefaultLanguage: 'en'
  # - Language -
  # Specify the game language
  Language: 'en'
  # - LanguagePaths -
  # Specify the game language file paths
  LanguagePaths:
    - '_datafiles/localize'
    - '_datafiles/world/default/localize'

################################################################################
#
#   NETWORK SETTINGS
#   Custom network settings for the server. If you are running the server
#
################################################################################
Network:
  # - MaxTelnetConnections -
  #   The maximum number of telnet connections the server will accept.
  MaxTelnetConnections: 100
  # - TelnetPort -
  #   The port the server listens on for telnet connections. Listen on multiple
  #   ports by separating them with commas. For example, [33333, 33334, 33335]
  TelnetPort: [33333, 44444]
  # - LocalPort -
  #   A port that can only be accessed via localhost, but will not limit based on connection count
  LocalPort: 9999
  # - HttpPort -
  #   The port the server listens on for web requests
  #   0 (zero) means none.
  #   LOCAL: 8090, not 80 — Docker Desktop publishes the critbench-frontend
  #   container on 0.0.0.0:80 (up since 2026-07-30), so a DOGMud server set
  #   to 80 loses the bind and boots with NO web listener. The droplet's own
  #   config (not this file — skip-worktree) owns the prod value.
  HttpPort: 80
  # - HttpsPort -
  #   The port the server listens on for web requests
  #   Note: Must have a cert/key file (See FilePaths)
  #   0 (zero) means none.
  HttpsPort: 0
  # - HttpsRedirect -
  #   If true, will send all http traffic to https with a redirect
  #   Requires both Http and Https to be working.
  HttpsRedirect: false
  # - Http timeouts (seconds) -
  #   Bound how long a single client may occupy a web connection. Without
  #   these, a slow client holds a connection open indefinitely at almost no
  #   cost to itself. Applied to both the http and https servers.
  #   These do NOT affect websocket (/ws) players: the websocket library
  #   clears these deadlines as soon as it takes over the connection.
  #   A value below 1 falls back to the default shown, so a timeout cannot be
  #   switched off by accident. To effectively disable one, set it very high.
  #   HttpReadHeaderTimeoutSeconds is the tightest; it is the main brake on
  #   slow-header attacks. HttpWriteTimeoutSeconds is the loosest because it
  #   has to cover a whole response.
  HttpReadHeaderTimeoutSeconds: 10
  HttpReadTimeoutSeconds: 30
  HttpWriteTimeoutSeconds: 60
  HttpIdleTimeoutSeconds: 120
  # - TrustedProxies -
  #   IPs or CIDRs that are allowed to tell the server who the real client is
  #   via the X-Forwarded-For header. Everything else has that header ignored.
  #
  #   Why this exists: production puts Caddy in front of the web client, so the
  #   TCP peer of every websocket is 127.0.0.1. Without this, every web-client
  #   player looked like a loopback connection -- which is exempt from IP bans,
  #   so bans did nothing for anyone using /webclient, and the address staff saw
  #   logged was the proxy's, not the player's.
  #
  #   SECURITY: X-Forwarded-For is written by the client and is trivially
  #   forged. It is believed ONLY when the machine holding the socket is listed
  #   here, and within the header only the RIGHTMOST hop that is not itself a
  #   listed proxy is used (proxies append, so anything a client pre-seeds ends
  #   up to the left and is never reached). Widening this list to a whole
  #   private range would let any host in that range claim to be any address,
  #   including a banned one or a loopback one. Add ONLY the addresses your own
  #   reverse proxy connects from.
  #
  #   Leave empty for the safe default of loopback only
  #   (127.0.0.1/32 and ::1/128), which is correct for a same-host Caddy.
  #   Assumes the proxy APPENDS to X-Forwarded-For (Caddy's reverse_proxy
  #   default); a proxy configured to overwrite it defeats any XFF scheme.
  TrustedProxies: []
  # - AllowedWebSocketOrigins -
  #   Extra hostnames whose web pages may open a /ws websocket to this server.
  #
  #   By default the server accepts a websocket upgrade when the browser's
  #   Origin matches the host the request was addressed to (the normal
  #   same-origin case), or matches a hostname already configured elsewhere:
  #   FilePaths.WebDomain, Server.MSSP.Hostname, or loopback. Everything else
  #   is refused, so a third-party page cannot open sockets from a visitor's
  #   browser and drive them against the game.
  #
  #   Requests with NO Origin header are allowed — non-browser clients (bots,
  #   the playtest harness, curl) do not send one, and browsers always do, so
  #   its absence is not a cross-origin signal.
  #
  #   Only set this if you serve the web client from a DIFFERENT domain than
  #   the MUD. Accepts bare hostnames ("client.example") or full origins
  #   ("https://client.example"); the port and scheme are ignored. Every entry
  #   is a domain you are trusting to drive connections on a visitor's behalf.
  #
  #   Leave empty for the safe default (same-origin + configured hostnames).
  AllowedWebSocketOrigins: []
  # - AIPort -
  #   Dedicated port for AI client connections. Set to 0 to disable.
  AIPort: 55555
  # - MaxHumanConnections -
  #   Maximum number of human (non-AI) telnet connections.
  MaxHumanConnections: 80
  # - MaxAIConnections -
  #   Maximum number of AI client connections.
  MaxAIConnections: 20
  # - AICommandsPerRound -
  #   Maximum commands per game round for AI connections.
  #   Rounds are 4 seconds (configurable via Timing.RoundSeconds).
  AICommandsPerRound: 3
  # - AfkSeconds -
  #   If this many seconds pass without player input, they are flagged as afk
  #   Set to zero to never mark anyone as AFK
  AfkSeconds: 120
  # - MaxIdleSeconds -
  #   How long players can go without any input, before being kicked.
  #   A value of 0 (zero) means never kick inactive players.
  #   18000 seconds = 5 hours (was 1800/30min — bumped 10x for player QoL)
  MaxIdleSeconds: 18000
  # - TimeoutMods -
  #   Whether Admin/Mod users get timed out when reaching MaxIdleSeconds
  #   If set to false, Admins & Mods never get force disconnected.
  TimeoutMods: false
    # - ZombieSeconds -
  #   How many seconds a character stays active/in game after a network connection
  #   is lost. Set to 0 to instantly log out characters (exploitable).
  ZombieSeconds: 60
  # - LogoutRounds -
  #   How many rounds of meditation a player must complete before they are
  #   logged out. If interrupted, they must start over.
  LogoutRounds: 3

################################################################################
#
#   LOGGING
#   File-based logging configuration. Env vars LOG_LEVEL, LOG_PATH,
#   LOG_NOCOLOR take precedence if set.
#
################################################################################
Logging:
  LogToFile: false                             # Write logs to file + terminal (DISABLED for prod push per CLAUDE.md pre-push SOP — droplet has limited disk)
  LogFilePath: "_datafiles/logs/server.log"    # Log file path (rotated at 100MB)
  LogLevel: "debug"                            # debug, info, warn, error

################################################################################
#
#   Special Rooms
#   You probably won't need to change these.
#
################################################################################
SpecialRooms:
  # - StartRoom -
  #   This is the default starting room for the game. It only matters when there
  #   is code that explicitely tries to send the player to the "starting room"
  #   The default of 1 is Town Square
  StartRoom: 5200
  # - DeathRecoveryRoom -
  #   This is the room players are sent to when they die.
  #   This should have some way of healing them and (eventually)
  #   sending them back into the main world.
  DeathRecoveryRoom: 5209
  # - TutorialRooms -
  #   This should be an array of all room id's for the pre-start tutorial.
  #   The first one on the list is the room they will be placed in when beginning
  #   Rooms 900-999 are a special range of RoomId's that tell GoMud the user is
  #   in a tutorial.
  #   The Newcomer Antechamber (rooms 6258-6262 + 6467) is the route-1 guided
  #   tutorial. The first id is where a new "complete noob" player is placed.
  TutorialRooms: ["6258", "6259", "6260", "6261", "6262", "6467"]

################################################################################
#
#   Validation
#   Special rules or filters for validation purposes
#
################################################################################
Validation:
  # - NameLengthMin / NameLengthMax -
  #   Min/Max size of names allowed.
  NameSizeMin: 2
  NameSizeMax: 32
  # - PasswordSizeMin / PasswordSizeMax -
  #   Min/Max size of passwords allowed.
  PasswordSizeMin: 4
  PasswordSizeMax: 16
  # - EmailOnJoin -
  #   Whether to ask for email addresses on signup.
  #   Can be "required", "optional", "none"
  #   Default: "optional"
  EmailOnJoin: optional
  # - NameRejectRegex -
  #   A special pattern to reject usernames that match it.
  #   (This is a regular expression, you must understand how to create them)
  #   Set to empty to disable. If the regex is invalid it will revert to the
  #   default of '^[a-zA-Z0-9_]+$'
  NameRejectRegex: '^[a-zA-Z0-9_]+$'
  NameRejectReason: "Must only contain Alpha-numeric and underscores."
  # - BannedNames -
  #   Names that are not allowed to be used by players. This is a good place to
  #   put names that are used by the game itself, such as "admin".
  #   Note: This is not case sensitive.
  #   You can add a * to the end of a name to ban all names that start with that
  #   name. For example, "admin*" would ban "admin", "administrator", etc.
  #   You can also use * at the beginning of a name to ban all names that
  #   end with that name. For example, "*admin" would ban "admin", "superadmin",
  #   Finally, you can use * at the beginning and end of a name to ban all names
  #   that contain that name. For example, "*admin*" would ban "admin", "superadmin",
  #   "administrator", etc.
  BannedNames:
  - "*admin*"
  - "*moderator*"
  - "player*"
  - "user*"
  - "me"
  - "myself"
  - "self"
  - "us"
  - "you"
  - "them"
  - "everyone"
  - "someone"
  - "anyone"
  - "nobody"
  - "somebody"
  - "anybody"
  - "none"
  - "nothing"
  - "something"
  - "anything"
  - "everything"
  - "all"
  - "north*"
  - "south*"
  - "east*"
  - "west*"
  - "up"
  - "down"
  - "chest"
  - "door"
  - "new"
  - "join"
  - "register"
  # Companion / creature type words
  - "skeleton"
  - "zombie"
  - "wraith"
  - "spectre"
  - "vampire"
  - "golem"
  - "elemental"
  - "magma"
  - "swarm"
  - "spirit"
  - "wolf"
  - "undead"
  - "conjure*"
  - "summon*"
  - "companion"

################################################################################
#
#   Roles
#   Roles are string identifiers that map to a number of command names.
#   They are used to determine what admin commands a player has access to.
#   Two roles are build in and cannot be changed:
#     - "user" - Has no admin commands
#     - "admin" - Has all admin commands
#   Role sub-commands should be separated by a dot: room.info
#   Roles are more permissive the more they prefix.
#   Example: room prefixes room.info so would permit that action as well.
#   Role checks must be implemented wherever role-based restriction is desired:
#   if user.HasRolePermission(`room`) { /* Do something */ }
#
################################################################################
Roles:
  builder: ["room.info", "build"]
  helper: ["paz", "teleport.playername", "locate"]


################################################################################
#
#   Modules
#   Empty here. Modules provide data for this.
#
################################################################################
# Playtest — synthetic profile materialization (Chunk 0.3b). Empty
# ProfilesManifest is the production default (materializer no-op). Ephemeral
# playtestenv runs override these via CONFIG_PATH.
################################################################################

################################################################################
Modules:
  playtest:
    Enabled: true
    SafeMode: true
    SandboxZoneTag: ""
    DeathProtection: true
    Beacons: true
  weather:
    Enabled: true
    Seed: 0
    # Weather steps once per this many game-hours (~20 min real at 8); high so
    # weather reads as a rare, stable atmospheric event, not minute-to-minute
    # flicker. If weather feels too sparse, raise SpawnRateScale first.
    TickEveryGameHours: 8
    MaxActiveFronts: 8
    # Thin spawns for more clear-sky stretches between systems.
    SpawnRateScale: 0.7
    EmoteMode: module
    EmoteEveryRounds: 24
    EmoteMildChancePct: 30
    EmoteStrongChancePct: 100
    BuffsEnabled: false
    Persist: true
    IncludeSecretExits: true
    RebuildGraphOnBoot: false
    SeasonsEnabled: true
