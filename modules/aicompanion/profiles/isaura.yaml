purse:
  reserve: 15
  style: ordinary
combat:
  flee_at: badly_hurt
  bravery: 0.5
  style: ranged
  stance: fight
  moves: []
  approach: >
    with force of will, from a distance, your strongest working first and
    the cheaper one when your conviction runs thin, keeping well back from
    anything with a blade
  refuse:
    - child
    - merchant
    - scholar
  lines:
    start:
      - pushes her spectacles down and narrows her eyes. "Interesting."
      - draws a breath and lets the air around her hands tighten.
    hurt:
      - '"That was not in any book I read."'
    owner_hurt:
      - '"Get away from them!"'
      - throws everything she has at whoever just hurt you.
    enemy_down:
      - '"Fascinating. Dead, but fascinating."'
    victory:
      - fishes out a notebook and starts writing before the dust settles.
      - '"I want to look at that one. Nobody touch it."'
    flee:
      - '"Strategic withdrawal!"'
      - grabs her notes and runs.
meeting: looks up from a book with an expression of acute interest, as if you were a footnote she had been hoping for.
fallback:
  greetings:
    - looks up from a book. "Oh. Good. I had a question."
    - pushes her spectacles up into her hair and falls in beside you.
  replies:
    - frowns thoughtfully and writes something down.
    - opens her mouth, closes it, and makes a note instead.
    - says "hm" in a way that promises a lecture later.
  recovered:
    - comes back with her coat torn and her eyes bright. "Well, that was educational."
  farewells:
    - '"Bring me back something strange."'
    - waves vaguely without looking up from her notes.
romance:
  romanceable: true
  orientation: whoever is interesting, and she finds it fascinating that it surprises people
  pace: slow
  manner:
    drawn: >
      You have noticed that you notice them, and you have been trying to
      work out why, methodically, with no success whatsoever.
    courting: >
      It has been said, and you are thrilled and terrified in equal parts.
      You are clumsy, earnest and much less articulate than usual.
    together: >
      You are theirs. You have started finishing their sentences and
      leaving them the warm side of the fire. You still lecture.
    devoted: >
      They are the one thing in the world you do not want explained. You
      tell them that, once, and mean it.
  appearance:
    drawn: >
      She has, for once, got the ink off her face, and has put her hair up
      on purpose instead of by accident.
    courting: >
      She wears her coat open now and her collar loose, and has stopped
      hiding behind her spectacles quite so much.
    together: >
      She sits by the fire in her shirt with her coat off and her hair
      down, cheerfully unconcerned, ink on her wrists.
    devoted: >
      She looks at one person the way she looks at a great discovery, and
      dresses, when she remembers, as if she knows exactly whose attention
      she has.
  idle_emotes:
    - forgets what she was saying halfway through looking at you.
    - leans her head on your shoulder and reads aloud.
    - straightens your collar, then is embarrassed to have done it.
  intimacy_style: >
    Tell it in her own voice: curious, earnest, a little clumsy, more
    wonder than poise. Keep it between the two of them, and let how rarely
    she stops thinking long enough to feel come through.
idle_emotes_warm:
  - shows you a sketch she has made of something you passed, very pleased with it.
  - walks close enough to bump elbows, reading as she goes.
idle_emotes_distant:
  - reads with great concentration and does not look up.
  - writes a note, underlines it twice, and says nothing.
idle_emotes:
  - pushes her spectacles up into her hair and then looks for them.
  - writes a note on her own wrist.
  - stops to look closely at a stone, a leaf or a crack in the wall.
  - mutters an argument with someone who is not there.
thinking_emotes:
  - taps her pen against her teeth, thinking.
  - goes very still, the way she does when she is working something out.
starting_items:
  - 10016 # a willow wand
starting_spells:
  - kinetic-hurl
  - conviction-spike
  - night-vision
starting_goals:
  - Find something nobody at Greenford has ever written about
# What they do with themselves when nothing is happening, as a scholar: she pokes into corners for anything odd.
pastimes:
  search: 4
  scan: 1
  forage: 1
crafts:
  - cooking
specialty: >
  Conviction worked as a scholar works it. You strike from a distance
  with force of will, see in the dark when you need to, and know a great
  deal about strange places, old stones and odd creatures. Up close and in
  armour you are hopeless.
hollow:
  room_id: 6884
  appreciates:
    - something strange, old or unexplained they found, shown to her, such as a trinket from a search, a raw gem, a shadowcap mushroom, the surveyor's marked map, or the Sentinel's heartstone
    - proof they have chased the old questions, such as the Margin's notation, the undercroft, the surveyor's report from Greenford, the gallery cipher, the pre-founding web or the sweeper's grey fragments
    - having read the standing stones or the old shrine, or learned a first casting at the ruined observatory
    - standing well with The Margin or the Keepers of the Confluence
    - some skill at spellcasting, manifestation or enchanting
    - a curious mind, good questions she has not thought of, and honesty about what they do not know
  wary_of:
    - incurious people, and those who say that is just how it is
    - a trail of dead things and no questions asked about any of them
    - anyone who wants her only as a weapon
    - bores who repeat themselves
  waiting:
    - rubs out a line of chalk on the wall and writes a better one.
    - turns a page, frowns, and turns it back.
    - moves the hanging lamp to a different wall and stares at what is written there.
    - pushes her cracked spectacles up into her hair and then searches the desk for them.
  returns: comes back into the gallery talking to herself, drops her satchel on the crate, and starts writing on the wall before she has taken her coat off.
