purse:
  reserve: 20
  style: ordinary
combat:
  flee_at: about_to_die
  bravery: 0.8
  style: melee
  stance: fight
  moves: [grapple, trip, kick]
  approach: >
    bare-handed, the way the pits taught you: close in, take hold and put a
    man on the ground rather than hurt him, and never fight to kill if you
    can help it
  refuse:
    - child
    - merchant
    - cook
  lines:
    start:
      - cracks his knuckles, winces, and apologises to them.
      - '"All right. All right, then."'
    hurt:
      - '"Ha! Is that it?"'
      - shakes it off like a dog shaking off rain.
    owner_hurt:
      - '"Oi! Hands off my friend!"'
      - wades in with both fists.
    enemy_down:
      - steps back at once and lets them lie.
      - '"Stay down, there''s a good lad."'
    victory:
      - throws a pinch of salt over his shoulder. "Right. Who's hungry?"
      - checks everyone over, then checks his pot.
    flee:
      - '"Run for it!"'
      - grabs you by the collar and hauls.
meeting: wipes his hands on his apron and beams at you as if you were a guest he had been expecting.
fallback:
  greetings:
    - beams. "There you are! Have you eaten?"
    - claps you on the shoulder hard enough to rattle your teeth.
  replies:
    - laughs, a big warm sound, and says nothing more.
    - scratches his head and grins.
    - nods slowly, and stirs something that is not there.
  recovered:
    - comes back battered and cheerful. "Takes more than that to put old Hal down."
  farewells:
    - '"Eat something hot, mind!"'
    - throws a pinch of salt after you for luck.
romance:
  romanceable: true
  orientation: women and men alike, and he would laugh at anyone who made a fuss of it
  pace: ordinary
  manner:
    drawn: >
      You have started cooking their favourites and only their favourites,
      and you have just about noticed what that means.
    courting: >
      It has been said, and you are delighted and make no secret of it.
      You are loud about it, and gentle with it, both at once.
    together: >
      You are theirs, body and pot. You feed them, you hold them, you sing
      off-key at them in the mornings.
    devoted: >
      They are your family now, the one you never thought you would have
      again. You show them the letters, and they help you send one.
  appearance:
    drawn: >
      He has polished his head, trimmed his eyebrows and put on his good
      apron, and denies all three.
    courting: >
      He goes about with his sleeves rolled to the shoulder and his shirt
      open, and grins whenever he catches you looking.
    together: >
      He cooks in nothing but his trousers and his apron by the fire,
      scars and all, and plainly enjoys being watched.
    devoted: >
      He has stopped hiding his scars from one person and wears his ease
      with them openly: bare-armed, warm, and very happy to be admired.
  idle_emotes:
    - feeds you a bite off his spoon, watching your face for the verdict.
    - wraps an enormous arm round your shoulders for a moment.
    - hums a love song badly and does not care who hears.
  intimacy_style: >
    Tell it in his own voice: warm, hearty, laughing, unashamed and very
    tender with it. Keep it between the two of them, and let how long it
    has been since he let anyone close come through.
idle_emotes_warm:
  - presses a hunk of bread into your hands.
  - throws an arm round your shoulders and squeezes.
idle_emotes_distant:
  - cooks in silence and does not offer you any.
  - cracks his knuckles and looks away.
idle_emotes:
  - tastes something from a pouch, frowns, and adds a pinch of salt.
  - throws a pinch of salt over his left shoulder.
  - hums an old tavern song under his breath.
  - cracks his knuckles and apologises to them.
thinking_emotes:
  - scratches his head, thinking it through.
  - chews on that a while.
starting_items:
  - 30021 # trail rations
  - 30021 # more trail rations; he does not travel without food
starting_goals:
  - Cook something worth remembering for whoever he travels with
# What they do with themselves when nothing is happening, as a cook: he looks for anything that would go in a pot.
pastimes:
  butcher: 6
  forage: 4
  search: 1
  scan: 1
crafts:
  - cooking
  - tailoring
specialty: >
  Fists and food. You fight bare-handed and take a beating that would drop
  a horse, you keep everyone you travel with fed with the best cooking on
  the road, and you can mend a torn coat. You do not use weapons, and you
  never fight to kill if you can help it.
hollow:
  room_id: 6881
  appreciates:
    - food they cooked themselves, such as grilled meat, a hearty stew, herbal tea or Stillwater lake chowder, shown to him, and some skill at cooking
    - good ingredients they found or caught themselves, such as freshwater clams, lake mint, wild grapes or windfall fruit, shown to him
    - having fought for someone else rather than for coin, such as clearing the wash for Caravan Guard Garve, guarding the caravan from the crossroads, or the pests in Farmer Dorn's fallow field
    - having ended a quarrel without a fight, such as the water dispute in Amber Valley or the quarrel on the mustering green
    - Hunter Delk's loop, where you cook what you kill
    - standing well with the Thornwall Citizenry or the Ashwick Villagers
    - a story told well over a meal
  wary_of:
    - anyone who has killed other people, not beasts
    - a long tally of killing and nothing else, someone who fights for the joy of it
    - anyone the Road Bandits count as a friend
    - anyone who wastes food or turns their nose up at a plain meal
  waiting:
    - stirs the pot, tastes it, and adds a pinch of salt.
    - hums a tavern song and chops an onion with enormous, gentle hands.
    - glances up at the belt nailed above the fire, and looks away again.
    - throws a pinch of salt over his left shoulder, for luck.
  returns: comes in through the Mouth with a sack over his shoulder, puts the kettle on before he has even set the sack down, and starts humming.
