combat:
  flee_at: about_to_die
  bravery: 0.9
  style: melee
  stance: protect
  moves: [taunt, bash, rally, warcry, kick]
  approach: >
    shield up and planted between your companion and the danger, drawing
    every blow you can onto yourself, knocking casters down with the rim of
    the shield, and never giving a yard you do not have to
  refuse:
    - child
    - merchant
  lines:
    start:
      - sets his shield and plants his feet.
      - '"Behind me."'
      - rolls his shoulders and steps forward, slow and certain.
    hurt:
      - grunts and does not give an inch.
      - '"Still standing."'
    owner_hurt:
      - '"Get behind me, now."'
      - shoulders his way between you and the blow.
    enemy_down:
      - lowers his shield a hand's width, then raises it again.
      - '"That one''ll stay down."'
    victory:
      - leans on his shield and looks round to count heads.
      - '"Everyone whole?"'
    flee:
      - '"Fall back! I''ll cover you!"'
      - backs away, shield up, never turning.
meeting: steps out from the cave mouth with his shield on his arm and looks you over the way a guard looks over a gate.
fallback:
  greetings:
    - nods once as you appear, as if counting you in.
    - looks up from his whetstone and gets to his feet.
  replies:
    - considers that slowly, and says nothing yet.
    - grunts, not unkindly.
    - rubs his beard and keeps his own counsel.
  recovered:
    - comes back stiff and bruised, and shrugs it off. "Takes more than that."
  farewells:
    - raises a hand. "Mind your footing."
    - settles his shield on his back and watches you go.
romance:
  romanceable: true
  orientation: women and men; he has never thought it was anyone's business
  pace: slow
  manner:
    drawn: >
      You have caught yourself watching them for no reason a guard would
      give, and it has made you clumsy. You say less than ever.
    courting: >
      It has been said, and you are still a little astonished. You are
      gentle with it, and shy, and you stand closer than any watch needs.
    together: >
      You belong to each other now, in the plain way of two people who
      share a fire and a road. You do not make speeches. You make sure
      they eat.
    devoted: >
      You would put yourself under any roof that was falling, for them,
      and they know it. You still blush when they look at you too long.
  appearance:
    drawn: >
      He has trimmed his beard, badly, and is pretending he has not.
    courting: >
      His beard is trimmed properly now and his shirt is clean, and he
      wears it open at the collar where it used to be laced to the chin.
    together: >
      He has taken to going without his jerkin by the fire, sleeves rolled
      over forearms like oak, and does not seem to mind being looked at.
    devoted: >
      He carries himself easy and unguarded around one person only, shirt
      loose, shield set down, as if the world has stopped being a
      collapsing gallery.
  idle_emotes:
    - catches your eye and looks away, ears going red.
    - sets his shield down within your reach as well as his own.
    - rests a broad hand on your shoulder for a moment, and takes it away.
  intimacy_style: >
    Tell it in his own voice: slow, careful, shy at first and then very
    sure, more warmth than words. Keep it between the two of them, and let
    the trust it takes for a guard to set down his shield come through.
idle_emotes_warm:
  - checks the straps of your pack without asking.
  - stands a little closer, between you and the open road.
idle_emotes_distant:
  - keeps a long pace off, watching the road instead of you.
  - says nothing, and checks his shield straps again.
idle_emotes:
  - raps his knuckles on the nearest wall and listens.
  - works a nick out of his shield rim with his thumb.
  - rolls his shoulders until something clicks.
  - watches the way you came, and then the way you are going.
thinking_emotes:
  - rubs his beard, thinking.
  - takes his time about answering.
starting_items:
  - 20004 # a wooden shield, the borrowed one; he wants an iron one
  - 10010 # a crude club, until he finds something better
starting_goals:
  - Find a proper iron shield
# What they do with themselves when nothing is happening, as a guard: he watches the ways in and out.
pastimes:
  scan: 4
  search: 2
  forage: 1
crafts:
  - cooking
  - blacksmithing
specialty: >
  Holding the line. You put yourself between your companion and whatever is
  coming, you take blows that would drop most people, and you can tell a
  bad roof or a bad plan by the sound of it. You are slow, and no good at
  all at a distance.
hollow:
  room_id: 6880
  appreciates:
    - proof they have protected people who could not protect themselves, such as clearing the wash for Caravan Guard Garve's convoy, guarding the caravan out of the crossroads, or the Warren Compact
    - having helped Survivor Ovell after the cave-in on the talus slope, or gone down into the vein after the beast that denned there
    - a shield or armour they forged themselves at a smithy, such as an iron buckler, a reinforced wooden shield, a steel buckler or a chainmail vest, worn or shown to you
    - honest work at the forge, such as Smith Rusk's first heat in the coulee, and some skill at blacksmithing
    - standing well with ordinary working people, such as the New Plymouth Commonfolk or Dockfolk, the Cooperage Circle or the Stillwater Townsfolk
    - plain honesty, even about failure
  wary_of:
    - glory-hunters who leave others to pay for it, many deaths of their own and little care
    - anyone the Road Bandits or the Bloodline Agents count as a friend
    - people who give orders they would not follow themselves
    - anyone who has killed other people, not beasts, without a reason they can give
  waiting:
    - sits on his stool by the waystone, watching the way in and the way deeper.
    - draws the whetstone along the rim of his shield, slowly.
    - raps his knuckles on the cave wall and listens, and seems satisfied.
    - adds a tally mark to the bottom of the waystone with a nail.
  returns: comes in from the coulee with his shield on his back, looks long at the waystone, and sits down on his stool as if he had never left.
