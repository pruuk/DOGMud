# M3 item 3, run 1: does a CREATURE's taunt read well now?
#
# Until this change, every taunt thrown by a creature was the same sentence:
# "bellows a thunderous challenge". Creatures now draw from the same authored
# insult pool players use. This run is here to judge whether that reads right
# coming from a summoned elemental, which is a question no test can answer.
#
# ONE ACTOR IS ENOUGH. Your own summoned companion does the taunting, and it
# taunts the ENEMY, not you, so you are a bystander to it and receive the room
# line yourself. You do not need a partner.
#
# ⚠️ KNOWN NON-BUGS, DO NOT REPORT:
#   - The oasis elementals themselves never taunt. If one throws a taunt back
#     at YOU after you taunt it, that is a COUNTER and is working as designed.
#   - Damage is described in words, never numbers.
#   - Your companion obeys you and will not taunt you.

ephemeral:
  profile: veteran
  start_room: 5000
  budgets:
    wall_clock: 35m

goals:
  - >-
    You are standing with Sable. Buy a trip to the planar oasis: `ask sable
    oasis 250`. You are carrying well over that. Sable opens a temporary
    portal; take it. If the ask does not work, read what Sable says and try
    the exact phrasing they use, then report the wording that failed.
  - >-
    Before or just after you arrive, summon a companion that taunts:
    `cast conjure-earth`. Conjure Magma Elemental and Raise Golem also work if
    that one fails. Confirm the companion is with you before you pick a fight.
    A run without a companion cannot answer this run's question at all, so say
    so loudly if you cannot get one.
  - >-
    Fight the elementals of the oasis with your companion beside you, and stay
    in the fight long enough for it to taunt SEVERAL times. This is the whole
    point of buying a long fight rather than picking on something in town.
  - >-
    THE MAIN JOB. Every time your companion taunts, quote the line VERBATIM.
    Collect them all. Then answer three questions plainly:
      1. Do the taunts VARY, or is it the same sentence every time? The same
         sentence every time is the bug this run exists to catch.
      2. Do they read as something an ELEMENTAL would say? The insults were
         written for people, so a line about questioning someone's courage or
         mocking their footwork may land oddly from a creature made of rock.
         Quote any line that reads wrong coming from an elemental.
      3. When your companion lands a really good one, does it read as bigger
         than its ordinary hits, or the same?
  - >-
    Watch for anything that reads as broken rather than merely odd: a taunt
    naming the wrong creature, a line with a leftover token like {source} or
    {target} in it, a colour that looks wrong, or a taunt that arrives with no
    apparent cause. Quote anything you flag.
  - >-
    If you die, that is a fine outcome and not a failure of the run. Report how
    far you got and what you saw before it happened.
