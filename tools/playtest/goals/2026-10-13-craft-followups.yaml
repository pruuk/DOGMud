# Craft follow-ups (#513, #515): progress lines, wrapping, and moving away.
#
# WHAT CHANGED.
# - While you craft, each round's progress line used to read "You continue
#   working on healing-salve... (1/3)". It should now name the recipe and say
#   how far along you are in words, with no numbers, e.g. "You keep working
#   on the Healing Salve; you're about halfway."
# - Your own crafting lines (start, progress, finish, failure) now wrap at
#   80 columns instead of running off the edge as one long line.
# - Walking away mid-craft still interrupts it ("Your movement interrupts
#   your crafting.").
#
# WHY HERE. The crafter profile stands at an alchemy bench with materials.
#
# 3 commands per round; overflow is dropped.

ephemeral:
  profile: crafter
  start_room: 6456
  budgets:
    wall_clock: 25m

goals:
  - >-
    Type `look` and `inventory`, then find a recipe you can make here (try
    `recipes` or `craft` with no arguments, or `help craft`). Start a craft
    that takes more than one round (a salve or potion usually does).
  - >-
    While it runs, copy EVERY line you receive VERBATIM until it finishes:
    the start line, each progress line, and the finish or failure line.
    For each progress line report: does it name what you are making by its
    proper name (not a dashed id like healing-salve)? Does it contain any
    number, fraction or counter? Does the progress word move forward (just
    started, about halfway, nearly done)?
  - >-
    For the finish line: did it arrive as one very long line, or wrapped
    onto several lines of reasonable width? Quote it exactly as it appeared,
    line breaks included.
  - >-
    Start another timed craft, and after the first progress line, walk out
    of the room through any exit. Copy what you are told. Then walk back.
  - >-
    Report anything that reads wrong: a raw token like {actor} or {item},
    a doubled word such as "the The", a number or counter, an empty line, or
    any line that runs much wider than the rest.
