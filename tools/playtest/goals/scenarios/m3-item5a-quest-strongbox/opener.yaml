# `confront` of The Undertow, carrying the Strongbox Key. Veteran Pathfinder is
# with you and cannot see either. Quote every line VERBATIM.
#
# 3 commands per round on the AI port; the overflow is dropped.

ephemeral:
  profile: m2-witness
  start_room: 498
  overlays:
    set_quest_tokens: ["14-confront"]
    grant_items: [40034]
  budgets:
    wall_clock: 20m

goals:
