# Slam split (#541): the DEFENDER.
#
# You start in The Silt Run (6420) beside A Deep Slime. It is hostile and will
# attack you. You are the one being lashed. Your partner is a plain onlooker
# who walks in once the fight is on; THEY report what the room was told, you
# report what you were told, and the pair is compared.
#
# The change under test: slimes now attack with new `lash` lines (whips,
# smothers, engulfs) instead of the old `slam` lines. Each blow should read as
# the same moment to you and to anyone watching, and the watcher's line names
# you as the target.
#
# The sewers are pitch dark: wear your torch first or every line reads
# "Something".
#
# QUOTE LINES VERBATIM, each with its round number. A paraphrase is useless:
# the whole question is whether two sentences describe the same moment.
#
# 3 commands per round on the AI port and the overflow is dropped. Read every
# line before sending more.
#
# KNOWN NON-BUGS, do not refile: damage is words and never numbers; corpses
# persist for hours.

ephemeral:
  profile: early
  start_room: 6420
  overlays:
    grant_items: [20096]
  budgets:
    wall_clock: 35m

goals:
  - >-
    LIGHT. `wear torch` before anything else, then `remove` your weapon so the
    fight lasts.
  - >-
    FIGHT. Let the Deep Slime fight you (or `attack slime`) for at least four
    rounds after your partner arrives. Record every combat line you are given,
    word for word, with its round number: the slime's line to you, then your
    own line.
  - >-
    JUDGE THE SLIME LINES. A slime has no body parts but its pseudopods. Any
    line naming a fist, claw, tooth, hand or limb is a finding. Say whether
    each line reads as one clear sentence an English learner would follow.
  - >-
    DO NOT DIE. Watch your health every round. Below a third, quaff your
    Healing Salve or flee. A finished comparison is worth more than a kill.
  - >-
    ADVERSARIAL PASS. Report any literal curly-brace token, any doubled or
    missing name, any sentence starting lowercase, and any EMPTY line where a
    blow should be.
