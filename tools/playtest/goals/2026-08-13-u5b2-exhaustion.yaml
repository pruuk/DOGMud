# U5b-2 targeted adversarial playtest: exhaustion, unfloored health, and the
# mob cast guard. Local runs require `ephemeral:`.
#
# READ THIS FIRST, TESTER: exhaustion currently costs a DEFENDER nothing. The
# skill-term penalty lands in U8. If an out-of-breath character defends just as
# well as a rested one, that is the expected temporary state, not a bug. Report
# how it FEELS, but do not treat it as a defect and do not tune against it.
#
# HOW TO ACTUALLY REACH ZERO STAMINA (learned the hard way, 2026-08-13 run):
#   * EVERY profile has a big stamina pool (fresh 405, early 425, mid 480,
#     admin 800), and picking "3) Veteran" in the creation flow gives ~429. So
#     there is no shortcut profile. Exhaustion has to be earned in a LONG fight.
#   * THE LEVER IS ENCUMBRANCE. This profile is seeded overloaded (see
#     overlays below): movement stamina cost is multiplied up to 5x and combat
#     swings are halved. Walk around and fight while loaded and stamina falls
#     fast. Unloaded, out-of-combat regen outruns movement cost and you GAIN
#     stamina by walking, which is the trap the first version of this file fell
#     into.
#   * Auto-attack also drains stamina EVERY ROUND without you sending anything.
#     Pick an opponent weak enough that you survive many rounds, then mostly
#     WAIT and read. Do not spam commands: the AI port allows only 3 per round
#     and silently drops the rest ("Command dropped -- AI rate limit").
#   * Recovery/temple rooms carry a regen bonus, so leave them before draining.
#   * Recovery/temple rooms carry a regen bonus ("Wounds close more easily").
#     Leave them before trying to reach the low band.
#   * The low band is narrow and that is the point: shipped defence costs are
#     dodge 1, parry 3, block 4, so the behaviour under test only appears
#     between roughly 0 and 3 stamina.
#
ephemeral:
  profile: early
  # Required whenever profile is set.
  #
  # NOT 5200 (the early profile's own roomid). 5200 is The Awakening Pool, which
  # sits BEHIND the Awakening Rite gate: until the rite is done, every movement
  # is refused with "The pool's stillness holds you where you stand ... The rite
  # comes first." A run started there cannot walk, so it cannot burn stamina,
  # and the symptom is silent -- stamina simply pins at max while the moves look
  # like they were sent. 462 (Thornwall City) is past the gate.
  #
  # If you ever do want to start at the pool, complete the rite first with
  # `ask hadwen begin`, or grant the rite's completion token via
  # overlays.set_quest_tokens.
  start_room: 462
  overlays:
    # EIGHT Heavy Weighted Stones (item 12, 15.0 each) = 120 weight.
    #
    # Eight is the arithmetic ceiling, not a taste call. StoreItem REFUSES any
    # store that would push carried weight past 2x carry capacity
    # (characters/inventory.go), and a refusal here does not degrade -- it fails
    # profile materialization and the container dies at boot with the bare
    # message "could not store item 12".
    #
    #   capacity        = strength 105 x CarryCapacityMultiplier 0.65 = 68.2
    #                     (that knob is ABSENT from config.yaml, so Go default)
    #   ceiling         = 68.2 x 2                                    = 136.4
    #   already carried = weapon 10002 (6.0) + potion 30036 (0.3)     =   6.3
    #   room for stones = 130.1  ->  8 stones (120.0) fits, 9 (135.0) does not
    #
    # At 126.3 carried against 68.2 capacity the encumbrance multiplier is ~4.4
    # of its 5.0 ceiling and combat swings are halved, which is what makes the
    # 0-3 stamina band reachable inside one session. Drop stones to climb back
    # out. Recount this if the early profile's kit ever changes.
    grant_items: [12, 12, 12, 12, 12, 12, 12, 12]
  budgets:
    wall_clock: 60m

goals:
  - >-
    Fight to exhaustion. Take a real fight long enough that your stamina
    reaches zero and keep fighting. Defences must still fire. Read every
    combat line: does the defence text name the right thing (block, parry,
    dodge) rather than always saying dodge? Does anything read as though
    you defended for free in a way that feels wrong?
  - >-
    Prone recovery and flee. Get knocked down at low stamina. You should
    stand back up on your own within a few rounds without spending
    anything. Confirm that. Then at zero stamina confirm flee ALWAYS
    works and never refuses. Note whether the fleeing character arrives
    in the next room still prone, and whether that reads as a bug.
  - >-
    Grenade self-fumble. Throw an explosive repeatedly at low health until
    one backfires onto you. The moment it does, read the prompt, the status
    sheet, and any client health bar. None of them may show a negative
    number or a missing or wrong health colour.
  - >-
    Kill mobs with poison, with bleed, and with a thrown explosive. Watch
    the enemy health readout in the web client for the round in which each
    dies. It must never show a negative number.
  - >-
    Drain a spellcasting creature's conviction over a long fight. It must
    stop casting cleanly, must never narrate a spell it cannot cast, and
    must not lock itself out of its other special moves afterwards. Note
    whether caster mobs seem to cast MORE often than you remember.
  - >-
    Player caster runs dry mid-spell. Begin a multi-fold spell with barely
    enough conviction and let it run out. Read what happens to the spell,
    to the conviction already spent, and to your round.
  - >-
    Mutation special move at low stamina. Attempt one you cannot afford.
    It must refuse with a clear message AND must not consume the shared
    special-move cooldown. Immediately try a different special move to
    confirm the slot is still free.
  - >-
    General adversarial pass: anything that reads wrong, renders oddly, or
    contradicts its own help text is a finding.
