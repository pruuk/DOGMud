# GAP COMPRESSION gate, VETERAN pass, run from the Rift Chamber.
#
# YOU START NEXT TO SABLE, THE RIFTKEEPER, AND YOU HAVE GOLD. That is the whole
# fixture and it is why this file exists. Sable sells rifts into instanced
# zones, and THE GOLD YOU PAY IS THE DIFFICULTY DIAL: the monsters inside are
# scaled by the amount you invest. So you can order up a weakling, an even
# match, or something that will kill you, on demand, and repeat it. Do not
# wander the overworld hunting for a fixture. Buy one.
#
#   ask sable portals          - she lists what she can reach
#   ask sable arena 150        - opens a rift, charges 150 gold
#   ask sable oasis 1300       - same, far more dangerous
#
# Minimum is 100 gold. You have roughly 1400 on you and more in the bank. A
# portal lasts about 30 real minutes. Inside the oasis, ordinary monsters scale
# with your gold, the sand and storm elementals are twice that, and the royalty
# are four times that. So one oasis at 1300 gold contains a whole difficulty
# ladder at once, from things beneath you to things far above you.
#
# SUGGESTED LADDER (adapt if the numbers feel off):
#   arena 100-150   -> you should massively outclass it. THE HEADLINE TEST.
#   arena 400-600   -> should feel like a real fight.
#   oasis 1300      -> the royalty should outclass YOU.
#
# WHAT CHANGED, two things that ship together.
#   1. When one fighter outclasses another, the gap between them is COMPRESSED
#      before the dice are rolled. A big advantage still wins most exchanges,
#      but it no longer produces an unbroken run of devastating blows.
#      Devastating blows ignore armour entirely, which is why a constant stream
#      of them was making armour meaningless.
#   2. Specialist monsters (brawlers, spellcasters) now spread their talents
#      more evenly. A spellcaster used to be so single minded it could barely
#      dodge a punch. They keep their speciality; they are just no longer
#      helpless outside it.
#
# WHAT CORRECT LOOKS LIKE.
#   * Against something far below you: you land most swings, but the DEVASTATING
#     ones are occasional, not routine. Ordinary hits and glancing blows should
#     be the bulk of what you read.
#   * An even fight should feel EXACTLY as it did before. Compression only
#     touches mismatches. If a fight against something your own size feels
#     different, that is a finding.
#   * Being outclassed yourself should be survivable for longer than it was.
#   * Damage and durations are words, never numbers.
#
# WHAT TO WATCH FOR AS A DEFECT.
#   * Fights against weak things dragging on so long they are boring.
#   * Devastating blows so rare you never see one.
#   * A whiff-fest: lots of misses against something obviously beneath you.
#
# KNOWN NON-BUGS, do not refile: hidden mobs answer "You attack the darkness!";
# corpses persist and can shadow a live mob of the same name; consider calls
# walkovers even; behaviour and AI gaps are a separate scheduled arc. 3 commands
# per round on the AI port and the overflow is silently dropped after being
# echoed. Read every line.

ephemeral:
  profile: veteran
  start_room: 5000
  budgets:
    wall_clock: 45m

goals:
  - >-
    OPEN A RIFT FIRST. Before anything else, confirm the fixture works: ask
    sable portals, then buy a cheap arena rift and step through. Report exactly
    what she says and whether the exit appears. If you cannot get a rift open,
    say so immediately and loudly, because every goal below depends on it and a
    report without it is worthless.
  - >-
    CRUSHING A WEAKLING (headline). In a cheap rift (100-150 gold) fight the
    monsters repeatedly. Tally, explicitly and by count: swings landed, swings
    missed or turned aside, and swings described as devastating or critical. You
    want at least thirty swings before you report. Devastating blows should be a
    minority of your hits, not most of them. If nearly every hit still reads as
    devastating, the headline change is not working and that is the finding.
  - >-
    AN EVEN FIGHT IS UNCHANGED. Buy a rift priced so the monsters are a genuine
    match for you, and fight. This must feel the same as it always has.
    Compression only touches mismatches, so a changed even fight would mean it
    is leaking where it must not. Report the round by round texture and say
    plainly whether anything reads as altered.
  - >-
    BEING THE UNDERDOG. Spend big (an oasis around 1300 gold) and pick a fight
    with the royalty, which scale to four times what you paid. Do you survive
    noticeably longer than you would expect? Does the enemy still land
    devastating blows on you, and how often? Count rounds until you must flee.
    This is the same change seen from the other side and it matters as much.
  - >-
    THE DIAL ITSELF. Across the rifts you buy, does paying more actually produce
    a harder fight, smoothly? If a 600 gold rift feels no different from a 150
    gold one, or if the jump is wildly out of proportion, report it with the
    gold amounts. Getting stronger, or paying more, must never make things
    easier.
  - >-
    STEALING FROM A WEAK MARK. Steal is decided by the same contest that combat
    uses, so compression reaches it. In a cheap rift, steal repeatedly and count
    successes against failures. A skilled thief robbing a helpless mark should
    still usually succeed. If stealing from something pathetic now fails often,
    that is a real finding, quote the lines.
  - >-
    SNEAKING PAST WEAK EYES. Sneak repeatedly through rooms holding weak
    creatures and count how often you are spotted. Same reasoning as steal. Try
    it in a room with SEVERAL creatures too: each watcher is rolled separately,
    so if the change compounds it will show up there first and worst.
  - >-
    FLEEING FROM SOMETHING WEAK. Start a fight in a cheap rift and flee.
    Fleeing from a weak enemy should be near certain. Then do it again with
    SEVERAL enemies on you, because each blocker is rolled separately and any
    single failure aborts the escape. Count attempts against escapes for both.
    If you get stuck in a fight you could win trivially, that is a finding.
  - >-
    SPECIALIST MONSTERS. Fight a spellcaster type and a brawler type and
    describe how each behaves. The caster should still cast and still hurt, but
    should no longer be trivially easy to hit. The brawler should still hit
    hard. If either has lost its identity and now feels generic, say so. Note
    anything that seems unable to do its job at all.
